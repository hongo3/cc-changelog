 session that the side bar already brought to this machine opening it again in a new tab; the side bar is shown instead","I","fix",1,"ide",0,[]],[91,"[VSCode] サイドバーの Web タブに読み込み後に開始したクラウドセッションも載り、読み込み失敗時は「Remote server is not connected」と表示される","[VSCode] Fixed the side bar's Web tab not listing cloud sessions started after the window loaded; a failed load now says \"Remote server is not connected\" instead of \"No web sessions yet\"","I","fix",1,"ide",0,[]],[92,"[VSCode] リロード後に復元されたタブが、サイドバーで開いている会話に 2 つ目の Claude プロセスを起動せず「still open somewhere else」を表示する","[VSCode] Fixed a tab restored after a reload starting a second Claude process on a conversation the side bar already has open; it now shows the \"still open somewhere else\" notice","I","fix",1,"ide",0,[]],[93,"[VSCode] ツール行のファイルリンク、セッション一覧のリンク、2 つのヒントがリンクとして表示される","[VSCode] Fixed tool-row file links, session-list links and two hints showing in plain text","I","fix",1,"ide",0,[]],[94,"[VSCode] バックグラウンドエージェントの実行中コマンドが、メインターン終了後に失敗表示にならない","[VSCode] Fixed a background agent's still-running command showing as failed once the main turn ended","I","fix",1,"ide",0,[]],[95,"[VSCode] コマンドメニューから選んだ自分の `/usage` や `/context` が拡張のダイアログではなく実行される","[VSCode] Fixed a user's own `/usage` or `/context` command opening the extension's dialog instead of running when picked from the command menu","I","fix",1,"ide",0,[]],[96,"[VSCode] プラン preview タブのファイルリンクをクリックすると、チャット返信内リンクと同様にファイルが開く","[VSCode] Fixed file links in the plan preview tab doing nothing when clicked; they now open the file like links in chat replies","I","fix",1,"ide",0,[]],[97,"[VSCode] WSL などリモートホストで、ツール入出力をエディタタブで開く際の「Timeout waiting after 1000ms」失敗が起きない","[VSCode] Fixed opening a tool's input or output in an editor tab failing with \"Timeout waiting after 1000ms\" on remote hosts such as WSL when the tab is slow to appear","I","fix",1,"ide",0,[]],[98,"[VSCode] Manage plugins ダイアログで、marketplace の追加・削除・更新の失敗理由が表示される","[VSCode] Improved the Manage plugins dialog: a failed marketplace add, remove or refresh now says what went wrong","I","improve",1,"ide",0,[]],[99,"[VSCode] Claude in Chrome の「Enabled by default」スイッチがエディタ自身のセッションにも接続を有効にする（ブラウザ操作前の確認は従来通り）","[VSCode] Changed the Claude in Chrome \"Enabled by default\" switch to also connect the editor's own sessions, which still ask before browser actions","I","change",2,"ide",0,[]],[100,"クラウドセッションで、GitHub が新発行のアクセストークンを一時的に拒否しても fetch/push が失敗しにくい","[Cloud sessions] Fixed occasional failures to fetch from or push to GitHub when GitHub briefly refused a newly issued access token","I","fix",2,"cloud",0,[]],[101,"[Claude Tag] GitHub 活動などのバックグラウンドイベントで起動しても、誰も返信を待っていない Slack スレッドに支出上限などの失敗警告を投稿しない","[Claude Tag] Fixed Claude posting a failure warning, such as a spend limit notice, in a Slack thread when a background event like GitHub activity woke it and nobody was waiting on a reply","I","fix",1,"cloud",0,[]],[102,"[Claude Tag] 管理設定の支出上限ページが、チャンネルの多い組織でも新規作成/プライベートチャンネルを表示する","[Claude Tag] Fixed Claude Tag's spend limits page in admin settings leaving out recently created and private channels in organizations with many channels","I","fix",1,"cloud,admin",0,[]],[103,"[Claude Tag] 長い Slack スレッドで、バックグラウンド作業がタスクリストを新規メッセージとして再投稿せず、通知が飛ばない","[Claude Tag] Improved Claude's task list in long Slack threads: background work no longer reposts it as a new message on its own, so people following the thread aren't notified","I","improve",1,"cloud",0,[]],[104,"[Code Review] 指摘コメントと「Why this was flagged」が文の途中で切れず、完結した文で終わる","[Code Review] Fixed finding comments and their \"Why this was flagged\" text stopping mid-sentence; they now end on a complete sentence","I","fix",1,"cloud",0,[]],[105,"[Code Review] 前コミットで 2 回失敗したレビューのあと新規 push があっても PR をスキップせず、最新コミットをレビューする","[Code Review] Fixed Code Review skipping a pull request after a new push when its review had failed twice on the previous commit; it now reviews the latest commit","I","fix",2,"cloud",0,[]],[106,"[Code Review] 会話がロックされた PR の失敗レビューカードが、ロックが原因で投稿も課金もないことを示す","[Code Review] Improved the failed-review card on a pull request whose conversation is locked: it now says the lock blocked the review and that nothing was posted or charged","I","improve",1,"cloud",0,[]]]},{"v":"2.1.286","date":"2026-10-01（木）02:14","dshort":"10-01 02:14","nb":3,"head":"機密マスキング強化とモデル拒否時の再試行を中心とした修正リリース","sum":"v2.1.286 は修正が中心で、ログやエラーメッセージへの機密情報の露出を防ぐ修正と、認証・セッション復元・Remote Control の不具合修正が多く含まれます。`--bare` の挙動変更、plugin インストールの制限、API リトライ上限の変更など、動作が変わる点もあります。VS Code 拡張と cloud sessions、Claude Tag にも多数の変更があります。","watch":[{"b":"`--bare` はコマンドラインで指定した MCP server のみ接続し、system reminder を送らず、バックグラウンドタスクも開始しません。timeout した shell コマンドは停止するため、これらに依存するスクリプトは確認してください。","r":[55]},{"b":"plugin のインストールは git リポジトリやフォルダを指す npm ソースを拒否し、依存関係も registry パッケージからのみ入れます。該当する plugin は registry で公開されたものに切り替えてください。","r":[58]},{"b":"失敗した API リクエストの再試行上限が、モデル呼び出し全体で一つになりました。既定設定では失敗する呼び出しで最大 14 リクエストを送るため、リトライ回数を前提にした運用は見直してください。","r":[54]},{"b":"send-now キー（ctrl+enter）は、skill の shell コマンドを終了せずバックグラウンドへ移します。コマンドを止める目的で使っていた場合は別の方法に切り替えてください。","r":[56]},{"b":"テーマと output style のピッカーでは数字キーによる選択ができなくなりました。矢印キーなどで選んでください。","r":[48,62]},{"b":"VS Code 拡張では Stop と Escape が現在のターンだけを終了し、background agent は動き続けます。止めるには agent map から個別に停止してください。","r":[75]}],"hl":[{"t":"機密情報のマスク漏れ修正","b":"MCP エラーメッセージ、Bearer トークン、ゼロ幅文字を含むキー名、記号を含む URL パスワードなどで、値の一部が露出する問題を修正しました。ログと transcript が対象です。","r":[17,18,19,20]},{"t":"モデル拒否時に前世代で再試行","b":"API が既定モデルやエイリアス先のモデルを拒否すると毎ターン失敗していましたが、同じ tier の一つ前のモデルで一度再試行します。fallback が高速モードで動かせない場合は標準速度で実行します。","r":[9,11]},{"t":"セッション復元とAPI 400の修正","b":"並列ツール呼び出し後にクラッシュした場合、`--resume` と `--continue` でその後のターンが失われる問題を修正しました。ツールや hook がテキスト以外を返したときの API 400 エラーも修正しています。","r":[4,5]},{"t":"認証まわりの不具合修正","b":"認証更新の期限切れ時に複数のプロセスがログイン用ブラウザを開く問題や、macOS で `/login` 後も「Not logged in」と表示される問題を修正しました。`claude auth status` は Console のサインインを `api_key` と報告します。","r":[3,8,13]},{"t":"`--bare` と plugin 導入の制限","b":"`--bare` は接続する MCP server、system reminder、バックグラウンドタスクを絞る挙動に変わりました。plugin のインストールは、git リポジトリやフォルダを指す npm ソースを拒否します。","r":[55,58]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"WebFetch の artifact 読み取りの確認動作が Artifact tool に揃いました。permission prompt の見た目が file edit に統一され、機密マスキングの漏れも複数修正されています。send-now キーの挙動と WebFetch のレート制限エラー文言も変わりました。","refs":[18,19,20,42,43,44,56,57]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"subagent まわりの修正が中心です。task 系ツールの欠落、Workflow の再起動、`/compact` などが main conversation に作用する問題などを直しました。send now は subagent の実行中コマンドをバックグラウンドへ移します。","refs":[26,27,28,29,30,31,32,40,41]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"plugin の読み込み失敗の説明が具体的になり、claude.ai で有効な plugin が消える問題も修正されました。`/hooks` は設定済み hook を event ごとの一覧で開きます。`verify` という名前の skill があれば、commit 前の実行が案内されます。","refs":[25,37,38,39,49,58,61,64]},{"a":"S","name":"セッション・履歴・圧縮","dg":"`--resume` と `--continue` でターンが失われる問題と、`/feedback` の zip に不正な JSON 行が入る問題を修正しました。","refs":[4,21]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP 関連のエラーメッセージでの認証情報の露出を修正しました。古い handshake を落とした server でツールが表示されない問題や、サインインリンクが無効になる問題も直しています。","refs":[12,17,22,23,24]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VS Code 拡張にブックマーク、質問と回答の表示、選択肢のプレビューが加わりました。Remote Control と cloud sessions では切断・未配信・未応答などの不具合を修正しています。Claude Tag では spend limits ページの機能追加と Slack 連携の修正があります。","refs":[6,10,15,16,36,67,68,69,70,71,72,73,74,75,76,77,78,79,80,81,82,83,84,85,86,87,88]},{"a":"H","name":"headless・SDK・API","dg":"API の再試行上限と `--bare` の挙動が変わりました。ツールや hook が非テキストを返したときの API 400 と、gateway の spend meter の計算誤りも修正されています。","refs":[5,7,51,52,54,55]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"モデルが拒否された場合や `--fallback-model` の再試行が、より確実に動作するようになりました。fallback で context window が 1M から 200K に縮むときは、通知に明記されます。","refs":[9,11,33,50]},{"a":"U","name":"UI・表示・入力","dg":"fullscreen のリスト操作（マウス、スクロールバー、列揃え）と、各種ピッカーの見た目が改善されました。permission prompt に「2 of 5」のような件数が表示され、外部エディタは cursor の行で開きます。","refs":[1,2,14,34,35,45,46,47,48,53,59,60,62,65]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"認証の期限切れ時や `/login` 後の表示に関する不具合を修正しました。`/exit` の Remove worktree は、起動した server や shell を止めてから実行されます。","refs":[3,8,13,63,66]}],"skip":"表示の乱れ、文言の調整、特定環境や管理画面での軽微な不具合の修正が約 30 件あります。","st":"ok","stale":false,"e":[[1,"複数の権限リクエストが重なると権限プロンプトに「2 of 5」のような件数を表示","Added a count such as \"2 of 5\" to the permission prompt when several permission requests stack up","U","new",2,"cli",0,[]],[2,"フルスクリーンのリストの「N more」行をクリックでき、その端へジャンプする（hover・押下状態付き）","Added mouse support for the \"N more\" rows of lists in fullscreen mode: click one to jump to that end of the list, with hover and pressed states","U","new",1,"cli",0,[]],[3,"`gcpAuthRefresh`/`awsAuthRefresh` の資格情報期限切れ時に、複数プロセスや IDE 拡張がそれぞれログイン用ブラウザを開かない","Fixed several Claude Code processes and IDE extensions each opening a login browser when gcpAuthRefresh or awsAuthRefresh credentials expire","O","fix",2,"cli,ide",0,[]],[4,"前のセッションがクラッシュや強制終了した後でも、`--resume`/`--continue` が並列ツール呼び出し後のターンを失わない","Fixed `claude --resume` and `--continue` sometimes losing every turn after a batch of parallel tool calls when the earlier session crashed or was killed","S","fix",2,"cli",0,[]],[5,"ツールや hook が文字列以外（オブジェクト・数値・真偽値）を返しても API 400 エラーにならない（再開セッションも含む）","Fixed API 400 errors after a tool or hook returned an object, number or boolean instead of text, including in resumed sessions","H","fix",2,"cli,sdk",0,[]],[6,"履歴が非常に大きい cloud セッションが、transcript 読み込み中にコンテナ停止されず正常に起動する","Fixed cloud sessions with very large histories never waking up because the container was stopped while the transcript was still loading","I","fix",2,"cloud",0,[]],[7,"Claude apps gateway の支出メーターが 1 時間プロンプトキャッシュ書き込みを正しい単価で計算し、サーバーツール利用時の入力トークンも全呼び出し分を数える","Fixed the Claude apps gateway's spend meter pricing 1-hour prompt cache writes at the cheaper 5-minute rate, and counting only the first model call's input tokens on streamed turns that run a server-side tool such as web search","H","fix",2,"admin,sdk",0,[]],[8,"古い `~/.claude/.credentials.json` が残っていても、別ウィンドウで `/login` 成功後に「Not logged in」「Login expired」が出続けない","Fixed macOS sessions still showing \"Not logged in\" or \"Login expired\" after `/login` succeeds in another Claude Code window when a leftover `~/.claude/.credentials.json` exists","O","fix",2,"macos",0,[]],[9,"既定モデルやエイリアスの解決先を API が拒否しても、同ティアの一つ前のモデルで 1 回再試行してターン失敗を防ぐ","Fixed every turn failing when the Anthropic API refuses the model your default or a model alias resolves to: Claude Code now retries once on the previous model of the same tier","L","fix",3,"cli",0,[]],[10,"組織ポリシーで Remote Control が無効化されたら、`claude remote-control` を含むセッションが通知付きで切断される","Fixed Remote Control sessions (including `claude remote-control`) staying connected after your organization's policy turns Remote Control off; they now disconnect with a notice","I","fix",2,"cloud,admin",0,[]],[11,"拒否や `--fallback-model` の再試行で fast が使えない場合、標準速度で実行し対話セッションでは 1 回だけ通知する","Fixed refusal and `--fallback-model` retries failing when the fallback model can't run fast; they now run at standard speed, with a one-time notice in interactive sessions","L","fix",2,"cli",0,[]],[12,"MCP discovery cache 有効時、再認証成功後に headless セッションが「MCP servers require authentication」リマインダーを繰り返さない","Fixed headless sessions repeating the \"MCP servers require authentication\" reminder after a successful re-authentication when the MCP discovery cache is enabled","C","fix",1,"sdk",0,[]],[13,"`claude auth status` が Console サインインの API キーを `api_key` と報告し、VS Code 拡張も API キーセッションとして扱う","Fixed `claude auth status` reporting a Console sign-in's stored API key as `claude.ai`; it now reports `api_key`, and the VS Code extension treats that session as an API key session","O","fix",2,"cli,ide",0,[]],[14,"`/status` が API キーと併存する Anthropic プロファイルを「使用されていない」と表示する","Fixed `/status` listing an Anthropic profile beside an API key as if both were in effect; the profile is now marked as not in use","U","fix",1,"cli",0,[]],[15,"Remote Control で添付ファイルが届かなかった場合に Claude へ伝え、最後のダウンロード試行が 10 秒しか与えられない問題も解消","Fixed Claude not being told when a file attached to a message sent over Remote Control did not ] 支出上限ページに Add channel ボタンが追加され、チャンネル ID か Slack リンクから非公開チャンネルにも上限を設定できる","[Claude Tag] Added an Add channel button to Claude Tag's spend limits page in admin settings, so a limit can be set on any channel, including a private one, from its channel ID or Slack link","I","new",2,"cloud,admin",0,[]],[84,"[Claude Tag] 既定の Sonnet モデルを使えない組織でも、メモリ想起が結果を返す","[Claude Tag] Fixed memory recall finding nothing in organizations that cannot use the default Sonnet model","I","fix",2,"cloud,admin",0,[]],[85,"[Claude Tag] Enterprise Grid 管理者が別ワークスペースへ移した Slack チャンネルが、Claude 設定を失わない","[Claude Tag] Fixed a Slack channel losing its Claude settings when an Enterprise Grid admin moves it to another workspace and the first post afterward doesn't mention Claude","I","fix",2,"cloud,admin",0,[]],[86,"[Claude Tag] Slack スレッドで Claude の質問に答えたとき、新しいマシンで最初からやり直して未 push の作業を失わない","[Claude Tag] Fixed Claude in a Slack thread occasionally starting over on a fresh machine, losing work it hadn't pushed, when your reply answered a question it had just asked","I","fix",2,"cloud",0,[]],[87,"[Claude Tag] 大規模組織でも、支出上限ページの公開チャンネル名が生の Slack ID でなく名前で表示される","[Claude Tag] Fixed public channel names on Claude Tag's spend limits page in admin settings showing as raw Slack IDs in larger organizations","I","fix",1,"cloud,admin",0,[]],[88,"[Claude Tag] Slack 起点セッションの claude.ai 上のタイトルが、Slack ユーザー ID やエスケープコードなしの入力文になる","[Claude Tag] Improved the titles of sessions started from Slack as shown on claude.ai: they now read as the words you typed, without Slack user IDs or escape codes","I","improve",1,"cloud",0,[]]]},{"v":"2.1.285","date":"2026-09-30（水）02:32","dshort":"09-30 02:32","nb":10,"head":"権限・サンドボックス修正と各種設定の既定値変更が中心","sum":"v2.1.285 は Artifact ツール、`/ultrareview`、サンドボックス、PowerShell の権限判定まわりのセキュリティ修正が中心です。あわせて、バックグラウンドコマンドの時間制限、`claude -p` の auto mode 起動、カスタム `ANTHROPIC_BASE_URL` での 1M コンテキスト利用など、既定値の変更が複数あります。管理者向けには `allowedProviders` が追加され、VS Code 拡張と Remote Control にも多くの修正があります。","watch":[{"b":"バックグラウンドの Bash/PowerShell コマンドが既定 30 分で停止するため、長時間実行するものは `timeout`（最大 2 時間）を明示すること。","r":[85]},{"b":"`claude -p` と Python Agent SDK がサードパーティプロバイダー／テレメトリー無効時に auto mode で始まるため、従来の挙動が必要なら `--permission-mode` を指定すること。","r":[91]},{"b":"カスタム `ANTHROPIC_BASE_URL` で対応モデルが 1M コンテキストを使うようになったため、ゲートウェイが 200K までなら `/autocompact 200k` を実行すること。","r":[87]},{"b":"プロジェクト設定では sandbox の管理者要件を緩められなくなったため、必要な変更は管理設定側で行うこと。","r":[104]},{"b":"クラウドセッションとセルフホストランナーでは MCP サーバー名 `widgets`（`widgets_` などの近い綴りも）が予約され読み込まれないため、リネームすること。","r":[93]},{"b":"Windows のプロジェクト／ローカル設定の `env` で `ALLUSERSPROFILE`、`SystemDrive`、`CommonProgramFiles` 系を設定できなくなったため、ユーザー設定か管理設定に移すこと。","r":[95]},{"b":"Team/Enterprise など、プランを判別できないセッションで起動時に組織ポリシーを読めなかった場合、読み込めるまで WebFetch が使えないため、ポリシー取得の失敗要因を確認すること。","r":[88]},{"b":"`/ultrareview` は macOS/Linux で git 2.31 以上が必要になり、`--separate-git-dir` のチェックアウトや symbolic ref のブランチは拒否されるため、該当する場合は構成を見直すこと。","r":[94,97,99]},{"b":"`claude mcp get` はプラグイン提供の stdio MCP サーバーのコマンド・引数・環境変数の値を表示しなくなったため、値の確認はプラグイン側で行うこと。","r":[101]},{"b":"バックグラウンドセッションや Claude Code 自身のツールが起動したセッションから /memory で Auto-memory をオンにできなくなったため、通常のセッションで設定すること。","r":[89]},{"b":"`/config chrome=true` は有効化せず /config パネルへ誘導するため、Claude in Chrome の有効化はパネルから行うこと。","r":[103]},{"b":"`/claude-api` は Remote Control クライアントから実行できなくなったため、ローカルのセッションで実行すること。","r":[102]}],"hl":[{"t":"権限判定の抜けを修正","b":"PowerShell ツールのパーサー起動失敗時に deny/ask ルールが飛ばされる問題と、`Artifact` の allow ルールが作業ディレクトリ外のファイルを無確認で公開する問題を修正しました。auto mode が Artifact の一部操作で classifier を飛ばす問題も直っています。","r":[46,37,40]},{"t":"サンドボックス設定の保護強化","b":"プロジェクト設定で、管理者が必須とした sandbox の緩和・無効化、管理側 deny list のプロキシ差し替え、strict allowlist の拡張、managed read-deny の再許可ができなくなりました。","r":[104]},{"t":"`/ultrareview` の漏えい対策","b":"コロンを含む名前の credential ファイル（例: `server:8443.key`）の未コミット変更がアップロードされる問題を修正しました。credential ファイル判定の見落としも直り、git 2.31 以上の要件など macOS/Linux のアップロード条件も変わりました。","r":[44,47,97]},{"t":"バックグラウンドコマンドに時間制限","b":"バックグラウンドの Bash/PowerShell コマンドは、`timeout` 指定（既定 30 分、最大 2 時間）で停止するようになりました。停止時は Claude に通知されます。","r":[85]},{"t":"`claude -p` の auto mode 起動","b":"サードパーティプロバイダーまたはテレメトリー無効の `claude -p` と Python Agent SDK は、権限モード未設定なら auto mode で起動します。`--permission-mode` で上書きできます。","r":[91]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"Artifact ツール、PowerShell、sandbox auto-allow、URL パスワードの伏せ字処理など、権限判定とツール安全性の修正が多数あります。background コマンドの時間制限と WebFetch の保留条件が変わり、`CLAUDE_CODE_DISABLE_WEB_FETCH` も追加されました。","refs":[1,9,14,19,31,36,37,39,40,43,44,46,48,62,67,73,78,81,85,88,90,104]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"fork subagent が親の plan mode や `dontAsk` を引き継ぎ、auto mode の subagent は報告後すぐ終了します。`claude agents` からの返信が権限プロンプトを誤承認する問題も修正されました。`/tasks` は内部のバックグラウンド作業を「System tasks」にまとめます。","refs":[7,20,22,29,58,59,76,96]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"`claude plugin configure` と `claude plugin install --config` の拡張が入り、`.mcpb` サーバーの設定漏れも明示されます。SSH 設定の無視やキャッシュ衝突など plugin/marketplace のインストール修正、`/ultrareview` のアップロード修正も含まれます。","refs":[3,4,8,11,25,26,30,35,41,42,47,51,53,56,63,64,71,72,102]},{"a":"S","name":"セッション・履歴・圧縮","dg":"圧縮や resume が壊れた transcript で失敗する問題を修正しました。バックグラウンドで動作中のセッションを `/resume` で開けるようになり、Auto-memory のオン操作には制限がかかります。","refs":[52,54,80,89]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"`claude mcp list`/`get` の表示漏れとエスケープシーケンスの混入を修正し、ws サーバーも一覧に出ます。`widgets` 名の予約、`alwaysLoad` の扱い、プラグイン提供サーバーの値非表示といった変更もあります。","refs":[16,18,60,61,69,84,93,101,103]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"Remote Control、クラウドセッション、`/ultrareview`、Code Review、Claude Tag、VS Code 拡張の修正が大半を占めます。`claude --desktop` が追加され、VS Code ではプラグイン管理とセッション復元が改善されました。","refs":[2,10,12,21,23,24,27,34,57,74,75,86,94,97,98,99,105,106,107,108,109,110,111,112,113,114,115,116,117,118,119,120,121,122,123,124,125,126,127,128,129,130,131,132,133,134,135,136]},{"a":"H","name":"headless・SDK・API","dg":"`allowedProviders` が追加され、Bedrock/Vertex の起動時モデル確認や再試行の挙動が改善されました。API リトライ回数の削減、content filter 応答の即時表示、`-p` の auto mode 既定化も含まれます。","refs":[5,6,17,28,33,50,68,70,77,79,83,91,92,100]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"`set_model` による切り替え後の出力トークン上限と auto-compact window、`/cost` のモデル帰属を修正しました。カスタム `ANTHROPIC_BASE_URL` では 1M コンテキストが使われます。","refs":[13,38,87]},{"a":"U","name":"UI・表示・入力","dg":"fullscreen の ctrl+o transcript や長いセッションでの固まり、vim mode のプレースホルダー破損、`\u0026nbsp;` の表示を修正しました。","refs":[32,49,65,66,82]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"SSH プロンプトによる端末の占有、ログイン更新ロックの競合、サインインの無限待ちを修正しました。Windows では設定 `env` の一部変数が使えなくなります。","refs":[15,45,55,95]}],"skip":"表示の乱れ、まれな環境での不具合、VS Code 拡張の細かな状態表示や復元まわりの修正が合わせて 80 件以上あります。","st":"ok","stale":false,"e":[[1,"`CLAUDE_CODE_DISABLE_WEB_FETCH` 環境変数で WebFetch ツールを無効化できる","Added `CLAUDE_CODE_DISABLE_WEB_FETCH` environment variable to turn off the WebFetch tool","T","new",1,"cli,admin",0,[]],[2,"`claude --desktop` で現在のディレクトリや `--continue` / `--resume \u003cid\u003e` のセッションを Desktop アプリで開く","Added `claude --desktop` to open the Claude desktop app on the current directory, or on a session with `--continue` / `--resume \u003cid\u003e`","I","new",2,"cli,ide",0,[]],[3,"`claude plugin configure \u003cplugin\u003e` でプラグインのオプションと未設定項目を表示し、`--values-stdin` で値を保存できる","Added `claude plugin configure \u003cplugin\u003e` to show a plugin's options and which are unset, or save new values read from stdin with `--values-stdin`","M","new",2,"cli,mod-dev",0,[]],[4,"`claude plugin install --config` が `\u003cserver\u003e.\u003ckey\u003e=\u003cvalue\u003e` を受け付け、同梱 `.mcpb` MCP サーバーを導入時に設定できる","Added `\u003cserver\u003e.\u003ckey\u003e=\u003cvalue\u003e` to `claude plugin install --config`, so a bundled `.mcpb` MCP server's own settings can be set at install time and it starts without visiting `/plugin` → Configure","M","new",2,"cli,mod-dev",0,[]],[5,"managed setting `allowedProviders` でマシンが使える API プロバイダーを制限できる","Added `allowedProviders` managed setting to limit which API providers a machine may use (Anthropic API, a custom endpoint, Bedrock, Mantle, Vertex AI, Foundry, Claude Platform on AWS, or a Cloud gateway)","H","new",2,"admin",0,[]],[6,"`CLAUDE_CODE_NONSTREAMING_TIMEOUT_RETRIES` で非ストリーミングのフォールバック再送回数に上限を設けられる","Added `CLAUDE_CODE_NONSTREAMING_TIMEOUT_RETRIES` environment variable to cap re-sends of a non-streaming fallback request that timed out","H","new",1,"sdk",0,[]],[7,"`CLAUDE_CODE_FORK_SUBAGENT=1` の `claude -p` で、サブエージェント自身の Agent 呼び出しがフォアグラウンドで動き結果を受け取れる","Fixed `claude -p` with `CLAUDE_CODE_FORK_SUBAGENT=1`: a subagent's own Agent call now runs in the foreground, so the subagent gets the child's result","A","fix",1,"sdk",0,[]],[8,"SSH 経由のプラグイン・マーケットプレイスの導入と更新が `GIT_SSH` や `core.sshCommand` の指定を使う","Fixed plugin and marketplace installs and updates over SSH ignoring the ssh program set in `GIT_SSH` or in your git config's `core.sshCommand`","M","fix",2,"cli",0,[]],[9,"OS が managed settings の読み取りを拒否しても警告のうえ起動し、そのファイルのポリシー無しで動く","Fixed Claude Code refusing to start when the OS denies reading the managed settings file; it now warns and starts without that file's policies. Other read errors and unparseable files stop every session","T","fix",2,"cli,admin",0,[]],[10,"compaction 後に再起動したクラウドセッションでも、既読・公開済み artifact の次の更新が通る","Fixed cloud sessions that restarted after their conversation was compacted refusing the next update to an artifact the session had already read or published","I","fix",1,"cloud",0,[]],[11,"`claude plugin disable` / `enable` に `name@marketplace` を渡しても、大文字小文字違いの別エントリでなく導入済みプラグインを変更する","Fixed `claude plugin disable` and `enable` with a full `name@marketplace` id changing a settings entry in another letter case instead of the installed plugin's own","M","fix",1,"cli",0,[]],[12,"Remote Control で送った添付が、ダウンロード失敗1回で欠落せず最大2回まで再試行される","Fixed files attached to a message sent over Remote Control being left out after a single failed download; a network error, timeout or server error is now retried up to twice","I","fix",1,"cloud",0,[]],[13,"`set_model` でモデルを切り替えると、出力トークン上限と自動 compact ウィンドウも新モデルに合う","Fixed switching models mid-session with a `set_model` request (such as the Agent SDK's `setModel`) leaving the new model on the built-in output-token limit and auto-compact window until restart","L","fix",2,"sdk",0,[]],[14,"マスクされたログやトランスクリプトで、`@` を含む URL パスワードの一部や `%40` 表記のパスワード全体が見えなくなる","Fixed redacted logs and transcripts showing part of a URL password that contains `@`, or all of it when the URL writes its `@` as `%40`","T","fix",2,"cli,admin",0,[]],[15,"worktree や `/teleport` の fetch で SSH のパスフレーズ・新規ホスト確認がターミナルを奪わず、即座に失敗する","Fixed SSH passphrase and new-host prompts from worktree and `/teleport` fetches taking over the terminal; these fetches now fail fast instead of asking","O","fix",1,"cli",0,[]],[16,"SDK と `-p` セッションで途中追加した MCP サーバーをオフにすると、そのツールも使えなくなる","Fixed switching off an MCP server added mid-session in SDK and `-p` sessions leaving its tools available","C","fix",2,"sdk",0,[]],[17,"`claude -p --permission-prompt-tool` で、バックグラウンドサブエージェントの権限要求が自動拒否されずプロンプトツールに届く","Fixed `claude -p --permission-prompt-tool`: a background subagent's permission request now goes to the prompt tool instead of being auto-denied","H","fix",2,"sdk",0,[]],[18,"`claude mcp list` / `get` と `remove`・`login`・`logout` のエラーで、MCP サーバー名や値の改行・エスケープシーケンスが出力されない","Fixed `claude mcp list` and `claude mcp get`, and the not-found error of `claude mcp remove`, `login` and `logout`, printing line breaks and terminal escape sequences from MCP server names and values","C","fix",1,"cli",0,[]],[19,"サンドボックス自動許可が、`=` を含む `python3 -c` や `node -e` などのインラインスクリプトで毎回承認を求めない","Fixed sandbox auto-allow asking for approval on every run of many inline scripts (`python3 -c`, `node -e`) just because they contain `=`","T","fix",2,"cli",0,[]],[20,"フォークしたサブエージェントが親の権限モード（plan / `dontAsk`）で動き、plan mode を抜けられない","Fixed fork subagents not keeping the session's plan mode or `dontAsk` mode: a fork now runs under its parent's permission mode and cannot exit plan mode","A","fix",2,"cli",0,[]],[21,"`claude remote-control --help` の `--[no-]chrome` の説明が実際の挙動（`--chrome` なしでは Chrome 連携オフ）に合う","Fixed `claude remote-control --hel g fallback now shares the request's retry budget instead of getting a fresh set of retries","H","fix",2,"cli,sdk",0,[]],[69,"Claude in Chrome が PC 名を報告し、接続ブラウザを「Browser 1」等でなく PC 名で区別できる","Improved Claude in Chrome: the native host now reports your computer's name, so connected browsers can be labeled by computer instead of \"Browser 1\" / \"Browser 2\"","C","improve",1,"cli",0,[]],[70,"Bedrock/Vertex で既定モデルへのアクセスが外されても、同ランクの古いモデルに切り替えて継続する","Improved Bedrock and Vertex AI sessions to switch to an older available model of the same tier, instead of failing, when an admin removes access to the default model; session titles and summaries now fall back with it","H","improve",2,"sdk,admin",0,[]],[71,"plugin marketplace のエラーが、git アドレス拒否の理由を企業ポリシーでなく具体的に示す","Improved plugin marketplace errors to name why a git address is refused instead of citing enterprise policy","M","improve",1,"mod-dev",0,[]],[72,"plugin・marketplace・現リポジトリ remote の git URL の検証を改善","Improved validation of git URLs for plugins, marketplaces and the current repository's remote","M","improve",1,"mod-dev",0,[]],[73,"Artifact ツールの結果が、ページの作成・編集と同じ手順での公開を促し、往復を省ける","Improved Artifact tool results: they now suggest publishing in the same step as writing or editing the page, which can save a round trip","T","improve",1,"cli",0,[]],[74,"Remote Control で、Claude Desktop 等が持つセッションへの `/btw` が進行中のターンも参照する","Improved Remote Control: a `/btw` side question asked of a session hosted by an app such as Claude Desktop now sees the turn in progress, not only the last finished one","I","improve",1,"cloud",0,[]],[75,"BMP・HEIC・HEIF・AVIF・TIFF の画像を Claude Code が変換できる場合、Claude アプリにプレビューが出る","Improved pictures Claude sends as BMP, HEIC, HEIF, AVIF or TIFF files: the Claude apps now show a preview where Claude Code can convert them","I","improve",1,"ide,cloud",0,[]],[76,"auto mode のサブエージェントが、呼び出し元へ報告を返した時点で終了し、無駄なターンを使わない","Improved subagents in auto mode: a subagent's run now ends as soon as it hands its report back to its caller,  `_meta['anthropic/alwaysLoad']` to false stays deferred when its `--mcp-config`, Agent SDK or plugin server is set to `alwaysLoad`","C","change",1,"mod-dev",0,[]],[85,"バックグラウンドの Bash/PowerShell が時間制限（既定 30 分、最大 2 時間）で停止し、Claude に通知される","Changed background Bash and PowerShell commands to stop after a time limit (their `timeout` with `run_in_background`, default 30 min, max 2 h); Claude is notified when one is stopped","T","change",3,"cli",1,[]],[86,"`disableWorkflows` が有効でも Code Review の PR レビューと `/ultrareview` が動く（実行マシン側の管理者設定を除く）","Changed Code Review's pull request reviews and `/ultrareview` to run when `disableWorkflows` is on, unless the machine running the review has it set by its own administrator (MDM or the managed-settings file)","I","change",2,"cloud,admin",0,[]],[87,"独自 `ANTHROPIC_BASE_URL` 経由でも 1M コンテキストのモデルは 1M を使う。200K 止まりなら `/autocompact 200k`","Changed sessions behind a custom `ANTHROPIC_BASE_URL` to use the 1M context window of models that have one (Opus 4.7+, Sonnet 5+, Fable); run `/autocompact 200k` if your gateway stops at 200K","L","change",3,"cli,admin",1,[]],[88,"Team/Enterprise など起動時に組織ポリシーを読めなかった場合、読み込まれるまで WebFetch を使えない","Changed Team and Enterprise sessions, and sessions whose sign-in plan Claude Code can't determine, to withhold WebFetch until the organization policy loads if it couldn't be loaded at startup","T","change",2,"admin",0,[]],[89,"`/memory` の Auto-memory を、バックグラウンドや Claude Code 自身が起動したセッションからオンにできない","Changed /memory so that Auto-memory can no longer be turned on from a background session or from a session one of Claude Code's own tools started; turning it off there still works","S","change",2,"cli",0,[]],[90,"auto mode を既定にする一度きりの案内が、サードパーティプロバイダーやテレメトリーオフでも表示される","Changed the one-time offer to make auto mode your default permission mode to also show on third-party providers and with telemetry off, when your user settings default to another mode","T","change",1,"cli",0,[]],[91,"サードパーティやテレメトリーオフの `claude -p`・Python SDK が、権限モード未設定なら auto mode で開始する","Changed `claude -p` and Python Agent SDK sessions on third-party providers or with telemetry off to start in auto mode when no permission mode is configured, like interactive sessions; `--permission-mode` still overrides it","H","change",3,"sdk",1,[]],[92,"Bedrock/Mantle/AWS 版でベース URL が非既定ポートの場合、SigV4 署名の Host ヘッダーにポートを含める","Changed Bedrock, Mantle and Claude Platform on AWS requests to a base URL with a non-default port to include the port in the SigV4-signed Host header","H","change",1,"sdk,admin",0,[]],[93,"cloud セッションとセルフホスト runner で MCP サーバー名 `widgets` が予約され、同名や近い綴りは読み込まれない","Changed the MCP server name `widgets` to be reserved in cloud sessions and on self-hosted runners: your own server under it, or a close spelling such as `widgets_`, no longer loads, so rename it","C","change",2,"cloud",1,[]],[94,"macOS/Linux の `/ultrareview` がローカル checkout のアップロード時にシンボリック ref を除き、現ブランチがそれなら拒否する","Changed `/ultrareview` on macOS and Linux to leave symbolic refs out when uploading a local checkout; a checkout whose current branch is a symbolic ref is now refused with an explanation","I","change",1,"cloud",1,[]],[95,"Windows でプロジェクト・ローカル設定の `env` が `ALLUSERSPROFILE`・`SystemDrive`・`CommonProgramFiles` 系を設定しない","Windows: Changed project and local settings `env` to no longer set `ALLUSERSPROFILE`, `SystemDrive`, or the `CommonProgramFiles` variables; set them in user or managed settings instead","O","change",2,"windows",1,[]],[96,"`/tasks` が Claude Code 自身のバックグラウンド作業を「System tasks」行にまとめ、Enter で展開する","Changed `/tasks` to fold background work Claude Code runs for itself under one \"System tasks\" row; press Enter on it to show those tasks","A","change",1,"cli",0,[]],[97,"macOS/Linux の `/ultrareview` でローカルリポジトリのアップロードに git 2.31 以上が必要。`--separate-git-dir` は拒否","Changed `/ultrareview` on macOS and Linux to require git 2.31 or newer to upload a local repository; checkouts made with `--separate-git-dir` are now refused instead of being uploaded with an older method","I","change",1,"cloud",1,[]],[98,"macOS/Linux の `/ultrareview` が git 2.31 以上で partial clone を作業ツリーのスナップショットとして送る","Changed `/ultrareview` uploads on macOS and Linux to send a partial clone as a working-tree snapshot on git 2.31 or newer, instead of falling back or refusing when git's version looked too old","I","change",1,"cloud",0,[]],[99,"macOS/Linux の `/ultrareview` が古い git で作業ツリーのファイルが欠けた partial clone を取得せず拒否する","Changed `/ultrareview` uploads on macOS and Linux to refuse, instead of fetching, a partial clone missing some of its working tree's files on older git versions; a clone made without `--filter` uploads","I","change",1,"cloud",1,[]],[100,"Bedrock/Vertex/Mantle の起動時モデル確認が、他の Claude Code リクエスト同様 Claude Code と名乗る","Changed Bedrock, Vertex and Mantle start-up model checks to identify themselves as Claude Code, like other Claude Code requests","H","change",1,"admin",0,[]],[101,"`claude mcp get` が plugin 提供の stdio MCP サーバーのコマンド・引数・環境変数の値を隠す（変数名は表示）","Changed `claude mcp get` to hide the command, arguments, and environment values of stdio MCP servers provided by plugins; variable names are still shown","C","change",1,"cli",0,[]],[102,"`/claude-api` を Remote Control クライアントから実行できなくなる","Changed `/claude-api` so it can no longer be run from Remote Control clients","M","change",1,"cloud",0,[]],[103,"`/config chrome=true` は有効化せず /config パネルへ案内する。`chrome=false` は引き続きオフにできる","Changed `/config chrome=true` to direct you to the /config panel instead of enabling Claude in Chrome by default; `/config chrome=false` still turns it off when it was on","C","change",1,"cli",0,[]],[104,"プロジェクト設定が、管理者必須の sandbox の拡大・無効化や managed の deny・allowlist の緩和をできなくなる","Changed sandbox settings so project settings cannot widen or turn off an admin-required sandbox, replace the proxy behind a managed deny list, extend a strict allowlist, or reopen managed read-denies","T","change",3,"admin",1,[]],[105,"[VSCode] 復元タブで、リロードにより中断され返信が来ない場合の注記を最後のメッセージの下に表示","[VSCode] Added a note under ーを閉じる","[VSCode] Fixed Escape stopping the running turn instead of closing the command menu after clicking one of its rows","I","fix",1,"ide",0,[]],[115,"[VSCode] Past conversations を開いても、進行中の会話が保存済みコピーに置き換わらない","[VSCode] Fixed opening Past conversations replacing a live conversation with its saved copy","I","fix",2,"ide",0,[]],[116,"[VSCode] 拡張の再起動後にリロードした Claude タブが、空白でなく復旧方法を表示する","[VSCode] Fixed a Claude tab reloaded after an extension restart staying blank instead of saying how to recover","I","fix",1,"ide",0,[]],[117,"[VSCode] 別ウィンドウ・アプリで開いている会話を開くと、無警告で複製せず先に確認する","[VSCode] Fixed opening a conversation that is already open in another window or app starting a second copy of it without warning; it now asks first","I","fix",2,"ide",0,[]],[118,"[VSCode] hook がプロンプトを止めた理由が、ウィンドウのリロード後も消えない","[VSCode] Fixed a hook's reason for blocking or stopping a prompt disappearing after a window reload","I","fix",1,"ide",0,[]],[119,"[VSCode] 再開できない会話のタブで、その旨のエラーと新規会話の開始案内を表示する","[VSCode] Fixed tabs stuck on a conversation that can't be resumed: the error now says so and offers to start a new conversation","I","fix",1,"ide",0,[]],[120,"[VSCode] エディタが自動保存に応答しなくても、Read/Write/Edit が 10 分止まってスキップされない","[VSCode] Fixed every file Read, Write and Edit stalling for ten minutes and then being skipped when the editor stops responding to the extension's automatic save before the tool runs","I","fix",2,"ide",0,[]],[121,"[VSCode] agent map がサブエージェントに、セッションのモデルでなく実際に動いたモデルを表示する","[VSCode] Fixed the agent map labeling a sub-agent with the session's model instead of the model it actually ran on (e.g. under `CLAUDE_CODE_SUBAGENT_MODEL_FORCE` or an agent's own `model`)","I","fix",1,"ide",0,[]],[122,"[VSCode] Manage plugins からのアンインストールが、プロジェクト用 plugin でも正しい対象を削除できる","[VSCode] Fixed uninstalling a plugin from the Manage plugins dialog, which removed the wrong installation or failed for a plugin installed for the project","I","fix",2,"ide",0,[]],[123,"[VSCode] 戻って同じサインイン方法を選び直しても、認可コード入力の手順で止まらない","[VSCode] Fixed sign-in staying on the authorization-code step after going back and choosing the same sign-in method again","I","fix",1,"ide",0,[]],[124,"[VSCode] 長いセッションが古い行を間引くときに、チャットパネルが固まらない","[VSCode] Fixed the chat panel stalling when a long session trims its oldest rows","I","fix",1,"ide",0,[]],[125,"[VSCode] 多数のエージェント実行時に、セッションから会話が消えない","[VSCode] Fixed the conversation disappearing from a session when many agents run","I","fix",2,"ide",0,[]],[126,"[VSCode] `/rename`・SessionStart hook・claude.ai での改名が、エディタタブの名前に反映される","[VSCode] Fixed the editor tab keeping an old name after a session was renamed with /rename, by a SessionStart hook, or on claude.ai","I","fix",1,"ide",0,[]],[127,"[VSCode] agent map の transcript 表示が、実行中 agent へ送ったメッセージも表示する","[VSCode] Fixed the agent map's transcript view leaving out messages sent to a running agent","I","fix",1,"ide",0,[]],[128,"[VSCode] Manage plugins で plugin 操作が失敗すると、理由と対処法を示すポップアップを表示","[VSCode] Improved the Manage plugins dialog: a failed plugin action now opens a popup that explains it and, where there is one, offers the fix","I","improve",1,"ide",0,[]],[129,"[VSCode] プロジェクト共有の `.claude/settings.json` が有効にする plugin の無効化や marketplace 削除前に確認する","[VSCode] Changed the Manage plugins dialog to ask before removing a marketplace or turning off a plugin that your project's shared `.claude/settings.json` turns on","I","change",1,"ide",0,[]],[130,"[Cloud sessions] routine の Run now が開始前に拒否された際、内部エラーでなく失敗通知と同じ説明を表示","[Cloud sessions] Fixed Run now on a routine showing internal error text when the run is refused before it starts; it now shows the same explanation as the routine's failure notification","I","fix",1,"cloud",0,[]],[131,"[Cloud sessions] `MCP_DISCOVERY_CACHE=1` を環境変数に設定した場合のみ connectors のツール一覧を再利用する","[Cloud sessions] Changed `MCP_DISCOVERY_CACHE=1`, when set in your cloud environment's variables rather than a settings file, to reuse your connectors' tool lists after a session restart; other MCP servers are no longer cached and connect at startup","I","change",2,"cloud",1,[]],[132,"[Claude Tag] Cowork を持つ Enterprise の Standard/Usage-Based Chat 席のメンバーも Claude と DM できる","[Claude Tag] Added direct messages with Claude for members on an Enterprise plan Standard or Usage-Based Chat seat who also have Cowork; a seat that includes Claude Code is no longer required","I","new",2,"cloud,admin",0,[]],[133,"[Claude Tag] 管理設定と channel の Configure ページの Default model に、組織で使えないモデルが出ない","[Claude Tag] Fixed the Default model setting in admin settings and a channel's Configure page offering models your organization can't use, which made saves or new sessions fail","I","fix",1,"admin",0,[]],[134,"[Claude Tag] Slack メッセージ下の代替モデル使用の注記が、後から編集されても消えない","[Claude Tag] Fixed the note under Claude's Slack messages saying it answered on a fallback model, and why, disappearing when Claude later edited that message","I","fix",1,"cloud",0,[]],[135,"[Code Review] 「Add a repository」の組織メニューが、スクロールで GitHub 組織をさらに読み込む","[Code Review] Fixed the organization menu in Code Review's \"Add a repository\" dialog showing only a few of your GitHub organizations; it now loads more as you scroll","I","fix",1,"admin",0,[]],[136,"[Code Review] check run が、巨大な PR や REVIEW.md がシンボリックリンクで未適用の場合にそう表示する","[Code Review] Improved the Code Review check run to say when your repository's REVIEW.md wasn't applied, for example on a very large pull request or when REVIEW.md is a symbolic link","I","improve",1,"admin",0,[]]]},{"v":"2.1.284","date":"2026-09-29（火）02:11","dshort":"09-29 02:11","nb":5,"head":"自動モード既定化とSonnet 5.5追加、安全性と安定性の修正","sum":"このリリースは、対話型セッションの既定が自動モードになる変更と、Sonnet 5.5の追加が中心です。あわせて、ストリーム破損や過負荷時の再試行、compact後の「Prompt is too long」など、日常操作の安定性に関わる修正が多く入っています。managed settings 下のプラグイン権限修正も含まれ、管理者にも関係します。","watch":[{"b":"権限モード未設定の対話型セッションが自動モードで始まるため、従来の確認動作を保ちたい場合は `permissions.defaultMode` を明示する。","r":[62]},{"b":"Ultracode は xhigh を強制しなくなったため、effort の運用をしている場合は `/effort` で設定を確認する。","r":[63]},{"b":"切断後の再試行が他の再試行と予算を共有し、失敗するリクエストの打ち切りが早くなるため、不安定な回線では失敗の増加に備える。","r":[64]},{"b":"Opus を `ANTHROPIC_DEFAULT_OPUS_MODEL` や `modelOverrides` で固定していると、Anthropic API 上の安全関連の切り替え先は固定モデルではなく API が選ぶため、想定外のモデルに切り替わりうる。","r":[66]},{"b":"非対話の初回ターンは `CLAUDE_CODE_MCP_STARTUP_WAIT_MS` が `0` でも最大2秒 MCP サーバーを待つため、起動時間への影響を確認する。","r":[67]},{"b":"`/recap` はチャットスレッドやルーチン、webhook 経由で届いた場合は短い通知で辞退するため、これらの経路で使っている場合は端末などから実行する。","r":[68]},{"b":"ネットワーク共有上のファイルはアーティファクト公開を拒否されるため、`--add-dir` で追加したマップ済みドライブへ置く。","r":[70]},{"b":"VS Code の `CLAUDE_CONFIG_DIR` は絶対パスのときだけ適用されるため、相対パスで指定している場合は絶対パスに直す。","r":[88]},{"b":"Claude Tag は未接続ユーザーの @mention ごとに非公開のサインイン通知を出すようになるため、通知頻度の増加を周知する。","r":[94]}],"hl":[{"t":"自動モードが既定に","b":"権限モード未設定の対話型ターミナルとVS Codeセッションは、全プランとプロバイダーで自動モードで始まります。`permissions.defaultMode` で上書きできます。","r":[62,2]},{"t":"Claude Sonnet 5.5を追加","b":"`claude-sonnet-5-5` が追加され、Anthropic API の既定 Sonnet モデルになりました。1M コンテキストに対応します。","r":[1]},{"t":"プラグインの事前承認を制限","b":"`allowManagedPermissionRulesOnly` 下で、マーケットプレイス・claude.ai・npm のプラグインが `allowed-tools` で自らのツールを事前承認できなくなりました。公式 Anthropic ソースか managed settings が認めたソースのみ維持されます。","r":[35]},{"t":"応答エラーと再試行の修正","b":"破損したレスポンスストリームの生エラー表示や、thinking ブロック直後の過負荷エラーで終了する問題が修正されました。compact 後も長すぎる場合は、直近の会話を減らして再度 compact します。","r":[10,11,12]},{"t":"Ultracodeが独立トグルに","b":"Ultracode は `/effort` 内の独立したトグルになり、xhigh を強制せず任意の effort で有効にできます。VS Code にも切り替えスイッチが追加されました。","r":[63,73]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"自動モードに「次回も確認する」回答が加わり、外部 symlink のルールにも承認プロンプトが出るようになりました。auto-memory の不可視文字や偽装タグの無害化、sandbox 関連の修正も含まれます。","refs":[2,34,35,46,52,58,62,70]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"Explore サブエージェントは、Claude Code が認識しないモデル ID のセッションでそのモデルを引き継ぎます。Monitor の表示改善と、`SendMessage` ツールなしのセッションへの誤案内の修正もあります。","refs":[39,43,51]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"プラグインの設定画面、marketplace、hook のログと Elicitation の `block` 判定が修正されました。`/loop`、`/recap`、`/ultrareview`、アーティファクト関連も調整されています。","refs":[18,23,36,37,38,44,45,47,54,56,60,61,68]},{"a":"S","name":"セッション・履歴・圧縮","dg":"compact 後も「Prompt is too long」が続く場合に、直近の会話を減らして再度 compact するようになりました。","refs":[12]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"`/mcp reconnect all` が追加され、再開セッションでの MCP ツール呼び出しは接続を最大10秒待つようになりました。`claude mcp add` は managed settings の制限下で成功を装わず拒否します。","refs":[6,15,17,50]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VS Code 拡張にメッセージのタイムスタンプ、プラグインのエラー表示、Ultracode スイッチが追加され、多数の不具合が修正されました。Claude Tag、Remote Control、Cloud sessions、Claude Desktop 関連の改善も含まれます。","refs":[20,32,40,59,71,72,73,74,75,76,77,78,79,80,81,82,83,84,85,86,87,88,89,90,91,92,93,94,95,96,97,98,99]},{"a":"H","name":"headless・SDK・API","dg":"ストリーム破損、過負荷エラー、プラン使用量エンドポイントの再試行まわりが改善されました。Claude apps gateway には支出額表示、Google Cloud への telemetry 転送、証明書認証、431 エラーの修正が入っています。","refs":[3,7,8,9,10,11,14,16,19,48,57,64,67,100]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"Sonnet 5.5 の追加と、モデル利用不可時の通知修正が入っています。Ultracode の独立トグル化と、安全関連のモデル切り替え挙動の変更もあります。","refs":[1,13,41,63,65,66]},{"a":"U","name":"UI・表示・入力","dg":"キーバインド操作の追加、`/rate-limit-options` の追加、使用量制限の待機表示の改善が入っています。fullscreen 描画、vim モード、各種ダイアログ表示の不具合も修正されました。","refs":[4,5,21,24,25,26,27,28,29,30,31,33,42,49,55,69]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"設定スキーマを必要な部分だけ構築し、起動時間とメモリ使用量を改善しました。Windows で多数のプラグイン有効時に Bash ツールが失敗する問題も修正されています。","refs":[22,53]}],"skip":"表示の乱れ、vim モードやキー操作の細かな不具合、まれな環境でのクラッシュなどの修正が約40件あります。","st":"ok","stale":false,"e":[[1,"`claude-sonnet-5-5` を追加し、Anthropic API の既定 Sonnet に。1M コンテキスト、$2/$10 per Mtok","Added Claude Sonnet 5.5 (`claude-sonnet-5-5`), now the default Sonnet model on the Anthropic API — 1M context, $2/$10 per Mtok with $0.20/Mtok cache reads","L","new",3,"cli,sdk",0,[]],[2,"auto mode の作業ディレクトリ外読み取り確認に「次回も確認する」選択肢を追加","Added a \"Yes, but ask again next time\" answer to auto mode's prompt before a read outside the working directories, so you can allow that one read and still be asked about later ones","T","new",2,"cli",0,[]],[3,"gateway の利用上限を `/usage` とステータス行にドル額で表示、`rate_limits.spend_limit` に `used_usd` 等を追加","Added dollar amounts to the Claude apps gateway spend limit in `/usage` and the status line (for example \"$271.40 / $500.00 spent this month\") when the gateway runs this version or later; the status line's `rate_limits.spend_limit` also gains `used_usd`, `limit_usd` and `period`","H","new",2,"cli,admin",0,[]],[4,"`/effort` スライダー操作を `keybindings.json` で再割り当て可能な `effortSlider:*` アクションを追加","Added `effortSlider:decreaseEffort`, `increaseEffort` and `toggleUltracode` keybinding actions, so the `/effort` slider's arrow and Tab keys can be rebound in `keybindings.json`","U","new",1,"cli",0,[]],[5,"claude.ai 購読者向けに `/rate-limit-options` を `/help` とコマンドメニューに表示","Added `/rate-limit-options` to `/help` and the command menu for claude.ai subscribers, so the usage-limit notices that mention it point to a command you can find","U","new",1,"cli",0,[]],[6,"`/mcp reconnect all` で接続失敗・要認証の MCP サーバーを一括再試行","Added `/mcp reconnect all` in the interactive terminal to retry every MCP server that failed to connect or needs authentication at once","C","new",2,"cli",0,[]],[7,"managed policy の `availableModels` が空、または起動モデルを欠く場合に gateway が起動時に警告","Added Claude apps gateway startup warnings when a managed policy's `availableModels` is empty, or leaves out the model Claude Code starts on without setting `model` or `enforceAvailableModels`","H","new",1,"admin",0,[]],[8,"gateway の `telemetry.forward_to` に `auth: { google: {} }` を追加し Google Cloud OTLP へ直接送信可能に","Added `auth: { google: {} }` for Claude apps gateway `telemetry.forward_to` destinations, so telemetry can be exported straight to Google Cloud's OTLP endpoint using the gateway's Google Cloud credentials","H","new",1,"admin",0,[]],[9,"gateway と IdP 間で証明書クライアント認証 (`private_key_jwt`) に対応","Added certificate client authentication (`private_key_jwt`) between the Claude apps gateway and its identity provider, for identity providers that issue certificate credentials instead of client secrets","H","new",1,"admin",0,[]],[10,"壊れた応答ストリームで生のエラーや「undefined」が出ず、再試行または中断として報告される","Fixed a damaged response stream showing raw errors such as \"JSON Parse error\" or \"undefined is not an object\", or writing the word \"undefined\" into an answer, instead of being retried or reported as an interrupted response","H","fix",2,"cli,sdk",0,[]],[11,"thinking ブロック直後の過負荷・サーバーエラーでターンが終わらず再試行される","Fixed an overloaded or server error arriving right after a thinking block ending the turn with an error instead of being retried","H","fix",2,"cli,sdk",0,[]],[12,"圧縮後も「Prompt is too long」になる場合、直近の会話を減らしてもう一度圧縮する","Fixed \"Prompt is too long\" errors that persisted after compacting: when the compacted request is still too long, Claude Code now compacts once more, keeping less of the recent conversation","S","fix",2,"cli",0,[]],[13,"モデル利用不可でフォールバックも無い場合、専用の通知と Learn more リンクを表示","Fixed a session whose model is unavailable, with no fallback model left, showing a bare \"is currently unavailable\" message (or \"Something went wrong\" in cloud sessions) instead of the model-unavailable notice and its Learn more link","L","fix",1,"cli,cloud",0,[]],[14,"不正な `source` の画像でも Agent SDK セッションが落ちず、説明メモに置換される","Fixed Agent SDK sessions crashing when a user message contains an image with a malformed `source`, and failing on every later turn after a malformed document block; a malformed image is now replaced with an explanatory note","H","fix",2,"sdk",0,[]],[15,"再開セッションで接続中の MCP サーバーのツール呼び出しが最大10秒待つ","Fixed MCP tool calls in a resumed session failing with \"No such tool available\" while their server was still connecting; the call now waits up to 10 seconds for the server","C","fix",2,"cli",0,[]],[16,"プラン使用量エンドポイントが制限・拒否された後、`/usage` 等は再問い合わせせずバックオフする","Fixed repeated calls to the plan-usage endpoint after it rate-limits or rejects your login: `/usage`, `/extra-usage` and IDE usage views now back off instead of re-asking","H","fix",1,"cli,ide",0,[]],[17,"managed settings が MCP をプラグインに限定している時、`claude mcp add` は拒否して対処を案内","Fixed `claude mcp add` reporting success when managed settings restrict MCP servers to plugins; it now refuses and says what to do, instead of saving a server that never loads","C","fix",1,"cli,admin",0,[]],[18,"`/plugin` 設定画面で真偽値は選択式、数値は不正入力を拒否、←/→ で値を変更","Fixed the `/plugin` configure screen: boolean options are now a true/false choice instead of free text, number options refuse invalid input, and ←/→ change an options field instead of switching tabs","M","fix",1,"cli",0,[]],[19,"`ANTHROPIC_FOUNDRY_RESOURCE` を検証し、単純なリソース名以外は拒否","Fixed `ANTHROPIC_FOUNDRY_RESOURCE` being interpolated into the Foundry endpoint host unvalidated; a value that is not a plain resource name is now refused","H","fix",2,"sdk,admin",0,[]],[20,"gateway 経由の Claude Desktop で 1M 対応モデルに 1M コンテキスト選択肢が出る","Fixed Claude Desktop behind a Claude apps gateway offering no 1M context option: the gateway now marks each 1M-capable model for Desktop automatically","I","fix",1,"ide,admin",0,[]],[21,"シェルモードで ↓ が隠れた背景タスク pill を選択せず、Backspace と Ctrl+U が効く","Fixed ↓ in shell mode selecting a hidden background-tasks pill, which stopped Backspace and Ctrl+U from editing the prompt","U","fix",1,"cli",0,[]],[22,"多数のプラグイン有効時も Windows の Bash ツールが動く。存在しない `bin/` は PATH に追加しない","Fixed Bash tool failing on Windows with many plugins enabled: plugin `bin/` directories that don't exist are no longer added to PATH, and inherited entries aren't added twice","O","fix",2,"windows",0,[]],[23,"古い git (2.39未満) でも `sparsePaths` マーケットプレイスが空で複製されず更新できる","Fixed `sparsePaths` plugin marketplaces cloning empty and replacing a working local copy on older git (before 2.39), which failed every refresh with \"marketplace.json file is no longer present\"","M","fix",1,"cli",0,[]],[24,"transcript モードの `[` でスクロールバックに書き出しても上の端末出力が消えない","Fixed fullscreen rendering erasing the terminal output above the session when `[` in transcript mode writes the conversation to scrollback (macOS and Linux)","U","fix",1,"macos,cli",0,[]],[25,"フルスクリーンで上にスクロール中に返信が完了してもスクロール位置が飛ばない","Fixed fullscreen scroll position jumping to the previous message or to the bottom when a reply finished streaming while scrolled up","U","fix",1,"cli",0,[]],[26,"狭い端末で `/config` や `/plugin` のタブが単語途中で折れず、収まらないタブは次行へ","Fixed tab bars in dialogs such as `/config` and `/plugin` breaking the title and tab labels mid-word in a narrow terminal; a tab that doesn't fit now moves to the next line whole","U","fix",1,"cli",0,[]],[27,"`/model` ピッカー最後までスクロールした時の「+1 model」誤表示が直り、下にある数のみ表示","Fixed the `/model` picker showing \"+1 model\" below the list after scrolling to the last model; the count now covers only the models below the visible rows","U","fix",1,"cli",0,[]],[28,"`/keybindings` が無効なフッター操作の Backspace/Delete 割り当てを生成しない","Fixed `/keybindings` writing Backspace and Delete bindings for a footer action that does nothing into the generated `keybindings.json`","U","fix",1,"cli",0,[]],[29,"`footer:close` を再割り当てしても、表示中エージェント行で「x」が入力されない","Fixed a rebound agent panel close key (`footer:close`) typing \"x\" instead of itself on the row of the agent you're viewing","U","fix",1,"cli",0,[]],[30,"vim モードの `.` が高速入力や非 bracketed paste でも繰り返せ、無入力の繰り返し後に INSERT に残らない","Fixed vim mode `.` not repeating text typed very fast (for example over ssh or in tmux) or pasted without bracketed paste, and leaving the prompt in INSERT mode after repeating a change with nothing typed (such as `cw` then Esc)","U","fix",1,"cli",0,[]],[31,"vim モードで `dd`/`yy` 後にカーソルが画像プレースホルダーの開き括弧に残らない","Fixed vim mode leaving the cursor on an image placeholder's opening bracket after `dd` on the last line or `yy` at the end of the prompt, where `r` or `x` would break or delete the image","U","fix",1,"cli",0,[]],[32,"端末フォーカス復帰直後のキー入力が Remote Control 有効化の確認に誤答しない","Fixed a key pressed the instant the terminal regained focus answering the Remote Control enable prompt before its short safety delay restarted","I","fix",1,"cli,cloud",0,[]],[33,"ホームで起動した場合、レンダラー切替や更新後にワークスペース信頼ダイアログが再表示されない","Fixed the workspace trust dialog appearing a second time after switching renderers or updating when Claude Code was started in the home directory","U","fix",1,"cli",0,[]],[34,"外部から `.claude/rules` へ symlink したルールや `.claude` symlink でも外部インポート承認を表示","Fixed rules symlinked into `.claude/rules` from outside the project being skipped without ever showing the external-imports approval prompt; a `.claude` directory symlinked from outside the project now asks for the same approval","T","fix",2,"cli",0,[]],[35,"`allowManagedPermissionRulesOnly` 下で、公式等以外のプラグインが `allowed-tools` で自己事前承認できない","Fixed plugins from marketplaces, claude.ai and npm pre-approving their own tools via `allowed-tools` under managed `allowManagedPermissionRulesOnly`; only plugins from an official Anthropic source or a source that managed settings vouch for keep that pre-approval","T","fix",3,"admin",0,[]],[36,"依存の版範囲を満たせず `claude plugin install` が失敗した時、プラグインが有効・記録されたまま残らない","Fixed a failed first `claude plugin install` leaving the plugin enabled and recorded when a dependency's version range could not be met","M","fix",1,"cli,mod-dev",0,[]],[37,"デバッグログに失敗した hook の stderr とステータスコードが記録される","Fixed the debug log dropping a failed hook's stderr when the hook also wrote to stdout, and logging nothing for a failed hook with no output; failed hooks now also log their status code","M","fix",1,"mod-dev",0,[]],[38,"Elicitation/ElicitationResult hook の `{\"decision\":\"block\"}` が MCP elicitation を拒否する","Fixed `{\"decision\":\"block\"}` returned by Elicitation and ElicitationResult hooks being ignored; it now declines the MCP elicitation, as exit code 2 does","M","fix",2,"mod-dev",0,[]],[39,"`SendMessage` ツール無しで起動したセッションが、それでの他セッションへの連絡を促されない","Fixed sessions launched without the `SendMessage` tool (such as by Claude Desktop) still being told to message other sessions with it","A","fix",1,"ide",0,[]],[40,"Remote Control で送った写真が、キュー取り戻し時に消えず、キャプション無しでもカーソルが正しく動く","Fixed a photo sent from the Claude app over Remote Control being lost when its queued message was pulled back into the terminal prompt to edit, and the cursor moving one character for a photo with no caption","I","fix",1,"cli,cloud",0,[]],[41,"使用上限の自動待機中にメッセージを入力しても、再度上限到達時に「自動で続行」設定の制御下に残る","Fixed typing a message during an automatic usage-limit wait taking the wait out of the \"Continue automatically at usage limit\" setting's control when that turn hit the limit again","L","fix",1,"cli",0,[]],[42,"最上位 Max プランの利用者に `/upgrade` を勧めず、可能なら `/usage-credits` を案内","Fixed usage-limit warnings suggesting `/upgrade` to users already on the highest Max plan; the warnings and `/upgrade` itself now point at `/usage-credits` when it is available","U","fix",1,"cli",0,[]],[43,"未知のモデル ID（プロキシ背後のカスタムモデル等）でも Explore サブエージェントが Opus に切り替わらず継承","Fixed the Explore subagent switching to Opus on the Claude API when the session runs a model ID Claude Code doesn't recognize, such as a custom model behind a proxy; Explore now inherits that model","A","fix",2,"cli",0,[]],[44,"`/loop` 自己ペースの進捗と終了結果が可視テキストで表示される","Fixed `/loop` status updates in self-paced mode often not being shown because Claude wrote them only in its reasoning; Claude now writes each update, and the outcome when the loop stops, as visible text","M","fix",1,"cli",0,[]],[45,"Claude デスクトップアプリ作成の git worktree から `/ultrareview` が作業ツリーをアップロードできる","Fixed `/ultrareview` failing to upload the working tree when started from a git worktree that the Claude desktop app created on macOS or Linux","M","fix",1,"macos,cli",0,[]],[46,"書き込み拒否の作業ディレクトリが読み取り拒否ディレクトリを含む Linux でも、sandbox の Bash が起動する","Fixed sandboxed Bash commands failing to start on Linux when the working directory is write-denied and contains a read-denied directory","T","fix",1,"cli",0,[]],[47,"artifact DB 書き込み結果の可視性説明を正し、`as_level` に「view」レベルを追加","Fixed artifact database write results telling Claude that every viewer sees a write to a viewer's private `data/users/` subtree, and added a \"view\" level to `as_level`","M","fix",1,"mod-dev",0,[]],[48,"IdP のグループが多いサインインでも gateway が 431 を返さず、最大 256 KiB のヘッダーを受け付ける","Fixed the Claude apps gateway answering `431 Request Header Fields Too Large` to every request from a sign-in whose identity provider lists many groups; it now accepts request headers up to 256 KiB","H","fix",1,"admin",0,[]],[49,"使用上限待機の状態とカウントダウンをプロンプト下に一つにまとめ、メッセージの重複を解消","Improved the usage-limit wait: the limit's state and the countdown with the usage-credits option now show as one block under the prompt, and limit messages no longer repeat the countdown","U","improve",1,"cli",0,[]],[50,"接頭辞無しの Claude in Chrome ツール呼び出しエラーが、呼ぶべきツール名を示す","Improved the \"No such tool available\" error for Claude in Chrome tools called without their prefix: it now names the tool to call","C","improve",1,"cli",0,[]],[51,"Monitor のイベント行が出力内容を表示し、変化の無い待機行を繰り返さない","Improved Monitor event rows to show what each event printed instead of repeating the description, and stopped repeating an unchanged \"Waiting for N … to finish\" line after every event","A","improve",1,"cli",0,[]],[52,"Workflow ツールの sandbox 強化: 非同期スクリプト hook が投げるエラーを対象に追加","Improved Workflow tool sandbox hardening for errors thrown by async script hooks","T","improve",1,"mod-dev",0,[]],[53,"使用中の設定に関する schema だけを構築し、起動時間とメモリ使用量を改善","Improved startup time and memory use by building only the parts of the settings schema that your settings files actually use","O","improve",2,"cli",0,[]],[54,"`/claude-api` の `hillclimb` が些細な言い換えを省き、追加ページはネットワーク非依存の単一ファイルで生成","Improved `/claude-api`: `hillclimb` no longer spends rounds on prompt rewordings too small for the eval to measure, and an extra page you ask for beside `report.html` is built as one local file that loads nothing from the network","M","improve",1,"cli",0,[]],[55,"`/tasks`、`/copy`、`/hooks` 等の詳細が収まれば一列に揃い、収まらなければ右端に配置","Improved lists such as `/tasks`, `/copy` and `/hooks`: the details after each name now line up in one column when they fit, and otherwise sit at the right edge","U","improve",1,"cli",0,[]],[56,"`claude plugin marketplace add` が同名の別ソースを置き換える際に通知し、元に戻す方法を示す","Improved `claude plugin marketplace add` to say when it replaces a marketplace already added under the same name from a different source, and how to undo it","M","improve",1,"cli",0,[]],[57,"`forceLoginMethod` 等と API キー設定が衝突する起動拒否で、使用中の認証情報・設定場所・削除方法を表示","Improved the startup refusal when managed settings require a sign-in (`forceLoginMethod` or `forceLoginOrgUUID`) and an API key, token or `apiKeyHelper` is configured: it now names the credential in use, where it is set, and how to remove it","H","improve",1,"admin,cli",0,[]],[58,"`MEMORY.md` と想起メモ内の不可視文字や Claude Code マークアップ偽装タグを無害化","Improved auto-memory loading: invisible characters and tags that imitate Claude Code's own markup are neutralized in `MEMORY.md` and recalled memory notes before they reach Claude","T","improve",2,"cli",0,[]],[59,"未信頼フォルダの `claude remote-control` が終了せず端末でワークスペース信頼を確認","Improved `claude remote-control`: in a folder you haven't trusted yet, it now asks for workspace trust on the terminal instead of exiting","I","improve",1,"cli,cloud",0,[]],[60,"artifact ページで設計計画をページ内に書き、既に付けた名前をタイトルに使う","Improved artifact pages: Claude writes its design plan into the page instead of the reply, and uses the name you already gave something as the page title","M","improve",1,"cli",0,[]],[61,"claude.ai のチャット・プロジェクトリンクや artifact id のみの場合、正しいリンクか内容を尋ねる","Improved the Artifact tool so that when Claude is given a claude.ai chat or project link, an artifact from a chat, or an artifact id on its own, it asks for the right link or the content instead of stopping","M","improve",1,"cli",0,[]],[62,"権限モード未設定時、対話端末と VS Code が全プラン・プロバイダーで auto mode で開始（`permissions.defaultMode` で上書き可）","Changed interactive terminal and VS Code sessions to start in auto mode when no permission mode is configured, on every plan and provider; `permissions.defaultMode` still overrides it","T","change",3,"cli,ide",1,[]],[63,"Ultracode を `/effort` の独立トグルに変更。xhigh を強制せず任意の effort で維持","Changed Ultracode into its own toggle in `/effort` (Tab, or `/effort ultracode [on|off]`): it no longer forces xhigh effort and stays on at any effort level","L","change",2,"cli",1,[]],[64,"応答途中の切断後の再試行が他の再試行と予算を共有し、失敗時は早く諦める","Changed retries after a dropped connection mid-response to share one budget with the rest of the request's retries, so a failing request gives up sooner","H","change",2,"cli,sdk",0,[]],[65,"Sonnet の safeguards が発動した際の通知が理由を説明し、編集と再試行を案内","Changed the notice shown when a Sonnet model's safeguards flag a message to explain why it happened and to offer editing and retrying","L","change",1,"cli",0,[]],[66,"Opus 固定セッションの安全関連切替で、API が各フラグ種別ごとに切替先モデルを選ぶ","Changed safety-related model switches in sessions that pin an Opus model with `ANTHROPIC_DEFAULT_OPUS_MODEL` or `modelOverrides`: on the Anthropic API, the API now picks the model to switch to for each kind of flag, not the pinned model","L","change",2,"cli,admin",1,[]],[67,"非対話の初回ターンは `CLAUDE_CODE_MCP_STARTUP_WAIT_MS` が `0` でも、指名された MCP を最大2秒待つ","Changed the non-interactive first turn to still wait up to 2s for connecting MCP servers named by `--allowedTools` or an `mcp_tool` hook, even when `CLAUDE_CODE_MCP_STARTUP_WAIT_MS` is `0`","H","change",1,"sdk",0,[]],[68,"チャットスレッド・routine・webhook 経由の `/recap` は短い通知で辞退し、端末等では従来通り実行","Changed `/recap` to decline with a short notice when it arrives relayed from a chat thread (your own included) or from a routine or webhook; typed in the terminal, the Claude apps, Remote Control, `-p` or an SDK host, it runs as before","M","change",1,"cli",0,[]],[69,"`/artifacts` のフィルタータブをタイトル横の一語ラベル（All, Mine, Shared）にし、共通タブバーを使用","Changed `/artifacts` to show its filter tabs beside the title with one-word labels (All, Mine, Shared), using the same tab bar as `/config` and `/plugin`","U","change",1,"cli",0,[]],[70,"ネットワーク共有上のファイルの artifact 公開を拒否。`--add-dir` で追加したマップ済みドライブは除く","Changed artifact publishing to refuse a file on a network share (a `\\\\host\\share` path or a `/net` automount) unless it is on a mapped network drive added with `--add-dir`","T","change",2,"cli",1,[]],[71,"[VSCode] 各プロンプト・応答の上に時刻を表示できる設定を追加（既定オフ）","[VSCode] Added an optional time above each prompt and response, with a date line where the day changes (Claude Code: Show Message Timestamps setting, off by default)","I","new",1,"ide",0,[]],[72,"[VSCode] Manage plugins の行にプラグインの読み込みエラーと注記、無効化・削除・コピーのポップアップを追加","[VSCode] Added plugin load errors and notes to the Manage plugins rows, with a popup to disable, uninstall or copy the error","I","new",1,"ide,mod-dev",0,[]],[73,"[VSCode] Effort スライダー下に Ultracode のオン/オフスイッチを追加し、モデル表示に「· Ultracode」を出す","[VSCode] Added an Ultracode on/off switch under the Effort slider, replacing the slider's Ultracode stop; the model pill shows \"· Ultracode\" at any effort level","I","new",2,"ide",0,[]],[74,"[VSCode] Memory ダイアログの Reload Claude が編集ファイルの保存後に再起動する","[VSCode] Fixed Reload Claude from the Memory dialog restarting before an edited file was saved","I","fix",1,"ide",0,[]],[75,"[VSCode] 他の Claude プロセスが開いている会話を復元タブで開く前に確認する","[VSCode] Fixed a restored tab opening a conversation another Claude process still has open; it now asks first","I","fix",1,"ide",0,[]],[76,"[VSCode] サブエージェント作業中や最初のステップ省略時にも、展開した Focus view セクションが閉じない","[VSCode] Fixed Focus view sections you expanded closing on their own while a sub-agent is working or when the section's first step is trimmed from view","I","fix",1,"ide",0,[]],[77,"[VSCode] `/model` と Enter で使い方テキストではなくモデル選択を開く","[VSCode] Fixed typing `/model` and Enter printing usage text into the chat instead of opening the model selector","I","fix",1,"ide",0,[]],[78,"[VSCode] Vertex・Bedrock・Foundry の `/feedback` が、端末同様にローカル保存される","[VSCode] Fixed `/feedback` on Vertex, Bedrock and Foundry being refused after you pressed Send; the report is now saved on this computer, as the terminal does","I","fix",1,"ide",0,[]],[79,"[VSCode] ウィンドウ再読込後のサインインが Python 拡張を最大1分待たない","[VSCode] Fixed sign-in waiting up to a minute for the Python extension after a window reload","I","fix",1,"ide",0,[]],[80,"[VSCode] Restart Extensions 後に応答しなくなった Claude Code タブが会話を再度開く","[VSCode] Fixed Claude Code tabs that stopped responding after Restart Extensions: they now reopen on their conversation","I","fix",1,"ide",0,[]],[81,"[VSCode] 送信者記録の無い他エージェントのメッセージが生 XML で表示されない","[VSCode] Fixed a message from another agent with no recorded sender showing as raw XML in the chat","I","fix",1,"ide",0,[]],[82,"[VSCode] 他のエージェント・セッション・チャンネルからのメッセージが再読込後も残る","[VSCode] Fixed messages from other agents, sessions or channels disappearing after a reload","I","fix",1,"ide",0,[]],[83,"[VSCode] ユーザー自身の `/mcp`、`/config`、`/settings` が拡張のダイアログに隠されない","[VSCode] Fixed a user's own `/mcp`, `/config` or `/settings` command being shadowed by the extension's dialog","I","fix",1,"ide",0,[]],[84,"[VSCode] ターン未実行時の Escape が全バックグラウンドエージェントを止めない","[VSCode] Fixed Escape stopping every background agent when no turn was running","I","fix",1,"ide",0,[]],[85,"[VSCode] プラグインインストールリンクが同名の既存マーケットプレイスを置換しない","[VSCode] Fixed plugin install links replacing a marketplace you already have that uses the same name","I","fix",1,"ide",0,[]],[86,"[VSCode] 大きなテキストファイル添付時の圧縮後「Prompt is too long」が解消","[VSCode] Fixed \"Prompt is too long\" errors after compaction when a large text file is attached to a message","I","fix",1,"ide",0,[]],[87,"[VSCode] 非 ASCII・空白・括弧を含むパスのファイルへのチャットリンクが開ける","[VSCode] Fixed chat links to files with non-ASCII characters, spaces or brackets in their path not opening","I","fix",1,"ide",0,[]],[88,"[VSCode] `claudeCode.environmentVariables` の `CLAUDE_CONFIG_DIR` は絶対パスのみ有効、継続用ターミナルにも渡す","[VSCode] Changed `CLAUDE_CONFIG_DIR` in the `claudeCode.environmentVariables` setting to apply only when it is an absolute path, and passed it to terminals that continue the chat","I","change",2,"ide",1,[]],[89,"[Cloud sessions] オフライン時の routine の Edit/Duplicate が読み込み中ではなくオフラインと表示","[Cloud sessions] Fixed a routine's Edit and Duplicate controls saying the routine was still loading while you were offline; they now tell you you're offline","I","fix",1,"cloud",0,[]],[90,"[Claude Tag] スレッド・チャンネル既定・DM に「Opus (latest)」等のモデルファミリー選択を追加","[Claude Tag] Added model family choices such as \"Opus (latest)\" for a thread, a channel default or your DM, so the choice follows the newest model in that family","I","new",2,"cloud",0,[]],[91,"[Claude Tag] 支出予測グラフに組織全体の上限に算入される支出と使用率を表示","[Claude Tag] Added the spend that counts toward your organization-wide limit to the analytics spend projection chart, with how much of the limit is used","I","new",1,"cloud,admin",0,[]],[92,"[Claude Tag] ホスト名にアンダースコアを含む GitHub Enterprise でも進捗カードにリポジトリと Create PR を表示","[Claude Tag] Fixed the earlier Claude in Slack app's progress card and link previews omitting the repository and Create PR button when a GitHub Enterprise host name contains an underscore","I","fix",1,"cloud",0,[]],[93,"[Claude Tag] 環境が起動を拒否するチャンネルで、管理者連絡の通知を1回投稿し @メンションで再試行","[Claude Tag] Fixed Claude staying silent in a channel whose environment declines to start it; it now posts one notice asking you to contact an admin, and retries when @-mentioned","I","fix",1,"cloud,admin",0,[]],[94,"[Claude Tag] 未連携ユーザーの @メンションごとに非公開のサインイン通知を投稿","[Claude Tag] Changed Claude to post its private sign-in notice at every @mention from someone who hasn't connected their Claude account, instead of going quiet after the first","I","change",1,"cloud",0,[]],[95,"[Claude Tag] 「Notify members now」が Enterprise Grid の全ワークスペースと大規模ワークスペースの多くのメンバーに届く","[Claude Tag] Improved \"Notify members now\" in admin settings: one press reaches every workspace your organization claimed in an Enterprise Grid, and more members in large workspaces","I","improve",1,"cloud,admin",0,[]],[96,"[Claude Tag] オンデマンドランナーの待機通知が、起動中・再試行・起動なしのいずれかを示す","[Claude Tag] Improved Claude's wait notice on self-hosted environments with on-demand runners: it now says whether a runner is starting, a start will be retried, or no runner will start","I","improve",1,"cloud,admin",0,[]],[97,"[Claude Tag] チャンネル管理者追加の失敗時、Slack ワークスペース未確認のエラー表示を改善","[Claude Tag] Improved the error shown when adding a channel manager fails because the channel's Slack workspace can't be confirmed as connected to your organization","I","improve",1,"cloud,admin",0,[]],[98,"[Claude Tag] チャンネルのアクセス一覧に自動参加パターンが付与するコネクタ・リポジトリ・プラグインと出所を表示","[Claude Tag] Improved a channel's access lists in admin settings to show the connectors, repositories and plugins an auto-join pattern attaches, and where each comes from","I","improve",1,"cloud,admin",0,[]],[99,"[Claude Tag] GitHub 管理者を確認できない場合、リポジトリ追加ページが GitHub サインインを求める","[Claude Tag] Improved adding repositories as a channel manager: when your GitHub sign-in can't confirm you're a repository admin, the page asks you to sign in with GitHub","I","improve",1,"cloud",0,[]],[100,"[Code Review] 未送信レビューが残っていても、投稿を再試行して完成レビューを投稿する","[Code Review] Fixed Code Review giving up without posting a finished review when an unsubmitted review under its GitHub App was open on the pull request; it now retries the post first","H","fix",1,"cloud",0,[]]]},{"v":"2.1.283","date":"2026-09-26（土）03:46","dshort":"09-26 03:46","nb":1,"head":"プラグイン管理とMCP周りの修正、auto mode既定の変更が中心","sum":"v2.1.283 はプラグイン管理・MCP・UI操作の修正が多数を占めるリリースです。管理者向けにモデル制限の設定（`availableModelsMatch`、`deniedModels`）が加わりました。サードパーティプロバイダーまたはテレメトリ無効時の既定の権限モードが変わるため、該当する利用者は確認が必要です。","watch":[{"b":"サードパーティプロバイダーまたはテレメトリ無効の環境では既定で auto mode になるため、従来の挙動を保つなら `permissions.defaultMode` を明示する。","r":[63]},{"b":"`Skill(anthropic-skills:\u003cname\u003e)` と `Skill(skill:\u003cname\u003e)` の deny ルールの照合範囲が広がったため、既存ルールが意図せず他の経路のスキルを止めないか確認する。","r":[68]},{"b":"`claude plugin eval` は git 導入済みなら 2.31 以上が必須となり、古い git では拒否されるため、git を更新する。","r":[71]},{"b":"自動で張られた artifact の watch は 3.5 時間無操作で終了するため、継続したい場合は artifact を再度公開または watch する。","r":[72]},{"b":"2.1.282 での `claude-ai` 名の予約が取り消され、該当名のスキルなどが再び読み込まれ、`Skill(claude-ai:*)` は通常の前置一致ルールになるため、既存の拒否ルールがあれば見直す。","r":[75]},{"b":"セルフホストランナーのライフサイクルフックの git は、Git LFS の `pre-push` フックの省略や書き込み可能なシステム `core.hooksPath` の無視などに変わり、`--configure-git` なしではコミットに署名しないため、必要なら `--configure-git` を付ける。","r":[73,74]}],"hl":[{"t":"auto mode が既定に","b":"サードパーティプロバイダー利用時またはテレメトリ無効時の対話セッションは、権限モード未設定なら auto mode で開始します。`permissions.defaultMode` で上書きできます。","r":[63]},{"t":"管理者向けモデル制限","b":"`availableModelsMatch` を `\"exact\"` にすると、`availableModels` に書いたバージョンだけを許可します。`deniedModels` は `availableModels` で許可されたモデルも拒否します。","r":[2,3]},{"t":"プラグイン管理の修正","b":"`claude plugin validate` の検証漏れ、`installed_plugins.json` の読み込み不能や書き換えによる記録消失、ホームディレクトリ移動後の cache-miss など、複数の不具合を修正しました。復旧手順も案内されます。","r":[20,21,26,27,28,57]},{"t":"MCP の安定性向上","b":"長時間ツールの進捗通知の欠落、起動中に終了した stdio サーバーの残留、一時的な 404 後に使えなくなる問題を修正しました。`claude mcp add` などの書き込み失敗も正しく報告されます。","r":[11,12,13,32]},{"t":"Windows の削除保護","b":"PowerShell ツールで `cmd /c rd`、`rmdir`、`del`、`erase` によるドライブルートやホームフォルダの削除を防ぐようにしました。","r":[47]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"auto mode の既定変更、`/ultrareview` の注意文、deny ルールの照合拡大が入りました。sandbox 設定、git 証明書、auto-memory 編集、Windows の削除保護も修正しています。","refs":[38,39,40,41,47,63,64,68]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"モデルのフォールバック中に開始した動的ワークフローが、設定済みモデルで再試行されず全エージェントがフォールバックモデルで動く問題を修正しました。","refs":[18]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"プラグイン検証・アンインストール・復元・`installed_plugins.json` まわりの修正が中心です。`/doctor prompt-audit` が追加され、`claude-ai` 名の予約は取り消されました。","refs":[5,20,21,22,23,24,25,26,27,28,55,56,57,58,71,72,75]},{"a":"S","name":"セッション・履歴・圧縮","dg":"コンパクション中のスピナーは開始時点からタイマーが動き、要約のトークン数を表示するようになりました。","refs":[53]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP の進捗通知、サーバーの残留、404 後の状態、認証、設定書き込みの報告を修正しました。`/mcp` の一覧表示も改善し、画像結果はファイルにも保存されます。","refs":[11,12,13,14,32,48,49,54]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VS Code 拡張、クラウドセッション、Claude Tag、Code Review の修正が中心です。Remote Control がテレメトリ無効の有料プランで使えない問題も直りました。","refs":[33,42,43,76,77,78,79,80,81,82,83,84,85,86,87,88,89,90,91,92,93,94]},{"a":"H","name":"headless・SDK・API","dg":"ゲートウェイ向けに `x-claude-code-prompt-id` ヘッダー、OpenTelemetry の `tool.output` への出力追加、`mantle` プロバイダー、`load_test_mode` が加わりました。`--system-prompt` と `-file` 形式も併用できます。","refs":[1,4,7,8,9,10,67,73,74]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"モデル制限設定の追加に加え、`/model` の入力検証や表示、`DISABLE_PROMPT_CACHING_HAIKU`、`/usage` の表示を修正しました。初回応答までの遅延も短縮しています。","refs":[2,3,15,16,17,19,30,59,60,65]},{"a":"U","name":"UI・表示・入力","dg":"`/tasks` と各種ピッカーにページ送り・マウス・クリック操作が加わりました。vim モード、キーバインド警告、スクリーンリーダー、Warp のリンク表示も修正しています。","refs":[6,29,31,34,35,36,37,44,45,46,50,51,52,66,69,70]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"`claude -p` と Claude Code Remote は対話 UI を読み込まなくなり、auto mode の分類器ルールと Artifact ツールは初回使用時に読み込まれます。claude.ai アカウントでは起動時の最大 1.5 秒の待ちもなくなりました。","refs":[61,62]}],"skip":"表示の乱れ、vim モードの細かな挙動、まれな環境での不具合などの修正が約 40 件あります。","st":"ok","stale":false,"e":[[1,"gateway のヒントヘッダーに `x-claude-code-prompt-id` を追加。`CLAUDE_CODE_GATEWAY_HINT_HEADERS=1` で有効化し1プロンプトのリクエストを束ねられる","Added `x-claude-code-prompt-id` to the gateway hint headers so LLM gateways can group the requests that serve one user prompt; opt in with `CLAUDE_CODE_GATEWAY_HINT_HEADERS=1`","H","new",1,"sdk,admin",0,[]],[2,"managed 設定 `availableModelsMatch` を追加。`\"exact\"` なら `availableModels` の記載バージョンのみ許可し新リリースは未記載の間ブロック","Added `availableModelsMatch` managed setting: with `\"exact\"`, an `availableModels` entry allows only the model version it names, so new releases stay blocked until listed","L","new",2,"admin",0,[]],[3,"managed 設定 `deniedModels` を追加。`availableModels` で許可されたモデルでも個別にブロック可能","Added `deniedModels` managed setting to block specific models, even when `availableModels` allows them","L","new",2,"admin",0,[]],[4,"`OTEL_LOG_TOOL_CONTENT=1` 時、`tool.output` スパンイベントに MCP ツール・WebFetch・WebSearch の出力も含める","Added MCP tool, WebFetch and WebSearch outputs to the `tool.output` OpenTelemetry span event when `OTEL_LOG_TOOL_CONTENT=1`","H","new",1,"sdk,admin",0,[]],[5,"`/doctor prompt-audit`（`/checkup prompt-audit`）で CLAUDE.md・skills・agents・commands の旧モデル向け記述を監査","Added `/doctor prompt-audit` (also `/checkup prompt-audit`) to audit your CLAUDE.md files, skills, agents and commands for prompting patterns written for older models","M","new",2,"cli",0,[]],[6,"フルスクリーンモードで他セッション由来の省略メッセージをクリックで展開可能","Added click-to-expand for truncated messages from your other sessions in fullscreen mode","U","new",1,"cli",0,[]],[7,"stream-json の `system/init` `plugin_errors` の `--plugin-dir` 読み込み失敗に `path` を追加し、失敗ディレクトリが分かる","Added `path` to `--plugin-dir` load-failure entries in the stream-json `system/init` `plugin_errors`, naming the directory that did not load","H","new",1,"sdk,mod-dev",0,[]],[8,"Claude apps gateway 設定に任意の `load_test_mode` を追加。上流へ送らず定型応答を返し負荷試験ができる","Added an opt-in `load_test_mode` block to the Claude apps gateway config: requests are built and signed but not sent upstream, and clients get a canned reply, so a deployment can be load tested","H","new",1,"admin,sdk",0,[]],[9,"Claude apps gateway に Amazon Bedrock Mantle エンドポイント向けの `mantle` 上流プロバイダを追加","Added a `mantle` upstream provider to the Claude apps gateway for Amazon Bedrock's Mantle endpoint","H","new",1,"admin,sdk",0,[]],[10,"SDK セッションが、ターン早期終了時の保留ツール呼び出し・完了結果、worker 再起動後の承認待ち、非ストリーミングfallback の `result.usage` を失わない","Fixed SDK sessions losing a deferred tool call or finished tool result when a turn ended early, a held approval prompt after a worker restart, and a non-streaming fallback's `result.usage`","H","fix",2,"sdk",0,[]],[11,"長時間 MCP ツール呼び出しがバックグラウンド化しても進捗通知を捨てず、タスクに最新進捗を表示","Fixed MCP progress notifications being discarded once a long-running tool call moved to the background; the background task now shows the latest progress","C","fix",1,"cli",0,[]],[12,"起動中にセッションが終了しても stdio MCP サーバーが残り続けない","Fixed stdio MCP servers being left running when the session ended while they were still starting","C","fix",1,"cli",0,[]],[13,"ステートレスなリモート MCP サーバーの一時的な HTTP 404 後も、残りのセッションで使えなくならず復帰する","Fixed a brief HTTP 404 from a stateless remote MCP server (for example a proxy mid-redeploy) leaving that server unusable for the rest of the session while still shown as connected","C","fix",2,"cli",0,[]],[14,"有効な URL を持たない MCP サーバーのサインインが不明瞭な SDK エラーにならず、`/mcp` も Authenticate を出さない","Fixed MCP sign-in for a server with no valid URL failing with an opaque SDK error; `/mcp` no longer offers Authenticate for such servers","C","fix",1,"cli",0,[]],[15,"テレメトリ無効時も週次 Fable 上限が `/usage` と VS Code の使用量メーターに表示される","Fixed the weekly Fable limit not appearing in `/usage` and the VS Code usage meters when telemetry is disabled","L","fix",1,"cli,ide",0,[]],[16,"`/model` が日付や `-v1:0` 付き ID の Sonnet 4.6/Sonnet 5 の `[1m]` を、素の ID が拒否される場合に誤って受け付けない","Fixed `/model` accepting Sonnet 4.6 or Sonnet 5 with `[1m]` when the id carried a date or `-v1:0` suffix, in the cases where the plain id was refused","L","fix",1,"cli",0,[]],[17,"`ANTHROPIC_DEFAULT_HAIKU_MODEL` で別モデルを指定した場合、`/model` ピッカーが固定の Haiku バージョン・価格を出さない","Fixed `/model` picker showing a hardcoded Haiku version and price when `ANTHROPIC_DEFAULT_HAIKU_MODEL` pins a different model","L","fix",1,"cli",0,[]],[18,"モデル fallback 中に始めた動的ワークフローが、全エージェントを fallback モデルで動かさず設定モデルで再試行する","Fixed dynamic workflows started during a model fallback running every agent on the fallback model instead of retrying the configured model","A","fix",1,"cli",0,[]],[19,"Haiku がメインモデルのセッションでも `DISABLE_PROMPT_CACHING_HAIKU` が効く","Fixed `DISABLE_PROMPT_CACHING_HAIKU` having no effect when Haiku is the session's main model","L","fix",1,"cli",0,[]],[20,"`claude plugin validate` が、インストール不可な plugin/marketplace 名を `marketplace.json` で失敗扱いにする","Fixed `claude plugin validate` saying Claude Code accepts a plugin or marketplace name it cannot install; such names in `marketplace.json` now fail validation","M","fix",1,"mod-dev",0,[]],[21,"`claude plugin validate` が、`outputStyles`・`themes`・`monitors`・`lspServers` のパス欠落や plugin 外参照を検出する","Fixed `claude plugin validate` passing plugins whose `outputStyles`, `themes`, `monitors`, or `lspServers` paths are missing or point outside the plugin directory","M","fix",1,"mod-dev",0,[]],[22,"`claude plugin details` が `plugin.json` 宣言の MCP サーバー数を正しく表示","Fixed `claude plugin details` showing 0 MCP servers for plugins that declare their servers in `plugin.json`","M","fix",1,"mod-dev",0,[]],[23,"`claude plugin marketplace remove` が、一緒にアンインストールした plugin を一覧表示","Fixed `claude plugin marketplace remove` not saying which installed plugins it uninstalled with the marketplace; it now lists them","M","fix",1,"cli",0,[]],[24,"`claude plugin uninstall` が、ID が大文字小文字のみ異なる別 plugin を設定・シークレットごと誤って削除しない","Fixed `claude plugin uninstall` removing the other of two installed plugins whose ids differ only in case, with its options and secrets, when the one named had no `enabledPlugins` entry at that scope","M","fix",2,"cli",0,[]],[25,"バージョン未宣言 plugin がキャッシュ欠落時、最新コミットではなくインストール済みのものに復元される","Fixed plugins that declare no version being silently restored at their source's newest commit, not the installed one, when their cached files were missing","M","fix",1,"mod-dev",0,[]],[26,"home/config ディレクトリ移動後（bind-mount の devcontainer 等）も plugin と marketplace が \"cache-miss\" にならず読み込める","Fixed user-installed plugins and marketplaces failing to load with \"cache-miss\" after the home or config directory was moved, for example in bind-mounted devcontainers","M","fix",2,"cli",0,[]],[27,"無効な plugin ID のレコードがあっても `installed_plugins.json` が読み込まれ plugin が表示される","Fixed `installed_plugins.json` showing no plugins when it holds a record under an invalid plugin id; such a file loads again","M","fix",1,"cli",0,[]],[28,"読めないレコードがあっても `installed_plugins.json` を書き換えて失わず、`claude plugin` がレコードと復旧手順を示す","Fixed `installed_plugins.json` being rewritten, losing records, when it holds a record this version cannot read; `claude plugin` commands now name the record and say how to recover","M","fix",1,"cli",0,[]],[29,"スクリーンリーダーモードの権限ダイアログで、引用コマンドやパスをダイアログ自身の文として読み上げない","Fixed permission dialogs in screen-reader mode reading quoted commands and paths as if they were the dialog's own text","U","fix",1,"cli",0,[]],[30,"`/context` が MCP サーバー instructions を独立した行で表示し、合計に含める","Fixed `/context` not counting MCP server instructions: they now appear as their own row and count toward the total","L","fix",1,"cli",0,[]],[31,"Warp ターミナルで Markdown リンクがクリック可能なハイパーリンクとして表示される","Fixed markdown links in the Warp terminal rendering as plain text instead of clickable hyperlinks","U","fix",1,"cli",0,[]],[32,"`claude mcp add`・`add-json`・`remove` が、設定ファイルに書き込めない時（sandbox 内など）に成功と報告しない","Fixed `claude mcp add`, `add-json`, and `remove` reporting success when the user or local config file could not be written, for example inside a sandbox","C","fix",1,"cli",0,[]],[33,"クラウドセッションで返信の冒頭が遅れず、Claude の記述に合わせてストリーミングされる","Fixed the first words of a reply in a cloud session sometimes appearing late instead of streaming as Claude writes them","I","fix",1,"cloud",0,[]],[34,"組み込みのキーバインドガイドが、chord のタイムアウトを3秒と正しく案内し、`cmd` を `meta` の別名と誤記しない","Fixed Claude's built-in keybindings guide saying chords time out after 1 second instead of 3, and calling `cmd` an alias of `meta`, which could produce `cmd+` shortcuts most terminals never send","U","fix",1,"cli",0,[]],[35,"`keybindings.json` の `ctl+k` のような修飾キーのスペルミスを、デバッグログで警告し修正案を示す","Fixed `keybindings.json` silently accepting a misspelled modifier such as `ctl+k`; it now warns in the debug log and suggests the fix","U","fix",1,"cli",0,[]],[36,"`footer:openSelected` を再割り当て・解除した後、フッターが \"Enter to view\" を誤表示しない","Fixed footer hints still saying \"Enter to view\" after `footer:openSelected` was rebound or unbound in `keybindings.json`","U","fix",1,"cli",0,[]],[37,"素早く連続入力したキー（type-ahead・キーリピート・ssh/tmux 経由）が古い状態で処理されない","Fixed keys typed quickly together (type-ahead, key repeat, bursts over ssh or tmux) sometimes being handled against stale state","U","fix",2,"cli",0,[]],[38,"CA 証明書を `GIT_CONFIG_COUNT` 環境変数ペアで渡しても、worktree checkout（Git LFS 等）の証明書検証が通る","Fixed worktree checkouts failing certificate verification (for example on Git LFS downloads) whe

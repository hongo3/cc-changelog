eb-cloud-sessions"],[47,"クラウドセッション開始失敗時のエラーが \"Something went wrong\" ではなく \"Connection lost\" か \"Server error\" になる","[Cloud sessions] Improved the error shown when a cloud session fails to start: it now says \"Connection lost\" or \"Server error\" instead of \"Something went wrong\"","I","improve",1,"cloud",0,[],"web-cloud-sessions"],[48,"PC オフライン後、Remote Control の subagent ペインが回り続けず、切断中と表示される","[Remote Control] Fixed a subagent's pane spinning forever in a Remote Control session after your computer goes offline; it now says Remote Control is disconnected","I","fix",1,"cloud",0,[],"remote-control"],[49,"以前のメッセージを編集して回答した場合でも、Slack の \"is thinking…\" 表示が残らない","[Claude Tag] Fixed \"is thinking…\" staying up under a mention in a Slack channel or DM after Claude answered it by editing one of its earlier messages","I","fix",1,"cloud",0,[],"claude-tag"],[50,"Slack 返信の番号/箇条書き手順下のコードブロック内 URL が山括弧で囲まれず、コピーしたコマンドが壊れない","[Claude Tag] Fixed URLs in code blocks under a numbered or bulleted step of Claude's Slack replies being wrapped in angle brackets, which broke copied commands","I","fix",1,"cloud",0,[],"claude-tag"],[51,"Slack で添付した HEIC・SVG・TIFF・BMP 画像が Claude に届き、作業ファイルとして渡される","[Claude Tag] Fixed HEIC, SVG, TIFF and BMP images attached in Slack never reaching Claude; they now arrive as files in its working files, like other file types","I","fix",2,"cloud",0,[],"claude-tag"],[52,"ロールで Claude Tag を制限する組織で、新しいチャンネルマネージャーも Slack の Claude を使える","[Claude Tag] Fixed new channel managers losing access to Claude in Slack in organizations that restrict Claude Tag by role; the manager role now also grants Claude Tag in Slack","I","fix",2,"admin,cloud",0,[],"claude-tag"],[53,"同一ホストの MCP サーバーのカスタムコネクターが、管理設定で個別のコネクターとして表示される","[Claude Tag] Fixed custom connectors whose MCP servers share one host showing as a single connector in Claude Tag admin settings; each server is now its own connector","I","fix",1,"admin",0,[],"claude-tag"],[54,"Slack 検索が一時停止しても DM を破棄せず、先に再試行して \"DMs are temporarily unavailable\" を返さない","[Claude Tag] Fixed Claude in Slack sometimes answering a direct message with \"DMs are temporarily unavailable\" and dropping it when a single Slack lookup stalled; it now retries first","I","fix",2,"cloud",0,[],"claude-tag"],[55,"Slack Enterprise Grid の DM が、最後に Claude を開いた接続済みワークスペースで実行される","[Claude Tag] Fixed direct messages with Claude on a Slack Enterprise Grid ignoring Slack's workspace dropdown; they now run under the connected workspace you last opened Claude in","I","fix",1,"cloud",0,[],"claude-tag"],[56,"チャンネル月額上限の通知が、チャンネルマネージャーではなく組織オーナーと使用量ページを案内する","[Claude Tag] Fixed Claude in Slack's notice for a channel's monthly spend limit saying a channel manager can raise it; it now names an organization owner and links the usage page","I","fix",1,"cloud",0,[],"claude-tag"],[57,"Slack 返信のリンクが直後の太字/斜体の閉じ記号や全角句読点を巻き込まず、リンクと書式が崩れない","[Claude Tag] Fixed links in Claude's Slack replies absorbing the closing bold or italic marks, or full-width punctuation, right after them, which broke the link and the formatting","I","fix",1,"cloud",0,[],"claude-tag"],[58,"リポジトリ検索が最大100の GitHub アカウントに対応し、App インストールの5,000件超の private リポジトリも検索できる","[Claude Tag] Improved repository search in Claude Tag admin settings to cover up to 100 connected GitHub accounts and find private repositories past the first 5,000 of a GitHub App install","I","improve",1,"admin",0,[],"claude-tag"],[59,"Add place で入力/貼り付けたチャンネルが、組織の全チャンネル読込完了前でもすぐ一覧に出る","[Claude Tag] Improved Add place in Claude Tag admin settings to list a channel you type or paste right away, instead of only after your organization's full channel list has loaded","I","improve",1,"admin",0,[],"claude-tag"],[60,"ワークスペース/チャンネルページの Add \u003e Domain が、全チャンネル読込を待たずページ読込後に使える","[Claude Tag] Improved Add \u003e Domain on a workspace's or channel's page in Claude Tag admin settings to be available once that page loads, not only after every channel has loaded","I","improve",1,"admin",0,[],"claude-tag"],[61,"Claude Tag 管理設定のアクセスが Bundles・Connectors・Skills and plugins・Channels の4タブに整理された","[Claude Tag] Changed Claude Tag admin settings to organize Claude's access into four tabs: Bundles, Connectors, Skills and plugins, and Channels","I","change",2,"admin",0,[],"claude-tag"],[62,"組織設定の Roles ページで、Claude Tag チャンネルマネージャー用ロールが組織独自ロール下の折りたたみ欄にまとまる","[Claude Tag] Changed the Roles page in organization settings to group the roles created for Claude Tag channel managers in a collapsed section below your organization's own roles","I","change",1,"admin",0,[],"claude-tag"],[63,"GitHub 連携のため離脱しても、管理設定に戻ると Code Review のセットアップがリポジトリ選択から再開する","[Code Review] Fixed Code Review setup not resuming after you leave to connect GitHub; back in admin settings, it now reopens at the repository picker","I","fix",1,"admin",0,[],"code-review"]]},{"v":"2.1.301","date":"2026-10-15（木）23:34","dshort":"10-15 23:34","nb":2,"head":"モデル切替・Read/Grep の誤動作修正と mods の仕様変更が中心","sum":"v2.1.301 は不具合修正が大半を占め、モデル切替時の要約、Grep/Glob/Read の誤動作、認証更新まわりが改善された。mods の `.catch` と `$.env.set` の挙動変更があり、mods 開発者は確認が必要。OpenTelemetry の `tool_decision` イベントへの項目追加や、VS Code 拡張の LaTeX 表示も含まれる。","watch":[{"b":"mod フックの `.catch` ハンドラはフックが例外を投げるかタイムアウトした場合のみ実行され、フック自身の呼び出し配下で発生したイベントはフックを スキップするため、`.catch` に依存する mods は動作を確認すること。","r":[44]},{"b":"mod の `$.env.set` は、設定・解除後に `{}`、書き込まれない場合は理由付きの `{ deny }` で解決されるようになったため、戻り値を使う mods は処理を見直すこと。","r":[45]}],"hl":[{"t":"小さいモデルへの切替時の要約","b":"コンテキストウィンドウの小さいモデルへ切り替えるとき、新しいモデルには長すぎる会話を、先に前のモデルが要約するようになりました。あわせて、確認なしに前のモデルの要約で使用クレジットを消費するケースが修正されました。","r":[40,20]},{"t":"検索・読込ツールの誤報告を修正","b":"Grep と Glob は、検索プログラムが結果を返す前に異常終了したとき、「一致なし」ではなく検索失敗のエラーを返すようになりました。Read ツールは .xlsm、.parquet、.epub、.heic などのバイナリをテキストとして読まなくなりました。","r":[10,24]},{"t":"mod API の挙動変更と確認点","b":"mod hook の `.catch` は、hook が例外を投げるかタイムアウトしたときだけ実行されるようになりました。`$.env.set` は結果を `{}` または理由付きの `{ deny }` で返します。","r":[44,45,34]},{"t":"ログイン更新失敗の誤動作を修正","b":"`claude auth status` や `claude plugin list` のような短いコマンドがトークン更新中に終了しても、サインイン更新のタイムアウトや意図しないサインアウトが起きなくなりました。ディスクが満杯でログインを更新できない場合は、ディスクが原因でファイル削除が必要だと表示されます。","r":[18,9]},{"t":"`tool_decision` に分類器情報","b":"OpenTelemetry の `tool_decision` イベントに `classifier_verdict` と `permission_mode` が加わり、auto mode 分類器の判定と権限ルールを区別できるようになりました。`OTEL_LOG_TOOL_DETAILS=1` のときは、分類器ブロックが該当した組み込みルール名 `classifier_category` も入ります。","r":[5,6]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"OpenTelemetry の `tool_decision` イベントに分類器関連の項目が追加された。Grep/Glob/Read、worktree 削除確認、`/diff`、Bash `cd` 後の workflow スクリプトの権限などが修正された。","refs":[5,6,7,10,12,19,24,31,32]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"workflow エージェントがステップを飛ばしたまま成功と報告する問題を修正し、長時間のサブエージェント実行中の描画性能を改善した。","refs":[11,41]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"mods の `rows` 入力追加と、`.catch`・`$.env.set` の挙動変更がある。スキルの引数処理による停止やメモリ使用量、`/rewind` 後のスキル一覧、`$.model.fork` の問題も修正された。","refs":[2,4,13,14,26,27,30,34,43,44,45]},{"a":"S","name":"セッション・履歴・圧縮","dg":"LLM ゲートウェイ経由で圧縮が繰り返される問題と、再開セッションの圧縮行の案内が修正された。","refs":[21,28]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VS Code 拡張に LaTeX 数式表示と「Get more usage」リンクが追加された。パネルのクラッシュ再開、思考中の遅延、診断表示の不具合も修正された。","refs":[42,46,47,48,49,50,51]},{"a":"H","name":"headless・SDK・API","dg":"無人リトライモード用に `CLAUDE_CODE_RETRY_WATCHDOG_MAX_USAGE_LIMIT_WAIT_MS` が追加された。サインイン更新、`awsAuthRefresh` の誤実行、セルフホストランナーのセッション処理が修正された。","refs":[1,17,18,36,37,38]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"モデル切替時の要約処理が改善され、`fable` と `best` エイリアスのエラーも修正された。","refs":[8,20,40]},{"a":"U","name":"UI・表示・入力","dg":"vim mode に `%` モーションが加わり、Esc まわりの挙動が直った。VTE 古版や iTerm2 での不要文字表示、dim 表示、Markdown 表�の描画も修正された。","refs":[3,15,16,22,23,25,29,33,35]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"ディスク満杯時のログイン更新失敗に関するエラー表示と、Windows の PowerShell バックグラウンドコマンドの出力ファイルが修正された。","refs":[9,39]}],"skip":"表示の乱れ、まれな端末環境での不具合、ログ表示などの細かな修正が約 25 件ある。","st":"ok","stale":false,"e":[[1,"`CLAUDE_CODE_RETRY_WATCHDOG_MAX_USAGE_LIMIT_WAIT_MS` で、使用量上限の解除が遠い場合は待たずにリクエストを終了できる","Added `CLAUDE_CODE_RETRY_WATCHDOG_MAX_USAGE_LIMIT_WAIT_MS` so unattended retry mode (`CLAUDE_CODE_RETRY_WATCHDOG`) ends a request at a usage limit that resets too far away instead of waiting","H","new",1,"sdk",0,[],"headless-ci"],[2,"`claude-api` skill に OpenTelemetry トレースの案内が加わり、`ant` CLI での送信先設定も説明される","Added OpenTelemetry tracing guidance to the `claude-api` skill, including setting up trace destinations with the `ant` CLI","M","new",1,"cli",0,[],"skills"],[3,"vim mode に `%` モーションが追加され、対応する括弧へ移動でき d/c/y とも併用できる","Added the `%` motion to vim mode: jump to the matching bracket, alone or with d/c/y","U","new",1,"cli",0,[],"vim-mode"],[4,"mod の `Input` に `rows` が加わり、ターミナルで複数行の入力欄を使える（Enter で送信、Shift+Enter で改行）","Added `rows` to a mod's `Input`: a text field of several lines in the terminal, where Enter submits and Shift+Enter or a backslash before Enter starts a new line","M","new",2,"mod-dev",0,[],"plugins-mods"],[5,"OpenTelemetry の `tool_decision` イベントに `classifier_verdict` と `permission_mode` が入り、auto mode 分類器の判定と権限ルールを区別できる","Added `classifier_verdict` and `permission_mode` to OpenTelemetry `tool_decision` events, so auto mode classifier decisions can be told apart from permission rules","T","new",1,"admin",0,[],"auto-mode"],[6,"`OTEL_LOG_TOOL_DETAILS=1` のとき `tool_decision` イベントに、分類器ブロックが該当した組み込みルール名 `classifier_category` が入る","Added `classifier_category` to OpenTelemetry `tool_decision` events, naming the built-in rule a classifier block matched, when `OTEL_LOG_TOOL_DETAILS=1`","T","new",1,"admin",0,[],"auto-mode"],[7,"`WorktreeCreate` hook が作った worktree に未 push のコミットがありうる場合、終了時に確認なしで削除されない","Fixed quitting removing a worktree made by a `WorktreeCreate` hook without asking when it may hold unpushed commits","T","fix",2,"cli",0,[],"hooks"],[8,"最新の Fable モデルが組織で使えないとき、`fable`（`best`）エイリアスが前の Fable モデルで 1 回再試行する","Fixed the `fable` (and `best`) model alias erroring on the Anthropic API when the newest Fable model is not available to your organization: Claude Code now retries once on the previous Fable model","L","fix",2,"cli",0,[],"model-selection"],[9,"ディスクが満杯でログイン更新できないとき、誤解を招く \"Please run /login\" ではなく、ディスクが原因でファイル削除が必要だと表示する","Fixed a misleading \"Please run /login\" error when a full disk keeps the login from being refreshed; the error now names the disk and says to delete files","O","fix",1,"cli",0,[],"auth-login"],[10,"Grep と Glob が、検索プログラムの異常終了時に「一致なし」ではなく検索失敗のエラーを返す","Fixed Grep and Glob reporting no matches when the search program failed unexpectedly before returning any results; they now return an error saying the search failed","T","fix",2,"cli",0,[],"read-edit-tools"],[11,"workflow agent が、タスク文にユーザー権限がないというハーネスの注記を読んだ後に自分のステップを飛ばして成功扱いになることがなくなった","Fixed workflow agents sometimes skipping their step, and the run still reporting success, after reading the harness note that their task text carries no user authority","A","fix",2,"cli",0,[],"subagents"],[12,"PreToolUse hook が Edit/Write を対象にしている環境でも artifact の更新が拒否されず、ファイルを編集してから再公開する","Fixed artifact updates being refused where a PreToolUse hook covers Edit or Write; Claude now edits the file and then republishes instead of changing it in the publish call","T","fix",1,"cli",0,[],"artifacts"],[13,"引数名が非常に多い・長い skill や command の呼び出しで数秒止まらない（先頭 64 個、各 64 文字までを反映）","Fixed skills and commands with very many or very long argument names stalling for seconds when invoked; only the first 64 names, each up to 64 characters, are now filled in","M","fix",1,"mod-dev",0,[],"skills"],[14,"引数が多数のプレースホルダーを埋める skill・command・hook が大量のメモリを使わない","Fixed skills, commands and hooks using very large amounts of memory when their arguments fill many placeholders","M","fix",1,"mod-dev",0,[],"skills"],[15,"VTE 0.53 未満の端末（RHEL 8 の MATE Terminal など）で `\u003e0q` や `\u003e4m` などの文字がフォルダ信頼画面や終了時に出ない","Fixed stray characters such as `\u003e0q` covering the folder trust prompt, and `\u003e4m` before the shell prompt at exit, in terminals built on VTE older than 0.53 such as MATE Terminal on RHEL 8","U","fix",1,"cli",0,[],"output-rendering"],[16,"一部の iTerm2 で起動時にプロンプトへ `GOK` の文字が出ない","Fixed stray `GOK` text appearing in the prompt at startup in some versions of iTerm2","U","fix",1,"cli,macos",0,[],"output-rendering"],[17,"Bedrock 以外で `application-inference-profile` を含むモデルへ切り替えても `awsAuthRefresh` が走らず、モデル切替 hook も遅れない","Fixed switching to a model whose name contains `application-inference-profile` running your `awsAuthRefresh` command and delaying model-switch hooks when the provider is not Bedrock","H","fix",1,"cli",0,[],"bedrock-vertex"],[18,"`claude auth status` や `claude plugin list` のような短いコマンドがトークン更新中に終了しても、サインイン更新のタイムアウトや意図しないサインアウトが起きない","Fixed sign-in refresh timeouts and unexpected sign-outs after a short command such as `claude auth status` or `claude plugin list` exited in the middle of a token refresh","H","fix",2,"cli",0,[],"auth-login"],[19,"権限確認中にターン途中のメッセージで中断されたツール呼び出しが、ユーザー拒否としてモデルに伝わらない","Fixed a tool call cut off by a message sent mid-turn during its permission check being reported to the model as rejected by the user","T","fix",1,"cli",0,[],"permissions"],[20,"コンテキストの小さいモデルへ切り替える際、確認なしに前のモデルの要約で使用クレジットを消費することがない","Fixed a case where switching to a model with a smaller context window could spend usage credits on a summary by the previous model without asking first","L","fix",2,"cli",0,[],"compaction-context"],[21,"要求と異なるモデル名を返す LLM gateway 配下で、意図しないモデルによる圧縮が繰り返されない","Fixed conversations being compacted over and over, on a model you didn't pick, behind an LLM gateway whose responses name a different model than the one requested","S","fix",2,"cli,sdk",0,[],"compaction-context"],[22,"低速・高負荷のマシンで、vim mode が Escape 後も INSERT のまま残ることがなくなった","Fixed vim mode sometimes staying in INSERT after Escape on a slow or busy machine","U","fix",1,"cli",0,[],"vim-mode"],[23,"vim mode で AskUserQuestion の自由入力欄が NORMAL モードに対応し、Esc でのキャンセルは NORMAL のときだけになる","Fixed Esc discarding a typed AskUserQuestion answer in vim mode: the free-text field now supports vim NORMAL mode, and Esc cancels only from NORMAL","U","fix",1,"cli",0,[],"vim-mode"],[24,"Read ツールが .xlsm、.parquet、.epub、.heic などのバイナリをテキストとして読まない","Fixed the Read tool reading binary files such as .xlsm, .parquet, .epub and .heic as text","T","fix",2,"cli",0,[],"read-edit-tools"],[25,"ヘッダー行だけの Markdown テーブルが端末幅を超えても描画され、plan 承認カードでも表示される","Fixed a Markdown table with only a header row drawing nothing when too wide for the terminal, including in plans on the plan approval card","U","fix",1,"cli",0,[],"output-rendering"],[26,"/claude-api skill が、Claude Platform on AWS で CMEK 外部キーのエンドポイントが使えないと誤って案内しなくなった","Fixed the /claude-api skill saying CMEK external-key endpoints aren't available on Claude Platform on AWS","M","fix",1,"cli",0,[],"skills"],[27,"`/rewind` の後も skill 一覧がモデルに渡され続ける","Fixed skills no longer being listed to the model after using `/rewind`","M","fix",2,"cli",0,[],"skills"],[28,"再開したセッションの圧縮行が、未読込の履歴に ctrl+o を案内せず以前のメッセージの保存先を示し、fullscreen でも表示される","Fixed the compaction row in a resumed session offering ctrl+o for history that is not loaded; it now says where the earlier messages are saved, and also shows in fullscreen","S","fix",1,"cli",0,[],"sessions-resume"],[29,"応答を中断した直後に「new task? /clear to save tokens」のヒントが再表示されない","Fixed the \"new task? /clear to save tokens\" hint coming back right after you interrupt a response","U","fix",1,"cli",0,[],"prompt-input"],[30,"plugin や skill hook の `ask` 判定による権限確認で、hook の由来となる plugin・skill 名が表示される","Fixed the permission prompt for a plugin or skill hook's `ask` decision not showing which plugin or skill the hook comes from","M","fix",1,"mod-dev",0,[],"hooks"],[31,"reftable リポジトリで git チェックがタイムアウトや失敗しても、`/diff` が cherry-pick や revert の競合を検出する","Fixed `/diff` not noticing a conflicted cherry-pick or revert in reftable repositories when one of its git checks timed out or failed","T","fix",1,"cli",0,[],"slash-commands"],[32,"同一セッションで Bash の `cd` 後に workflow script を読み・編集・再実行しても、権限確認や拒否が出ない","Fixed workflow scripts asking for permission or being refused when read, edited or re-run after a Bash `cd` in the same session","T","fix",2,"cli",0,[],"permissions"],[33,"ダーク ANSI テーマと 16 色端末で淡色テキストを調整（塗り箱内は淡色、選択・検索ハイライトでは非淡色、一覧説明は他の補助テキストと同様）","Fixed dim text on the dark ANSI theme and 16-color terminals: faint inside filled boxes, not faint under selection and search highlights, and list descriptions dimmed like other secondary text","U","fix",1,"cli",0,[],"output-rendering"],[34,"新しい Claude Code プロセスの最初の応答前でも、mod の `$.model.fork` が `nothing-to-fork` を返さない（`claude -p` や cloud sessions）","Fixed a mod's `$.model.fork` returning `nothing-to-fork` when called before the first response of a new Claude Code process had finished, as in `claude -p` runs and cloud sessions","M","fix",1,"mod-dev,sdk,cloud",0,[],"plugins-mods"],[35,"fullscreen mode で `/compact` や自動圧縮の際、表示中の transcript 再構築で UI が一時停止しない","Fullscreen mode: Fixed `/compact` and auto-compact briefly freezing the UI while the visible transcript is rebuilt","U","fix",1,"cli",0,[],"fullscreen-mode"],[36,"managed settings が MCP サーバーを制限していても、Slack 起動のセッションがリポジトリを見つけて接続できる（ツールを止めるには `deniedMcpServers`）","Self-hosted runner: Fixed sessions started from Slack being unable to find or attach a repository when managed settings restrict MCP servers; use `deniedMcpServers` to keep those tools off","H","fix",1,"admin,cloud",0,[],"self-hosted-runner"],[37,"無関係なセットアップ失敗が git の missing-ref 文言を含んでも、ソースブランチ削除済みと誤判定されず再試行される","Self-hosted runner: Fixed sessions being reported as having a deleted source branch, and not retried, when an unrelated setup or session failure quoted git's missing-ref wording","H","fix",1,"admin",0,[],"self-hosted-runner"],[38,"終了中のセッションで、失敗・拒否されたセッション解放の再試行をログが誤って告知せず、繰り返し失敗は回数表示になる","Self-hosted runner: Fixed the log promising a retry of a failed or declined session release for a session that is ending; repeated failures now show a count","H","fix",1,"admin",0,[],"self-hosted-runner"],[39,"停止した PowerShell のバックグラウンドコマンドの出力ファイルに、終端の `[killed]` 行が書かれる","Windows: Fixed stopped background PowerShell commands missing the closing `[killed]` line in their output file","O","fix",1,"windows",0,[],"background-tasks"],[40,"コンテキストの小さいモデルへ切り替えるとき、長すぎる会話は先に前のモデルで要約される","Improved switching to a model with a smaller context window: a conversation too long for the new model is now summarized by the previous model first","L","improve",2,"cli",0,[],"compaction-context"],[41,"長時間動くサブエージェントの進捗表示が全体の再処理ではなく差分更新になり、描画が速くなる","Improved rendering performance while a long-running subagent works: its progress trail now updates incrementally instead of being reprocessed in full on every render","A","improve",1,"cli",0,[],"performance"],[42,"Claude が書く artifact ページで sticky ヘッダー上の帯も塗られ、モバイルアプリでスクロール時に文字が透けない","Improved artifacts: pages Claude writes now paint the band above a sticky header, so scrolled text no longer shows there in the mobile apps","I","improve",1,"ide,cloud",0,[],"artifacts"],[43,"VS Code・デスクトップ・モバイルで、質問ダイアログ上のツリーが Markdown と最大 48 行に対応（ターミナルは平文 12 行のまま）","Improved mods: in VS Code and the desktop and mobile apps, a tree drawn above the question dialog can now hold Markdown and up to 48 rows; the terminal keeps 12 plain rows","M","improve",1,"mod-dev,ide",0,[],"plugins-mods"],[44,"mod hook の `.catch` は hook が例外を投げるかタイムアウトしたときだけ実行され、hook 自身の呼び出し下のイベントは `.catch` を呼ばず skip される","Changed a mod hook's `.catch` handler to run only when the hook throws or times out; events raised beneath the hook's own calls now skip that hook without asking its `.catch`","M","change",2,"mod-dev",1,[],"plugins-mods"],[45,"mod の `$.env.set` は、設定・解除後に `{}`、書き込まれない場合は理由付きの `{ deny }` で解決する","Changed a mod's `$.env.set` to resolve with `{}` once the variable is set or unset, or with `{ deny }` saying why when the write is not made","M","change",2,"mod-dev",1,[],"plugins-mods"],[46,"Claude の応答で LaTeX 数式（`$$`、複数行 `\\[ … \\]`、インライン `$…$` や `\\(…\\)`）を描画する","[VSCode] Added LaTeX math rendering in Claude's responses, including `$$` and multi-line `\\[ … \\]` blocks and inline `$…$` and `\\(…\\)` math","I","new",2,"ide",0,[],"vscode"],[47,"VS Code と JetBrains のパネルで、Pro・Max プランの使用量上限バナーに「Get more usage」リンクが出る","[VSCode] Added a \"Get more usage\" link to the usage-limit banner for Pro and Max plans in the VS Code and JetBrains panels","I","new",1,"ide",0,[],"vscode"],[48,"クラッシュやフリーズを起こす会話が、リロードのたびにパネルで再び開かれることがない","[VSCode] Fixed a conversation that crashes or freezes the panel being reopened on every reload","I","fix",2,"ide",0,[],"vscode"],[49,"長い thinking 中にチャットパネルが重くならない（更新のたびに全文を再解析しない）","[VSCode] Fixed the chat panel slowing down during long thinking: it no longer re-parses the whole thinking text on every update","I","fix",1,"ide",0,[],"vscode"],[50,"一部の language server の diagnostics が \"[object Object]\" ではなくルールコード（例: MD013）を表示する","[VSCode] Fixed diagnostics showing \"[object Object]\" instead of the rule code (e.g. MD013) for some language servers","I","fix",1,"ide",0,[],"vscode"],[51,"dictation が提供されない環境（claude.ai 以外のサインイン、リモートウィンドウ）で、ネイティブ音声モジュールを読み込まない","[VSCode] Fixed the native dictation audio module being loaded, to check microphone permission, where dictation is not offered (non-claude.ai sign-ins, remote windows)","I","fix",1,"ide",0,[],"vscode"]]},{"v":"2.1.300","date":"2026-10-14（水）23:27","dshort":"10-14 23:27","nb":6,"head":"mod拡張とエージェント・worktree周りの修正が中心","sum":"v2.1.300 は mod 向け API の追加と、バックグラウンドエージェント、セッション復元、`--worktree`、reftable リポジトリに関する修正が中心のリリースです。hooks の `updatedInput` 検証や終了時のバックグラウンドコマンド強制終了など、挙動が変わる点もあります。VS Code 拡張、Remote Control、Claude Tag、Code Review にも多数の修正があります。","watch":[{"b":"hooks の `updatedInput` は検証され、未知のキーは削除され、ツールが拒否する入力は呼び出しが拒否されるため、hooks の出力を確認してください。","r":[65]},{"b":"終了時にバックグラウンドコマンドが 1.5 秒後に強制終了されるため、終了後も続けたい処理は別の手段で実行してください。","r":[56]},{"b":"api.anthropic.com への大きなリクエストはテレメトリ無効でも gzip 圧縮されるため、不要なら `CLAUDE_CODE_GZIP_REQUEST_BODIES=0` を設定してください。","r":[59]},{"b":"`CLAUDE_CODE_PROVIDER_MANAGED_BY_HOST` のセッションは `SSL_CERT_FILE` などの CA バンドル・プロキシ・git 関連変数を設定から無視するため、必要な値はホスト側で設定してください。","r":[55]},{"b":"`claude remote-control` の `--sandbox` と `--no-sandbox` は削除されエラー終了するため、スクリプトから外し、設定の `sandbox.enabled` を使ってください。","r":[66]},{"b":"`claude gateway` は Claude Desktop が使えない `desktop:` ポリシーキーがあると、警告ではなくキー名を示して起動を止めるため、該当キーを除いてください。","r":[58]},{"b":"ローカル transcript に各 API リクエストの system prompt、tools、パラメータも記録されるため、共有前に内容を確認してください。","r":[62]},{"b":"Cowork クラウドセッションでは `PermissionRequest` hook の allow に含む `setMode` が無視されるため、モード変更は別の方法で行ってください。","r":[64]},{"b":"Claude Desktop の Code タブは、`forceLoginGatewayUrl` が Anthropic 運用のゲートウェイを指す場合に管理設定を適用し、そのゲートウェイは起動時に到達可能である必要があります。","r":[57]},{"b":"バックグラウンドセッションは引き継いだ workflow を、handoff ファイルからの実行ではなく Workflow ツールの承認経由で再開するため、承認操作が必要です。","r":[61]}],"hl":[{"t":"hook の updatedInput を検証","b":"PreToolUse と PermissionRequest hook が返す `updatedInput` は、Claude 自身の入力と同じ方法で検証されるようになりました。未知のキーは除去され、ツールが受け付けない入力は呼び出し自体が拒否されます。","r":[65,64]},{"t":"終了時にバックグラウンドを停止","b":"終了時、停止要求から 1.5 秒後も動いているバックグラウンドコマンドは強制終了されるようになりました。バックグラウンドコマンドが実行中のまま終了しても、SessionEnd hook が実行されるよう修正されています。","r":[56,11]},{"t":"--worktree 起動の修正","b":"`--worktree` 起動時に、コミット ID に似た名前の tag や branch があると誤ったコミットから始まる問題などを修正しました。reftable を使うリポジトリや bare リポジトリの worktree でも動くようになり、plugin の `WorktreeCreate`/`WorktreeRemove` hook も実行されます。","r":[29,30,33,24]},{"t":"セッション再開時の履歴欠落","b":"クラッシュで transcript の末尾行が欠けていると、再開後に最初に書いたエントリが失われる問題を修正しました。headless・Agent SDK セッションの再開時に、compaction の要約や保持メッセージが失われる問題も修正されています。","r":[22,37,40]},{"t":"claude remote-control の変更","b":"`claude remote-control` から効果のなかった `--sandbox`/`--no-sandbox` が削除され、指定するとエラーで終了するようになりました。一時的なサインインエラー後の接続更新の再試行と、複数セッション提供時の停止表示も修正されています。","r":[66,32,39]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"Cowork クラウドセッションでの Write/Edit/NotebookEdit の誤った成功報告が修正され、`/sandbox` の表記が変わり、`PermissionRequest` hook の `setMode` が無視されます。","refs":[45,63,64]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"バックグラウンドエージェントと `claude agents`、`/tasks` の表示や復帰に関する修正が多く、`claude daemon stop` の挙動も改善されました。終了時の強制終了が変わります。","refs":[13,14,15,16,17,41,43,44,54,56,61]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"mod 向けに `virtualText`、`$.ui.view({ agentId })`、`dir` prop、`prompt.change` hook が追加され、`agent.spawn` hook で workflow agent の `prompt` と `model` を書き換えられます。`prompt.submit` の書き換えが OpenTelemetry に反映されない問題や、agent hooks の `model` 無視も直っています。","refs":[1,3,4,7,8,11,24,26,27,28,35,52,60,65]},{"a":"S","name":"セッション・履歴・圧縮","dg":"セッション保存・復元、`--worktree`、`/branch`、`claude purge` の不具合が修正され、transcript に API リクエスト情報が記録されます。","refs":[10,22,23,29,30,31,33,37,40,62]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP ツールの入力スキーマ拒否時の 400 エラーと、compaction 後の MCP ツール通知の遅れが修正されました。`claude remote-control` の `--sandbox` 系フラグは削除されています。","refs":[36,38,51,66,79]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VS Code 拡張では `claudeCode.attachSelection` が追加され、fast mode、ドラッグ、履歴呼び出しなどが修正されました。Remote Control、クラウドセッション、Claude Tag（Slack Connect 対応など）、Code Review も更新されています。","refs":[9,20,32,34,39,48,49,57,67,68,69,70,71,72,73,74,75,76,77,78,81,82,83,84,85,86,87,88]},{"a":"H","name":"headless・SDK・API","dg":"OpenTelemetry に cache 書き込みの寿命別トークン数と GenAI 属性が加わり、reftable での `git_commit_id` 欠落も直りました。`forceLoginOrgUUID` で拒否された組織のトークンが残る問題も修正されています。","refs":[2,6,19,25,50,55,58,59]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"`/advisor` が Claude Platform on AWS で使えるようになり、自動ツール検索が会話の途中で無効になる問題が修正されました。","refs":[5,18,46,53]},{"a":"U","name":"UI・表示・入力","dg":"`--restricted` のヘルプ文、Artifact ツールの表示、dim テキストの見分けにくさ、クラウドセッションの / メニューの説明欠落が修正されました。","refs":[12,21,47,80]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"OS の証明書ストアだけで信頼される TLS 検査プロキシの背後で、feature flag が更新されない問題が修正されました。","refs":[42]}],"skip":"表示の乱れ、まれな環境での不具合、VS Code・Slack・Code Review の細かな修正が約 50 件あります。","st":"ok","stale":false,"e":[[1,"mod のプロンプト装飾に `virtualText` を追加。入力欄に表示され下書きや送信内容には入らない","Added `virtualText` to a mod's prompt decorations: text drawn in the prompt box that never enters the draft or the submitted prompt","M","new",1,"mod-dev",0,[],"plugins-mods"],[2,"OpenTelemetry `api_request` イベントにキャッシュ書き込みを寿命別に分けた `cache_creation_5m_tokens` と `cache_creation_1h_tokens` を追加","Added `cache_creation_5m_tokens` and `cache_creation_1h_tokens` to the OpenTelemetry `api_request` event, splitting cache writes by lifetime","H","new",1,"sdk,admin",0,[],"telemetry"],[3,"mod 向け `$.ui.view({ agentId })` でエージェントの transcript をメイン表示にでき、`$.ui.view({})` で戻る","Added `$.ui.view({ agentId })` for mods: shows an agent's transcript in the main view when you ask, and `$.ui.view({})` goes back","M","new",1,"mod-dev",0,[],"plugins-mods"],[4,"mod の `Text` に右から左の文字用 `dir` prop を追加。Windows と VS Code ターミナルで右寄せ表示","Added a `dir` prop on a mod's `Text` for right-to-left text: on Windows and in VS Code's terminal its rows read in that direction and sit flush right","M","new",1,"mod-dev,windows",0,[],"plugins-mods"],[5,"Claude Platform on AWS で `/advisor` を利用可能に。`CLAUDE_CODE_DISABLE_ADVISOR_TOOL=1` で無効化","Added `/advisor` on Claude Platform on AWS; no advisor runs until you pick one with `/advisor`, `advisorModel` or `--advisor`, and `CLAUDE_CODE_DISABLE_ADVISOR_TOOL=1` turns it off","L","new",1,"cli",0,[],"model-selection"],[6,"トレースの span に `gen_ai.provider.name` など OpenTelemetry GenAI semantic convention 属性を追加","Added OpenTelemetry GenAI semantic-convention attributes to trace spans, such as `gen_ai.provider.name`, `gen_ai.conversation.id`, `gen_ai.tool.name` and `error.type`","H","new",1,"sdk,admin",0,[],"telemetry"],[7,"`agent.spawn` mod hook でワークフローエージェントの `prompt` と `model` を書き換え可能に","Added support for rewriting a workflow agent's `prompt` and `model` in the `agent.spawn` mod hook, which could only refuse workflow agents before","M","new",1,"mod-dev",0,[],"hooks"],[8,"入力欄の文字が履歴呼び出し・クリア・undo・plugin 入力などで変わると `prompt.change` mod hook が発火","Added the `prompt.change` mod hook, raised when the prompt box's text changes without a typed edit: a recalled history entry, a clear, an undo, or a plugin's fill","M","new",1,"mod-dev",0,[],"hooks"],[9,"cloud session が、実際はセッション自身のネットワーク設定による遮断なのに組織ポリシーのせいと Claude に伝える問題を解消","Fixed cloud sessions telling Claude that an organization policy blocked a host when the session's own network settings did","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[10,"`/autocompact` で小さい auto-compact ウィンドウを選んでも高トークン使用量の警告が出ない","Fixed `/autocompact` warning about high token usage when you choose a smaller auto-compact window","S","fix",1,"cli",0,[],"compaction-context"],[11,"バックグラウンドコマンド実行中に終了しても SessionEnd hook が確実に実行される","Fixed SessionEnd hooks sometimes not running when you exit while a background command is still running","M","fix",2,"cli",0,[],"hooks"],[12,"`claude --help` の `--restricted` 説明から削除済みツールの名前を除去","Fixed `claude --help` naming a removed tool in its description of `--restricted`","U","fix",1,"cli",0,[],"slash-commands"],[13,"`claude agents` で一部の PR データが不完全でも他の PR の状態を更新する","Fixed `claude agents` not refreshing any pull request's status when the data for one of them came back incomplete","A","fix",1,"cli",0,[],"subagents"],[14,"cloud session のコンテナ交換後、一度再開済みのバックグラウンドエージェントを「再開不可で失われた」と Claude に伝えない","Fixed Claude being told a background agent was lost, not resumable, after a cloud session's container was replaced, when the agent had already been resumed once","A","fix",1,"cloud",0,[],"background-tasks"],[15,"メッセージを送ったサブエージェントが完了直後に `/tasks` から消えず、会話に戻れる","Fixed subagents you had typed messages to disappearing from `/tasks` shortly after finishing, leaving no way back to the conversation","A","fix",2,"cli",0,[],"subagents"],[16,"子エージェント表示中に完了した親エージェントが breadcrumb から外れず、子が最上位扱いにならない","Fixed a completed parent agent dropping off the breadcrumb (its child shown re-rooted at top level) while you were viewing the child","A","fix",1,"cli",0,[],"subagents"],[17,"agents ビューで入力が一括到着しても「up」「escape」などの単語をキー操作と誤認しない","Fixed the agents view taking a typed word such as \"up\", \"down\" or \"escape\" for that key when input arrived in a burst, which could move the peek mid-reply or clear a draft","A","fix",1,"cli",0,[],"subagents"],[18,"MCP サーバー再接続中などに自動ツール検索 (`ENABLE_TOOL_SEARCH=auto`) が会話途中で無効にならない","Fixed automatic tool search (`ENABLE_TOOL_SEARCH=auto`) turning off part-way through a conversation, for example while MCP servers reconnect after a resume","L","fix",2,"cli",0,[],"mcp"],[19,"`forceLoginOrgUUID` に拒否されたログインで、拒否された組織のトークンが残らず `/login` 後も有効にならない","Fixed a login refused by `forceLoginOrgUUID` leaving the refused organization's token stored, or live after `/login`","H","fix",2,"admin",0,[],"auth-login"],[20,"Claude Desktop と Remote Control の diff 表示が reftable リポジトリの cherry-pick・revert コンフリクトを検出","Fixed the diff view in Claude Desktop and Remote Control sessions not noticing a conflicted cherry-pick or revert in reftable repositories","I","fix",1,"ide,cloud",0,[],"desktop"],[21,"Artifact ツールの表示が入力到着中に `(unprintable path)` とならず、Bash 同様 \"Waiting…\" と \"Running…\" を表示","Fixed the Artifact tool's verbose and ctrl+o line reading `Artifact(\"(unprintable path)\")` while a call's input arrives; its row now shows \"Waiting…\" and \"Running…\" as Bash's does","U","fix",1,"cli",0,[],"artifacts"],[22,"クラッシュで transcript 末尾行が欠けても、再開後に最初に書いたエントリが失われない","Fixed the first transcript entry written after resuming a session being lost when a crash had cut the transcript's last line short","S","fix",2,"cli",0,[],"sessions-resume"],[23,"Unicode 行・段落区切り (U+2028/U+2029) を含んでも `/branch` がメッセージを落とさず `claude purge` がサブフォルダを飛ばさない","Fixed `/branch` dropping messages, and `claude purge` skipping subfolder projects, when they contain a Unicode line or paragraph separator (U+2028, U+2029)","S","fix",1,"cli",0,[],"sessions-resume"],[24,"`--worktree` 起動時にも plugin の `WorktreeCreate`/`WorktreeRemove` hook が実行される（`--tmux` は未対応）","Fixed plugin `WorktreeCreate` and `WorktreeRemove` hooks not running when Claude Code starts with `--worktree` (not yet with `--tmux`)","M","fix",1,"mod-dev",0,[],"hooks"],[25,"reftable ref storage のリポジトリで `git commit -q` 後も OpenTelemetry `tool_result` に `git_commit_id` が入る","Fixed OpenTelemetry `tool_result` events missing `git_commit_id` after `git commit -q` in repositories using reftable ref storage","H","fix",1,"sdk",0,[],"telemetry"],[26,"mod の `prompt.submit` hook が書き換え・破棄したプロンプトを OpenTelemetry や session title リクエストに入力のまま記録しない","Fixed a prompt that a mod's `prompt.submit` hook rewrote or dropped still being recorded as typed in the OpenTelemetry `user_prompt` event and interaction span, and in session title requests","M","fix",1,"mod-dev,sdk",0,[],"hooks"],[27,"mod ホットリロードに関する Claude 向けの注記が、ユーザー入力として transcript に表示されない","Fixed a note meant for Claude about mod hot-reloading appearing in the transcript as if you had typed it","M","fix",1,"mod-dev",0,[],"plugins-mods"],[28,"agent hook が `model` を尊重。`haiku` などのエイリアス解決、サブエージェントによる上書き防止、利用不可時は呼び出し側モデルへフォールバック","Fixed agent hooks ignoring their `model`: aliases like `haiku` now resolve, a subagent's model no longer overrides it, and an unavailable model falls back to the caller's instead of allowing the action","M","fix",2,"mod-dev,admin",0,[],"hooks"],[29,"`--worktree` で tag/branch 名がコミット ID に似ていても正しいコミットから開始し、初期 git status も新 worktree のブランチを示す","Fixed `--worktree` sessions sometimes starting from the wrong commit when a tag or branch was named like a commit ID, and their starting git status naming a branch other than the new worktree's","S","fix",2,"cli",0,[],"worktree"],[30,"git reftable ref storage で、ブランチが \".invalid\" と表示されず `--worktree` が worktree を再度開ける","Fixed the branch showing as \".invalid\" and `--worktree` failing to reopen a worktree in repositories using git's reftable ref storage","S","fix",2,"cli",0,[],"worktree"],[31,"Claude がセッション scratchpad のファイルを、ファイル名のみや相対パスでなくフルパスで示す","Fixed Claude naming files in the session scratchpad by a bare filename or relative path instead of their full path","S","fix",1,"cli",0,[],"memory"],[32,"`claude remote-control` が keychain ロックなど一時的なサインインエラー後も接続更新を再試行し、`claude /login` が必要なら警告","Fixed `claude remote-control` servers giving up on renewing their connection after a brief sign-in error, such as a locked keychain; they now retry, and warn when you need to run `claude /login`","I","fix",2,"cloud",0,[],"remote-control"],[33,"bare リポジトリの worktree で origin の既定ブランチを取得できなくても `--worktree` が動作し、フォールバック基点は現在のチェックアウトの HEAD","Fixed `--worktree` failing in a worktree of a bare repository when origin's default branch can't be fetched; the fallback base is now the current checkout's HEAD, not the main repository's","S","fix",1,"cli",0,[],"worktree"],[34,"VS Code・Cursor・Devin Desktop の統合ターミナル起動時、拡張確認のためエディタ CLI を二重起動せず一度だけ起動","Fixed starting Claude Code in a VS Code, Cursor or Devin Desktop integrated terminal launching the editor's command-line tool twice to check for the extension; it now launches it once","I","fix",1,"ide",0,[],"vscode"],[35,"`chat:newline` キーバインド (Ctrl+J など) で改行しても mod の `prompt.edit` hook が発火","Fixed a mod's `prompt.edit` hook not being raised for a newline entered with the `chat:newline` keybinding (Ctrl+J, or a rebound Enter)","M","fix",1,"mod-dev",0,[],"hooks"],[36,"API が MCP ツールの入力 schema を拒否して毎ターン 400 になる問題を解消。以後そのツールはパラメータなしで送信","Fixed a conversation failing on every turn with a 400 error when the API rejected an MCP tool's input schema; Claude Code now sends that tool without parameters for the rest of the conversation","C","fix",2,"cli",0,[],"mcp"],[37,"出力トークン上限で切れた応答の後の compaction でも、headless/SDK セッション再開時に保持メッセージが失われない（この版以降の compaction）","Fixed resuming a headless or Agent SDK session losing the recent messages a compaction had kept, when the compaction followed a reply cut at the output token limit (compactions from this version on)","S","fix",2,"sdk",0,[],"sessions-resume"],[38,"compaction 後に接続が完了した MCP サーバーのツールと instructions を、次のツール呼び出しを待たず Claude に伝える","Fixed Claude not being told about an MCP server's tools and instructions until its next tool call, when the server finished connecting after a compaction","C","fix",1,"cli",0,[],"mcp"],[39,"1台で複数セッションを提供する Remote Control が、実行中のセッションを停止扱いにしない","Fixed Remote Control sessions being marked stopped while still running, on a computer serving several sessions at once","I","fix",2,"cloud",0,[],"remote-control"],[40,"再試行や未完了の応答後の compaction でも、headless/SDK セッション再開時に要約が消えたり圧縮前履歴が戻ったりしない","Fixed resuming a headless or Agent SDK session losing its compaction summary or bringing back pre-compaction history, when the compaction followed a retried or unfinished reply in the same turn","S","fix",2,"sdk",0,[],"sessions-resume"],[41,"Claude がバックグラウンドコマンドの出力ファイルをポーリングしたり sleep したりしない","Fixed Claude polling a background command's output file or sleeping while it runs","A","fix",1,"cli",0,[],"background-tasks"],[42,"OS 証明書ストアのみで信頼される TLS 検査 proxy の背後でも feature flag と段階的ロールアウトが古くならない","Fixed feature flags and staged rollouts staying stale behind a TLS-inspecting proxy whose certificate is trusted only through the OS certificate store","O","fix",2,"cli,admin",0,[],"proxy-network"],[43,"`claude daemon stop --any` が停止を待ち、固まったサービスを強制終了。残る場合はその旨を表示し exit 1","Fixed `claude daemon stop --any` printing \"stopped\" while a stuck background service kept running: it now waits, force-kills the service, and says so with exit 1 if it is still there","A","fix",1,"cli",0,[],"daemon"],[44,"telemetry 無効時も `claude daemon stop` が出力し、セッションを実行中のまま残さない","Fixed `claude daemon stop` exiting with no output, and leaving sessions listed as running, when telemetry is turned off","A","fix",1,"cli",0,[],"daemon"],[45,"Cowork cloud session で自分のPC上のパスへの Write/Edit/NotebookEdit が、届かないのに成功と報告しない","Fixed Write, Edit and NotebookEdit in Cowork cloud sessions reporting success for a path on your own computer, where the file never arrived","T","fix",2,"cloud",0,[],"read-edit-tools"],[46,"履歴に一覧がない再開セッションで、読み込み済みの deferred tool を Claude が再検索しない","Fixed Claude searching for deferred tools already loaded earlier in the conversation when a session resumes a history that never listed them","L","fix",1,"cli",0,[],"mcp"],[47,"ダーク ANSI テーマや16色端末で、薄い補助テキストが通常テキストと同じ見た目にならない","Fixed secondary (dim) text looking the same as normal text under the dark ANSI theme and on 16-color terminals","U","fix",1,"cli",0,[],"output-rendering"],[48,"組織ポリシーを読めない cloud session が毎ターン5分ハングせず、すぐ終了して理由を表示","Fixed cloud sessions hanging 5 minutes per turn when the organization's policy can't be read; the turn now ends promptly and says why","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[49,"長い応答中の再起動後、cloud session が回答済みメッセージを再実行しない","Fixed a cloud session sometimes running an already answered message a second time after the session restarted during a long reply","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[50,"出力が読まれなくても runner と orchestrator が固まらない。ログは直近256 KiBを保持し破棄数を記録（Windows 除く）","Self-hosted runner: Fixed the runner and orchestrator freezing (no polls, `/healthz` or `SIGTERM` shutdown) while nobody reads their output; logs keep the latest 256 KiB and count drops (not on Windows)","H","fix",1,"sdk,admin",0,[],"self-hosted-runner"],[51,"Cowork cloud session の WebFetch が、直前に失敗したページは再取得せず Claude に失敗を伝える","Improved WebFetch in Cowork cloud sessions to tell Claude that a page failed moments ago instead of fetching it again","C","improve",1,"cloud",0,[],"web-fetch-search"],[52,"組み込み `plugin-authoring` skill の mod 共有で、ファイルを開く前にキーを走査し、プロジェクト外フォルダは確認する","Improved mod sharing in the built-in `plugin-authoring` skill: Claude scans a mod's files for keys before opening them, and asks before scanning a folder outside the project","M","improve",1,"mod-dev",0,[],"skills"],[53,"Claude 3 モデルへの @ 指定 PDF の注記を改善し、読まずに答えることを減らす","Improved the note Claude 3 models get about an @-mentioned PDF, so they less often answer without reading it","L","improve",1,"cli",0,[],"model-selection"],[54,"artifact 更新で、小さな変更は1回の呼び出しで適用して再公開し、大きな編集も1回の応答内で再公開","Improved artifact updates: Claude now applies a small change and republishes the artifact in one call, and makes larger edits and republishes within a single response","A","improve",1,"cli",0,[],"artifacts"],[55,"`CLAUDE_CODE_PROVIDER_MANAGED_BY_HOST` セッションは設定内の CA bundle・tool proxy・git TLS・git config 系変数を無視（Desktop では project settings のみ）","Changed `CLAUDE_CODE_PROVIDER_MANAGED_BY_HOST` sessions to ignore CA-bundle, tool-proxy, git TLS and git config variables like `SSL_CERT_FILE` in settings; under Claude Desktop, only in project settings","H","change",2,"admin,ide",1,[],"managed-settings"],[56,"終了時、停止要求から1.5秒後も動くバックグラウンドコマンドを強制終了（fullscreen では残る場合があった）","Changed exit to force-kill background commands still running 1.5 seconds after being asked to stop; in fullscreen mode they could previously be left running","A","change",2,"cli",0,[],"background-tasks"],[57,"`forceLoginGatewayUrl` が Anthropic 運営の対応ゲートウェイなら Claude Desktop の Code タブが managed settings を適用。起動時に到達可能が必要","Changed Claude Desktop's Code tab to apply managed settings when `forceLoginGatewayUrl` names an Anthropic-operated gateway that serves the session's hostname; that gateway must be reachable at start","I","change",2,"ide,admin",1,[],"managed-settings"],[58,"`claude gateway` は Desktop がゲートウェイで使えない `desktop:` policy key があるとキー名を示して起動を停止（以前は警告のみ）","Changed `claude gateway` to stop at start, naming the key, on a `desktop:` policy key that Claude Desktop cannot use from a gateway, where it earlier started with a warning","H","change",2,"admin",1,[],"managed-settings"],[59,"api.anthropic.com への大きなリクエストは telemetry 無効でも gzip 圧縮。`CLAUDE_CODE_GZIP_REQUEST_BODIES=0` で無効化","Changed large requests to api.anthropic.com to use gzip compression even when telemetry is disabled; set `CLAUDE_CODE_GZIP_REQUEST_BODIES=0` to turn it off","H","change",2,"cli,admin",0,[],"proxy-network"],[60,"`claude-api` skill は、アーカイブや削除を頼まれない限り Managed Agents セッションをそのまま残す","Changed the `claude-api` skill to leave Managed Agents sessions in place unless you ask to archive or delete them","M","change",1,"cli",0,[],"skills"],[61,"バックグラウンドセッションは引き継いだワークフローを、handoff ファイルから実行せず Workflow ツールの承認経由で再開","Changed background sessions to resume a carried workflow through the Workflow tool's approval instead of running it from the handoff file","A","change",1,"cli",0,[],"background-tasks"],[62,"ローカル session transcript が各 API リクエストの system prompt・tools・parameters も記録し、共有時にリクエストを再現可能","Changed local session transcripts to also record each API request's system prompt, tools and parameters, so a transcript you choose to share can reproduce a request exactly","S","change",2,"cli",0,[],"sessions-resume"],[63,"`/sandbox` のモード表示を \"Sandbox BashTool\" から \"Sandbox commands\" に変更","Changed the `/sandbox` mode options to read \"Sandbox commands\" instead of \"Sandbox BashTool\"","T","change",1,"cli",0,[],"sandbox"],[64,"Cowork cloud session の `PermissionRequest` hook で、allow 内の `setMode` 更新は無視され、承認の残りは適用","Changed `PermissionRequest` hooks in Cowork cloud sessions: a `setMode` update in a hook's allow is now ignored; the rest of the approval still applies","T","change",2,"cloud,admin",1,[],"hooks"],[65,"PreToolUse/PermissionRequest hook の `updatedInput` を検証。未知のキーは除去され、ツールが拒否する入力は呼び出し拒否","Changed hooks: `updatedInput` from PreToolUse and PermissionRequest hooks is now validated like Claude's own input: unknown keys are dropped, and input the tool rejects denies the call","M","change",3,"mod-dev,admin",1,[],"hooks"],[66,"`claude remote-control` から効果のなかった `--sandbox`/`--no-sandbox` を削除。指定するとエラー終了。サンドボックスは `sandbox.enabled` で設定","Removed the `--sandbox` and `--no-sandbox` flags from `claude remote-control`, which had no effect; passing either now exits with an error. Set `sandbox.enabled` in settings to sandbox sessions","C","change",2,"cloud,admin",1,[],"remote-control"],[67,"`claudeCode.attachSelection` 設定を追加し、エディタの選択テキストがメッセージに付くのを止められる","[VSCode] Added the `claudeCode.attachSelection` setting to stop text selected in the editor from being added to your messages","I","new",2,"ide",0,[],"vscode"],[68,"利用クレジット切れ後に fast mode が有効のままリクエスト拒否と再送を繰り返さず、エラー通知とともにオフになる","[VSCode] Fixed fast mode staying on after usage credits ran out, which made each request be refused and re-sent; it now turns off until you turn it back on, with an error notice","I","fix",2,"ide",0,[],"vscode"],[69,"常に thinking するモデルで Thinking トグルが Off に切り替わらず、そのモデルではトグルを非表示にする","[VSCode] Fixed the Thinking toggle switching to Off on models that always think; the toggle is no longer shown for those models","I","fix",1,"ide",0,[],"vscode"],[70,"フラグ付きメッセージの \"Edit prompt\" で復元プロンプト上にメニューが開かず、Enter でそのまま送信","[VSCode] Fixed \"Edit prompt\" on a flagged message opening the file or command menu over the restored prompt; Enter now sends it as written","I","fix",1,"ide",0,[],"vscode"],[71,"Windows で Shift+ドラッグしたファイルが `/c:/…` ではなく作業ディレクトリ相対の mention として挿入される","[VSCode] Fixed Shift+dragging a file onto the prompt on Windows inserting an unreadable `/c:/…` path instead of a mention relative to the working directory","I","fix",1,"ide,windows",0,[],"vscode"],[72,"VS Code のチャットフォントサイズ設定が再読み込み不要でテーマ変更にも消されず、diff と plan preview にも反映","[VSCode] Fixed changes to VS Code's chat font size settings needing a window reload or being undone by a theme change; diffs and the plan preview now follow them too","I","fix",1,"ide",0,[],"vscode"],[73,"\"Resume session\" と再読み込み後に復元されたタブが、git worktree に移った会話を開く","[VSCode] Fixed \"Resume session\" and tabs restored after a reload opening an empty new conversation instead of one that had moved into a git worktree","I","fix",2,"ide",0,[],"vscode"],[74,"↑ で呼び出したスラッシュコマンドを Enter で引数付きで実行。編集するまでメニューは開かない","[VSCode] Fixed ↑ then Enter on a recalled slash command running it without its arguments; the command and file menus no longer open over a recalled prompt until you edit it","I","fix",2,"ide",0,[],"vscode"],[75,"WSL・SSH・Dev Container で Explorer やエディタータブから Shift+ドラッグしたファイルがプロンプトに挿入される","[VSCode] Fixed Shift+dragging a file from the Explorer or an editor tab onto the prompt inserting nothing in WSL, SSH and Dev Container windows","I","fix",1,"ide",0,[],"vscode"],[76,"Windows/Linux で Ctrl+Alt+F が Explorer などの Find を開き、Focus view を切り替えない","[VSCode] Fixed Ctrl+Alt+F toggling Focus view instead of opening Find in the Explorer, other tree views, or the Debug Console on Windows and Linux","I","fix",1,"ide,windows",0,[],"vscode"],[77,"macOS で他ウィンドウのセッション確認時に、毎回 PATH 検索せず `/bin/ps` を直接起動し余分なプロセスを作らない","[VSCode] Fixed the check for sessions open in other windows or terminals creating extra processes on macOS: it now starts `/bin/ps` directly instead of searching PATH for `ps` on every check","I","fix",1,"ide,macos",0,[],"vscode"],[78,"Windows 再起動で古い PID が別プログラムに再利用された場合、クラッシュ後の会話が \"still open somewhere else\" と表示されない","[VSCode] Windows: Fixed a conversation showing \"still open somewhere else\" after a crash or power loss, when Windows had since restarted and given the old process ID to another program","I","fix",1,"ide,windows",0,[],"vscode"],[79,"組織が \"Always allow\" を無効にしたコネクタツールの Cowork 承認で \"Allow for this task\" が表示される（2.1.292 の回帰）","[Cloud sessions] Fixed \"Allow for this task\" missing from Cowork's approval prompts for connector tools where an organization turns off \"Always allow\" (regression in 2.1.292)","C","fix",2,"cloud,admin",0,[],"web-cloud-sessions"],[80,"cloud session で2通目以降も / メニューのほとんどのコマンドの説明が消えない","[Cloud sessions] Fixed most commands in the / menu losing their descriptions in cloud sessions once you sent a second message","U","fix",1,"cloud",0,[],"web-cloud-sessions"],[81,"claude.ai とデスクトップアプリの Remote Control diff で削除・名前変更ファイルが変更扱いにならない（手元で v2.1.296 以降が必要）","[Remote Control] Fixed the diff view in Remote Control sessions on claude.ai and the desktop app showing deleted and renamed files as modified; requires Claude Code v2.1.296 or later on your machine","I","fix",1,"cloud",0,[],"remote-control"],[82,"Slack Connect チャンネルに対応。Owner か Claude Tag 管理者が他組織との共有チャンネルでの応答を許可でき、既定はオフ","[Claude Tag] Added support for Slack Connect channels: an Owner or Claude Tag admin can let Claude in Slack answer in channels shared with another organization; it's off by default","I","new",2,"cloud,admin",0,[],"claude-tag"],[83,"承認が必要なコネクタ操作に、Slack スレッドで本人だけに見える Allow once / Deny カードを追加。他の人には承認待ちとだけ表示","[Claude Tag] Added a private Allow once / Deny card in Slack threads for connector actions that need your approval, so Claude asks instead of refusing; others only see that it's waiting on you","I","new",2,"cloud",0,[],"claude-tag"],[84,"Claude in Slack が Slack の文字起こしがある音声クリップを読めるようになる","[Claude Tag] Added support for Slack voice clips in Claude in Slack: Claude reads Slack's transcript of a clip when Slack has one","I","new",1,"cloud",0,[],"claude-tag"],[85,"Claude 自身が投稿したメッセージのスレッドでタグ付けした別アプリに、Claude in Slack が応答する","[Claude Tag] Fixed Claude in Slack not answering another app that tags it in a thread under a message Claude itself posted to the channel","I","fix",1,"cloud",0,[],"claude-tag"],[86,"管理者が Slack チャンネルに付けた access bundle は、Slack Connect チャンネル化後も外して付け直さずに適用され続ける","[Claude Tag] Changed access bundles an admin attached to a Slack channel to keep applying once the channel becomes a Slack Connect channel, with no need to remove and re-attach them","I","change",1,"cloud,admin",0,[],"claude-tag"],[87,"GitHub 組織メンバーシップが非公開の write 権限者による `@claude review` コメントでも Code Review が開始","[Code Review] Fixed Code Review ignoring `@claude review` comments from people with write access whose GitHub organization membership is private; their comments now start a review","I","fix",2,"cloud",0,[],"code-review"],[88,"Code Review の \"paused for this repository\" コメントが、修正できる人を示し Git providers ページへリンクする","[Code Review] Fixed Code Review's \"paused for this repository\" comment sending admins to Code Review settings; it now says who can fix it and links the Git providers page","I","fix",1,"cloud,admin",0,[],"code-review"]]},{"v":"2.1.299","date":"2026-10-14（水）09:23","dshort":"10-14 09:23","nb":14,"head":"MCP許可規則・サンドボックス・ゲートウェイ鍵送信の安全性修正と、mod基盤の更新","sum":"v2.1.299はセキュリティと権限判定の修正が中心で、サンドボックス、MCP許可規則、サードパーティゲートウェイのAPIキー送信、plan modeでのフック判定に及びます。あわせて、ターミナルのアイドル時コンパクションの追加、クラウド/Remote Control/VS Codeの安定化、mod関連の挙動変更が含まれます。ゲートウェイ、MCP、modを使う開発者と組織管理者に影響が大きい内容です。","watch":[{"b":"`mcp__a` のような許可規則は名前が一致するサーバーだけに効くようになったため、`a__b` などを許可していた場合は `mcp__\u003cserver\u003e__*` に書き直してください。","r":[158]},{"b":"agent の `tools:` リストは指定した MCP サーバーのツールだけを対象にするため、名前に `__` を含むサーバーは `mcp__\u003cwhole name\u003e__*` で列挙してください。","r":[159]},{"b":"`UserPromptSubmit` フックがスキル/コマンド展開前に走り、スキル自身の front-matter フックは次のプロンプトから動くため、フックの前提とする入力を見直してください。","r":[167,168]},{"b":"ブロック可能なアクションは、フックが処理できない場合に通過ではなく拒否されるため、フックの失敗時に作業が止まらないか確認してください。","r":[151]},{"b":"Cowork クラウドセッションの auto mode では `PermissionRequest` フックがシェルコマンドとサブエージェントを承認できなくなったため、自動承認に頼る運用を見直してください。","r":[163]},{"b":"終了時に表示される再開コマンドはセッション名ではなく ID を使うため、名前を前提にしたスクリプトや手順があれば ID に切り替えてください。","r":[164]},{"b":"claude.ai のコネクタプロキシ、Anthropic ホストの MCP サーバー、クラウドとセルフホストランナーの MCP プロキシは HTTP リダイレクトを辿らなくなったため、リダイレクトに依存する構成は URL を直接指定してください。","r":[152,153]},{"b":"隠し文字や方向制御文字、空白に見える文字、`\u003c`、`\u003e` を含む名前のスキル/コマンドは読み込まれなくなったため、該当するものは名前を変更してください。","r":[154]},{"b":"`claude plugin test` の `ui.render` ツリーには `part: { plugin }` が付き、served `$` メソッドは10秒で失敗するため、完全一致のアサーションとタイムアウトを調整してください。","r":[155,157]},{"b":"プラグインフックとワークフロースクリプトは28,000階層を超える戻り値を拒否するため、深いネストの値を返している場合は構造を浅くしてください。","r":[150]}],"hl":[{"t":"放置した長い会話の自動圧縮","b":"ターミナルで 200K トークン以上の会話を約54分放置すると、1時間のプロンプトキャッシュが切れる前に自動で圧縮されるようになりました。最小トークン数は `CLAUDE_CODE_IDLE_COMPACT_MIN_TOKENS` で変えられ、settings.json の `\"idleCompaction\": false` で無効にできます。","r":[2,3]},{"t":"ゲートウェイ用キーの誤送信修正","b":"サードパーティのゲートウェイ用に設定した API キーが、Anthropic 宛ての一部リクエストに付いて送られていた問題が直りました。Anthropic の API キーは引き続き送られます。","r":[70,52]},{"t":"MCP許可規則はサーバー名で一致","b":"MCP の allow ルールは、名前を書いたサーバーにだけ効くようになりました。`mcp__a` は `a__b` や `a_` という名前のサーバーを許可しなくなり、サーバー名の正規化後の全体を `mcp__\u003cserver\u003e__*` の形で書きます。","r":[158,65,159]},{"t":"サンドボックスの境界判定修正","b":"サンドボックス内のコマンドが、symlink やフォルダ名の書き方によって拒否パスを読み書きできたり、`--plugin-dir` フォルダへ書き込めたりした問題が直りました。","r":[106,107,108,27]},{"t":"plan modeで許可済み書き込み停止","b":"plan mode で、`PreToolUse` フックや mod の `tool.check` フックが許可した書き込みが実行されていた問題が直りました。bypass permissions が使える環境では、plan mode がほとんどの編集やコマンドの前に確認しないことを一度だけ知らせるようになりました。","r":[122,11]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"サンドボックス（`--plugin-dir` への書き込み、macOSのシンボリックリンク、glob の再検査）と plan mode のフック判定を修正しました。MCP 許可規則の範囲、Write のエンコーディング保持、Windows のフックの失敗時ブロックも変わっています。","refs":[11,22,27,30,34,40,65,90,97,106,107,108,109,122,126,134,139,141,158,163]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"agent view に `/effort` と `/fast` を追加し、`--safe-mode` や bare mode のバックグラウンドセッションの挙動を修正しました。`--bg` の誤認識やスケジュール実行時刻の表示も直っています。","refs":[9,10,25,74,85,101,110,111,123,124,149,159]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"mod の `$.prompt.media` や `$.session.identity()` などの API を追加し、フックの実行順、`turn.start`、`agent.spawn` の挙動を変更しました。値の受け渡し、ホットリロード、managed 設定との整合の修正が多数あります。","refs":[4,5,6,8,12,15,16,23,36,44,50,54,55,56,58,59,67,71,72,75,82,87,95,102,112,117,118,119,120,132,143,144,145,148,150,151,154,155,157,167,168,169]},{"a":"S","name":"セッション・履歴・圧縮","dg":"アイドル時コンパクションの追加に加え、サブエージェントが多いセッションの再開時のメモリ使用と PDF の @ メンション時のメモリ・ディスク使用を改善しました。終了時の再開コマンド表示も変わっています。","refs":[2,3,57,99,140,164,165]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP のポリシー検査前に接続される問題、HTTP 接続のハング、OAuth ヘッダー未送信、`constructor` などの名前のサーバーの扱いを修正しました。コネクタ関連のリダイレクト禁止やプロトコル版の既定も変わっています。","refs":[32,42,43,45,48,79,80,81,98,104,116,152,153,160,161,162]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"クラウド、Remote Control、VS Code、Slack 連携の安定化が中心で、ワーカー交代時の回答欠落、ファイル送信失敗、入力消失などを直しています。自己ホスト環境の管理画面や Code Review の案内も改善されました。","refs":[13,18,21,24,26,37,38,46,62,64,86,89,92,127,128,129,130,131,138,172,173,174,175,176,177,178,179,180,181,182,183,184,185,186,187,188,189,190]},{"a":"H","name":"headless・SDK・API","dg":"サードパーティゲートウェイへのAPIキー送信、管理設定の取得、承認済みツールの二重実行を修正しました。自己ホスト型ランナーには `--shutdown-drain-sec` が加わり、ヘッドレス実行の終了条件も直っています。","refs":[7,14,19,20,35,41,51,52,53,70,73,76,78,93,94,100,105,114,136,137,166]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"`/usage` に警告を追加し、画像の添付と送信サイズ、出力トークン上限での打ち切り、非ストリーミング時のリトライ漏れを修正しました。WebFetch の effort の決め方も変わっています。","refs":[17,66,68,69,115,125,156]},{"a":"U","name":"UI・表示・入力","dg":"`CLAUDE_CODE_DISABLE_FILE_MENTIONS` を追加しました。CJK・絵文字の折り返し、表の装飾、100%超の使用率表示、ペーストなど表示と入力の不具合を多数修正しています。","refs":[1,31,33,47,49,60,61,63,77,83,84,88,91,96,103,121,142,170,171]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"デバッグログ使用時のメモリ増加と終了時のハング、Windows の PowerShell 孤立プロセスや Git Bash の PATH 問題を修正しました。worktree 作成エラーの説明も改善されています。","refs":[28,29,39,113,133,135,146,147]}],"skip":"表示の乱れ、まれな環境でのクラッシュやハング、クラウド/VS Code/Slack 周辺の細かな不具合修正が多数あります。","st":"ok","stale":false,"e":[[1,"`CLAUDE_CODE_DISABLE_FILE_MENTIONS` で `@` メンションが内容でなくパスだけ渡される","Added `CLAUDE_CODE_DISABLE_FILE_MENTIONS` environment variable: Claude gets the paths of `@` file mentions to read with its file tools, not the files' contents","U","new",2,"cli",0,[],"prompt-input"],[2,"ターミナルで 200K+ トークンの会話が約54分放置されると、1時間キャッシュ失効前に自動圧縮される","Added idle compaction in the terminal: a 200K+ token conversation left idle for about 54 minutes is compacted before its one-hour prompt cache expires, so your next message doesn't reprocess it all","S","new",3,"cli",0,[],"compaction-context"],[3,"`CLAUDE_CODE_IDLE_COMPACT_MIN_TOKENS` で最小値を変更、settings.json の `\"idleCompaction\": false` で無効化（v2.1.290以降）","Added `CLAUDE_CODE_IDLE_COMPACT_MIN_TOKENS` to change idle compaction's 200K-token minimum; `\"idleCompaction\": false` in settings.json turns it off. Both need v2.1.290 or later","S","new",2,"cli",0,[],"compaction-context"],[4,"managed settings の mod の `prompt.submit` フックが `$.prompt.media` で添付画像・文書のバイト列を読める","Added `$.prompt.media` so a `prompt.submit` hook of a mod installed by managed settings can read the bytes of an image or document attached to the prompt","M","new",2,"mod-dev,admin",0,[],"plugins-mods"],[5,"managed settings の mod が `$.session.identity()` でサインイン方法や組織・メールを取得できる","Added `$.session.identity()` for mods installed by managed settings: how the session is signed in, and its organization and email when managed `forceLoginOrgUUID` lists that organization","M","new",2,"mod-dev,admin",0,[],"plugins-mods"],[6,"mod の `Text` に `size`/`weight`/`mono`/`tabular`、`Box` に間隔ステップ追加。`bold` は非推奨","Added `size`, `weight`, `mono` and `tabular` to a mod's `Text` and named spacing steps (`xs` to `xl`) to its `Box`; `bold` is deprecated in favor of `weight`","M","new",2,"mod-dev",0,[],"plugins-mods"],[7,"`claude self-hosted-runner orchestrator` に `--shutdown-drain-sec` を追加。SIGTERM 時に進行中の処理の完了を待つ","Added `--shutdown-drain-sec` to `claude self-hosted-runner orchestrator`: on SIGTERM it stops polling and gives the poll in flight and running spawn hooks up to that many seconds to finish","H","new",2,"sdk",0,[],"self-hosted-runner"],[8,"mod の `skill.prompt` フックがスキルの frontmatter・ソース・プラグイン名・ファイルパスを受け取る","Added the skill's frontmatter, source, plugin name and file path to what a mod's `skill.prompt` hook receives","M","new",1,"mod-dev",0,[],"plugins-mods"],[9,"agent view で `/effort` と `/fast` が新規セッションの初期値を設定。引数なしの `/model` 等はピッカーを開く","Added `/effort` and `/fast` in agent view to set what new sessions start with; a bare `/model`, `/effort` or `/fast` there now opens a picker","A","new",2,"cli",0,[],"slash-commands"],[10,"`--safe-mode` で起動したバックグラウンドセッションの peek パネルに safe mode 表示が出る","Added a \"safe mode\" line to the agents view peek panel for background sessions started with `--safe-mode`","A","new",1,"cli",0,[],"background-tasks"],[11,"bypass permissions が使える時、plan mode が編集やコマンドの前に確認しない旨を一度だけ通知する","Added a one-time note when plan mode won't ask before most edits or commands because bypass permissions is available","T","new",1,"cli",0,[],"permissions"],[12,"`claude plugin eval` に `--disallow-tools` と `disallowed_tools` を追加し、Agent 等を eval から除外できる","Added `--disallow-tools` and a `disallowed_tools` case field to `claude plugin eval` to keep specific built-in tools, such as Agent, out of eval runs","M","new",1,"mod-dev",0,[],"plugins-mods"],[13,"Claude apps gateway の `code` ポリシー `env` に `CLAUDE_CODE_ATTRIBUTION_HEADER=0` で Desktop の Code タブの attribution を無効化できる","Added support for turning off the attribution block in Claude Desktop's Code tab: set `CLAUDE_CODE_ATTRIBUTION_HEADER=0` in the `env` of a Claude apps gateway's `code` policy","I","new",1,"ide,admin",0,[],"desktop"],[14,"Claude apps gateway 経由のセッションの attribution ブロックにフィールド追加。`CLAUDE_CODE_ATTRIBUTION_HEADER=0` で削除可","Added a field to the attribution block in Claude Code sessions behind a Claude apps gateway; remove the block with `CLAUDE_CODE_ATTRIBUTION_HEADER=0`","H","new",1,"cli,admin",0,[],"bedrock-vertex"],[15,"`session.append` の mod フックに `queue` door が加わり、キュー記録を送信プロンプトと変えられる","Added a `queue` door to the `session.append` mod hook, so a mod can make the transcript's queue records differ from the prompt as sent","M","new",1,"mod-dev",0,[],"plugins-mods"],[16,"`/plugin` と `claude plugin validate` が、組織管理下でスキップされる mod のフックを表示する","Added a note in `/plugin` and `claude plugin validate` naming a mod's hooks that are skipped where an organization manages Claude Code","M","new",1,"mod-dev,admin",0,[],"plugins-mods"],[17,"`/usage` が max effort・workflows・常時コンテキスト・大きなツール結果について警告を出す","Added `/usage` warnings for max effort, workflows, always-on context and large tool results","L","new",2,"cli",0,[],"slash-commands"],[18,"`apiKeyHelper` のキー使用時、拒否されたクラウドセッションのエラーが正しい組織を指す","Fixed the error for a denied cloud session, which could point to the wrong organization when a key from `apiKeyHelper` was in use","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[19,"カスタム `ANTHROPIC_BASE_URL` のゲートウェイ固有モデル名で、約200Kトークンで誤って圧縮失敗にならず送信される","Fixed sessions on a gateway-specific model name behind a custom `ANTHROPIC_BASE_URL` ending with \"Prompt is too long · automatic compaction failed\" near 200K tokens instead of sending the request","H","fix",2,"cli,sdk",0,[],"proxy-network"],[20,"毎ターン末にプロンプトを送る mod が、`--max-turns` や予算・中断を超えて headless 実行を続けない","Fixed a mod that submits a prompt at the end of every turn keeping a headless run going past `--max-turns`, `--max-budget-usd`, an interrupt, or the end of the host's conversation","H","fix",2,"sdk,mod-dev",0,[],"headless-ci"],[21,"クラウドセッションでツールグループの1行ラベルの後にモデルの続きテキストが出る問題を解消","Fixed cloud sessions sometimes showing the model's follow-up text after a tool group's one-line label","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[22,"config ディレクトリのパスに `.claude` が無い場合に、accept-edits モードで Write/Edit が確認なしに mod を作る問題を解消","Fixed the Write and Edit tools creating a mod in a session's mods folder without asking in accept-edits mode when the config directory's path has no `.claude` in it","T","fix",3,"cli",0,[],"permissions"],[23,"リモートでオフにされた mod が開いたセッションで動き続けず、ターン間でアンロードされる","Fixed installed mods that kept running in an open session after being turned off remotely; they now unload between turns","M","fix",2,"mod-dev,admin",0,[],"plugins-mods"],[24,"Cowork/claude.ai クラウドセッションで、フック実行中に停止したメッセージの Edit と Retry が失敗しない（2.1.296 の退行）","Fixed Edit and Retry in Cowork and claude.ai cloud sessions failing on a message stopped while its `UserPromptSubmit` or mod `prompt.submit` hooks were still running (regression in 2.1.296)","I","fix",2,"cloud",0,[],"cowork"],[25,"説明なしで起動した teammate のタスク説明に、プロンプト内の認証情報の一部が残らない","Fixed an agent teammate started without a description keeping part of a credential from its prompt in the task description shown for it","A","fix",2,"cli",0,[],"agent-teams"],[26,"低速回線で大量イベントのアップロードが終わらない時、Remote Control/クラウドセッションの claude.ai 表示が固まらない","Fixed the claude.ai view of a Remote Control or cloud session freezing when a large batch of events could not finish uploading over a slow connection","I","fix",2,"cloud",0,[],"remote-control"],[27,"サンドボックス内のシェルコマンドが `--plugin-dir` フォルダに書き込めなくなった","Fixed a sandboxed shell command being able to write into a `--plugin-dir` folder, whose code Claude Code reloads and runs outside the sandbox","T","fix",3,"cli",0,[],"sandbox"],[28,"大量の debug ログでのメモリ増加と、書き込み不能なディスク上のログでの終了時ハングを解消","Fixed memory growth under heavy debug logging (`--debug`, `--debug-file`), and a hang on exit when the debug log is on a disk or network mount that stops accepting writes","O","fix",1,"cli",0,[],"performance"],[29,"debug 出力が stderr で親プロセスが読むのをやめても、メモリが際限なく増えない","Fixed memory growing without bound when debug output goes to stderr and the parent process stops reading it","O","fix",1,"cli",0,[],"performance"],[30,"`rm` を実行しないシェル `-c` スクリプトでの rm 確認が出ない。実行時組み立ては `CLAUDE_CODE_STRICT_INLINE_SHELL_RM_PROMPT=1` で確認","Fixed rm prompts on shell `-c` scripts that don't run `rm`. An rm built at run time in a script Claude Code can't read no longer prompts unless `CLAUDE_CODE_STRICT_INLINE_SHELL_RM_PROMPT=1`","T","fix",2,"cli",0,[],"bash-tool"],[31,"フルスクリーンの展開済み行で単語をダブルクリックすると、行が閉じず単語が選択される","Fixed double-clicking a word in an expanded transcript row in fullscreen mode collapsing the row instead of selecting the word","U","fix",1,"cli",0,[],"output-rendering"],[32,"`claude mcp list`/`claude doctor`/`/status` が空の `.mcp.json` を不正と報告しない","Fixed `claude mcp list`, `claude doctor` and `/status` reporting an empty `.mcp.json` as invalid","C","fix",1,"cli",0,[],"mcp"],[33,"フルスクリーンでスクロール中に `/btw` を使っても、トランスクリプトが末尾へ飛ばない","Fixed `/btw` jumping the transcript to the bottom when asked while scrolled up in fullscreen","U","fix",1,"cli",0,[],"slash-commands"],[34,"WSL2 でサンドボックスが Windows ドライブに書ける時の `bwrap: Can't mkdir` 失敗を解消","Fixed sandboxed commands failing on WSL2 with `bwrap: Can't mkdir /mnt/c/Program Files/ClaudeCode` when the sandbox can write to the Windows drive","T","fix",2,"windows,cli",0,[],"sandbox"],[35,"Agent SDK・IDE・`claude remote-control` で、バックグラウンドタスク実行中も ScheduleWakeup が発火する","Fixed scheduled wakeups (ScheduleWakeup) not firing while a background task was running in Agent SDK, IDE and `claude remote-control` sessions","H","fix",2,"sdk,ide",0,[],"background-tasks"],[36,"貼り付け画像や読めない画像があるプロンプトで、mod の `prompt.submit` による書き換えが無視されない","Fixed a mod's `prompt.submit` rewrite being silently dropped, sending the prompt as typed, for some prompts with a pasted image or an image that can't be read","M","fix",2,"mod-dev",0,[],"plugins-mods"],[37,"同一バッチ内の別プロンプトの配信失敗で Remote Control のプロンプトが失われない","Fixed a Remote Control prompt being lost when another queued prompt in the same batch failed to deliver","I","fix",2,"cloud",0,[],"remote-control"],[38,"Stop が次のキュー済みプロンプトのフックを中断しても、フック通過済みの Remote Control プロンプトが履歴から消えない","Fixed a Remote Control prompt that had passed its hooks being dropped from prompt history when Stop interrupted the next queued prompt's hook","I","fix",1,"cloud",0,[],"remote-control"],[39,"サンドボックスコマンドが空の `.config.json` を残しても、Linux でサインイン・MCP・信頼設定が消えたように見えない","Fixed sign-in, MCP servers and project trust appearing lost on Linux after a sandboxed command left an empty `.config.json` in the config directory","O","fix",2,"cli",0,[],"linux"],[40,"`/sandbox` は設定を保存できない時、成功と表示せず何も変わらない旨と理由を示す","Fixed `/sandbox` reporting success when its setting could not be saved because the project folder is not writable; it now says nothing changed and why","T","fix",1,"cli",0,[],"sandbox"],[41,"ホストが auto mode 非対応モデルに切り替えた後、SDK/headless セッションが auto mode に残らない","Fixed SDK and headless sessions staying in auto mode after the host switched to a model that doesn't support auto mode","H","fix",2,"sdk",0,[],"auto-mode"],[42,"`constructor` や `prototype` という名前の MCP サーバーも接続される","Fixed MCP servers named `constructor` or `prototype` in an MCP config never being connected","C","fix",1,"cli",0,[],"mcp"],[43,"`constructor` や `toString` という名前の MCP サーバーのツールが auto/bypass モードで許可を求めない","Fixed tools of an MCP server named `constructor` or `toString` asking for permission in auto mode and bypass permissions mode","C","fix",1,"cli",0,[],"mcp"],[44,"他プロセスが claude.ai 同期プラグインを更新した直後の起動時に、誤った \"synced[0] commands path not found\" エラーが出ない","Fixed a spurious \"synced[0] commands path not found\" plugin error at startup when another Claude Code process had just updated a claude.ai-synced plugin","M","fix",1,"cli",0,[],"plugins-mods"],[45,"Artifact ツールは、公開がサーバー/プロキシに403で拒否された時、再試行を勧めず理由と案内を示す","Fixed the Artifact tool advising a retry when a publish that reque

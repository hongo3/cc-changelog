Opus 5.5 が既定モデルになり、auto mode と各種ダイアログを修正</li><li>v2.1.278 — auto mode 分類器が既定でサーバー側になり /status にも表示</li><li>v2.1.277 — AGENTS.md対応と、サンドボックス・安全性まわりの修正が中心</li><li>v2.1.276 — プロキシ/ゲートウェイ経由の全リクエスト400エラーを解消</li><li>v2.1.275 — プラグインの安全性強化とセッション復元の堅牢化が中心</li><li>v2.1.274 — MCP接続・セキュリティ修正とgateway/クラウド機能の改善</li><li>v2.1.273 — 権限チェックの抜け穴修正と auto-compact 誤判定の是正が中心</li><li>v2.1.272 — v2.1.272 は不具合修正と安定性の改善のみ</li><li>v2.1.271 — Bash権限チェックの抜け穴修正とauto modeの権限変更</li></ol></noscript></main></div><footer class="cost"><h2>利用モデル</h2><p>分類・要約: claude-sonnet-5-5（Claude Code の <code>claude -p</code>）。日本語は機械生成のため、判断は各エントリの原文（「原文も表示」）で確認してください。原文: <a href="https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md" target="_blank" rel="noopener noreferrer">anthropics/claude-code CHANGELOG.md</a></p></footer></div><script type="application/json" id="cc-data">{"versions":[{"v":"2.1.291","date":"2026-10-06（火）12:32","dshort":"10-06 12:32","nb":0,"head":"クラウドの権限応答欠落と終了時のメッセージ消失を修正","sum":"","watch":[],"hl":[{"t":"","b":"cloud sessions で権限確認への回答が失われず反映される（2.1.290 のリグレッション）","r":[1]},{"t":"","b":"終了時にセッション末尾のメッセージが失われず保存される（2.1.288 のリグレッション）","r":[2]}],"groups":[{"a":"S","name":"セッション・履歴・圧縮","dg":"","refs":[2]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"","refs":[1]}],"skip":"","st":"ok","stale":false,"e":[[1,"cloud sessions で権限確認への回答が失われず反映される（2.1.290 のリグレッション）","Fixed a regression in 2.1.290 where cloud sessions could drop answers to permission prompts","I","fix",2,"cloud",0,[]],[2,"終了時にセッション末尾のメッセージが失われず保存される（2.1.288 のリグレッション）","Fixed a regression in 2.1.288 where the last messages of a session could be lost when quitting","S","fix",2,"cli",0,[]]]},{"v":"2.1.290","date":"2026-10-06（火）03:12","dshort":"10-06 03:12","nb":8,"head":"権限判定の抜け穴修正とagents・ultrareviewの安定化が中心","sum":"v2.1.290 は修正が大半を占め、特に Bash・Read・MCP まわりの権限判定やシンボリックリンク経由の読み取りなど、セキュリティ関連の修正が多い。`claude agents` とバックグラウンドセッション、`/ultrareview` の不具合修正も多く、既定値が変わる項目もあるため確認が要る。","watch":[{"b":"Claude in Chrome はプロジェクトの設定ファイルから有効化できなくなったため、`--chrome`、`/chrome`、ユーザー設定のいずれかで有効にする。","r":[142]},{"b":"`pyright` は read-only 扱いでなくなり実行前に確認が出るため、必要なら許可ルールを追加する。","r":[143]},{"b":"`ps` の多くの形式が承認を求めるようになったため、自動実行に頼る運用では許可ルールを確認する。","r":[148]},{"b":"リポジトリの `.claude/settings.json` などから `CLAUDE_CODE_DISABLE_ATTACHMENTS` を設定できなくなったため、シェル・ユーザー・管理設定で指定する。","r":[159]},{"b":"WebSearch の上限は 200 回で終了する方式から 1 時間 100 回で回復する方式に変わった。`CLAUDE_CODE_WEB_SEARCH_REFILLS_PER_HOUR` で調整でき、0 で無効になる。","r":[158]},{"b":"スキルとカスタムコマンドは、タブと改行以外の制御文字を含む `!` シェルコマンドを拒否するため、該当する記述を修正する。","r":[146]},{"b":"cloud セッションの `gh api` は `GH_HOST` や `GH_REPO` で指定した github.com 以外のホストを拒否するため、`--hostname` か完全な URL で指定する。","r":[161]},{"b":"`CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC` は起動時の接続ウォームアップも止めるようになったため、必要な環境では影響を確認する。","r":[141]},{"b":"`claude agents` から busy なバックグラウンドセッションへ送る `/model`、`/effort`、`/rename` は確認なしで即時適用されるため、送信先に注意する。","r":[156]},{"b":"in-process teammate の `agent_id` は agent ID になり、`name@team` は `teammate_id` に残るため、この値を参照する処理は更新する。","r":[154]},{"b":"VS Code ではメッセージのタイムスタンプが既定で表示されるため、不要なら `Claude Code: Show Message Timestamps` をオフにする。","r":[174]},{"b":"Claude apps gateway が対応する PostgreSQL の最小バージョンが 14 から 11 に変わった。","r":[157]}],"hl":[{"t":"権限判定の抜け穴を修正","b":"Bash の権限チェックが `rg` や `git grep` のワイルドカード、zsh の変数名、`declare`/`export` 前置きを見逃す問題を修正した。PreToolUse フックが入力を書き換えた後にルールが適用されない問題も直した。","r":[76,78,52,116,104]},{"t":"リンク経由の読み取りを遮断","b":"作業ディレクトリ外へのシンボリックリンクや読み取り中のリンク差し替えで、ブロック設定や Read deny ルールを回避できる問題を修正した。画像の読み取りと `@` メンションも対象。","r":[23,44,48,53,125]},{"t":"組織ポリシー回避と MCP ルール","b":"ユーザーが入れた mod が組織のガードを回避できる問題を修正し、該当 mod は unload される。`disableClaudeAiConnectors` と `allowedMcpServers` の URL ルールが一部の MCP 定義に効かない問題も直した。","r":[54,45,46,25]},{"t":"スケジュール実行と再開の修正","b":"圧縮後に `/loop` やリマインダーが復元されない問題、バックグラウンド移行後に発火しない問題、再開のたびに余分に実行される問題を修正した。plan mode の復元や `/rewind` の一覧も直した。","r":[19,20,97,18,124]},{"t":"`claude agents` の誤動作を修正","b":"停止中セッションに届かなかったスラッシュコマンドが再起動後に勝手に実行される問題や、再起動時に過去のメッセージが再送される問題を修正した。Esc や Ctrl+X による誤削除も直した。","r":[62,72,75,60,61,56]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"Bash・Read・サンドボックスの権限判定、シンボリックリンク経由の読み取り、WebFetch の `offset`、管理設定の警告など、ツールと権限の修正が中心。固まる問題の修正も複数ある。","refs":[10,11,16,22,23,24,27,44,48,52,53,54,64,73,76,78,79,84,90,93,103,104,111,115,116,122,124,125,130,133,134,135,143,148,152,158,159]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"`claude agents`、バックグラウンドセッション、サブエージェントの再開・再起動まわりの修正が多い。`claude attach \u003cname\u003e` と `claude logs \u003cname\u003e` では名前の一部を指定できる。","refs":[7,15,20,49,50,51,56,60,61,62,66,67,71,72,75,87,109,112,113,127,145,150,154,155,156]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"mod とプラグインフックの型・イベント拡張、`claude plugin validate` の出力追加、描画の無限再描画や unload の誤動作の修正。`/claude-api managed-agents-onboard` も追加された。","refs":[1,2,3,4,5,8,9,31,32,34,37,40,41,42,43,45,47,55,70,77,91,98,114,128,144,146,149,160,162]},{"a":"S","name":"セッション・履歴・圧縮","dg":"圧縮後のスケジュールタスク復元、`/rewind`、plan mode の復元、スリープ中の自動圧縮失敗、大きなセッション再開時の応答性を改善した。","refs":[18,19,39,65,97,99,100,139]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP の URL ルール適用漏れ、組織提供サーバーの誤登録、HTTP MCP の巨大応答によるメモリ増大を修正した。Claude in Chrome の起動条件と `browser_batch` のタイムアウトも変わった。","refs":[25,46,68,69,94,106,108,126,137,142]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"`/ultrareview` のアップロード不具合、cloud セッションの再起動時の挙動、VS Code、Claude Tag、Remote Control、Code Review の修正が並ぶ。","refs":[6,26,28,33,35,63,81,82,92,95,96,129,132,161,164,165,166,167,168,169,170,171,172,173,174,175,176,177,178,179,180,181,182,183,184,185,186,187,188,189,190]},{"a":"H","name":"headless・SDK・API","dg":"ヘッダー拒否プロキシ、`--json-schema` の終了コード、Claude apps gateway、自己ホスト runner、SDK ホストの起動遅延などの修正。gateway には Deny ボタンなどの追加もある。","refs":[12,21,30,83,85,86,88,89,102,105,110,121,131,136,138,157,163]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"画像が多い長いセッションでの拒否エラー、出力フィルタによるターン終了、フォールバック時の effort 変更を修正し、`/code-review` の報告範囲を広げた。","refs":[13,14,36,153]},{"a":"U","name":"UI・表示・入力","dg":"スタックオーバーフロー、貼り付けの誤送信、大きな出力での遅延、長いメッセージ後のフリーズなど、表示と入力まわりの修正。候補リストの選択行には ❯ が付く。","refs":[17,29,38,57,58,59,101,107,118,119,140,147,151]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"初回起動のログイン方法の再確認、macOS の `/login` の誤成功表示、Homebrew アップグレード後の `claude agents` の失敗などを修正した。`CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC` の対象も広がった。","refs":[74,80,117,120,123,141]}],"skip":"表示の乱れ、まれな環境でのフリーズ、メッセージ文言の改善、VS Code・cloud・Claude Tag 固有の細かな修正が合わせて約 100 件ある。","st":"ok","stale":false,"e":[[1,"mod の `turn.step` フックの結果に `serverToolUses`（API 側実行のツール呼び出し）が加わる","Added `serverToolUses` to the result of a mod's `turn.step` hook: the tool calls the API ran itself (the advisor), each with its id, name, input, start and end","M","new",2,"mod-dev",0,[]],[2,"plugin hooks の `tool.check` イベントに `agentId` が付き、サブエージェントの権限確認を区別できる","Added `agentId` to the `tool.check` event of plugin hooks, so a hook can tell a subagent's permission check from the main session's","M","new",1,"mod-dev",0,[]],[3,"mod の `tool.check` フックが読む問い合わせと判定に、組織が要求する承認を示す `ceiling` が加わる","Added `ceiling` to the question and verdict a mod's `tool.check` hook reads, naming the approval an organization requires for a tool","M","new",1,"mod-dev,admin",0,[]],[4,"plugin hooks の型定義に `ThemeKey` と `Color` が加わり、エディタでテーマ色を一覧できる","Added `ThemeKey` and `Color` types to the plugin hooks typings, so an editor lists the theme colors a mod's drawing can name","M","new",1,"mod-dev",0,[]],[5,"`claude plugin validate` が、ゲート箇所に登録された各フックと `.catch` の有無を表示する（`--json` では `gatingHooks`）","Added to `claude plugin validate`: each hook a mod registers at a gating site is listed with whether it has a `.catch` (`gatingHooks` under `--json`)","M","new",1,"mod-dev",0,[]],[6,"Claude apps gateway のサインイン承認ページに Deny ボタンが付き、待機中の端末が数秒で止まる","Added a Deny button to the Claude apps gateway's sign-in approval page: it ends the pending sign-in, so the waiting terminal stops within seconds","I","new",1,"admin",0,[]],[7,"`claude attach \u003cname\u003e` と `claude logs \u003cname\u003e` で、ID の代わりにセッション名の一部が使える","Added `claude attach \u003cname\u003e` and `claude logs \u003cname\u003e`: part of a session name works in place of the id","A","new",2,"cli",0,[]],[8,"`/claude-api managed-agents-onboard \u003curl\u003e` で、ページが説明する Managed Agents 構成を `ant apply` ファイルとして用意できる","Added `/claude-api managed-agents-onboard \u003curl\u003e` to set up the Managed Agents pattern a page describes as `ant apply` files","M","new",1,"cli",0,[]],[9,"`/claude-api managed-agents-onboard \u003cquickstart-name\u003e` で、Console のクイックスタートテンプレートを `ant` CLI で構築できる","Added `/claude-api managed-agents-onboard \u003cquickstart-name\u003e` to build a Console quickstart template, such as `deep-researcher`, with the `ant` CLI","M","new",1,"cli",0,[]],[10,"managed settings ファイルが管理フォルダ外へのリンクの場合に警告を出す","Added a warning when a managed settings file is a link to a file outside the managed settings folder","T","new",1,"admin",0,[]],[11,"managed settings がユーザー設定の sandbox `allowRead` パスや許可ドメインを無視する場合、/status と doctor が警告する","Added a /status and doctor warning when managed settings ignore user-configured sandbox allowRead paths or allowed domains","T","new",2,"admin",0,[]],[12,"ベータヘッダを 400 以外のステータスなどで拒否するプロキシ・ゲートウェイ経由でも、リクエストが失敗しない","Fixed requests failing behind proxies and gateways that reject one of Claude Code's beta headers with a status other than 400, or together with a second beta","H","fix",2,"cli,sdk",0,[]],[13,"数百枚の画像を含む長いセッションで「Request rejected as unprocessable by the model」から抜け出せなくなる問題が解消","Fixed long sessions with hundreds of images getting stuck on \"Request rejected as unprocessable by the model\" errors","L","fix",2,"cli",0,[]],[14,"思考中に出力コンテンツフィルタで返信が止まってもターンが即終了せず、エラー表示前に 1 回再試行する","Fixed a turn ending at once when the API's output content filter stopped a reply while Claude was still thinking; the request is now retried once before the error is shown","L","fix",2,"cli",0,[]],[15,"再開したサブエージェントとチームメイトが、実行中のメッセージ受信後も以前の thinking とプロンプトキャッシュを保持する","Fixed resumed subagents and teammates losing their earlier thinking and prompt cache after receiving a message mid-run","A","fix",2,"cli",0,[]],[16,"WebFetch が 10 万文字超のページで未読量を示し、`offset` で続きを読める","Fixed WebFetch silently dropping page text past 100,000 characters; it now says how much was unread and takes an `offset` to read on","T","fix",2,"cli",0,[]],[17,"リストや引用が数千階層ネストした応答でも「Maximum call stack size exceeded」でクラッシュしない","Fixed a crash (\"Maximum call stack size exceeded\") when a response nested lists or quotes thousands of levels deep","U","fix",1,"cli",0,[]],[18,"`/rewind` が作業中に送ったプロンプトも一覧に出す","Fixed `/rewind` not listing a prompt sent while Claude was still working","S","fix",2,"cli",0,[]],[19,"会話が圧縮されても、スケジュールタスク（間隔付き `/loop`、リマインダー）が再開時に復元される（このバージョン以降の圧縮が対象）","Fixed scheduled tasks (`/loop` with an interval, reminders) silently not coming back on resume once the conversation was compacted; covers compactions made from this version on","S","fix",2,"cli",0,[]],[20,"フォアグラウンドのスケジュールタスクが ← や `/background` 後も発火し、定期タスクが再開・respawn・fork ごとに余分に走らない","Fixed scheduled tasks set in the foreground never firing after a ← or `/background` hand-off, and recurring ones firing an extra run on every resume, respawn or fork","A","fix",2,"cli",0,[]],[21,"構造化出力の配信後に接続が切れても、`--json-schema` の headless 実行が `success` 結果で非ゼロ終了にならない","Fixed headless `--json-schema` runs exiting non-zero with `is_error: true` on a `success` result when the connection dropped after the structured output was already delivered","H","fix",2,"sdk",0,[]],[22,"plan mode で、サーバー側の ask ポリシー付き非読み取り専用コネクタツールを auto mode 分類器が承認しなくなる","Fixed plan mode letting the auto mode classifier approve non-read-only connector tools that carry a server-pushed ask policy","T","fix",3,"cli,admin",0,[]],[23,"作業ディレクトリ外へシンボリックリンクされた `CLAUDE.md`・rule・`AGENTS.md` が、読み取りブロックや `Read` deny 下で読み込まれない","Fixed a project `CLAUDE.md`, rule or `AGENTS.md` symlinked outside the working directories loading under `permissions.blockReadsOutsideWorkingDirectories` or a `Read` deny rule","T","fix",3,"cli,admin",0,[]],[24,"`xn--` ホストラベル内にワイルドカードを持つ URL の許可・拒否パターンが、プロセスごとに異なる結果にならない","Fixed URL allow and deny patterns with a wildcard inside an `xn--` host label matching differently from one process to the next","T","fix",1,"cli",0,[]],[25,"組織提供の MCP サーバーが、サインインや再接続後に自分のものとして再掲されない（headless・SDK の遅延結果も含む）","Fixed an MCP server provided by your organization being relisted as your own after signing in or reconnecting, including from a late result in headless and SDK sessions","C","fix",2,"admin",0,[]],[26,"Windows で `git stash create` 失敗時や `git add -N` ファイルの削除・移動後も、`/ultrareview` が未コミット変更を警告なく落とさない","Fixed `/ultrareview` dropping uncommitted changes without a warning on Windows when `git stash create` failed, and refusing them after a `git add -N` file was deleted or moved","I","fix",2,"windows",0,[]],[27,"macOS と Linux で、バックスラッシュを含む `plansDirectory` パスのプロジェクトルート検査が正しく動く","Fixed the `plansDirectory` setting's project-root check for paths that contain a backslash on macOS and Linux","T","fix",1,"cli,macos",0,[]],[28,"非常に長い Remote Control・クラウドセッションの返信が、塊ごとではなくストリーミング表示される","Fixed replies in very long Remote Control and cloud sessions that could appear a block at a time instead of streaming in","I","fix",2,"cloud",0,[]],[29,"`claude daemon run` と `claude daemon logs` が、端末制御文字を `\\uXXXX` エスケープで表示する","Fixed the background daemon's log passing terminal control characters to the screen under `claude daemon run` and `claude daemon logs`; they now show as `\\uXXXX` escapes","U","fix",1,"cli",0,[]],[30,"セルフホストランナーで、非常に長い細工されたエラー出力行によりランナーが数秒固まらない","Self-hosted runner: Fixed a crafted, very long line of a session's error output freezing the runner for several seconds","H","fix",1,"sdk",0,[]],[31,"プロンプトやツール呼び出しでフックワーカーが忙しくても、`.catch` 付き plugin hook がアンロードされず `.catch` も実行される","Fixed a plugin hook with a `.catch` being unloaded, and its `.catch` skipped, when the hook kept the hooks worker busy on a prompt or tool call","M","fix",1,"mod-dev",0,[]],[32,"モデルのフォールバックで破棄されたツール呼び出しが、mod の `turn.step` 結果に載らない","Fixed a mod's `turn.step` result listing a tool call that a mid-response model fallback had discarded","M","fix",1,"mod-dev",0,[]],[33,"メッセージやファイル送信直後にコンテナが再起動しても、Cowork クラウドセッションの返信が最後まで完了する","Fixed a Cowork cloud session's reply sometimes never finishing when its container restarted just after Claude sent a message or a file","I","fix",1,"cloud",0,[]],[34,"トップレベル関数名と同名のオプションを分割代入する hooks モジュールでも、`claude plugin validate` と読み込みが通る","Fixed `claude plugin validate` and plugin loading refusing a hooks module that destructures an option named like one of its top-level functions","M","fix",1,"mod-dev",0,[]],[35,"git の `core.safecrlf=true` 設定下でも、`/ultrareview` が未コミット変更をアップロードできる","Fixed `/ultrareview` failing to upload uncommitted changes when `core.safecrlf=true` is set in git's configuration","I","fix",1,"cli",0,[]],[36,"フラグ付きメッセージを別の effort 設定のフォールバックモデルで再試行しても、effort レベルが変わらない","Fixed the effort level changing when a flagged message is retried on a fallback model that has a different level saved in settings","L","fix",1,"cli",0,[]],[37,"Windows で CRLF 保存の skills・commands 内の複数行 `!` シェルブロックが動作する","Windows: Fixed multi-line `!` shell blocks in skills and commands failing when the file is saved with CRLF line endings","M","fix",2,"windows",0,[]],[38,"フルスクリーンで検索中に `/permissions` のタブをクリックしてもハングしない","Fixed Claude Code hanging until killed when a `/permissions` tab was clicked while searching in fullscreen mode","U","fix",1,"cli",0,[]],[39,"会話の圧縮が「null is not an object」エラーで失敗することがなくなる","Fixed conversation compaction sometimes failing with a \"null is not an object\" error","S","fix",1,"cli",0,[]],[40,"auto mode でレポートを返すサブエージェントの `turn.complete` で、plugin hooks が空でない `answer` を読める","Fixed plugin hooks reading an empty `answer` on `turn.complete` for a subagent that hands its report back in auto mode","M","fix",1,"mod-dev",0,[]],[41,"リロード失敗後の更新で mod が無言でアンロードされず、失敗行に以前の版がアンロード済みと表示される","Fixed a mod being unloaded without a message when a refresh followed its failed reload; its failure line now says the version loaded before is unloaded","M","fix",1,"mod- ing cause","H","improve",1,"admin",0,[]],[132,"claude.ai 未ログインでクラウドセッションを始めたときのエラーが `claude auth login` と /login を示し、API キー認証のせいにしない","Improved the error shown when a cloud session is started without a claude.ai sign-in: it now names `claude auth login` and /login and no longer blames API-key authentication","I","improve",1,"cloud",0,[]],[133,"Read ツールがバイナリファイルに対し、その形式を読める skill やシェルコマンドを案内する","Improved the Read tool's message for binary files: it now points Claude to a skill or a shell command that can read the format","T","improve",1,"cli",0,[]],[134,"git config ファイルが `/ultrareview` のアップロードを止めたときのエラーが約半分の長さになり、問題のファイル種別を示す","Improved the error shown when a git config file stops the `/ultrareview` upload: it is about half as long and says what kind of file is the problem","T","improve",1,"cli",0,[]],[135,"`/ultrareview` のアップロードが checkout を拒否したとき、原因ごとに専用メッセージと対処法を出す","Improved the errors shown when the `/ultrareview` upload refuses a checkout: each known cause now has its own message, with a way to fix it","T","improve",1,"cli",0,[]],[136,"Claude apps gateway が、IdP に提示する証明書の期限前 30 日間に警告をログに出す","Improved the Claude apps gateway to log a warning during the last 30 days before the certificate it presents to the identity provider expires","H","improve",1,"admin",0,[]],[137,"Claude in Chrome の `browser_batch` の待ち時間が 60 秒から 90 秒になる","Improved Claude in Chrome: a `browser_batch` call now gets 90 seconds, up from 60, before it is reported as timed out","C","improve",1,"cli",0,[]],[138,"Claude apps gateway のブラウザサインインページがブランドフォント・中央配置・ダークモードに対応","Improved the Claude apps gateway's browser sign-in pages: brand fonts, centered layout, and dark mode","H","improve",1,"admin",0,[]],[139,"大きなセッションの再開中も、transcript 読み込み中にタイマー・入力・描画が動き続ける","Improved responsiveness while resuming large sessions: timers, input and rendering keep running while the transcript loads","S","improve",2,"cli",0,[]],[140,"/ と @ の候補リストで、選択行の先頭に ❯ を付け、色なしでも分かる","Improved the / and @ suggestion lists: the selected ened after VS Code restarts its extensions now also finish a step the restart interrupted","I","improve",1,"ide",0,[]],[173,"[VSCode] メッセージ内のファイルピルにホバーするとプロジェクトからのパスが出て、同名ファイルを区別できる","[VSCode] Improved file pills in messages: hovering one now shows the file's path from the project folder, so same-named files can be told apart","I","improve",1,"ide",0,[]],[174,"[VSCode] メッセージのタイムスタンプが既定で表示される（Claude Code: Show Message Timestamps で無効化）","[VSCode] Changed message timestamps to show by default (turn them off with the Claude Code: Show Message Timestamps setting)","I","change",1,"ide",0,[]],[175,"[Cloud sessions] クラウド環境の環境変数でプロンプト提案をオフにすると、新しいセッションで効く","[Cloud sessions] Fixed turning off prompt suggestions through a cloud environment's environment variables having no effect in new cloud sessions","I","fix",1,"cloud",0,[]],[176,"[Cloud sessions] 返信が終わった後、作業中インジケーターが数秒回り続けず、返信と同時に止まる","[Cloud sessions] Fixed the working indicator in a cloud session spinning on for several seconds after Claude's reply had finished; it now stops with the reply","I","fix",1,"cloud",0,[]],[177,"[Cloud sessions] 未実行ルーティンのページで Run now を押すと、History が「No runs yet」のままにならず新しい実行を表示する","[Cloud sessions] Fixed History on a never-run routine's page still saying \"No runs yet\" after you pressed Run now; it now shows the new run","I","fix",1,"cloud",0,[]],[178,"[Cloud sessions] アーカイブ解除したクラウドセッションが、次のメッセージを送るまで作業中に見えない","[Cloud sessions] Fixed an unarchived cloud session looking as if Claude were still working until you sent another message","I","fix",1,"cloud",0,[]],[179,"[Remote Control] Remote Control を始めたコンピューターが、新しいセッションの Remote Control メニューに数秒で表示される","[Remote Control] Fixed a computer that just started Remote Control taking up to a minute to appear in the Remote Control menu of a new session; it now appears within seconds","I","fix",2,"cloud",0,[]],[180,"[Claude Tag] Slack で `!fast` により fast mode に切り替え（必要なら Opus へ）、`!fast off` で戻せる。有効中は返信に (fast) が付く","[Claude Tag] Added fast mode in Slack: mention Claude with `!fast` to switch a thread to fast mode, moving it to Opus if needed, and `!fast off` to switch back; replies show (fast) while it's on","I","new",2,"cloud",0,[]],[181,"[Claude Tag] access bundle のカスタム接続作成時に任意の Path prefixes を指定し、allow ルールをそのパスだけに限定できる","[Claude Tag] Added the optional Path prefixes field when creating a custom connection in an access bundle, so its allow rule can cover only those paths instead of the whole host","I","new",1,"cloud,admin",0,[]],[182,"[Claude Tag] Claude Tag Admin 権限のメンバーが、Activity ページの Memory タブでワークスペースとチャンネルのメモリを読める","[Claude Tag] Fixed members with the Claude Tag Admin permission getting \"Couldn't load memory files\" on the Activity page's Memory tab; they can now read workspace and channel memory","I","fix",1,"cloud,admin",0,[]],[183,"[Claude Tag] ワークスペースゲストが Slack の設定カードで Confirm を押しても全員のボタンが消えず、拒否はゲストにだけ表示される","[Claude Tag] Fixed a workspace guest's Confirm on a Claude settings card in Slack removing its buttons for everyone; only the guest sees the refusal, and members can still confirm or cancel","I","fix",1,"cloud",0,[]],[184,"[Claude Tag] Slack チャンネルの定期ルーティンが、新規セッションごとに現在の既定モデルで動く","[Claude Tag] Fixed scheduled routines in Slack channels running on a model other than the channel's default; each run that starts a new session now uses the current default model","I","fix",1,"cloud",0,[]],[185,"[Claude Tag] チャンネル名ルールで付けた access bundle の GitHub リポジトリが、対象チャンネルで拒否されず追加・一覧・clone できる","[Claude Tag] Fixed GitHub repositories in an access bundle attached by a channel-name rule being refused in the channels the rule covers; Claude can now add, list and clone them there","I","fix",2,"cloud,admin",0,[]],[186,"[Claude Tag] 自分の Claude プランの使用上限到達時、DM の通知が数秒で表示され、リセット時刻も示す","[Claude Tag] Improved Claude's notice in your direct messages when your own Claude plan's usage limit is reached: it shows within seconds and says when the limit resets","I","improve",1,"cloud",0,[]],[187,"[Claude Tag] 旧 Claude in Slack アプリがセッションを始められないとき、失敗内容と対応できる人を示す（全文はスレッドごとに 1 回）","[Claude Tag] Improved the earlier Claude in Slack app's reply when it can't start a session: it now says what failed and who can fix it, in full only once per thread","I","improve",1,"cloud",0,[]],[188,"[Claude Tag] チャンネル指示の上限がバイトではなく 8,192 文字になり、Configure ページの Save 横に文字数を表示する","[Claude Tag] Changed the channel instructions limit to 8,192 characters instead of bytes, so non-English text gets the same room, and added a character count beside Save on the Configure page","I","change",1,"cloud,admin",0,[]],[189,"[Code Review] ブロッキングのレビューコメントが、重大度と矛盾する「nit」ラベルで始まらない","[Code Review] Fixed blocking review comments sometimes opening with a \"nit\" label that contradicted their severity","I","fix",1,"cloud",0,[]],[190,"[Code Review] Code Review をオフにした組織で、fork や Manual モードの PR に「@claude review」コメントの案内が投稿されない","[Code Review] Fixed tips to comment \"@claude review\" being posted on fork and Manual-mode pull requests in organizations that have turned Code Review off","I","fix",1,"cloud,admin",0,[]]]},{"v":"2.1.289","date":"2026-10-04（日）05:12","dshort":"10-04 05:12","nb":0,"head":"権限ルール回避の修正と mod・プラグイン描画の安定化","sum":"このリリースは、deny/ask ルールが特定条件で効かなくなる問題の修正が中心で、サンドボックス自動許可や管理環境を使う開発者に効く。あわせて mod とプラグインの描画失敗がセッション全体に波及する問題を多数修正している。端末のフリーズや表示崩れの修正も含む。","watch":[],"hl":[{"t":"Bash の deny/ask 漏れを修正","b":"サンドボックス自動許可時に、環境変数プレフィックスや変数代入の後ろにあるコマンドで deny/ask ルールが適用されない問題を修正した。`TZ=\"$HOME\" rm -rf build` のような形が対象。","r":[14,15]},{"t":"管理環境での権限保持","b":"管理対象マシンで、複合シェルコマンドの入れ子部分にある deny/ask ルールが、ユーザー導入 mod の承認より優先されない問題を修正した。","r":[1]},{"t":"`Read` deny のシンボリックリンク対応","b":"IDE で @ メンションされたファイル、変更されたファイル、選択されたファイルがシンボリックリンク経由の場合に、`Read` の deny ルールが適用されない問題を修正した。","r":[3]},{"t":"組織管理 MCP の保護","b":"ユーザー導入のプラグインが、組織管理 MCP サーバーのサインインツールの説明を書き換えられる問題を修正した。","r":[10]},{"t":"mod 描画失敗の影響範囲を限定","b":"mod の `ui.render` フックや `Client` の描画失敗でセッションが終了したり、周囲の描画が巻き込まれたりする問題を修正した。失敗は該当部分に限られ、`ui.fault` が発生する。","r":[18,21]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"deny/ask ルールが効かなくなる経路を 5 件修正した。対象は複合コマンド、環境変数プレフィックス、変数代入、シンボリックリンク経由の `Read` である。","refs":[1,3,14,15]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"プラグインの画面ハンドラが非同期で例外を投げても、supervised／background セッションが終了しないようにした。`agent.spawn`、プラグインフックイベント間で共通のエージェント ID、`$.agent.list()` の idle／waiting 状態も追加した。","refs":[12,17]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"mod とプラグインの描画失敗、ローカルフォルダ由来プラグインの古い表示、アップグレード後最初のセッションで mod が読み込まれない問題などを修正した。`claude plugin validate` の誤動作も直し、失敗時のメッセージを改善した。","refs":[5,6,7,8,9,11,13,16,18,20,21,22,23,24,25,27]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"組織管理 MCP サーバーのサインインツールの説明が、ユーザー導入プラグインから書き換えられないようにした。","refs":[10]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VSCode で、2.1.288 の `claude auth status` の変更を元に戻した。サインアウトが増えていた可能性がある。","refs":[4]},{"a":"U","name":"UI・表示・入力","dg":"未閉じの `\u003cscript\u003e` タグや深いネストの `${` による端末フリーズ、公開アーティファクトページのブラウザタブのフリーズを修正した。タブや制御文字による表示崩れも直した。","refs":[2,19,26]}],"skip":"表示の乱れ、プラグイン表示の古さ、まれな起動時フリーズ、エラーメッセージの改善などの細かな修正が 14 件ある。","st":"ok","stale":false,"e":[[1,"複合シェルコマンド内の入れ子部分に対する deny/ask ルールが、managed 環境でユーザー導入 mod の承認より優先される","Fixed a deny or ask rule on a nested part of a compound shell command not holding over a user-installed mod's approval on managed machines","T","fix",3,"cli,admin",0,[]],[2,"閉じていない `\u003cscript\u003e` や深い `${` 入れ子を含む短いコードブロックでもターミナルが固まらない","Fixed the terminal freezing on short code blocks with many unclosed `\u003cscript\u003e` tags or deeply nested `${` substitutions","U","fix",2,"cli",0,[]],[3,"IDE で @ メンション・変更・選択されたファイルにシンボリックリンク経由でも `Read` の deny ルールが適用される","Fixed `Read` deny rules not applying to files @-mentioned, changed, or selected in the IDE through a symlink","T","fix",3,"cli,ide",0,[]],[4,"2.1.288 での `claude auth status` の変更を元に戻し、サインアウトが増える可能性を解消","[VSCode] Reverted a 2.1.288 change to `claude auth status` that may have made sign-outs more frequent","I","fix",1,"ide",0,[]],[5,"plugin コードペインで、ハイライト表示を最終幅で一度だけレイアウトして大きなファイルを速く開く","Improved how quickly large files open in a plugin code pane by laying the highlighted view out once at its final width","M","improve",1,"mod-dev",0,[]],[6,"ローカルフォルダ marketplace 由来の plugin が `plugin list`/`eval`/`update` で最新表示になり、symlink の `--plugin-dir` もホットリロードされる","Fixed `plugin list`, `plugin eval` and `plugin update` showing a stale copy of a plugin installed from a local folder marketplace, and hot reload for a symlinked `--plugin-dir`","M","fix",2,"mod-dev",0,[]],[7,"アップグレード後の最初のセッションでも、インストール済み mod が読み込まれる","Fixed installed mods not loading in the first session after an upgrade","M","fix",2,"cli,mod-dev",0,[]],[8,"フルスクリーンで Background tasks ダイアログを開いても、プロンプト上の plugin 行が古い表示のまま残らない","Fixed a plugin's rows above the prompt showing a stale row while the Background tasks dialog was open in fullscreen","M","fix",1,"mod-dev",0,[]],[9,"localhost アドレス、パス内の `@`、大文字ホスト、`file:` パスのリンクでも plugin ペインが描画される","Fixed plugin panes drawing nothing when a link used a localhost address, an `@` in its path, an uppercase host or a `file:` path","M","fix",1,"mod-dev",0,[]],[10,"ユーザー導入 plugin が、組織管理 MCP サーバーのサインインツールの説明を書き換えられない","Fixed a user-installed plugin being able to rewrite the descriptions of an organization-managed MCP server's sign-in tools","C","fix",3,"admin,mod-dev",0,[]],[11,"端末が知らない枠線スタイルの Box を plugin が描画しても、起動時にフリーズや強制終了しない","Fixed a freeze or forced quit at launch when a plugin drew a Box with a border style the terminal does not know","M","fix",2,"mod-dev",0,[]],[12,"plugin の画面ハンドラーが非同期に例外を投げても、supervised/background セッションが終了しない","Fixed supervised and background sessions ending when a plugin's on-screen handler threw asynchronously","A","fix",2,"mod-dev,sdk",0,[]],[13,"高さのない plugin 領域が伸び続けても、インターフェースエラーでセッションが終了しない","Fixed sessions ending with an interface error when a plugin region with no height kept growing","M","fix",2,"mod-dev",0,[]],[14,"サンドボックス自動許可時に、`TZ=\"$HOME\" rm -rf build` のように展開される環境変数接頭辞付きコマンドにも Bash の deny/ask が効く","Fixed Bash deny and ask rules missing a command behind an environment variable prefix with an expanded value (e.g. `TZ=\"$HOME\" rm -rf build`) when the sandbox auto-allows commands","T","fix",3,"cli",0,[]],[15,"サンドボックス自動許可時に、コマンド前に変数代入だけがあっても Bash の deny/ask ルールが適用される","Fixed a Bash deny or ask rule being skipped under sandbox auto-allow when a bare variable assignment came before the command","T","fix",3,"cli",0,[]],[16,"フォルダに marketplace マニフェストがあっても `claude plugin validate` が plugin を検証する","Fixed `claude plugin validate` skipping the plugin when the folder also holds a marketplace manifest","M","fix",1,"mod-dev",0,[]],[17,"teammates 用の `agent.spawn`、plugin hook イベント共通の agent id、`$.agent.list()` の idle/waiting 状態を追加","Added `agent.spawn` for teammates, one agent id across plugin hook events, and idle and waiting states in `$.agent.list()`","A","new",2,"mod-dev",0,[]],[18,"mod の `ui.render` フックの値で行が描画時に例外を出しても、セッションが終了せずエンジンが独自の行を描く","Fixed sessions ending with \"unrecoverable interface error\" when a value a mod's `ui.render` hook wrote made a row throw while drawn; the engine now draws its own row instead","M","fix",2,"mod-dev",0,[]],[19,"タブ・不正なエスケープ・C1 制御文字や、タブと CRLF を含む短いテキストが下の行に重ならない","Fixed text with a tab, a stray escape and a C1 control, or a short text with a tab and CRLF line endings, drawing over the rows below it","U","fix",1,"cli",0,[]],[20,"mod のペインやバンドの右寄せ内容が閉じる印や `[-]` の下に潜らず、端末の端から 1 桁内側に保たれる","Fixed right-aligned content in a mod's pane or band drawing under the close mark or `[-]`, which now also keep one column in from the terminal's edge","M","fix",1,"mod-dev",0,[]],[21,"描画に失敗した mod の `Client` が周囲の描画を巻き込まず単独で失敗し、`ui.fault` を発行する","Fixed a mod's `Client` that fails while drawn taking down everything the mod drew around it; it now fails alone and raises `ui.fault`","M","fix",2,"mod-dev",0,[]],[22,"`claude plugin validate` が Anthropic marketplace 自身の plugin を通し、`--json` で正常な `plugin.json` を一覧に出す","Fixed `claude plugin validate` failing an Anthropic marketplace's own plugin and listing a clean `plugin.json` in `--json`","M","fix",1,"mod-dev",0,[]],[23,"描画に失敗した mod のバンドが、下のカードを一時的に退避させない","Fixed a mod's band that fails to draw briefly telling the cards under it to step aside","M","fix",1,"mod-dev",0,[]],[24,"メッセージのない plugin コンポーネントの失敗でも、`Error` や空ではなく理由が表示される","Fixed a failed plugin component showing `Error` or nothing as its reason when the failure carried no message","M","fix",1,"mod-dev",0,[]],[25,"mod のバンドやペインの描画失敗時、mod 名と何も描画されなかったことを示す行を表示","Improved the line a mod's author sees when its band or pane fails to draw: it names the mod and says nothing was drawn","M","improve",1,"mod-dev",0,[]],[26,"未閉鎖の `\u003cscript\u003e` を多く含む短いコードブロックで、公開 artifact ページが閲覧者のブラウザタブをフリーズ・クラッシュさせない","Fixed published artifact pages freezing or crashing the reader's browser tab on short code blocks with many unclosed `\u003cscript\u003e` tags","U","fix",2,"cli",0,[]],[27,"端末が描画中に例外を投げても、mod の Client 領域がセッション中ずっと失敗状態にならない","Fixed a mod's Client region staying failed for the whole session after the terminal threw while drawing it","M","fix",1,"mod-dev",0,[]]]},{"v":"2.1.288","date":"2026-10-03（土）03:30","dshort":"10-03 03:30","nb":2,"head":"v2.1.288：セッション復元と権限チェックの修正が中心","sum":"v2.1.288 は新機能よりも修正が大半を占めるリリースで、セッションの再開・自動コンパクト・API タイムアウトの扱いが改善されています。Bash の権限チェックや `rm` の確認漏れなど、安全性に関わる修正も含まれます。バックグラウンドコマンドの時間制限の適用範囲が変わるため、CI や SDK 利用者は確認が必要です。","watch":[{"b":"バックグラウンドコマンドの時間制限が無人セッション（`-p`、Agent SDK、CI、クラウド）限定になったため、対話セッションで制限に頼っていた運用は別の手段で止める。","r":[75]},{"b":"クライアント側の auto mode 分類器は Sonnet 5.5 / Opus 5.5 を指す `ANTHROPIC_DEFAULT_SONNET_MODEL` の指定を無視して Claude Sonnet 5 を使うため、分類器の挙動を前提にしている場合は確認する。","r":[76]},{"b":"`claude project purge` は `claude purge` に変わった（旧名も通知付きで動作）ので、スクリプトは新名称へ移行する。","r":[77]},{"b":"`/autocompact` の auto-compact window がモデルごとの保存になったため、モデルを切り替える運用では各モデルで設定を確認する。","r":[79]},{"b":"サーバーが完了を検知できない MCP URL プロンプトは「I'm done, continue」を押すまでツール呼び出しが進まないので、ブラウザでの操作後にこの選択を行う。","r":[80]},{"b":"agents view の `n:` フィルタと Ctrl+F 検索は Enter で最上位の行ではなく名前が最も一致するセッションを開くため、操作前に選択対象を確認する。","r":[78]}],"hl":[{"t":"長い会話と API 中断の修正","b":"応答の途中で API がタイムアウトしても、非対話セッションとサブエージェントは途中の応答から継続します。直前の返信のトークン使用量が 0 と報告された場合も、`Prompt is too long` で失敗せず自動コンパクトされます。","r":[8,9]},{"t":"Bash 権限チェックの穴を修正","b":"bypassPermissions モードやシェルの許可ルール下で、`bash -c` や `sh -c` 内の危険な `rm` が確認なしに実行される問題を修正しました。算術評価される `BASHPID` 代入も、黙って許可されず確認が出ます。","r":[54,28]},{"t":"フック漏れでツール呼び出しをブロック","b":"PreToolUse と PermissionRequest フックは、マッチングの失敗やツール入力の JSON 化失敗時にスキップされていました。今回からその呼び出しはブロックされます。","r":[57]},{"t":"`--resume` の欠落を複数修正","b":"コンパクション直後に復元した内容の欠落、ターン最後の応答が保存されない問題、読み込み中の書き換えによる途中切れを修正しました。2.1.286 以前のセッションで以前の思考が失われる問題も直っています。","r":[10,11,12,13]},{"t":"バックグラウンド時間制限の適用範囲変更","b":"バックグラウンドコマンドの時間制限は、`-p`・Agent SDK・CI・クラウドなどの無人セッションにだけ適用されます。ターミナル、デスクトップアプリ、VS Code のセッションでは制限がなくなります。","r":[75]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"auto mode の分類器まわりでは、長すぎる会話をコンパクトする改善と、Bedrock/Mantle での分類器切り替わりの修正が入りました。サンドボックスの heredoc 承認や Bash プロンプトの理由表示も改善されています。","refs":[15,16,27,28,45,54,65,72,75,76]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"agents view に Ctrl+F の名前検索と Alt+↑/↓ のグループ移動が加わり、`keybindings.json` で再割り当てできます。別セッションへのメッセージ未配信の通知や、プラグイン定義エージェントの設定反映も修正されています。","refs":[6,30,38,48,62,78]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"mods 向けに `$.ui.selection()` が加わり、`/code-review` には `--max-findings` が追加されました。プラグインの LSP プレースホルダー置換、git-subdir インストール、LSP のタイムアウト、`.claude/rules` の Write/Edit 時の読み込みなどが修正されています。","refs":[1,5,20,21,22,23,24,25,26,44,46,52,53,55,56,57,61,71,77,89]},{"a":"S","name":"セッション・履歴・圧縮","dg":"`--resume` で内容が欠ける・途中で切れる問題が4件修正されました。","refs":[10,11,12,13]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP サーバーが追加の OAuth スコープを求めたときの再認証プロンプトが加わりました。MCP ツールの二重実行や Claude in Chrome の確認過多なども修正されています。","refs":[4,41,42,43,80,81]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"クラウドセッション、Cowork、Remote Control、Claude Tag まわりの修正が中心です。クラウドセッションの内蔵 `gh api` は追加と改善があり、モデル復元や Stop 処理の不具合も直っています。","refs":[2,17,18,19,33,40,51,69,73,74,82,83,84,85,86,87,88]},{"a":"H","name":"headless・SDK・API","dg":"API タイムアウトの継続処理、構造化出力を無効にする `CLAUDE_CODE_DISABLE_STRUCTURED_OUTPUTS`、OpenTelemetry の記録、無人セッションの再試行、SIGTERM や認証更新まわりの修正が入りました。","refs":[8,14,31,32,34,36,37,39]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"自動コンパクトの失敗修正に加え、`/autocompact` はモデルごとの保存になりました。Claude 3 系での PDF 後の失敗や、初回リクエストの出力上限の扱いも修正されています。","refs":[9,49,58,79]},{"a":"U","name":"UI・表示・入力","dg":"Ctrl+C で消したプロンプトを Up キーで復元できるようになりました。スクリーンリーダーモードの改善や、フルスクリーンでの異常終了、カーソル位置の修正も含まれます。","refs":[3,7,29,59,63,64,66,67,68,70]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"`/login` が保存失敗や `--bare` セッションで誤って成功を示す問題を修正しました。Windows で再起動後にキーボードが効かない問題や、npm 自動更新の誤報告も直っています。","refs":[35,47,50,60]}],"skip":"表示の乱れ、特定環境での失敗、エラーメッセージや通知文言の調整といった細かな修正・改善が複数あります。","st":"ok","stale":false,"e":[[1,"mods 用に `$.ui.selection()` が追加され、全画面で選択した文字列と該当行を取得できる","Added `$.ui.selection()` for mods: returns the text you last selected in fullscreen mode and, when the selection lies within one transcript row, that row","M","new",2,"mod-dev",0,[]],[2,"GitHub CLI の無い cloud sessions に組み込み `gh api` を追加し、制御文字が端末に出力される問題も解消","Added a built-in `gh api` to cloud sessions whose image has no GitHub CLI, and fixed the built-in sending control characters from file names, jq filters or GitHub errors to the terminal","I","new",2,"cloud",0,[]],[3,"Ctrl+C で消した入力を空プロンプトで Up キーを押すと、貼り付けテキストや画像ごと復元できる","Added recovery for a prompt cleared with Ctrl+C: pressing Up on the empty prompt brings the draft back, including pasted text and images","U","new",2,"cli",0,[]],[4,"ツール呼び出し中に MCP サーバーが追加の OAuth スコープを求めると再認証プロンプトを表示","Added a re-authenticate prompt when an MCP server asks for more OAuth scope during a tool call","C","new",2,"cli",0,[]],[5,"/code-review に `--max-findings \u003cn\u003e|all` を追加し、`--max-findings default` を渡すまで指定を保持","Added `--max-findings \u003cn\u003e|all` to /code-review to report more or fewer findings than the usual limit; the choice is reused until you pass `--max-findings default`","M","new",2,"cli",0,[]],[6,"agents view で Ctrl+F によるセッション名検索と Alt+↑/↓ のグループ移動を追加し、`keybindings.json` で変更可能","Added Ctrl+F to find a session by name and Alt+↑/↓ to jump between groups in the agents view; both, and rename, can be rebound in keybindings.json","A","new",2,"cli",0,[]],[7,"スクリーンリーダーモードで、プラン承認時（Shift+Tab 含む）に新しい権限モードを読み上げる","Added a screen reader mode announcement of the new permission mode when you approve a plan, including with Shift+Tab","U","new",1,"cli",0,[]],[8,"応答途中の API タイムアウトでもターンが失敗せず、非対話セッションとサブエージェントは部分応答から継続し、thinking のみの応答は再試行","Fixed mid-response API timeouts failing the turn: non-interactive sessions and subagents now continue from the partial response, and thinking-only responses are retried","H","fix",3,"cli,sdk",0,[]],[9,"直前の応答のトークン使用量が 0 と報告されても、長い会話が \"Prompt is too long\" で失敗せず自動圧縮される","Fixed long conversations failing with \"Prompt is too long\" instead of auto-compacting when the last reply reported zero token usage","L","fix",3,"cli",0,[]],[10,"`--resume` で、直前の compaction が復元したファイルなどのコンテキストが欠落しなくなる","Fixed `--resume` sometimes dropping files and other context that a compaction had just restored","S","fix",2,"cli",0,[]],[11,"再開したセッションでもターン最後の応答が保存され、次の `--resume` でプロンプトが未回答に見えない","Fixed a resumed session sometimes not saving the last response of a turn, so that the next `--resume` showed the prompt unanswered","S","fix",2,"cli",0,[]],[12,"同一セッションが読み込み中にファイルを書き換えても、resume が途中で切れた transcript を読み込まない","Fixed resume occasionally loading a transcript cut short when the same session rewrote the file during the load","S","fix",1,"cli",0,[]],[13,"2.1.286 以前で始めた会話を再開しても、モデルの過去の thinking が失われない","Fixed resuming a conversation started on 2.1.286 or earlier dropping the model's earlier thinking","S","fix",2,"cli",0,[]],[14,"Mantle や structured outputs を拒否するゲートウェイ経由でも、セッションタイトル・メモリ想起・prompt hook が動作し、`CLAUDE_CODE_DISABLE_STRUCTURED_OUTPUTS` で無効化可能","Fixed session titles, memory recall and prompt hooks failing on Mantle or behind gateways that reject structured outputs; added `CLAUDE_CODE_DISABLE_STRUCTURED_OUTPUTS` to turn structured outputs off","H","fix",2,"cli,sdk",0,[]],[15,"auto mode の拒否メッセージが、Bash 以外のツールでは Bash の権限ルールを案内しない","Fixed auto mode denials pointing Claude at a Bash permission rule when the blocked tool was not Bash","T","fix",1,"cli",0,[]],[16,"Bedrock と Mantle の auto mode が、旧モデルへのリクエスト後も残りのセッションでローカル分類器に切り替わらない","Fixed auto mode on Bedrock and Mantle switching to the local classifier for the rest of the session after a request to an older model, such as a WebFetch summary or a `sonnet` subagent","T","fix",2,"cli,sdk",0,[]],[17,"新しく選んだモデルで再起動した cloud session が、サーバーに拒否されたモデルで応答しない","Fixed cloud sessions that restarted on a newly picked model replying with that model after the server refused it","I","fix",1,"cloud",0,[]],[18,"未承認 URL の WebFetch 許可プロンプトが 5 分間未回答でも、Cowork cloud session が入力待ち表示のままにならない","Fixed Cowork cloud sessions staying marked as waiting for input after a WebFetch permission prompt for an unapproved URL went unanswered for five minutes","I","fix",1,"cloud",0,[]],[19,"別デバイスで開始した Cowork cloud session にスマートフォンから参加しても、プロンプト候補が表示される","Fixed prompt suggestions not appearing on a phone that joins a Cowork cloud session started on another device","I","fix",1,"cloud",0,[]],[20,"Claude Code 再起動前に描画されたビューで、mod のボタンが別ボタンの動作を実行しない","Fixed a mod's button sometimes running a different button's action when pressed on a view drawn before Claude Code restarted","M","fix",1,"mod-dev",0,[]],[21,"パースできない diff を含む `Code` 要素があっても、plugin の pane が空にならず通常のコードとして描画","Fixed a plugin's pane showing nothing when one `Code` element held a diff that does not parse; it now draws as plain code","M","fix",1,"mod-dev",0,[]],[22,"plugin の LSP サーバーに、`${user_config.*}` や `${CLAUDE_PLUGIN_ROOT}` がリテラルでなく置換後の値で渡される","Fixed plugin LSP servers receiving literal `${user_config.*}` and `${CLAUDE_PLUGIN_ROOT}` placeholders in `initializationOptions` and `settings` instead of substituted values or manifest defaults","M","fix",2,"mod-dev",0,[]],[23,"worktree 内のサブエージェントで、plugin の `tool.call` hook が Bash を失敗させたりファイル検索先を誤らせたりしない","Fixed a plugin's `tool.call` hook making Bash fail and file searches read the wrong folder in subagents that run in a worktree","M","fix",2,"mod-dev",0,[]],[24,"git 2.39 未満（Ubuntu 22.04 の 2.34 など）でも `git-subdir` plugin のインストールが成功し、不完全なキャッシュも残らない","Fixed `git-subdir` plugin installs failing, or caching an incomplete plugin, on older git (before 2.39, e.g. Ubuntu 22.04's 2.34)","M","fix",1,"cli",0,[]],[25,"`--plugin-dir` で読み込んだ plugin も `/plugin` に \"Configure options\" を表示","Fixed plugins loaded with `--plugin-dir` not showing \"Configure options\" in `/plugin`","M","fix",1,"mod-dev",0,[]],[26,"plugin のタイマーや読み取りの実行中に再読み込み・無効化しても、バックグラウンドセッションが終了しない","Fixed background sessions ending when a plugin was reloaded or disabled while one of its timers or reads was still running","M","fix",2,"mod-dev",0,[]],[27,"sandbox auto-allow 下で、本文が平文と単純な `$VAR` のみの引用符なし heredoc（`python3 \u003c\u003cEOF`）が毎回承認を求めない","Fixed sandboxed heredocs with an unquoted delimiter (`python3 \u003c\u003cEOF`) asking for approval on every run under sandbox auto-allow when the body holds only plain text and simple `$VAR` references","T","fix",2,"cli",0,[]],[28,"値がシェルで算術評価される `BASHPID` 代入は、黙って許可されず事前に確認を求める","Fixed Bash tool permission check to prompt before a `BASHPID` assignment whose value the shell would evaluate as arithmetic, instead of allowing it silently","T","fix",3,"cli",0,[]],[29,"plugin や mod がプロンプト上に行を表示中にバックグラウンドタスクのダイアログを開いても、全画面セッションが終了しない","Fixed fullscreen sessions exiting with \"unrecoverable interface error\" when opening the background tasks dialog while a plugin or mod showed rows above the prompt","U","fix",2,"cli",0,[]],[30,"他セッションへのメッセージが保留された場合、配信されなかった旨とセッション名を通知し、SDK では途中で Claude が把握できる","Fixed Claude reporting a message to another session as delivered when that session held it: the notice now says it wasn't delivered and names the session, and in SDK sessions Claude can now learn of it mid-turn","A","fix",2,"cli,sdk",0,[]],[31,"OpenTelemetry の `claude_code.tool.blocked_on_user` span が、`-p`・SDK・PreToolUse hook 承認でも source と decision を正しく報告","Fixed OpenTelemetry `claude_code.tool.blocked_on_user` spans reporting `unknown` source or decision in `-p` and SDK sessions and for PreToolUse hook approvals","H","fix",1,"sdk",0,[]],[32,"`-p` や中断ターンで未回答に終わった権限確認でも `tool_decision` イベントが出力される","Fixed permission asks that ended unanswered, in `-p` or on an interrupted turn, emitting no `tool_decision` event","H","fix",1,"sdk",0,[]],[33,"Cowork cloud sessions で、`/compact` 前に送ったメッセージも履歴が残っていれば Edit と Retry が可能","Fixed Edit and Retry in Cowork cloud sessions refusing a message sent before `/compact` even though its history was still saved","I","fix",1,"cloud",0,[]],[34,"無人セッション（`CLAUDE_CODE_RETRY_WATCHDOG`）は、長いストリーム失敗後に数時間再試行せず、再度ストリーミングし 3 回のタイムアウトで諦める","Fixed unattended sessions (`CLAUDE_CODE_RETRY_WATCHDOG`) retrying for hours after a very long response stream failed; Claude Code now streams again, and gives up after three timeouts","H","fix",2,"sdk",0,[]],[35,"`/login` が安全な保存先への保存失敗を成功と表示せず、失敗を示し、ログインが反映されない場合は再試行を提案","Fixed `/login` reporting \"Login successful\" when credentials could not be saved to secure storage; it now shows the failure, and offers a retry when the new login didn't take effect (anthropics/claude-code#73861)","O","fix",2,"cli",0,["https://github.com/anthropics/claude-code/issues/73861"]],[36,"Bedrock の認証情報取得中に Stop しても、フォールバックモデルへ移行せずリクエストが終了する","Fixed a Stop during Bedrock credential lookup sometimes moving the session to a fallback model instead of ending the request","H","fix",1,"cli",0,[]],[37,"スリープ復帰時に他の Claude Code プロセスがサインイン中でも、`gcpAuthRefresh`/`awsAuthRefresh` のブラウザサインインが二重に開かない","Fixed a second `gcpAuthRefresh`/`awsAuthRefresh` browser sign-in opening when a laptop wakes from sleep while another Claude Code process is signing in","H","fix",1,"cli",0,[]],[38,"agent teams で、名前指定で起動した plugin 定義のエージェントが、既定値でなく自身のプロンプト・ツール・disallowedTools・effort で動作","Fixed agent teams: a plugin-defined agent spawned by name now runs with its own prompt, tools, disallowedTools and effort instead of the defaults","A","fix",2,"cli",0,[]],[39,"`timeout` や systemd が SIGCONT を併送しても、headless セッションが SIGTERM を無視しない","Fixed headless (`-p` / SDK) sessions occasionally ignoring SIGTERM when a supervisor such as `timeout` or systemd sends SIGCONT alongside it","H","fix",1,"sdk",0,[]],[40,"再起動した cloud session が、組織の強制モデル一覧で拒否されるモデルを復元しない","Fixed restarted cloud sessions restoring a model that the organization's enforced model list refuses","I","fix",1,"cloud,admin",0,[]],[41,"リモートサーバーの結果が 16 MB 超または解析不能でも、MCP ツール呼び出しが二重実行されない","Fixed MCP tool calls sometimes running twice when a remote server's result was over 16 MB or could not be parsed","C","fix",2,"cli",0,[]],[42,"Claude Desktop の Code タブのサブエージェントで、`memory` という名前のユーザー設定 MCP サーバーのツールが使える","Fixed subagents in Claude Desktop's Code tab getting none of the tools of a user-configured MCP server named `memory`","C","fix",1,"ide",0,[]],[43,"auto mode が使えない場合でも、許可済みサイトでの Claude in Chrome のスクリーンショットとページ読み取りは毎回確認しない（入力・遷移・JavaScript は確認）","Fixed Claude in Chrome asking before every screenshot and page read on a site you allowed when auto mode is unavailable (such as with `disableAutoMode` or an older model); typing, navigation and JavaScript still ask","C","fix",2,"cli",0,[]],[44,"GitHub SSH キーが無い macOS/Linux でも、`claude plugin install` が HTTPS にフォールバックし通知を表示","Fixed `claude plugin install` failing for GitHub-source plugins on macOS and Linux machines with no GitHub SSH key: the clone now falls back to HTTPS and prints a notice","M","fix",2,"cli,macos",0,[]],[45,"`permissions.blockReadsOutsideWorkingDirectories` 有効時も、git config ファイルへの `sandbox.credentials.files` が効く","Fixed `sandbox.credentials.files` entries on git config files not taking effect while `permissions.blockReadsOutsideWorkingDirectories` is on","T","fix",1,"cli,admin",0,[]],[46,"Team/Enterprise や managed settings の環境で、Artifact ツールのスライドやデザイン開始時に組織のデザインシステムが反映される","Fixed Claude leaving out your organization's design systems when starting slides or a design with the Artifact tool on Team and Enterprise plans or machines with managed settings","M","fix",1,"admin",0,[]],[47,"Claude Code の自己再起動（初回 gateway サインイン、provider 設定、`/tui`）後も Windows でキーボードが動作する","Fixed the keyboard not working on Windows after Claude Code restarts itself (first sign-in to a Claude apps gateway, provider setup, `/tui`)","O","fix",2,"windows",0,[]],[48,"`tools:` に多数の `Agent(...)` を列挙したエージェントの起動時にストールしない","Fixed a stall when launching an agent whose `tools:` lists very many `Agent(...)` entries","A","fix",1,"cli",0,[]],[49,"Claude 3 Opus と Claude 3 Sonnet で、PDF 全体が会話に入った後も毎ターン失敗しない","Fixed sessions on Claude 3 Opus and Claude 3 Sonnet failing on every turn after a whole PDF entered the conversation","L","fix",1,"cli",0,[]],[50,"プラットフォーム用ネイティブバイナリのダウンロード失敗時、npm 自動更新が成功と報告しない","Fixed the npm auto-updater reporting success when the platform-native binary failed to download and only the placeholder `claude` stub was installed","O","fix",2,"cli",0,[]],[51,"Remote Control のクリーンアップが、接続中や別プロセスが再接続した直後のセッションをアーカイブしない","Fixed Remote Control cleanup archiving a session that is still connected or was just re-attached by another Claude Code process","I","fix",2,"cloud",0,[]],[52,"`owner/repo` plugin マーケットプレイスで SSH と HTTPS の両方が失敗した際、両方のエラーを最初に試した方式を上にして表示","Fixed `owner/repo` plugin marketplaces showing only the second attempt's error when both the SSH and HTTPS fetch fail; both errors are now shown, with the transport tried first on top","M","fix",1,"cli",0,[]],[53,"パス限定の `.claude/rules` とネストした CLAUDE.md が、Write や Edit によるファイル作成・変更でも読み込まれる","Fixed path-scoped `.claude/rules` and nested CLAUDE.md files not loading when Write or Edit creates or changes a file in their scope (previously only Read loaded them)","M","fix",2,"cli",0,[]],[54,"bypassPermissions モードやシェル allow ルール下で、`bash -c`/`sh -c` 内の `/` やホームへの危険な `rm` が確認なしで実行されない","Fixed a dangerous `rm` (such as one on `/` or the home directory) inside a `bash -c` or `sh -c` script running without a prompt in bypassPermissions mode or under a shell allow rule (anthropics/claude-code#96300)","T","fix",3,"cli",0,["https://github.com/anthropics/claude-code/issues/96300"]],[55,"言語サーバーが動的機能登録を使う、または応答しない場合も LSP ツール呼び出しがハングせず 60 秒でタイムアウト（`requestTimeout`）","Fixed LSP tool calls hanging indefinitely when a language server uses dynamic capability registration or stops responding; requests now time out after 60s (per-server `requestTimeout`)","M","fix",2,"cli",0,[]],[56,"バックグラウンドエージェント実行中は `idle_prompt` 通知 hook が発火しない","Fixed `idle_prompt` notification hooks firing while background agents are still running (anthropics/claude-code#93672)","M","fix",1,"mod-dev",0,["https://github.com/anthropics/claude-code/issues/93672"]],[57,"PreToolUse と PermissionRequest hook は、照合失敗やツール入力の JSON 化失敗でスキップされず、呼び出しをブロック","Fixed PreToolUse and PermissionRequest hooks being skipped when matching them failed or the tool's input could not be serialized to JSON; the call is now blocked","M","fix",3,"mod-dev",0,[]],[58,"新規環境やモデル切替後の最初のリクエストがサーバー側の出力上限と auto-compact window を使う（最大 1.5 秒待機することがある）","Fixed the first request in a fresh environment or after a model switch using the built-in output limit and auto-compact window, not the server's; that request may now wait up to 1.5 seconds","L","fix",1,"cli",0,[]],[59,"ctrl+enter でキュー済みメッセージを送った後、Interrupted 行に \"What should Claude do instead?\" のヒントが出ない","Fixed the \"What should Claude do instead?\" hint showing on the Interrupted row after sending queued messages with ctrl+enter","U","fix",1,"cli",0,[]],[60,"`--bare` セッションの `/login` が保存済みログインを置き換えず、使える認証情報を案内する","Fixed `/login` in a `--bare` session running a sign-in the session never reads, which could replace your saved login; it now says which credentials work","O","fix",2,"cli,sdk",0,[]],[61,"InstructionsLoaded hook が、サブエージェントのファイルアクセス時に `agent_id` と `agent_type` を含み、ファイルアクセス時のロードで effort も報告","Fixed the InstructionsLoaded hook omitting agent_id and agent_type when a subagent's file access loads a rule or nested CLAUDE.md; rules and nested CLAUDE.md files loaded on file access now also report effort","M","fix",1,"mod-dev",0,[]],[62,"`claude mcp serve` の Agent ツールが利用可能なエージェントを返し、`subagent_type` を受け付ける","Fixed the Agent tool in `claude mcp serve` always reporting no available agents and rejecting every subagent_type","A","fix",1,"sdk",0,[]],[63,"全画面 transcript viewer の検索と `/theme` のカスタム色検索で、端末カーソルが入力位置に追従する","Fixed the terminal cursor not following the typed text in the fullscreen transcript viewer's search and in `/theme`'s custom color search","U","fix",1,"cli",0,[]],[64,"スクリーンリーダーモードの `/permissions` で、ルール番号を入力するとその番号が選ばれ検索ボックスが開かない","Fixed `/permissions` in screen reader mode: typing a rule's number now picks it instead of opening the search box","U","fix",1,"cli",0,[]],[65,"auto mode で会話が分類器の確認限界を超えるほど長くなると、毎回確認や失敗にせず圧縮する","Improved auto mode: when a conversation grows too long for the client-side safety classifier to review, it is now compacted instead of prompting for, or failing, every tool call","T","improve",2,"cli",0,[]],[66,"スクリーンリーダーモードで、単語削除などの短い通知が次のキー入力か上方の画面変化まで表示され続ける","Improved screen reader mode: short announcements, such as a deleted word, now stay on screen until your next key press or until something above them on screen changes","U","improve",1,"cli",0,[]],[67,"スクリーンリーダーモードの質問ダイアログで、回答済みの質問のボックス横に \"answered\" と表示","Improved screen reader mode: answered questions in question dialogs now say \"answered\" beside their box","U","improve",1,"cli",0,[]],[68,"組織が usage credit リクエストを無効にしている Team/Enterprise メンバーへの `/usage-credits` のメッセージを改善","Improved the `/usage-credits` message shown to Team and Enterprise members whose organization has turned off usage credit requests","U","improve",1,"admin",0,[]],[69,"`alwaysLoad: false` の stdio MCP サーバーがあっても、cloud session の新規会話の初回ターンが待たされない","Improved cloud sessions: a new conversation's first turn no longer waits for a stdio MCP server whose config sets `alwaysLoad: false`","I","improve",2,"cloud",0,[]],[70,"\"You should know\" の注記が、判断した主体に応じて「we」「main agent」「you」を使い分ける","Improved \"You should know\" notes to say \"we\", \"the main agent\" or \"you\" depending on who was responsible for a decision","U","improve",1,"cli",0,[]],[71,"artifact の DB 書き込みがサイズ上限で拒否された際、上限値と空き容量を作る方法をエラーに表示","Improved the error for an artifact database write refused at the database's size limit: it now states the limit and what frees space","M","improve",1,"mod-dev",0,[]],[72,"コマンドの一部を実行前に検査できない場合の Bash 権限プロンプトが、より短い理由を示す","Improved Bash permission prompts to give a shorter reason when part of a command can't be checked before it runs","T","improve",2,"cli",0,[]],[73,"Self-hosted runner の `gh api` で、拒否時に `gh api` 相当を出力し、`--paginate` が全ページを辿り、入れ子の `claude` でも消えない","Self-hosted runner: Improved the built-in `gh api`: a refused gh command now prints its `gh api` equivalent, `--paginate` follows every page of a repository's lists, and a nested `claude` no longer removes it","I","improve",1,"cloud",0,[]],[74,"Remote Control がサーバー認証情報の期限切れから復旧する間もセッションを維持し、サーバー障害で断念してもセッションを残す","Improved Remote Control's recovery from an expired server credential: sessions stay connected during renewal and are kept if it gives up after a server outage","I","improve",2,"cloud",0,[]],[75,"バックグラウンドコマンドの時間制限は無人セッション（`-p`、Agent SDK、CI、cloud）のみに適用され、ターミナル・デスクトップ・VS Code では無制限","Changed the background command time limit to apply only in unattended sessions (`-p`, Agent SDK, CI, cloud); terminal, desktop app and VS Code sessions have no limit","T","change",3,"cli,sdk,cloud",1,[]],[76,"クライアント側 auto mode 分類器は、Claude Sonnet 5.5 や Opus 5.5 を指す `ANTHROPIC_DEFAULT_SONNET_MODEL` 固定を無視し Claude Sonnet 5 を使う","Changed the client-side auto mode classifier to ignore an `ANTHROPIC_DEFAULT_SONNET_MODEL` pin that names Claude Sonnet 5.5 or Opus 5.5 and use Claude Sonnet 5 instead","T","change",1,"cli,admin",1,[]],[77,"`claude project purge` が `claude purge` に改名され、旧名も通知付きで動作","Changed `claude project purge` to `claude purge`; the old name still works and prints a notice","M","change",1,"cli",0,[]],[78,"agents view の `n:` フィルタと Ctrl+F 検索で、Enter は先頭行でなく名前が最も一致するセッションを開く","Changed the agents view `n:` filter (and Ctrl+F search) so Enter opens the session whose name matches best instead of the top row","A","change",1,"cli",0,[]],[79,"`/autocompact` が auto-compact window をモデルごとに保存し、切替時も各モデルの設定を保持","Changed `/autocompact` to save the auto-compact window per model, so each model keeps its own setting when you switch","L","change",2,"cli",0,[]],[80,"完了を報告できないサーバーの MCP URL プロンプトは \"I'm done, continue\" を待ってからツール呼び出しを続行し、ブラウザ操作を先に終えられる","Changed MCP URL prompts from servers that can't report when you're done to wait for \"I'm done, continue\" before the tool call continues, so you can finish in the browser first","C","change",2,"cli",0,[]],[81,"[VSCode] 認可後も claude.ai コネクタが \"Needs authentication\" のままになる問題に対し、MCP servers ダイアログに Check connection を追加","[VSCode] Fixed a claude.ai connector staying on \"Needs authentication\" after you authorize it: the MCP servers dialog now offers Check connection","C","fix",2,"ide",0,[]],[82,"[VSCode] 任意設定の New Conversation ショートカット（Cmd/Ctrl+N）が、操作中の Claude ビューだけで新しい会話を開始","[VSCode] Fixed the opt-in New Conversation shortcut (Cmd/Ctrl+N) starting a conversation in every visible Claude view instead of only the one you are in","I","fix",1,"ide",0,[]],[83,"[VSCode] 表示中のセッションをアーカイブすると、次の保存済みセッションでなく新しい会話を開始","[VSCode] Fixed the chat view resuming the next saved session after you archive the one it shows; it now starts a new conversation instead","I","fix",1,"ide",0,[]],[84,"[Cloud sessions] 無関係なセキュリティ設定の読み込み中や失敗時も、admin settings の Cloud sessions スイッチがオフに固定されない","[Cloud sessions] Fixed the Cloud sessions switch in Claude Code admin settings staying locked off while an unrelated security setting was loading or had failed to load","I","fix",1,"cloud,admin",0,[]],[85,"[Cloud sessions] self-hosted runner の起動中に Stop すると、キュー済みメッセージもキャンセルされ、起動後に実行されない","[Cloud sessions] Fixed pressing Stop while a self-hosted runner was still starting not cancelling the queued message, which could then run once the runner was up","I","fix",2,"cloud",0,[]],[86,"[Claude Tag] 自動作成されたチャンネル設定で、常に失敗する \"Remove this scope\" の選択肢を表示しない","[Claude Tag] Fixed Claude Tag admin settings offering a \"Remove this scope\" option, which always failed, on channels whose settings were created automatically","I","fix",1,"cloud,admin",0,[]],[87,"[Claude Tag] 別チャンネルで読んだだけの関連 Slack スレッドも追跡し、更新を依存する会話へ届ける","[Claude Tag] Improved Claude to also follow a related Slack thread in another channel that it only read, so updates there reach the conversation that depends on them","I","improve",1,"cloud",0,[]],[88,"[Claude Tag] チャンネル Configure ページの保存エラーで、長すぎる指示には短縮を促し、アクセス喪失による拒否では再試行を促さない","[Claude Tag] Improved save errors on a channel's Configure page: too-long channel instructions now say to shorten them, and a save refused for lost access no longer says to try again","I","improve",1,"cloud,admin",0,[]],[89,"`claude plugin test` が、古い保存設定を読んだだけで mods をリモート無効と報告しない","Fixed `claude plugin test` reporting mods as turned off remotely when it had only read an out-of-date saved setting","M","fix",1,"mod-dev",0,[]]]},{"v":"2.1.287","date":"2026-10-02（金）01:59","dshort":"10-02 01:59","nb":6,"head":"1M コンテキスト既定化と権限まわりの安全性修正が中心","sum":"Bedrock・Vertex などで Opus 4.7+ と Fable の既定が 1M コンテキストになり、Bash の書き込み権限の扱いも厳格化されました。リモート／クラウドセッション、MCP、スクリーンリーダーモード、VSCode 拡張の修正が多数を占めます。企業・クラウド利用者と MCP サーバー運用者に影響が大きいリリースです。","watch":[{"b":"2025-11-25 プロトコルの MCP サーバーが更新後に接続できなくなった場合は、その MCP 設定エントリに `\"bareElicitationCapability\": true` を追加してください。","r":[5]},{"b":"Bedrock・Vertex・Foundry・Claude apps gateway で 1M コンテキストが既定になったため、200K に留めたい場合は `CLAUDE_CODE_DISABLE_1M_CONTEXT=1` を設定してください。","r":[79]},{"b":"`Bash` の全体 allow ルールや許可フックでも、ファイルツールが拒否するファイルへの書き込みは確認が出るため、自動化している場合は承認の流れを見直してください。","r":[81]},{"b":"リポジトリ内 symlink 経由で機微ファイルやワークツリー外へ書き込むコマンドは、`~` を含む行でも行き先が表示されて確認待ちになります。","r":[78]},{"b":"MCP サーバーの `alwaysLoad: false` はそのサーバーの全ツールを tool search の背後に遅延させるため、常時読み込みが必要なら設定を確認してください。","r":[83]},{"b":"`claude agents` からの返信はキュー済みメッセージになり、`/stop` 以外のスラッシュコマンドはターン終了後に実行されます。","r":[80]},{"b":"自動モデル切替後も現在の effort レベルが維持されるため、新モデルの既定値を期待している場合は設定を確認してください。","r":[85]},{"b":"Windows・Linux の右クリック貼り付けと Linux の中クリック貼り付けはボタンを離した時点で実行され、離す前にポインタを動かすと取り消されます。","r":[82]},{"b":"スクリーンリーダーモードは行書き込み前の一時停止をしなくなったため、従来の挙動が必要なら `CLAUDE_AX_PREPARK_MS=50` を設定してください。","r":[84]},{"b":"待機中の権限プロンプトは古い順に表示されるようになり、カウントダウン付きのものだけが前面に開きます。","r":[86]},{"b":"VSCode の Claude in Chrome「Enabled by default」は、エディタ自身のセッションも接続するようになりました（ブラウザ操作の前には確認が出ます）。","r":[99]}],"hl":[{"t":"1M コンテキストが既定に","b":"Bedrock、Vertex、Foundry、Claude apps gateway で Opus 4.7+ と Fable が `[1m]` 接尾辞なしで 1M コンテキストを既定で使います。200K に戻すには `CLAUDE_CODE_DISABLE_1M_CONTEXT=1` を設定します。","r":[79]},{"t":"Bash 書き込み権限の厳格化","b":"`Bash` の全体 allow ルールや許可フックでも、ファイルツールが拒否する Anthropic プロファイルストアや認証情報ファイルへの書き込みは確認を求めます。リポジトリ内 symlink 経由の機微ファイル書き込みも、行き先を示して確認待ちになります。","r":[81,78]},{"t":"危険な rm の保護漏れを修正","b":"`/` やホームへの `rm` が、同じコマンドで `~` やワイルドカードのパスへリダイレクトすると常時確認の保護を失う問題を修正しました。","r":[17]},{"t":"MCP の URL プロンプト対応","b":"2025-11-25 プロトコルの MCP サーバーからの URL プロンプト（サインインなど）に対応しました。接続できなくなったサーバーには `bareElicitationCapability` の設定が必要な場合があります。","r":[5]},{"t":"リモート／クラウドの安定化","b":"Remote Control の再接続待ち、ファイル送信のタイムアウトと再試行、大きな画像の送信、compaction 中の再起動による会話消失などを修正しました。","r":[9,47,53,55,69]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"Bash の権限判定が厳格化され、権限プロンプトの表示も整理されました。`__proto__` という名前の MCP ツールで組織の権限上限が落ちる問題や、Linux サンドボックスの不要なハンドル継承も修正されています。","refs":[6,17,22,24,37,39,43,72,77,78,81]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"`claude agents` に `n:\u003ctext\u003e` フィルターが加わり、バックグラウンドセッションの再開や権限プロンプト表示の不具合が直りました。クラウド／SDK セッションで途中追加したリポジトリの skills・plugins の読み込みも修正されています。","refs":[3,20,36,54,80]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"Claude Mods とビルトインの You should know が追加されました。プラグイン側では marketplace のエラー説明、`--sparse` や `git-subdir` のインストール、フック数の表示、`asyncRewake` フックの繰り返し通知などが修正・改善されています。","refs":[1,2,10,46,48,51,52,62,63,67]},{"a":"S","name":"セッション・履歴・圧縮","dg":"フォルダの CLAUDE.md が再開や compaction 後に二重に添付される問題と、commit attribution の注意書きが compaction 後にツール結果内へ入る問題を修正しました。","refs":[19,26]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP の URL プロンプトに対応し、大きな結果の扱いやヘッドレスでの起動再試行が改善されました。接続やプロトコルバージョン変更時の不具合も複数修正されています。","refs":[5,13,25,50,57,73,76,83]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"リモート、クラウド、Remote Control、VSCode、Claude Tag、Code Review の修正が中心です。ファイル送信の再試行・ストリーミング、VSCode のバックグラウンド実行追加、GitHub トークン拒否時の fetch/push 失敗修正などがあります。","refs":[7,8,9,47,49,53,55,56,58,69,70,74,75,87,88,89,90,91,92,93,94,95,96,97,98,99,100,101,102,103,104,105,106]},{"a":"H","name":"headless・SDK・API","dg":"OpenTelemetry の `user_prompt` イベントに `prompt_text` が追加されました。Bedrock / Vertex のモデル確認、SDK や `claude -p` のストリーミング、認証エラー表示などの修正が含まれます。","refs":[4,11,12,16,18,33,35,42,44,60,64,65]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"モデル選択まわりで、Fable の保存既定が最新版に追従するようになりました。`/advisor` の組み合わせ判定、モデル切替時の extended thinking 保持、自動切替時の effort 維持も変わっています。","refs":[14,15,21,79,85]},{"a":"U","name":"UI・表示・入力","dg":"スクリーンリーダーモードの修正が大半で、`/config` や `/memory` の操作性、light テーマのコントラスト、Reduce motion の反映も改善されました。`/feedback` と `/bug` では、事前入力の GitHub issue に直近のエラーメッセージが含まれなくなりました。","refs":[23,27,28,29,30,31,32,34,40,41,45,61,66,68,71,82,84,86]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"HTTP プロキシ配下の `claude remote-control` 登録失敗と、Windows で入力をパイプしたときの Raw mode エラーを修正しました。","refs":[38,59]}],"skip":"表示の乱れ、スクリーンリーダーモードの細かな読み上げ、まれな環境での失敗に関する修正が約 50 件あります。","st":"ok","stale":false,"e":[[1,"Claude Mods 追加: plugins がより深い挙動を変更できる","Added Claude Mods: plugins may now modify deeper behavior","M","new",2,"mod-dev",0,[]],[2,"組み込み mod「You should know」を `/plugin enable cc-plugin-you-should-know@builtin` で有効化でき、サイドエージェントが見落としを指摘する","Added You should know, a built-in mod where a side agent watches your back and flags things you or Claude might miss. Turn it on with `/plugin enable cc-plugin-you-should-know@builtin` (for first-party sessions with telemetry on)","M","new",1,"cli",0,[]],[3,"agents ビューに `n:\u003ctext\u003e` フィルターを追加し、折りたたみ内の一致も表示、Enter で最初の一致を開く","Added an `n:\u003ctext\u003e` filter to the agents view that matches session names and tasks; a filter now shows matches in collapsed sections and Enter opens the first match","A","new",2,"cli",0,[]],[4,"OpenTelemetry の `user_prompt` イベントに `prompt` の複製 `prompt_text` を追加","Added `prompt_text` to the OpenTelemetry `user_prompt` event, a copy of `prompt` for backends that nest dotted keys; drop or mask it wherever you drop or mask `prompt` (anthropics/claude-code#70763)","H","new",1,"admin,sdk",0,["https://github.com/anthropics/claude-code/issues/70763"]],[5,"2025-11-25 プロトコルの MCP サーバーから URL プロンプトを受け付ける。接続不可なら `bareElicitationCapability: true` を設定","Added URL prompts from MCP servers on the 2025-11-25 protocol, for example to sign in. If a server no longer connects after this update, add \"bareElicitationCapability\": true to its MCP config entry","C","change",2,"cli",1,[]],[6,"Bash ツールを deny すると PowerShell ツールも無効になりシェルが無くなる場合に起動時警告を出す","Windows: Added a startup warning when denying the Bash tool also turns off the PowerShell tool, so Claude has no shell tool","T","new",1,"windows",0,[]],[7,"Self-hosted runner で GitHub CLI 未導入でも使える組み込み `gh api`（REST のみ）を追加","Self-hosted runner: Added a built-in `gh api` (REST only) for sessions that use Anthropic-managed git on macOS and Linux machines where the GitHub CLI is not installed","I","new",1,"cloud",0,[]],[8,"ユーザーアカウントを持たないエージェント所有のリモートセッションでも、組織が許可していれば fast mode が有効になる","Fixed fast mode staying off in remote sessions owned by an agent with no user account, even when the organization allows it","I","fix",1,"cloud",0,[]],[9,"Remote Control は再接続要求に応答が無くても 30 秒で打ち切って再試行し、メッセージ受信が数分止まらない","Fixed Remote Control not receiving messages for minutes at a time when a reconnect request got no response; it now gives up after 30 seconds and retries","I","fix",2,"cloud",0,[]],[10,"`asyncRewake` hook のスクリプトが無い場合、通知を繰り返さず壊れた hook を一度だけ報告する","Fixed hooks configured with `asyncRewake` waking Claude over and over with \"found issues\" notifications when the hook's script file is missing; the broken hook is now reported once","M","fix",1,"mod-dev",0,[]],[11,"モデルの応答ストリームが無データで停滞中でも、ツールのハートビートが SDK ホストに届く","Fixed tool heartbeats not reaching SDK hosts while the model's response stream was stalled with no data arriving","H","fix",1,"sdk",0,[]],[12,"Bedrock/Vertex の起動時モデル確認が `availableModels` の強制リストを尊重し、`/model` が Opus 1 行に縮まない","Fixed Bedrock and Vertex startup model checks ignoring an enforced `availableModels` list, which could collapse `/model` to one Opus row","H","fix",1,"cli",0,[]],[13,"Chrome に接続できないとき、Claude in Chrome のブラウザ選択が JSON パースエラーを出さない","Fixed the Claude in Chrome browser picker showing a JSON parse error when Chrome could not be reached","C","fix",1,"cli",0,[]],[14,"claude.ai ログインで `/model` の Fable を選ぶと、保存される既定が Opus や Sonnet 同様に最新の Fable に追従する","Fixed picking Fable in `/model` on a claude.ai login saving the current version's id, so your saved default now follows the newest Fable like Opus and Sonnet do","L","fix",1,"cli",0,[]],[15,"Opus 5.5 と Sonnet 5.5 の切替（`/model`、`opusplan`）で過去の MCP ツール告知を書き換えず、以前の extended thinking が失われない","Fixed switching between Opus 5.5 and Sonnet 5.5 (`/model`, `opusplan`) rewriting earlier MCP tool announcements, which could drop earlier extended thinking","L","fix",1,"cli",0,[]],[16,"thinking で始まる応答の途中で Bedrock Guardrails がブロックしても、API エラーでなくガードレールのメッセージで終わる","Fixed Amazon Bedrock Guardrails blocks that arrive mid-response ending the turn with an API error instead of the guardrail's message when the reply began with thinking","H","fix",1,"cli",0,[]],[17,"`/` やホームへの危険な `rm` が、`~` やワイルドカードへの出力リダイレクトを伴っても常時確認の保護を保つ","Fixed a dangerous `rm` (such as one on `/` or the home directory) losing its always-ask safeguard when the same command also redirected output to a `~` or wildcard path","T","fix",3,"cli",0,[]],[18,"返信の実行中にモデルを切り替えても、`claude -p` と SDK セッションで後続メッセージごとにモデルフォールバックを繰り返さない","Fixed `claude -p` and SDK sessions repeating a model fallback on every later message after the model was switched while a reply was running","H","fix",1,"sdk",0,[]],[19,"セッション再開や compaction の後に、フォルダの CLAUDE.md が二重に添付されない","Fixed a folder's CLAUDE.md being attached a second time after resuming a session or after a compaction","S","fix",1,"cli",0,[]],[20,"エージェント終了で worktree が削除された後でも、バックグラウンドセッションを `claude agents` から開き直せる","Fixed background sessions that could not be reopened from `claude agents` after the agent exited and removed the worktree the session was started in","A","fix",2,"cli",0,[]],[21,"`/advisor` の組み合わせ判定で Sonnet 5.5 が Opus 4.7/4.8 を助言でき、API が拒否する advisor は黙って捨てず事前に警告する","Fixed `/advisor` pairing checks: Sonnet 5.5 can now advise Opus 4.7 and 4.8, and advisors the API would refuse are flagged up front instead of being silently dropped","L","fix",1,"cli",0,[]],[22,"Bash の権限プロンプトが「Contains simple_expansion」のような内部名でなく平易な説明を表示する","Fixed Bash permission prompts showing internal parser names such as \"Contains simple_expansion\" instead of a plain explanation","T","fix",1,"cli",0,[]],[23,"低速・高負荷環境で長い会話のスクロールキーを押し続けても、フルスクリーンが回復不能な UI エラーで終了しにくい","Fixed a cause of fullscreen sessions on slow or busy machines exiting with \"Claude Code exited after an unrecoverable interface error\" while a scroll key was held in a long conversation","U","fix",1,"cli",0,[]],[24,"`__proto__` という名前の MCP ツールでも、組織のツール別権限上限が無視されず適用される","Fixed organization per-tool permission ceilings being silently dropped for an MCP tool named `__proto__`","T","fix",2,"admin",0,[]],[25,"JSON 保存された大きな MCP 結果に、1 行を分割できない Read の offset/limit でのページングを指示しない","Fixed Claude being told to page large MCP results saved as JSON with Read's offset and limit, which cannot split one long line","C","fix",1,"cli",0,[]],[26,"compaction 後にコミット帰属リマインダーがツール結果内に届かない","Fixed the commit attribution reminder being delivered inside a tool result after a compaction","S","fix",1,"cli",0,[]],[27,"スクリーンリーダーモードで、検索ボックス（`/resume`、`/permissions` 等）やサインインコード欄のカーソルが入力文字の位置に来る","Fixed screen reader mode leaving the cursor away from the typed text in search boxes (such as /resume and /permissions) and sign-in code fields","U","fix",1,"cli",0,[]],[28,"スクリーンリーダーモードで、`/rewind` の要約オプションは追加コンテキストが任意なので、未入力でも Enter が通る","Fixed screen reader mode refusing Enter with nothing typed on /rewind's summarize options, whose added context is optional","U","fix",1,"cli",0,[]],[29,"スクリーンリーダーモードで、Tab が効かない承認プロンプトに「Tab to amend」を出さない","Fixed screen reader mode showing a \"Tab to amend\" hint on approval prompts, where Tab does nothing","U","fix",1,"cli",0,[]],[30,"スクリーンリーダーモードで、`/permissions` と `/mcp` の無効な矢印キーや、空メニュー・検索中の「Select with numbers」を案内しない","Fixed screen reader mode listing arrow keys that do nothing in /permissions and /mcp, and saying \"Select with numbers\" in empty menus or while a search box has the keys","U","fix",1,"cli",0,[]],[31,"スクリーンリーダーモードで、ファイル編集承認プロンプトなどの diff に変更行も読み上げられる","Fixed screen reader mode leaving out the changed lines in file edit approval prompts and other diffs","U","fix",1,"cli",0,[]],[32,"スクリーンリーダーモードで、`claude --teleport` の進捗画面と確認中の MCP フォーム欄がスピナー毎に再送されない","Fixed screen reader mode sending the `claude --teleport` progress screen, and an MCP form field while it is being checked, to the screen reader again on every spinner frame","U","fix",1,"cli",0,[]],[33,"`CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS` がセッションタイトルと prompt-hook のリクエストから構造化出力形式も除き、Bedrock ベースのゲートウェイで拒否されない","Fixed `CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS` not removing the structured-output format from session-title and prompt-hook requests, which Bedrock-backed gateways reject","H","fix",1,"sdk",0,[]],[34,"スクリーンリーダーモードで、前の画面が端末より高い場合も 2 つ目の承認プロンプト上部、`/config` の変更行、却下プランの行が読み上げられる","Fixed screen reader mode leaving out the top lines of a second approval prompt, a changed /config row or the rejected-plan line when the previous screen was taller than the terminal window","U"

n the CA certificate is passed to git as `GIT_CONFIG_COUNT` environment pairs","T","fix",1,"cli",0,[]],[39,"sandbox 内の `git` が credential helper に sandbox プロキシのログイン保存を要求せず、\"failed to store\" が出ない","Fixed sandboxed `git` asking credential helpers to store the sandbox proxy's login, which printed \"failed to store\"","T","fix",1,"cli",0,[]],[40,"managed `sandbox` 設定の一部が不正でも全体を無視せず、不正値は fail closed にし残りは適用","Fixed managed `sandbox` settings being ignored entirely when one nested value was invalid; the invalid value now fails closed and the rest of the block still applies","T","fix",2,"admin",0,[]],[41,"git リポジトリのサブディレクトリで起動しても、Claude の自動メモリ編集が機密ファイル書き込みとしてブロックされない","Fixed Claude's edits to its own auto-memory notes being blocked as sensitive-file writes when Claude Code was started in a subdirectory of a git repository","T","fix",1,"cli",0,[]],[42,"`DISABLE_TELEMETRY` や `DO_NOT_TRACK` 設定時も、有料プランで Remote Control が使える","Fixed Remote Control being unavailable on paid plans when telemetry is turned off with `DISABLE_TELEMETRY` or `DO_NOT_TRACK`","I","fix",2,"cloud",0,[]],[43,"狭いターミナルで `/remote-control` メニューの QR コードヒントが途中で切れない","Fixed the `/remote-control` menu cutting its QR-code hint mid-word in narrow terminals","I","fix",1,"cloud",0,[]],[44,"vim モードの `.` が Shift+Enter の改行を保持し、アクセント文字内にカーソルを残さず、`3J`/Visual `J` 後に古い変更を繰り返さない","Fixed vim mode `.` dropping a Shift+Enter newline, leaving the cursor inside an accented letter, and repeating an older change after `3J` or Visual-mode `J` on the last line","U","fix",1,"cli",0,[]],[45,"vim モードで1万文字超のプロンプト呼び出し後にカーソルが末尾を越えず、`V` → `p` は最初の非空白に移動","Fixed vim mode cursor placement: recalling a prompt over 10,000 characters in normal mode no longer leaves the cursor past the end, and `V` then `p` now lands on the first non-blank","U","fix",1,"cli",0,[]],[46,"vim モードの `J` が Vim と同じ間隔で行を結合し、最終行の `3J`/Visual `J` でも Vim 同様にカーソルが動く","Fixed vim mode `J` joining lines with different spacing than Vim (such as a space before `)` or after a tab), and `3J` or Visual-mode `J` on the last line not moving the cursor as Vim does","U","fix",1,"cli",0,[]],[47,"PowerShell ツールが `cmd /c rd`・`rmdir`・`del`・`erase` によるドライブルートやホームフォルダ等の削除を許さない","Windows: Fixed the PowerShell tool letting `cmd /c rd`, `rmdir`, `del` or `erase` delete drive roots, the home folder and other folders that `Remove-Item` refuses","T","fix",3,"windows",0,[]],[48,"`/mcp` のツール一覧が一度に多く表示され、ページキー・マウスでスクロール可能。組織ブロックのツールは警告アイコン付き","Improved the `/mcp` tool list: it shows more tools at once, scrolls with the page keys and mouse, and marks tools your organization blocked with a warning icon","C","improve",1,"cli",0,[]],[49,"MCP ツールが返す画像をファイルにも保存し、Bash や Read などで開ける","Improved MCP tool results: images returned by MCP tools are now also saved to a file, so Bash, Read and other tools can open them","C","improve",2,"cli",0,[]],[50,"`/tasks` が状態アイコン・名前・事実を表示し、多数でもタイトルとキーヒントを維持。ページキー・ホイール・クリックに対応","Improved `/tasks`: rows show a status icon, the name and whole facts, the title and key hints stay on screen with many tasks, and the list gains paging keys, the mouse wheel and clicks","U","improve",1,"cli",0,[]],[51,"`/help`・`/hooks`・`/copy`・`/plugin` など多数のピッカーがページキー・マウスホイール・クリックに対応","Improved lists in `/help`, `/hooks`, `/copy`, `/chrome`, `/memory`, `/ide`, `/release-notes`, `/rewind`, `/diff`, `/remote-env`, `/plugin` and other pickers with page keys, mouse wheel and clicks","U","improve",1,"cli",0,[]],[52,"`/skills` や `/artifacts` など検索ボックス付き一覧で、検索入力中はポインタを淡く表示し強調を1つだけにする","Improved lists beside a search box, such as `/skills` and `/artifacts`, to draw their pointer dim while the search box has the keys, so only one pointer is highlighted","U","improve",1,"cli",0,[]],[53,"compaction スピナーが開始時からタイマーを数え、要約トークンをストリーム中に数える（パーセンテージバーは廃止）","Improved the compaction spinner: its timer now starts when compaction begins and it counts the summary's tokens as they stream, replacing the percentage bar","S","improve",1,"cli",0,[]],[54,"MCP サーバーのサインイン後のブラウザページが、中央配置・ダークモード・新アートワークになる","Improved the browser page shown after signing in to an MCP server: centered layout, dark mode, and new artwork","C","improve",1,"cli",0,[]],[55,"plugin の読み込み失敗時、Skill ツールが未インストールとせず plugin が読み込めないと Claude が伝える","Improved the Skill tool's reply when a skill belongs to a plugin that failed to load, so Claude tells you the plugin could not be loaded instead of calling the skill uninstalled","M","improve",1,"cli,mod-dev",0,[]],[56,"`prompt-audit` が Claude Code 設定で古いパス・コマンド・矛盾する指示ファイルを先頭に報告し、文書化された thinking キーワードは残す","Improved `prompt-audit` on Claude Code configuration: stale paths, stale commands and contradicting instruction files now lead the report, and thinking keywords that Claude Code documents are kept","M","improve",1,"cli",0,[]],[57,"読めない `installed_plugins.json` は再構築前に隣のファイルへ保存し、`claude plugin list` がそのファイル名を示す","Improved recovery from an `installed_plugins.json` that cannot be read at all: its contents are kept in a file beside it before it is rebuilt, and `claude plugin list` names that file","M","improve",1,"cli",0,[]],[58,"artifact データベース読み取りで、順序付きクエリが1ページ分を返した場合にその旨と続きの読み方を示す","Improved artifact database reads: an ordered query that returns a full page now says it is one page and how to read the rest","M","improve",1,"cli",0,[]],[59,"最初の返信末尾にあったパターンコンパイル処理を返信ストリーミング中に実行し、初回返信の遅延を短縮","Improved first-reply latency: a pattern-compile step that ran at the end of a session's first reply now runs while the reply streams in","L","improve",1,"cli",0,[]],[60,"事前接続済みの API 接続を再利用し、初回リクエストの遅延を短縮","Improved first-request latency by reusing the preconnected API connection","L","improve",1,"cli",0,[]],[61,"`claude -p` と Claude Code Remote が対話 UI を読み込まず、auto mode 分類器ルールと Artifact ツールは初回使用時に読み込み起動が速い","Improved startup: `claude -p` and Claude Code Remote no longer load the interactive UI, and the auto-mode classifier's rules and the Artifact tool load on first use instead of at launch","O","improve",2,"cli,sdk",0,[]],[62,"Artifact ツール機能が未判明な claude.ai アカウント（初回起動等）で、プロンプトが最大1.5秒待たない","Improved startup for claude.ai accounts whose Artifact tool features aren't known yet, as on a first run: the prompt no longer waits up to 1.5 s to check them; the first message waits if needed","O","improve",1,"cli",0,[]],[63,"サードパーティプロバイダまたはテレメトリ無効の対話セッションは、権限モード未設定なら auto mode で開始（`permissions.defaultMode` が優先）","Changed interactive sessions on third-party providers or with telemetry off to start in auto mode when no permission mode is configured; `permissions.defaultMode` still overrides it","T","change",3,"cli,admin",1,[]],[64,"`/ultrareview` 起動ダイアログに、ローカルブランチのレビューで追跡ファイルの未コミット変更がアップロードされうると明記","Changed the `/ultrareview` launch dialog to say that reviewing a local branch may upload uncommitted changes to tracked files","T","change",1,"cli",0,[]],[65,"Opus が元々 1M コンテキストの場合、`/model` の Opus 行と Default モデル名から \"(1M context)\" を外す。ウィンドウ自体は不変","Changed the `/model` picker's Opus row and the Default model's name to drop \"(1M context)\" where Opus already has a 1M context window; the window is unchanged","L","change",1,"cli",0,[]],[66,"ターミナルのプロンプト提案は、20回連続で未使用だと表示頻度が下がり、使うと戻る","Changed prompt suggestions in the terminal to appear less often after 20 in a row go unused; using one brings them back","U","change",1,"cli",0,[]],[67,"`--system-prompt` と `--append-system-prompt` が、テキスト形式と `-file` 形式の併用を受け付け、ファイルのテキストが先になる","Changed `--system-prompt` and `--append-system-prompt` to accept their text and `-file` forms together; the file's text comes first","H","change",1,"cli,sdk",0,[]],[68,"`Skill(anthropic-skills:\u003cname\u003e)` の deny は Claude Desktop が plugin として配信する同 skill も、`Skill(skill:\u003cname\u003e)` は別名・表示名も対象にする","Changed `Skill(anthropic-skills:\u003cname\u003e)` deny rules to also block that skill when Claude Desktop delivers it as a plugin, and `Skill(skill:\u003cname\u003e)` denies to match the skill's alias and display name","T","change",2,"admin,ide",0,[]],[69,"`/rewind` と `/diff` の一覧が他の一覧と同じ `select:*` アクションで動く。`messageSelector:*`/`diff:*` の再割り当ても有効","Changed `/rewind` and `/diff` lists to move on the same keybinding actions as every other list (`select:*`); `messageSelector:*`/`diff:*` rebinds still work","U","change",1,"cli",0,[]],[70,"`/workflows` の実行一覧は他の一覧同様、インラインで端末の半分の高さになり、プロンプトが下にある時もタイトルを維持","Changed the `/workflows` run list to size itself like other lists: half the terminal inline, and it keeps its title on screen when the prompt shows below","U","change",1,"cli",0,[]],[71,"`claude plugin eval` は git がある場合 2.31 以上を要求し、古い git では該当バージョンを示して拒否","Changed `claude plugin eval` to require git 2.31 or later when git is installed; a run on an older git is refused with a message naming the version","M","change",1,"mod-dev",0,[]],[72,"自動で開始された artifact の watch は、操作がないまま3.5時間で終了。再公開・再 watch で再開","Changed artifact watching: a watch that was armed automatically (not one you asked for) now ends after 3.5 hours with no activity; publishing or watching the artifact again re-arms it","M","change",1,"cli",0,[]],[73,"Self-hosted runner のライフサイクルフック用 git が、Git LFS `pre-push` フックと書き込み可能な system `core.hooksPath` を無視し、`--configure-git` なしでは署名しない","Self-hosted runner: Changed lifecycle hooks' git to skip a repository's Git LFS `pre-push` hook, ignore a writable system `core.hooksPath`, and not sign commits without `--configure-git`","H","change",1,"admin,sdk",0,[]],[74,"Self-hosted runner の Anthropic 管理 git では、runner の git は Anthropic の git ルートを常に検証し、`GIT_SSL_CAINFO`/`GIT_SSL_NO_VERIFY` の適用範囲を警告で示す","Self-hosted runner: Changed `GIT_SSL_CAINFO` and `GIT_SSL_NO_VERIFY` under Anthropic-managed git: the runner's own git always verifies Anthropic's git route, and warning lines say what applies where","H","change",1,"admin,sdk",0,[]],[75,"2.1.282 の `claude-ai` 名の予約を撤回。該当名の skills・commands・workflows・MCP の skills/prompts が再び読み込まれ、`Skill(claude-ai:*)` は通常の prefix ルールになる","Reverted the 2.1.282 reservation of the `claude-ai` name: skills, commands, workflows and MCP servers' skills and prompts so named load again, and `Skill(claude-ai:*)` rules are ordinary prefix rules","M","change",2,"cli,mod-dev",0,[]],[76,"VS Code で auto/bypass モードからの自動切替が失敗した際、権限モード表示が Default のままにならず、切替が成功するまで再試行される","[VSCode] Fixed the permission mode indicator showing Default while the session kept running in auto or bypass mode after an automatic switch out of it failed; the switch is now retried until it lands","I","fix",1,"ide",0,[]],[77,"Web から teleport したセッションが、Claude の作業中に送ったメッセージを失わない","[VSCode] Fixed a session teleported from the web dropping the messages sent while Claude was working","I","fix",1,"ide",0,[]],[78,"旧版が空のローカルコピーを保存していても、Web セッションが一覧に表示され、空のチャットが代わりに開かない","[VSCode] Fixed a Web session staying hidden from the session list, and an empty chat opening in its place, when an older version had saved an empty local copy of it","I","fix",1,"ide",0,[]],[79,"再開したセッションで、自動継続など途中で受信したメッセージ位置でターンが分割されない","[VSCode] Fixed a reopened session splitting a turn at a message Claude received mid-turn, such as an automatic continuation","I","fix",1,"ide",0,[]],[80,"再読み込みしたセッションが、巻き戻したターンを表示せず、compaction 前の行だけにもならない","[VSCode] Fixed a reloaded session showing a rewound-away turn, or only the rows before a compaction","I","fix",1,"ide",0,[]],[81,"狭いパネルでフッターの agents ピルのアイコンが中央に描かれ、ステータスドットが端に寄らない","[VSCode] Fixed the footer's agents pill drawing its icon off-center, with the status dot against the edge, in narrow panels","I","fix",1,"ide",0,[]],[82,"長いプロンプトへ改行終わりの行を貼り付けても、チャット入力の文字がカーソル・選択範囲より下にずれない","[VSCode] Fixed the chat input showing its text slightly below the cursor and selection after pasting lines that end with a line break into a long prompt","I","fix",1,"ide",0,[]],[83,"実行中のクラウドセッションにリポジトリを追加する際、GitHub アカウントが読めるが push できないプライベートリポジトリを読み取り用に接続できる","[Cloud sessions] Improved adding a repository to a running cloud session: a private repository your GitHub account can read but not push to now attaches for reading","I","improve",1,"cloud",0,[]],[84,"サーバー側再起動からの復旧後、クラウドセッションが完了済みの手順（コメント投稿や push の重複など）をやり直さない","[Cloud sessions] Fixed cloud sessions occasionally redoing an already-finished step, such as posting a duplicate comment or push, after recovering from a server-side restart","I","fix",2,"cloud",0,[]],[85,"新規 routine のスケジュールは毎時の数分後を既定にし、ちょうど毎時だと数分遅れて開始しうる旨を注記","[Cloud sessions] Changed new routine schedules to default to a few minutes past the hour, with a note that routines set exactly on the hour can start several minutes late","I","change",1,"cloud",0,[]],[86,"[Claude Tag] 管理設定「Channels Claude can search」を追加。Slack 検索を追加済みの公開チャンネルに限定、組織・ワークスペース・チャンネル単位で設定","[Claude Tag] Added a \"Channels Claude can search\" admin setting that limits Claude's Slack search to public channels it has been added to, set per organization, workspace or channel","I","new",2,"admin,cloud",0,[]],[87,"[Claude Tag] Claude アカウント接続後のページに Back to Slack ボタンを追加し、開始元スレッドへ戻れる","[Claude Tag] Added a Back to Slack button on the page shown after connecting your Claude account, returning you to the thread you started from","I","new",1,"cloud",0,[]],[88,"[Claude Tag] attach rule 経由でアクセスバンドルを得るチャンネルの設定ページが、コネクタや plugin を表示する","[Claude Tag] Fixed a channel's configure page listing no connectors or plugins when the channel gets its access bundle through an attach rule; rule-attached bundles are now shown","I","fix",1,"admin,cloud",0,[]],[89,"[Claude Tag] 多数の選択リポジトリに限定した GitHub App で、アクセスバンドルのリポジトリ検索が漏れない","[Claude Tag] Fixed access-bundle repository search missing repositories on GitHub App installs that are limited to a large list of selected repositories","I","fix",1,"admin,cloud",0,[]],[90,"[Claude Tag] 新規メッセージで返信が中断されても、Claude が同じ返信を二重投稿しない","[Claude Tag] Fixed Claude occasionally posting the same reply twice when a new message interrupted it mid-reply","I","fix",1,"cloud",0,[]],[91,"[Claude Tag] Slack Connect 共有などでチャンネル ID が変わった古い非公開チャンネルでも channel routine が動き続ける","[Claude Tag] Fixed channel routines that stopped running in older private channels whose Slack channel ID changed, for example after a Slack Connect share","I","fix",1,"cloud",0,[]],[92,"[Claude Tag] 「Channel only」チャンネルで、Slack のメンバー確認が遅い時に非ゲストの参加で会話が全部終了しない","[Claude Tag] Fixed conversations in a channel set to \"Channel only\" all ending when a non-guest member joined and Slack was slow to confirm their membership","I","fix",1,"cloud",0,[]],[93,"[Code Review] GitHub が PR を返せなくても \"@claude review\" が無反応にならず、1回再試行し失敗時はコメントで説明","[Code Review] Fixed \"@claude review\" requests going silent when GitHub failed to return the pull request: the request is retried once, and a comment explains if it still fails","I","fix",1,"cloud",0,[]],[94,"[Code Review] 時間切れで何も検証できなかったレビューは、未完了表示・課金なし・1回再試行になる","[Code Review] Fixed billing for a review that stopped at its time limit with nothing verified: it now shows as incomplete, isn't charged, and is retried once","I","fix",2,"cloud",0,[]]]},{"v":"2.1.282","date":"2026-09-25（金）00:56","dshort":"09-25 00:56","nb":7,"head":"セッション再開・thinking 保持の修正と管理設定の厳格化","sum":"v2.1.282 は、再開・継続セッションでの thinking 消失や API エラーの修正と、管理設定・テレメトリ・権限まわりの挙動変更が中心です。Claude Code の日常利用者に加え、managed settings を運用する管理者や Claude Tag・クラウドセッションの利用者に影響します。vim モードや描画の細かな修正も多数含まれます。","watch":[{"b":"直接 Anthropic API 接続でテレメトリが off の場合、auto mode が既定でサーバー側分類器を使うため、従来の挙動を保つなら `CLAUDE_CODE_AUTO_MODE_SERVER=0` を設定してください。","r":[58]},{"b":"管理設定または `--settings` で `allowUnsandboxedCommands: false` や管理側 `allowManagedDomainsOnly: true` を設定している場合、project/local の `sandbox.excludedCommands` は無視されるため、必要な除外は管理設定側に移してください。","r":[59]},{"b":"project/local 設定の `CLAUDE_CODE_ENABLE_TELEMETRY` や `OTEL_LOG_*` など、エクスポート有効化・エンドポイント指定・内容取得の変数は無視されるため、ユーザー設定や環境変数、管理設定へ移してください。","r":[60]},{"b":"Windows/WSL で管理ポリシー（HKLM、`managed-settings.json`）が存在するのに不正または読めない場合、HKCU と WSL の `/etc/claude-code` は適用されないため、ポリシーを修復してください。","r":[61]},{"b":"`Skill(anthropic-skills:*)` と `Skill(claude-ai:*)` の許可ルールは claude.ai から同期されたスキルだけが対象になるため、プラグイン等に使っていた場合はルールを見直してください。","r":[62]},{"b":"`anthropic-skills` や `claude-ai` 名前空間のスキルフォルダ、コマンドファイル、ワークフローコマンドは読み込まれなくなるため、別の名前に変更してください。","r":[63]},{"b":"`anthropic-skills` や `claude-ai` という名前の MCP サーバーはスキルとプロンプトを一覧しなくなる（ツールは動作）ため、一覧が必要なら MCP 設定でサーバー名を変更してください。","r":[64]}],"hl":[{"t":"復号不能な検索結果の 400 解消","b":"API が復号できない web search 結果が履歴に残る会話で、全リクエストが 400 で失敗する問題を修正しました。サードパティのゲートウェイ経由の履歴などが該当します。","r":[6]},{"t":"再開時の thinking 消失を修正","b":"`--continue`/`--resume` での再送形式の変化、即時スラッシュコマンド、`--tools` の変更による thinking の消失を修正しました。`redacted_thinking` のエラーは thinking を破棄して 1 回再試行します。","r":[7,8,9,10]},{"t":"管理設定の適用漏れを修正","b":"boolean のロックキーの型ミスや、入れ子の値 1 つの不正で管理設定が無視される問題を修正しました。`allowManagedPermissionRulesOnly` 下でスキルが `allowed-tools` で自己承認する問題も修正しています。","r":[20,21,22]},{"t":"テレメトリ変数と auto mode の変更","b":"プロジェクト設定とローカル設定では、テレメトリを有効化する OpenTelemetry 変数が無視されます。直接 Anthropic API 接続でテレメトリが off の場合、auto mode は既定でサーバー側分類器を使います。","r":[58,60,2]},{"t":"大規模セッションの再開が高速化","b":"非常に大きなセッション（未 compact のものを含む）の再開にかかる時間を短縮しました。","r":[51]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"権限と管理設定の修正が中心です。mid-pattern `:*` の Bash ルールが設定ファイルでも有効になり、承認済みコマンドの二重実行、シンボリックリンク経由の読み込み、ディスク容量不足時のエラー表示も修正されました。サンドボックス除外と auto mode の既定値は変更されています。","refs":[17,18,19,20,21,22,25,26,46,54,58,59]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"エージェントパネルのフッターが長いキーバインドで折り返す問題と、`/tasks` ダイアログのフッターで区切り文字が重複する問題を修正しました。","refs":[42,43]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"プラグイン削除時に保存済みオプションが誤って消える問題、`/install-github-app` の中断処理、`/skills` の検索入力を修正し、`/artifacts` の表示と操作性を改善しました。`claude-api` スキルは更新され、`anthropic-skills` と `claude-ai` 名前空間の扱いが変わりました。","refs":[35,37,38,39,40,44,55,56,57,62,63]},{"a":"S","name":"セッション・履歴・圧縮","dg":"再開・継続セッションで過去のメッセージが変形して再送される問題と、compaction が拒否された場合の失敗を修正しました。大規模セッションの再開は高速化され、Windows の EBADF エラー表示も改善されています。","refs":[7,9,11,51,52]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"managed 設定 `allowClaudeInChromeWithManagedMcp` を追加し、排他的な `managed-mcp.json` と `claude --chrome` を併用できるようにしました。また `anthropic-skills` / `claude-ai` 名の MCP サーバーはスキルとプロンプトを一覧しなくなりました。","refs":[3,64]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VS Code 拡張、クラウドセッション、Claude Tag（Slack）の修正と追加です。GitHub App の状態表示や別オーナーのリポジトリ添付が加わり、Claude Tag では Enterprise Grid まわりの不具合を多数修正しています。ゲートウェイの `store.readiness_grace_seconds` も追加されました。","refs":[4,13,53,67,68,69,70,71,72,73,74,75,76,77,78,79,80,81,82,83,84,85,86]},{"a":"H","name":"headless・SDK・API","dg":"API 関連の修正が中心です。復号できない web search 結果による 400 エラー、Bedrock のブロックメッセージの ID 表示、Vertex AI の未知モデルでの web search を直しました。`claude remote-control --debug` も使えるようになりました。","refs":[6,23,24,34]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"thinking の欠落やエラーに関する修正です。即時スラッシュコマンド使用時の thinking 消失、`redacted_thinking` エラー、`xhigh` effort の失敗、`/model` の Fable ID 指定時の挙動を直しています。","refs":[8,10,12,14]},{"a":"U","name":"UI・表示・入力","dg":"`maxProseWidth` 設定を追加し、`/feedback` 一覧にスクロールバーを付けました。貼り付けの行ごと送信、起動時の画面のちらつき、CJK・絵文字の描画崩れ、vim モードの操作不具合を多数修正しています。","refs":[1,5,27,28,29,30,31,32,33,36,41,45,47,48,49,50,65,66]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"テレメトリ変数の無視と起動時の通知を追加しました。複数ウィンドウでのログイン更新競合による待ちと、組織ポリシー取得の再試行漏れも修正しています。Windows/WSL の不正な管理ポリシーの扱いも変わりました。","refs":[2,15,16,60,61]}],"skip":"表示の乱れ、vim モードの操作、まれな環境でのエラー表示などの細かな修正が 30 件以上あります。","st":"ok","stale":false,"e":[[1,"`maxProseWidth` 設定で広い端末でも文章の幅を制限でき、表とコードブロックは全幅のまま","Added a `maxProseWidth` setting that caps the width of Claude's prose in wide terminals while tables and code blocks keep the full width","U","new",1,"cli",0,[]],[2,"無視された、またはテレメトリを無効にしたプロジェクト設定の変数を、起動時の通知と `/status`・`claude doctor` に表示","Added a startup notice, and `/status` and `claude doctor` entries, listing telemetry variables in a project's settings files that were ignored or that turned telemetry off","O","new",2,"cli,admin",0,[]],[3,"managed 設定 `allowClaudeInChromeWithManagedMcp` で排他的な `managed-mcp.json` と `claude --chrome` を併用可能に","Added the `allowClaudeInChromeWithManagedMcp` managed setting to let `claude --chrome` run alongside an exclusive `managed-mcp.json`; the error shown when Chrome is blocked now names it","C","new",2,"admin",0,[]],[4,"Claude apps gateway の `store.readiness_grace_seconds` で、Postgres の短時間停止中も `/readyz` が ready を維持","Added `store.readiness_grace_seconds` to the Claude apps gateway so `/readyz` can stay ready through a short Postgres outage such as a database failover","I","new",1,"admin",0,[]],[5,"フルスクリーンの `/feedback` 下書き一覧に、マウスを重ねるとスクロールバーを表示","Added a scrollbar to the `/feedback` drafts list in fullscreen mode; it appears while the mouse is over the list","U","new",1,"cli",0,[]],[6,"API が復号できない web 検索結果が履歴にあっても、全リクエストが 400 で失敗しなくなった","Fixed every request failing with a 400 error in conversations whose history holds web search results the API cannot decrypt (for example, from a turn answered through a third-party gateway)","H","fix",3,"cli,sdk",0,[]],[7,"`--continue`・`--resume` で過去メッセージが変形して再送され、以前の推論が破棄される問題をさらに解消","Fixed more cases of continued or resumed sessions (`--continue`, `--resume`) re-sending earlier messages in a changed form, which could make the API drop Claude's earlier reasoning","S","fix",2,"cli",0,[]],[8,"作業中に `/model` や `/rename` などの即時スラッシュコマンドを使っても、以前の extended thinking が失われない","Fixed earlier extended thinking being dropped when `/model`, `/rename`, `/artifacts` or another immediate slash command was used while Claude was working","L","fix",2,"cli",0,[]],[9,"以前提示された組み込みツールを除く `--tools` で再開しても、以前の extended thinking が保持される","Fixed continued or resumed conversations losing earlier extended thinking when relaunched with a `--tools` list that leaves out a built-in tool offered earlier in the conversation","S","fix",2,"cli",0,[]],[10,"`redacted_thinking` の無効データによる毎ターン失敗時、thinking ブロックを破棄して一度だけ再試行する","Fixed sessions failing on every turn with an \"Invalid `data` in `redacted_thinking` block\" API error; Claude Code now drops the conversation's thinking blocks and retries once","L","fix",2,"cli",0,[]],[11,"要約リクエストが拒否されて compaction が失敗した場合、フォールバックモデルで再試行する","Fixed compaction failing when the summarization request is refused; it now retries on a fallback model","S","fix",2,"cli",0,[]],[12,"thinking オフで effort が high 超のとき、安全関連のモデル切替後にターンが失敗しなくなった","Fixed a failed turn (\"Effort 'xhigh' isn't available with thinking turned off\") after a safety-related model switch in sessions with thinking off and effort above high","L","fix",1,"cli",0,[]],[13,"Fable の usage-credits プロンプトに未回答でもモデルは切り替わらずターン終了。Remote Control に切替通知も表示","Fixed an unanswered Fable usage-credits prompt switching models in SDK-hosted sessions such as Claude Desktop; the turn now ends instead, and Remote Control clients now see the model-switch notice","I","fix",2,"ide,cloud",0,[]],[14,"フル Fable モデル ID での `/model` が API エラーで止まらず、未有効時は usage-credits プロンプトを開く","Fixed `/model` with a full Fable model id stopping at an API error instead of opening the usage-credits prompt when the plan needs usage credits that aren't turned on yet","L","fix",1,"cli",0,[]],[15,"別プロセスが更新中に終了しても、「another Claude Code process is refreshing it」エラーで最大1分失敗しない","Fixed requests failing for up to a minute with an \"another Claude Code process is refreshing it\" login error after that other process was closed or killed mid-refresh","O","fix",2,"cli",0,[]],[16,"別ウィンドウのサインイン更新中に始まったセッションでも、組織ポリシーの取得を再試行する","Fixed sessions started while another Claude Code window was refreshing the sign-in (common with several VS Code windows) not retrying their organization policy fetch","O","fix",1,"ide",0,[]],[17,"リポジトリのシンボリックリンク経由で macOS の `/Network` や `/home` に届く CLAUDE.md・rules の読み込みを防止","Fixed CLAUDE.md and rules being read at startup through a repository symlink reaching macOS's `/Network` via `..` or a `/.vol`-style kernel path, or a rules link to macOS's `/home` being listed","T","fix",1,"macos",0,[]],[18,"パターン途中に `:*` を含む Bash 権限ルールが設定ファイルでも有効になり、起動時に一致方法を警告","Fixed Bash permission rules with a mid-pattern `:*` being skipped in settings files while `--allowedTools` honored them; they now work from every source, with a startup warning on how they match","T","fix",2,"cli,admin",0,[]],[19,"リモートセッションのワーカー再起動時、復元された権限プロンプトで承認したコマンドが二重実行されない","Fixed a command approved on a restored permission prompt running twice when a remote session's worker restarted","T","fix",2,"cloud",0,[]],[20,"`disableClaudeAiConnectors` などの真偽値ロックキーに誤った型を指定してもロックが適用され、起動時にキー名を表示","Fixed managed settings ignoring a mistyped value for boolean lock keys such as `disableClaudeAiConnectors` or `allowManagedPermissionRulesOnly`; the lock now applies and startup names the key","T","fix",3,"admin",0,[]],[21,"managed の `permissions`・`autoMode`・`worktree`・`attribution` は一部が無効でも残りが適用される","Fixed managed `permissions`, `autoMode`, `worktree` and `attribution` settings being ignored entirely when one nested value was invalid; the rest of the block now still applies","T","fix",2,"admin",0,[]],[22,"`allowManagedPermissionRulesOnly` 下で、リポジトリ・ユーザー等の skills や commands が `allowed-tools` で自己承認できなくなった","Fixed repository, user and `--add-dir` skills, commands and skills-directory plugin manifests pre-approving their own tools via `allowed-tools` under managed `allowManagedPermissionRulesOnly`","T","fix",3,"admin",0,[]],[23,"Bedrock と Bedrock Mantle のセーフガードブロックメッセージにリクエスト ID とメッセージ ID を表示","Fixed safeguard block messages on Amazon Bedrock and Bedrock Mantle not showing a request ID; block messages now also show the message ID","H","fix",1,"sdk",0,[]],[24,"Vertex AI で未認識の新モデルでも web 検索が提供される","Vertex AI: Fixed web search not being offered for models Claude Code doesn't recognize yet, such as newly released ones","H","fix",1,"sdk",0,[]],[25,"Bash と PowerShell がディスク容量不足を「Exit code 1」で隠さず、大きな出力ファイルを temp に残さない","Fixed Bash and PowerShell hiding a full disk quota behind \"Exit code 1\" and leaving large output files in temp","T","fix",2,"cli,windows",0,[]],[26,"ツール入力検証エラーで、未知・不足・型違いの引数以外の無効な引数もすべて列挙する","Fixed tool input validation errors naming only an unknown, missing or mistyped parameter when other parameters in the same call were also invalid; those are now listed too","T","fix",1,"cli",0,[]],[27,"途中で bracketed paste mode がリセットされても、複数行の貼り付けが1行ずつ送信されない","Fixed pasted multi-line text being submitted line by line after the terminal's bracketed paste mode was reset mid-session","U","fix",2,"cli",0,[]],[28,"`SessionStart` hook のあるプロジェクトで、起動時にプロンプトの例文が点滅して消えない","Fixed the prompt's example text flashing and disappearing at startup in projects with a `SessionStart` hook","U","fix",1,"cli",0,[]],[29,"フルスクリーン起動時、最初のフレーム前に空白画面が点滅しない","Fixed a blank screen flashing before the first frame when starting in fullscreen mode","U","fix",1,"cli",0,[]],[30,"画面が縮んでもまだ端末より高い場合の、非フルスクリーン描画の行崩れを解消","Fixed garbled, misplaced rows in the non-fullscreen renderer after the screen got shorter while still taller than the terminal, e.g. deleting a prompt line while a shell command streams output","U","fix",1,"cli",0,[]],[31,"再描画行の CJK 文字や絵文字が次の行に折り返しても、diff 最終列に文字が残らない","Fixed a stale character left in the last column of a diff when a redrawn line's CJK character or emoji wrapped to the next row","U","fix",1,"cli",0,[]],[32,"タブを含む履歴プロンプトを呼び出しても、カーソルが末尾に正しく置かれる","Fixed the cursor landing before the end of a prompt recalled from history when the prompt contains a tab","U","fix",1,"cli",0,[]],[33,"ctrl+enter が改行になる端末（Windows Terminal 1.25 未満）では、送信ヒントに ctrl+x ctrl+s を表示","Fixed the send-now hint showing ctrl+enter on terminals that send it as a newline (Windows Terminal before 1.25); it now shows ctrl+x ctrl+s there","U","fix",1,"windows",0,[]],[34,"`claude remote-control --debug` が「Unknown argument」で失敗せず使える","Fixed `claude remote-control --debug` failing with \"Unknown argument: --debug\", although Remote Control's own eligibility error says to run with `--debug`","H","fix",1,"cli,cloud",0,[]],[35,"`/install-github-app` で中断するとブランチ push や secret 保存を続けず、実施済みの内容を報告","Fixed `/install-github-app` saying \"cancelled\" and then still pushing the branch and saving the API key secret; leaving now stops the remaining steps and reports what was already done","M","fix",2,"cli",0,[]],[36,"サードパーティプロバイダで `/feedback`・`/bug`・`/share` を保存中に取り消すと、報告ファイルが保存されない","Fixed /feedback, /bug and /share on Bedrock, Vertex and other third-party providers still saving the report file after you cancelled during the save","U","fix",1,"cli",0,[]],[37,"設定ファイルがまだ有効化している、または読めない場合、plugin のアンインストールは停止してファイルを示す","Fixed plugin uninstall reporting success and deleting the plugin's saved options when its settings file still enabled it or could not be read; it now stops and names the file","M","fix",2,"cli,mod-dev",0,[]],[38,"インストール済み一覧が読めない場合、plugin の保存オプションと secret は削除されず、その旨を表示","Fixed plugin uninstall deleting a plugin's saved options and secrets when the list of installed plugins could not be read after the removal; they are now kept and the uninstall says so","M","fix",2,"cli,mod-dev",0,[]],[39,"`/skills` で `/` 直後に入力したキーがリスト移動ではなく検索ボックスに届く","Fixed a key typed right after `/` in `/skills` moving the skill list instead of reaching the search box","M","fix",1,"cli",0,[]],[40,"`/skills` 検索入力中にカーソルがリストへ飛ばず、キャレットと IME 入力位置が正しく保たれる","Fixed the terminal cursor jumping from the `/skills` search box to the skill list while typing, which could hide the caret and put IME input in the wrong place","M","fix",1,"cli",0,[]],[41,"`/skills` や `/mcp` などのスクロールバー付きリストが、非フルスクリーンでも2列狭くならない","Fixed lists with a scrollbar, such as `/skills` and `/mcp`, being two columns narrower outside fullscreen mode, where the scrollbar can never appear","U","fix",1,"cli",0,[]],[42,"エージェントパネルのフッターが長いキー割当で2行に折り返さず、「Esc to collapse」も再割当に追従","Fixed the agent panel footer wrapping onto two lines with long rebound keys, and its \"Esc to collapse\" hint ignoring a rebound collapse key","A","fix",1,"cli",0,[]],[43,"`keybindings.json` で全エージェント停止ショートカットを解除しても、`/tasks` フッターの区切りが二重にならない","Fixed a doubled ` · ` separator in the `/tasks` dialog footer when the stop-all-agents shortcut is unbound in `keybindings.json`","A","fix",1,"cli",0,[]],[44,"Claude が60文字超のラベルを付けても、artifact の公開が失敗せずラベルが短縮される","Fixed artifact publishes failing when Claude gave the version a label longer than 60 characters; the label is now shortened","M","fix",1,"cli",0,[]],[45,"スクリーンリーダーモードや引用・長いリストでも、リスト項目直下のコードブロック先頭の空行が保持される","Fixed screen-reader mode, quoted lists and very long lists dropping the blank lines at the top of a code block that opens a list item, directly or inside a quote","U","fix",1,"cli",0,[]],[46,"PDF ページ読み取りエラーで、非ラテン文字パスが読める形で表示され、原因の誤表示もなくなった","Fixed PDF page-read error messages: paths with accented or non-Latin characters now appear readably, and a folder named like \"password\" or \"invalid\" can no longer make the error name the wrong cause","T","fix",1,"cli",0,[]],[47,"vim モードの `\u003e\u003e`・`r`・`2J`・`2dd`・`2\u003e\u003e` の件数や空行まわりの動作を修正","Fixed vim mode `\u003e\u003e` indenting empty lines, `r` with a count longer than the line changing text, `2J` joining one line too many, and a count on the last line (`2dd`, `2\u003e\u003e`) shifting or deleting it","U","fix",1,"cli",0,[]],[48,"vim モードで `dd`・`dj`・`dG`・`p`/`P` 後に最初の非空白へ移動し、`yy` や絵文字後の Esc でカーソルが適切に","Fixed vim mode cursor placement: after `dd`, `dj`, `dG` or a whole-line `p`/`P` it lands on the first non-blank, `yy` no longer moves it, and Esc after an emoji no longer leaves it inside the emoji","U","fix",1,"cli",0,[]],[49,"vim モードの `.` 繰り返しで件数が効き、上の行が折り返していても各コマンドが正しい行に作用","Fixed vim mode ignoring a count typed before `.` when repeating `x`, `s`, `p`, `d` or `c`, and whole-line `p`/`P`, `o`, `O`, `J`, `\u003e\u003e` and `\u003c\u003c` acting on the wrong line when a line above wraps","U","fix",1,"cli",0,[]],[50,"vim の normal モードで履歴やキューから戻したプロンプトのカーソルが行末を越えず、`x` が効く","Fixed vim mode leaving the cursor past the end of a prompt recalled from history or pulled back from the queue in normal mode, so `x` did nothing","U","fix",1,"cli",0,[]],[51,"非常に大きなセッションの再開が速くなった（未 compaction のものも含む）","Improved the time to resume very large sessions, including ones that were never compacted","S","improve",2,"cli",0,[]],[52,"Windows でトランスクリプトを読めず再開できない（EBADF）場合に、考えられる原因と対処を表示","Improved the error shown on Windows when a session can't be resumed because its transcript file could not be read (EBADF): it now names possible causes and what to try","S","improve",1,"windows",0,[]],[53,"Claude Desktop の unknown-model エラーで別モデルへの切り替えを案内","Improved the Claude Desktop unknown-model error to suggest switching to a different model","I","improve",1,"ide",0,[]],[54,"権限プロンプトでの特殊な Unicode の表示を改善","Improved rendering of unusual Unicode in permission prompts","T","improve",1,"cli",0,[]],[55,"`/artifacts` でタイトルが1列に揃い、詳細は単語途中で切れず、PgUp/PgDn・Home/End・マウスホイール・クリックに対応","Improved `/artifacts`: titles line up in one column, details are dropped whole instead of cut mid-word, and the list supports PgUp/PgDn, Home/End, the mouse wheel and clicks","M","improve",1,"cli",0,[]],[56,"`claude-api` skill が拒否時の課金（出力前・ストリーム途中）とレート制限の扱いを更新","Updated the `claude-api` skill: pre-output refusal billing now links to the How refusals are billed docs, mid-stream refusals bill at normal rates, and pre-output refusals count against rate limits","M","improve",1,"sdk",0,[]],[57,"`claude-api` skill が Managed Agents リソースをバージョン管理する `ant apply` を推奨","Updated the `claude-api` skill to recommend `ant apply` for keeping Managed Agents resources as version-controlled files","M","improve",1,"sdk",0,[]],[58,"Anthropic API 直結でテレメトリがオフなら、auto mode が既定でサーバー側分類器を使う（`CLAUDE_CODE_AUTO_MODE_SERVER=0` で無効化）","Changed auto mode to use the server-side classifier by default on a direct Anthropic API connection when telemetry is off (`CLAUDE_CODE_AUTO_MODE_SERVER=0` opts out)","T","change",3,"cli,sdk",1,[]],[59,"managed や `--settings` で未サンドボックス実行を禁止すると、`sandbox.excludedCommands` のプロジェクト・ローカル項目を無視","Changed `sandbox.excludedCommands` to ignore project and local settings entries when managed settings or `--settings` set `allowUnsandboxedCommands: false`, or managed `allowManagedDomainsOnly: true`","T","change",3,"admin",1,[]],[60,"プロジェクト・ローカル設定の `CLAUDE_CODE_ENABLE_TELEMETRY` や `OTEL_LOG_*` など OpenTelemetry 変数を無視","Changed project and local settings to ignore OpenTelemetry variables that turn on export, set its endpoint, or capture content, like `CLAUDE_CODE_ENABLE_TELEMETRY` and `OTEL_LOG_*`","O","change",3,"cli,admin",1,[]],[61,"Windows/WSL で管理者ポリシーが無効・読めない場合、HKCU と WSL `/etc/claude-code` を適用しない","Changed Windows/WSL managed settings so an admin policy that is present but invalid or unreadable (HKLM, `managed-settings.json`) keeps user-writable HKCU and WSL `/etc/claude-code` from applying","O","change",3,"admin,windows",1,[]],[62,"`Skill(anthropic-skills:*)`・`Skill(claude-ai:*)` の許可ルールは claude.ai 同期の skills のみが対象","Changed `Skill(anthropic-skills:*)` and `Skill(claude-ai:*)` allow rules to cover only skills synced from claude.ai, not plugins or other skills that merely use such a name","M","change",2,"admin",1,[]],[63,"`anthropic-skills`・`claude-ai` 名前空間の skill フォルダ・command・workflow が読み込まれない。同名 plugin は名前衝突する","Changed skill folders, command files and workflow commands in the `anthropic-skills` or `claude-ai` namespace to no longer load; a plugin so named still loads but yields name ties to synced skills","M","change",2,"mod-dev",1,[]],[64,"`anthropic-skills`・`claude-ai` 名の MCP サーバーは skills・prompts を一覧しない。再表示にはサーバー名の変更が必要","Changed MCP servers configured under the name `anthropic-skills` or `claude-ai` to list no skills or prompts (their tools still work); rename the server in your MCP configuration to list them again","C","change",2,"cli,admin",1,[]],[65,"`/effort` とプロンプト入力の `ultracode` 演出を無地に変更し、dynamic-workflows のスピナーヒントを削除","Changed the `ultracode` visuals in `/effort` and the prompt input to plain styling (no ripple, border flourish or keyword glimmer) and removed the dynamic-workflows spinner tip","U","change",1,"cli",0,[]],[66,"起動バナーの Clawd の足を、体の角の下に配置","Changed the Clawd mascot's feet in the start-up banner to sit under the corners of his body","U","change",1,"cli",0,[]],[67,"VSCode で長い返信がストリームに遅れない。更新ごとの全体再解析をやめた","[VSCode] Fixed long replies falling behind the stream: the panel no longer re-parses the whole reply on ckly the Routines page and the sidebar's Scheduled list load for accounts whose past sessions scheduled many check-in reminders","I","improve",1,"cloud",0,[]],[76,"Enterprise Grid の org 全体インストールで、ワークスペース別に保存した自動参加チャンネルパターンが有効になる","[Claude Tag] Fixed auto-join channel patterns saved for one workspace in Claude Tag admin settings being ignored on an Enterprise Grid org-wide install; Claude now joins matching new channels","I","fix",2,"cloud,admin",0,[]],[77,"Enterprise Grid で同一組織の2ワークスペース間の共有チャンネルでも、Claude が応答する","[Claude Tag] Fixed Claude not responding in an Enterprise Grid channel shared between two workspaces of one organization when the channel's Claude Tag version was saved from the other workspace","I","fix",1,"cloud,admin",0,[]],[78,"GitHub Enterprise Server の旧 Claude in Slack 進捗カードにリポジトリ名と動作する Create PR ボタンを表示","[Claude Tag] Fixed the earlier Claude in Slack app's progress card for sessions on a GitHub Enterprise Server repository: it now names the repository and offers a working Create PR button","I","fix",1,"cloud",0,[]],[79,"モデルが廃止された Slack スレッドは、返信ごとにフォールバックせず動作するモデルへ移行する","[Claude Tag] Fixed Slack threads whose model has been retired falling back to another model on every reply, slower and with a fallback note each time; the thread now moves to a working model","I","fix",2,"cloud",0,[]],[80,"Claude が Slack にアップロードしたファイルに表を含むキャプションを付けられ、返信と同じ書式で表示","[Claude Tag] Fixed files Claude uploads to Slack not being able to carry a caption containing a table; captions now render with the same formatting as replies","I","fix",1,"cloud",0,[]],[81,"Slack の Agents \u0026 tools ビューで、スレッドが最初のメッセージではなく名前で表示され、改名も反映される","[Claude Tag] Fixed Claude's threads in Slack's Agents \u0026 tools view sometimes being listed under their first message instead of their name; later renames now update the list too","I","fix",1,"cloud",0,[]],[82,"GitHub 組織の連携解除後でも、アクセスバンドルの Repositories タブからその grant を削除して保存できる","[Claude Tag] Fixed removing a GitHub organization's grant from an access bundle's Repositories tab in Claude Tag admin settings failing to save after that GitHub organization was disconnected","I","fix",1,"cloud,admin",0,[]],[83,"未追加の Grid ワークスペースとの共有チャンネルで、アプリが必要なワークスペース名を通知に表示","[Claude Tag] Fixed Claude always replying \"Couldn't check this channel just now\" in a channel shared with a Grid workspace it isn't added to; the notice now says which workspace needs the app","I","fix",1,"cloud",0,[]],[84,"cloud worker 再起動後に、返信フッターのコストとトークン合計が何倍にも膨らまない","[Claude Tag] Fixed the cost and token totals in Claude's reply footer reading many times too high after the session's cloud worker restarted","I","fix",1,"cloud",0,[]],[85,"Slack 返信の計画・表・詳細のカードを、既定で狭幅ではなく広幅で表示","[Claude Tag] Changed the bordered cards Claude uses in Slack replies for plans, tables and details to render wide by default instead of a narrow width","I","change",1,"cloud",0,[]],[86,"新規接続の Slack ワークスペースは、接続時の既定モデルを固定せず現在の既定モデルに追従","[Claude Tag] Changed newly connected Slack workspaces to follow the current default model instead of keeping whichever model was the default when they were connected","I","change",2,"cloud,admin",0,[]]]},{"v":"2.1.281","date":"2026-09-24（木）02:01","dshort":"09-24 02:01","nb":0,"head":"セッション再開と権限判定の修正が中心のリリース","sum":"v2.1.281 は、セッション再開・プロキシ経由のストリーム処理・権限判定に関する修正が大半を占めます。危険な `rm` の検出強化と `claude --bg` のワークスペース信頼確認など、安全性に関わる修正も含みます。auto mode の挙動変更、`/plugin`・`/mcp`・`/workflows` などの UI 改善、Claude apps gateway の Bedrock 対応も入っています。","watch":[{"b":"send now (ctrl+enter または ctrl+x ctrl+s) は実行中のツールをバックグラウンドへ移すようになったため、ターンを中断したい場合は別の操作を使うこと。","r":[134]},{"b":"auto mode で読み取り専用・サンドボックス内のシェルコマンドもサーバー側レビューを待ち、指摘されるとブロックされるため、遅延や拒否が増えた場合はレビュー結果を確認すること。","r":[135]},{"b":"`CLAUDE_CODE_AUTO_MODE_SERVER` が直接の Anthropic API 接続にも効くようになり、`0` ではローカル分類器が使用量に計上されるため、設定値を確認すること。","r":[136]},{"b":"危険な `rm` の確認は 2 分で拒否に倒れるため、無人実行で待たせたい場合は `CLAUDE_CODE_DISABLE_DANGEROUS_RM_TIMEOUT=1` を設定すること。","r":[137]},{"b":"`envHelper` のパスが `\\??\\` または `/??/` で始まる `managedMcpServers` 項目があると Claude apps gateway が起動しないため、通常のパス形式に直すこと。","r":[139]},{"b":"self-hosted runner がシステムプロンプトをファイル渡しにしたため、wrapper や `command` hook で `--system-prompt` / `--append-system-prompt` を付けている場合は `--system-prompt-file` / `--append-system-prompt-file` に切り替えること。","r":[140]}],"hl":[{"t":"`rm` 実行前確認の強化","b":"`rm -rf \"$(pwd)\"` のようなコマンド置換のみが対象の再帰 `rm` が、auto mode と `--dangerously-skip-permissions` で確認なしに実行される問題を修正しました。シェル変数や作業ディレクトリ由来の対象、バックスラッシュのみの対象も検出します。","r":[34,110,137]},{"t":"`claude --bg` の信頼確認","b":"ワークスペース信頼の確認を通っていないディレクトリで、`claude --bg` がバックグラウンドセッションとプロジェクト hook を実行していました。今後は先に信頼を確認し、非対話実行では終了します。","r":[38]},{"t":"セッション再開の信頼性向上","b":"再開時に過去のターンが別の形で再送され、API が過去の推論を破棄する問題などを修正しました。大きなセッションの復元欠落や、ツール呼び出し中に終了したセッションの扱いも直しています。長いセッションの再開時間も短縮されました。","r":[12,13,14,15,105,106]},{"t":"プロキシ経由のストリーム処理","b":"プロキシやゲートウェイがストリームを正常終了させた場合の途中切れが、完了として表示されていました。イベント欠落による \"Content block not found\" や、重複イベントでのツール二重実行も修正しています。MCP 切断時のプロンプトキャッシュ喪失も直りました。","r":[17,18,19]},{"t":"auto mode の判定変更","b":"サーバー側の分類器レビューがある場合、読み取り専用コマンドとサンドボックス内コマンドもレビュー完了を待ち、指摘されればブロックされます。`CLAUDE_CODE_AUTO_MODE_SERVER` は直接の Anthropic API 接続にも適用されます。","r":[135,136]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"権限とツール実行まわりが中心です。危険な `rm` の検出強化、NUL バイトを含む権限ルールの扱い、sandbox の `excludedCommands` の照合修正が入っています。`\"attribution\": false` の追加と、auto mode のレビュー方式の変更もあります。","refs":[5,8,24,25,26,33,34,35,36,37,40,41,64,92,108,109,110,111,135,136,137]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"`claude --bg` の信頼確認と、`--setting-sources` を teammates や `/bg` などの派生セッションへ引き継ぐ修正が入っています。エージェントパネルと `/workflows` の表示・操作も改善されました。send now の動作は変更されています。","refs":[38,39,44,86,87,88,89,93,126,134,146,150]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"プラグインと MCP の周辺です。`claude plugin validate` に MCP サーバーのチェックが加わり、`claude plugin` の uninstall と update の不具合も修正されています。`/plugin` の一覧表示と操作性、スケジュールタスクの再実行問題も改善されました。","refs":[7,46,52,55,56,57,58,59,60,61,62,63,80,95,113,114,115,116,117,118,127,128,131,142,143,149,151]},{"a":"S","name":"セッション・履歴・圧縮","dg":"セッションの保存と再開に関する修正が中心です。再開時の履歴再送、大きなセッションの復元、`Prompt is too long` からの回復、再開にかかる時間が改善されました。","refs":[10,12,13,14,15,16,74,105,106,107]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP 接続まわりの修正と変更です。URL モードの elicitation に対応し、同一 MCP サーバーの二重接続やログイン後のフッター表示残りも直りました。Claude apps gateway は `envHelper` のパス形式を検査するようになりました。","refs":[6,51,53,54,132,139,145,148]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"Remote Control、VS Code/JetBrains、Claude Code on the web、Claude Tag（Slack）、Code Review をまとめた領域です。再開できないセッションや応答が止まる問題の修正が多く、Fast mode の切り替えなどの追加もあります。","refs":[43,45,47,48,70,71,102,133,147,152,153,154,155,156,157,158,159,160,161,162,163,164,165,166,167,168,169,170,171,172,173,174,175,176,177]},{"a":"H","name":"headless・SDK・API","dg":"Claude apps gateway の Bedrock 設定（`assume_role`、`guardrail`）が追加されました。プロキシ経由のストリーム異常、`--max-turns` を無視する再試行、headless/SDK セッションの失敗も修正され、`--agents` も拡張されています。","refs":[1,2,3,4,11,18,19,20,21,22,27,28,29,42,112,140]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"プロンプトキャッシュの維持、fast mode の再試行、大きな PDF の読み込み遅延が修正されました。AGENTS.md のサポートは Bedrock、Vertex AI、Foundry、LLM ゲートウェイでも動作するようになりました。","refs":[17,23,31,32,65,66,67,119,138]},{"a":"U","name":"UI・表示・入力","dg":"端末 UI と入力操作の修正が中心です。Ctrl+C/Ctrl+D によるダイアログのクローズ、vim モード、リスト表示、タブ付きダイアログのキーボード操作を扱います。fullscreen では `/skills`、`/mcp`、`/plugin` にスクロールバーが加わりました。","refs":[9,68,69,73,75,76,77,78,79,81,82,83,84,85,90,91,94,96,97,98,99,120,121,122,123,124,125,129,130,141,144]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"起動時間の短縮、macOS のキーチェーンと認証更新プロセスの修正、Windows 固有の問題が含まれます。Windows では `$TMPDIR` への書き込み失敗と `claude.exe` のバックアップ競合が直りました。","refs":[30,49,50,72,100,101,103,104]}],"skip":"表示の乱れ、キー入力の取りこぼし、特定環境のみで起きる不具合の修正が約 90 件あります。","st":"ok","stale":false,"e":[[1,"Claude apps gateway の `desktop` ポリシーが `blockReadsOutsideWorkingDirectories` と `disableBypassPermissionsMode` に対応","Added Claude apps gateway support for newer Claude Desktop keys in `desktop` policy blocks, including `blockReadsOutsideWorkingDirectories` and `disableBypassPermissionsMode`","H","new",2,"admin,sdk",0,[]],[2,"Claude apps gateway の Bedrock upstream で `assume_role` により STS 経由の IAM ロール（別アカウント可）を利用可能","Added `assume_role` on Claude apps gateway Bedrock upstreams: the gateway calls Bedrock as an IAM role it assumes through STS, in another AWS account if needed, optionally one session per developer","H","new",2,"admin,sdk",0,[]],[3,"Claude apps gateway の Bedrock upstream に `guardrail: {id, version}` で Bedrock ガードレールを全リクエストへ適用","Added `guardrail: {id, version}` on Claude apps gateway Bedrock upstreams to apply an Amazon Bedrock guardrail to every request sent through them (set it on all Bedrock upstreams or none)","H","new",2,"admin,sdk",0,[]],[4,"Claude apps gateway の設定に `telemetry.resource_attributes` を追加し、Desktop と `/login` のテレメトリに固定ラベルを付与","Added `telemetry.resource_attributes` to the Claude apps gateway config, to put fixed labels on the telemetry of Claude Desktop and `/login` sessions","H","new",1,"admin,sdk",0,[]],[5,"`settings.json` の `\"attribution\": false` でコミットと PR の帰属表示をすべて非表示にできる","Added `\"attribution\": false` in `settings.json` to hide all commit and PR attribution; older CLI versions skip a settings file that holds it, so keep the object form in files shared across versions","T","new",2,"cli",0,[]],[6,"2026-07-28 プロトコルの MCP 接続で URL モード elicitation に対応し、完了確認できない場合は待機ダイアログを残さない","Added MCP URL-mode elicitation on 2026-07-28 protocol connections, so servers can ask Claude Code to open a browser-based flow; no waiting dialog is left on screen when the server has no way to confirm completion","C","new",2,"cli",0,[]],[7,"`claude plugin validate` が `.mcp.json` の無視されるエントリ、未宣言の `${user_config.*}`、安全でない URL を報告","Added MCP server checks to `claude plugin validate`: it reports `.mcp.json` entries that would be silently dropped at load, undeclared `${user_config.*}` references, and insecure URLs","M","new",2,"mod-dev",0,[]],[8,"`/insights` に auto mode の推奨を追加し、直近セッションで自動処理できた許可プロンプト数を推定","Added an auto mode recommendation to `/insights` that estimates how many permission prompts auto mode could have handled in your recent sessions","T","new",2,"cli",0,[]],[9,"フルスクリーンの `/skills`・`/mcp`・`/plugin` の Installed 一覧にスクロールバーを表示（クリック・ドラッグ可）","Added a scrollbar to the `/skills`, `/mcp` and `/plugin` Installed lists in fullscreen mode, like the one `/workflows` now has: it appears while the mouse is over the list and can be clicked or dragged","U","new",1,"cli",0,[]],[10,"API リクエストのリトライ中に「unrecoverable interface error」でセッションが終了するクラッシュを解消","Fixed a crash (\"unrecoverable interface error\") that could end a session while an API request was being retried","S","fix",2,"cli",0,[]],[11,"解析不能なツール呼び出しと出力上限の切り詰めが交互に起きても `--max-turns` を守り、無限リトライしない","Fixed a turn that could retry indefinitely, ignoring `--max-turns`, when the model alternated unparseable tool calls and output-limit truncation","H","fix",2,"sdk",0,[]],[12,"再開したセッションが過去ターンを変形して再送し API が以前の推論を落とす問題を解消","Fixed resumed sessions re-sending earlier turns in a changed form (a parallel tool-call turn, an MCP tool call's input or a tool-search result while its server was still reconnecting, or a tool-search result whose loading turn was interrupted), which could make the API drop the conversation's prior reasoning","S","fix",2,"cli",0,[]],[13,"非常に大きなセッションを再開しても直近数メッセージだけでなく全体が復元される","Fixed resuming a very large session sometimes restoring only its last few messages","S","fix",2,"cli",0,[]],[14,"許可プロンプト中の再起動後に再開しても履歴が変わらず、プロンプトキャッシュが維持される","Fixed a session resumed after a restart during a pending permission prompt sending a different history than before, which broke the prompt cache from that point","S","fix",2,"cli",0,[]],[15,"ツール呼び出し中に終了したセッションの再開で、結果不明と伝えた上で呼び出しを見せ、隠れた「Continue」を追加しない","Fixed resuming a session that ended during a tool call: Claude now sees the call and is told its outcome is unknown, and a manual resume no longer adds a hidden \"Continue\" message","S","fix",2,"cli",0,[]],[16,"API が読めない過去の advisor 結果を含むセッションで毎ターン失敗する問題を、履歴を一度修復して解消","Fixed sessions with an earlier advisor result the API could no longer read failing one request every turn and repeatedly losing earlier reasoning; the history is now repaired once","S","fix",1,"cli",0,[]],[17,"tool search オフ時、MCP サーバーの切断や再開後の接続中でプロンプトキャッシュが失われなくなった","Fixed the prompt cache being lost when an MCP server disconnects mid-conversation, or is still connecting after a resume, while tool search is off (for example behind a proxy or gateway)","L","fix",2,"cli,sdk",0,[]],[18,"プロキシがストリームを正常終了して途中で切れた応答を完了扱いせず、重複イベントでツールが二重実行されない","Fixed responses cut short by a proxy or gateway that closes the stream cleanly being shown as complete with no warning, and tool calls running twice on duplicated stream events","H","fix",2,"sdk",0,[]],[19,"プロキシがストリームイベントを落としても「Content block not found」で失敗せず、部分応答と web search 結果を保持","Fixed responses failing with \"Content block not found\" when a proxy drops a stream event mid-response; the partial response is now kept, and web search keeps results that already arrived","H","fix",2,"sdk",0,[]],[20,"ストリーム最終イベント前に接続が切れても、空の完了応答を二重にリクエストしない","Fixed an empty completed response being requested twice when the connection dropped before the stream's final event","H","fix",1,"sdk",0,[]],[21,"プロキシが usage のみの末尾フレームを送っても stop reason が失われない","Fixed the stop reason being lost when a proxy sends a trailing usage-only frame","H","fix",1,"sdk",0,[]],[22,"`CLAUDE_CODE_RETRY_WATCHDOG` で 429/529 待機後の最初の 5xx で失敗せず、長い `Retry-After` の無音待機も解消","Fixed `CLAUDE_CODE_RETRY_WATCHDOG` sessions failing on the first 5xx or dropped connection after a run of 429/529 waits, and sleeping uncapped and silently on a long `Retry-After` from a 5xx","H","fix",1,"sdk",0,[]],[23,"fast mode で `Retry-After: 0` の際にレート制限リクエストを連続再試行しない","Fixed fast mode retrying rate-limited requests back to back when the server sent `Retry-After: 0`","L","fix",1,"cli",0,[]],[24,"ツールが巨大な画像を返しても、並列のツール呼び出しが未応答のまま残ったり最終メッセージなしで終わったりしない","Fixed a tool that returned an oversized image leaving sibling tool calls unanswered and still running, or ending the turn with no final message","T","fix",2,"cli",0,[]],[25,"モデルが長すぎる名前のツールを呼んでも「tool_use.name … at most 200 characters」で会話が固まらない","Fixed conversations getting permanently stuck on \"tool_use.name: String should have at most 200 characters\" after the model called a tool by an overlong name","T","fix",2,"cli",0,[]],[26,"自身のメモリ使用量を読めない場合（fd 枯渇など）も「Failed to get memory usage」でツール呼び出しが失敗しない","Fixed tool calls failing with \"Failed to get memory usage\", or being reported as failed after they ran, when Claude Code cannot read its own memory usage, for example when it has run out of file descriptors","T","fix",1,"cli",0,[]],[27,"過去の assistant メッセージが文字列の場合、`--input-format stream-json` とクラウドのスケジュールセッションが毎ターン失敗しない","Fixed `--input-format stream-json` sessions (Agent SDK, VS Code extension) and scheduled cloud sessions failing every turn with an error when an earlier assistant message had plain-string content","H","fix",2,"sdk,ide",0,[]],[28,"起動ディレクトリがセッション中に削除されても、非対話セッション（`-p`、SDK）が次ターンで失敗しない","Fixed non-interactive sessions (`-p`, Agent SDK) failing on the next turn after the directory they were started in was deleted mid-session","H","fix",1,"sdk",0,[]],[29,"SDK 側 MCP サーバーのホストが応答しなくても初回メッセージで止まらず、リモートは最大数秒待つだけ","Fixed headless sessions with host-side (SDK) MCP servers stalling on the first message when the host stops responding mid-handshake; remote sessions now wait a few seconds at most","H","fix",1,"sdk,cloud",0,[]],[30,"MCP サーバーも plugin も無い場合、起動時に managed-settings のネットワーク要求を待たない","Fixed interactive startup waiting on the managed-settings network request (about 80 ms, 17+ seconds when the network is unreachable) when no MCP servers or plugins are configured","O","improve",2,"cli",0,[]],[31,"3MB 超の PDF の読み込みや @ メンションで最大 2 分の応答遅延が出ない","Fixed a delay of up to two minutes before responding when reading or @-mentioning a PDF larger than 3 MB","L","fix",2,"cli",0,[]],[32,"PDF の特定ページ Read を中断してもページレンダリングが最大 2 分残り続けない","Fixed an interrupted Read of specific PDF pages leaving its page render running for up to two minutes","L","fix",1,"cli",0,[]],[33,"macOS の `/.vol`・`/.nofollow`・`/.resolve` 配下のパスを、承認前に読み込まない","Fixed permission dialogs and attachment checks reading a path under macOS's `/.vol`, `/.nofollow` or `/.resolve` (which can reach a network mount) before approval","T","fix",2,"macos",0,[]],[34,"`rm -rf \"$(pwd)\"` のような再帰 `rm` が auto と `--dangerously-skip-permissions` でも確認される（`CLAUDE_CODE_DISABLE_SUBSTITUTION_RM_PROMPT=1` で無効化可）","Fixed a recursive `rm` whose target is only command-substitution output, such as `rm -rf \"$(pwd)\"`, running unprompted in auto and `--dangerously-skip-permissions` mode; it now asks even with a Bash allow rule, unless run with `CLAUDE_CODE_DISABLE_SUBSTITUTION_RM_PROMPT=1`","T","fix",3,"cli,sdk",0,[]],[35,"NUL バイトを含む権限ルールがワイルドカード扱いされず、何にも一致しない","Fixed a permission rule containing a NUL byte being expanded into a wildcard match; such a rule now matches nothing","T","fix",2,"admin",0,[]],[36,"sandbox の `excludedCommands` が `git rev-parse --git-dir`、組み込み風の名前、`[WIP]` や `#` 行を含むコミットメッセージに一致する","Fixed sandbox `excludedCommands` entries not matching `git rev-parse --git-dir`, programs named like shell builtins, and commit messages containing `[WIP]` or `#` lines","T","fix",1,"cli",0,[]],[37,"`CLAUDE_CODE_TMPDIR` 設定時もサンドボックス内 Bash が `$TMPDIR` に書き込める","Fixed sandboxed Bash commands being unable to write to `$TMPDIR` when `CLAUDE_CODE_TMPDIR` is set","T","fix",1,"cli",0,[]],[38,"`claude --bg` はワークスペース信頼を未承認のディレクトリでは先に確認し、非対話なら終了する","Fixed `claude --bg` starting a background session, and running its project hooks, in a directory that had not passed the workspace trust prompt; it now asks for trust first, or exits when not run interactively","A","fix",3,"cli",0,[]],[39,"`--setting-sources`/`settingSources` が teammates、`/bg`、`claude agents`、`--worktree --tmux` に引き継がれる","Fixed `--setting-sources` (and SDK `settingSources`) not being forwarded to spawned sessions: teammates, `/bg`, ck request blocked by your organization's inference hook showing a generic retry notice; the thread now shows the hook's deny message and Claude doesn't retry","I","fix",1,"cloud",0,[]],[173,"Slack の Claude が、組織で使えないモデルへの切替を提案せず、受け付けられるモデルだけを提示する","[Claude Tag] Fixed Claude in Slack offering to switch to models your organization can't use; it now lists and offers only models the switch will actually accept","I","fix",1,"cloud",0,[]],[174,"Claude Tag の AWS 接続経由の DynamoDB・Kinesis アカウントベースエンドポイントへのリクエストが認証に成功する","[Claude Tag] Fixed requests to DynamoDB and Kinesis account-based endpoints failing to authenticate when sent through an AWS connection in Claude Tag","I","fix",1,"cloud",0,[]],[175,"Claude Tag 管理設定の Plugins セクションが組織管理者向けに読み込まれ、plugin 名で表示される","[Claude Tag] Fixed the Plugins sections in Claude Tag admin settings failing to load for organization admins and listing attached plugins as raw IDs; they now load and show each plugin's name","I","fix",1,"cloud,admin",0,[]],[176,"Slack スレッドでルーティン一覧を尋ねると、既定でそのスレッド自身の定期タスクを表示する","[Claude Tag] Changed the routine list Claude gives when asked in a Slack thread to show that thread's own scheduled tasks by default instead of every routine in the channel","I","change",1,"cloud",0,[]],[177,"全 push をレビューしない設定のリポジトリで、失敗レビューの再試行中に対象コミットが force-push で消えてもレビューされる","[Code Review] Fixed a pull request getting no review when its reviewed commit was force-pushed away while a failed review was being retried in a repository not set to review every push","I","fix",2,"cloud",0,[]]]},{"v":"2.1.280","date":"2026-09-23（水）00:44","dshort":"09-23 00:44","nb":8,"head":"Opus 5.5 が既定モデルになり、auto mode と各種ダイアログを修正","sum":"Claude Opus 5.5 の追加と、Pro・Team Standard を含む全プランでの Opus 既定化が中心のリリースです。auto mode の再試行ループやシンボリックリンク経由の書き込み承認など、権限まわりの修正も多く含まれます。ダイアログ操作、サブエージェント、プラグイン、VSCode や Slack 連携の修正も入っています。","watch":[{"b":"保存済みの effort レベルは Opus 5.5 などの新モデルには適用されず既定値から始まるため、必要なら `/effort` で選び直してください。","r":[79]},{"b":"Opus 4.7、Opus 4.8、Fable 5 は起動時の既定 effort を `/effort`、`-p`、Agent SDK、設定ファイルの `effortLevel` などより優先しなくなったため、effort を固定している場合は設定を確認してください。","r":[80]},{"b":"ダイアログでは `y`/`n` が使えず Enter/Esc で操作する仕様になったため、従来の挙動が必要なら `keybindings.json` で `confirm:yes`/`confirm:no` に割り当ててください。","r":[11]},{"b":"fullscreen の `ctrl+l` / `cmd+k` は transcript のクリアをやめて画面の再描画に戻ったため、クリア目的の操作は別の手段に切り替えてください。","r":[61]},{"b":"予約済みマーケットプレイス名に似せた名前のプラグインマーケットプレイスは追加が拒否され、既存のものは読み込まれなくなったため、該当するものは名前を確認してください。","r":[84]},{"b":"`PermissionRequest` hook では agent 型 hook が実行されずエラーになるため、`command` または `http` 型 hook に置き換えてください。","r":[85]},{"b":"Self-hosted runner のライフサイクル hook 内の git は、共有 git ファイルで指定された hook フォルダやプログラムを無視し、ローカルパスや `git://` のリモートには `GIT_ALLOW_PROTOCOL` が必要になったため、該当する構成では設定してください。","r":[83]}],"hl":[{"t":"Opus 5.5 が既定モデルに","b":"`claude-opus-5-5` が追加され、既定の Opus になりました。1M コンテキストで、料金は $4/$20 per Mtok、キャッシュ読み取りは $0.20/Mtok です。","r":[1]},{"t":"Pro/Team Standard も Opus 既定","b":"Pro と Team Standard の既定モデルが Sonnet から Opus に変わり、Max、Team Premium、Enterprise と揃いました。","r":[78]},{"t":"シンボリックリンク書き込みの承認","b":"シンボリックリンク経由の書き込みは実際の書き込み先で判定されます。`acceptEdits`、allow ルール、auto mode はツリー外に着地する書き込みを承認しなくなりました。","r":[5]},{"t":"auto mode の再試行ループ修正","b":"安全確認が応答しない場合や審査を辞退した場合に、同じ操作が繰り返し拒否される問題を修正しました。辞退時は一度だけ拒否し、無応答時は再試行が間引かれ、10 回連続で止まります。","r":[6,7,104]},{"t":"ダイアログの終了・確認キー","b":"主要ダイアログで Ctrl+C/Ctrl+D の 2 回押しがアプリ終了ではなくダイアログを閉じるようになりました。誤って `n` や `y` で閉じたり確定したりすることもなくなりました。","r":[9,11]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"シンボリックリンク経由の書き込み判定、auto mode の再試行・拒否の挙動、Write 呼び出しの引数ゆれを修正しました。`/ultrareview` のアップロードでは、名前を変えた鍵ファイルの複製も対象外になりました。","refs":[5,6,7,8,76,104]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"サブエージェントとバックグラウンド処理の修正が中心です。再開した fork サブエージェントのプロンプトキャッシュ、メッセージや報告の取りこぼし、LSP ツールの利用、バックグラウンドシェルの正常な非ゼロ終了の扱い、Ctrl+C の押下回数などが直りました。","refs":[17,18,22,39,40,41,42,43,44,47]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"プラグインの更新記録、マーケットプレイスの自動更新と認証情報、skills の誤移動、Artifact ツールの挙動を修正しました。無効化した skill の表示も失敗と区別されます。","refs":[19,20,24,49,50,51,52,65,73,84,85]},{"a":"S","name":"セッション・履歴・圧縮","dg":"保存済み履歴に不正な通知やシステムメッセージがある場合のクラッシュや毎ターン失敗を修正しました。再開時に未完了のバックグラウンド処理があると、入力前にモデルのターンが始まる問題も直りました。","refs":[33,34,38]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"`CLAUDE_CODE_MAX_MCP_DESCRIPTION_LENGTH` で MCP の説明文の上限を変更できるようになりました。`/mcp` の警告表示の統一と、同名で再追加した MCP サーバーの再接続も修正しました。","refs":[3,27,48]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VSCode に Status、Sandbox、Chrome の各ダイアログと `/export`、`/skills`、`/plan` が追加されました。Web 版、Slack 連携、Remote Control のほか、`/ultrareview` や GitHub Enterprise Server のトークン更新の問題も修正されています。","refs":[45,53,54,55,56,57,75,86,87,88,89,90,91,92,93,94,95,96,97,98,99,100,101,102,103,105,106,107,108,109,110,111,112,113]},{"a":"H","name":"headless・SDK・API","dg":"API の 400 エラーや role 順序エラーによる毎ターン失敗を修正し、`hook_execution_complete` OpenTelemetry イベントに hook 出力サイズが加わりました。Self-hosted runner の hook と Code Review の通知も改善しています。","refs":[4,31,32,58,60,83,114]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"Opus 5.5 の追加と既定モデルの変更が中心です。ホストアプリからのモデル切替後のキャッシュミスを修正し、`/cost` のキャッシュミス原因に thinking の変更が表示されるようになりました。","refs":[1,16,64,78,79,80]},{"a":"U","name":"UI・表示・入力","dg":"ダイアログのキー操作、fullscreen のマウス操作、選択リストの Home/End・PgUp/PgDn、`/permissions` の挙動を整えました。見た目の乱れ、音声入力、`/config` のクラッシュなども修正されています。","refs":[2,9,10,11,12,13,14,15,21,23,25,26,28,29,30,35,37,46,61,62,63,66,67,68,69,70,71,72,74,77,81,82]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"設定ファイルが名前付きパイプに置き換わったときのハングと、Windows のバックグラウンド掃除がディレクトリのシンボリックリンクやジャンクションを削除する問題を修正しました。","refs":[36,59]}],"skip":"表示の乱れ、特定環境でのクラッシュ、VSCode・Slack・クラウド環境の個別の不具合修正など、細かな修正が約 70 件あります。","st":"ok","stale":false,"e":[[1,"Opus 5.5 (`claude-opus-5-5`) を追加し、Opus の既定モデルに。1M コンテキスト、$4/$20 per Mtok","Added Claude Opus 5.5 (`claude-opus-5-5`), now the default Opus model — 1M context, $4/$20 per Mtok with $0.20/Mtok cache reads","L","change",3,"cli,sdk",1,[]],[2,"フルスクリーンで `/skills` 一覧をホイールでスクロールでき、`/plugin` のスキル状態をクリックで切替可能","Added mouse support to more lists in fullscreen mode: the wheel scrolls the `/skills` list, and a skill's state options in `/plugin` can be clicked","U","new",1,"cli",0,[]],[3,"`CLAUDE_CODE_MAX_MCP_DESCRIPTION_LENGTH` で MCP ツール説明・サーバー指示の 2,048 文字上限を変更可能","Added `CLAUDE_CODE_MAX_MCP_DESCRIPTION_LENGTH` to change the 2,048-character cap on MCP tool descriptions and server instructions for every MCP server in the session","C","new",2,"cli,admin",0,[]],[4,"`hook_execution_complete` の OpenTelemetry イベントに hook 出力サイズとファイル保存された大きな出力の数を追加","Added hook output sizes and the number of oversized outputs saved to a file to the `hook_execution_complete` OpenTelemetry event","H","new",1,"sdk,admin",0,[]],[5,"シンボリックリンク経由の書き込みは実際の書き込み先で判定し、`acceptEdits`・allow ルール・auto mode はツリー外着地を承認しない","Fixed writes through a symlinked path being judged by their in-tree spelling: the prompt names where the write lands, and `acceptEdits`, allow rules and auto mode no longer approve one landing outside","T","fix",3,"cli,sdk",0,[]],[6,"安全チェックが審査を拒否した場合、auto mode は同じ操作を再試行せず一度だけ拒否し、再試行が無駄だと伝える","Fixed auto mode retrying an action over and over when a safety check declined to review it; the action is now denied once, noting that retrying won't help","T","fix",2,"cli",0,[]],[7,"安全チェックが無応答のとき auto mode の再試行は間隔を空け、10 回連続でメッセージを出してターンを停止","Fixed auto mode denying actions over and over without pause when a safety check gave no answer; retries now back off, and the turn stops with a message after ten in a row","T","fix",2,"cli",0,[]],[8,"モデルが `file_path`/`content` の代わりに `path`、`file_text`、`file_content` や余分な `description` を送っても Write が検証を通る","Fixed Write calls failing validation when a model sends `path`, `file_text`, `file_content` or a stray `description` instead of `file_path` and `content`","T","fix",2,"cli",0,[]],[9,"`/model`、`/config`、`/plugin` など多くのダイアログで Ctrl+C/Ctrl+D 2 回押しても終了せずダイアログが閉じる","Fixed Ctrl+C or Ctrl+D pressed twice in most dialogs (`/model`, `/effort`, `/config`, `/status`, `/usage`, `/plugin`, `/sandbox`, `/permissions`, `/artifacts`, `/mobile`, `/login`, `/upgrade`, `/usage-credits`, `/install-github-app`,

ed a skill's own front-matter `UserPromptSubmit` hook to first run on the prompt after the one that invokes the skill","M","change",2,"mod-dev",1,[],"hooks"],[169,"`turn.start` mod フックがサブエージェントとチームメイトのターンも受け取り、`e.agentId`（メインループでは無し）で区別する","Changed the `turn.start` mod hook to also hear subagents' and teammates' turns, not only the main loop's; tell them apart by `e.agentId` (absent on the main loop)","M","change",2,"mod-dev",1,[],"plugins-mods"],[170,"`/ultrareview` がリポジトリをアップロードできないときのエラーが、`.env` などを巻き込む `git add .` を勧めなくなる","Changed the errors shown when `/ultrareview` can't upload a repository to stop suggesting `git add .`, which could stage or commit untracked files such as `.env`","U","change",2,"cli",0,[],"slash-commands"],[171,"サイバー保護の通知が、Cyber Verification Program への申請を求めなくなる","Changed the cyber safeguard notice to no longer ask people to apply to the Cyber Verification Program","U","change",1,"cli",0,[],"cyber-safeguards"],[172,"別セッションに切り替えて戻っても、未送信のプロンプトと添付が失われない","[VSCode] Fixed an unsent prompt and its attachments being lost when switching to another session and back","I","fix",2,"ide",0,[],"vscode"],[173,"新しい会話を開始した後、未使用の空チャットがバックグラウンドの Claude プロセスを残さない","[VSCode] Fixed unused blank chats keeping a background Claude process running after starting a new conversation","I","fix",1,"ide",0,[],"vscode"],[174,"claude.ai からサインアウト中のマイクボタンが内部エラーでなく、サインインの案内を表示する","[VSCode] Fixed the mic button showing an internal error message when you are signed out of claude.ai; it now offers to sign you in","I","fix",1,"ide",0,[],"vscode"],[175,"Python 環境のないワークスペースで、Python 拡張の読み込み中に Claude を起動して起動が速くなる","[VSCode] Improved startup time in workspaces without a Python environment by starting Claude while the Python extension loads","I","improve",1,"ide",0,[],"vscode"],[176,"開いたことのあるフォルダの新規ウィンドウで、モデルピッカーとスラッシュコマンドメニューがすぐに表示される","[VSCode] Improved startup: the model picker and slash command menu now fill in right away in a new window on a folder you've opened before","I","improve",1,"ide",0,[],"vscode"],[177,"既存の出力ファイルを多数まとめて再送した際のメモリ急増によるセッションクラッシュが起きない","[Cloud sessions] Fixed a memory spike that could crash a session when many of its existing output files were re-sent to it at once","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[178,"編集した routine の保存時、元の環境が削除済みや一覧外でも別環境へ黙って移動せず、環境を保持する","[Cloud sessions] Fixed saving an edited routine silently moving it to a different environment when its own had been deleted or wasn't in the list; the routine now keeps its environment","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[179,"self-hosted 環境の管理詳細で、セッションリンクからコピーしたセッション ID でも Sessions 検索が見つかる","[Cloud sessions] Fixed Sessions search in a self-hosted environment's admin details finding nothing when you paste the session ID from a session's link","I","fix",1,"cloud,admin",0,[],"web-cloud-sessions"],[180,"self-hosted 環境の Sessions/Runners 一覧で、検索結果が0件のとき一覧が空と誤表示しない","[Cloud sessions] Fixed the Sessions and Runners lists in a self-hosted environment's admin details saying the list is empty when a search just has no matches","I","fix",1,"cloud,admin",0,[],"web-cloud-sessions"],[181,"self-hosted 環境や環境キー作成時のデプロイコマンドが全文表示され、引数間で折り返し、コピーボタンが見える","[Cloud sessions] Improved the deploy command shown when you create a self-hosted environment or environment key: it shows in full, wraps between arguments, and has a visible copy button","I","improve",1,"cloud,admin",0,[],"web-cloud-sessions"],[182,"self-hosted 環境を削除すると routine が即座に無効化され、各 routine に理由が表示される（実行失敗のまま放置されない）","[Cloud sessions] Changed deleting a self-hosted environment to turn off its routines right away, with the reason shown on each routine, instead of leaving their runs to fail","I","change",2,"cloud,admin",0,[],"web-cloud-sessions"],[183,"接続できない PC への Remote Control で送信済みに見えず、入力テキストが残り再接続まで Send が無効になる","[Remote Control] Fixed Remote Control sessions whose computer can't be reached still appearing to send your messages; your text now stays in the box and Send is off until it reconnects","I","fix",2,"cloud",0,[],"remote-control"],[184,"Claude in Slack が依頼に応じて、チャンネルに作成した canvas を削除できる","[Claude Tag] Added the ability for Claude in Slack to delete a canvas it created in a channel when someone asks it to","I","new",1,"cloud",0,[],"claude-tag"],[185,"ゲストのいるチャンネルで、チャンネル指示が応答を求める未タグ投稿に Claude in Slack が応答する","[Claude Tag] Fixed Claude in Slack staying silent on untagged posts that a channel's own instructions tell it to answer, such as posts that tag someone else, in channels with guests","I","fix",2,"cloud",0,[],"claude-tag"],[186,"未参加の他チャンネルのスレッドへ返信できなかったとき、投稿済みと報告せず未配信と対処法を伝える","[Claude Tag] Fixed Claude in Slack reporting a reply to another channel's thread as posted when it isn't a member there; it now says the reply wasn't delivered and how to fix that","I","fix",1,"cloud",0,[],"claude-tag"],[187,"self-hosted runner のイメージに python3 がなくても、Claude in Slack が回答を投稿せずにターンを終えない","[Claude Tag] Fixed Claude in Slack sometimes ending a turn without posting its answer when a self-hosted runner's image has no python3","I","fix",1,"cloud",0,[],"claude-tag"],[188,"Claude in Slack は誤った投稿を取り消し線でなく、その場で編集し短い「Edited」注記を付けて訂正する","[Claude Tag] Changed how Claude in Slack corrects a message it got wrong: it edits the message in place and adds a short \"Edited\" note instead of striking through the old text","I","change",1,"cloud",0,[],"claude-tag"],[189,"Claude in Slack は100人超のチャンネルに紹介メッセージなしで静かに参加する","[Claude Tag] Changed Claude in Slack to join channels with more than 100 members quietly, with no intro message","I","change",1,"cloud",0,[],"claude-tag"],[190,"Code Review の月次上限コメントとチェックランカードが、上限を設定する Usage ページへリンクする","[Code Review] Fixed Code Review's monthly spend-limit comment and check-run card sending admins to Claude Code settings; they now link the Usage page, where that limit is set","I","fix",1,"admin",0,[],"code-review"]]},{"v":"2.1.296","date":"2026-10-10（土）01:58","dshort":"10-10 01:58","nb":0,"head":"フック・権限の判定修正とゲートウェイ設定の拡張が中心","sum":"v2.1.296 は managed settings のフックや Bash・Edit の権限判定など、安全側に倒す修正が中心のリリースです。Claude apps gateway の `code` キー追加と関連する不具合修正、Windows 向け修正、VSCode と Claude Tag の改善も含みます。`←` の挙動変更や MCP 説明の上限引き上げなど、既定動作が変わる点もあります。","watch":[{"b":"MCP ツール説明と MCP サーバー指示の先頭送信上限が 2,048 から 4,096 文字に変わるため、コンテキスト消費が増える場合は上限設定を確認してください。","r":[61]},{"b":"`←` でバックグラウンドへ移すとき、その間に始まったターンや `!` コマンドは完了せず停止されるため、実行中の処理がある場合は完了を待ってから使ってください。","r":[62]},{"b":"VSCode の Claude in Chrome が `@browser` 接続を含む全セッションでブラウザ操作の前に確認を求めるようになったため、頻繁な確認が不要なサイトはセッション単位で許可してください。","r":[64]},{"b":"Claude in Slack のフッター（セッションリンク・モデル・費用）はスレッド内の最新の返信にだけ表示されるため、過去の返信のリンクが必要なら事前に控えてください。","r":[71]},{"b":"Sonnet 5.5 のキャッシュ読み取りが 100 万トークンあたり $0.10（従来 $0.20）で計算されるため、`/cost` や `--max-budget-usd` の数値が以前と変わります。","r":[59]}],"hl":[{"t":"シェル権限判定の抜けを修正","b":"`BASH_ARGV0` を代入して使うコマンドと、bypass permissions モードでの Git Bash の `rm -rf /c/Users/\u003cname\u003e` が、承認を求めるようになりました。Windows では約 1 KB を超える PowerShell コマンドにも、32 KB まで allow ルールと読み取り専用判定が効きます。","r":[31,50,47]},{"t":"フックの拒否と検査が確実に効く","b":"managed settings の `PreToolUse` フックが `\"continue\": false` で拒否したときと、managed の `prompt` フックが拒否したときに、ターンが終了するようになりました。`UserPromptSubmit` フックの実行中に Esc や中断をしても、未検査のプロンプトは通りません。","r":[7,19,8]},{"t":"gateway に `code` キー追加","b":"Claude apps gateway の `managed.policies[]` に `code` キーが追加され、`cli` と同じ設定が Claude Desktop の Code タブにも適用されます。`desktop` と併用すると Claude Desktop の gateway モードが有効になります。","r":[1,53,10,11]},{"t":"`←` の背景移行時の挙動変更","b":"`←` でセッションをバックグラウンドへ移している途中に始まったターンや `!` コマンドは、見えない所で完了せず停止するようになりました。移行の直後に送ったプロンプトが二重に実行される不具合も修正されています。","r":[62,33,34]},{"t":"非 UTF-8 ファイルの編集を拒否","b":"UTF-8 として正しくないファイル(Windows-1252、Shift-JIS、GBK)に対して、Edit と NotebookEdit が非 ASCII 文字をすべて置き換えていた不具合が修正されました。こうしたファイルへの編集は拒否されます。","r":[32]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"Read ツールの `allow_large` を追加し、Bash・Edit・NotebookEdit・auto mode の権限判定を修正しました。Windows では PowerShell の長いコマンドの権限判定と Git Bash の削除確認も直っています。","refs":[6,16,29,31,32,36,39,47,50,56]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"サブエージェント frontmatter と `--agents` に `autoCompactWindow` を追加し、`CLAUDE_CODE_WORKFLOW_SUBAGENT_MODEL` も加えました。再開したサブエージェントの誤通知、`←` 周辺のプロンプト二重実行や消失、Workflow ツールの CRLF 拒否を修正しています。","refs":[2,3,14,23,33,34,43,62]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"managed settings のフックの拒否や出力適用、`UserPromptSubmit` の中断処理を修正しました。プラグインの重複名、`constructor` という名前、claude.ai 同期まわりの不具合も直しています。`--debug` ではフックの実行ログと frontmatter の未認識フィールドが分かるようになりました。","refs":[5,7,8,15,19,20,24,25,26,27,28,35,40,41,49,55,57,60]},{"a":"S","name":"セッション・履歴・圧縮","dg":"`CLAUDE_CODE_TRANSCRIPT_LOCAL_GC` と `claude purge` の Unicode 行区切り文字に関する不具合を修正し、小さい節約では大きな transcript を書き換えないようにしました。`--teleport` の空会話と、中断ターンの再実行も修正しています。","refs":[12,30,45,46,58]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP ツール説明と MCP サーバー指示の既定上限を 4,096 文字に変更しました。無効化した MCP サーバーの headless での起動と、認証が必要なときの案内を修正しています。Windows では stdio MCP サーバーを先に stdin を閉じてから終了させます。","refs":[9,37,48,61]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VSCode は Chrome 操作の確認、パス表記、reduced motion、`claudeCode.spinnerVerbs` の補完を扱っています。cloud sessions、Claude Tag（Slack）、Code Review の表示や管理画面も改善され、`/code-review` の結果は番号付きリストで出ます。","refs":[38,53,54,63,64,65,66,67,68,69,70,71,72,73,74,75,76,77,78,79]},{"a":"H","name":"headless・SDK・API","dg":"Claude apps gateway の `code` キー追加と、`allowedProviders` やログイン方式まわりの不具合修正が入りました。`CLAUDE_CODE_OVERLOADED_RETRY_MAX_DELAY_MS` の追加、self-hosted runner のエラー表示と git 操作の修正、OpenTelemetry の `git_commit_id` 欠落の修正もあります。","refs":[1,4,10,11,21,22,44]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"Haiku 5.5 など adaptive thinking のみのモデルのトークン数計算を修正し、Sonnet 5.5 のキャッシュ読み取り料金を $0.10 に更新しました。","refs":[13,59]},{"a":"U","name":"UI・表示・入力","dg":"fullscreen mode ではマウス下のリンクに下線が付き、ctrl+o の切り替えが速くなりました。古い VTE 端末の `52;c;…` 表示崩れと、`/diff` 表示中に通知が見えない問題も修正しています。","refs":[17,18,51,52]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"プラグインのパスが Linux 由来で `/home` を指す場合に、macOS で起動時にハングする問題を修正しました。","refs":[42]}],"skip":"表示の乱れ、まれな環境での不具合、プラグインや mod 周りの細かな修正が 40 件以上あります。","st":"ok","stale":false,"e":[[1,"Claude apps gateway の `managed.policies[]` に `code` キーを追加し、Desktop の Code タブにも適用、`desktop` と併用で gateway モードが有効に","Added a `code` key to the Claude apps gateway's `managed.policies[]`: the same settings as `cli`, also applied in Claude Desktop's Code tab; beside `desktop`, it turns on Claude Desktop's gateway mode","H","new",2,"admin,ide",0,[],"managed-settings"],[2,"サブエージェントの frontmatter と `--agents` に `autoCompactWindow` を追加し、メイン会話より早く自動圧縮できる","Added `autoCompactWindow` to subagent frontmatter and `--agents` definitions, so a subagent can auto-compact earlier than the main conversation's window","A","new",2,"cli,sdk",0,[],"subagents"],[3,"`CLAUDE_CODE_WORKFLOW_SUBAGENT_MODEL` で workflow の全エージェントを 1 つのモデルで実行できる","Added `CLAUDE_CODE_WORKFLOW_SUBAGENT_MODEL` to run every workflow agent on one model while other subagents keep theirs","A","new",1,"cli",0,[],"subagents"],[4,"`CLAUDE_CODE_OVERLOADED_RETRY_MAX_DELAY_MS` で overloaded (529) 再試行のバックオフ最大遅延を延長できる","Added `CLAUDE_CODE_OVERLOADED_RETRY_MAX_DELAY_MS` environment variable to set a longer maximum delay for the backoff when retrying an overloaded (529) request","H","new",1,"cli,sdk",0,[],"headless-ci"],[5,"同名の別 plugin が有効なためフックが除外された plugin に `/plugin` で注記を表示","Added a note in `/plugin` on a plugin whose hooks are left out because another enabled plugin has the same name","M","new",1,"mod-dev",0,[],"plugins-mods"],[6,"Read ツールに `allow_large` を追加し、通常のサイズ上限を超えるテキストファイルを一度に読める","Added an `allow_large` option to the Read tool so Claude can read a text file past the usual size limits in one call when it needs the whole file and the context has room","T","new",2,"cli",0,[],"read-edit-tools"],[7,"managed settings の `PreToolUse` フック(`\"continue\": false`)や `prompt` フックの拒否がターンを終了させる","Fixed managed-settings `PreToolUse` hooks that deny a tool call with `\"continue\": false`, and managed `prompt` hooks that block one, refusing the call but not ending the turn","M","fix",2,"admin,mod-dev",0,[],"hooks"],[8,"managed settings の PostToolUse フックが一部セッションで `updatedMCPToolOutput` を適用する","Fixed PostToolUse hooks in managed settings not applying `updatedMCPToolOutput` in some sessions","M","fix",1,"admin,mod-dev",0,[],"hooks"],[9,"headless セッションで、無効化したフォルダの `.mcp.json` や plugin MCP サーバーがディレクトリ変更・plugin 再読込後に起動しない","Fixed headless sessions starting a folder's `.mcp.json` or plugin MCP server that was switched off for that folder, after changing directory or reloading plugins","C","fix",2,"sdk",0,[],"mcp"],[10,"`allowedProviders` に `\"gateway\"` を配信する gateway が、ユーザー設定で同 gateway を指定したノート PC を締め出さない","Fixed a Claude apps gateway that serves `allowedProviders` with `\"gateway\"` locking out laptops that name that gateway in user settings","H","fix",2,"admin",0,[],"auth-login"],[11,"`forceLoginMethod` が `gateway` で `forceLoginGatewayUrl` 未設定のマシンでも保存済みサインインが使われる(2.1.295 のリグレッション)","Fixed a saved Claude apps gateway sign-in being ignored on machines whose managed settings set `forceLoginMethod` to `gateway` with no `forceLoginGatewayUrl` (regression in 2.1.295)","H","fix",2,"admin",0,[],"auth-login"],[12,"`--teleport` でセッション履歴を読めない場合に空の会話を開かない","Fixed `--teleport` opening an empty conversation when the session's history could not be read","S","fix",1,"cli",0,[],"sessions-resume"],[13,"Haiku 5.5 など adaptive thinking のみのモデルのトークン数が gateway 経由でも正しく数えられる","Fixed token counts for Haiku 5.5 and other models that take only adaptive thinking, which failed behind some gateways and were counted with budget thinking elsewhere","L","fix",1,"cli,sdk",0,[],"thinking-effort"],[14,"再開したサブエージェントに、セッション終了で中断されたツール呼び出しを「ユーザーが拒否した」と伝えない","Fixed resumed subagents being told that the user rejected a tool call that a session shutdown had interrupted","A","fix",1,"cli",0,[],"subagents"],[15,"plugin ヒントタグに似たテキストを含むフック出力が改変されない","Fixed hook output being altered when it contained text resembling a plugin hint tag","M","fix",1,"mod-dev",0,[],"hooks"],[16,"共有トランスクリプトとデバッグログで、値のないキーの後続値(シェル文字列内の JSON 含む)も秘匿される","Fixed secret redaction in shared transcripts and debug logs missing some values that follow a key with no value, including in JSON written inside a shell string","T","fix",2,"cli",0,[],"permissions"],[17,"MATE Terminal など古い VTE 系端末でコピー後に `52;c;…` が画面に出ない","Fixed a stray `52;c;…` escape sequence printed on screen after copying in older VTE-based terminals such as MATE Terminal","U","fix",1,"cli",0,[],"output-rendering"],[18,"`/diff` パネルやダイアログを開いている間もトースト・通知が見えないまま待たされない","Fixed toasts and notifications waiting unseen for as long as the `/diff` panel or dialog was open","U","fix",1,"cli",0,[],"output-rendering"],[19,"`UserPromptSubmit` フックや mod の `prompt.submit` フック中の Esc/中断で headless が終了したり未検査プロンプトが通らない","Fixed Esc or an interrupt during a `UserPromptSubmit` hook or a mod's `prompt.submit` hook ending headless sessions, clearing the typed prompt, or letting the unchecked prompt through","M","fix",2,"sdk,mod-dev",0,[],"hooks"],[20,"headless 開始後に読み込まれた plugin の SessionStart フックが、同名・別表記の plugin 実行済みでもスキップされない","Fixed SessionStart hooks of a plugin loaded after a headless session starts being skipped when a different plugin with the same name, or another spelling of it, had already run","M","fix",1,"sdk,mod-dev",0,[],"hooks"],[21,"`claude self-hosted-runner` の登録拒否時に、org 管理設定や新しい work order の要否を示すエラーを出す","Fixed `claude self-hosted-runner` printing misleading errors when registration is refused: it now names the org admin setting, or says a restarted on-demand runner needs a fresh work order","H","fix",1,"admin",0,[],"self-hosted-runner"],[22,"`--capacity` が 1 超の runner で、同一リポジトリの別セッション開始中も git fetch/pull/push が失敗しない","Fixed a self-hosted runner session's git fetch, pull and push failing while another session of the same repository starts on a runner with `--capacity` above 1","H","fix",1,"cloud",0,[],"self-hosted-runner"],[23,"workflow スクリプトが約 20,000 階層超の深いネストの結果や値を黙って切り捨てず、巨大な出力ファイルも書かない","Fixed workflow scripts silently truncating results, agent options and other values nested deeper than about 20,000 levels, and deeply nested results writing huge task output files","A","fix",1,"sdk",0,[],"workflow"],[24,"plugin が提供する `$` メソッドが呼び出し元エージェントの作業ディレクトリで動き、呼び出しフックのターンも尊重する","Fixed a plugin's served `$` methods running in the main session's working directory instead of the calling agent's, and ignoring the turn their calling hook holds","M","fix",1,"mod-dev",0,[],"plugins-mods"],[25,"再読込・削除後も動作中の mod フックからの `$.agent.register` が拒否される","Fixed `$.agent.register` succeeding from a mod's hook that was still running after the mod was reloaded or removed; the call is now refused","M","fix",1,"mod-dev",0,[],"plugins-mods"],[26,"mod の `$.http.fetch` が、Content-Length が 4 MiB 超でも `HEAD` リクエストを拒否しない","Fixed `$.http.fetch` in mods refusing a `HEAD` request when the response declares a `Content-Length` over the 4 MiB body limit","M","fix",1,"mod-dev",0,[],"plugins-mods"],[27,"`constructor` のような名前の marketplace で内部エラーにならず、`add` は明確に拒否する","Fixed `claude plugin marketplace add`, `marketplace update` and `plugin install` failing with an internal error for a marketplace named like `constructor`; `add` now refuses such names clearly","M","fix",1,"mod-dev",0,[],"plugins-mods"],[28,"`constructor` や `prototype` という名前の plugin シークレットが次回の保存で削除されない","Fixed a plugin secret named `constructor` or `prototype` being deleted by the next save of that plugin's options","M","fix",1,"mod-dev",0,[],"plugins-mods"],[29,"feature flag 未読込のクラウドセッションでも、保存済み許可がある Claude in Chrome 操作に auto mode のチェックが適用される","Fixed cloud sessions skipping auto mode's checks on Claude in Chrome actions that a saved permission allows when their feature flags had not loaded","T","fix",2,"cloud",0,[],"auto-mode"],[30,"`CLAUDE_CODE_RESUME_INTERRUPTED_TURN` が、MCP ツール結果で終了した完了済みターンを再起動後に再実行しない","Fixed `CLAUDE_CODE_RESUME_INTERRUPTED_TURN` re-running a finished turn after a restart when an MCP tool result had ended that turn","S","fix",1,"cli,sdk",0,[],"sessions-resume"],[31,"`BASH_ARGV0` を代入して使うコマンドを Bash 権限チェックが自動承認せず、承認を求める","Fixed Bash permission checks auto-approving some commands that assign the `BASH_ARGV0` shell variable and then use it; these now prompt for approval","T","fix",3,"cli",0,[],"permissions"],[32,"UTF-8 でないファイル(Windows-1252、Shift-JIS、GBK)への Edit/NotebookEdit で非 ASCII 文字を全置換せず、編集を拒否する","Fixed Edit and NotebookEdit replacing every non-ASCII character in files that are not valid UTF-8 (Windows-1252, Shift-JIS, GBK); such edits are now refused","T","fix",2,"cli",0,[],"read-edit-tools"],[33,"`←` 直後に送ったプロンプトが、バックグラウンドサービスの応答遅延時に二重実行されない","Fixed a prompt sent just after `←` being run twice, once unseen in the foreground, when the background service was slow to answer","A","fix",1,"cli",0,[],"background-tasks"],[34,"SessionStart フック中に送ったプロンプトが `←` でのバックグラウンド移行後も `↑` で戻せる","Fixed a prompt sent while SessionStart hooks were still running vanishing when `←` moved the session to the background; it is still not sent, but `↑` now brings it back","A","fix",1,"cli",0,[],"background-tasks"],[35,"headless で遅延読込 plugin の SessionStart フック出力が `/clear` 後の新会話に入らない","Fixed a late-loading plugin's SessionStart hook output reaching the new conversation after `/clear` in headless sessions","M","fix",1,"sdk",0,[],"hooks"],[36,"PowerShell コマンドが、フックが CLAUDE_ENV_FILE に書いた変数(単純代入のみ)を参照できる","Fixed PowerShell commands not seeing variables that hooks write to CLAUDE_ENV_FILE (when the file holds only plain assignments)","T","fix",1,"windows",0,[],"windows"],[37,"MCP サーバーに認証が必要なとき、クラウドセッションを非対話と呼んだり `/mcp`・`claude mcp` を勧めない","Fixed Claude calling cloud sessions non-interactive and suggesting `/mcp` or `claude mcp` when an MCP server needs authentication","C","fix",1,"cloud",0,[],"mcp"],[38,"クラウドセッション・Agent SDK・IDE で `/code-review` が生の JSON 配列でなく番号付きリストで結果を出す","Fixed `/code-review` ending on a raw JSON array in cloud sessions, the Agent SDK and IDE integrations; the findings now print as a numbered list","I","fix",2,"cloud,ide,sdk",0,[],"code-review"],[39,"auto mode が、自分の artifact の更新を共有設定が変わったと誤って拒否することがなくなった","Fixed auto mode occasionally refusing one update to your own artifact, saying its sharing had changed when it had not","T","fix",1,"cli",0,[],"auto-mode"],[40,"複数セッションが config ディレクトリを共有しても、claude.ai 同期の skills がインストール完了し毎回再取得されない","Fixed skills synced from claude.ai never finishing their install, and being downloaded again at every sync, when several sessions share a config directory","M","fix",1,"cli",0,[],"skills"],[41,"claude.ai 同期の plugin が、依存 marketplace も同期されている場合に無効化されない","Fixed a plugin synced from claude.ai being disabled when the marketplace dependency it declares was also synced from claude.ai","M","fix",1,"cli",0,[],"plugins-mods"],[42,"Linux からコピーした `/home` 配下の plugin パスで起きる macOS の起動ハングを解消","Fixed a startup hang on macOS when plugin paths copied from a Linux machine pointed under /home","O","fix",1,"macos",0,[],"macos"],[43,"Workflow ツールが CRLF 改行のスクリプトファイルを受け付ける","Fixed the Workflow tool refusing script files with CRLF line endings, such as files checked out on Windows","A","fix",1,"windows",0,[],"workflow"],[44,"`git commit -q` や `git -C \u003cdir\u003e commit` 後の OpenTelemetry `tool_result` イベントに `git_commit_id` が付く","Fixed OpenTelemetry `tool_result` events missing `git_commit_id` after `git commit -q` or `git -C \u003cdir\u003e commit`","H","fix",1,"admin",0,[],"telemetry"],[45,"`CLAUDE_CODE_TRANSCRIPT_LOCAL_GC` が U+2028/U+2029 を含むメッセージを保存済みトランスクリプトから落とさない","Fixed `CLAUDE_CODE_TRANSCRIPT_LOCAL_GC` dropping a message from the saved transcript when its text held a Unicode line or paragraph separator (U+2028, U+2029)","S","fix",1,"cli",0,[],"sessions-resume"],[46,"`claude purge` が U+2028/U+2029 を含むプロンプトも履歴ファイルから削除する","Fixed `claude purge` leaving a prompt in the history file when its text held a Unicode line or paragraph separator (U+2028, U+2029)","S","fix",1,"cli",0,[],"sessions-resume"],[47,"約 1 KB 超の PowerShell コマンドが常に確認になる問題を解消し、allow ルールと読み取り専用判定が 32 KB まで効く","Windows: Fixed PowerShell commands longer than about 1 KB always asking for permission, so allow rules and read-only detection now apply up to 32 KB","T","fix",2,"windows",0,[],"permissions"],[48,"stdio MCP サーバーを終了時に強制終了せず、stdin を先に閉じ 300 ms 後も動作中ならプロセスツリーを終了","Windows: Fixed stdio MCP servers being force-killed at shutdown; stdin now closes first and the process tree is killed only if the server is still running after 300 ms","C","fix",1,"windows",0,[],"mcp"],[49,"GitHub SSH キーがない環境でも GitHub `owner/repo` の `claude plugin install` が HTTPS 再試行で成功","Windows: Fixed `claude plugin install` failing for GitHub `owner/repo` plugin sources on machines with no GitHub SSH key; the clone is now retried over HTTPS","M","fix",1,"windows",0,[],"plugins-mods"],[50,"Git Bash の `rm -rf /c/Users/\u003cname\u003e` が bypass permissions モードでも確認される","Windows: Fixed `rm -rf /c/Users/\u003cname\u003e` in Git Bash not asking in bypass permissions mode","T","fix",2,"windows",0,[],"permissions"],[51,"フルスクリーンモードで、マウス下のリンクに下線を付けて開けることを示す","Improved fullscreen mode: the link under the mouse pointer is now underlined to show it can be opened","U","improve",1,"cli",0,[],"output-rendering"],[52,"シンタックスハイライト済みコードブロックをキャッシュし、コード量の多い会話で ctrl+o の切替が速くなる","Improved transcript toggle (ctrl+o) responsiveness in code-heavy conversations by caching syntax-highlighted code blocks","U","improve",1,"cli",0,[],"performance"],[53,"gateway 配下の Desktop の Code タブで、セッションを開始できない理由を返信として表示する","Improved Claude Desktop's Code tab behind a Claude apps gateway: when a session can't start, including on a machine not set up for the gateway's `code` settings, the reason shows as a reply","I","improve",1,"ide,admin",0,[],"desktop"],[54,"拒否されたクラウドセッションのエラーで、組織ポリシーを読めなかった理由や claude.ai ログインを上書きする API キー・トークンを示す","Improved the errors for a refused cloud session: they now say why your organization's policy couldn't be loaded, and name an API key or auth token that overrides your claude.ai login","I","improve",1,"cloud",0,[],"web-cloud-sessions"],[55,"`--debug` でカスタムエージェントファイルの未知の frontmatter フィールドを示し、typo の可能性もヒント表示","Improved `--debug` output to name unrecognized frontmatter fields in custom agent files, with a hint for likely typos","M","improve",1,"mod-dev",0,[],"subagents"],[56,"auto mode の判定が答えを出せず実行されなかった呼び出しを、赤いエラーでなく薄い「Not run」行で表示","Improved auto mode: a tool call that wasn't run because auto mode's check had no usable answer now shows as a dim \"Not run\" row instead of a red error","T","improve",1,"cli",0,[],"auto-mode"],[57,"`--debug` でフック終了時にコマンド・plugin・結果・所要時間をログし、遅いフックを特定できる","Improved `--debug` output for hooks: command hooks on tool calls, prompts, SessionStart and Stop now log their command, plugin, outcome and duration when they finish, so a slow hook is identifiable","M","improve",1,"mod-dev",0,[],"hooks"],[58,"`CLAUDE_CODE_TRANSCRIPT_LOCAL_GC` が、解放量が 10% 未満なら大きなトランスクリプトを書き換えない","Improved `CLAUDE_CODE_TRANSCRIPT_LOCAL_GC`: a large transcript file is no longer rewritten when that would free under 10% of it","S","improve",1,"cli",0,[],"sessions-resume"],[59,"`/cost`・ステータスライン・`--max-budget-usd`・SDK のコストで Sonnet 5.5 のキャッシュ読み取りを $0.10/百万トークンに変更(従来 $0.20)","Updated `/cost`, the status line, `--max-budget-usd` and the SDK's cost figures to price Sonnet 5.5 cache reads at $0.10 per million tokens (was $0.20)","L","change",1,"cli,sdk",0,[],"model-selection"],[60,"同梱 dataviz skill の配色と軸ラベルを調整(7 番目の系列の紫、ダークモードの文字色、`1K` 形式の y 軸)","Updated the bundled dataviz skill: lighter violet for the seventh series in light mode, softer primary text in dark mode, and compact y-axis labels like 1K","M","change",1,"cli",0,[],"skills"],[61,"MCP ツール説明と MCP サーバー instructions の先行送信の既定上限を 2,048 から 4,096 文字に変更","Changed the default limit on MCP tool descriptions sent up front and on MCP server instructions from 2,048 to 4,096 characters","C","change",2,"cli,admin",0,[],"mcp"],[62,"`←` でバックグラウンド移行中に始まったターンや `!` コマンドは、見えない所で完了せず停止される","Changed `←`: a turn or `!` command started while the session moves to the background is now stopped instead of finishing out of sight","A","change",2,"cli",0,[],"background-tasks"],[63,"`claudeCode.spinnerVerbs` が拡張の設定スキーマに入り補完・検証され、不正値でもチャットパネルが壊れない","[VSCode] Fixed `claudeCode.spinnerVerbs` missing from the extension's settings, so settings.json now completes and validates it; a malformed value no longer breaks the chat panel","I","fix",1,"ide",0,[],"vscode"],[64,"Claude in Chrome が `@browser` 接続を含む全セッションでブラウザ操作前に確認する(ターミナルと同じ)","[VSCode] Changed Claude in Chrome to ask before browser actions in every session, including one connected with `@browser`, as the terminal does; allowing a site for the session stops repeat asks","I","change",2,"ide",0,[],"vscode"],[65,"チャット内の Windows フルパスやの `file:///C:/...` リンクでファイルが開く","[VSCode] Fixed chat links written as a full Windows path, such as C:\\repo\\file.ts or file:///C:/repo/file.ts, not opening the file on Windows","I","fix",1,"ide,windows",0,[],"vscode"],[66,"OS・VS Code・`prefersReducedMotion` で低モーションを有効にすると作業中インジケーターが動かない","[VSCode] Fixed the working indicator still animating when reduced motion is turned on in your OS, in VS Code, or with the `prefersReducedMotion` setting","I","fix",1,"ide",0,[],"vscode"],[67,"表示オフや remote window 再接続後にパネルが遅れて追いついても、プロンプトキャッシュ時計が warm と誤表示されない","[VSCode] Fixed the prompt cache clock reading warm after the panel caught up on messages late, such as after the display was off or a remote window reconnected","I","fix",1,"ide",0,[],"vscode"],[68,"self-hosted 環境の Activity タブの Sessions と Runners 一覧にステータスフィルターを追加(複数選択可)","[Cloud sessions] Added a status filter to the Sessions and Runners lists on a self-hosted environment's Activity tab in admin settings; you can pick several statuses at once","I","new",1,"cloud,admin",0,[],"web-cloud-sessions"],[69,"self-hosted runner 待ちのクラウドセッションが、それぞれ前にいるセッション数に応じたキュー順位を表示する","[Cloud sessions] Fixed every cloud session waiting for a self-hosted runner showing the same queue position; each now shows how many sessions are ahead of it","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[70,"Claude 返信中に送ったメッセージが、完了後も(再読込後も)その返信の下に留まる","[Cloud sessions] Fixed a message you send while Claude is still replying in a cloud session jumping above that reply when it finishes; it now stays below it, including after a reload","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[71,"Slack の Claude は、リンク・モデル・コストのフッターをスレッドの最新返信にだけ表示する","[Claude Tag] Changed Claude in Slack to show the footer with the session link, model and cost only on its newest reply in a thread; the reply before it drops the footer","I","change",1,"cloud",0,[],"claude-tag"],[72,"括弧を含む URL へのリンクが Slack の返信やタスクチェックリストで崩れず正しいページを開く","[Claude Tag] Fixed links to URLs that contain parentheses breaking in some of Claude's Slack replies and task checklists, which showed stray bracket text and opened the wrong page","I","fix",1,"cloud",0,[],"claude-tag"],[73,"6 桁の PR 番号のように 16 進カラーに見えるだけのコードに、Slack 返信で色見本を付けない","[Claude Tag] Fixed Claude's Slack replies drawing color swatches beside codes that only look like hex colors, such as six-digit pull request numbers","I","fix",1,"cloud",0,[],"claude-tag"],[74,"Activity ページの Memory タブで、Claude Tag Admin 権限のメンバーが workspace・channel のメモリファイルを作成・編集・削除できる","[Claude Tag] Added creating, editing and deleting workspace and channel memory files on the Activity page's Memory tab for members with the Claude Tag Admin permission","I","new",2,"cloud,admin",0,[],"claude-tag"],[75,"Slack の plugin 確認カードが plugin の ID でなく名前を表示する","[Claude Tag] Fixed the plugin confirmation card Claude posts in a Slack channel showing a plugin's ID instead of its name","I","fix",1,"cloud",0,[],"claude-tag"],[76,"チャンネル設定に無い plugin の削除カードを投稿せず、plugin の由来を説明する","[Claude Tag] Fixed Claude in Slack posting a card to remove a plugin the channel's own settings don't include; it now explains where the plugin comes from instead","I","fix",1,"cloud",0,[],"claude-tag"],[77,"self-hosted 環境のセッションが作業途中で別 runner に移っても Slack の返信が失われない","[Claude Tag] Fixed Claude in Slack sometimes losing its reply when a session in a self-hosted environment moved to a new runner partway through a task","I","fix",1,"cloud",0,[],"claude-tag"],[78,"Code Review のチェックが完了後も「in progress」のままにならず、レビュー結果を表示する","[Code Review] Fixed the Code Review check sometimes staying \"in progress\" on a pull request after the review finished; it now shows the review's result","I","fix",2,"cloud,admin",0,[],"code-review"],[79,"Code Review 管理設定で、保存できない理由(ポリシー制限など)を汎用エラーでなく具体的に示す","[Code Review] Improved Code Review admin settings to say why a setting couldn't be saved, such as a policy restriction, instead of a generic failure message","I","improve",1,"admin",0,[],"code-review"]]},{"v":"2.1.295","date":"2026-10-09（金）03:22","dshort":"10-09 03:22","nb":4,"head":"Claude apps gateway強化とプラグイン・mod周りの修正が中心","sum":"v2.1.295はClaude apps gatewayの運用機能追加と、プラグイン・mod・バックグラウンド実行・MCP接続の修正が中心のリリースです。フック失敗時にブロックする`onFailure: \"block\"`が追加され、ターミナルの固まりやリクエスト失敗など日常操作に関わる不具合も多数直っています。一部の既定値や上限が変わるため、gateway管理者とMCP利用者は確認が必要です。","watch":[{"b":"`/model`の選択、`/fast`、`/output-style`などの設定保存がプラグインの`config.set`フックの確認を経るようになったため、フックを使う環境では動作を確認してください。","r":[65,99]},{"b":"Bedrock上のClaude apps gatewayのトークン数取得がAWSのCountTokens APIに切り替わるため、`bedrock:CountTokens`権限を付与してください。","r":[101]},{"b":"gatewayのバックグラウンド要求はHaiku 4.5を使うようになるため、コストやモデル提供状況を確認してください(未提供なら元のモデルに戻ります)。","r":[104]},{"b":"MCPツール説明の上限が16,384文字に拡大し、`ws` MCPサーバーは16 MiB超のメッセージで接続を閉じるため、大きな説明や通信量のあるサーバーは確認してください。","r":[112,124]},{"b":"claude.aiコネクタはMCPプロトコル2026-07-28を既定で交渉するため、従来の挙動が必要なら`MCP_PROTOCOL_NEGOTIATION=legacy`を設定してください。","r":[116]},{"b":"サブエージェントが`skills`から事前読み込みするスキルは最大32個になるため、それ以上を使う場合はSkillツール経由で呼び出してください。","r":[113]},{"b":"接続中のバックグラウンドセッションでCtrl+Cは保留中の`/loop`を止めなくなったため、止めるにはEscを使ってください。","r":[114]},{"b":"`claude agents`をバックグラウンドサービスごと停止すると、実行中セッションは約1分で止まるため、継続したい場合は再度起動してください。","r":[115]},{"b":"テレメトリ無効のインストールでもArtifactの権限確認が他と同じ5つの質問になり、定期ルーチンは承認なしで非公開Artifactを公開・更新するため、運用ポリシーを確認してください。","r":[120,121]},{"b":"セルフホステッドrunnerは`CCR_AUTO_MODE_ALLOW`などの3変数をセッション環境に渡さなくなるため、これらに依存する場合は別の手段に切り替えてください。","r":[129]}],"hl":[{"t":"フックのガードが素通りしなくなる","b":"command/HTTP hook に `onFailure: \"block\"` が追加され、起動失敗・タイムアウト・想定外の終了コードのときに処理を止められるようになりました。あわせて、mod のガード hook が入力を見ないまま通していた問題や、設定保存が `config.set` hook を経由していなかった問題が直りました。","r":[1,39,57,65,99]},{"t":"長い応答で端末が固まらない","b":"数万行の応答、数行ごとに深くなる引用、極端に長い行などのシンタックスハイライトで、端末が固まる問題が直りました。数万行の応答のときに ctrl+c が効かなかった問題も解消しています。","r":[56,67,91]},{"t":"gateway の upstream 制御が細かく","b":"Claude apps gateway の各 upstream に `models` リストと `timeouts.upstream_ttfb_ms` を設定できるようになりました。Bedrock 上では、トークン数の取得に CountTokens API を使うようになり、`bedrock:CountTokens` 権限が必要です。","r":[6,8,101,104,105]},{"t":"バックグラウンド実行の止め方が変更","b":"アタッチ中のバックグラウンドセッションでは、待機中の Ctrl+C が `/loop` を止めなくなり、2回押すとデタッチします。停止は Esc で行います。バックグラウンドサービスなしで `claude agents` を止めると、実行中のセッションは約1分で停止します。","r":[114,115,40,49,42]},{"t":"MCP 接続の既定値と上限が変わる","b":"フラグを取得しない環境では、claude.ai コネクタが MCP プロトコル 2026-07-28 を既定で交渉するようになり、`MCP_PROTOCOL_NEGOTIATION=legacy` で元に戻せます。WebSocket MCP では 16 MiB を超えるメッセージで接続を閉じ、headless/SDK のリモート MCP は障害後も再接続するようになりました。","r":[116,124,18,19]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"Bash・Read・Edit・Grepなどの組み込みツールの入力処理と権限判定が修正されました。`--tools`と`--restricted`が後から登録されるツールにも適用されます。","refs":[22,37,44,61,79,88,108,111,120,121]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"バックグラウンド実行とサブエージェントの修正が中心です。`←`によるバックグラウンド化、`/loop`、worktreeのgit情報、`FORCE_COLOR=3`の継承、`claude agents`終了時の挙動が直りました。","refs":[7,26,35,36,40,41,42,43,46,49,53,113,114,115]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"プラグインとmod関連が最多です。`$.ui.notify`や`Button`の子要素の追加、ホットリロードや`config.set`/`prompt.submit`フック周りの修正、Windowsのドライブレター大文字小文字の問題、SessionStartフックや`allowed-tools`の取りこぼしの修正が含まれます。","refs":[1,4,10,12,13,24,25,39,45,51,57,58,59,62,63,64,65,68,70,71,72,73,75,78,80,81,83,84,87,94,99,107,109,110,118,122]},{"a":"S","name":"セッション・履歴・圧縮","dg":"rewindやresume後のセッション状態、スケジュールタスクの復元、一時ファイルの掃除が修正されました。","refs":[47,60,90,92,95]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCPの再接続、ページネーションの重複要求、誤った切断、`.bin`として保存されるファイル形式の問題が修正されました。ツール説明の上限、`ws`サーバーの上限、claude.aiコネクタの既定プロトコルが変わっています。","refs":[18,19,20,21,23,38,48,69,85,98,112,116,124]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VS Codeではファイル送信行の追加とフォーク/Rewindの失敗修正がありました。クラウドセッション、Claude Tag(Slack)、Code Reviewの修正も含まれます。","refs":[27,28,93,96,103,125,126,127,128,131,132,133,134,135,136,137,138,139,140,141,142]},{"a":"H","name":"headless・SDK・API","dg":"Claude apps gatewayの`models`リスト、`timeouts.upstream_ttfb_ms`、監査イベントの`upstream_request_id`、`forceLoginMethod: \"gateway\"`などの運用機能が追加されました。Bedrockのトークン数取得やリージョン外モデルの扱いも改善され、`CLAUDE_CODE_RETRY_WATCHDOG_MAX_WAIT_MS`も加わっています。","refs":[5,6,8,9,11,14,15,17,29,33,34,86,101,102,104,105,106,123,129,130]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"`/model`や`/advisor`の表示、tool searchの誤提供、`xhigh`/`max`での検索の遅さが直りました。","refs":[16,32,52,74,77,143]},{"a":"U","name":"UI・表示・入力","dg":"表示と入力の修正です。端末の固まり、リンク表示、タブ幅、CRLF、vimモードの`~`、貼り付け時のカーソル位置が直り、`/copy`では引用の`\u003e`を除いてコピーできます。","refs":[2,3,30,31,50,54,55,56,66,67,76,82,89,91,117,119]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"macOSでバックグラウンドセッションの実行場所と、ホームフォルダでセッションを始めたときに出る他アプリのデータアクセス確認が修正されました。","refs":[97,100]}],"skip":"表示の乱れ、まれな環境での失敗、状態の復元漏れなどの細かな修正が約90件あります。","st":"ok","stale":false,"e":[[1,"command/HTTP hook に `onFailure: \"block\"` を追加。起動失敗・タイムアウト・想定外の終了コード時に処理を通さず止める","Added `onFailure: \"block\"` for command and HTTP hooks: a hook that can't start, times out, or exits with an unexpected code blocks the action instead of letting it through","M","new",2,"mod-dev,admin",0,[],"hooks"],[2,"Program Status Protocol (OSC 7501) に対応し、対応端末で作業中・入力待ち・完了を表示できる","Added Program Status Protocol (OSC 7501) support: terminals that implement it can show whether Claude Code is working, waiting on you, or done","U","new",1,"cli",0,[],"output-rendering"],[3,"`/copy` のピッカーが引用テキストを扱い、下書きを `\u003e` マーカー無しでコピーできる","Added quoted text to the `/copy` picker, so a drafted message copies without its `\u003e` markers","U","improve",1,"cli",0,[],"slash-commands"],[4,"`claude plugin install`/`enable`/`disable`/`marketplace add` で、書き込み先の設定ファイルが読み込まれない場合に警告を表示","Added a warning to `claude plugin install`, `enable`, `disable` and `marketplace add` when the settings file they write to does not load","M","improve",1,"cli,mod-dev",0,[],"plugins-mods"],[5,"`claude -p` が最終ターン後も開いたままの時、端末なら stderr に待機内容を表示","Added a line on stderr, when it is a terminal, that says what a `claude -p` run is waiting for when it stays open after its last turn","H","improve",1,"sdk,cli",0,[],"headless-ci"],[6,"Claude apps gateway の Bedrock/Vertex/Foundry 等の upstream で `timeouts.upstream_ttfb_ms` に対応。超過時はフェイルオーバーか 502","Added support for `timeouts.upstream_ttfb_ms` on the Claude apps gateway's Bedrock, Vertex, Foundry and other cloud upstreams: a value you set now limits how long a stream may take to start there, after which it fails over or gets a 502","H","new",2,"admin,sdk",0,[],"bedrock-vertex"],[7,"`←` でツール完了待ち中にターンを止めると「Backgrounding cancelled」を表示","Added a \"Backgrounding cancelled\" message when you stop the turn while `←` is waiting for the current tool to finish","A","new",1,"cli",0,[],"background-tasks"],[8,"Claude apps gateway の各 upstream に任意の `models` リストを追加。フェイルオーバー時も対象モデルのみ送り、`*` をワイルドカードにできる","Added an optional `models` list to every Claude apps gateway upstream: only the listed models are sent there, on failover too, and one `*` in an entry is a wildcard","H","new",2,"admin",0,[],"bedrock-vertex"],[9,"managed settings が無い環境でも、ユーザー設定の `forceLoginMethod: \"gateway\"` と `forceLoginGatewayUrl` に対応し `/login` が gateway で開く","Added support for `forceLoginMethod: \"gateway\"` and `forceLoginGatewayUrl` in your own user settings on machines with no managed settings, so `/login` opens on that Claude apps gateway","H","new",2,"admin,cli",0,[],"auth-login"],[10,"`claude plugin validate` が README にインストール行が無い場合に貼り付け用の行を助言として表示。終了コードは変えない","Added advice to `claude plugin validate` when a plugin's README has no install line: it prints the line to paste and never changes the exit code, even with `--strict`","M","new",1,"mod-dev",0,[],"plugins-mods"],[11,"gateway の `inference` 監査イベントに `upstream_request_id` を追加。サポート問い合わせ用","Added `upstream_request_id` to the Claude apps gateway's `inference` audit event: the request ID from Amazon Bedrock, the Anthropic API or another upstream, for support cases","H","new",1,"admin",0,[],"telemetry"],[12,"mod 向けに `$.ui.notify` を追加。ユーザーの通知設定でネイティブ通知を出し、送信チャネルも示す","Added `$.ui.notify` for mods: raises a native notification through your own notification setting and says which channel sent it","M","new",2,"mod-dev",0,[],"plugins-mods"],[13,"mod の `Button` に文字列と `Text` の子要素を追加。チップや薄い詳細を含む押せる行が作れる","Added children to a mod's `Button`: strings and `Text`, so a row of a list is one pressable with a chip or a dim detail inside","M","new",1,"mod-dev",0,[],"plugins-mods"],[14,"`CLAUDE_CODE_RETRY_WATCHDOG_MAX_WAIT_MS` を追加し、無人リトライモードが 429/529 を待つ時間を制限","Added `CLAUDE_CODE_RETRY_WATCHDOG_MAX_WAIT_MS` to limit how long unattended retry mode (`CLAUDE_CODE_RETRY_WATCHDOG`) waits out 429 and 529 errors","H","new",1,"sdk",0,[],"headless-ci"],[15,"gateway の成功した推論応答に `request-id` ヘッダーを追加し、テレメトリの `request_id` と監査ログが一致","Added a `request-id` header to the Claude apps gateway's successful inference responses, so `request_id` in Claude Code telemetry matches the gateway's audit log","H","new",1,"admin",0,[],"telemetry"],[16,"gateway/Bedrock/Vertex/Foundry が context-1m beta を拒否しても、`[1m]` モデルが beta 無しで再送して動く","Fixed every request failing on a `[1m]` model when a gateway, Bedrock, Vertex or Foundry refuses the context-1m beta; Claude Code now resends without it","L","fix",2,"cli,sdk",0,[],"model-selection"],[17,"`claude -p` のテキスト出力が、バックグラウンド処理で別ターンが始まっても各ターン終了時に応答を出力","Fixed `claude -p` text output dropping earlier responses when background work started another turn; each turn's response now prints when the turn ends","H","fix",2,"sdk",0,[],"headless-ci"],[18,"headless/SDK のリモート MCP が15秒超の障害後も再接続し、切断を繰り返す相手にも最大30秒のバックオフをかける","Fixed remote MCP servers in headless and SDK sessions staying disconnected after an outage longer than 15 seconds, or reconnecting in a tight loop to a server that drops each connection right after it connects; repeated drops now back off, up to 30s","C","fix",2,"sdk",0,[],"mcp"],[19,"サーバーのエラー応答にネットワークエラー名が含まれても、リモート MCP 接続が切れない","Fixed remote MCP connections being dropped when a server's error reply happened to contain a network error name","C","fix",1,"cli",0,[],"mcp"],[20,"ページネーションカーソルを繰り返す MCP サーバーに、接続ごとに同じページを最大20回要求しない","Fixed MCP servers that repeat a pagination cursor being asked for the same page up to 20 times at every connect","C","fix",1,"cli",0,[],"mcp"],[21,"MCP ツールが返す CSS/JavaScript/XML が .bin でなく正しい拡張子で保存され、フォント・アイコンも専用拡張子になる","Fixed CSS, JavaScript and XML files returned by MCP tools being saved as .bin, which the Read tool refuses; font and icon files now get their own extension too","C","fix",1,"cli",0,[],"mcp"],[22,"モデルが `description` の代わりに `command_description` を渡しても Bash ツール呼び出しが成功する","Fixed Bash tool calls failing when the model passes `command_description` instead of `description`","T","fix",1,"cli",0,[],"bash-tool"],[23,"Claude in Chrome で `host:80` 形式のサイト deny ルールが、そのホストの `http://` ページにも適用される","Fixed Claude in Chrome not applying a site deny rule written with port 80 (`host:80`) to plain `http://` pages on that host","C","fix",2,"cli,admin",0,[],"chrome-extension"],[24,"`/plugin` の Errors タブが、読み込み失敗の marketplace とそのプラグインを確認なしに Enter で削除しない","Fixed `/plugin`'s Errors tab removing a marketplace that failed to load, and uninstalling its plugins, on Enter without asking first","M","fix",2,"cli,mod-dev",0,[],"plugins-mods"],[25,"プラグインをインストールできない名前の marketplace を `claude plugin marketplace add` で追加すると拒否される","Fixed `claude plugin marketplace add` reporting success for a marketplace whose name no plugin can be installed under; such an add is now refused","M","fix",1,"mod-dev",0,[],"plugins-mods"],[26,"`CLAUDE_AUTO_BACKGROUND_TASKS` が、編集やシェルコマンドが待っている間にサブエージェントをバックグラウンド化しない","Fixed `CLAUDE_AUTO_BACKGROUND_TASKS` moving a subagent to the background while an edit or shell command waited behind it, which started that call before the subagent finished","A","fix",1,"cli",0,[],"subagents"],[27,"`claude remote-control` セッションで、PushNotification が誤って「送信されなかった」と報告しない","Fixed PushNotification saying a push was not sent in `claude remote-control` sessions right after a phone message, without the `/config` toggle, or when started from inside Claude Code","I","fix",1,"cloud",0,[],"remote-control"],[28,"リモートセッションから一度に256件超のファイルを送っても「could not be vouched for」で拒否されない","Fixed files sent from remote sessions being refused as \"could not be vouched for\" when more than 256 were sent at once","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[29,"ログイン更新直後に起動時の managed settings 読み込みがまれに失敗する問題を解消","Fixed a rare failure to load managed settings at startup right after a login refresh","H","fix",1,"admin",0,[],"managed-settings"],[30,"`/tui` が再起動できない場合に、無言や生のシステムエラーでなくメッセージ付きで終了","Fixed `/tui` exiting without a message, or with a raw system error, when Claude Code could not be started again","U","fix",1,"cli",0,[],"slash-commands"],[31,"返信が残した色や conceal スタイルでも、テキスト表示のリンク先が隠れず表示される（表や質問プレビューの折り返し含む）","Fixed a link address shown as text being hidden by a colour or conceal style a reply left on, including where it wraps in a table or a question preview","U","fix",1,"cli",0,[],"output-rendering"],[32,"gateway ログインのセッションで `availableModels` の Fable モデルが `/model` ピッカーに出る","Fixed Fable models listed in `availableModels` not appearing in the `/model` picker for sessions signed in to a Claude apps gateway; such a model now shows its built-in row in place of a `modelPicker` row added for the same model","L","fix",1,"admin",0,[],"model-selection"],[33,"gateway の管理者向け利用額ビューが、セッションがグループを持たなくなった後に古いグループと上限を表示しない","Fixed the Claude apps gateway's admin spend view showing a developer's old groups and group cap after their session stopped carrying groups","H","fix",1,"admin",0,[],"managed-settings"],[34,"`CLAUDE_CODE_DISABL

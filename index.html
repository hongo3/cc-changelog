ない","Fixed workflow scripts asking for permission or being refused when read, edited or re-run after a Bash `cd` in the same session","T","fix",2,"cli",0,[],"permissions"],[33,"ダーク ANSI テーマと 16 色端末で淡色テキストを調整（塗り箱内は淡色、選択・検索ハイライトでは非淡色、一覧説明は他の補助テキストと同様）","Fixed dim text on the dark ANSI theme and 16-color terminals: faint inside filled boxes, not faint under selection and search highlights, and list descriptions dimmed like other secondary text","U","fix",1,"cli",0,[],"output-rendering"],[34,"新しい Claude Code プロセスの最初の応答前でも、mod の `$.model.fork` が `nothing-to-fork` を返さない（`claude -p` や cloud sessions）","Fixed a mod's `$.model.fork` returning `nothing-to-fork` when called before the first response of a new Claude Code process had finished, as in `claude -p` runs and cloud sessions","M","fix",1,"mod-dev,sdk,cloud",0,[],"plugins-mods"],[35,"fullscreen mode で `/compact` や自動圧縮の際、表示中の transcript 再構築で UI が一時停止しない","Fullscreen mode: Fixed `/compact` and auto-compact briefly freezing the UI while the visible transcript is rebuilt","U","fix",1,"cli",0,[],"fullscreen-mode"],[36,"managed settings が MCP サーバーを制限していても、Slack 起動のセッションがリポジトリを見つけて接続できる（ツールを止めるには `deniedMcpServers`）","Self-hosted runner: Fixed sessions started from Slack being unable to find or attach a repository when managed settings restrict MCP servers; use `deniedMcpServers` to keep those tools off","H","fix",1,"admin,cloud",0,[],"self-hosted-runner"],[37,"無関係なセットアップ失敗が git の missing-ref 文言を含んでも、ソースブランチ削除済みと誤判定されず再試行される","Self-hosted runner: Fixed sessions being reported as having a deleted source branch, and not retried, when an unrelated setup or session failure quoted git's missing-ref wording","H","fix",1,"admin",0,[],"self-hosted-runner"],[38,"終了中のセッションで、失敗・拒否されたセッション解放の再試行をログが誤って告知せず、繰り返し失敗は回数表示になる","Self-hosted runner: Fixed the log promising a retry of a failed or declined session release for a session that is ending; repeated failures now show a count","H","fix",1,"admin",0,[],"self-hosted-runner"],[39,"停止した PowerShell のバックグラウンドコマンドの出力ファイルに、終端の `[killed]` 行が書かれる","Windows: Fixed stopped background PowerShell commands missing the closing `[killed]` line in their output file","O","fix",1,"windows",0,[],"background-tasks"],[40,"コンテキストの小さいモデルへ切り替えるとき、長すぎる会話は先に前のモデルで要約される","Improved switching to a model with a smaller context window: a conversation too long for the new model is now summarized by the previous model first","L","improve",2,"cli",0,[],"compaction-context"],[41,"長時間動くサブエージェントの進捗表示が全体の再処理ではなく差分更新になり、描画が速くなる","Improved rendering performance while a long-running subagent works: its progress trail now updates incrementally instead of being reprocessed in full on every render","A","improve",1,"cli",0,[],"performance"],[42,"Claude が書く artifact ページで sticky ヘッダー上の帯も塗られ、モバイルアプリでスクロール時に文字が透けない","Improved artifacts: pages Claude writes now paint the band above a sticky header, so scrolled text no longer shows there in the mobile apps","I","improve",1,"ide,cloud",0,[],"artifacts"],[43,"VS Code・デスクトップ・モバイルで、質問ダイアログ上のツリーが Markdown と最大 48 行に対応（ターミナルは平文 12 行のまま）","Improved mods: in VS Code and the desktop and mobile apps, a tree drawn above the question dialog can now hold Markdown and up to 48 rows; the terminal keeps 12 plain rows","M","improve",1,"mod-dev,ide",0,[],"plugins-mods"],[44,"mod hook の `.catch` は hook が例外を投げるかタイムアウトしたときだけ実行され、hook 自身の呼び出し下のイベントは `.catch` を呼ばず skip される","Changed a mod hook's `.catch` handler to run only when the hook throws or times out; events raised beneath the hook's own calls now skip that hook without asking its `.catch`","M","change",2,"mod-dev",1,[],"plugins-mods"],[45,"mod の `$.env.set` は、設定・解除後に `{}`、書き込まれない場合は理由付きの `{ deny }` で解決する","Changed a mod's `$.env.set` to resolve with `{}` once the variable is set or unset, or with `{ deny }` saying why when the write is not made","M","change",2,"mod-dev",1,[],"plugins-mods"],[46,"Claude の応答で LaTeX 数式（`$$`、複数行 `\\[ … \\]`、インライン `$…$` や `\\(…\\)`）を描画する","[VSCode] Added LaTeX math rendering in Claude's responses, including `$$` and multi-line `\\[ … \\]` blocks and inline `$…$` and `\\(…\\)` math","I","new",2,"ide",0,[],"vscode"],[47,"VS Code と JetBrains のパネルで、Pro・Max プランの使用量上限バナーに「Get more usage」リンクが出る","[VSCode] Added a \"Get more usage\" link to the usage-limit banner for Pro and Max plans in the VS Code and JetBrains panels","I","new",1,"ide",0,[],"vscode"],[48,"クラッシュやフリーズを起こす会話が、リロードのたびにパネルで再び開かれることがない","[VSCode] Fixed a conversation that crashes or freezes the panel being reopened on every reload","I","fix",2,"ide",0,[],"vscode"],[49,"長い thinking 中にチャットパネルが重くならない（更新のたびに全文を再解析しない）","[VSCode] Fixed the chat panel slowing down during long thinking: it no longer re-parses the whole thinking text on every update","I","fix",1,"ide",0,[],"vscode"],[50,"一部の language server の diagnostics が \"[object Object]\" ではなくルールコード（例: MD013）を表示する","[VSCode] Fixed diagnostics showing \"[object Object]\" instead of the rule code (e.g. MD013) for some language servers","I","fix",1,"ide",0,[],"vscode"],[51,"dictation が提供されない環境（claude.ai 以外のサインイン、リモートウィンドウ）で、ネイティブ音声モジュールを読み込まない","[VSCode] Fixed the native dictation audio module being loaded, to check microphone permission, where dictation is not offered (non-claude.ai sign-ins, remote windows)","I","fix",1,"ide",0,[],"vscode"]]},{"v":"2.1.300","date":"2026-10-14（水）23:27","dshort":"10-14 23:27","nb":6,"head":"mod拡張とエージェント・worktree周りの修正が中心","sum":"v2.1.300 は mod 向け API の追加と、バックグラウンドエージェント、セッション復元、`--worktree`、reftable リポジトリに関する修正が中心のリリースです。hooks の `updatedInput` 検証や終了時のバックグラウンドコマンド強制終了など、挙動が変わる点もあります。VS Code 拡張、Remote Control、Claude Tag、Code Review にも多数の修正があります。","watch":[{"b":"hooks の `updatedInput` は検証され、未知のキーは削除され、ツールが拒否する入力は呼び出しが拒否されるため、hooks の出力を確認してください。","r":[65]},{"b":"終了時にバックグラウンドコマンドが 1.5 秒後に強制終了されるため、終了後も続けたい処理は別の手段で実行してください。","r":[56]},{"b":"api.anthropic.com への大きなリクエストはテレメトリ無効でも gzip 圧縮されるため、不要なら `CLAUDE_CODE_GZIP_REQUEST_BODIES=0` を設定してください。","r":[59]},{"b":"`CLAUDE_CODE_PROVIDER_MANAGED_BY_HOST` のセッションは `SSL_CERT_FILE` などの CA バンドル・プロキシ・git 関連変数を設定から無視するため、必要な値はホスト側で設定してください。","r":[55]},{"b":"`claude remote-control` の `--sandbox` と `--no-sandbox` は削除されエラー終了するため、スクリプトから外し、設定の `sandbox.enabled` を使ってください。","r":[66]},{"b":"`claude gateway` は Claude Desktop が使えない `desktop:` ポリシーキーがあると、警告ではなくキー名を示して起動を止めるため、該当キーを除いてください。","r":[58]},{"b":"ローカル transcript に各 API リクエストの system prompt、tools、パラメータも記録されるため、共有前に内容を確認してください。","r":[62]},{"b":"Cowork クラウドセッションでは `PermissionRequest` hook の allow に含む `setMode` が無視されるため、モード変更は別の方法で行ってください。","r":[64]},{"b":"Claude Desktop の Code タブは、`forceLoginGatewayUrl` が Anthropic 運用のゲートウェイを指す場合に管理設定を適用し、そのゲートウェイは起動時に到達可能である必要があります。","r":[57]},{"b":"バックグラウンドセッションは引き継いだ workflow を、handoff ファイルからの実行ではなく Workflow ツールの承認経由で再開するため、承認操作が必要です。","r":[61]}],"hl":[{"t":"hook の updatedInput を検証","b":"PreToolUse と PermissionRequest hook が返す `updatedInput` は、Claude 自身の入力と同じ方法で検証されるようになりました。未知のキーは除去され、ツールが受け付けない入力は呼び出し自体が拒否されます。","r":[65,64]},{"t":"終了時にバックグラウンドを停止","b":"終了時、停止要求から 1.5 秒後も動いているバックグラウンドコマンドは強制終了されるようになりました。バックグラウンドコマンドが実行中のまま終了しても、SessionEnd hook が実行されるよう修正されています。","r":[56,11]},{"t":"--worktree 起動の修正","b":"`--worktree` 起動時に、コミット ID に似た名前の tag や branch があると誤ったコミットから始まる問題などを修正しました。reftable を使うリポジトリや bare リポジトリの worktree でも動くようになり、plugin の `WorktreeCreate`/`WorktreeRemove` hook も実行されます。","r":[29,30,33,24]},{"t":"セッション再開時の履歴欠落","b":"クラッシュで transcript の末尾行が欠けていると、再開後に最初に書いたエントリが失われる問題を修正しました。headless・Agent SDK セッションの再開時に、compaction の要約や保持メッセージが失われる問題も修正されています。","r":[22,37,40]},{"t":"claude remote-control の変更","b":"`claude remote-control` から効果のなかった `--sandbox`/`--no-sandbox` が削除され、指定するとエラーで終了するようになりました。一時的なサインインエラー後の接続更新の再試行と、複数セッション提供時の停止表示も修正されています。","r":[66,32,39]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"Cowork クラウドセッションでの Write/Edit/NotebookEdit の誤った成功報告が修正され、`/sandbox` の表記が変わり、`PermissionRequest` hook の `setMode` が無視されます。","refs":[45,63,64]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"バックグラウンドエージェントと `claude agents`、`/tasks` の表示や復帰に関する修正が多く、`claude daemon stop` の挙動も改善されました。終了時の強制終了が変わります。","refs":[13,14,15,16,17,41,43,44,54,56,61]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"mod 向けに `virtualText`、`$.ui.view({ agentId })`、`dir` prop、`prompt.change` hook が追加され、`agent.spawn` hook で workflow agent の `prompt` と `model` を書き換えられます。`prompt.submit` の書き換えが OpenTelemetry に反映されない問題や、agent hooks の `model` 無視も直っています。","refs":[1,3,4,7,8,11,24,26,27,28,35,52,60,65]},{"a":"S","name":"セッション・履歴・圧縮","dg":"セッション保存・復元、`--worktree`、`/branch`、`claude purge` の不具合が修正され、transcript に API リクエスト情報が記録されます。","refs":[10,22,23,29,30,31,33,37,40,62]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP ツールの入力スキーマ拒否時の 400 エラーと、compaction 後の MCP ツール通知の遅れが修正されました。`claude remote-control` の `--sandbox` 系フラグは削除されています。","refs":[36,38,51,66,79]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VS Code 拡張では `claudeCode.attachSelection` が追加され、fast mode、ドラッグ、履歴呼び出しなどが修正されました。Remote Control、クラウドセッション、Claude Tag（Slack Connect 対応など）、Code Review も更新されています。","refs":[9,20,32,34,39,48,49,57,67,68,69,70,71,72,73,74,75,76,77,78,81,82,83,84,85,86,87,88]},{"a":"H","name":"headless・SDK・API","dg":"OpenTelemetry に cache 書き込みの寿命別トークン数と GenAI 属性が加わり、reftable での `git_commit_id` 欠落も直りました。`forceLoginOrgUUID` で拒否された組織のトークンが残る問題も修正されています。","refs":[2,6,19,25,50,55,58,59]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"`/advisor` が Claude Platform on AWS で使えるようになり、自動ツール検索が会話の途中で無効になる問題が修正されました。","refs":[5,18,46,53]},{"a":"U","name":"UI・表示・入力","dg":"`--restricted` のヘルプ文、Artifact ツールの表示、dim テキストの見分けにくさ、クラウドセッションの / メニューの説明欠落が修正されました。","refs":[12,21,47,80]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"OS の証明書ストアだけで信頼される TLS 検査プロキシの背後で、feature flag が更新されない問題が修正されました。","refs":[42]}],"skip":"表示の乱れ、まれな環境での不具合、VS Code・Slack・Code Review の細かな修正が約 50 件あります。","st":"ok","stale":false,"e":[[1,"mod のプロンプト装飾に `virtualText` を追加。入力欄に表示され下書きや送信内容には入らない","Added `virtualText` to a mod's prompt decorations: text drawn in the prompt box that never enters the draft or the submitted prompt","M","new",1,"mod-dev",0,[],"plugins-mods"],[2,"OpenTelemetry `api_request` イベントにキャッシュ書き込みを寿命別に分けた `cache_creation_5m_tokens` と `cache_creation_1h_tokens` を追加","Added `cache_creation_5m_tokens` and `cache_creation_1h_tokens` to the OpenTelemetry `api_request` event, splitting cache writes by lifetime","H","new",1,"sdk,admin",0,[],"telemetry"],[3,"mod 向け `$.ui.view({ agentId })` でエージェントの transcript をメイン表示にでき、`$.ui.view({})` で戻る","Added `$.ui.view({ agentId })` for mods: shows an agent's transcript in the main view when you ask, and `$.ui.view({})` goes back","M","new",1,"mod-dev",0,[],"plugins-mods"],[4,"mod の `Text` に右から左の文字用 `dir` prop を追加。Windows と VS Code ターミナルで右寄せ表示","Added a `dir` prop on a mod's `Text` for right-to-left text: on Windows and in VS Code's terminal its rows read in that direction and sit flush right","M","new",1,"mod-dev,windows",0,[],"plugins-mods"],[5,"Claude Platform on AWS で `/advisor` を利用可能に。`CLAUDE_CODE_DISABLE_ADVISOR_TOOL=1` で無効化","Added `/advisor` on Claude Platform on AWS; no advisor runs until you pick one with `/advisor`, `advisorModel` or `--advisor`, and `CLAUDE_CODE_DISABLE_ADVISOR_TOOL=1` turns it off","L","new",1,"cli",0,[],"model-selection"],[6,"トレースの span に `gen_ai.provider.name` など OpenTelemetry GenAI semantic convention 属性を追加","Added OpenTelemetry GenAI semantic-convention attributes to trace spans, such as `gen_ai.provider.name`, `gen_ai.conversation.id`, `gen_ai.tool.name` and `error.type`","H","new",1,"sdk,admin",0,[],"telemetry"],[7,"`agent.spawn` mod hook でワークフローエージェントの `prompt` と `model` を書き換え可能に","Added support for rewriting a workflow agent's `prompt` and `model` in the `agent.spawn` mod hook, which could only refuse workflow agents before","M","new",1,"mod-dev",0,[],"hooks"],[8,"入力欄の文字が履歴呼び出し・クリア・undo・plugin 入力などで変わると `prompt.change` mod hook が発火","Added the `prompt.change` mod hook, raised when the prompt box's text changes without a typed edit: a recalled history entry, a clear, an undo, or a plugin's fill","M","new",1,"mod-dev",0,[],"hooks"],[9,"cloud session が、実際はセッション自身のネットワーク設定による遮断なのに組織ポリシーのせいと Claude に伝える問題を解消","Fixed cloud sessions telling Claude that an organization policy blocked a host when the session's own network settings did","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[10,"`/autocompact` で小さい auto-compact ウィンドウを選んでも高トークン使用量の警告が出ない","Fixed `/autocompact` warning about high token usage when you choose a smaller auto-compact window","S","fix",1,"cli",0,[],"compaction-context"],[11,"バックグラウンドコマンド実行中に終了しても SessionEnd hook が確実に実行される","Fixed SessionEnd hooks sometimes not running when you exit while a background command is still running","M","fix",2,"cli",0,[],"hooks"],[12,"`claude --help` の `--restricted` 説明から削除済みツールの名前を除去","Fixed `claude --help` naming a removed tool in its description of `--restricted`","U","fix",1,"cli",0,[],"slash-commands"],[13,"`claude agents` で一部の PR データが不完全でも他の PR の状態を更新する","Fixed `claude agents` not refreshing any pull request's status when the data for one of them came back incomplete","A","fix",1,"cli",0,[],"subagents"],[14,"cloud session のコンテナ交換後、一度再開済みのバックグラウンドエージェントを「再開不可で失われた」と Claude に伝えない","Fixed Claude being told a background agent was lost, not resumable, after a cloud session's container was replaced, when the agent had already been resumed once","A","fix",1,"cloud",0,[],"background-tasks"],[15,"メッセージを送ったサブエージェントが完了直後に `/tasks` から消えず、会話に戻れる","Fixed subagents you had typed messages to disappearing from `/tasks` shortly after finishing, leaving no way back to the conversation","A","fix",2,"cli",0,[],"subagents"],[16,"子エージェント表示中に完了した親エージェントが breadcrumb から外れず、子が最上位扱いにならない","Fixed a completed parent agent dropping off the breadcrumb (its child shown re-rooted at top level) while you were viewing the child","A","fix",1,"cli",0,[],"subagents"],[17,"agents ビューで入力が一括到着しても「up」「escape」などの単語をキー操作と誤認しない","Fixed the agents view taking a typed word such as \"up\", \"down\" or \"escape\" for that key when input arrived in a burst, which could move the peek mid-reply or clear a draft","A","fix",1,"cli",0,[],"subagents"],[18,"MCP サーバー再接続中などに自動ツール検索 (`ENABLE_TOOL_SEARCH=auto`) が会話途中で無効にならない","Fixed automatic tool search (`ENABLE_TOOL_SEARCH=auto`) turning off part-way through a conversation, for example while MCP servers reconnect after a resume","L","fix",2,"cli",0,[],"mcp"],[19,"`forceLoginOrgUUID` に拒否されたログインで、拒否された組織のトークンが残らず `/login` 後も有効にならない","Fixed a login refused by `forceLoginOrgUUID` leaving the refused organization's token stored, or live after `/login`","H","fix",2,"admin",0,[],"auth-login"],[20,"Claude Desktop と Remote Control の diff 表示が reftable リポジトリの cherry-pick・revert コンフリクトを検出","Fixed the diff view in Claude Desktop and Remote Control sessions not noticing a conflicted cherry-pick or revert in reftable repositories","I","fix",1,"ide,cloud",0,[],"desktop"],[21,"Artifact ツールの表示が入力到着中に `(unprintable path)` とならず、Bash 同様 \"Waiting…\" と \"Running…\" を表示","Fixed the Artifact tool's verbose and ctrl+o line reading `Artifact(\"(unprintable path)\")` while a call's input arrives; its row now shows \"Waiting…\" and \"Running…\" as Bash's does","U","fix",1,"cli",0,[],"artifacts"],[22,"クラッシュで transcript 末尾行が欠けても、再開後に最初に書いたエントリが失われない","Fixed the first transcript entry written after resuming a session being lost when a crash had cut the transcript's last line short","S","fix",2,"cli",0,[],"sessions-resume"],[23,"Unicode 行・段落区切り (U+2028/U+2029) を含んでも `/branch` がメッセージを落とさず `claude purge` がサブフォルダを飛ばさない","Fixed `/branch` dropping messages, and `claude purge` skipping subfolder projects, when they contain a Unicode line or paragraph separator (U+2028, U+2029)","S","fix",1,"cli",0,[],"sessions-resume"],[24,"`--worktree` 起動時にも plugin の `WorktreeCreate`/`WorktreeRemove` hook が実行される（`--tmux` は未対応）","Fixed plugin `WorktreeCreate` and `WorktreeRemove` hooks not running when Claude Code starts with `--worktree` (not yet with `--tmux`)","M","fix",1,"mod-dev",0,[],"hooks"],[25,"reftable ref storage のリポジトリで `git commit -q` 後も OpenTelemetry `tool_result` に `git_commit_id` が入る","Fixed OpenTelemetry `tool_result` events missing `git_commit_id` after `git commit -q` in repositories using reftable ref storage","H","fix",1,"sdk",0,[],"telemetry"],[26,"mod の `prompt.submit` hook が書き換え・破棄したプロンプトを OpenTelemetry や session title リクエストに入力のまま記録しない","Fixed a prompt that a mod's `prompt.submit` hook rewrote or dropped still being recorded as typed in the OpenTelemetry `user_prompt` event and interaction span, and in session title requests","M","fix",1,"mod-dev,sdk",0,[],"hooks"],[27,"mod ホットリロードに関する Claude 向けの注記が、ユーザー入力として transcript に表示されない","Fixed a note meant for Claude about mod hot-reloading appearing in the transcript as if you had typed it","M","fix",1,"mod-dev",0,[],"plugins-mods"],[28,"agent hook が `model` を尊重。`haiku` などのエイリアス解決、サブエージェントによる上書き防止、利用不可時は呼び出し側モデルへフォールバック","Fixed agent hooks ignoring their `model`: aliases like `haiku` now resolve, a subagent's model no longer overrides it, and an unavailable model falls back to the caller's instead of allowing the action","M","fix",2,"mod-dev,admin",0,[],"hooks"],[29,"`--worktree` で tag/branch 名がコミット ID に似ていても正しいコミットから開始し、初期 git status も新 worktree のブランチを示す","Fixed `--worktree` sessions sometimes starting from the wrong commit when a tag or branch was named like a commit ID, and their starting git status naming a branch other than the new worktree's","S","fix",2,"cli",0,[],"worktree"],[30,"git reftable ref storage で、ブランチが \".invalid\" と表示されず `--worktree` が worktree を再度開ける","Fixed the branch showing as \".invalid\" and `--worktree` failing to reopen a worktree in repositories using git's reftable ref storage","S","fix",2,"cli",0,[],"worktree"],[31,"Claude がセッション scratchpad のファイルを、ファイル名のみや相対パスでなくフルパスで示す","Fixed Claude naming files in the session scratchpad by a bare filename or relative path instead of their full path","S","fix",1,"cli",0,[],"memory"],[32,"`claude remote-control` が keychain ロックなど一時的なサインインエラー後も接続更新を再試行し、`claude /login` が必要なら警告","Fixed `claude remote-control` servers giving up on renewing their connection after a brief sign-in error, such as a locked keychain; they now retry, and warn when you need to run `claude /login`","I","fix",2,"cloud",0,[],"remote-control"],[33,"bare リポジトリの worktree で origin の既定ブランチを取得できなくても `--worktree` が動作し、フォールバック基点は現在のチェックアウトの HEAD","Fixed `--worktree` failing in a worktree of a bare repository when origin's default branch can't be fetched; the fallback base is now the current checkout's HEAD, not the main repository's","S","fix",1,"cli",0,[],"worktree"],[34,"VS Code・Cursor・Devin Desktop の統合ターミナル起動時、拡張確認のためエディタ CLI を二重起動せず一度だけ起動","Fixed starting Claude Code in a VS Code, Cursor or Devin Desktop integrated terminal launching the editor's command-line tool twice to check for the extension; it now launches it once","I","fix",1,"ide",0,[],"vscode"],[35,"`chat:newline` キーバインド (Ctrl+J など) で改行しても mod の `prompt.edit` hook が発火","Fixed a mod's `prompt.edit` hook not being raised for a newline entered with the `chat:newline` keybinding (Ctrl+J, or a rebound Enter)","M","fix",1,"mod-dev",0,[],"hooks"],[36,"API が MCP ツールの入力 schema を拒否して毎ターン 400 になる問題を解消。以後そのツールはパラメータなしで送信","Fixed a conversation failing on every turn with a 400 error when the API rejected an MCP tool's input schema; Claude Code now sends that tool without parameters for the rest of the conversation","C","fix",2,"cli",0,[],"mcp"],[37,"出力トークン上限で切れた応答の後の compaction でも、headless/SDK セッション再開時に保持メッセージが失われない（この版以降の compaction）","Fixed resuming a headless or Agent SDK session losing the recent messages a compaction had kept, when the compaction followed a reply cut at the output token limit (compactions from this version on)","S","fix",2,"sdk",0,[],"sessions-resume"],[38,"compaction 後に接続が完了した MCP サーバーのツールと instructions を、次のツール呼び出しを待たず Claude に伝える","Fixed Claude not being told about an MCP server's tools and instructions until its next tool call, when the server finished connecting after a compaction","C","fix",1,"cli",0,[],"mcp"],[39,"1台で複数セッションを提供する Remote Control が、実行中のセッションを停止扱いにしない","Fixed Remote Control sessions being marked stopped while still running, on a computer serving several sessions at once","I","fix",2,"cloud",0,[],"remote-control"],[40,"再試行や未完了の応答後の compaction でも、headless/SDK セッション再開時に要約が消えたり圧縮前履歴が戻ったりしない","Fixed resuming a headless or Agent SDK session losing its compaction summary or bringing back pre-compaction history, when the compaction followed a retried or unfinished reply in the same turn","S","fix",2,"sdk",0,[],"sessions-resume"],[41,"Claude がバックグラウンドコマンドの出力ファイルをポーリングしたり sleep したりしない","Fixed Claude polling a background command's output file or sleeping while it runs","A","fix",1,"cli",0,[],"background-tasks"],[42,"OS 証明書ストアのみで信頼される TLS 検査 proxy の背後でも feature flag と段階的ロールアウトが古くならない","Fixed feature flags and staged rollouts staying stale behind a TLS-inspecting proxy whose certificate is trusted only through the OS certificate store","O","fix",2,"cli,admin",0,[],"proxy-network"],[43,"`claude daemon stop --any` が停止を待ち、固まったサービスを強制終了。残る場合はその旨を表示し exit 1","Fixed `claude daemon stop --any` printing \"stopped\" while a stuck background service kept running: it now waits, force-kills the service, and says so with exit 1 if it is still there","A","fix",1,"cli",0,[],"daemon"],[44,"telemetry 無効時も `claude daemon stop` が出力し、セッションを実行中のまま残さない","Fixed `claude daemon stop` exiting with no output, and leaving sessions listed as running, when telemetry is turned off","A","fix",1,"cli",0,[],"daemon"],[45,"Cowork cloud session で自分のPC上のパスへの Write/Edit/NotebookEdit が、届かないのに成功と報告しない","Fixed Write, Edit and NotebookEdit in Cowork cloud sessions reporting success for a path on your own computer, where the file never arrived","T","fix",2,"cloud",0,[],"read-edit-tools"],[46,"履歴に一覧がない再開セッションで、読み込み済みの deferred tool を Claude が再検索しない","Fixed Claude searching for deferred tools already loaded earlier in the conversation when a session resumes a history that never listed them","L","fix",1,"cli",0,[],"mcp"],[47,"ダーク ANSI テーマや16色端末で、薄い補助テキストが通常テキストと同じ見た目にならない","Fixed secondary (dim) text looking the same as normal text under the dark ANSI theme and on 16-color terminals","U","fix",1,"cli",0,[],"output-rendering"],[48,"組織ポリシーを読めない cloud session が毎ターン5分ハングせず、すぐ終了して理由を表示","Fixed cloud sessions hanging 5 minutes per turn when the organization's policy can't be read; the turn now ends promptly and says why","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[49,"長い応答中の再起動後、cloud session が回答済みメッセージを再実行しない","Fixed a cloud session sometimes running an already answered message a second time after the session restarted during a long reply","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[50,"出力が読まれなくても runner と orchestrator が固まらない。ログは直近256 KiBを保持し破棄数を記録（Windows 除く）","Self-hosted runner: Fixed the runner and orchestrator freezing (no polls, `/healthz` or `SIGTERM` shutdown) while nobody reads their output; logs keep the latest 256 KiB and count drops (not on Windows)","H","fix",1,"sdk,admin",0,[],"self-hosted-runner"],[51,"Cowork cloud session の WebFetch が、直前に失敗したページは再取得せず Claude に失敗を伝える","Improved WebFetch in Cowork cloud sessions to tell Claude that a page failed moments ago instead of fetching it again","C","improve",1,"cloud",0,[],"web-fetch-search"],[52,"組み込み `plugin-authoring` skill の mod 共有で、ファイルを開く前にキーを走査し、プロジェクト外フォルダは確認する","Improved mod sharing in the built-in `plugin-authoring` skill: Claude scans a mod's files for keys before opening them, and asks before scanning a folder outside the project","M","improve",1,"mod-dev",0,[],"skills"],[53,"Claude 3 モデルへの @ 指定 PDF の注記を改善し、読まずに答えることを減らす","Improved the note Claude 3 models get about an @-mentioned PDF, so they less often answer without reading it","L","improve",1,"cli",0,[],"model-selection"],[54,"artifact 更新で、小さな変更は1回の呼び出しで適用して再公開し、大きな編集も1回の応答内で再公開","Improved artifact updates: Claude now applies a small change and republishes the artifact in one call, and makes larger edits and republishes within a single response","A","improve",1,"cli",0,[],"artifacts"] +(V.st!=='ok'?'<span class="badge warn">'+esc((D.text||{}).failed||'')+'</span>':V.stale?'<span class="badge warn">'+esc((D.text||{}).stale||'')+'</span>':'')+'</h2>');
if(V.head)h.push('<p class="headline">'+rich(V.head)+'</p>');
if(V.sum)h.push('<p class="summary">'+rich(V.sum)+'</p>');
if(V.watch.length)h.push('<div class="watch"><h3>注意（挙動・既定値・権限の変更）</h3><ul>'+V.watch.map(function(w){
return'<li>'+rich(w.b)+refs(w.r)+'</li>'}).join('')+'</ul></div>');
if(V.hl.length&&V.hl.some(function(x){return x.th}))h.push(hlBoxes(V));
else if(V.hl.length)h.push('<div class="hl"><h3>注目</h3><ul>'+V.hl.map(function(x){
return'<li>'+(x.t?'<b>'+rich(x.t)+'</b> ':'')+rich(x.b)+refs(x.r)+'</li>'}).join('')+'</ul></div>');
if(V.groups.length){var g=V.groups.map(function(G){var on=G.a===s.area;
var card='<div class="group'+(on?' on':'')+'" role="button" tabindex="0" data-area="'+esc(G.a)+'" aria-expanded="'+on+'"'
+(on?' aria-controls="gpanel"':'')+'><div class="gname">'+esc(G.name)+' <span class="count">'+G.refs.length+' 件</span>'
+'<span class="gtg">'+(on?'閉じる ▲':'項目を見る ▼')+'</span></div>'+(G.dg?'<div class="gdg">'+rich(G.dg)+'</div>':'')+'</div>';
if(!on)return card;var L=list(D,V,s,{area:G.a},'e-');
return card+'<div class="gpanel" id="gpanel"><p class="ghead">'+esc(G.name)+' の項目 '+L.n+' 件</p>'+L.html+'</div>'}).join('');
h.push('<h3>領域別まとめ <span class="meta">カードを押すとその領域の項目だけを表示</span></h3><div class="groups">'+g+'</div>')}
if(V.skip)h.push('<p class="skip">'+rich(V.skip)+'</p>');
if(!s.area){var A=list(D,V,s,{},'e-'),forced=(s.ft&&s.ft.length)||s.kind||s.imp>1||s.aud;
h.push('<details class="entries" id="allents"'+(ui.openAll||forced?' open':'')+'><summary>エントリ一覧（'
+(A.n===tot?'全 '+tot+' 件':A.n+' 件 / 全 '+tot+' 件')+'）</summary>'+A.html+'</details>')}
SECTIONS.forEach(function(f){h.push(f(D,V,esc)||'')});
return renderBar(D,s,ui)+'<article class="ver" data-v="'+esc(V.v)+'">'+h.join('')+'</article>'}
function renderSearch(D,s,max,ui){max=max||400;var out=[],tot=0,shown=0;
D.versions.forEach(function(V){var es=V.e.filter(function(e){return match(e,s,{cross:true})});if(!es.length)return;
tot+=es.length;if(shown>=max)return;var part=es.slice(0,max-shown);shown+=part.length;
out.push('<section class="xres" data-v="'+esc(V.v)+'"><h3><button type="button" class="vlink" data-go="'+esc(V.v)+'">v'+esc(V.v)
+'</button><span class="xh">'+esc(V.date||'')+' · '+es.length+' 件 / 全 '+V.e.length+' 件</span></h3><ol class="ent">'
+part.map(function(e){return entry(D,e,s,'s-'+V.v+'-')}).join('')+'</ol></section>')});
return renderBar(D,s,ui)+(tot>shown?'<p class="meta">先頭 '+shown+' 件を表示</p>':'')
+'<div id="xlist">'+(out.length?out.join(''):zero(D,s))+'</div>'}
function renderIndex(D,s){return'<ol>'+D.versions.map(function(V){var on=!cross(s)&&V.v===s.v;
return'<li'+(on?' class="on"':'')+'><a href="#v'+esc(V.v)+'" data-go="'+esc(V.v)+'"'+(on?' aria-current="true"':'')+'>'
+'<span class="iv">v'+esc(V.v)+'</span><span class="d">'+esc(V.dshort||'')+' · '+V.e.length+' 件'
+(V.nb?' <span class="badge brk">要対応 '+V.nb+'</span>':'')+'</span><span class="ih">'+rich(V.head||'')+'</span></a></li>'}).join('')+'</ol>'}
// パンくずの ✕ / 0 件案内のボタン: その条件だけ外す
function drop(s,k){if(k.indexOf('ft:')===0){var f=k.slice(3);s.ft=s.ft.filter(function(x){return x!==f})}
else if(k==='imp')s.imp=1;else if(k==='brk')s.brk=false;else if(k in s)s[k]='';return s}
function clearAll(s){s.area='';s.ft=[];s.q='';s.brk=false;s.kind='';s.imp=1;s.aud='';return s}
function toggleFt(s,f){var i=s.ft.indexOf(f);if(i>=0)s.ft.splice(i,1);else s.ft.push(f);return s}
return{esc:esc,rich:rich,parseHash:parseHash,buildHash:buildHash,cross:cross,findVer:findVer,normalize:normalize,
match:match,scope:scope,chips:chips,conds:conds,drop:drop,clearAll:clearAll,toggleFt:toggleFt,
renderBar:renderBar,renderVersion:renderVersion,addSection:function(f){SECTIONS.push(f)},renderSearch:renderSearch,renderIndex:renderIndex}})();

(function(){
var D=JSON.parse(document.getElementById('cc-data').textContent),$=function(x){return document.getElementById(x)};
var view=$('view'),idx=$('vindex'),vl=$('vlist'),cur=$('vcur'),q=$('f-q'),brk=$('f-brk'),kind=$('f-kind'),imp=$('f-imp'),
aud=$('f-aud'),en=$('f-en'),S,UI={openAll:false,moreFt:false},lastH=null,
wide=window.matchMedia?window.matchMedia('(min-width:960px)'):null;
function sync(){q.value=S.q;brk.checked=S.brk;kind.value=S.kind;imp.value=String(S.imp);aud.value=S.aud;en.checked=S.en}
function draw(){view.innerHTML=CC.cross(S)?CC.renderSearch(D,S,400,UI):CC.renderVersion(D,S,UI);idx.innerHTML=CC.renderIndex(D,S);
cur.textContent=CC.cross(S)?'全版横断':'v'+S.v;fold();barh()}
// 状態の確定: 範囲が変わって存在しなくなった機能タグの選択はここで外れる。離散操作は履歴に積む（戻る/進むで復元）
function commit(push){S=CC.normalize(D,S);lastH=CC.buildHash(S);var u='#'+lastH;
try{if(push&&location.hash!==u)history.pushState(null,'',u);else history.replaceState(null,'',u)}
catch(e){if(location.hash!==u){if(push)location.hash=lastH;else location.replace(u)}}draw()}
function read(){S=CC.normalize(D,CC.parseHash(location.hash));lastH=location.hash.slice(1);sync();draw()}
function barh(){var st=$('stick');document.documentElement.style.setProperty('--barh',(st?st.offsetHeight:0)+'px')}
// チップが 2 行を超えたら、選択中以外を後ろから畳んで「+N」にする
function fold(){var box=$('chips');if(!box)return;var more=box.querySelector('.more'),
cs=Array.prototype.slice.call(box.querySelectorAll('.chip:not(.more)'));cs.forEach(function(c){c.hidden=false});more.hidden=true;
function rows(){var t=[];cs.concat([more]).forEach(function(c){if(!c.hidden&&t.indexOf(c.offsetTop)<0)t.push(c.offsetTop)});return t.length}
if(rows()<=2)return;more.hidden=false;
if(UI.moreFt){more.textContent='折りたたむ';more.setAttribute('aria-expanded','true');return}
var k=0;more.textContent='+0';for(var i=cs.length-1;i>=0&&rows()>2;i--){if(cs[i].classList.contains('on'))continue;
cs[i].hidden=true;k++;more.textContent='+'+k}more.setAttribute('aria-expanded','false');
more.setAttribute('aria-label','残り '+k+' 個の機能タグを表示')}
function top(){var y=view.getBoundingClientRect().top+(window.scrollY||0)-8;if((window.scrollY||0)>y)window.scrollTo(0,Math.max(0,y))}
function toList(){var el=$('gpanel')||$('allents')||$('xlist');if(!el)return;var r=el.getBoundingClientRect(),
h=($('stick')||{offsetHeight:0}).offsetHeight;if(r.top<h||r.top>window.innerHeight-60)el.scrollIntoView({block:'start'})}
function go(v){S.v=v;S.area='';S.ft=[];S.q='';S.brk=false;UI.openAll=false;sync();commit(true);top();if(wide&&!wide.matches)vl.open=false}
function card(a){return view.querySelector('.group[data-area="'+a+'"]')}
function setArea(a){S.area=S.area===a?'':a;commit(true);var c=card(a);if(c)c.focus({preventScroll:true});
var p=$('gpanel');if(p){var r=p.getBoundingClientRect();if(r.top>window.innerHeight-80)p.scrollIntoView({block:'start'})}}
function showRef(n){var V=D.versions[CC.findVer(D,S.v)];if(!V)return;var e=null;
for(var i=0;i<V.e.length;i++)if(V.e[i][0]===n)e=V.e[i];if(!e)return;
S.kind='';S.imp=1;S.aud='';S.ft=[];S.area=e[3]&&V.groups.some(function(g){return g.a===e[3]})?e[3]:'';if(!S.area)UI.openAll=true;
sync();commit(true);var el=$('e-'+n);if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');
setTimeout(function(){el.classList.remove('flash')},1600)}}
function copyText(btn){var t=($(btn.dataset.src)||{}).textContent||'';
try{navigator.clipboard.writeText(t).then(function(){btn.textContent='コピー済'},function(){btn.textContent='コピー不可'})}
catch(e){btn.textContent='コピー不可'}}
function refocus(sel){var el=sel&&view.querySelector(sel);if(el)el.focus({preventScroll:true})}
document.addEventListener('click',function(ev){
var t=ev.target.closest('[data-go],[data-area],[data-act],[data-drop],[data-ft],a.ref,button.copy[data-src]');
if(!t||!view.contains(t)&&!idx.contains(t))return;if(t.matches('button.copy[data-src]')){copyText(t);return}
if(t.hasAttribute('data-go')){ev.preventDefault();go(t.getAttribute('data-go'));return}
if(t.hasAttribute('data-area')){setArea(t.getAttribute('data-area'));return}
if(t.hasAttribute('data-ft')){var f=t.getAttribute('data-ft');CC.toggleFt(S,f);commit(true);
refocus('.chip[data-ft="'+f+'"]');toList();return}
if(t.hasAttribute('data-drop')){CC.drop(S,t.getAttribute('data-drop'));sync();commit(true);refocus('.fx,.chip');return}
var act=t.getAttribute('data-act');
if(act==='clear-all'){CC.clearAll(S);sync();commit(true);return}
if(act==='more-ft'){UI.moreFt=!UI.moreFt;draw();refocus('.chip.more');return}
if(t.classList.contains('ref')){ev.preventDefault();showRef(+t.getAttribute('data-ref'))}});
document.addEventListener('keydown',function(ev){var t=ev.target;if(!t.classList||!t.classList.contains('group'))return;
if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();setArea(t.getAttribute('data-area'))}});
document.addEventListener('toggle',function(ev){if(ev.target.id==='allents')UI.openAll=ev.target.open},true);
q.addEventListener('input',function(){S.q=q.value.trim();commit(false)});
q.addEventListener('change',function(){S.q=q.value.trim();commit(true)});
brk.addEventListener('change',function(){S.brk=brk.checked;commit(true)});
kind.addEventListener('change',function(){S.kind=kind.value;commit(true)});
imp.addEventListener('change',function(){S.imp=+imp.value||1;commit(true)});
aud.addEventListener('change',function(){S.aud=aud.value;commit(true)});
en.addEventListener('change',function(){S.en=en.checked;commit(true)});
function onNav(){if(location.hash.slice(1)!==lastH)read()}
window.addEventListener('popstate',onNav);window.addEventListener('hashchange',onNav);
var rt=null;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){fold();barh()},120)});
if(wide){vl.open=wide.matches;var f=function(){vl.open=wide.matches};
if(wide.addEventListener)wide.addEventListener('change',f);else if(wide.addListener)wide.addListener(f)}
read()})();
</script></body></html>

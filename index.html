L_NO_VERIFY` under Anthropic-managed git: the runner's own git always verifies Anthropic's git route, and warning lines say what applies where","I","change",2,"admin,cloud",1,[],"self-hosted-runner"],[75,"2.1.282 での `claude-ai` 名の予約を取り消し、該当名の skills・commands・workflows・MCP の skills/prompts が再び読み込まれ、`Skill(claude-ai:*)` は通常の接頭辞ルールになる","Reverted the 2.1.282 reservation of the `claude-ai` name: skills, commands, workflows and MCP servers' skills and prompts so named load again, and `Skill(claude-ai:*)` rules are ordinary prefix rules","M","change",2,"cli,mod-dev",0,[],"skills"],[76,"自動切替が失敗して auto や bypass のまま動いても、権限モード表示が Default にならず、切替は成功するまで再試行される","[VSCode] Fixed the permission mode indicator showing Default while the session kept running in auto or bypass mode after an automatic switch out of it failed; the switch is now retried until it lands","I","fix",2,"ide",0,[],"vscode"],[77,"Web からテレポートしたセッションが、Claude の作業中に送ったメッセージを落とさない","[VSCode] Fixed a session teleported from the web dropping the messages sent while Claude was working","I","fix",1,"ide",0,[],"vscode"],[78,"古いバージョンが空のローカルコピーを保存していても、Web セッションがセッション一覧から隠れず、空のチャットも開かない","[VSCode] Fixed a Web session staying hidden from the session list, and an empty chat opening in its place, when an older version had saved an empty local copy of it","I","fix",1,"ide",0,[],"vscode"],[79,"再度開いたセッションが、自動継続などターン途中で受け取ったメッセージでターンを分割しない","[VSCode] Fixed a reopened session splitting a turn at a message Claude received mid-turn, such as an automatic continuation","I","fix",1,"ide",0,[],"vscode"],[80,"再読み込みしたセッションが、巻き戻したターンや compaction 前の行だけを表示しない","[VSCode] Fixed a reloaded session showing a rewound-away turn, or only the rows before a compaction","I","fix",1,"ide",0,[],"vscode"],[81,"狭いパネルでもフッターの agents pill のアイコンが中央に描かれ、状態ドットが端に寄らない","[VSCode] Fixed the footer's agents pill drawing its icon off-center, with the status dot against the edge, in narrow panels","I","fix",1,"ide",0,[],"vscode"],[82,"長いプロンプトに改行で終わる行を貼り付けても、チャット入力の文字がカーソルや選択範囲より下にずれない","[VSCode] Fixed the chat input showing its text slightly below the cursor and selection after pasting lines that end with a line break into a long prompt","I","fix",1,"ide",0,[],"vscode"],[83,"実行中のクラウドセッションにリポジトリを追加する際、GitHub アカウントが読めるが push できない private リポジトリは読み取り専用で接続される","[Cloud sessions] Improved adding a repository to a running cloud session: a private repository your GitHub account can read but not push to now attaches for reading","I","improve",1,"cloud",0,[],"web-cloud-sessions"],[84,"サーバー側再起動からの復旧後に、クラウドセッションが完了済みの手順（コメントや push の重複投稿など）をやり直さない","[Cloud sessions] Fixed cloud sessions occasionally redoing an already-finished step, such as posting a duplicate comment or push, after recovering from a server-side restart","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[85,"新しい routine のスケジュールは既定で毎時数分過ぎになり、ちょうど毎時だと数分遅れて始まりうる旨が表示される","[Cloud sessions] Changed new routine schedules to default to a few minutes past the hour, with a note that routines set exactly on the hour can start several minutes late","I","change",1,"cloud",0,[],"web-cloud-sessions"],[86,"管理設定「Channels Claude can search」で、Claude の Slack 検索を追加済みの公開チャンネルに限定できる（組織・workspace・チャンネル単位）","[Claude Tag] Added a \"Channels Claude can search\" admin setting that limits Claude's Slack search to public channels it has been added to, set per organization, workspace or channel","I","new",2,"admin,cloud",0,[],"claude-tag"],[87,"Claude アカウント接続後のページに Back to Slack ボタンが付き、開始元のスレッドへ戻れる","[Claude Tag] Added a Back to Slack button on the page shown after connecting your Claude account, returning you to the thread you started from","I","new",1,"cloud",0,[],"claude-tag"],[88,"attach rule 経由でアクセスバンドルを得ているチャンネルでも、configure ページにコネクタや plugin が表示される","[Claude Tag] Fixed a channel's configure page listing no connectors or plugins when the channel gets its access bundle through an attach rule; rule-attached bundles are now shown","I","fix",1,"admin,cloud",0,[],"claude-tag"],[89,"選択リポジトリが多数の GitHub App インストールでも、アクセスバンドルのリポジトリ検索が漏れない","[Claude Tag] Fixed access-bundle repository search missing repositories on GitHub App installs that are limited to a large list of selected repositories","I","fix",1,"admin,cloud",0,[],"claude-tag"],[90,"返信の途中で新しいメッセージに割り込まれても、Claude が同じ返信を二重に投稿しない","[Claude Tag] Fixed Claude occasionally posting the same reply twice when a new message interrupted it mid-reply","I","fix",1,"cloud",0,[],"claude-tag"],[91,"Slack Connect 共有などで channel ID が変わった古い private チャンネルでも、チャンネルの routine が動き続ける","[Claude Tag] Fixed channel routines that stopped running in older private channels whose Slack channel ID changed, for example after a Slack Connect share","I","fix",1,"cloud",0,[],"claude-tag"],[92,"\"Channel only\" のチャンネルで、非ゲストメンバー参加時に Slack の確認が遅くても会話が全て終了しない","[Claude Tag] Fixed conversations in a channel set to \"Channel only\" all ending when a non-guest member joined and Slack was slow to confirm their membership","I","fix",1,"cloud",0,[],"claude-tag"],[93,"GitHub が PR を返せなくても \"@claude review\" が無反応にならず、1 回再試行し、それでも失敗するとコメントで説明する","[Code Review] Fixed \"@claude review\" requests going silent when GitHub failed to return the pull request: the request is retried once, and a comment explains if it still fails","I","fix",2,"cloud",0,[],"code-review"],[94,"検証ゼロのまま時間制限で止まったレビューは incomplete 表示で課金されず、1 回再試行される","[Code Review] Fixed billing for a review that stopped at its time limit with nothing verified: it now shows as incomplete, isn't charged, and is retried once","I","fix",1,"cloud,admin",0,[],"code-review"]]},{"v":"2.1.282","date":"2026-09-25（金）00:56","dshort":"09-25 00:56","nb":7,"head":"セッション再開・thinking 保持の修正と管理設定の厳格化","sum":"v2.1.282 は、再開・継続セッションでの thinking 消失や API エラーの修正と、管理設定・テレメトリ・権限まわりの挙動変更が中心です。Claude Code の日常利用者に加え、managed settings を運用する管理者や Claude Tag・クラウドセッションの利用者に影響します。vim モードや描画の細かな修正も多数含まれます。","watch":[{"b":"直接 Anthropic API 接続でテレメトリが off の場合、auto mode が既定でサーバー側分類器を使うため、従来の挙動を保つなら `CLAUDE_CODE_AUTO_MODE_SERVER=0` を設定してください。","r":[58]},{"b":"管理設定または `--settings` で `allowUnsandboxedCommands: false` や管理側 `allowManagedDomainsOnly: true` を設定している場合、project/local の `sandbox.excludedCommands` は無視されるため、必要な除外は管理設定側に移してください。","r":[59]},{"b":"project/local 設定の `CLAUDE_CODE_ENABLE_TELEMETRY` や `OTEL_LOG_*` など、エクスポート有効化・エンドポイント指定・内容取得の変数は無視されるため、ユーザー設定や環境変数、管理設定へ移してください。","r":[60]},{"b":"Windows/WSL で管理ポリシー（HKLM、`managed-settings.json`）が存在するのに不正または読めない場合、HKCU と WSL の `/etc/claude-code` は適用されないため、ポリシーを修復してください。","r":[61]},{"b":"`Skill(anthropic-skills:*)` と `Skill(claude-ai:*)` の許可ルールは claude.ai から同期されたスキルだけが対象になるため、プラグイン等に使っていた場合はルールを見直してください。","r":[62]},{"b":"`anthropic-skills` や `claude-ai` 名前空間のスキルフォルダ、コマンドファイル、ワークフローコマンドは読み込まれなくなるため、別の名前に変更してください。","r":[63]},{"b":"`anthropic-skills` や `claude-ai` という名前の MCP サーバーはスキルとプロンプトを一覧しなくなる（ツールは動作）ため、一覧が必要なら MCP 設定でサーバー名を変更してください。","r":[64]}],"hl":[{"t":"復号不能な検索結果の 400 解消","b":"API が復号できない web search 結果が履歴に残る会話で、全リクエストが 400 で失敗する問題を修正しました。サードパティのゲートウェイ経由の履歴などが該当します。","r":[6]},{"t":"再開時の thinking 消失を修正","b":"`--continue`/`--resume` での再送形式の変化、即時スラッシュコマンド、`--tools` の変更による thinking の消失を修正しました。`redacted_thinking` のエラーは thinking を破棄して 1 回再試行します。","r":[7,8,9,10]},{"t":"管理設定の適用漏れを修正","b":"boolean のロックキーの型ミスや、入れ子の値 1 つの不正で管理設定が無視される問題を修正しました。`allowManagedPermissionRulesOnly` 下でスキルが `allowed-tools` で自己承認する問題も修正しています。","r":[20,21,22]},{"t":"テレメトリ変数と auto mode の変更","b":"プロジェクト設定とローカル設定では、テレメトリを有効化する OpenTelemetry 変数が無視されます。直接 Anthropic API 接続でテレメトリが off の場合、auto mode は既定でサーバー側分類器を使います。","r":[58,60,2]},{"t":"大規模セッションの再開が高速化","b":"非常に大きなセッション（未 compact のものを含む）の再開にかかる時間を短縮しました。","r":[51]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"権限と管理設定の修正が中心です。mid-pattern `:*` の Bash ルールが設定ファイルでも有効になり、承認済みコマンドの二重実行、シンボリックリンク経由の読み込み、ディスク容量不足時のエラー表示も修正されました。サンドボックス除外と auto mode の既定値は変更されています。","refs":[18,19,20,21,22,25,26,46,54,58,59,62]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"エージェントパネルのフッターが長いキーバインドで折り返す問題と、`/tasks` ダイアログのフッターで区切り文字が重複する問題を修正しました。","refs":[42,43]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"プラグイン削除時に保存済みオプションが誤って消える問題、`/install-github-app` の中断処理、`/skills` の検索入力を修正し、`/artifacts` の表示と操作性を改善しました。`claude-api` スキルは更新され、`anthropic-skills` と `claude-ai` 名前空間の扱いが変わりました。","refs":[35,36,37,38,39,40,44,55,56,57,63]},{"a":"S","name":"セッション・履歴・圧縮","dg":"再開・継続セッションで過去のメッセージが変形して再送される問題と、compaction が拒否された場合の失敗を修正しました。大規模セッションの再開は高速化され、Windows の EBADF エラー表示も改善されています。","refs":[7,9,11,51,52]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"managed 設定 `allowClaudeInChromeWithManagedMcp` を追加し、排他的な `managed-mcp.json` と `claude --chrome` を併用できるようにしました。また `anthropic-skills` / `claude-ai` 名の MCP サーバーはスキルとプロンプトを一覧しなくなりました。","refs":[3,64]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VS Code 拡張、クラウドセッション、Claude Tag（Slack）の修正と追加です。GitHub App の状態表示や別オーナーのリポジトリ添付が加わり、Claude Tag では Enterprise Grid まわりの不具合を多数修正しています。ゲートウェイの `store.readiness_grace_seconds` も追加されました。","refs":[13,16,34,53,67,68,69,70,71,72,73,74,75,76,77,78,79,80,81,82,83,84,85,86]},{"a":"H","name":"headless・SDK・API","dg":"API 関連の修正が中心です。復号できない web search 結果による 400 エラー、Bedrock のブロックメッセージの ID 表示、Vertex AI の未知モデルでの web search を直しました。`claude remote-control --debug` も使えるようになりました。","refs":[4,6,23,24]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"thinking の欠落やエラーに関する修正です。即時スラッシュコマンド使用時の thinking 消失、`redacted_thinking` エラー、`xhigh` effort の失敗、`/model` の Fable ID 指定時の挙動を直しています。","refs":[8,10,12,14]},{"a":"U","name":"UI・表示・入力","dg":"`maxProseWidth` 設定を追加し、`/feedback` 一覧にスクロールバーを付けました。貼り付けの行ごと送信、起動時の画面のちらつき、CJK・絵文字の描画崩れ、vim モードの操作不具合を多数修正しています。","refs":[1,5,27,28,29,30,31,32,33,41,45,47,48,49,50,65,66]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"テレメトリ変数の無視と起動時の通知を追加しました。複数ウィンドウでのログイン更新競合による待ちと、組織ポリシー取得の再試行漏れも修正しています。Windows/WSL の不正な管理ポリシーの扱いも変わりました。","refs":[2,15,17,60,61]}],"skip":"表示の乱れ、vim モードの操作、まれな環境でのエラー表示などの細かな修正が 30 件以上あります。","st":"ok","stale":false,"e":[[1,"`maxProseWidth` 設定で広い端末でも文章の幅を制限でき、表とコードは全幅のまま","Added a `maxProseWidth` setting that caps the width of Claude's prose in wide terminals while tables and code blocks keep the full width","U","new",1,"cli",0,[],"output-rendering"],[2,"プロジェクト設定内の無視・無効化されたテレメトリ変数を起動時通知、`/status`、`claude doctor` に表示","Added a startup notice, and `/status` and `claude doctor` entries, listing telemetry variables in a project's settings files that were ignored or that turned telemetry off","O","new",2,"cli,admin",0,[],"telemetry"],[3,"`allowClaudeInChromeWithManagedMcp` で排他的な `managed-mcp.json` と `claude --chrome` を併用可能にし、ブロック時のエラーにも名前を表示","Added the `allowClaudeInChromeWithManagedMcp` managed setting to let `claude --chrome` run alongside an exclusive `managed-mcp.json`; the error shown when Chrome is blocked now names it","C","new",2,"admin,cli",0,[],"chrome-extension"],[4,"Claude apps gateway に `store.readiness_grace_seconds` を追加し、DB フェイルオーバー中も `/readyz` を準備完了に保てる","Added `store.readiness_grace_seconds` to the Claude apps gateway so `/readyz` can stay ready through a short Postgres outage such as a database failover","H","new",1,"admin",0,[],"gateway"],[5,"フルスクリーンの `/feedback` 下書き一覧にスクロールバーを追加（マウスが一覧上にあるとき表示）","Added a scrollbar to the `/feedback` drafts list in fullscreen mode; it appears while the mouse is over the list","U","new",1,"cli",0,[],"slash-commands"],[6,"API が復号できない web 検索結果が履歴にあると全リクエストが 400 になる問題を解消","Fixed every request failing with a 400 error in conversations whose history holds web search results the API cannot decrypt (for example, from a turn answered through a third-party gateway)","H","fix",3,"cli,sdk",0,[],"web-fetch-search"],[7,"`--continue`/`--resume` で過去メッセージが変形して再送され、以前の推論が API に捨てられるケースを追加で解消","Fixed more cases of continued or resumed sessions (`--continue`, `--resume`) re-sending earlier messages in a changed form, which could make the API drop Claude's earlier reasoning","S","fix",2,"cli",0,[],"sessions-resume"],[8,"作業中に `/model`、`/rename`、`/artifacts` などの即時スラッシュコマンドを使っても以前の拡張思考が失われない","Fixed earlier extended thinking being dropped when `/model`, `/rename`, `/artifacts` or another immediate slash command was used while Claude was working","L","fix",2,"cli",0,[],"thinking-effort"],[9,"以前提供された組み込みツールを除く `--tools` で再開しても、以前の拡張思考が失われない","Fixed continued or resumed conversations losing earlier extended thinking when relaunched with a `--tools` list that leaves out a built-in tool offered earlier in the conversation","S","fix",2,"cli",0,[],"sessions-resume"],[10,"`redacted_thinking` の `data` 不正エラーで毎ターン失敗する問題を、思考ブロックを破棄して1回再試行することで解消","Fixed sessions failing on every turn with an \"Invalid `data` in `redacted_thinking` block\" API error; Claude Code now drops the conversation's thinking blocks and retries once","L","fix",2,"cli",0,[],"thinking-effort"],[11,"要約リクエストが拒否されて compaction が失敗する場合、フォールバックモデルで再試行する","Fixed compaction failing when the summarization request is refused; it now retries on a fallback model","S","fix",2,"cli",0,[],"compaction-context"],[12,"思考オフかつ effort が high 超のセッションで安全関連のモデル切替後に「Effort 'xhigh'…」エラーでターンが失敗する問題を解消","Fixed a failed turn (\"Effort 'xhigh' isn't available with thinking turned off\") after a safety-related model switch in sessions with thinking off and effort above high","L","fix",2,"cli",0,[],"thinking-effort"],[13,"Claude Desktop など SDK ホスト型で Fable の usage-credits 確認に未回答でもモデルが切り替わらずターン終了し、Remote Control に切替通知を表示","Fixed an unanswered Fable usage-credits prompt switching models in SDK-hosted sessions such as Claude Desktop; the turn now ends instead, and Remote Control clients now see the model-switch notice","I","fix",2,"ide,cloud",0,[],"model-selection"],[14,"フル Fable モデル ID で `/model` を実行すると、API エラーで止まらず usage-credits 確認が開く","Fixed `/model` with a full Fable model id stopping at an API error instead of opening the usage-credits prompt when the plan needs usage credits that aren't turned on yet","L","fix",1,"cli",0,[],"model-selection"],[15,"別プロセスが更新中に終了・強制終了された後、最大1分間リクエストが失敗するログインエラーを解消","Fixed requests failing for up to a minute with an \"another Claude Code process is refreshing it\" login error after that other process was closed or killed mid-refresh","O","fix",2,"cli",0,[],"auth-login"],[16,"別ウィンドウがサインイン更新中に始まったセッション（VS Code 複数窓で多い）も組織ポリシーの取得を再試行する","Fixed sessions started while another Claude Code window was refreshing the sign-in (common with several VS Code windows) not retrying their organization policy fetch","I","fix",1,"ide",0,[],"auth-login"],[17,"リポジトリのシンボリックリンク経由で macOS の `/Network` や `/.vol` 形式のパス、`/home` へのルール取り込みを防止","Fixed CLAUDE.md and rules being read at startup through a repository symlink reaching macOS's `/Network` via `..` or a `/.vol`-style kernel path, or a rules link to macOS's `/home` being listed","O","fix",1,"macos",0,[],"macos"],[18,"設定ファイル内の途中に `:*` を含む Bash 許可ルールが無視される問題を修正し、全ソースで有効に（起動時に一致方法の警告）","Fixed Bash permission rules with a mid-pattern `:*` being skipped in settings files while `--allowedTools` honored them; they now work from every source, with a startup warning on how they match","T","fix",3,"cli,admin",0,[],"permissions"],[19,"リモートセッションのワーカー再起動時に、復元された権限プロンプトで承認したコマンドが二重実行される問題を解消","Fixed a command approved on a restored permission prompt running twice when a remote session's worker restarted","T","fix",2,"cloud",0,[],"permissions"],[20,"`disableClaudeAiConnectors` や `allowManagedPermissionRulesOnly` など真偽値ロックキーの型誤りでもロックが適用され、起動時にキー名を表示","Fixed managed settings ignoring a mistyped value for boolean lock keys such as `disableClaudeAiConnectors` or `allowManagedPermissionRulesOnly`; the lock now applies and startup names the key","T","fix",3,"admin",0,[],"managed-settings"],[21,"managed の `permissions`、`autoMode`、`worktree`、`attribution` は入れ子の値が1つ不正でも残りが適用される","Fixed managed `permissions`, `autoMode`, `worktree` and `attribution` settings being ignored entirely when one nested value was invalid; the rest of the block now still applies","T","fix",3,"admin",0,[],"managed-settings"],[22,"`allowManagedPermissionRulesOnly` 下で、リポジトリ・ユーザー・`--add-dir` の skills・commands・plugin が `allowed-tools` で自らツールを事前承認できない","Fixed repository, user and `--add-dir` skills, commands and skills update the list too","I","fix",1,"cloud",0,[],"claude-tag"],[82,"GitHub 組織の連携解除後でも、アクセスバンドルの Repositories タブから組織の権限を削除して保存できる","[Claude Tag] Fixed removing a GitHub organization's grant from an access bundle's Repositories tab in Claude Tag admin settings failing to save after that GitHub organization was disconnected","I","fix",1,"admin",0,[],"claude-tag"],[83,"Grid ワークスペースと共有され未追加のチャンネルで、「Couldn't check this channel just now」ではなく、アプリが必要なワークスペース名を通知","[Claude Tag] Fixed Claude always replying \"Couldn't check this channel just now\" in a channel shared with a Grid workspace it isn't added to; the notice now says which workspace needs the app","I","fix",1,"cloud",0,[],"claude-tag"],[84,"クラウドワーカー再起動後、返信フッターのコストとトークン合計が何倍も高く表示される問題を解消","[Claude Tag] Fixed the cost and token totals in Claude's reply footer reading many times too high after the session's cloud worker restarted","I","fix",1,"cloud",0,[],"claude-tag"],[85,"Slack 返信の計画・表・詳細用の枠付きカードが、既定で狭い幅ではなく広い幅で表示される","[Claude Tag] Changed the bordered cards Claude uses in Slack replies for plans, tables and details to render wide by default instead of a narrow width","I","change",1,"cloud",0,[],"claude-tag"],[86,"新規接続の Slack ワークスペースは、接続時の既定モデルではなく現在の既定モデルに追従する","[Claude Tag] Changed newly connected Slack workspaces to follow the current default model instead of keeping whichever model was the default when they were connected","I","change",2,"admin,cloud",0,[],"claude-tag"]]},{"v":"2.1.281","date":"2026-09-24（木）02:01","dshort":"09-24 02:01","nb":5,"head":"セッション再開と権限判定の修正が中心のリリース","sum":"v2.1.281 は、セッション再開・プロキシ経由のストリーム処理・権限判定に関する修正が大半を占めます。危険な `rm` の検出強化と `claude --bg` のワークスペース信頼確認など、安全性に関わる修正も含みます。auto mode の挙動変更、`/plugin`・`/mcp`・`/workflows` などの UI 改善、Claude apps gateway の Bedrock 対応も入っています。","watch":[{"b":"send now (ctrl+enter または ctrl+x ctrl+s) は実行中のツールをバックグラウンドへ移すようになったため、ターンを中断したい場合は別の操作を使うこと。","r":[134]},{"b":"auto mode で読み取り専用・サンドボックス内のシェルコマンドもサーバー側レビューを待ち、指摘されるとブロックされるため、遅延や拒否が増えた場合はレビュー結果を確認すること。","r":[135]},{"b":"`CLAUDE_CODE_AUTO_MODE_SERVER` が直接の Anthropic API 接続にも効くようになり、`0` ではローカル分類器が使用量に計上されるため、設定値を確認すること。","r":[136]},{"b":"危険な `rm` の確認は 2 分で拒否に倒れるため、無人実行で待たせたい場合は `CLAUDE_CODE_DISABLE_DANGEROUS_RM_TIMEOUT=1` を設定すること。","r":[137]},{"b":"`envHelper` のパスが `\\??\\` または `/??/` で始まる `managedMcpServers` 項目があると Claude apps gateway が起動しないため、通常のパス形式に直すこと。","r":[139]},{"b":"self-hosted runner がシステムプロンプトをファイル渡しにしたため、wrapper や `command` hook で `--system-prompt` / `--append-system-prompt` を付けている場合は `--system-prompt-file` / `--append-system-prompt-file` に切り替えること。","r":[140]}],"hl":[{"t":"`rm` 実行前確認の強化","b":"`rm -rf \"$(pwd)\"` のようなコマンド置換のみが対象の再帰 `rm` が、auto mode と `--dangerously-skip-permissions` で確認なしに実行される問題を修正しました。シェル変数や作業ディレクトリ由来の対象、バックスラッシュのみの対象も検出します。","r":[34,110,137]},{"t":"`claude --bg` の信頼確認","b":"ワークスペース信頼の確認を通っていないディレクトリで、`claude --bg` がバックグラウンドセッションとプロジェクト hook を実行していました。今後は先に信頼を確認し、非対話実行では終了します。","r":[38]},{"t":"セッション再開の信頼性向上","b":"再開時に過去のターンが別の形で再送され、API が過去の推論を破棄する問題などを修正しました。大きなセッションの復元欠落や、ツール呼び出し中に終了したセッションの扱いも直しています。長いセッションの再開時間も短縮されました。","r":[12,13,14,15,105,106]},{"t":"プロキシ経由のストリーム処理","b":"プロキシやゲートウェイがストリームを正常終了させた場合の途中切れが、完了として表示されていました。イベント欠落による \"Content block not found\" や、重複イベントでのツール二重実行も修正しています。MCP 切断時のプロンプトキャッシュ喪失も直りました。","r":[17,18,19]},{"t":"auto mode の判定変更","b":"サーバー側の分類器レビューがある場合、読み取り専用コマンドとサンドボックス内コマンドもレビュー完了を待ち、指摘されればブロックされます。`CLAUDE_CODE_AUTO_MODE_SERVER` は直接の Anthropic API 接続にも適用されます。","r":[135,136]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"権限とツール実行まわりが中心です。危険な `rm` の検出強化、NUL バイトを含む権限ルールの扱い、sandbox の `excludedCommands` の照合修正が入っています。`\"attribution\": false` の追加と、auto mode のレビュー方式の変更もあります。","refs":[8,24,25,26,31,32,33,34,35,36,37,40,41,64,92,108,109,110,111,135,136,137]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"`claude --bg` の信頼確認と、`--setting-sources` を teammates や `/bg` などの派生セッションへ引き継ぐ修正が入っています。エージェントパネルと `/workflows` の表示・操作も改善されました。send now の動作は変更されています。","refs":[38,39,46,86,87,88,89,93,113,126,134,146,150]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"プラグインと MCP の周辺です。`claude plugin validate` に MCP サーバーのチェックが加わり、`claude plugin` の uninstall と update の不具合も修正されています。`/plugin` の一覧表示と操作性、スケジュールタスクの再実行問題も改善されました。","refs":[7,52,55,56,57,58,59,60,61,62,63,95,114,115,116,117,118,127,128,131,143,149]},{"a":"S","name":"セッション・履歴・圧縮","dg":"セッションの保存と再開に関する修正が中心です。再開時の履歴再送、大きなセッションの復元、`Prompt is too long` からの回復、再開にかかる時間が改善されました。","refs":[12,13,14,15,16,74,105,106,107]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP 接続まわりの修正と変更です。URL モードの elicitation に対応し、同一 MCP サーバーの二重接続やログイン後のフッター表示残りも直りました。Claude apps gateway は `envHelper` のパス形式を検査するようになりました。","refs":[6,17,29,51,53,54,145,148]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"Remote Control、VS Code/JetBrains、Claude Code on the web、Claude Tag（Slack）、Code Review をまとめた領域です。再開できないセッションや応答が止まる問題の修正が多く、Fast mode の切り替えなどの追加もあります。","refs":[43,44,45,47,48,71,76,102,133,147,152,153,154,155,156,157,158,159,160,161,162,163,164,165,166,167,168,169,170,171,172,173,174,175,176,177]},{"a":"H","name":"headless・SDK・API","dg":"Claude apps gateway の Bedrock 設定（`assume_role`、`guardrail`）が追加されました。プロキシ経由のストリーム異常、`--max-turns` を無視する再試行、headless/SDK セッションの失敗も修正され、`--agents` も拡張されています。","refs":[1,2,3,4,10,11,18,19,20,21,22,27,28,68,112,139,140]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"プロンプトキャッシュの維持、fast mode の再試行、大きな PDF の読み込み遅延が修正されました。AGENTS.md のサポートは Bedrock、Vertex AI、Foundry、LLM ゲートウェイでも動作するようになりました。","refs":[23,42,65,66,67,119,138]},{"a":"U","name":"UI・表示・入力","dg":"端末 UI と入力操作の修正が中心です。Ctrl+C/Ctrl+D によるダイアログのクローズ、vim モード、リスト表示、タブ付きダイアログのキーボード操作を扱います。fullscreen では `/skills`、`/mcp`、`/plugin` にスクロールバーが加わりました。","refs":[5,9,69,70,73,75,77,78,79,80,81,82,83,84,85,90,91,94,96,97,98,99,121,122,123,124,125,129,130,132,141,142,144,151]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"起動時間の短縮、macOS のキーチェーンと認証更新プロセスの修正、Windows 固有の問題が含まれます。Windows では `$TMPDIR` への書き込み失敗と `claude.exe` のバックアップ競合が直りました。","refs":[30,49,50,72,100,101,103,104,120]}],"skip":"表示の乱れ、キー入力の取りこぼし、特定環境のみで起きる不具合の修正が約 90 件あります。","st":"ok","stale":false,"e":[[1,"Claude apps gateway の `desktop` ポリシーが `blockReadsOutsideWorkingDirectories` と `disableBypassPermissionsMode` に対応","Added Claude apps gateway support for newer Claude Desktop keys in `desktop` policy blocks, including `blockReadsOutsideWorkingDirectories` and `disableBypassPermissionsMode`","H","new",2,"admin,ide",0,[],"claude-apps-gateway"],[2,"Claude apps gateway の Bedrock upstream で `assume_role` により STS 経由で IAM ロールを引き受けられる","Added `assume_role` on Claude apps gateway Bedrock upstreams: the gateway calls Bedrock as an IAM role it assumes through STS, in another AWS account if needed, optionally one session per developer","H","new",2,"admin",0,[],"claude-apps-gateway"],[3,"Claude apps gateway の Bedrock upstream に `guardrail: {id, version}` を指定して全リクエストに適用できる","Added `guardrail: {id, version}` on Claude apps gateway Bedrock upstreams to apply an Amazon Bedrock guardrail to every request sent through them (set it on all Bedrock upstreams or none)","H","new",2,"admin",0,[],"claude-apps-gateway"],[4,"Claude apps gateway の設定に `telemetry.resource_attributes` を追加し、Desktop と `/login` セッションのテレメトリに固定ラベルを付与","Added `telemetry.resource_attributes` to the Claude apps gateway config, to put fixed labels on the telemetry of Claude Desktop and `/login` sessions","H","new",1,"admin",0,[],"claude-apps-gateway"],[5,"`settings.json` の `\"attribution\": false` でコミットと PR の帰属表示をすべて非表示にできる","Added `\"attribution\": false` in `settings.json` to hide all commit and PR attribution; older CLI versions skip a settings file that holds it, so keep the object form in files shared across versions","U","new",2,"cli",0,[],"settings"],[6,"MCP の URL-mode elicitation に対応し、サーバーがブラウザ経由のフローを開くよう依頼できる","Added MCP URL-mode elicitation on 2026-07-28 protocol connections, so servers can ask Claude Code to open a browser-based flow; no waiting dialog is left on screen when the server has no way to confirm completion","C","new",2,"cli",0,[],"mcp"],[7,"`claude plugin validate` が `.mcp.json` の無視されるエントリ、未宣言の `${user_config.*}`、安全でない URL を報告","Added MCP server checks to `claude plugin validate`: it reports `.mcp.json` entries that would be silently dropped at load, undeclared `${user_config.*}` references, and insecure URLs","M","new",2,"mod-dev",0,[],"plugins-mods"],[8,"`/insights` が auto mode で減らせた許可プロンプト数の目安を推奨として表示","Added an auto mode recommendation to `/insights` that estimates how many permission prompts auto mode could have handled in your recent sessions","T","new",2,"cli",0,[],"auto-mode"],[9,"フルスクリーンの `/skills`・`/mcp`・`/plugin` の Installed 一覧にスクロールバーを追加","Added a scrollbar to the `/skills`, `/mcp` and `/plugin` Installed lists in fullscreen mode, like the one `/workflows` now has: it appears while the mouse is over the list and can be clicked or dragged","U","new",1,"cli",0,[],"output-rendering"],[10,"API リクエストのリトライ中に「unrecoverable interface error」でセッションが終了するクラッシュを解消","Fixed a crash (\"unrecoverable interface error\") that could end a session while an API request was being retried","H","fix",2,"cli",0,[],"performance"],[11,"解析不能なツール呼び出しと出力上限での打ち切りが交互に続いても `--max-turns` が効いて無限リトライしない","Fixed a turn that could retry indefinitely, ignoring `--max-turns`, when the model alternated unparseable tool calls and output-limit truncation","H","fix",2,"cli,sdk",0,[],"headless-ci"],[12,"再開したセッションが過去のターンを変形して再送し、API が以前の推論を落とす問題を解消","Fixed resumed sessions re-sending earlier turns in a changed form (a parallel tool-call turn, an MCP tool call's input or a tool-search result while its server was still reconnecting, or a tool-search result whose loading turn was interrupted), which could make the API drop the conversation's prior reasoning","S","fix",2,"cli",0,[],"sessions-resume"],[13,"非常に大きなセッションの再開で末尾の数メッセージしか復元されないことがある問題を解消","Fixed resuming a very large session sometimes restoring only its last few messages","S","fix",2,"cli",0,[],"sessions-resume"],[14,"許可プロンプト待ち中の再起動後に再開しても以前と同じ履歴を送り、プロンプトキャッシュが壊れない","Fixed a session resumed after a restart during a pending permission prompt sending a different history than before, which broke the prompt cache from that point","S","fix",1,"cli",0,[],"sessions-resume"],[15,"ツール呼び出し中に終了したセッションを再開すると、Claude が呼び出しを認識し結果不明と伝えられる。手動再開で隠しの「Continue」も付かない","Fixed resuming a session that ended during a tool call: Claude now sees the call and is told its outcome is unknown, and a manual resume no longer adds a hidden \"Continue\" message","S","fix",2,"cli",0,[],"sessions-resume"],[16,"API が読めない過去の advisor 結果を持つセッションが毎ターン失敗する問題を、履歴を一度修復して解消","Fixed sessions with an earlier advisor result the API could no longer read failing one request every turn and repeatedly losing earlier reasoning; the history is now repaired once","S","fix",2,"cli",0,[],"advisor"],[17,"ツール検索オフ時、MCP サーバーの切断や再開後の接続中でもプロンプトキャッシュが失われない","Fixed the prompt cache being lost when an MCP server disconnects mid-conversation, or is still connecting after a resume, while tool search is off (for example behind a proxy or gateway)","C","fix",2,"cli,sdk",0,[],"mcp"],[18,"プロキシが正常にストリームを閉じて途中で切れた応答を警告なしに完了扱いせず、重複イベントでのツール二重実行も防ぐ","Fixed responses cut short by a proxy or gateway that closes the stream cleanly being shown as complete with no warning, and tool calls running twice on duplicated stream events","H","fix",2,"cli,sdk",0,[],"proxy-network"],[19,"プロキシがストリームイベントを落としても「Content block not found」にならず、部分応答と届いた検索結果を保持","Fixed responses failing with \"Content block not found\" when a proxy drops a stream event mid-response; the partial response is now kept, and web search keeps results that already arrived","H","fix",2,"cli,sdk",0,[],"proxy-network"],[20,"ストリーム最終イベント前の切断で空の完了応答が二重に要求される問題を解消","Fixed an empty completed response being requested twice when the connection dropped before the stream's final event","H","fix",1,"cli,sdk",0,[],"proxy-network"],[21,"プロキシが usage のみの末尾フレームを送っても stop reason が失われない","Fixed the stop reason being lost when a proxy sends a trailing usage-only frame","H","fix",1,"cli,sdk",0,[],"proxy-network"],[22,"`CLAUDE_CO  now leads with the skill's name, with ✔ or ◯ alone showing on or off, and stays on one line in narrow terminals","M","improve",1,"cli",0,[],"skills"],[129,"狭い端末の一覧行で名前に20桁を確保し、詳細は全体表示か非表示にする","Improved narrow list rows (`/skills`, `/workflows`, `/feedback`): a name keeps 20 columns beside its first detail, and details are shown whole or not at all","U","improve",1,"cli",0,[],"output-rendering"],[130,"`/diff` に変更ファイル一覧のスクロールバーが付き、長いパスが折り返さない","Improved `/diff`: a scrollbar shows where you are in a long list of changed files, and long paths no longer wrap their rows","U","improve",1,"cli",0,[],"output-rendering"],[131,"`/hooks` の詳細でフックの種類と変更場所を示し、無効・安全モード・管理フック限定の通知も平易に","Improved `/hooks`: a hook's detail screen now says what kind of hook it is and where to change it, instead of always pointing at settings.json, and the hooks-disabled, safe mode and managed-hooks-only notices each say what is happening in one plain sentence","M","improve",1,"cli,mod-dev",0,[],"hooks"],[132,"`/mcp` のスクリーンリーダー出力で無効なサーバーを「pending」ではなく「off」と読む","Improved screen-reader output in `/mcp`: a disabled server is read as \"off\" instead of \"pending\"","U","improve",1,"cli",0,[],"screen-reader"],[133,"Remote Control の確認が、ウィンドウ復帰直後は一時的に無効になり誤キー入力で答えない","Improved the Remote Control confirmation: its options are briefly inactive again after the terminal window regains focus, so a key pressed while switching back cannot answer it","I","improve",1,"cloud",0,[],"remote-control"],[134,"今すぐ送信（ctrl+enter / ctrl+x ctrl+s）が、ターンを中断せず実行中ツールをバックグラウンドへ移す","Changed send now (ctrl+enter or ctrl+x ctrl+s) to move running tools to the background instead of cancelling the turn","A","change",2,"cli",0,[],"background-tasks"],[135,"サーバー側分類器の auto mode では、読み取り専用・サンドボックス内のシェルコマンドも審査を待ち、指摘されるとブロック","Changed auto mode so that, where its classifier review runs server-side, read-only and sandboxed shell commands also wait for that review and are blocked when it flags them","T","change",3,"cli",1,[],"auto-mode"],[136,"`CLAUDE_CODE_AUTO_MODE_SERVER` が Anthropic API 直接接続でも有効で、`0` でオプトアウト（ローカル分類器は利用量に計上）","Changed `CLAUDE_CODE_AUTO_MODE_SERVER` to also apply on a direct Anthropic API connection: `0` opts out of the server-side auto mode classifier (the local classifier then counts toward usage), `1` opts in","T","change",2,"cli,admin",1,[],"auto-mode"],[137,"auto mode と `--dangerously-skip-permissions` の危険な `rm` 確認が2分で拒否される（`CLAUDE_CODE_DISABLE_DANGEROUS_RM_TIMEOUT=1` で無効化）","Changed the dangerous `rm` prompt in `--dangerously-skip-permissions` and auto mode to wait 2 minutes for an answer, then deny the command with a rewrite hint so unattended sessions keep going (`CLAUDE_CODE_DISABLE_DANGEROUS_RM_TIMEOUT=1` turns this off)","T","change",3,"cli,sdk",1,[],"permissions"],[138,"AGENTS.md 対応が Bedrock・Vertex AI・Foundry・LLM ゲートウェイ・テレメトリ無効でも動く","Changed AGENTS.md support to also work on Amazon Bedrock, Google Vertex AI, Microsoft Foundry, LLM gateways, and sessions with telemetry disabled","L","new",2,"cli,admin",0,[],"memory"],[139,"Claude apps gateway が `managedMcpServers` の `envHelper` パスが `\\??\\` や `/??/` で始まると起動を拒否","Changed Claude apps gateway to refuse to start when a `managedMcpServers` entry's `envHelper` path starts with `\\??\\` or `/??/`, a path form current Claude Desktop refuses to run","H","change",1,"admin",1,[],"claude-apps-gateway"],[140,"セルフホストランナーがシステムプロンプトを私的ファイルで渡す。`--system-prompt` 追加ラッパーは `-file` 版へ移行が必要","Changed self-hosted runners to pass system prompts to Claude Code as private files instead of command-line text, so large prompts no longer fail the launch; a wrapper or `command` hook that appends `--system-prompt` or `--append-system-prompt` must switch to `--system-prompt-file` or `--append-system-prompt-file`","H","change",3,"sdk,admin",1,[],"self-hosted-runner"],[141,"キュー済みメッセージがスピナーの下ではなく上の会話内に表示される","Changed queued messages to show in the conversation above the spinner instead of under it","U","change",1,"cli",0,[],"output-rendering"],[142,"セッションの artifact リンクがフッターの1つのピル（`⧉ name` / `⧉ N`）になり、`/artifacts` を開く","Changed the session artifact links under the prompt into one footer pill (`⧉ name` or `⧉ N`) that opens `/artifacts`, which now lists this session's artifacts first","U","change",1,"cli",0,[],"artifacts"],[143,"Artifact ツールが artifact ページで unpkg.com のスクリプトを読み込める","Changed the Artifact tool to let Claude load scripts from unpkg.com in artifact pages","M","change",1,"cli",0,[],"artifacts"],[144,"フルスクリーンの行ホバーが、2つ目の ❯ ではなく行の色付けで表示される（`/config` を含む）","Changed hovering a list row in fullscreen mode, including in `/config`, to tint the row instead of drawing a second ❯ pointer beside the focused row's","U","change",1,"cli",0,[],"output-rendering"],[145,"`/mcp` の各行が状態アイコンと名前で始まり、状態は一度だけ表示、狭い端末では末尾情報から省略","Changed /mcp: each server's row now starts with its status icon and name, says its state once, and in a narrow terminal drops trailing facts like \"managed\" before shortening the name","C","change",1,"cli",0,[],"mcp"],[146,"`/workflows` の各行が状態アイコンと経過時間で始まり、狭い端末ではエージェント数とトークン数から省略","Changed /workflows: each run's row leads with its status icon and elapsed time, and a narrow terminal keeps the run's name and time, dropping the agent and token counts first","A","change",1,"cli",0,[],"workflows"],[147,"Remote Control の添付ダウンロードが接続を再利用し、取得済みファイルをスキップする","Changed Remote Control attachment downloads to reuse connections and to skip files already downloaded in the session","I","improve",1,"cloud",0,[],"remote-control"],[148,"MCP のリソース一覧と @ メンション候補が MCP Apps の UI リソースを除外（URI 指定の読み取りは可能）","Changed MCP resource lists (the resource list tool and @-mention suggestions) to skip MCP Apps UI resources; reading one by URI still works","C","change",1,"cli",0,[],"mcp"],[149,"`claude plugin uninstall --json` と `/plugin` が、フォルダが残りデータを保持した場合にそう表示する","Changed `claude plugin uninstall --json` and the /plugin dialog to say a plugin's data was kept when its folder stays because another installed plugin uses it or install records cannot be read","M","change",1,"mod-dev",0,[],"plugins-mods"],[150,"`/tasks` で実行中の `/ultrareview` を `x` で止める前に確認が出る","Changed the background tasks list (`/tasks`): pressing `x` on a running `/ultrareview` now asks for confirmation before stopping the review","A","change",1,"cli",0,[],"background-tasks"],[151,"コマンドメニューと `/help` から残っていた「(removed)」の `/agents` 項目を削除","Removed the leftover \"(removed)\" `/agents` entry from the command menu and `/help`; typing `/agents` still explains where the wizard went","U","change",1,"cli",0,[],"slash-commands"],[152,"auto mode が課金対象の分類器リクエストに切り替わるとき、VS Code と JetBrains に Continue/Stop 確認が出る","[VSCode] Added a Continue/Stop prompt in the VS Code and JetBrains panels when auto mode falls back to billed classifier requests, replacing the unanswerable warning line","I","new",2,"ide",0,[],"vscode"],[153,"メッセージのない Web セッションを開いても再開不能な空コピーを保存せず、続行先をエラーで案内","[VSCode] Fixed opening a Web session with no messages saving an empty local copy that could not be resumed; an error now says where to continue it","I","fix",1,"ide",0,[],"vscode"],[154,"claude.ai/code セッションが履歴取得失敗時に空や一部だけで開かず、エラー表示して再度開ける","[VSCode] Fixed a claude.ai/code session opening empty or with only part of its conversation, with no error, when the server failed to return its history, part of it failed to load, or a network sign-in page answered in its place; it now shows an error and can be opened again","I","fix",2,"ide,cloud",0,[],"vscode"],[155,"拡張ホスト再起動後に会話タブが無反応にならず、セッション一覧から開き直すよう案内する","[VSCode] Fixed conversations in editor tabs hanging silently after the extension host restarts; the tab now tells you to reopen it from the session list","I","fix",1,"ide",0,[],"vscode"],[156,"チャットパネルの選択式質問に、表示されないオプションプレビューを付けない","[VSCode] Fixed Claude attaching option previews to multiple-choice questions in the chat panel, where the question card never shows them","I","fix",1,"ide",0,[],"vscode"],[157,"セッション管理のコスト・使用量ブロックが狭いサイドバーで途中改行せず、アカウント切替後に前のログインの合計を出さない","[VSCode] Fixed the session manager's cost and usage block wrapping mid-text on a narrow side bar, and showing totals from a previous login after an account switch","I","fix",1,"ide",0,[],"vscode"],[158,"クラウドセッションのモデルメニューに Fast mode スイッチを追加（プランとモデルが対応時）","[Claude Code on the web] Added a Fast mode switch to the composer's model menu in cloud sessions, shown when your plan includes fast mode and the selected model supports it","I","new",2,"cloud",0,[],"web-cloud-sessions"],[159,"GitHub セットアップのヒントに設定ショートカット、リポジトリ選択に「Troubleshoot GitHub connection」リンクを追加","[Claude Code on the web] Added a settings shortcut on the GitHub setup tip and a \"Troubleshoot GitHub connection\" link in the repository pickers, both opening your GitHub connection page","I","new",1,"cloud",0,[],"web-cloud-sessions"],[160,"プルリクエストの draft 解除をトリガーにするルーティンが、変換時に実行を開始する","[Claude Code on the web] Fixed routines with a GitHub trigger for a pull request being converted to draft never firing; they now start a run when the pull request is converted","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[161,"GitHub 以外のリポジトリのクラウドセッションで、使えない Create PR ボタンを非表示にする","[Claude Code on the web] Fixed cloud sessions on a repository that isn't hosted on GitHub showing a Create PR button that could never work; the button is now hidden there","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[162,"リポジトリ選択を開いている間、GitHub セットアップのヒントが検索欄や行を覆わない","[Claude Code on the web] Fixed the GitHub setup tip on claude.ai/code covering the repository picker's search box and rows while the picker is open; it now steps aside until the picker closes","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[163,"ファイルを開けないときのカードが、存在しないのか権限設定で読めないのかを示す","[Claude Code on the web] Improved the file card shown when a cloud session can't open a file: it now says whether the file no longer exists or the session's permission settings block reading it","I","improve",1,"cloud",0,[],"web-cloud-sessions"],[164,"Slack で Stop を押した後、誰が止めたかと @Claude で再開できることをスレッドに表示","[Claude Tag] Added a short line in the Slack thread after someone presses Stop, naming who stopped Claude's response and saying to mention @Claude to continue","I","new",2,"cloud",0,[],"claude-tag"],[165,"スレッド内の返信に永久に反応しなくなる Slack チャンネルが、次の新規メッセージで自動回復する","[Claude Tag] Fixed Slack channels where Claude could permanently stop responding to replies inside threads; affected channels now recover on their own with the next new message to Claude","I","fix",2,"cloud",0,[],"claude-tag"],[166,"Slack で Stop 後に停止したリクエストが再開されず、途中で送ったメッセージも読まれる","[Claude Tag] Fixed Claude resuming a stopped request after you press Stop in Slack, for example when a check-in fired or a background task ended; messages sent mid-response are now read","I","fix",2,"cloud",0,[],"claude-tag"],[167,"セットアップ失敗などでセッションがクラッシュしても、数分以内に自動再起動して返信が遅れず届く","[Claude Tag] Fixed Slack replies arriving many minutes late, or never, after Claude's session crashed mid-task, such as on a failed setup script; it now restarts on its own within minutes","I","fix",2,"cloud",0,[],"claude-tag"],[168,"設定が大きすぎてセッションを起動できないとき、再起動を約束せず理由と再試行方法を示す","[Claude Tag] Fixed Claude in Slack promising an automatic restart, then failing generically, when a session's configuration is too large to start; the thread now says why and how to retry","I","fix",1,"cloud",0,[],"claude-tag"],[169,"非常に長い Slack スレッドで、古いメッセージとの比較による返信の黙殺や、再起動時の最近の文脈の欠落が起きない","[Claude Tag] Fixed very long Slack threads: Claude could silently withhold a reply after judging it against weeks-old messages, and a restart deep into the thread could lose recent context","I","fix",2,"cloud",0,[],"claude-tag"],[170,"Enterprise Grid の組織共有から単一ワークスペースへ移したチャンネルで、毎回「Couldn't check this channel」にならない","[Claude Tag] Fixed Claude answering every mention with \"Couldn't check this channel just now\" in a Slack channel moved from Enterprise Grid org-wide sharing into a single workspace","I","fix",1,"cloud,admin",0,[],"claude-tag"],[171,"チャンネル共有経由が中心の巨大な Enterprise Grid で、静かな1時間後に再び確認失敗とならない","[Claude Tag] Fixed very large Enterprise Grid workspaces reached mostly through channels shared across workspaces getting \"Couldn't check this channel\" again after a quiet hour","I","fix",1,"cloud,admin",0,[],"claude-tag"],[172,"組織の inference hook にブロックされた Slack リクエストで、フックの拒否メッセージを表示し再試行しない","[Claude Tag] Fixed a Slack request blocked by your organization's inference hook showing a generic retry notice; the thread now shows the hook's deny message and Claude doesn't retry","I","fix",1,"cloud,admin",0,[],"claude-tag"],[173,"Slack で組織が使えないモデルへの切替を提案せず、受け付けられるモデルだけを一覧・提案する","[Claude Tag] Fixed Claude in Slack offering to switch to models your organization can't use; it now lists and offers only models the switch will actually accept","I","fix",1,"cloud,admin",0,[],"claude-tag"],[174,"Claude Tag の AWS 接続経由の DynamoDB・Kinesis アカウントベースのエンドポイントで認証できる","[Claude Tag] Fixed requests to DynamoDB and Kinesis account-based endpoints failing to authenticate when sent through an AWS connection in Claude Tag","I","fix",1,"cloud,admin",0,[],"claude-tag"],[175,"Claude Tag 管理設定の Plugins セクションが管理者向けに読み込まれ、プラグイン名で表示される","[Claude Tag] Fixed the Plugins sections in Claude Tag admin settings failing to load for organization admins and listing attached plugins as raw IDs; they now load and show each plugin's name","I","fix",1,"cloud,admin",0,[],"claude-tag"],[176,"Slack スレッドでのルーティン一覧が、既定でチャンネル全体ではなくそのスレッドの予定タスクを示す","[Claude Tag] Changed the routine list Claude gives when asked in a Slack thread to show that thread's own scheduled tasks by default instead of every routine in the channel","I","change",1,"cloud",0,[],"claude-tag"],[177,"全 push レビュー未設定のリポジトリで、失敗レビューの再試行中に force-push された PR もレビューされる","[Code Review] Fixed a pull request getting no review when its reviewed commit was force-pushed away while a failed review was being retried in a repository not set to review every push","I","fix",2,"cloud,admin",0,[],"code-review"]]},{"v":"2.1.280","date":"2026-09-23（水）00:44","dshort":"09-23 00:44","nb":7,"head":"Opus 5.5 が既定モデルになり、auto mode と各種ダイアログを修正","sum":"Claude Opus 5.5 の追加と、Pro・Team Standard を含む全プランでの Opus 既定化が中心のリリースです。auto mode の再試行ループやシンボリックリンク経由の書き込み承認など、権限まわりの修正も多く含まれます。ダイアログ操作、サブエージェント、プラグイン、VSCode や Slack 連携の修正も入っています。","watch":[{"b":"保存済みの effort レベルは Opus 5.5 などの新モデルには適用されず既定値から始まるため、必要なら `/effort` で選び直してください。","r":[79]},{"b":"Opus 4.7、Opus 4.8、Fable 5 は起動時の既定 effort を `/effort`、`-p`、Agent SDK、設定ファイルの `effortLevel` などより優先しなくなったため、effort を固定している場合は設定を確認してください。","r":[80]},{"b":"ダイアログでは `y`/`n` が使えず Enter/Esc で操作する仕様になったため、従来の挙動が必要なら `keybindings.json` で `confirm:yes`/`confirm:no` に割り当ててください。","r":[11]},{"b":"fullscreen の `ctrl+l` / `cmd+k` は transcript のクリアをやめて画面の再描画に戻ったため、クリア目的の操作は別の手段に切り替えてください。","r":[61]},{"b":"予約済みマーケットプレイス名に似せた名前のプラグインマーケットプレイスは追加が拒否され、既存のものは読み込まれなくなったため、該当するものは名前を確認してください。","r":[84]},{"b":"`PermissionRequest` hook では agent 型 hook が実行されずエラーになるため、`command` または `http` 型 hook に置き換えてください。","r":[85]},{"b":"Self-hosted runner のライフサイクル hook 内の git は、共有 git ファイルで指定された hook フォルダやプログラムを無視し、ローカルパスや `git://` のリモートには `GIT_ALLOW_PROTOCOL` が必要になったため、該当する構成では設定してください。","r":[83]}],"hl":[{"t":"Opus 5.5 が既定モデルに","b":"`claude-opus-5-5` が追加され、既定の Opus になりました。1M コンテキストで、料金は $4/$20 per Mtok、キャッシュ読み取りは $0.20/Mtok です。","r":[1]},{"t":"Pro/Team Standard も Opus 既定","b":"Pro と Team Standard の既定モデルが Sonnet から Opus に変わり、Max、Team Premium、Enterprise と揃いました。","r":[78]},{"t":"シンボリックリンク書き込みの承認","b":"シンボリックリンク経由の書き込みは実際の書き込み先で判定されます。`acceptEdits`、allow ルール、auto mode はツリー外に着地する書き込みを承認しなくなりました。","r":[5]},{"t":"auto mode の再試行ループ修正","b":"安全確認が応答しない場合や審査を辞退した場合に、同じ操作が繰り返し拒否される問題を修正しました。辞退時は一度だけ拒否し、無応答時は再試行が間引かれ、10 回連続で止まります。","r":[6,7,104]},{"t":"ダイアログの終了・確認キー","b":"主要ダイアログで Ctrl+C/Ctrl+D の 2 回押しがアプリ終了ではなくダイアログを閉じるようになりました。誤って `n` や `y` で閉じたり確定したりすることもなくなりました。","r":[9,11]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"シンボリックリンク経由の書き込み判定、auto mode の再試行・拒否の挙動、Write 呼び出しの引数ゆれを修正しました。`/ultrareview` のアップロードでは、名前を変えた鍵ファイルの複製も対象外になりました。","refs":[5,6,7,8,62,63,76,104]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"サブエージェントとバックグラウンド処理の修正が中心です。再開した fork サブエージェントのプロンプトキャッシュ、メッセージや報告の取りこぼし、LSP ツールの利用、バックグラウンドシェルの正常な非ゼロ終了の扱い、Ctrl+C の押下回数などが直りました。","refs":[17,18,22,38,39,40,41,42,43,44,47]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"プラグインの更新記録、マーケットプレイスの自動更新と認証情報、skills の誤移動、Artifact ツールの挙動を修正しました。無効化した skill の表示も失敗と区別されます。","refs":[4,19,20,24,49,50,69,73,84,85]},{"a":"S","name":"セッション・履歴・圧縮","dg":"保存済み履歴に不正な通知やシステムメッセージがある場合のクラッシュや毎ターン失敗を修正しました。再開時に未完了のバックグラウンド処理があると、入力前にモデルのターンが始まる問題も直りました。","refs":[33,34]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"`CLAUDE_CODE_MAX_MCP_DESCRIPTION_LENGTH` で MCP の説明文の上限を変更できるようになりました。`/mcp` の警告表示の統一と、同名で再追加した MCP サーバーの再接続も修正しました。","refs":[3,27,48]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VSCode に Status、Sandbox、Chrome の各ダイアログと `/export`、`/skills`、`/plan` が追加されました。Web 版、Slack 連携、Remote Control のほか、`/ultrareview` や GitHub Enterprise Server のトークン更新の問題も修正されています。","refs":[45,51,52,53,54,55,56,57,86,87,88,89,90,91,92,93,94,95,96,97,98,99,100,101,102,103,105,106,107,108,109,110,111,112,113,114]},{"a":"H","name":"headless・SDK・API","dg":"API の 400 エラーや role 順序エラーによる毎ターン失敗を修正し、`hook_execution_complete` OpenTelemetry イベントに hook 出力サイズが加わりました。Self-hosted runner の hook と Code Review の通知も改善しています。","refs":[31,32,58,60,77,83]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"Opus 5.5 の追加と既定モデルの変更が中心です。ホストアプリからのモデル切替後のキャッシュミスを修正し、`/cost` のキャッシュミス原因に thinking の変更が表示されるようになりました。","refs":[1,16,64,72,78,79,80]},{"a":"U","name":"UI・表示・入力","dg":"ダイアログのキー操作、fullscreen のマウス操作、選択リストの Home/End・PgUp/PgDn、`/permissions` の挙動を整えました。見た目の乱れ、音声入力、`/config` のクラッシュなども修正されています。","refs":[2,9,10,11,12,13,14,15,21,23,25,26,28,29,30,35,36,37,46,61,65,66,67,68,70,71,74,75,81,82]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"設定ファイルが名前付きパイプに置き換わったときのハングと、Windows のバックグラウンド掃除がディレクトリのシンボリックリンクやジャンクションを削除する問題を修正しました。","refs":[59]}],"skip":"表示の乱れ、特定環境でのクラッシュ、VSCode・Slack・クラウド環境の個別の不具合修正など、細かな修正が約 70 件あります。","st":"ok","stale":false,"e":[[1,"Claude Opus 5.5 (`claude-opus-5-5`) が追加され、Opus の既定モデルに。1M コンテキスト、$4/$20 per Mtok、キャッシュ読取 $0.20/Mtok","Added Claude Opus 5.5 (`claude-opus-5-5`), now the default Opus model — 1M context, $4/$20 per Mtok with $0.20/Mtok cache reads","L","new",3,"cli,sdk",0,[],"model-selection"],[2,"フルスクリーンで `/skills` 一覧をホイールでスクロールでき、`/plugin` のスキル状態オプションをクリックできる","Added mouse support to more lists in fullscreen mode: the wheel scrolls the `/skills` list, and a skill's state options in `/plugin` can be clicked","U","new",1,"cli",0,[],"output-rendering"],[3,"`CLAUDE_CODE_MAX_MCP_DESCRIPTION_LENGTH` で MCP ツール説明とサーバー指示の 2,048 文字上限を全 MCP サーバー分変更できる","Added `CLAUDE_CODE_MAX_MCP_DESCRIPTION_LENGTH` to change the 2,048-character cap on MCP tool descriptions and server instructions for every MCP server in the session","C","new",2,"cli,admin",0,[],"mcp"],[4,"`hook_execution_complete` OpenTelemetry イベントに hook 出力サイズとファイル保存された大きな出力の件数が加わる","Added hook output sizes and the number of oversized outputs saved to a file to the `hook_execution_complete` OpenTelemetry event","M","new",1,"mod-dev,admin",0,[],"hooks"],[5,"シンボリックリンク経由の書き込みはプロンプトに実際の書き込み先を表示し、`acceptEdits`・allow ルール・auto mode はツリー外に着地する書き込みを承認しない","Fixed writes through a symlinked path being judged by their in-tree spelling: the prompt names where the write lands, and `acceptEdits`, allow rules and auto mode no longer approve one landing outside","T","fix",3,"cli,sdk",0,[],"permissions"],[6,"auto mode は安全チェックが審査を拒否した操作を繰り返さず、一度だけ拒否して再試行しても無駄と伝える","Fixed auto mode retrying an action over and over when a safety check declined to review it; the action is now denied once, noting that retrying won't help","T","fix",2,"cli,sdk",0,[],"auto-mode"],[7,"auto mode は安全チェックが無応答でも連続拒否を繰り返さず、再試行は間隔を空け、10 回連続でメッセージを出してターンを停止する","Fixed auto mode denying actions over and over without pause when a safety check gave no answer; retries now back off, and the turn stops with a message after ten in a row","T","fix",2,"cli,sdk",0,[],"auto-mode"],[8,"モデルが `path`・`file_text`・`file_content` や余分な `description` を送っても Write 呼び出しが検証で失敗しない","Fixed Write calls failing validation when a model sends `path`, `file_text`, `file_content` or a stray `description` instead of `file_path` and `content`","T","fix",2,"cli,sdk",0,[],"read-edit-tools"],[9,"`/model`・`/config`・`/plugin` など多くのダイアログで Ctrl+C / Ctrl+D を2回押しても終了せず、ダイアログが閉じる","Fixed Ctrl+C or Ctrl+D pressed twice in most dialogs (`/model`, `/effort`, `/config`, `/status`, `/usage`, `/plugin`, `/sandbox`, `/permissions`, `/artifacts`, `/mobile`, `/login`, `/upgrade`, `/usage-credits`, `/install-github-app`, `/setup-bedrock`, `/setup-vertex`) quitting Claude Code instead of closing the dialog","U","fix",2,"cli",0,[],"keybindings"],[10,"ターミナルウィンドウを前面に出すだけのクリックが、ポインター下の項目まで作動させない","Fixed a click that only brought the terminal window to the front also triggering the item under the pointer — in search pickers, tab bars, agent/workflow rows, slash-command links and suggestion dropdowns","U","fix",1,"cli",0,[],"output-rendering"],[11,"ダイアログで `n` で閉じる・`y` で確定する誤動作を廃止し、Enter と Esc で承認・キャンセル。戻すには `keybindings.json` で `confirm:yes`/`confirm:no` に割り当て","Fixed a stray `n` closing dialogs and a stray `y` confirming them; Enter and Esc accept and cancel (bind `y`/`n` to `confirm:yes`/`confirm:no` in `keybindings.json` to restore)","U","change",2,"cli",1,[],"keybindings"],[12,"ダイアログのテキスト欄で、同じキーに割り当てたキーバインドに文字・数字・Space が奪われない","Fixed text fields in dialogs losing a typed letter, digit or Space to a keybinding on that key","U","fix",2,"cli",0,[],"keybindings"],[13,"Windows ターミナルで Enter 時に不可視文字を除去した後、プロンプト行の乱れが残らず再描画され、送信テキストを確認できる","Fixed the prompt line staying scrambled on Windows terminals after invisible characters were removed on Enter; the screen is now repainted so you review the exact text that will be sent","U","fix",1,"cli,windows",0,[],"prompt-input"],[14,"不可視文字の除去が、ペルシア語・アラビア語でラテン語の語や数字に接尾辞を付ける zero-width non-joiner を消さない","Fixed the invisible-character cleanup removing the zero-width non-joiner that Persian and Arabic text uses to attach a suffix to a Latin word or number, such as the plural of \"PDF\"","U","fix",1,"cli",0,[],"prompt-input"],[15,"音声入力が Ctrl+C で停止し、文字起こし処理中は Esc でキャンセルでき、transcript view と vim NORMAL mode で Space 長押しでも開始しない","Fixed voice dictation not stopping on Ctrl+C (the prompt cleared but the microphone kept recording), Esc not cancelling while a transcript was processing, and held Space starting dictation from the transcript view and vim NORMAL mode","U","fix",2,"cli",0,[],"voice-dictation"],[16,"作業中に Claude Desktop・VS Code・SDK からモデルを切り替えても、次のプロンプトでプロンプトキャッシュが外れない","Fixed a model switch made from a host app (Claude Desktop, VS Code, SDK) while Claude is working causing a prompt-cache miss on the next prompt","L","fix",2,"ide,sdk",0,[],"model-selection"],[17,"再開した fork subagent が最初に使ったツール一覧を再送し、そのエージェントのプロンプトキャッシュが効く","Fixed resumed fork subagents rebuilding their tool list instead of re-sending the one they first used, which broke prompt caching for that agent","A","fix",2,"cli,sdk",0,[],"subagents"],[18,"verbose mode 以外で展開した subagent の引き渡しメッセージに内部の来歴プリアンブルが表示されない","Fixed subagent hand-back messages showing an internal provenance preamble when expanded outside verbose mode","A","fix",1,"cli",0,[],"subagents"],[19,"ブランチやタグを追う GitHub/git URL の plugin を更新すると `installed_plugins.json` の commit が更新後のものになる","Fixed `installed_plugins.json` keeping the install-time commit after updating a plugin from a GitHub repository or git URL that tracks a branch or tag","M","fix",1,"mod-dev",0,[],"plugins-mods"],[20,"`~/.claude/skills/` の `manifest.json` に名前が載っていても、スキルが `.trash/` に移動されない","Fixed skills in `~/.claude/skills/` being moved to `~/.claude/skills/.trash/` when a `manifest.json` in that folder listed their names","M","fix",2,"cli",0,[],"skills"],[21,"ライトテーマと ANSI テーマでセッションフィードバック調査にホバー強調が表示される","Fixed the session feedback survey showing no hover highlight on light and ANSI themes","U","fix",1,"cli",0,[],"output-rendering"],[22,"`/workflows` が唯一の実行を開く前に1行の一覧を一瞬表示しない","Fixed `/workflows` briefly showing a one-row list before opening the only run","A","fix",1,"cli",0,[],"workflows"],[23,"フルスクリーンで `/model`・`/permissions` など非表示の選択肢がある一覧をマウスホイールでスクロールできる","Fixed the mouse wheel not scrolling selection lists with hidden options (such as `/model` and `/permissions`) in fullscreen mode","U","fix",1,"cli",0,[],"output-rendering"],[24,"`/plugin` と `/skills` でオフにしたスキルは、読み込み失敗の赤い ✘ ではなく薄い ◯ で表示される","Fixed a skill you switched off showing the same red ✘ as a plugin that failed to load in `/plugin` and `/skills`; off now shows a dim ◯","M","fix",1,"cli",0,[],"skills"],[25,"複数選択の選択肢の説明が、番号の下ではなくラベルの下にインデントされる","Fixed multi-select option descriptions being indented under the option number instead of under the label","U","fix",1,"cli",0,[],"output-rendering"],[26,"フルスクリーンで `/plugin`・`/skills`・`/mcp` の検索ボックスの右枠が欠けない","Fixed the search box in `/plugin`, `/skills` and `/mcp` losing its right border in fullscreen mode","U","fix",1,"cli",0,[],"output-rendering"],[27,"`/mcp` の一覧・詳細と `/plugin` で同じサーバーの警告表示が ⚠ に統一される","Fixed `/mcp` showing △ in the server list but ⚠ in the detail view for the same server; the list, detail views and `/plugin` now all show ⚠","C","fix",1,"cli",0,[],"mcp"],[28,"`/config` の設定一覧と `/model`・`/memory`・権限プロンプトなどの選択リストで Home/End が動作する","Fixed Home and End doing nothing in the `/config` settings list and in selection lists such as `/model`, `/memory` and permission prompts","U","fix",1,"cli",0,[],"keybindings"],[29,"`/skills` メニューで PgUp/PgDn が先頭・末尾を越えて循環せずそこで止まる","Fixed PgUp/PgDn in the `/skills` menu wrapping past the first or last skill instead of stopping there","U","fix",1,"cli",0,[],"keybindings"],[30,"`/config` 一覧で Tab が選択中の設定値を勝手に変えず、何もしない","Fixed Tab silently changing the selected setting's value in the `/config` list; it now does nothing there","U","fix",1,"cli",0,[],"settings"],[31,"毎ターン \"role 'system' must precede an 'assistant' message\" API エラーで会話が失敗する問題が直る","Fixed conversations failing on every turn with a \"role 'system' must precede an 'assistant' message\" API error","H","fix",3,"cli,sdk",0,[],"sessions-resume"],[32,"未対応のプロキシやゲートウェイ経由で advisor 使用時の API Error 400 \"Input tag 'advisor_20260301'\" が出ても、advisor なしで再試行する","Fixed conversations with the advisor on failing every turn with API Error 400 \"Input tag 'advisor_20260301'\" behind a proxy or gateway that doesn't support it; the request now retries without it","H","fix",2,"cli,sdk,admin",0,[],"proxy-network"],[33,"MCP ツール読み込み不可の通知が壊れた形で履歴に保存されていても、セッションが毎ターンや `/compact` で失敗しない","Fixed a session failing on every turn and `/compact` when its saved history held a malformed notice about MCP tools that could not be loaded","S","fix",2,"cli",0,[],"sessions-resume"],[34,"壊れた system メッセージやファイル一覧のない memory 保存通知を含む transcript のセッションを再開してもクラッシュしない","Fixed a crash when resuming a session whose saved transcript holds a malformed system message or a memory-saved notice without its file list","S","fix",2,"cli",0,[],"sessions-resume"],[35,"長時間のフルスクリーンセッションが回復不能なインターフェースエラーで終了する原因の一つが直り、壊れたキャッシュのメッセージ一覧は再構築される","Fixed one cause of long-running fullscreen sessions exiting with \"Claude Code exited after an unrecoverable interface error\": a damaged cached message list is now rebuilt","U","fix",2,"cli",0,[],"output-rendering"],[36,"設定ファイルや編集後に再読込するファイルが読み取り中に名前付きパイプへ置き換わってもハングしない","Fixed Claude Code hanging when a settings file, or a file it re-reads after an edit, is replaced by a named pipe mid-read","U","fix",1,"cli",0,[],"settings"],[37,"`settings.json` に移った設定が `~/.claude.json` に `null` や `\"false\"` を残していても `/config` がクラッシュせず、オン/オフ設定が正しく読まれる","Fixed `/config` crashing and some on/off preferences being misread when a preference that has moved to `settings.json` still holds a value like `null` or `\"false\"` in `~/.claude.json`","U","fix",2,"cli",0,[],"settings"],[38,"未完了のバックグラウンドエージェント・シェル・ワークフローがあるセッションを再開しても、入力前にモデルのターンが勝手に始まらない","Fixed resuming a session with unfinished background agents, shells or workflows starting a model turn on its own before you typed anything","A","fix tting and tag characters are removed from pasted text with a notice, and from anything else before it is sent","I","improve",2,"ide",0,[],"vscode"],[94,"\"Open in New Tab\" が作業中のエディタグループの隣に Claude を開く","[VSCode] Changed \"Open in New Tab\" to open Claude beside the editor group you are working in rather than after the last group","I","change",1,"ide",0,[],"vscode"],[95,"effort チップが保存値ではなくセッションが実際に使うレベルを表示する","[VSCode] Fixed the effort chip showing a stale saved effort level instead of the level the session runs at","I","fix",1,"ide",0,[],"vscode"],[96,"Python 拡張の有効化が固まっても、60 秒後に Python 環境なしで Claude Code が起動する","[VSCode] Fixed Claude Code never starting when the Python extension hangs while activating; it now starts after 60 seconds without the Python environment","I","fix",2,"ide",0,[],"vscode"],[97,"auto mode が使えるとき plan 承認カードの先頭が \"Yes, and use auto mode\" になる","[VSCode] Fixed the plan approval card never offering auto mode: when auto mode is available, its first option is now \"Yes, and use auto mode\", as in the terminal","I","fix",2,"ide",0,[],"vscode"],[98,"キーボードでセッションをアーカイブ/解除した後も矢印キーでの一覧移動が続く","[VSCode] Fixed arrow-key navigation in the session list stopping after archiving or unarchiving a session from the keyboard","I","fix",1,"ide",0,[],"vscode"],[99,"セッションを開き直しても自分のメッセージに貼り付けマーカー行が出ない","[VSCode] Fixed paste marker lines showing in your own messages after reopening a session","I","fix",1,"ide",0,[],"vscode"],[100,"管理者の Routines オン/オフ設定は Admin settings → Capabilities → Remote sessions に移動し、管理ページからリンクされる","[Claude Code on the web] Changed the admin Routines on/off setting to live under Admin settings → Capabilities → Remote sessions; the Claude Code admin page now links to it","I","change",2,"admin,cloud",0,[],"web-cloud-sessions"],[101,"GitHub Enterprise Server リポジトリの cloud session で約 8 時間後も `gh` と GitHub API が使え、トークンが自動更新される","[Claude Code on the web] Fixed `gh` and GitHub API calls inside a cloud session on a GitHub Enterprise Server repository failing after about eight hours; the token now renews automatically","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[102,"予定実行の直前に編集した routine が、既存セッション再開時にも新しいプロンプトと名前で動く","[Claude Code on the web] Fixed a routine that resumes an existing session running with its old prompt and name when it was edited moments before the scheduled run started","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[103,"作業ディレクトリ外を指す cloud session のファイルリンクは、読み込めないカードを開かず無効化されて理由が出る","[Claude Code on the web] Fixed file links in a cloud session transcript that point outside the session's working directory opening a file card that never loads; they're now disabled and say why","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[104,"期限切れや新メッセージで置き換わった承認プロンプトを拒否と記録せず、auto mode が再試行を拒まない","[Claude Code on the web] Fixed auto mode refusing to retry a tool call because an approval prompt that expired unanswered, or was superseded by a newer message, had been recorded as your rejection","T","fix",2,"cloud",0,[],"web-cloud-sessions"],[105,"Claude アプリで見る cloud session で、ユーザー向けファイルをアプリが開ける場所に保存する","[Claude Code on the web] Improved cloud sessions viewed in the Claude app: Claude now saves files meant for you where the app can open them","I","improve",1,"cloud",0,[],"web-cloud-sessions"],[106,"管理者が GitHub をオフにした組織の self-hosted 環境で、空のリポジトリ選択を表示しない","[Claude Code on the web] Removed the empty repository picker shown when starting a session on a self-hosted environment in an organization where an admin has turned GitHub off","I","fix",1,"cloud,admin",0,[],"web-cloud-sessions"],[107,"Slack のスレッドに Working インジケーター・Stop ボタン・タイトルが付き、Stop でタスクを中断できる","[Claude Tag] Added Slack's native Working indicator, Stop button and thread title to Claude's threads in channels; the indicator stays up until Claude finishes, and Stop interrupts the task","I","new",2,"cloud",0,[],"claude-tag"],[108,"ゲストの参加や最後のゲスト退出で応答方法が変わるとき、Slack チャンネルに短い通知を出す","[Claude Tag] Added a short notice in the Slack channel when a guest joining, or the last guest leaving, changes how Claude responds there under a Restrict or Channel only guest setting","I","new",1,"cloud,admin",0,[],"claude-tag"],[109,"Enterprise Grid 参加前に接続した Slack ワークスペースでも定期 routine が実行される","[Claude Tag] Fixed scheduled routines silently failing to run in Slack workspaces that were connected to Claude before the workspace joined its Enterprise Grid","I","fix",2,"cloud,admin",0,[],"claude-tag"],[110,"ファイルスキャンの一時障害時に再アップロードを求めず、再試行しスキャナー停止を認識する","[Claude Tag] Fixed Claude asking you to re-upload a Slack file when a brief file-scanning outage, not the file, was the problem; it now retries the scan and is told when the scanner is down","I","fix",1,"cloud",0,[],"claude-tag"],[111,"+・-・* で始まる Slack 返信の箇条書きが空の箇条書きにならず、文字を保ったまま 1 つで表示される","[Claude Tag] Fixed a bullet in Claude's Slack reply whose text starts with +, - or * rendering as an empty bullet with a stray nested item; it now shows as one bullet with the character kept","I","fix",1,"cloud",0,[],"claude-tag"],[112,"クラウド環境のセットアップスクリプト失敗の Slack 通知が、スクリプト名を挙げて先に直すよう案内する","[Claude Tag] Fixed the Slack notice for a failed cloud environment setup script sometimes being a generic \"mention me to retry\"; it now names the setup script and says to fix it first","I","fix",1,"cloud",0,[],"claude-tag"],[113,"Claude Tag 管理設定の GitHub バナーが未接続の理由(未サインイン、アプリ未連携など)を示す","[Claude Tag] Improved the GitHub banner in Claude Tag admin settings to say why GitHub isn't connected: not signed in, app not linked or not installed, sign-in expired, or SSO not authorized","I","improve",1,"admin",0,[],"claude-tag"],[114,"Code Review のチェック実行が、サイズ上限で REVIEW.md の指示が切られた場合にファイル名と上限を示す","[Code Review] Improved the Code Review check run to say when REVIEW.md instructions were cut or left out of a review for exceeding a size limit, naming the file and the limit","I","improve",1,"cloud",0,[],"code-review"]]},{"v":"2.1.278","date":"2026-09-19（土）10:48","dshort":"09-19 10:48","nb":1,"head":"auto mode の既定がサーバー側分類器へ、/status に確認行を追加","sum":"","watch":[{"b":"auto mode が既定でサーバー側分類器を使い分類器の追加コストが課金されない（Bedrock/Vertex/Foundry/gateway は `CLAUDE_CODE_AUTO_MODE_SERVER=0` で無効化可）、課金されるフォールバック時は警告","r":[1]}],"hl":[{"t":"","b":"auto mode が既定でサーバー側分類器を使い分類器の追加コストが課金されない（Bedrock/Vertex/Foundry/gateway は `CLAUDE_CODE_AUTO_MODE_SERVER=0` で無効化可）、課金されるフォールバック時は警告","r":[1]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"","refs":[1]},{"a":"U","name":"UI・表示・入力","dg":"","refs":[2]}],"skip":"","st":"ok","stale":false,"e":[[1,"auto mode が既定でサーバー側分類器を使い分類器の追加コストが課金されない（Bedrock/Vertex/Foundry/gateway は `CLAUDE_CODE_AUTO_MODE_SERVER=0` で無効化可）、課金されるフォールバック時は警告","Changed auto mode for Claude API and Enterprise users, and on Bedrock, Vertex, Foundry and gateways, to default to the server-side classifier, which does not charge for classifier overhead (`CLAUDE_CODE_AUTO_MODE_SERVER=0` opts out on Bedrock, Vertex, Foundry and gateways); warns on billed fallback. See https://code.claude.com/docs/en/auto-mode-classifier-billing","T","change",3,"cli,admin,sdk",1,["https://code.claude.com/docs/en/auto-mode-classifier-billing"],"auto-mode"],[2,"`/status` に `Auto mode server` 行が加わり、auto mode 分類器がサーバー側で動いているか確認できる","Added an `Auto mode server` row to `/status` showing whether this session's auto mode classifier runs on the server","U","new",1,"cli",0,[],"auto-mode"]]},{"v":"2.1.277","date":"2026-09-19（土）01:22","dshort":"09-19 01:22","nb":1,"head":"AGENTS.md対応と、サンドボックス・安全性まわりの修正が中心","sum":"v2.1.277 は AGENTS.md の読み込み対応を加えつつ、クラッシュ・ハング・resume 時の不具合修正が大半を占めるリリースです。サンドボックスの除外判定の厳格化や、サブエージェント出力・プロンプト内の不可視文字の扱いなど、安全性に関わる変更も含みます。TaskOutput ツールの削除は設定の互換性に影響します。","watch":[{"b":"TaskOutput ツールが削除され、`taskOutputMaxChars` 設定と `TASK_MAX_OUTPUT_LENGTH` は効かなくなったため、これらに依存している場合は設定を見直してください。","r":[69]},{"b":"非対話セッションの `/ultrareview` は、ベースブランチも共有履歴も無いリポジトリでは実行を拒否するため、自動化で使う場合は事前にブランチ構成を確認してください。","r":[65]},{"b":"サブエージェントの結果が出力元を示す見出し付きで渡されるようになったため、結果の文面を前提に処理しているワークフローは動作を確認してください。","r":[66]},{"b":"`claude -p` の SDK・IDE 外での実行では、バックグラウンドの Haiku による自動タイトル生成リクエストが送られなくなりました。","r":[68]},{"b":"Fable が Anthropic API の `/model` に常に表示され、組織設定で無効の場合のみグレーアウトされるため、組織で制限する場合は設定を確認してください。","r":[63]},{"b":"Web 版 Team/Enterprise では組織環境が読み取り専用の概要で開き、編集は Admin settings → Cloud environments で行います。管理画面の「Web」の表記は「Cloud sessions」に変わり、Mobile 行は削除されました。","r":[80,82]}],"hl":[{"t":"AGENTS.md の読み込みに対応","b":"CLAUDE.md が無いプロジェクトでは AGENTS.md を読み込みます。`/config` の「Project instructions」で挙動を変更できます。","r":[1]},{"t":"サンドボックス除外の判定を厳格化","b":"`sandbox.excludedCommands` の glob が、複合 Bash コマンドの一部だけに一致してもコマンド全体を除外していました。今後はすべての部分が一致する必要があります。","r":[47]},{"t":"プロンプトとサブエージェント出力の防御","b":"プロンプト内の不可視 Unicode 書式文字とタグ文字を除去し、整形後の内容を送信前に表示します。サブエージェントの結果は、サブエージェント出力と示す見出しの下に字下げして渡されます。","r":[58,66]},{"t":"resume とキャッシュまわりの修正","b":"空のテキストブロックによる全リクエスト失敗、`/clear` 後の継続時の prompt cache ミス、headless resume での累計コストが 0 から始まる問題を修正しました。resume 時の添付の再描画で extended thinking が失われる問題も修正しています。","r":[6,25,45,50]},{"t":"ハングと予期しない終了の修正","b":"`claude -p` と Agent SDK が内部エラー後に結果なしでハングする問題は、エラーを報告して終了コード 1 で終わるようになりました。古い Claude Code ビルドが同じマシンで動くと突然ログアウトされる問題も修正しています。","r":[5,7]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"Grep・Glob・Write・Edit の誤報告や誤動作を修正し、サンドボックス下の `$TMPDIR` 展開も直しました。dangerous-rm の権限プロンプトは該当コマンドを示し、`${VAR:?}` ガードを提案するようになりました。","refs":[12,13,14,15,16,28,47,61,62,64]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"サブエージェントの出力表示と workflow スクリプトの prompt の扱いを変更し、TaskOutput を削除しました。`claude --bg` の LSP 終了による停止や、`claude agents` の入力乱れも修正しています。","refs":[17,26,41,48,66,67,69]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"AGENTS.md 対応に加え、`/plugin` や `claude plugin install` の不具合を多数修正しています。企業向けマーケットプレイスポリシーの不正エントリ問題、`--worktree` でのプロジェクト skills 読み込み、`/ultrareview` のメッセージ改善も含みます。","refs":[11,31,33,34,35,36,37,38,46,55,56,59,60,65]},{"a":"S","name":"セッション・履歴・圧縮","dg":"resume と履歴まわりの修正が中心です。空のテキストブロック、文字列形式のメッセージ、stop hook summary の不整形による失敗やクラッシュを直し、prompt cache と累計コストの扱いも改善しました。","refs":[6,21,25,42,45,50]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"`~/.claude.json` の `claudeAiMcpEverConnected` が不正な値のときに `/mcp` や `/plugin manage` が落ちる問題を修正しました。","refs":[18]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VSCode 拡張にバックグラウンドタスクの表示、`/copy`、`/logout`、セッションのコスト表示などを追加し、設定やコマンドまわりの不具合も修正しました。Web 版は環境ピッカーと管理画面の表記、Claude Tag は認証情報プリセットとログ表示を調整しています。","refs":[29,39,70,71,72,73,74,75,76,77,78,79,80,81,82,83,84,85,86,87]},{"a":"H","name":"headless・SDK・API","dg":"Claude apps gateway に `CLAUDE_GATEWAY_PROXY_IS_EGRESS_BOUNDARY=1` と上流の `headers:` マップを追加し、`NO_PROXY` の扱いとループバックのエラーメッセージを改善しました。`claude -p` と SDK の起動も軽くなっています。","refs":[2,3,5,30,53,54,68]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"Fable が Anthropic API の `/model` に常に表示されるようになりました。","refs":[1,63]},{"a":"U","name":"UI・表示・入力","dg":"`~/.claude.json` の不正値や端末の色コードによるクラッシュ、描画停止を修正しました。ログイン失敗時のエラーメッセージも改善しています。","refs":[4,19,20,22,23,27,43,49,52,57,58]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"認証、更新チェック、`claude update`、起動時の設定読み込みの不具合を修正しました。Windows での PDF 読み取りやメモリ不足エラーの修正と、更新時のステージングファイル残留の解消も含みます。","refs":[7,8,9,10,24,32,40,44,51]}],"skip":"表示の乱れ、不正な設定値によるクラッシュ、まれな環境での不具合の修正が約 40 件あります。","st":"ok","stale":false,"e":[[1,"CLAUDE.md が無いプロジェクトでは AGENTS.md を読む。`/config` の \"Project instructions\" で変更可能","Added AGENTS.md support: in a project with no CLAUDE.md, Claude Code reads AGENTS.md instead; change it under \"Project instructions\" in `/config`","L","new",2,"cli",0,[],"memory"],[2,"`CLAUDE_GATEWAY_PROXY_IS_EGRESS_BOUNDARY=1` で、転送プロキシのみが外向き経路のゲートウェイでもホスト名解決をプロキシに任せられる","Added `CLAUDE_GATEWAY_PROXY_IS_EGRESS_BOUNDARY=1` for Claude apps gateways whose only egress is a forward proxy: every outbound request hands the proxy the hostname instead of resolving it locally","H","new",2,"sdk,admin",0,[],"claude-apps-gateway"],[3,"Claude apps gateway のアップストリームに任意の `headers:` マップを指定し、静的ヘッダーをプロキシへ送れる","Added an optional `headers:` map on Claude apps gateway upstreams, to send static headers to a proxy you run in front of a provider","H","new",1,"admin",0,[],"claude-apps-gateway"],[4,"`/tasks` などのパネルを開いている間にバックグラウンドタスクが終わると、更新待ちの旨を表示する","Added a line saying a background task's update is waiting when it finishes while a panel such as `/tasks` is open","U","new",1,"cli",0,[],"background-tasks"],[5,"`claude -p` と Agent SDK は内部エラー後に無応答で固まらず、エラーを報告して終了コード 1 で終了する","Fixed `claude -p` and Agent SDK sessions that could hang with no result after an internal error; they now report the error and exit with code 1","H","fix",2,"sdk",0,[],"headless-ci"],[6,"過去の assistant ターンに空テキストブロックがあっても、`--resume` 後を含め毎回のリクエストが失敗しない","Fixed conversations failing every request with \"text content blocks must be non-empty\" when an earlier assistant turn held an empty text block beside other content, including after `--resume`","S","fix",3,"cli",0,[],"sessions-resume"],[7,"古い Claude Code（IDE 拡張同梱の CLI など）が同じマシンで動いても、意図せずログアウトされない","Fixed being unexpectedly logged out when an older Claude Code build (for example an IDE extension's bundled CLI) runs on the same machine as the current one","O","fix",2,"cli,ide",0,[],"auth-login"],[8,"`~/.claude.json` の `customApiKeyResponses` が不正でも、`ANTHROPIC_API_KEY` 利用者の対話起動が固まらずエラーも出ない","Fixed interactive start-up hanging or showing an error for `ANTHROPIC_API_KEY` users when `~/.claude.json` holds a malformed `customApiKeyResponses` value","O","fix",1,"cli",0,[],"settings"],[9,"プロキシが不正なバージョンを返しても、更新確認が 30 分ごとにエラーにならず `claude update` も固まらない。不正な `minimumVersion` は無視する","Fixed update checks erroring every 30 minutes, and `claude update` hanging when a minimum or maximum version is set, if a proxy returns an invalid version; a malformed `minimumVersion` is now ignored","O","fix",1,"cli",0,[],"install-update"],[10,"winget・apk 管理のインストールで `claude update` がバージョン取得失敗時に「最新」と誤報告しない","Fixed `claude update` on winget- or apk-managed installs reporting \"up to date\" when the version lookup failed","O","fix",1,"cli",0,[],"install-update"],[11,"セッション等が使用中のバージョンを `claude plugin install` で再インストールしても失敗や破損をせず、変更の無いコピーはそのまま残す","Fixed `claude plugin install` sometimes failing and breaking the installed copy when reinstalling

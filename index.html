function badges(D,e){var b=['<span class="no">#'+e[0]+'</span>'];if(e[7])b.push('<span class="badge brk">要対応</span>');
if(D.kinds.hasOwnProperty(e[4]))b.push('<span class="badge k-'+esc(e[4])+'">'+esc(D.kinds[e[4]])+'</span>');
if(e[4])b.push('<span class="imp i'+e[5]+'" title="重要度 '+e[5]+'">'+'●●●'.slice(0,e[5])+'○○○'.slice(0,3-e[5])+'</span>');
if(D.areas.hasOwnProperty(e[3]))b.push('<span class="badge muted">'+esc(D.areas[e[3]])+'</span>');
String(e[6]||'').split(',').forEach(function(a){if(a&&D.auds.hasOwnProperty(a))b.push('<span class="badge muted">'+esc(D.auds[a])+'</span>')});
return b.join('')}
function entry(D,e,s,pre){var L=(e[8]||[]).filter(function(u){return/^https?:\/\//i.test(u)});
var lk=L.length?' <span class="lk">'+L.map(function(u){return'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">link</a>'}).join(' ')+'</span>':'';
var body=e[1]?'<p class="ja">'+rich(e[1])+lk+'</p>'+(s.en?'<p class="en" lang="en">'+rich(e[2])+'</p>':'')
:'<p class="ja" lang="en">'+rich(e[2])+lk+'</p>';
return'<li id="'+esc(pre+e[0])+'" data-n="'+e[0]+'"'+(e[7]?' class="brk"':'')+'><div class="bd">'+badges(D,e)+'</div>'+body+'</li>'}
function list(D,V,s,o,pre){var es=V.e.filter(function(e){return match(e,s,o)});
return{n:es.length,html:es.length?'<ol class="ent">'+es.map(function(e){return entry(D,e,s,pre)}).join('')+'</ol>'
:'<p class="empty">条件に合う項目はありません</p>'}}
function refs(r){return(r&&r.length)?' <span class="refs">'+r.map(function(n){n=+n;
return'<a class="ref" href="#" data-ref="'+n+'">#'+n+'</a>'}).join(' ')+'</span>':''}
function extra(s){var x=[];if(s.kind)x.push('種別');if(s.imp>1)x.push('重要度');if(s.aud)x.push('対象');return x}
function vnav(D,i){var newer=D.versions[i-1],older=D.versions[i+1];
return'<nav class="vnav" aria-label="前後の版">'+(newer?'<button type="button" data-go="'+esc(newer.v)+'">← 新しい版 v'+esc(newer.v)+'</button>':'<span></span>')
+'<span class="pos">'+(i+1)+' / '+D.versions.length+'</span>'
+(older?'<button type="button" data-go="'+esc(older.v)+'">古い版 v'+esc(older.v)+' →</button>':'<span></span>')+'</nav>'}
function renderVersion(D,s,ui){ui=ui||{};var i=findVer(D,s.v);if(i<0)return'<p class="empty">版がありません</p>';
var V=D.versions[i],h=[vnav(D,i)],tot=V.e.length;
h.push('<h2><span class="vn">v'+esc(V.v)+'</span>'+(V.date?'<span class="meta">'+esc(V.date)+'</span>':'')
+'<span class="meta">'+tot+' 件</span>'+(V.nb?'<span class="badge brk">要対応 '+V.nb+'</span>':'')
+(V.st!=='ok'?'<span class="badge warn">要約失敗・原文のみ</span>':V.stale?'<span class="badge warn">最新の改稿は未反映</span>':'')+'</h2>');
if(V.head)h.push('<p class="headline">'+rich(V.head)+'</p>');
if(V.sum)h.push('<p class="summary">'+rich(V.sum)+'</p>');
if(V.watch.length)h.push('<div class="watch"><h3>注意（挙動・既定値・権限の変更）</h3><ul>'+V.watch.map(function(w){
return'<li>'+rich(w.b)+refs(w.r)+'</li>'}).join('')+'</ul></div>');
if(V.hl.length)h.push('<div class="hl"><h3>注目</h3><ul>'+V.hl.map(function(x){
return'<li>'+(x.t?'<b>'+rich(x.t)+'</b> ':'')+rich(x.b)+refs(x.r)+'</li>'}).join('')+'</ul></div>');
if(V.groups.length){var g=V.groups.map(function(G){var on=G.a===s.area;
var card='<div class="group'+(on?' on':'')+'" role="button" tabindex="0" data-area="'+esc(G.a)+'" aria-expanded="'+on+'"'
+(on?' aria-controls="gpanel"':'')+'><div class="gname">'+esc(G.name)+' <span class="count">'+G.refs.length+' 件</span>'
+'<span class="gtg">'+(on?'閉じる ▲':'項目を見る ▼')+'</span></div>'+(G.dg?'<div class="gdg">'+rich(G.dg)+'</div>':'')+'</div>';
if(!on)return card;var L=list(D,V,s,{area:G.a},'e-'),x=extra(s);
return card+'<div class="gpanel" id="gpanel"><div class="fbar" role="status"><span>絞り込み中: <b>'+esc(G.name)+'</b>（'
+L.n+' 件 / 全 '+tot+' 件）'+(x.length?' <span class="meta">'+esc(x.join('・'))+'の条件も適用中</span>':'')+'</span>'
+'<button type="button" class="fx" data-act="clear-area" aria-label="絞り込みを解除">✕ 解除</button></div>'+L.html+'</div>'}).join('');
h.push('<h3>領域別まとめ <span class="meta">カードを押すとその領域の項目だけを表示</span></h3><div class="groups">'+g+'</div>')}
if(V.skip)h.push('<p class="skip">'+rich(V.skip)+'</p>');
if(!s.area){var A=list(D,V,s,{},'e-');h.push('<details class="entries"'+(ui.openAll?' open':'')+'><summary>エントリ一覧（'
+(A.n===tot?'全 '+tot+' 件':A.n+' 件 / 全 '+tot+' 件')+'）</summary>'+A.html+'</details>')}
if(V.x&&D.labels&&D.labels.xdraft)h.push('<section class="xdraft" aria-label="'+esc(D.labels.xdraft)+'"><h3>'+esc(D.labels.xdraft)
+'</h3><pre id="xdraft">'+esc(V.x)+'</pre><div class="xm"><span>weighted '+(+V.xw)+' / '+(+D.limit)+'</span>'
+'<button type="button" class="copy" data-src="xdraft">コピー</button><span>'+esc(D.labels.xnote||'')+'</span></div></section>');
return'<article class="ver" data-v="'+esc(V.v)+'">'+h.join('')+'</article>'}
function renderSearch(D,s,max){max=max||400;var out=[],tot=0,nv=0,shown=0;
D.versions.forEach(function(V){var es=V.e.filter(function(e){return match(e,s,{cross:true})});if(!es.length)return;
tot+=es.length;nv++;if(shown>=max)return;var part=es.slice(0,max-shown);shown+=part.length;
out.push('<section class="xres" data-v="'+esc(V.v)+'"><h3><button type="button" class="vlink" data-go="'+esc(V.v)+'">v'+esc(V.v)
+'</button><span class="xh">'+esc(V.date||'')+' · '+es.length+' 件 / 全 '+V.e.length+' 件</span></h3><ol class="ent">'
+part.map(function(e){return entry(D,e,s,'s-'+V.v+'-')}).join('')+'</ol></section>')});
var c=[];if(s.q)c.push('“'+esc(s.q)+'”');if(s.brk)c.push('要対応のみ');var x=extra(s);if(x.length)c.push(esc(x.join('・'))+'の条件');
return'<div class="fbar xbar" role="status"><span>全版横断: '+c.join(' / ')+' — <b>'+tot+' 件</b>（'+nv+' 版）'
+(tot>shown?' 先頭 '+shown+' 件を表示':'')+'</span><button type="button" class="fx" data-act="clear-cross" aria-label="横断検索を解除">✕ 解除</button></div>'
+(out.length?out.join(''):'<p class="empty">条件に合う項目はありません</p>')}
function renderIndex(D,s){return'<ol>'+D.versions.map(function(V){var on=!cross(s)&&V.v===s.v;
return'<li'+(on?' class="on"':'')+'><a href="#v'+esc(V.v)+'" data-go="'+esc(V.v)+'"'+(on?' aria-current="true"':'')+'>'
+'<span class="iv">v'+esc(V.v)+'</span><span class="d">'+esc(V.dshort||'')+' · '+V.e.length+' 件'
+(V.nb?' <span class="badge brk">要対応 '+V.nb+'</span>':'')+'</span><span class="ih">'+rich(V.head||'')+'</span></a></li>'}).join('')+'</ol>'}
return{esc:esc,rich:rich,parseHash:parseHash,buildHash:buildHash,cross:cross,findVer:findVer,normalize:normalize,
match:match,renderVersion:renderVersion,renderSearch:renderSearch,renderIndex:renderIndex}})();

(function(){
var D=JSON.parse(document.getElementById('cc-data').textContent),$=function(x){return document.getElementById(x)};
var view=$('view'),idx=$('vindex'),vl=$('vlist'),cur=$('vcur'),q=$('f-q'),brk=$('f-brk'),kind=$('f-kind'),imp=$('f-imp'),
aud=$('f-aud'),en=$('f-en'),S,UI={openAll:false},lastH=null,wide=window.matchMedia?window.matchMedia('(min-width:960px)'):null;
function sync(){q.value=S.q;brk.checked=S.brk;kind.value=S.kind;imp.value=String(S.imp);aud.value=S.aud;en.checked=S.en}
function draw(){view.innerHTML=CC.cross(S)?CC.renderSearch(D,S):CC.renderVersion(D,S,UI);idx.innerHTML=CC.renderIndex(D,S);
cur.textContent=CC.cross(S)?'全版横断':'v'+S.v}
function commit(){lastH=CC.buildHash(S);try{history.replaceState(null,'','#'+lastH)}catch(e){location.replace('#'+lastH)}draw()}
function read(){S=CC.normalize(D,CC.parseHash(location.hash));sync();draw()}
function top(){var y=view.getBoundingClientRect().top+(window.scrollY||0)-70;if((window.scrollY||0)>y)window.scrollTo(0,Math.max(0,y))}
function go(v){S.v=v;S.area='';S.q='';S.brk=false;UI.openAll=false;sync();commit();top();if(wide&&!wide.matches)vl.open=false}
function card(a){return view.querySelector('.group[data-area="'+a+'"]')}
function setArea(a){S.area=S.area===a?'':a;commit();var c=card(a);if(c)c.focus({preventScroll:true});
var p=$('gpanel');if(p){var r=p.getBoundingClientRect();if(r.top>window.innerHeight-80)p.scrollIntoView({block:'start'})}}
function showRef(n){var V=D.versions[CC.findVer(D,S.v)];if(!V)return;var e=null;
for(var i=0;i<V.e.length;i++)if(V.e[i][0]===n)e=V.e[i];if(!e)return;
S.kind='';S.imp=1;S.aud='';S.area=e[3]&&V.groups.some(function(g){return g.a===e[3]})?e[3]:'';if(!S.area)UI.openAll=true;
sync();commit();var el=$('e-'+n);if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');
setTimeout(function(){el.classList.remove('flash')},1600)}}
function copyText(btn){var t=($(btn.dataset.src)||{}).textContent||'';
try{navigator.clipboard.writeText(t).then(function(){btn.textContent='コピー済'},function(){btn.textContent='コピー不可'})}
catch(e){btn.textContent='コピー不可'}}
document.addEventListener('click',function(ev){var t=ev.target.closest('[data-go],[data-area],[data-act],a.ref,button.copy[data-src]');
if(!t)return;if(t.matches('button.copy[data-src]')){copyText(t);return}
if(t.hasAttribute('data-go')){ev.preventDefault();go(t.getAttribute('data-go'));return}
if(t.hasAttribute('data-area')){setArea(t.getAttribute('data-area'));return}
var act=t.getAttribute('data-act');
if(act==='clear-area'){var a=S.area;S.area='';commit();var c=card(a);if(c)c.focus();return}
if(act==='clear-cross'){S.q='';S.brk=false;sync();commit();return}
if(t.classList.contains('ref')){ev.preventDefault();showRef(+t.getAttribute('data-ref'))}});
document.addEventListener('keydown',function(ev){var t=ev.target;if(!t.classList||!t.classList.contains('group'))return;
if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();setArea(t.getAttribute('data-area'))}});
document.addEventListener('toggle',function(ev){if(ev.target.classList&&ev.target.classList.contains('entries'))UI.openAll=ev.target.open},true);
q.addEventListener('input',function(){S.q=q.value.trim();commit()});
brk.addEventListener('change',function(){S.brk=brk.checked;commit()});
kind.addEventListener('change',function(){S.kind=kind.value;commit()});
imp.addEventListener('change',function(){S.imp=+imp.value||1;commit()});
aud.addEventListener('change',function(){S.aud=aud.value;commit()});
en.addEventListener('change',function(){S.en=en.checked;commit()});
window.addEventListener('hashchange',function(){if(location.hash.slice(1)!==lastH)read()});
if(wide){vl.open=wide.matches;var f=function(){vl.open=wide.matches};
if(wide.addEventListener)wide.addEventListener('change',f);else if(wide.addListener)wide.addListener(f)}
read()})();
</script></body></html>

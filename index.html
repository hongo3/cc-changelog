ext"],[86,"`claude remote-control` の初回質問が未回答のときのメッセージが、次に何をすべきかを示す","Improved `claude remote-control`'s messages for an unanswered first-run question: each now says what to do next","I","improve",1,"cloud,cli",0,[],"remote-control"],[87,"信頼済み TLS 証明書の読み込みを高速化し、起動時間を短縮","Improved start-up time by loading trusted TLS certificates faster","O","improve",1,"cli",0,[],"performance"],[88,"Claude apps gateway のエラーメッセージが、ユーザー名・パスワードなしで gateway のアドレスを表示する","Improved Claude apps gateway error messages to show the gateway's address without any user name or password","H","improve",1,"admin",0,[],"claude-apps-gateway"],[89,"Claude apps gateway の利用上限エラーで、リセット時刻を現地時間（例: 4pm (America/Los_Angeles)）で表示する","Improved the Claude apps gateway's spend limit error: the reset now shows in your local time, such as \"resets 4pm (America/Los_Angeles)\"","H","improve",1,"admin",0,[],"claude-apps-gateway"],[90,"Windows: 標準の Git for Windows では、起動のたびに git.exe の確認をせず起動が速くなる","Windows: Improved startup time with a standard Git for Windows install by no longer checking which git.exe to run on every launch","O","improve",1,"windows",0,[],"windows"],[91,"セッションフィードバック文言と `allowedProviders` の説明に Ultra を追加し、`forceLoginMethod` の説明を全有料プラン対応にする","Updated the session-feedback message and the `allowedProviders` setting description to name Ultra alongside Pro and Max, and the `forceLoginMethod` description to cover every paid Claude plan","U","change",1,"cli",0,[],"settings"],[92,"同梱 dataviz skill が、上限が別々の複数の比率には項目ごとに1行のメーター一覧を提案する","Updated the bundled dataviz skill to suggest a list of meters, one row per item, for several ratios that each have their own limit","M","change",1,"cli",0,[],"skills"],[93,"「Upgrade to Max」の選択肢を「Upgrade to Max or Ultra」に変更","Updated the \"Upgrade to Max\" options to say \"Upgrade to Max or Ultra\"","U","change",1,"cli",0,[],"prompt-input"],[94,"Claude が書く mods は auto・bypass モードで確認なしに有効化（managed 制限があっても）され、`dontAsk` では読み込まない","Changed mods Claude writes to turn on without asking in auto and bypass modes, even with managed `allowUnsandboxedCommands: false` or `allowManagedDomainsOnly`, and not to load in `dontAsk` mode","M","change",2,"mod-dev,admin",1,[],"plugins-mods"],[95,"mods 自身のツール呼び出し（`$.tool.call`、`$.mcp.call`）は権限確認を出さない。deny ルールと組織ポリシーは有効","Changed mods' own tool calls (`$.tool.call`, `$.mcp.call`) to raise no permission prompt, even under your own ask rules or in `dontAsk` and `-p` runs; deny rules and organization policy still apply","M","change",2,"mod-dev",1,[],"plugins-mods"],[96,"保存済みの Fable 5.1 選択を `fable` に移行。戻すには `/model claude-fable-5-1`","Changed saved Fable 5.1 model picks to move to `fable`: on Pro and Max plans at once, on Team and Enterprise plans once your organization allows it; use `/model claude-fable-5-1` to switch back","L","change",2,"cli",1,[],"model-selection"],[97,"`/fast`・`/config`・`/model` の fast mode 表示が対応時に現在のモデル名を示し、VS Code 行の「(Opus only)」を削除","Changed the fast mode labels in `/fast`, `/config` and `/model` to name your current model when it supports fast mode, and removed \"(Opus only)\" from the VS Code row","U","change",1,"cli,ide",0,[],"fast-mode"],[98,"`~/.claude/plugins` 内の `.claude/skills` は、そこでファイルを扱っても読み込まれない","Changed nested skill loading: `.claude/skills` folders inside `~/.claude/plugins` no longer load when Claude works on files there","M","change",1,"mod-dev",1,[],"skills"],[99,"Self-hosted runner: 不要としてサーバーに拒否されたオンデマンド runner は終了コード 0 で終了する","Self-hosted runner: Changed an on-demand runner that the server refuses because it is not needed (session ended or paused, work order superseded) to exit 0 instead of 1","H","change",1,"sdk,admin",1,[],"self-hosted-runner"],[100,"Windows: git など自前起動するプログラムの検索で、相対・UNC の PATH 項目とネットワーク共有へのリンクを除外し、設定の PATH 変更を反映","Windows: Changed how Claude Code finds programs it starts itself, such as git, to skip relative and UNC PATH entries and links onto a network share, and to pick up PATH changes from settings","O","change",1,"windows",0,[],"windows"],[101,"非対話セッションの OpenTelemetry hook イベントで、Bash/PowerShell 後の組み込み hook 2つを `num_hooks`・`num_success` から除外","Changed OpenTelemetry hook events in non-interactive sessions to leave two built-in hooks out of `num_hooks` and `num_success` after Bash and PowerShell calls","H","change",1,"sdk",0,[],"telemetry"],[102,"Desktop の Code タブのセッションが、入力待ちになる前に他セッションへ送れるメッセージ数を 10 から 20 に増やす","Changed the number of messages a Claude Desktop Code tab session can send to your other sessions before it waits for you to type again from 10 to 20","I","change",1,"ide",0,[],"desktop"],[103,"`claude -p` と SDK の `AskUserQuestion` は、未文書の `afkTimeoutMs` を設定した host の権限回答を拒否する","Changed `AskUserQuestion` in `claude -p` and SDK sessions to deny a host's permission answer that sets the undocumented `afkTimeoutMs` input field","H","change",1,"sdk",1,[],"sdk"],[104,"managed `extraKnownMarketplaces` で、宣言名を別ソースから追加不可、他の項目は非表示、宣言元の plugin は再インストールされる","Changed managed `extraKnownMarketplaces`: a declared name can't be added from another source, an entry from elsewhere is hidden, and plugins the declared marketplace lists are reinstalled from it","M","change",2,"admin,mod-dev",1,[],"plugins-mods"],[105,"Desktop の Code タブなどが提供する Claude in Chrome ツールが、組織の Claude in Chrome ポリシーに従う","Changed Claude in Chrome tools that an app running Claude Code provides, such as the Claude desktop app's Code tab, to follow your organization's Claude in Chrome policy","C","change",2,"ide,admin",0,[],"chrome-extension"],[106,"gateway の `policy_mode: layered` で、managed MCP サーバーが `match: {}` を含む全一致ポリシーの合算になる","Changed `policy_mode: layered` in the Claude apps gateway: managed MCP servers now add up over every matching policy, `match: {}` included, so a gateway already on it serves more after the upgrade","H","change",2,"admin",1,[],"claude-apps-gateway"],[107,"Gateway: Bedrock・Vertex・Foundry upstream は環境の `ANTHROPIC_*_BASE_URL` を無視。別エンドポイントは upstream の `base_url` で指定","Gateway: Changed Bedrock, Vertex and Foundry upstreams to ignore the `ANTHROPIC_*_BASE_URL` variables in the gateway's environment. Set `base_url` on the upstream to use another endpoint","H","change",2,"admin",1,[],"claude-apps-gateway"],[108,"headless セッションが `.claude/skills` の mods をファイル変更時に再読込。`CLAUDE_CODE_PLUGIN_DIR_WATCH=0` で無効化","Changed headless sessions to reload mods in `.claude/skills` when their files change; set `CLAUDE_CODE_PLUGIN_DIR_WATCH=0` to turn this off","M","change",1,"sdk,mod-dev",0,[],"plugins-mods"],[109,"cyber safeguard ブロック時の Cyber Verification Program の文言を claude.ai と同じにする","Changed the Cyber Verification Program sentence on a cyber safeguard block to use the same words as claude.ai","U","change",1,"cli",0,[],"cyber-safeguards"],[110,"Cowork cloud sessions で、PostToolUse hook は AskUserQuestion の回答や ExitPlanMode のプランを置換できず、Claude は原本を読む","Changed Cowork cloud sessions: a PostToolUse hook can no longer replace the answer to AskUserQuestion or the plan in ExitPlanMode's result; Claude reads the originals","I","change",1,"cloud",1,[],"cowork"],[111,"`/bin/cp` のようにパス指定した `cp`・`mv` にも、通常の `cp`・`mv` と同じパスチェックを適用","Changed `cp` and `mv` spelled by a path, such as `/bin/cp`, to get the same path checks as `cp` and `mv`","T","change",2,"cli",0,[],"bash-tool"],[112,"バックグラウンドコマンド通知と TaskStop 結果は、1,000 文字超のコマンドの先頭と末尾のみを Claude に見せコンテキストを節約","Changed background command notifications and TaskStop results to show Claude only the start and end of a command over 1,000 characters, which saves context","L","change",1,"cli",0,[],"compaction-context"],[113,"artifact のデザイン指針で Inter と Space Grotesk を良い既定書体として扱う","Changed artifact design guidance to treat Inter and Space Grotesk as good default typefaces","M","change",1,"cli",0,[],"artifacts"],[114,"アカウントのメール確認は、メールと User-Agent を含むシェルコマンドだけを確認なしで拒否し、他のコマンドや定期実行は止めない","Changed the account email check to refuse only a shell command that holds your email and names a User-Agent, without asking, so other commands and scheduled runs no longer stop at its prompt","T","change",2,"cli,sdk",0,[],"permissions"],[115,"Remote Control セッションは開始したフォルダを維持し、接続クライアントは別フォルダへ移せない","Changed Remote Control sessions to keep the folder they were started in: a connected client can no longer move a session to another folder","I","change",2,"cloud",1,[],"remote-control"],[116,"managed `extraKnownMarketplaces` の未宣言ソースによる乗っ取り時、保存データは `cleanupPeriodDays` まで、オプションと秘密情報は `claude plugin restore-set-aside` まで退避","Changed managed `extraKnownMarketplaces` take-overs from an undeclared source: saved data is set aside for `cleanupPeriodDays`, and options and secrets until `claude plugin restore-set-aside`","M","change",1,"admin,mod-dev",0,[],"plugins-mods"],[117,"[VSCode] auth token と API key が両方設定されていると、プロンプト欄の上に警告を表示","[VSCode] Added a warning above the prompt box when both an auth token and an API key are set, matching the terminal's startup warning","I","new",1,"ide",0,[],"vscode"],[118,"[VSCode] plugin の権限要求が隠し文字入りの名前でなく「a plugin」と表示される","[VSCode] Fixed a plugin's permission request showing a name with hidden characters: it now reads \"a plugin\"","I","fix",1,"ide",0,[],"vscode"]]},{"v":"2.1.319","date":"2026-11-06（金）09:58","dshort":"11-06 09:58","nb":16,"head":"auto modeの挙動変更とBash権限の修正が中心の更新","sum":"auto modeのサーバー側チェックの扱いが変わり、ゲートウェイ経由や telemetry 無効環境では従来のフォールバックが使えなくなった。Bash・sed・sandbox・Monitorの権限回避や検査漏れの修正が複数入っている。MCPタスクのバックグラウンド実行、Claude appsゲートウェイ、VSCode、クラウドセッションの改善と修正も多い。","watch":[{"b":"auto mode のサーバー側チェックが使えない環境では組み込み分類器に戻らないため、従来動作が必要なら `CLAUDE_CODE_AUTO_MODE_SERVER=0` を設定する。","r":[1]},{"b":"プロジェクトの設定ファイルやプラグインは、外部で無効化した auto mode のサーバー側チェックを再度有効にできなくなったので、必要な設定はプロジェクト外で行う。","r":[108]},{"b":"Monitor の WebSocket watch が Bash と同じルールに従うため、ask ルール下では確認が必須になり、deny ルールがあれば拒否される。","r":[109]},{"b":"`CLAUDE_CODE_PROXY_RESOLVES_HOSTS` は設定ファイルから設定できなくなったので、プロセス環境変数で指定する。","r":[110]},{"b":"広い deny ルールが覆うコマンドの exact な ask ルールは確認なしで拒否されるため、意図しない拒否があれば deny ルールを見直す。","r":[111]},{"b":"`which` にルックアップ・表示用以外のフラグを付けると権限確認が入るので、必要なら許可ルールを追加する。","r":[112]},{"b":"`--add-dir` のディレクトリは、そのディレクトリ自身の trust ダイアログを承認するまでプラグイン marketplace を登録しない。","r":[113]},{"b":"Bash サンドボックス有効時、起動フォルダより下の `.claude/skills` のスキルは、そこで起動するか `/cd` した場合だけ読み込まれる。","r":[114]},{"b":"自己ペースの `/loop` は、再スケジュールせずにターンが終わると終了する。従来動作は `CLAUDE_CODE_LOOP_KEEPALIVE=1` で戻せる。","r":[115]},{"b":"TLS 検査プロキシ下の証明書自動修復は `ALL_PROXY` のみの設定では動かないため、`HTTPS_PROXY` に http:// の URL を設定する。","r":[119]},{"b":"クラウドセッションは、deny/ask ルールをすべて保持できない場合、新 worker への移行時にセッション単位の allow ルールを破棄する。再度確認が出ることがある。","r":[118]},{"b":"自己ホスト runner の `CLAUDE_RUNNER_CHECKOUT_PATH` はリポジトリごとに別フォルダとなり、同名の場合は `-2`、`-3` が付く。パスを参照するスクリプトは確認する。","r":[127]}],"hl":[{"t":"auto modeの検査不能時の扱い","b":"テレメトリやフィーチャーフラグが無効の環境、または LLM ゲートウェイ経由の環境では、auto mode がサーバーで確認できない呼び出しを確認するか拒否するようになりました。内蔵分類器へのフォールバックは行いません。従来の動作は `CLAUDE_CODE_AUTO_MODE_SERVER=0` で続けられます。","r":[1,2,79,108,29,26]},{"t":"Bash権限チェックの抜け穴を修正","b":"次の場合に、Bash の deny/ask ルールや権限チェックが素通りされていた問題を修正しました。クォートされた単語を含むコマンド、細工した環境変数プレフィックス、accept-edits と auto mode での `sed` です。Monitor の WebSocket 監視も Bash のルールに従うようになりました。","r":[33,80,78,109,111,112]},{"t":"中断したプランの無承認実行を防止","b":"plan mode で中断した手順が別の権限モードで再開されたとき、承認されていないプランを実行しないようになりました。VSCode では通知を出して止まります。`CLAUDE_CODE_RESUME_INTERRUPTED_TURN` もそのターンを再実行しません。","r":[133,38]},{"t":"リポジトリ由来の拡張は信頼後に","b":"リポジトリにある hooks・skills・plugin marketplace を読み込む条件が厳しくなりました。self-hosted runner の `--trust-workspace false` は、リポジトリの設定ファイルにある hooks と skills の実行も止めます。","r":[83,113,114]},{"t":"MCPタスクのバックグラウンド実行","b":"ターミナルが MCP タスクに対応しました。MCP サーバーがツール呼び出しをタスクとして実行すると、Claude Code はすぐにバックグラウンドへ移し、完了したら結果を Claude に伝えます。この機能はフィーチャーフラグの取得なしでも動きます。","r":[3,107,4]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"auto mode のサーバー側チェックの扱い、Bash と Monitor の権限判定が変わった。権限回避、検査漏れ、サンドボックス脱出の修正も含まれる。Write、`NotebookEdit`、バックグラウンド Bash の不具合も直った。","refs":[1,2,5,28,29,32,33,42,43,44,46,56,57,78,79,80,81,82,98,108,109,111,112]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"`/tasks` に完了済みサブエージェントの行が加わった。agent view、`/clear`、バックグラウンドエージェントの報告まわりの不具合が修正されている。","refs":[16,34,62,64,65,66,67,75,92,93,117,141]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"`/claude-api latency-optimize` が追加され、プラグインの依存関係のインストール、`/loop`、スキルの読み込み、PostToolUse hook の挙動が変わった。artifact database やプラグイン関連の修正も入っている。","refs":[6,17,50,51,53,55,58,59,74,90,91,113,114,115,116]},{"a":"S","name":"セッション・履歴・圧縮","dg":"`/rewind` のシンボリックリンク経由の復元・削除や、`/branch` 前のチェックポイントへの復元失敗が修正された。`claude purge` は削除失敗時に再試行する。","refs":[38,54,77,89,97]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP タスクのバックグラウンド実行に対応し、古いハンドシェイクの MCP サーバーの接続不良も修正された。Claude in Chrome は切断時の挙動が改善され、`shortcuts_list` と `shortcuts_execute` は削除された。","refs":[3,4,18,19,68,95,96,107,122]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VSCode 拡張、クラウドセッション、Remote Control、Claude Tag、Code Review の修正と変更が中心。長いプロンプトの切り捨てや plan mode の再開まわりの問題も直った。","refs":[20,69,70,72,73,87,88,100,105,106,118,120,129,130,131,132,133,134,135,136,137,138,139,140,142,143,144,145,146]},{"a":"H","name":"headless・SDK・API","dg":"Claude apps ゲートウェイに設定、警告、ログ形式の追加があり、`CLAUDE_CODE_DISABLE_FEATURE_FLAGS` や `/usage` の費用表示も加わった。`claude -p` や SDK、自己ホスト runner の修正もある。","refs":[7,8,9,10,11,12,13,26,35,36,37,60,61,63,71,83,84,101,102,121,123,124,125,126,127,128]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"`/context` が Claude に送る内容を短くし、`/model` の選択画面では古いモデルを「More models」にまとめた。モデル名の打ち間違い時は候補を提案する。","refs":[25,45,103,104]},{"a":"U","name":"UI・表示・入力","dg":"`/diff` の表示不具合、先頭に空白がある slash command、設定ファイルの競合や重複の警告が修正された。淡色テキストのコントラストも改善されている。","refs":[21,22,23,30,31,39,40,47,48,52,76,85,99]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"`ant auth login` の認証利用時の警告表示が追加された。ディスク満杯時の設定保存、401 の再試行、プロキシ関連の修正と変更も含まれる。","refs":[14,15,24,27,41,49,86,94,110,119]}],"skip":"表示の乱れ、リンクの扱い、特定環境での保存や接続の失敗など、細かな修正が多数含まれる。","st":"ok","stale":false,"e":[[1,"テレメトリ/フラグ無効や LLM ゲートウェイ経由の auto mode は、サーバーで確認できない呼び出しを確認または拒否し、内蔵分類器へ戻らない。`CLAUDE_CODE_AUTO_MODE_SERVER=0` で従来動作","Changed auto mode with telemetry or feature flags off, including behind LLM gateways: calls the server can't check are asked about or denied, with no fallback to the built-in classifier; set `CLAUDE_CODE_AUTO_MODE_SERVER=0` to keep using it (Bedrock, Vertex and Foundry are unchanged)","T","change",3,"cli,sdk,admin",1,[],"auto-mode"],[2,"LLM ゲートウェイ経由では `CLAUDE_CODE_AUTO_MODE_SERVER=1` で `CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS` 設定時もサーバー側チェックが有効、managed settings 側も `1` が必要","Changed auto mode behind an LLM gateway: `CLAUDE_CODE_AUTO_MODE_SERVER=1` turns on the server-side check even with `CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS` set; if managed settings set the latter, they must set the `1` too","T","change",2,"cli,admin",1,[],"auto-mode"],[3,"ターミナルで MCP タスクに対応し、タスク実行のツール呼び出しを即座にバックグラウンド化して完了時に Claude へ結果を伝える","Added support for MCP tasks in the terminal: when an MCP server runs a tool call as a task, Claude Code moves it to the background right away and tells Claude the result when it finishes","C","new",2,"cli",0,[],"mcp"],[4,"`CLAUDE_CODE_DISABLE_MCP_TASK_BACKGROUND` で MCP タスクをバックグラウンド化せずツール呼び出し内で待機できる","Added the `CLAUDE_CODE_DISABLE_MCP_TASK_BACKGROUND` environment variable to make Claude Code wait for an MCP task inside its tool call instead of moving it to the background right away","C","new",1,"cli",0,[],"mcp"],[5,"`permissions.denyInsteadOfPrompting` で、権限確認待ちになる呼び出しを拒否してターンを続行できる(サブエージェント・teammates 含む)","Added `permissions.denyInsteadOfPrompting` setting: a tool call that would wait on a permission prompt is denied and the turn continues, in terminal sessions, subagents and teammates","T","new",2,"cli,sdk",0,[],"permissions"],[6,"`/claude-api latency-optimize` で Claude API コードの待ち時間の原因を探し、eval で高速な設定を試せる","Added `/claude-api latency-optimize` to find where your Claude API code makes people wait and try faster settings against your eval","M","new",2,"cli",0,[],"skills"],[7,"`CLAUDE_CODE_DISABLE_FEATURE_FLAGS` でテレメトリを止めずにフィーチャーフラグ取得だけ停止し、各フラグは内蔵既定値になる","Added the `CLAUDE_CODE_DISABLE_FEATURE_FLAGS` environment variable, which stops feature-flag fetching without turning off telemetry; every flag then uses its built-in default","H","new",2,"cli,admin",0,[],"settings"],[8,"支出上限のない Claude apps gateway 利用者向けに、`/usage` で今日・今週・今月の支出を表示(ゲートウェイが対応版の場合)","Added spend for today, this week and this month to `/usage` for developers behind a Claude apps gateway who have no spend limit, when the gateway runs this version or later","H","new",2,"cli,admin",0,[],"claude-apps-gateway"],[9,"Claude apps gateway に `admin.pooled_conflict_rule` と `admin.pooled_priority_order` を追加し、複数グループ所属時にどのプール予算から支払うか設定可能","Added `admin.pooled_conflict_rule` and `admin.pooled_priority_order` to the Claude apps gateway, to set which pooled group budget pays first for a developer in several groups","H","new",1,"admin",0,[],"claude-apps-gateway"],[10,"Claude apps gateway の任意設定 `login_notice` で、ブラウザ認証ページと Claude Code のサインイン画面にメッセージを表示","Added an optional `login_notice` setting to the Claude apps gateway that shows an operator-defined message on the gateway's browser verification page and on Claude Code's sign-in screen","H","new",1,"admin",0,[],"claude-apps-gateway"],[11,"`CLAUDE_GATEWAY_LOG_FORMAT=json` で Claude apps gateway の運用ログが `severity`・`time`・`message` 付き JSON になる","Added `CLAUDE_GATEWAY_LOG_FORMAT=json` to the Claude apps gateway: operational log lines become JSON with `severity`, `time` and `message`, for log collectors that read the level from a field","H","new",1,"admin",0,[],"claude-apps-gateway"],[12,"別ポリシーの `availableModels` がカスタムモデル ID も許可する場合、Claude apps gateway が起動時に警告する","Added a Claude apps gateway boot warning for a case where another policy's `availableModels` also allows a custom model id that one policy lists by name","H","new",1,"admin",0,[],"claude-apps-gateway"],[13,"`desktopHome` がなく `coworkTabEnabled: false` や `chatSessionRetentionDays` に依存するポリシーに、gateway が起動時警告を出す","Added start-up warnings to the Claude apps gateway for policies with no `desktopHome` that rely on `coworkTabEnabled: false` or `chatSessionRetentionDays`, ahead of Claude Desktop's November 10 change","H","new",1,"admin",0,[],"claude-apps-gateway"],[14,"claude.ai ログイン終了後に `ant auth login` のサインインで継続する場合、Console 組織に課金される旨の警告を表示","Added a warning when your claude.ai login ends and Claude Code continues on the sign-in from `ant auth login`, which bills usage to your Claude Console organization","O","new",2,"cli",0,[],"auth-login"],[15,"`ant auth login` のサインイン使用時、起動時に課金対象の Claude Console 組織名を表示","Added a line at startup naming the Claude Console organization that is billed in a case where Claude Code uses the sign-in from `ant auth login`","O","new",1,"cli",0,[],"auth-login"],[16,"`/tasks` に「Earlier in this session」行が加わり、終了済みサブエージェントを再度開いてメッセージ送信できる(再起動後も可)","Added an \"Earlier in this session\" row to `/tasks` that lists finished subagents, so you can reopen one and message it even after it leaves the list or you restart","A","new",2,"cli",0,[],"subagents"],[17,"クラウドセッションの `/loop` 確認に、タイマーはコンテナと共に停止する旨の注記と、存続するループの提案を追加","Added a note to `/loop` confirmations in cloud sessions that a timer stops with its container, with an offer of a loop that survives","M","new",1,"cli,cloud",0,[],"slash-commands"],[18,"旧ハンドシェイクの MCP サーバーが、新サーバー専用の拡張を宣言していたせいで接続失敗や空の結果になる問題が解消","Fixed MCP servers on the older handshake failing to connect, or returning empty results, because Claude Code declared an extension that it only uses with newer servers","C","fix",2,"cli",0,[],"mcp"],[19,"claude.ai コネクタ上の長時間 MCP ツール呼び出しが `--resume` 後に結果を返さないことがある問題が解消","Fixed a long-running MCP tool call on a claude.ai connector sometimes never reporting its result after `--resume`","C","fix",1,"cli",0,[],"mcp"],[20,"作業フォルダに `HEAD` という名前のファイル/フォルダがあっても、claude.ai とモバイルアプリでセッションの diff が読み込める","Fixed a session's diff failing to load on claude.ai and the mobile apps when the folder Claude Code runs in has a file or folder named `HEAD`","I","fix",1,"cloud,ide",0,[],"web-cloud-sessions"],[21,"git リポジトリ最上位に `HEAD` という名前のファイル/フォルダがあっても `/diff` が「Diff unavailable」にならない","Fixed `/diff` showing \"Diff unavailable\" when a git repository has a file or folder named `HEAD` at its top level","U","fix",1,"cli",0,[],"slash-commands"],[22,"64 ターン以上ファイルを編集したセッションでも `/diff` ペインが空白にならない","Fixed the `/diff` pane opening blank in sessions where 64 or more turns edited files","U","fix",1,"cli",0,[],"slash-commands"],[23,"先頭に空白・タブ・改行がある入力でもスラッシュコマンドがテキスト送信されず実行される","Fixed slash commands typed after a leading space, tab or newline being sent to Claude as plain text instead of running","U","fix",2,"cli",0,[],"slash-commands"],[24,"401 で失敗し続けるリクエストが再試行のたびにログインを更新し、他セッションにも 401 を起こす問題が解消","Fixed a request that kept failing with a 401 refreshing your login on every retry and causing 401s in your other sessions","O","fix",2,"cli",0,[],"auth-login"],[25,"`/context` の視覚グリッド全体が以降のターンで毎回 Claude に送られず、表のみが読まれる","Fixed `/context` sending its full visual grid to Claude on every later turn; Claude now reads only the table","L","fix",2,"cli",0,[],"compaction-context"],[26,"auto mode の `claude -p` で安全チェック不能のため操作が拒否された場合、テキスト/JSON 出力とも終了コード 1 になる","Fixed `claude -p` exiting 0 in auto mode when its actions were refused because no safety check was available: text and JSON output now exit 1","H","fix",3,"sdk",0,[],"auto-mode"],[27,"Linux でネットワークファイルシステム上のプロジェクトを開始時に全ファイル列挙してしまう問題が解消","Fixed a case where Claude Code listed every project file at start on Linux for projects on a network file system (NFS, SMB, Lustre and similar)","O","fix",2,"cli",0,[],"linux"],[28,"モデル変更と auto mode 要求が連続して届いた際に auto mode が誤って拒否される問題が解消","Fixed a case where auto mode was wrongly refused when a client sent a model change and a request for auto mode back to back","T","fix",1,"cli",0,[],"auto-mode"],[29,"サーバー側レビューが届いていないとき、`/status` が「Auto mode server: Enabled」と表示しない","Fixed `/status` showing \"Auto mode server: Enabled\" when the server-side review isn't reaching the session, for example behind an LLM gateway that drops it","T","fix",1,"cli,admin",0,[],"auto-mode"],[30,"サーバーが組織のフィードバックを拒否した後は、Claude 作成のフィードバック・アンケート・`/feedback` が表示されなくなる","Fixed Claude-drafted feedback, surveys and `/feedback` continuing to appear after the server refused feedback for your organization","U","fix",1,"cli",0,[],"feedback"],[31,"送信できないサードパーティゲートウェイでは、Claude がフィードバックを下書きしない","Fixed Claude drafting feedback on third-party gateways, where it can't be sent","U","fix",1,"cli",0,[],"feedback"],[32,"権限ルールや `autoMode` 設定が非常に大きい場合、auto mode が理由を説明し、`autoMode` deny ルールがなければターミナルで確認する","Fixed auto mode refusing actions without saying why when permission rules or `autoMode` settings are very large: it now explains and, unless `autoMode` deny rules are set, asks you in the terminal","T","fix",2,"cli",0,[],"auto-mode"],[33,"クォートされた単語を含むコマンドを Bash の deny/ask ルールが見逃さなくなる","Fixed a case where Bash deny and ask rules missed commands written with quoted words","T","fix",3,"cli,sdk",0,[],"permissions"],[34,"verbose 以外で展開したサブエージェント報告に内部マーカーと出所メモが表示されなくなる","Fixed subagent hand-back reports showing an internal marker and provenance note when expanded outside verbose mode","A","fix",1,"cli",0,[],"subagents"],[35,"`claude -p --resume` で MCP サーバー欠落時も保留中ツール呼び出しを失わず、終了コード 1 で保持し以降の入力を拒否する","Fixed `claude -p --resume` with a prompt losing a deferred tool call when its MCP server is missing: the run now exits 1, keeps the call and refuses later input","H","fix",2,"sdk",0,[],"headless-ci"],[36,"SDK クライアントへ送る情報メッセージのテキスト欠落が解消","Fixed a case where text was dropped from informational messages sent to SDK clients","H","fix",1,"sdk",0,[],"sdk"],[37,"ディスク満杯時、Agent SDK ホストが汎用の終了コードエラーでなく失敗した実行自身のエラーメッセージを受け取る","Fixed a case where Agent SDK hosts got a generic exit-code error instead of a failed run's own error message when the disk was full","H","fix",1,"sdk",0,[],"sdk"],[38,"`CLAUDE_CODE_RESUME_INTERRUPTED_TURN` が、プランモードで中断したターンを別の権限モードで再開した際に再実行しない","Fixed `CLAUDE_CODE_RESUME_INTERRUPTED_TURN` re-running a turn that was interrupted in plan mode when the session resumes in another permission mode","S","fix",1,"cli,sdk",0,[],"sessions-resume"],[39,"Claude Code が書き込んだ直後の数秒以内に行った設定ファイル編集が無視されなくなる","Fixed edits to a settings file being ignored when made within a few seconds of Claude Code writing that file","U","fix",2,"cli",0,[],"settings"],[40,"旧名の設定ファイルが残り設定が隠れる場合、2 つの設定ファイルがあることと使用中のものを stderr に表示","Fixed a config file left at the legacy name hiding your setup with no warning: Claude Code now says on stderr when a home holds two config files, and which is in use","U","fix",2,"cli",0,[],"settings"],[41,"読み取り専用フォルダやバインドマウント先の保存中にディスクが満杯でも `~/.claude.json`・設定・編集ファイルが空や途切れにならない","Fixed `~/.claude.json`, settings and edited files ending up empty or cut off when the disk fills during a save in a read-only folder or to a bind-mounted file (one session saving at a time)","O","fix",2,"cli",0,[],"settings"],[42,"上書き対象を読めない場合に Write がターンを拒否として終了しない","Fixed Write ending the turn as a refusal when it couldn't read the file to overwrite","T","fix",1,"cli",0,[],"read-edit-tools"],[43,"ほぼ即時に終わるバックグラウンド Bash コマンドが完了報告時に出力を失わない","Fixed background Bash commands that finish almost instantly losing their output while being reported as completed","T","fix",2,"cli",0,[],"bash-tool"],[44,"Bash ツールの変更ファイル diff が、コマンド終了直前に書かれたファイルも含む","Fixed the Bash tool's diff of changed files missing a file that the command wrote just before it ended","T","fix",1,"cli",0,[],"bash-tool"],[45,"`opus-5-5` のようなモデル名の打ち間違いで、更新を促さず意図したモデルを提案する","Fixed a mistyped model name, such as `opus-5-5`, telling you to update Claude Code instead of suggesting the model you meant","L","fix",1,"cli",0,[],"model-selection"],[46,"権限確認中にノートブックが変わっても `NotebookEdit` が別のセルを変更しない","Fixed a case where `NotebookEdit` changed the wrong cell when the notebook changed while a permission prompt was open","T","fix",1,"cli",0,[],"read-edit-tools"],[47,"`/login` 成功画面で Enter 後の約 0.5 秒の停止が解消し、即閉じて更新はバックグラウンド実行","Fixed a ~0.5s hang after pressing Enter on the `/login` success screen: the dialog now dismisses immediately and the post-login refresh runs in the background","U","fix",1,"cli",0,[],"auth-login"],[48,"スクリーンリーダーモ OXY_RESOLVES_HOSTS` を設定ファイルで設定できず、プロセス環境で設定する","Changed `CLAUDE_CODE_PROXY_RESOLVES_HOSTS` so that settings files can no longer set it where the host manages the network; set it in the process environment","O","change",2,"admin",1,[],"proxy-network"],[111,"セッションの Bash/PowerShell の ask ルールは、より広い deny ルールが該当すれば確認せず拒否される","Changed a session's exact Bash or PowerShell ask rule to be refused, not asked about, when a broader deny rule covers the command","T","change",2,"cli",1,[],"permissions"],[112,"Bash tool が参照・表示系以外のフラグ付き `which` の実行前に許可を求める","Changed the Bash tool to ask for permission before running `which` with flags outside a lookup/display set","T","change",2,"cli",1,[],"bash-tool"],[113,"`--add-dir` のディレクトリは、そのトラスト確認を承認後にのみ plugin marketplace を登録する","Changed `--add-dir` directories to register plugin marketplaces only once that directory's own trust dialog has been accepted","M","change",2,"cli,mod-dev",1,[],"plugins-mods"],[114,"Bash sandbox 有効時、起動フォルダ配下の `.claude/skills` の skill は、そこで起動または `/cd` した場合のみ読み込まれる","Changed nested skill loading: with the Bash sandbox on, skills in `.claude/skills` folders below the starting folder load only if you start Claude Code there or `/cd` there","M","change",2,"cli",1,[],"skills"],[115,"自己ペース `/loop` は再スケジュールなしでターンが終わると終了し、旧挙動は `CLAUDE_CODE_LOOP_KEEPALIVE=1` で維持","Changed self-paced `/loop` to end when a turn finishes without rescheduling, instead of scheduling a fallback wakeup; set `CLAUDE_CODE_LOOP_KEEPALIVE=1` to keep the old behavior","M","change",2,"cli",1,[],"slash-commands"],[116,"新規メッセージによる中断後に終わるツール呼び出しでも PostToolUse hook が最大10秒で実行される","Changed PostToolUse hooks to run, with up to 10 seconds to finish, on tool calls that finish after a new message interrupts the turn","M","change",2,"mod-dev",0,[],"hooks"],[117,"safeguard がサブエージェントを止めた後は、自分で作業せず狭いプロンプトで再試行するかユーザーに伝えるよう指示される","Changed what Claude is told after safeguards stop a subagent: retry with a narrower prompt or tell you, instead of doing the work itself","A","change",2,"cli",0,[],"subagents"],[118,"cloud セッションで新 worker へ移る際、deny/ask を維持できないとセッション限定 allow ルールが破棄され再確認される場合がある","Changed cloud sessions to drop session-scoped allow rules at a move to a new worker when their deny and ask rules can't all be kept, so you may be asked again","I","change",2,"cloud",1,[],"permissions"],[119,"`ALL_PROXY` のみ設定時は TLS 検査プロキシの証明書自動修復が動かない。`HTTPS_PROXY` に http:// URL を設定する","Changed the automatic certificate repair behind a TLS-inspecting proxy: it no longer runs when `ALL_PROXY` is the only proxy variable set. Set `HTTPS_PROXY` to the proxy's http:// URL instead","O","change",2,"cli,admin",1,[],"proxy-network"],[120,"artifact データベース保存で、各ファイルに隠しマーカーを付け、マーカーのない既存ファイルは触らず報告する","Changed artifact database saves of rows others may have written: each file gets a hidden marker file, and existing files without one, earlier versions' exports among them, are left alone and reported","I","change",1,"cloud",0,[],"artifacts"],[121,"`/claude-api managed-agents-onboard` テンプレートを Console に合わせ、Performance tuner 削除、2件改名、5件で web search/fetch を無効化","Updated `/claude-api managed-agents-onboard` templates to match the Claude Console: removed Performance tuner, renamed two, and turned off web search and fetch in five whose prompts don't use them","H","change",1,"sdk",0,[],"slash-commands"],[122,"組み込み Claude in Chrome ツールから `shortcuts_list` と `shortcuts_execute` を削除","Removed `shortcuts_list` and `shortcuts_execute`, which listed and started shortcuts saved in the extension, from Claude Code's built-in Claude in Chrome tools","C","change",1,"cli",1,[],"chrome-extension"],[123,"gateway が AWS GovCloud と他の上流の混在、および環境内の base URL 変数に対し起動時警告を出す","Gateway: Added startup warnings for upstreams that mix AWS GovCloud with other upstreams, and for base URL variables in the gateway's environment","H","new",1,"admin",0,[],"claude-apps-gateway"],[124,"managed settings のヘッダーで Bedrock guardrail を指定し `bedrock` 上流に `guardrail` がない場合、gateway が起動ログで警告する","Gateway: Added a start-up log warning when managed settings name an Amazon Bedrock guardrail in a header, which the gateway doesn't forward, and no `bedrock` upstream sets a `guardrail`","H","new",1,"admin",0,[],"claude-apps-gateway"],[125,"全上流が Amazon Bedrock のとき、Claude Desktop が常に失敗する web search ツールを提示しない","Gateway: Fixed Claude Desktop offering a web search tool that always failed when every upstream is Amazon Bedrock","H","fix",1,"admin,ide",0,[],"claude-apps-gateway"],[126,"`--use-anthropic-git-proxy` や `--configure-git` の runner は起動チェック失敗時に登録前に終了する","Self-hosted runner: Fixed a runner started with `--use-anthropic-git-proxy` or `--configure-git` registering before a failed startup check made it exit; it now exits first","H","fix",1,"sdk,admin",0,[],"self-hosted-runner"],[127,"`CLAUDE_RUNNER_CHECKOUT_PATH` でセッション内のリポジトリごとに専用フォルダを作り、重複名は `-2`、`-3` を付ける","Self-hosted runner: Changed `CLAUDE_RUNNER_CHECKOUT_PATH` so that each repository in a session gets its own folder: a folder name already taken in the session gets `-2`, `-3`, … at the end","H","change",2,"sdk,admin",1,[],"self-hosted-runner"],[128,"セッション終了時のデバッグログのアップロードを廃止し、失敗時のログは `--remove-session-state` がなければ runner に残る","Self-hosted runner: Removed the end-of-session upload of a session's debug log; a failed session's log stays on the runner host unless `--remove-session-state` is set","H","change",1,"sdk,admin",0,[],"self-hosted-runner"],[129,"5万文字超のプロンプトは黙って切り捨てられず、通知付きで入力欄に残り、超過ペーストは通知付きで拒否される","[VSCode] Fixed prompts over 50,000 characters being cut off silently: the prompt now stays in the chat box with a notice, and a paste over the limit is refused with a notice","I","fix",2,"ide",0,[],"vscode"],[130,"アンケートや「Report a problem」ボタンのクリックで未完成のプロンプトが送信されない","[VSCode] Fixed a click on the survey or \"Report a problem\" buttons sending the unfinished prompt","I","fix",1,"ide",0,[],"vscode"],[131,"Web タブから開いた cloud セッションに、`/clear` や Retry/Edit で消したターンが戻らない","[VSCode] Fixed cloud sessions opened from the extension's Web tab bringing back turns that `/clear`, or Retry or Edit of a typed prompt, had removed","I","fix",1,"ide,cloud",0,[],"vscode"],[132,"拡張機能でリネームしても、削除済みセッションのファイルが復活しない","[VSCode] Fixed a deleted session's file coming back when that session was renamed in the extension","I","fix",1,"ide",0,[],"vscode"],[133,"ウィンドウ再読込後、plan mode で中断した手順が別の権限モードで復帰すると通知付きで停止し、未承認プランを実行しない","[VSCode] Fixed Claude carrying out an unapproved plan after a window reload: a step interrupted in plan mode now stops with a notice when the session comes back in another permission mode","I","fix",3,"ide",0,[],"vscode"],[134,"Claude apps gateway 配下の「未サインイン」表示がエラー風になり Sign in リンクが付く","[VSCode] Improved the \"not signed in\" message behind a Claude apps gateway: it now looks like an error and has a Sign in link","I","improve",1,"ide,admin",0,[],"vscode"],[135,"返信内の Claude サインイン・コネクタ・API 宛リンクは、ブラウザで開かずアドレス付きテキストで表示される","[VSCode] Changed links in Claude's replies that point at Claude sign-in, connector or API addresses to show as text with the address, instead of opening in the browser","I","change",1,"ide",0,[],"vscode"],[136,"ドロップした項目のパスに `/` が非常に長く続くとチャットパネルが固まる問題を解消","[VSCode] Fixed a possible chat panel freeze when a dropped item's path contains a very long run of \"/\" characters","I","fix",1,"ide",0,[],"vscode"],[137,"`claude-vscode.toggleDictation` が使用中のビューだけで動作し、2回目の押下で停止する","[VSCode] Fixed the `claude-vscode.toggleDictation` command starting dictation in every open Claude view at once; it now acts only in the view you are using, and a second press stops it","I","fix",1,"ide",0,[],"vscode"],[138,"閉じられていない `$$` 数式フェンスが多い返信のストリーミング中もチャットパネルが遅くならない","[VSCode] Fixed the chat panel slowing down while a reply with many unclosed `$$` math fences, each shorter than the last, streams in","I","fix",1,"ide",0,[],"vscode"],[139,"診断ツールが大規模ワークスペース向けに問題のないファイルを省き、コンパクトな JSON を返し、最小重大度を指定できる","[VSCode] Improved the chat panel's diagnostics tool for large workspaces: it leaves out files with no problems, returns compact JSON, and accepts an optional minimum severity","I","improve",1,"ide",0,[],"vscode"],[140,"スケジュールタスクで `memory` という名前のコネクタが落とされず、短い接尾辞付きの名前でマウントされる","[Cloud sessions] Fixed scheduled tasks silently dropping a connector named memory: runs now keep it, mounted under that name plus a short suffix","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[141,"cloud セッションで待機中メッセージの Send now が実行中のバックグラウンドエージェントを終了させない","[Cloud sessions] Fixed Send now on a waiting message in cloud sessions ending running background agents; they now keep running","A","fix",2,"cloud",0,[],"web-cloud-sessions"],[142,"self-hosted 環境のセットアップ停滞警告のリンクが、組織既定または稼働中 runner の環境を優先し名前を示す","[Cloud sessions] Improved the stalled-setup warning on self-hosted environments: its link now prefers your organization's default or an environment with a live runner, and names it","I","improve",1,"cloud,admin",0,[],"web-cloud-sessions"],[143,"GitHub 組織の連携解除で Code Review の All repositories 設定も無効になり、再連携後も手動で戻すまで無効のまま","[Code Review] Changed unlinking a GitHub organization to also turn off its All repositories setting in Code Review; it stays off after you relink until you turn it back on","I","change",2,"admin,cloud",1,[],"code-review"],[144,"チャンネル一覧を読み込み切れなくても、管理者はチャンネル未選択で Claude Tag を起動できる","[Claude Tag] Fixed Claude Tag setup blocking launch when the channel list couldn't fully load; admins can now launch without picking a channel","I","fix",1,"admin",0,[],"claude-tag"],[145,"Claude Tag 接続済み Enterprise 組織の Models 管理ページに、モデル既定値の管理先へ誘導する Claude Tag 行を追加","[Claude Tag] Added a Claude Tag row to the Models admin page for Enterprise orgs with Claude Tag connected, linking to where its model defaults are managed","I","new",1,"admin",0,[],"claude-tag"],[146,"Claude Tag 管理設定で auto mode の allow ルールを保存しても他の管理者の変更を上書きせず、拒否メッセージを表示する","[Claude Tag] Fixed saving auto mode allow rules in Claude Tag admin settings overwriting another admin's changes; the save is now refused with a message","I","fix",2,"admin",0,[],"claude-tag"]]},{"v":"2.1.318","date":"2026-11-04（水）06:55","dshort":"11-04 06:55","nb":6,"head":"共有ネットワークホームでの設定破損対策と権限まわりの修正が中心","sum":"v2.1.318 は修正が大半で、共有ネットワークホームでの `~/.claude.json` やログイン情報の破損・消失対策が中心です。権限プロンプトへの誤入力、`deniedMcpServers` の適用範囲、claude.ai ログイン期限の表示など、日常操作と管理設定に関わる変更も含みます。クラウドセッション、Remote Control、自己ホスト型ランナーの安定化も多く含まれます。","watch":[{"b":"`deniedMcpServers` の URL 指定が適用される範囲が広がったため、意図せず遮断されるサーバーがないか確認し、コネクタは名前で拒否してください。","r":[61]},{"b":"IDE 内ターミナルで起動しても IDE 拡張が自動でインストール・更新されなくなったため、`/ide` を外部ターミナルから使うか、エディタの拡張機能ビューで更新してください。","r":[56]},{"b":"自己ホスト型ランナーの orchestrator のログ形式が変わったため、`retryable=true:` や `retryable=false:` に一致させているスクリプトを更新してください。","r":[70]},{"b":"「メッセージにフラグが付いたときにモデルを切り替える」を「毎回確認」にしている場合、サブエージェントは切り替えずに停止します。","r":[57]},{"b":"バックグラウンドのサブエージェントは、シェルコマンドを全プロバイダーで 3 分後にバックグラウンドへ移すため、長時間コマンドの実行方法を見直してください。","r":[58]},{"b":"`/claude-api managed-agents-onboard` は新規エージェントの組み込みツールと MCP ツールに既定で `auto` 権限ポリシーを付けるため、不要なら「run without asking」と指定してください。","r":[63]},{"b":"`prompt.submit` で mod が付ける内容がシステムメッセージではなくユーザーのターン内に残るため、この前提の mod は動作を確認してください。","r":[60]},{"b":"`/permissions` の一部画面で Ctrl+C を 2 回押すと終了せず戻る・キャンセルになるため、終了操作として使わないでください。","r":[62]},{"b":"2.1.286 以前で始めた会話を再開した際、以前の思考内容が破棄される場合があります。","r":[64]}],"hl":[{"t":"共有ネットワークホームでの設定保護","b":"共有ネットワークホームでの保存時に、`~/.claude.json`・設定ファイル・保存済みログインが削除・一時的な空化・古い内容への置換に遭いにくくなりました。設定ファイルを更新できないときに `/logout` などが成功と報告する問題も修正されました。","r":[47,48,41,9,10]},{"t":"破損した設定ファイルの扱い","b":"非対話起動で `~/.claude.json` が有効な JSON でない場合、既定値で上書きしなくなりました。起動を失敗させて復元方法を示し、ファイルはそのまま残します。復元コマンドの案内とバックアップ保持も修正されました。","r":[43,44,45,40]},{"t":"claude.ai ログイン失効の把握","b":"`claude auth status` に `loginExpiresAt`、`claude -p` の JSON 結果に `credential_expires_at` が加わりました。テキスト出力では失効の 10 日前から stderr に警告を出し、期限切れ時には再ログインの方法を案内します。","r":[4,5,46]},{"t":"MCP 拒否設定の適用範囲拡大","b":"`deniedMcpServers` の URL 指定が、upstream URL が一致する Anthropic 提供サーバーもブロックするようになりました。クラウドセッションや self-hosted runner のうち、コネクタ自身の URL が渡されるコネクタも対象です。それ以外のコネクタは名前で拒否します。","r":[61]},{"t":"権限画面のキー入力の扱い","b":"メッセージ送信直後や、表示の遅い権限プロンプトが出る前に打ったキーが、権限プロンプトへの回答として扱われなくなりました。`/permissions` の一部画面では、Ctrl+C を 2 回押しても終了せず、戻る・キャンセルになります。","r":[8,62]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"権限プロンプトの誤応答と、再起動後に承認済みシェルコマンドが別フォルダで動く問題を修正しました。macOS の `/bin/bash` での git commit と PR 作成も改善しています。","refs":[8,26,50]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"サブエージェントの停止条件とシェルコマンドのバックグラウンド化の挙動が変わりました。使用上限後のワークフロー再開で完了済みエージェントが再実行される問題と、バックグラウンドシェル詳細の更新も修正しています。","refs":[34,38,57,58,59]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"mod の `$.model.fork` に `effort` を追加し、有効化への回答を記録するようにしました。`claude plugin` のトークン更新保存漏れなども直しています。","refs":[1,3,12,13,25,56,60]},{"a":"S","name":"セッション・履歴・圧縮","dg":"`--continue` で以前の会話が失われる問題や、アイドル圧縮・再起動後の再送、中断ターンの消失などセッション復元まわりを修正しました。","refs":[6,16,21,31,32,64]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP の `deniedMcpServers` の適用範囲が広がりました。`claude mcp add`/`remove` のロック、stdio サーバーの再プローブ、`/mcp` の表示、ツールエラーも改善しています。","refs":[11,14,35,49,61,81]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"Remote Control、クラウドセッション、自己ホスト型ランナー、VS Code 拡張の起動失敗・状態表示・再接続を多数修正しました。クラウドセッションには No repository オプションなどが加わっています。","refs":[22,24,27,28,29,30,52,71,72,73,74,75,76,77,78,79,80,82,83,84]},{"a":"H","name":"headless・SDK・API","dg":"ログイン期限の表示、`allowedProviders` や `forceLoginOrgUUID` に絡む起動拒否の修正、`claude -p` と SDK の結果・出力の修正を含みます。ゲートウェイと自己ホスト型ランナーにも警告やログの追加・改善があります。","refs":[2,4,5,15,18,19,20,39,42,46,55,63,65,66,67,68,69,70]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"リクエストに 20 枚を超える画像があるとき、大きすぎる画像のエラーが API の上限値を表示するようになりました。","refs":[37]},{"a":"U","name":"UI・表示・入力","dg":"使用量通知の繰り返し表示や通知の重複を修正しました。`/permissions` の画面は標準ダイアログに変わり、使用量の追加依頼や You should know の文言も改善しています。","refs":[17,36,51,53,62]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"共有ネットワークホームでの設定・ログイン情報の保存失敗や破損、`NODE_EXTRA_CA_CERTS` の不正ファイルによる接続失敗、バージョン整理が他ユーザーのバイナリを削除する問題などを修正しました。自動更新も、検証時の短い通信失敗を即再試行するようになりました。","refs":[7,9,10,23,33,40,41,43,44,45,47,48,54]}],"skip":"表示の乱れ、通知の重複、まれな環境での起動・接続失敗、エラーメッセージの文言改善など、重要度の低い修正・改善が多数あります。","st":"ok","stale":false,"e":[[1,"mods の書き込み有効化を尋ねたとき、回答の記録を残す","Added a record of your answer when Claude Code asks to turn on the mods it writes in a session","M","new",1,"mod-dev",0,[],"plugins-mods"],[2,"Claude apps gateway の `mantle` upstream で `assume_role` が使え、別 AWS アカウントのロールや開発者別コスト按分に対応","Added `assume_role` on `mantle` upstreams of the Claude apps gateway, for a role in another AWS account and for per-developer AWS cost attribution","H","new",2,"admin,sdk",0,[],"bedrock-vertex"],[3,"mod の `$.model.fork` に `effort` を追加。セッションの effort に関係なく `low` などで実行でき、結果に送信した effort を報告","Added an `effort` option to a mod's `$.model.fork`, so a quick side job can run at `low` whatever effort the session uses; the result reports the effort sent","M","new",2,"mod-dev",0,[],"plugins-mods"],[4,"`claude auth status`（`loginExpiresAt`）と `claude -p` の JSON 結果（`credential_expires_at`）に claude.ai ログインの失効日を追加","Added the date a stored claude.ai sign-in ends to `claude auth status` (`loginExpiresAt`) and to `claude -p` JSON results (`credential_expires_at`)","H","new",2,"cli,sdk",0,[],"auth-login"],[5,"`claude -p` のテキスト出力で、保存済み claude.ai ログイン失効の 10 日前から stderr に警告を 1 行出す","Added a one-line stderr warning to `claude -p` text output, starting 10 days before a stored claude.ai sign-in ends","H","new",2,"sdk",0,[],"auth-login"],[6,"不正なツール呼び出しのリトライが尽きた後、`--continue` で以前の会話が失われなくなる（2.1.314 の退行）","Fixed `--continue` sometimes losing the earlier conversation after a malformed tool call's retries ran out (regression in 2.1.314)","S","fix",2,"cli",0,[],"sessions-resume"],[7,"macOS で多数の Bash コマンド実行中にメモリが増えて停止する問題を解消","Fixed macOS sessions with many running Bash commands stalling while memory grew","O","fix",2,"macos",0,[],"macos"],[8,"メッセージ送信直後や遅い権限プロンプト表示前のキー入力が、権限プロンプトへの回答にならない","Fixed permission prompts being answered by keys typed just after sending a message, or before a slow prompt appeared","T","fix",3,"cli",0,[],"permissions"],[9,"共有ネットワークホームで設定ファイルを更新できないとき、`/logout`・`claude auth logout`・`claude mcp remove` が成功と偽らず、信頼・同意・MCP 設定も黙って失われない","Fixed `/logout`, `claude auth logout` and `claude mcp remove` reporting success, and changes to trust, consent or MCP settings being dropped with no word, when the config file could not be updated on a shared network home directory","O","fix",2,"cli",0,[],"auth-login"],[10,"同じホームで別の端末やホストが同一アカウント・組織に再ログインしても、ジョブが `Not logged in` で終了しない","Fixed jobs exiting with `Not logged in` when another terminal or host signs in again to the same account and organization on the same home","O","fix",2,"cli,sdk",0,[],"auth-login"],[11,"`claude mcp add`/`remove` がロックを取って書き込み、待機するか exit 1 で終了する","Fixed `claude mcp add` and `remove` writing the config without its lock: they now wait for it or exit 1, though another job's save can still replace a saved server","C","fix",1,"cli",0,[],"mcp"],[12,"`claude plugin` コマンドが遅いトークン更新の保存完了まで待つので、次回実行でのサインアウトを防ぐ","Fixed `claude plugin` commands exiting before a slow token refresh was saved, which could sign you out on the next run","M","fix",2,"cli",0,[],"plugins-mods"],[13,"`claude plugin validate` が、`claude plugin marketplace add` で拒否されるカスタム名の marketplace ファイルを通さない","Fixed `claude plugin validate` passing a custom-named marketplace file that `claude plugin marketplace add` rejects","M","fix",1,"mod-dev",0,[],"plugins-mods"],[14,"バージョン確認で終了する stdio MCP サーバーを起動のたびに再確認しない。原因が自身で 3 秒未満に落ちる場合は 7 日間レガシーハンドシェイク固定","Fixed stdio MCP servers that exit on the version probe being re-probed on every start; a server that dies in under 3s for its own reason is also pinned to the legacy handshake for 7 days","C","fix",1,"cli",0,[],"mcp"],[15,"同じマシンの別ログインが保存した `allowedProviders` リストにより起動時にセッションが拒否される問題を解消","Fixed sessions being refused at startup by an `allowedProviders` list that another login on the same machine had stored","H","fix",2,"admin",0,[],"managed-settings"],[16,"アイドル時の compaction が、要約ではない返答で会話を置き換えない","Fixed idle compaction replacing a conversation with a reply that was not a summary","S","fix",2,"cli",0,[],"compaction-context"],[17,"バックグラウンドのサブエージェント実行中に「Now using usage credits」通知が約 30 秒ごとに再表示されない","Fixed the \"Now using usage credits\" notice reappearing about every 30 seconds while a background subagent is running","U","fix",1,"cli",0,[],"subagents"],[18,"失敗するカスタムスラッシュコマンドや Claude 専用のものが、`claude -p` と SDK セッションで出力を表示する","Fixed custom slash commands that fail, or that only Claude can invoke, printing nothing in `claude -p` and SDK sessions","H","fix",2,"sdk",0,[],"slash-commands"],[19,"mod が `turn.step` をフックしているとき、API エラーで返信が途切れた `claude -p`/SDK セッションを成功と報告しない","Fixed `claude -p` and Agent SDK sessions reporting success when an API error cut off a reply while a mod hooked `turn.step`","H","fix",2,"sdk",0,[],"headless-ci"],[20,"headless でモデル変更直後に送ったメッセージが Stop 後も実行され続けず、キュー済みメッセージと同様に取り消し・停止される","Fixed a message sent right after a model change still running after Stop in headless sessions: Stop now cancels or stops it as it would a queued message","H","fix",2,"sdk",0,[],"headless-ci"],[21,"アイドルの非対話セッション終了時に、削除済みセッション記録が最後のプロンプト付きで再作成されない","Fixed a deleted session transcript being re-created with its last prompt when an idle non-interactive session exited","S","fix",1,"sdk",0,[],"sessions-resume"],[22,"更新やバージョン整理で稼働中プロセスのバイナリが消えても、`claude remote-control` ホスト・デーモン・self-hosted runner が新規セッションを開始できる（`spawn ENOENT` 解消）","Fixed `claude remote-control` hosts, the background daemon and self-hosted runners failing to start new sessions (`spawn ENOENT`) after an update or version cleanup removed the binary of a still-running process","I","fix",2,"cloud",0,[],"remote-control"],[23,"別ユーザー所有で稼働中の Claude Code プロセス（`sudo claude` など）を、バージョン整理が停止と誤判定してバイナリを消さない","Fixed a running Claude Code process owned by another user (for example one left by `sudo claude`) being treated as dead by version cleanup, which could delete its binary","O","fix",2,"cli",0,[],"install-update"],[24,"接続失敗後に `/remote-control` がセッションを利用可能と表示しない","Fixed `/remote-control` showing a session as available after a failed connection","I","fix",1,"cloud",0,[],"remote-control"],[25,"`/design revoke` が 404 で失敗したとき成功と報告しない","Fixed `/design revoke` reporting success when the request failed with a 404","M","fix",1,"cli",0,[],"slash-commands"],[26,"self-hosted runner やクラウドセッション再起動後に承認されたシェルコマンドが、要求された場所ではなく開始フォルダで動く問題を解消。入れない場合は実行しない","Fixed a shell command approved after a self-hosted runner or cloud session restart running in the session's start folder, not the folder it was asked in; if that folder can't be entered, it is not run","T","fix",2,"cloud",0,[],"self-hosted-runner"],[27,"クラウドセッション再起動後に承認済みコネクタツールが使えないとき、Claude に伝える","Fixed Claude not being told when an approved connector tool was unavailable after a cloud session restart","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[28,"サービスが数分間アップロードを拒否しても、クラウドセッションがターン途中で停止されない","Fixed cloud sessions being stopped in the middle of a turn when the service refuses uploads for several minutes","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[29,"一部のクラウドセッションで `Setup` hook が `CLAUDE_ENV_FILE` に書いた変数が Bash tool に届く","Fixed variables a `Setup` hook writes to `CLAUDE_ENV_FILE` not reaching the Bash tool in some cloud sessions","I","fix",2,"cloud,mod-dev",0,[],"hooks"],[30,"応答がツール呼び出しで途切れた後や画像・文書が拒否されて除去された後、iPhone アプリがクラウドセッションのターンを終了と誤表示しない","Fixed the iPhone app showing a cloud session's turn as finished while it kept running, after a response was cut off at a tool call or a refused image or document was removed","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[31,"再起動したセッションが、API エラーで失敗したメッセージを後続の新しいメッセージより先に再送しない","Fixed a restarted session re-sending a message that failed with an API error, ahead of the newer message waiting behind it","S","fix",1,"cli",0,[],"sessions-resume"],[32,"大きな画像の読み込み直後やツール呼び出しのリトライ直後の再起動でも、中断されたターンが失われない","Fixed a restarted session dropping its interrupted turn when the restart came right after Claude read a large image or retried a tool call","S","fix",2,"cli",0,[],"sessions-resume"],[33,"`NODE_EXTRA_CA_CERTS` が空・非 PEM・先頭が壊れていても接続が全滅せず、読める証明書を使い stderr に警告","Fixed every connection failing when the `NODE_EXTRA_CA_CERTS` file is empty, not PEM, or starts with a damaged certificate: readable certificates are now used, with a warning on stderr","O","fix",2,"cli",0,[],"proxy-network"],[34,"使用量上限後に再開したワークフローが、完了済みエージェントを再実行しない","Fixed workflows re-running finished agents when resumed after a usage limit","A","fix",1,"cli",0,[],"workflows"],[35,"クラウドセッションの `/mcp` がモデルに使えないツールを数えず、サーバー行に使えるツール数を表示","Fixed `/mcp` in cloud sessions counting tools the model can't use; a server's row now shows how many of its tools are available","C","fix",1,"cloud",0,[],"mcp"],[36,"PushNotification 呼び出しで status を省略したときの通知重複を解消","Fixed a duplicate notification when Claude left the status field out of a PushNotification call","U","fix",1,"cli",0,[],"notifications"],[37,"20 枚超の画像を含むリクエストで画像が大きすぎる場合、常に 2000px と出さず API の上限値を表示","Fixed the error for a too-large image in a request with more than 20 images always saying the limit was 2000px; it now shows the API's limit","L","fix",1,"cli",0,[],"output-rendering"],[38,"バックグラウンドシェル詳細ダイアログを開いている間も実行時間が更新される","Fixed the runtime in background shell details not updating while the dialog is open","A","fix",1,"cli",0,[],"background-tasks"],[39,"mod の `turn.step` hook により、停止した返信が headless 実行で成功扱いになる問題を解消","Fixed a mod's `turn.step` hook making a stopped reply finish as a success in headless runs","H","fix",2,"sdk",0,[],"headless-ci"],[40,"`claude -p` だけ動かすホームで `~/.claude.json` のバックアップが無くなる問題を解消。最後の正常バックアップ削除前に新規取得","Fixed retention cleanup leaving a home that only runs `claude -p` with no `~/.claude.json` backup: it now takes a fresh backup before deleting the last good one","O","fix",1,"sdk",0,[],"settings"],[41,"ネットワークホームの空き容量が尽きても新規ファイルは作れる状況で、保存済みログインが空ファイルに置き換わらない","Fixed the stored login being replaced by an empty file when a network home directory has no room left for data but still takes new files","O","fix",2,"cli",0,[],"auth-login"],[42,"`forceLoginOrgUUID` のあるマシンで、許可された組織の `setup-token` のトークンが起動時に拒否されない","Fixed tokens from `setup-token` being refused at start on machines with `forceLoginOrgUUID`, when the token belongs to a permitted organization","H","fix",2,"admin,sdk",0,[],"auth-login"],[43,"非対話起動が、有効な JSON でない `~/.claude.json` を既定値で上書きしない。起動を失敗させ復元方法を示し、ファイルはそのまま残す","Fixed non-interactive launches replacing a `~/.claude.json` that isn't valid JSON with defaults; the start now fails, says how to restore the file, and leaves it as is (anthropics/claude-code#87551)","O","fix",3,"sdk",0,["https://github.com/anthropics/claude-code/issues/87551"],"settings"],[44,"バックアップの無い空の `~/.claude.json` を破損と報告せず、ファイルが無い場合と同様に起動する","Fixed an empty `~/.claude.json` with no backup being reported as corrupted; Claude Code now starts as it does when the file is missing","O","fix",1,"cli",0,[],"settings"],[45,"破損・欠落した `~/.claude.json` の復元コマンドが、空や途切れたバックアップを指したり読み取り専用ファイルで失敗したりしない","Fixed the restore command printed for a damaged or missing `~/.claude.json` naming an empty or cut-off backup, or failing on a read-only file","O","fix",1,"cli",0,[],"settings"],[46,"claude.ai ログインが期限切れになったときのサインイン失敗でその旨を表示し、`claude -p` では `claude auth login` と `claude setup-token` を案内","Fixed the sign-in failure when a stored claude.ai login reaches its time limit: it now says so, and in `claude -p` names `claude auth login` and `claude setup-token`","H","fix",2,"cli,sdk",0,[],"auth-login"],[47,"共有ネットワークホームで `~/.claude.json`・設定ファイル・保存済みログインが、削除・一時的な空化・古い内容への置換に遭いにくくなった","Improved how `~/.claude.json`, settings files and the stored login survive saves on shared network home directories: they are less often deleted, briefly emptied or replaced by a near-empty or older copy","O","improve",2,"cli",0,[],"settings"],[48,"ネットワークファイルシステムで設定ファイルが誤って無いと報告されたとき再確認し、MCP サーバーや信頼済みフォルダ無しでの起動が減る","Improved sessions on network file systems to look again when the configuration file is wrongly reported as missing, so fewer start without your MCP servers and trusted folders","O","improve",2,"cli",0,[],"settings"],[49,"ツール読み込み前の MCP ツール呼び出しエラーが入力スキーマを返す","Improved MCP tool errors: a call made before the tool is loaded now returns its input schema","C","improve",1,"cli",0,[],"mcp"],[50,"Bash tool が macOS 標準の `/bin/bash` で動くときの git commit と PR 作成の信頼性が向上","Improved the reliability of git commits and pull request creation when the Bash tool runs macOS's built-in `/bin/bash`","T","improve",1,"macos",0,[],"bash-tool"],[51,"使用量上限メニューの「Ask your admin for more usage」が 1 ステップで依頼を送れる","Improved \"Ask your admin for more usage\" in the usage limit menu to send the request in one step","U","improve",1,"cli",0,[],"usage-limits"],[52,"一時停止やスリープ後のリモートセッションの再接続が速くなった","Improved how fast remote sessions reconnect after a pause or sleep","I","improve",2,"cloud",0,[],"remote-control"],[53,"You should know トーストが、端末でしか効かない「press 2」ではなく「try again」と表示","Improved You should know toasts to say \"try again\" instead of \"press 2\", which only works in the terminal","U","improve",1,"ide,cloud",0,[],"output-rendering"],[54,"自動更新でリリース検証中の短時間のネットワーク障害を、次回確認まで待たず即リトライ","Improved auto-update reliability: a brief network failure while verifying a release is now retried right away instead of waiting for the next check","O","improve",1,"cli",0,[],"install-update"],[55,"`claude -p` や SDK アプリが、内容が変わらないとき毎回 `~/.claude.json` を書き換えない","Improved unattended runs (`claude -p`, SDK apps) to stop rewriting `~/.claude.json` on every run when nothing in it changed","H","improve",1,"sdk",0,[],"settings"],[56,"IDE ターミナルで起動しても IDE 拡張を自動インストール・更新しない。外部ターミナルの `/ide` か拡張機能ビューを使う","Changed Claude Code to no longer install or update the IDE extension when started in an IDE terminal; use `/ide` from an outside terminal or your editor's extensions view","M","change",2,"ide,cli",1,[],"vscode"],[57,"「Switch models when a message is flagged」が「Ask each time」のとき、サブエージェントはモデルを切り替えず停止する","Changed subagents to stop instead of switching models when \"Switch models when a message is flagged\" is set to \"Ask each time\"","A","change",2,"cli",1,[],"subagents"],[58,"バックグラウンドのサブエージェントは、全プロバイダーで 3 分経ったシェルコマンドをバックグラウンドへ移し、プロンプトキャッシュの失効を防ぐ","Changed background subagents to move a shell command to the background after 3 minutes on all providers, so the prompt cache doesn't expire while it runs","A","change",2,"cli",0,[],"subagents"],[59,"Bedrock・Vertex・Foundry またはテレメトリ無効時、コールドキャッシュでサブエージェントの進捗要約が保留中の応答を最大 5 分待つことがある","Changed subagent progress summaries on Bedrock, Vertex, Foundry, or with telemetry off: on a cold prompt cache, one can now wait up to 5 minutes for the subagent's pending response","A","change",1,"cli",0,[],"subagents"],[60,"mod が `prompt.submit` で付加する内容は、システムメッセージではなくユーザーのターン内に留まる","Changed what a mod attaches at `prompt.submit` to stay in the user's turn rather than go out as a system message","M","change",2,"mod-dev",1,[],"plugins-mods"],[61,"`deniedMcpServers` の URL 指定が、upstream URL が一致する Anthropic 提供サーバーやクラウド/runner のコネクタもブロック。コネクタは名前で拒否","Changed `deniedMcpServers` URL entries to also block Anthropic-provided servers whose upstream URL matches, and connectors in cloud sessions and on self-hosted runners, where the session is given the connector's own URL; otherwise deny a connector by name","C","change",3,"admin",1,[],"mcp"],[62,"`/permissions` のルール詳細・組み込みルール・削除確認が標準ダイアログになり、Ctrl+C 2 回で終了せず戻る/キャンセルになる","Changed the `/permissions` rule details, built-in rules and delete confirmation views to use the standard dialog; pressing Ctrl+C twice there now goes back or cancels instead of quitting","U","change",2,"cli",0,[],"permissions"],[63,"`/claude-api managed-agents-onboard` が新規エージェントの組み込みツールと MCP ツールに既定で `auto` 権限ポリシーを付ける。解除は「run without asking」","Changed `/claude-api managed-agents-onboard` to give a new agent's built-in tools, and a quickstart template's MCP tools, the `auto` permission policy (\"Judge risky actions\") by default, matching the Claude Console; say \"run without asking\" to opt out","H","change",2,"admin,sdk",1,[],"auto-mode"],[64,"2.1.286 以前で始めた会話の再開時に以前の thinking を保持する 2.1.288 の対応を削除。thinking が破棄されうる","Removed the 2.1.288 fix that kept the model's earlier thinking when resuming a conversation started on 2.1.286 or earlier; that thinking can now be dropped","S","change",1,"cli",0,[],"thinking-effort"],[65,"Gateway: federation（`external_account`）認証ファイルの Google アクセストークンが失効間近のとき、ログに警告","Gateway: Added a log warning when the Google access token from a federation (`external_account`) credentials file is about to expire","H","new",1,"admin",0,[],"gateway"],[66,"Gateway: `listen.trusted_proxies` のログヒントが、接続元アドレスを `X-Forwarded-For` に自ら追加するプロキシだけを列挙するよう案内","Gateway: Improved the log hints about `listen.trusted_proxies`: they now say to list only a proxy that adds the connecting address to `X-Forwarded-For` itself","H","improve",1,"admin",0,[],"gateway"],[67,"Gateway: Bedrock の AWS CountTokens 失敗時の警告が、501 後は gateway ではなく Claude Code が数えると説明し、IAM 拒否時のみ IAM を示す","Gateway: Improved the warning when AWS CountTokens fails on Amazon Bedrock: it says Claude Code, not the gateway, counts after the 501, and points at IAM only when AWS denies access","H","improve",1,"admin",0,[],"bedrock-vertex"],[68,"Self-hosted runner: orchestrator の spawn-runner hook 環境に `CLAUDE_RUNNER_SPAWN_REASON`（`runner_lost`、`resumed` など）を追加","Self-hosted runner: Added `CLAUDE_RUNNER_SPAWN_REASON` to the orchestrator's spawn-runner hook environment: why Anthropic sent the request (e.g. `runner_lost`, `resumed`); unset when none was sent","H","new",1,"admin",0,[],"self-hosted-runner"],[69,"Self-hosted runner: `--release-idle-session-min` が末尾で値なし、または空白のみのとき起動時に警告","Self-hosted runner: Added a startup warning when `--release-idle-session-min` is the last argument with no value (still ignored) or has a value of only spaces (still read as `0`)","H","new",1,"admin",0,[],"self-hosted-runner"],[70,"Self-hosted runner: orchestrator のログ形式変更（`ok session=…` は全レベルで stdout、`reason=…` 追加）。`retryable=true:` 等に一致するスクリプトは要更新","Self-hosted runner: Changed the orchestrator's log lines: `ok session=…` now prints at every log level on stdout (was debug only, stderr) with `reason=…` after `jti=…`, and `nack session=…` ends its fields with `reason=…` after `retryable=…`; update scripts that match `retryable=true:` or `retryable=false:`","H","change",2,"admin",1,[],"self-hosted-runner"],[71,"セッションの作業フォルダが無いとき、紛らわしい「spawn error: ENOENT」ではなくフォルダ名を示すエラーを出す","Remote Control: Fixed a misleading \"spawn error: ENOENT\" when a session's working folder is missing; the error now names the folder","I","fix",1,"cloud",0,[],"remote-control"],[72,"アプリがタイトルを設定しない場合、ターミナル fork の fork のタイトルが「Name (fork 2)」になる","Remote Control: Improved the title a fork of a terminal fork is created with when the app doesn't set one: \"Name (fork 2)\"","I","improve",1,"cloud",0,[],"remote-control"],[73,"組織設定がサインインを拒否するウィンドウが、毎分バックグラウンドで新しい Claude Code プロセスを起動しない","[VSCode] Fixed a window whose sign-in the organization's settings refuse starting a new Claude Code process in the background every minute","I","fix",1,"ide",0,[],"vscode"],[74,"チャットパネルのエラーバナーで長い単語が閉じるボタンを押し出さない","[VSCode] Fixed a long word in the chat panel's error banner pushing its close button out of view","I","fix",1,"ide",0,[],"vscode"],[75,"サインイン状態の確認に失敗したとき、サインイン画面に Claude Code の出力を表示","[VSCode] Improved the sign-in screen to show what Claude Code printed when its sign-in status check fails","I","improve",1,"ide",0,[],"vscode"],[76,"Anthropic ホスト環境のクラウドセッションをリポジトリ選択なし（No repository）で開始できる","[Cloud sessions] Added a No repository option: a cloud session on an Anthropic-hosted environment can now start without picking a repository","I","new",2,"cloud",0,[],"web-cloud-sessions"],[77,"クラウドセッションに一般的な Chrome 名を追加し、Playwright 以外のツールも `google-chrome` や `CHROME_PATH` で組み込み Chromium を見つけられる","[Cloud sessions] Added the usual Chrome names to cloud sessions, so tools other than Playwright can find the built-in Chromium through google-chrome and CHROME_PATH","I","new",1,"cloud",0,[],"web-cloud-sessions"],[78,"環境が削除されメッセージ欄が隠れたクラウドセッションのカードに New session ボタンを追加","[Cloud sessions] Added a New session button to the card shown when a cloud session's environment was deleted, where the message box is hidden","I","new",1,"cloud",0,[],"web-cloud-sessions"],[79,"クラウドセッションで `gh run view --log` や `gh api` のログ要求が、多くの環境で到達不能なリダイレクトではなくログを取得できる","[Cloud sessions] Fixed reading GitHub Actions logs in cloud sessions: `gh run view --log` and `gh api` log requests now get the log in most environments, not an unreachable redirect","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[80,"クラウドと Remote Control セッションの Create PR 失敗メッセージが、Try again ではなく理由か GitHub へのリンクを示す","[Cloud sessions] Improved most Create PR failure messages in cloud and Remote Control sessions: they now give the reason or a link to GitHub instead of saying Try again","I","improve",1,"cloud",0,[],"web-cloud-sessions"],[81,"コネクタ検索結果が、検索はコネクタディレクトリの一部のみを対象とすると Claude に伝える","[Cloud sessions] Changed connector search results to tell Claude that the search covers only part of the connector directory","C","change",1,"cloud",0,[],"web-cloud-sessions"],[82,"同一リポジトリの並列チェックアウトが環境メニューの Remote Control 行で区別でき、各自のフォルダ名を表示","[Remote Control] Fixed side-by-side checkouts of one repository looking identical in the environment menu's Remote Control rows; each now shows its own folder name","I","fix",1,"cloud",0,[],"remote-control"],[83,"Claude Tag 管理設定でキーボードフォーカスとスクリーンリーダー読み上げを改善。接続フォームの Escape で Add ダイアログまで閉じない","[Claude Tag] Fixed keyboard focus and screen reader announcements in Claude Tag admin setup; pressing Escape in the connect form no longer also closes the Add dialog","I","fix",1,"admin",0,[],"claude-tag"],[84,"Code Review 分析ページが、サーバー/ネットワーク障害で 1 回リトライし、その後は空カードではなく Try again バナーを表示","[Code Review] Improved the Code Review analytics page to retry once after a server or network failure, then show a Try again banner instead of empty cards","I","improve",1,"admin",0,[],"code-review"]]},{"v":"2.1.317","date":"2026-11-03（火）08:57","dshort":"11-03 08:57","nb":7,"head":"agent team の権限モード継承と claude -p の整合性を修正","sum":"87 件の大半は修正で、agent team、`claude -p`、自己ホスト runner、Claude apps gateway まわりの不具合解消が中心です。アカウントのメールアドレスを送る前の確認や、Agent SDK の `onFailure: \"block\"` など、安全側に倒す追加もあります。subagent の effort や Read の挙動など、既定の動作が変わる点があります。","watch":[{"b":"実行中のバックグラウンドエージェントへ `SendMessage` すると、実行中のコマンドは停止されずバックグラウンドへ移るため、コマンドの完了待ちを前提にした運用は見直してください。","r":[64]},{"b":"別モデルの subagent と teammate はセッションの effort ではなくそのモデルの保存済みまたは既定の effort を使うため、必要なら各モデルの effort を設定し直してください。","r":[65]},{"b":"Read ツールの「file unchanged since your last Read」stub が廃止され、未変更ファイルの再読込でも内容が返るため、stub を前提にした処理があれば見直してください。","r":[68]},{"b":"終了時に plugin monitor については「Background work is running」の確認が出なくなるため、monitor の稼働中に終了しないかを自分で確認してください。","r":[66]}],"hl":[{"t":"agent team の権限モード継承","b":"リードセッションが手動モードでも、tmux や iTerm2 ペインの teammate が auto mode で起動していた問題が修正されました。バックグラウンドセッションの昇格・退役時に、直前の権限モード変更が失われることがある問題も修正されています。","r":[50,51]},{"t":"入れ子の claude -p を分離","b":"クラウドや self-hosted runner のセッション内で実行した `claude -p` が、そのセッションの ID を共有しなくなりました。self-hosted runner では `CLAUDE_CODE_DISABLE_NESTED_SESSION_ID` を `1` にすると、従来の動作に戻せます。","r":[55,56,9]},{"t":"subagent の effort の決まり方","b":"メインの会話と別のモデルで動く subagent や teammate は、セッションの effort level ではなく、そのモデルの保存済みの effort level か既定値を使うようになりました。事前起動するセッションでプロジェクトの `effortLevel` が無視される問題と、telemetry がオフのとき `ultrathink` が効かない問題も修正されました。","r":[65,13,81]},{"t":"Read の未変更スタブ廃止","b":"Read ツールの「file unchanged since your last Read」スタブが廃止されました。変更されていないファイルをもう一度読むと、その内容が返ります。","r":[68]},{"t":"メールアドレス送信前の確認","b":"Web やシェルのツール呼び出しが、アカウントのメールアドレスをネットワークへ送る前に確認を求めるようになりました。","r":[2]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"ツールと権限まわりの変更です。メールアドレス送信前の確認や subagent 呼び出しの通知を追加し、auto mode と gateway の組み合わせ、権限プロンプトの表示、Grep/Glob の部分結果の扱い、Windows のパス検証を修正しました。","refs":[2,5,11,15,16,19,40,43,54,68,69]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"agent team の修正が中心です。teammate の権限モード継承、削除済み inbox の再作成、再作成した teammate の誤削除、背景セッションの権限モード変更の消失を直しました。","refs":[28,29,50,51,64]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"`/schedule`、`/loop`、`/team-onboarding`、`/artifacts`、`/design-sync` などの機能コマンドを調整しました。意図しない connector の警告追加、guide の誤削除、スケジュールタスクの結果表示の欠落などを直しています。","refs":[1,18,20,21,30,31,32,42,58,66,67]},{"a":"S","name":"セッション・履歴・圧縮","dg":"セッションの保存と復元に関する修正です。`--from-pr`、タイトル消失、古い transcript の削除、compaction 後の「Prompt is too long」、再開時の重複通知を扱い、終了時の再開ヒントにも起動時のフラグを含めました。","refs":[14,17,27,34,35,39,47,48,60,72]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP と connector の接続まわりの修正です。デスクトップでの MCP 切断、claude.ai connector の誤った認可表示、空の `AWS_BEARER_TOKEN_BEDROCK` の扱い、無効化した MCP サーバーの復活を直しました。","refs":[10,24,37,73]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"Desktop、VSCode 拡張、cloud sessions、Remote Control、Claude Tag の変更です。VSCode では fork 時のメッセージ欠落や起動失敗時のメッセージ消失を直し、cloud sessions ではリンクカード追加とネットワーク secret の上書き防止などを行いました。","refs":[4,49,74,75,76,77,78,79,80,81,82,83,84,85,86,87]},{"a":"H","name":"headless・SDK・API","dg":"headless 実行、self-hosted runner、Claude apps gateway、SDK の変更です。OTel 属性、コスト API、hook の失敗時ブロックを追加し、`claude -p` の終了コード、runner の 5xx やハートビート無応答後の再接続、Bedrock と Foundry のエラー表示を改善しました。","refs":[3,6,7,8,9,12,25,33,36,55,56,57,59,61,62,63,71]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"設定と環境変数の反映に関する変更です。プロジェクトの `effortLevel` が無視される問題と、`DISABLE_PROMPT_CACHING_OPUS`/`DISABLE_PROMPT_CACHING_SONNET` が一部のモデル表記に効かない問題を直しました。別モデルの subagent の effort の扱いも変わりました。","refs":[13,41,65]},{"a":"U","name":"UI・表示・入力","dg":"操作と表示の修正です。スクリーンリーダーの過剰な読み上げ、起動直後の設定編集の未反映、プロンプトでの Ctrl+C が背景エージェントまで止める問題、`/feedback` の表示を直しました。","refs":[22,26,52,53]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"ネットワークと環境依存の修正です。地域やネットワークによる 403 の表示、TLS 検査プロキシでの証明書エラー、OpenTelemetry のプロキシ経由送信、Windows の一時パス長を扱いました。","refs":[23,38,44,45,46,70]}],"skip":"表示の乱れ、VSCode 拡張の細かな不具合、まれな環境や設定の組み合わせでの不具合修正が多数含まれます。","st":"ok","stale":false,"e":[[1,"`/schedule` で意図しないコネクタが付いた新規クラウド定期タスクに警告と外し方を表示","Added a warning to `/schedule` when a new cloud scheduled task gets connectors you did not ask for, with how to remove them","M","new",2,"cli,cloud",0,[],"slash-commands"],[2,"Web/シェルのツール呼び出しがアカウントのメールアドレスをネットワークへ送る前に確認する","Added a check that asks before a web or shell tool call sends your account email address to the network","T","new",2,"cli",0,[],"permissions"],[3,"Agent SDK の hook コールバックに `onFailure: \"block\"` を追加し、失敗時は操作をブロックする","Added `onFailure: \"block\"` for Agent SDK hook callbacks, so a callback that fails blocks the action instead of letting it run","H","new",2,"sdk,mod-dev",0,[],"hooks"],[4,"Claude Desktop の Code タブで、組織の remote managed settings が未読込のときと読込後に通知する","Added a notice in Claude Desktop's Code tab when your organization's remote managed settings haven't loaded for the session, and another once they do","I","new",2,"ide,admin",0,[],"desktop"],[5,"auto mode の判定がサブエージェントのツール呼び出しに答えを出せないとき通知を出す","Added a notice when auto mode's check has no answer for a subagent's tool call, which used to leave nothing in the main view","T","new",2,"cli",0,[],"auto-mode"],[6,"OTel のメトリクス・イベント・スパンに `anthropic.plan` など 4 つの属性を追加","Added `anthropic.plan`, `anthropic.seat_type`, `anthropic.provider` and `anthropic.custom_base_url` to OTel metrics, events and spans","H","new",2,"admin,sdk",0,[],"telemetry"],[7,"Claude apps gateway 管理 API に `GET /v1/organizations/analytics/cost` を追加し、期間・開発者・日・IdP グループ別の過去コストを取得","Added a cost report to the Claude apps gateway admin API, `GET /v1/organizations/analytics/cost`, for reading past spend over a date range in total, per developer, per day or per IdP group","H","new",2,"admin",0,[],"claude-apps-gateway"],[8,"`admin:` 設定の gateway で開発者の IdP グループを日次記録し `admin.identity_retention_days` の間保持、コスト集計の単位にする","Added a daily record of each developer's IdP groups on Claude apps gateways with `admin:` set, kept for `admin.identity_retention_days`, which the cost report groups by","H","new",2,"admin",0,[],"claude-apps-gateway"],[9,"`CLAUDE_CODE_DISABLE_NESTED_SESSION_ID=1` で、セッション内の `claude -p` が従来どおりそのセッションの ID と transcript を使う","Added `CLAUDE_CODE_DISABLE_NESTED_SESSION_ID`: set it to `1` on a self-hosted runner to have `claude -p` run inside a session use that session's ID and transcript, as in earlier versions","H","new",2,"sdk,cloud",0,[],"self-hosted-runner"],[10,"Claude desktop の一部セッションで project/local の MCP サーバーが最初のターン後に切れない","Fixed project and local MCP servers disconnecting after the first turn in some Claude desktop sessions","C","fix",2,"ide",0,[],"mcp"],[11,"LLM gateway が安全性チェックに 403/422 を返しても auto mode が毎ターン失敗しない","Fixed auto mode failing every turn when an LLM gateway set as the base URL answers 403 or 422 to its server-side safety check (a 403 with an apiKeyHelper is unchanged)","T","fix",2,"cli,admin",0,[],"auto-mode"],[12,"`claude auth status` が遅いトークン更新の保存完了を待ち、次回実行でサインアウトされない","Fixed `claude auth status` exiting before a slow token refresh was saved, which could sign you out on the next run","H","fix",2,"cli",0,[],"auth-login"],[13,"アプリが事前起動してからプロジェクトで開くセッションでも、プロジェクトの `effortLevel` が効く","Fixed a project's `effortLevel` setting being ignored by sessions that an app starts ahead of time and then opens in the project, such as new sessions in the desktop app's Code tab","L","fix",2,"ide",0,[],"thinking-effort"],[14,"セッションが多いプロジェクトで、リンク先が古くても `claude --from-pr` が会話を見つける","Fixed `claude --from-pr` reporting \"No conversations found\" in projects with many sessions when the linked session was older than the first page","S","fix",2,"cli",0,[],"sessions-resume"],[15,"同時に出た 2 つ目の権限プロンプトにも claude.ai とモバイルでファイルパス/コマンドを表示","Fixed the second of two simultaneous permission prompts showing no file path or command on claude.ai and the mobile apps","T","fix",2,"cloud",0,[],"permissions"],[16,"Remote Control と SDK ホストが mod のツール呼び出しに「今後確認しない」を出さない","Fixed Remote Control and SDK hosts offering \"don't ask again\" on a mod's tool calls","T","fix",2,"cloud,sdk",0,[],"permissions"],[17,"タイトル生成中に新メッセージや Stop が来ても、クラウド/SDK セッションのタイトルが失われない","Fixed session titles being lost in cloud and SDK sessions when a new message or Stop arrived whi

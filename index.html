hind an open dialog taking keyboard focus, so a key pressed in the dialog could answer it","I","fix",2,"ide",0,[],"vscode"],[170,"Claude Code が見つからない・起動できないとき、サインインや新規セッションが明確な理由を示す","[VSCode] Fixed sign-in and new sessions giving no clear reason when Claude Code cannot find or start its program","I","fix",1,"ide",0,[],"vscode"],[171,"エージェントマップで入れ子のサブエージェントが「Tool calls (0)」にならず、起動したエージェントも正しい親の下に置かれる","[VSCode] Fixed the agent map showing a nested sub-agent with \"Tool calls (0)\" and placing the agents it starts under the main agent","I","fix",1,"ide",0,[],"vscode"],[172,"Continue After Reload が、拡張機能再起動で中断されたステップも、再オープンされたタブで完了する","[VSCode] Improved Continue After Reload: tabs reopened after VS Code restarts its extensions now also finish a step the restart interrupted","I","improve",1,"ide",0,[],"vscode"],[173,"メッセージ内のファイルピルにホバーするとプロジェクトからのパスが出て、同名ファイルを区別できる","[VSCode] Improved file pills in messages: hovering one now shows the file's path from the project folder, so same-named files can be told apart","I","improve",1,"ide",0,[],"vscode"],[174,"メッセージのタイムスタンプが既定で表示される（Claude Code: Show Message Timestamps 設定でオフ可）","[VSCode] Changed message timestamps to show by default (turn them off with the Claude Code: Show Message Timestamps setting)","I","change",1,"ide",0,[],"vscode"],[175,"クラウド環境の環境変数でプロンプト提案をオフにする設定が、新しいクラウドセッションで効く","[Cloud sessions] Fixed turning off prompt suggestions through a cloud environment's environment variables having no effect in new cloud sessions","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[176,"クラウドセッションの作業中インジケーターが、返信完了と同時に止まる","[Cloud sessions] Fixed the working indicator in a cloud session spinning on for several seconds after Claude's reply had finished; it now stops with the reply","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[177,"未実行ルーチンのページで Run now を押すと、History に「No runs yet」ではなく新しい実行が出る","[Cloud sessions] Fixed History on a never-run routine's page still saying \"No runs yet\" after you pressed Run now; it now shows the new run","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[178,"アーカイブ解除したクラウドセッションが、次のメッセージを送るまで作業中に見えない","[Cloud sessions] Fixed an unarchived cloud session looking as if Claude were still working until you sent another message","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[179,"Remote Control を開始した直後のコンピューターが、新規セッションの Remote Control メニューに数秒で表示される","[Remote Control] Fixed a computer that just started Remote Control taking up to a minute to appear in the Remote Control menu of a new session; it now appears within seconds","I","fix",2,"cloud",0,[],"remote-control"],[180,"Slack で `!fast` と送るとスレッドが fast mode になり（必要なら Opus に移行）、`!fast off` で戻せる","[Claude Tag] Added fast mode in Slack: mention Claude with `!fast` to switch a thread to fast mode, moving it to Opus if needed, and `!fast off` to switch back; replies show (fast) while it's on","I","new",2,"cloud",0,[],"claude-tag"],[181,"access bundle のカスタム接続に任意の Path prefixes を指定し、許可ルールを特定パスだけに限定できる","[Claude Tag] Added the optional Path prefixes field when creating a custom connection in an access bundle, so its allow rule can cover only those paths instead of the whole host","I","new",1,"cloud,admin",0,[],"claude-tag"],[182,"Claude Tag Admin 権限のメンバーが、Activity ページの Memory タブでワークスペースとチャンネルの memory を読める","[Claude Tag] Fixed members with the Claude Tag Admin permission getting \"Couldn't load memory files\" on the Activity page's Memory tab; they can now read workspace and channel memory","I","fix",1,"cloud,admin",0,[],"claude-tag"],[183,"ワークスペースゲストが Slack の設定カードで Confirm を押しても全員のボタンが消えず、拒否はゲストにだけ表示される","[Claude Tag] Fixed a workspace guest's Confirm on a Claude settings card in Slack removing its buttons for everyone; only the guest sees the refusal, and members can still confirm or cancel","I","fix",2,"cloud",0,[],"claude-tag"],[184,"Slack チャンネルの定期ルーチンが、新規セッションごとに現在の既定モデルで実行される","[Claude Tag] Fixed scheduled routines in Slack channels running on a model other than the channel's default; each run that starts a new session now uses the current default model","I","fix",1,"cloud",0,[],"claude-tag"],[185,"チャンネル名ルールで付けた access bundle の GitHub リポジトリが、対象チャンネルで追加・一覧・clone できる","[Claude Tag] Fixed GitHub repositories in an access bundle attached by a channel-name rule being refused in the channels the rule covers; Claude can now add, list and clone them there","I","fix",1,"cloud,admin",0,[],"claude-tag"],[186,"自分の Claude プランの使用上限到達を DM で数秒以内に通知し、リセット時刻も示す","[Claude Tag] Improved Claude's notice in your direct messages when your own Claude plan's usage limit is reached: it shows within seconds and says when the limit resets","I","improve",1,"cloud",0,[],"claude-tag"],[187,"従来の Claude in Slack アプリがセッション開始に失敗したとき、原因と対応できる人を示す（全文はスレッドごとに 1 回）","[Claude Tag] Improved the earlier Claude in Slack app's reply when it can't start a session: it now says what failed and who can fix it, in full only once per thread","I","improve",1,"cloud",0,[],"claude-tag"],[188,"チャンネル指示の上限がバイトではなく 8,192 文字になり、Configure ページの Save 横に文字数が出る","[Claude Tag] Changed the channel instructions limit to 8,192 characters instead of bytes, so non-English text gets the same room, and added a character count beside Save on the Configure page","I","change",1,"cloud,admin",0,[],"claude-tag"],[189,"ブロッキングなレビューコメントが、重大度と矛盾する「nit」ラベルで始まらない","[Code Review] Fixed blocking review comments sometimes opening with a \"nit\" label that contradicted their severity","I","fix",1,"cloud",0,[],"code-review"],[190,"Code Review をオフにした組織で、fork や Manual モードの PR に「@claude review」のヒントが投稿されない","[Code Review] Fixed tips to comment \"@claude review\" being posted on fork and Manual-mode pull requests in organizations that have turned Code Review off","I","fix",1,"cloud,admin",0,[],"code-review"]]},{"v":"2.1.289","date":"2026-10-04（日）05:12","dshort":"10-04 05:12","nb":0,"head":"権限ルール回避の修正と mod・プラグイン描画の安定化","sum":"このリリースは、deny/ask ルールが特定条件で効かなくなる問題の修正が中心で、サンドボックス自動許可や管理環境を使う開発者に効く。あわせて mod とプラグインの描画失敗がセッション全体に波及する問題を多数修正している。端末のフリーズや表示崩れの修正も含む。","watch":[],"hl":[{"t":"Bash の deny/ask 漏れを修正","b":"サンドボックス自動許可時に、環境変数プレフィックスや変数代入の後ろにあるコマンドで deny/ask ルールが適用されない問題を修正した。`TZ=\"$HOME\" rm -rf build` のような形が対象。","r":[14,15]},{"t":"管理環境での権限保持","b":"管理対象マシンで、複合シェルコマンドの入れ子部分にある deny/ask ルールが、ユーザー導入 mod の承認より優先されない問題を修正した。","r":[1]},{"t":"`Read` deny のシンボリックリンク対応","b":"IDE で @ メンションされたファイル、変更されたファイル、選択されたファイルがシンボリックリンク経由の場合に、`Read` の deny ルールが適用されない問題を修正した。","r":[3]},{"t":"組織管理 MCP の保護","b":"ユーザー導入のプラグインが、組織管理 MCP サーバーのサインインツールの説明を書き換えられる問題を修正した。","r":[10]},{"t":"mod 描画失敗の影響範囲を限定","b":"mod の `ui.render` フックや `Client` の描画失敗でセッションが終了したり、周囲の描画が巻き込まれたりする問題を修正した。失敗は該当部分に限られ、`ui.fault` が発生する。","r":[18,21]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"deny/ask ルールが効かなくなる経路を 5 件修正した。対象は複合コマンド、環境変数プレフィックス、変数代入、シンボリックリンク経由の `Read` である。","refs":[1,3,14,15]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"プラグインの画面ハンドラが非同期で例外を投げても、supervised／background セッションが終了しないようにした。`agent.spawn`、プラグインフックイベント間で共通のエージェント ID、`$.agent.list()` の idle／waiting 状態も追加した。","refs":[12]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"mod とプラグインの描画失敗、ローカルフォルダ由来プラグインの古い表示、アップグレード後最初のセッションで mod が読み込まれない問題などを修正した。`claude plugin validate` の誤動作も直し、失敗時のメッセージを改善した。","refs":[5,6,7,9,11,13,16,17,18,20,21,22,23,24,25,27]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"組織管理 MCP サーバーのサインインツールの説明が、ユーザー導入プラグインから書き換えられないようにした。","refs":[10]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VSCode で、2.1.288 の `claude auth status` の変更を元に戻した。サインアウトが増えていた可能性がある。","refs":[4,26]},{"a":"U","name":"UI・表示・入力","dg":"未閉じの `\u003cscript\u003e` タグや深いネストの `${` による端末フリーズ、公開アーティファクトページのブラウザタブのフリーズを修正した。タブや制御文字による表示崩れも直した。","refs":[2,8,19]}],"skip":"表示の乱れ、プラグイン表示の古さ、まれな起動時フリーズ、エラーメッセージの改善などの細かな修正が 14 件ある。","st":"ok","stale":false,"e":[[1,"managed 環境で、複合シェルコマンドの入れ子部分への deny/ask ルールが、ユーザー導入 mod の承認より優先される","Fixed a deny or ask rule on a nested part of a compound shell command not holding over a user-installed mod's approval on managed machines","T","fix",3,"cli,admin",0,[],"permissions"],[2,"未閉じの `\u003cscript\u003e` や深い `${` 入れ子を含む短いコードブロックでもターミナルが固まらない","Fixed the terminal freezing on short code blocks with many unclosed `\u003cscript\u003e` tags or deeply nested `${` substitutions","U","fix",2,"cli",0,[],"output-rendering"],[3,"IDE で @ メンション・変更・選択されたファイルにシンボリックリンク経由でも `Read` の deny ルールが適用される","Fixed `Read` deny rules not applying to files @-mentioned, changed, or selected in the IDE through a symlink","T","fix",3,"cli,ide",0,[],"read-edit-tools"],[4,"2.1.288 で入った `claude auth status` の変更を元に戻し、サインアウトが増える可能性を解消","[VSCode] Reverted a 2.1.288 change to `claude auth status` that may have made sign-outs more frequent","I","fix",2,"ide",0,[],"vscode"],[5,"plugin コードペインで、ハイライト表示を最終幅で一度だけレイアウトして大きなファイルを速く開く","Improved how quickly large files open in a plugin code pane by laying the highlighted view out once at its final width","M","improve",1,"cli,mod-dev",0,[],"plugins-mods"],[6,"ローカルフォルダ marketplace 由来の plugin で `plugin list`/`eval`/`update` が最新を表示し、symlink の `--plugin-dir` もホットリロードされる","Fixed `plugin list`, `plugin eval` and `plugin update` showing a stale copy of a plugin installed from a local folder marketplace, and hot reload for a symlinked `--plugin-dir`","M","fix",2,"cli,mod-dev",0,[],"plugins-mods"],[7,"アップグレード後の最初のセッションでも、インストール済み mod が読み込まれる","Fixed installed mods not loading in the first session after an upgrade","M","fix",2,"cli,mod-dev",0,[],"plugins-mods"],[8,"フルスクリーンで Background tasks ダイアログを開いても、プロンプト上の plugin 行が古い表示のままにならない","Fixed a plugin's rows above the prompt showing a stale row while the Background tasks dialog was open in fullscreen","U","fix",1,"cli,mod-dev",0,[],"background-tasks"],[9,"リンクが localhost・パス内の `@`・大文字ホスト・`file:` パスでも plugin ペインが描画される","Fixed plugin panes drawing nothing when a link used a localhost address, an `@` in its path, an uppercase host or a `file:` path","M","fix",1,"cli,mod-dev",0,[],"plugins-mods"],[10,"ユーザー導入 plugin が、組織管理 MCP サーバーのサインイン用ツールの説明を書き換えられない","Fixed a user-installed plugin being able to rewrite the descriptions of an organization-managed MCP server's sign-in tools","C","fix",3,"admin,cli",0,[],"mcp"],[11,"plugin が端末の未知の枠線スタイルで Box を描いても、起動時にフリーズや強制終了しない","Fixed a freeze or forced quit at launch when a plugin drew a Box with a border style the terminal does not know","M","fix",2,"cli,mod-dev",0,[],"plugins-mods"],[12,"plugin の画面ハンドラーが非同期に例外を投げても、supervised／background セッションが終了しない","Fixed supervised and background sessions ending when a plugin's on-screen handler threw asynchronously","A","fix",2,"cli,sdk,mod-dev",0,[],"background-tasks"],[13,"高さのない plugin 領域が伸び続けても、インターフェースエラーでセッションが終了しない","Fixed sessions ending with an interface error when a plugin region with no height kept growing","M","fix",2,"cli,mod-dev",0,[],"plugins-mods"],[14,"sandbox 自動許可時、展開値付き環境変数プレフィックス（例: `TZ=\"$HOME\" rm -rf build`）越しのコマンドにも Bash の deny/ask が効く","Fixed Bash deny and ask rules missing a command behind an environment variable prefix with an expanded value (e.g. `TZ=\"$HOME\" rm -rf build`) when the sandbox auto-allows commands","T","fix",3,"cli",0,[],"bash-tool"],[15,"sandbox 自動許可時、コマンド前に単独の変数代入があっても Bash の deny/ask ルールがスキップされない","Fixed a Bash deny or ask rule being skipped under sandbox auto-allow when a bare variable assignment came before the command","T","fix",3,"cli",0,[],"bash-tool"],[16,"フォルダに marketplace マニフェストがあっても `claude plugin validate` が plugin を検証する","Fixed `claude plugin validate` skipping the plugin when the folder also holds a marketplace manifest","M","fix",1,"mod-dev",0,[],"plugins-mods"],[17,"teammates 用 `agent.spawn`、plugin hook イベント共通の agent id、`$.agent.list()` の idle／waiting 状態を追加","Added `agent.spawn` for teammates, one agent id across plugin hook events, and idle and waiting states in `$.agent.list()`","M","new",2,"mod-dev",0,[],"hooks"],[18,"mod の `ui.render` hook が書いた値で行が描画時に例外を出しても、セッションは終了せずエンジンが自前の行を描く","Fixed sessions ending with \"unrecoverable interface error\" when a value a mod's `ui.render` hook wrote made a row throw while drawn; the engine now draws its own row instead","M","fix",2,"mod-dev",0,[],"plugins-mods"],[19,"タブ・不正なエスケープ・C1 制御文字、またはタブと CRLF を含む短い文が下の行に重ね描きされない","Fixed text with a tab, a stray escape and a C1 control, or a short text with a tab and CRLF line endings, drawing over the rows below it","U","fix",1,"cli",0,[],"output-rendering"],[20,"mod のペインやバンドの右寄せ内容が閉じるマークや `[-]` の下に描かれず、端末端から 1 桁内側に保たれる","Fixed right-aligned content in a mod's pane or band drawing under the close mark or `[-]`, which now also keep one column in from the terminal's edge","M","fix",1,"mod-dev",0,[],"plugins-mods"],[21,"描画中に失敗した mod の `Client` が単独で失敗し `ui.fault` を発行、周囲の描画は巻き込まれない","Fixed a mod's `Client` that fails while drawn taking down everything the mod drew around it; it now fails alone and raises `ui.fault`","M","fix",2,"mod-dev",0,[],"plugins-mods"],[22,"`claude plugin validate` が Anthropic marketplace の plugin を失敗扱いにせず、`--json` で正常な `plugin.json` を列挙する","Fixed `claude plugin validate` failing an Anthropic marketplace's own plugin and listing a clean `plugin.json` in `--json`","M","fix",1,"mod-dev",0,[],"plugins-mods"],[23,"描画に失敗した mod のバンドが、下のカードを一時的に退かせない","Fixed a mod's band that fails to draw briefly telling the cards under it to step aside","M","fix",1,"mod-dev",0,[],"plugins-mods"],[24,"メッセージのない plugin コンポーネントの失敗でも、理由が `Error` や空欄にならない","Fixed a failed plugin component showing `Error` or nothing as its reason when the failure carried no message","M","fix",1,"mod-dev,cli",0,[],"plugins-mods"],[25,"mod のバンドやペインの描画失敗時、mod 名と何も描画されなかったことを示す行を表示","Improved the line a mod's author sees when its band or pane fails to draw: it names the mod and says nothing was drawn","M","improve",1,"mod-dev",0,[],"plugins-mods"],[26,"公開 artifact ページで、未閉じ `\u003cscript\u003e` が多い短いコードブロックが閲覧者のブラウザタブを固めたりクラッシュさせない","Fixed published artifact pages freezing or crashing the reader's browser tab on short code blocks with many unclosed `\u003cscript\u003e` tags","I","fix",2,"cloud",0,[],"artifacts"],[27,"端末が描画中に例外を投げても、mod の Client 領域がセッション中ずっと失敗状態にならない","Fixed a mod's Client region staying failed for the whole session after the terminal threw while drawing it","M","fix",2,"mod-dev",0,[],"plugins-mods"]]},{"v":"2.1.288","date":"2026-10-03（土）03:30","dshort":"10-03 03:30","nb":0,"head":"v2.1.288：セッション復元と権限チェックの修正が中心","sum":"v2.1.288 は新機能よりも修正が大半を占めるリリースで、セッションの再開・自動コンパクト・API タイムアウトの扱いが改善されています。Bash の権限チェックや `rm` の確認漏れなど、安全性に関わる修正も含まれます。バックグラウンドコマンドの時間制限の適用範囲が変わるため、CI や SDK 利用者は確認が必要です。","watch":[{"b":"バックグラウンドコマンドの時間制限が無人セッション（`-p`、Agent SDK、CI、クラウド）限定になったため、対話セッションで制限に頼っていた運用は別の手段で止める。","r":[75]},{"b":"クライアント側の auto mode 分類器は Sonnet 5.5 / Opus 5.5 を指す `ANTHROPIC_DEFAULT_SONNET_MODEL` の指定を無視して Claude Sonnet 5 を使うため、分類器の挙動を前提にしている場合は確認する。","r":[76]},{"b":"`claude project purge` は `claude purge` に変わった（旧名も通知付きで動作）ので、スクリプトは新名称へ移行する。","r":[77]},{"b":"`/autocompact` の auto-compact window がモデルごとの保存になったため、モデルを切り替える運用では各モデルで設定を確認する。","r":[79]},{"b":"サーバーが完了を検知できない MCP URL プロンプトは「I'm done, continue」を押すまでツール呼び出しが進まないので、ブラウザでの操作後にこの選択を行う。","r":[80]},{"b":"agents view の `n:` フィルタと Ctrl+F 検索は Enter で最上位の行ではなく名前が最も一致するセッションを開くため、操作前に選択対象を確認する。","r":[78]}],"hl":[{"t":"長い会話と API 中断の修正","b":"応答の途中で API がタイムアウトしても、非対話セッションとサブエージェントは途中の応答から継続します。直前の返信のトークン使用量が 0 と報告された場合も、`Prompt is too long` で失敗せず自動コンパクトされます。","r":[8,9]},{"t":"Bash 権限チェックの穴を修正","b":"bypassPermissions モードやシェルの許可ルール下で、`bash -c` や `sh -c` 内の危険な `rm` が確認なしに実行される問題を修正しました。算術評価される `BASHPID` 代入も、黙って許可されず確認が出ます。","r":[54,28]},{"t":"フック漏れでツール呼び出しをブロック","b":"PreToolUse と PermissionRequest フックは、マッチングの失敗やツール入力の JSON 化失敗時にスキップされていました。今回からその呼び出しはブロックされます。","r":[57]},{"t":"`--resume` の欠落を複数修正","b":"コンパクション直後に復元した内容の欠落、ターン最後の応答が保存されない問題、読み込み中の書き換えによる途中切れを修正しました。2.1.286 以前のセッションで以前の思考が失われる問題も直っています。","r":[10,11,12,13]},{"t":"バックグラウンド時間制限の適用範囲変更","b":"バックグラウンドコマンドの時間制限は、`-p`・Agent SDK・CI・クラウドなどの無人セッションにだけ適用されます。ターミナル、デスクトップアプリ、VS Code のセッションでは制限がなくなります。","r":[75]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"auto mode の分類器まわりでは、長すぎる会話をコンパクトする改善と、Bedrock/Mantle での分類器切り替わりの修正が入りました。サンドボックスの heredoc 承認や Bash プロンプトの理由表示も改善されています。","refs":[15,16,27,28,45,54,55,65,72,76]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"agents view に Ctrl+F の名前検索と Alt+↑/↓ のグループ移動が加わり、`keybindings.json` で再割り当てできます。別セッションへのメッセージ未配信の通知や、プラグイン定義エージェントの設定反映も修正されています。","refs":[6,30,38,48,75,78]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"mods 向けに `$.ui.selection()` が加わり、`/code-review` には `--max-findings` が追加されました。プラグインの LSP プレースホルダー置換、git-subdir インストール、LSP のタイムアウト、`.claude/rules` の Write/Edit 時の読み込みなどが修正されています。","refs":[1,5,20,21,22,23,24,25,26,44,52,56,57,61,89]},{"a":"S","name":"セッション・履歴・圧縮","dg":"`--resume` で内容が欠ける・途中で切れる問題が4件修正されました。","refs":[9,10,11,12,13,77,79]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP サーバーが追加の OAuth スコープを求めたときの再認証プロンプトが加わりました。MCP ツールの二重実行や Claude in Chrome の確認過多なども修正されています。","refs":[4,41,43,62,80]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"クラウドセッション、Cowork、Remote Control、Claude Tag まわりの修正が中心です。クラウドセッションの内蔵 `gh api` は追加と改善があり、モデル復元や Stop 処理の不具合も直っています。","refs":[2,17,18,19,33,40,42,51,69,74,81,82,83,84,85,86,87,88]},{"a":"H","name":"headless・SDK・API","dg":"API タイムアウトの継続処理、構造化出力を無効にする `CLAUDE_CODE_DISABLE_STRUCTURED_OUTPUTS`、OpenTelemetry の記録、無人セッションの再試行、SIGTERM や認証更新まわりの修正が入りました。","refs":[8,14,31,32,34,35,36,37,39,60,73]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"自動コンパクトの失敗修正に加え、`/autocompact` はモデルごとの保存になりました。Claude 3 系での PDF 後の失敗や、初回リクエストの出力上限の扱いも修正されています。","refs":[49,53,58]},{"a":"U","name":"UI・表示・入力","dg":"Ctrl+C で消したプロンプトを Up キーで復元できるようになりました。スクリーンリーダーモードの改善や、フルスクリーンでの異常終了、カーソル位置の修正も含まれます。","refs":[3,7,29,46,59,63,64,66,67,68,70,71]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"`/login` が保存失敗や `--bare` セッションで誤って成功を示す問題を修正しました。Windows で再起動後にキーボードが効かない問題や、npm 自動更新の誤報告も直っています。","refs":[47,50]}],"skip":"表示の乱れ、特定環境での失敗、エラーメッセージや通知文言の調整といった細かな修正・改善が複数あります。","st":"ok","stale":false,"e":[[1,"mods 向けに `$.ui.selection()` を追加し、フルスクリーンで最後に選んだテキストと該当行を返す","Added `$.ui.selection()` for mods: returns the text you last selected in fullscreen mode and, when the selection lies within one transcript row, that row","M","new",2,"mod-dev",0,[],"plugins-mods"],[2,"GitHub CLI の無い cloud sessions に組み込み `gh api` を追加し、制御文字は端末へ出さない","Added a built-in `gh api` to cloud sessions whose image has no GitHub CLI, and fixed the built-in sending control characters from file names, jq filters or GitHub errors to the terminal","I","new",2,"cloud",0,[],"web-cloud-sessions"],[3,"Ctrl+C で消したプロンプトは、空の入力で Up を押すと貼り付けテキストや画像ごと戻る","Added recovery for a prompt cleared with Ctrl+C: pressing Up on the empty prompt brings the draft back, including pasted text and images","U","new",2,"cli",0,[],"prompt-input"],[4,"MCP サーバーがツール呼び出し中に追加の OAuth スコープを求めると再認証を促す","Added a re-authenticate prompt when an MCP server asks for more OAuth scope during a tool call","C","new",2,"cli",0,[],"mcp"],[5,"/code-review に `--max-findings \u003cn\u003e|all` を追加し、指定は `default` を渡すまで再利用される","Added `--max-findings \u003cn\u003e|all` to /code-review to report more or fewer findings than the usual limit; the choice is reused until you pass `--max-findings default`","M","new",2,"cli",0,[],"code-review"],[6,"agents view で Ctrl+F によるセッション名検索と Alt+↑/↓ のグループ移動が可能になり、キー割り当ても変更できる","Added Ctrl+F to find a session by name and Alt+↑/↓ to jump between groups in the agents view; both, and rename, can be rebound in keybindings.json","A","new",2,"cli",0,[],"agents-view"],[7,"screen reader mode で、plan 承認時（Shift+Tab 含む）に新しい permission mode を読み上げる","Added a screen reader mode announcement of the new permission mode when you approve a plan, including with Shift+Tab","U","new",1,"cli",0,[],"screen-reader"],[8,"応答途中の API タイムアウトでも、非対話セッションとサブエージェントは途中の応答から続行し、thinking のみの応答は再試行する","Fixed mid-response API timeouts failing the turn: non-interactive sessions and subagents now continue from the partial response, and thinking-only responses are retried","H","fix",2,"sdk,cli",0,[],"headless-ci"],[9,"直前の返信のトークン使用量が 0 でも、長い会話が \"Prompt is too long\" にならず自動圧縮される","Fixed long conversations failing with \"Prompt is too long\" instead of auto-compacting when the last reply reported zero token usage","S","fix",2,"cli",0,[],"compaction-context"],[10,"`--resume` が、圧縮直後に復元されたファイルなどの文脈を落とさない","Fixed `--resume` sometimes dropping files and other context that a compaction had just restored","S","fix",2,"cli",0,[],"sessions-resume"],[11,"再開したセッションでもターン最後の応答が保存され、次の `--resume` でプロンプトが未回答に見えない","Fixed a resumed session sometimes not saving the last response of a turn, so that the next `--resume` showed the prompt unanswered","S","fix",2,"cli",0,[],"sessions-resume"],[12,"読み込み中に同じセッションがファイルを書き換えても、resume が途中で切れた transcript を読み込まない","Fixed resume occasionally loading a transcript cut short when the same session rewrote the file during the load","S","fix",1,"cli",0,[],"sessions-resume"],[13,"2.1.286 以前で始めた会話を再開しても、モデルの以前の thinking が失われない","Fixed resuming a conversation started on 2.1.286 or earlier dropping the model's earlier thinking","S","fix",1,"cli",0,[],"sessions-resume"],[14,"構造化出力を拒否する Mantle やゲートウェイでもセッションタイトル・メモリ呼び出し・prompt hook が動く。`CLAUDE_CODE_DISABLE_STRUCTURED_OUTPUTS` を追加","Fixed session titles, memory recall and prompt hooks failing on Mantle or behind gateways that reject structured outputs; added `CLAUDE_CODE_DISABLE_STRUCTURED_OUTPUTS` to turn structured outputs off","H","fix",2,"cli,admin",0,[],"bedrock-vertex"],[15,"auto mode の拒否が、Bash 以外のツールでも Bash の権限ルールを案内しない","Fixed auto mode denials pointing Claude at a Bash permission rule when the blocked tool was not Bash","T","fix",1,"cli",0,[],"auto-mode"],[16,"Bedrock/Mantle の auto mode が、旧モデルへのリクエスト後も残りのセッションでローカル分類器に切り替わらない","Fixed auto mode on Bedrock and Mantle switching to the local classifier for the rest of the session after a request to an older model, such as a WebFetch summary or a `sonnet` subagent","T","fix",2,"cli",0,[],"auto-mode"],[17,"新しく選んだモデルで再起動した cloud sessions が、サーバーに拒否されたそのモデルで返信しない","Fixed cloud sessions that restarted on a newly picked model replying with that model after the server refused it","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[18,"未承認 URL の WebFetch 許可が 5 分間未回答でも、Cowork cloud sessions が入力待ち表示のままにならない","Fixed Cowork cloud sessions staying marked as waiting for input after a WebFetch permission prompt for an unapproved URL went unanswered for five minutes","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[19,"別端末で始めた Cowork cloud session にスマホから参加しても、プロンプト候補が表示される","Fixed prompt suggestions not appearing on a phone that joins a Cowork cloud session started on another device","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[20,"Claude Code 再起動前に描画された view で、mod のボタンが別のボタンの動作を実行しない","Fixed a mod's button sometimes running a different button's action when pressed on a view drawn before Claude Code restarted","M","fix",1,"mod-dev",0,[],"plugins-mods"],[21,"解析できない diff を持つ `Code` 要素があっても plugin の pane が空にならず、プレーンなコードとして描画される","Fixed a plugin's pane showing nothing when one `Code` element held a diff that does not parse; it now draws as plain code","M","fix",1,"mod-dev",0,[],"plugins-mods"],[22,"plugin LSP サーバーの `initializationOptions` と `settings` で、`${user_config.*}` と `${CLAUDE_PLUGIN_ROOT}` が置換される","Fixed plugin LSP servers receiving literal `${user_config.*}` and `${CLAUDE_PLUGIN_ROOT}` placeholders in `initializationOptions` and `settings` instead of substituted values or manifest defaults","M","fix",2,"mod-dev",0,[],"plugins-mods"],[23,"worktree で動くサブエージェントで、plugin の `tool.call` hook が Bash を失敗させたりファイル検索先を誤らせたりしない","Fixed a plugin's `tool.call` hook making Bash fail and file searches read the wrong folder in subagents that run in a worktree","M","fix",2,"mod-dev",0,[],"plugins-mods"],[24,"git 2.39 未満でも `git-subdir` plugin のインストールが成功し、不完全な plugin をキャッシュしない","Fixed `git-subdir` plugin installs failing, or caching an incomplete plugin, on older git (before 2.39, e.g. Ubuntu 22.04's 2.34)","M","fix",1,"cli,mod-dev",0,[],"plugins-mods"],[25,"`--plugin-dir` で読み込んだ plugin も `/plugin` に \"Configure options\" を表示する","Fixed plugins loaded with `--plugin-dir` not showing \"Configure options\" in `/plugin`","M","fix",1,"mod-dev",0,[],"plugins-mods"],[26,"plugin の再読み込みや無効化の最中にタイマーや読み取りが動いていても、background sessions が終了しない","Fixed background sessions ending when a plugin was reloaded or disabled while one of its timers or reads was still running","M","fix",2,"mod-dev",0,[],"plugins-mods"],[27,"sandbox auto-allow で、本文が平文と単純な `$VAR` だけの引用符なし heredoc（`python3 \u003c\u003cEOF`）が毎回承認を求めない","Fixed sandboxed heredocs with an unquoted delimiter (`python3 \u003c\u003cEOF`) asking for approval on every run under sandbox auto-allow when the body holds only plain text and simple `$VAR` references","T","fix",1,"cli",0,[],"sandbox"],[28,"シェルが算術評価する値の `BASHPID` 代入は、黙って許可されず事前に確認を求める","Fixed Bash tool permission check to prompt before a `BASHPID` assignment whose value the shell would evaluate as arithmetic, instead of allowing it silently","T","fix",3,"cli",0,[],"bash-tool"],[29,"plugin や mod が prompt 上に行を表示中でも、background tasks ダイアログを開いてフルスクリーンが異常終了しない","Fixed fullscreen sessions exiting with \"unrecoverable interface error\" when opening the background tasks dialog while a plugin or mod showed rows above the prompt","U","fix",2,"cli",0,[],"output-rendering"],[30,"他セッションが保持したメッセージを配信済みと報告せず、未配信と対象セッション名を通知。SDK ではターン途中でも把握できる","Fixed Claude reporting a message to another session as delivered when that session held it: the notice now says it wasn't delivered and names the session, and in SDK sessions Claude can now learn of it mid-turn","A","fix",2,"cli,sdk",0,[],"session-messaging"],[31,"OpenTelemetry の `claude_code.tool.blocked_on_user` span が、`-p`/SDK や PreToolUse hook 承認でも source と decision を正しく報告する","Fixed OpenTelemetry `claude_code.tool.blocked_on_user` spans reporting `unknown` source or decision in `-p` and SDK sessions and for PreToolUse hook approvals","H","fix",1,"sdk",0,[],"telemetry"],[32,"`-p` や中断ターンで未回答のまま終わった permission ask も `tool_decision` イベントを出力する","Fixed permission asks that ended unanswered, in `-p` or on an interrupted turn, emitting no `tool_decision` event","H","fix",1,"sdk",0,[],"telemetry"],[33,"`/compact` 前に送ったメッセージでも、履歴が残っていれば Cowork cloud sessions で Edit と Retry が使える","Fixed Edit and Retry in Cowork cloud sessions refusing a message sent before `/compact` even though its history was still saved","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[34,"`CLAUDE_CODE_RETRY_WATCHDOG` の無人セッションは、長い応答ストリームの失敗後に数時間再試行せず、再度ストリームし 3 回のタイムアウトで諦める","Fixed unattended sessions (`CLAUDE_CODE_RETRY_WATCHDOG`) retrying for hours after a very long response stream failed; Claude Code now streams again, and gives up after three timeouts","H","fix",2,"sdk",0,[],"headless-ci"],[35,"`/login` は認証情報を安全な保存先に保存できなければ失敗を表示し、ログインが反映されない場合は再試行を提示する","Fixed `/login` reporting \"Login successful\" when credentials could not be saved to secure storage; it now shows the failure, and offers a retry when the new login didn't take effect (anthropics/claude-code#73861)","H","fix",2,"cli",0,["https://github.com/anthropics/claude-code/issues/73861"],"auth-login"],[36,"Bedrock の認証情報検索中に Stop しても、フォールバックモデルへ移らずリクエストが終了する","Fixed a Stop during Bedrock credential lookup sometimes moving the session to a fallback model instead of ending the request","H","fix",1,"cli",0,[],"bedrock-vertex"],[37,"他の Claude Code プロセスがサインイン中にノートPCがスリープ復帰しても、`gcpAuthRefresh`/`awsAuthRefresh` のブラウザサインインが二重に開かない","Fixed a second `gcpAuthRefresh`/`awsAuthRefresh` browser sign-in opening when a laptop wakes from sleep while another Claude Code process is signing in","H","fix",1,"cli",0,[],"auth-login"],[38,"agent teams で名前指定された plugin 定義エージェントが、既定値でなく自身の prompt・tools・disallowedTools・effort で動く","Fixed agent teams: a plugin-defined agent spawned by name now runs with its own prompt, tools, disallowedTools and effort instead of the defaults","A","fix",2,"cli",0,[],"agent-teams"],[39,"`timeout` や systemd が SIGCONT を併送しても、headless セッションが SIGTERM を無視しない","Fixed headless (`-p` / SDK) sessions occasionally ignoring SIGTERM when a supervisor such as `timeout` or systemd sends SIGCONT alongside it","H","fix",1,"sdk",0,[],"headless-ci"],[40,"再起動した cloud sessions が、組織の強制モデル一覧で拒否されるモデルを復元しない","Fixed restarted cloud sessions restoring a model that the organization's enforced model list refuses","I","fix",1,"cloud,admin",0,[],"web-cloud-sessions"],[41,"リモートサーバーの結果が 16 MB 超または解析不能でも、MCP ツール呼び出しが二重実行されない","Fixed MCP tool calls sometimes running twice when a remote server's result was over 16 MB or could not be parsed","C","fix",2,"cli",0,[],"mcp"],[42,"Claude Desktop の Code タブのサブエージェントが、`memory` という名前のユーザー設定 MCP サーバーのツールを使える","Fixed subagents in Claude Desktop's Code tab getting none of the tools of a user-configured MCP server named `memory`","I","fix",1,"ide",0,[],"desktop"],[43,"auto mode が使えない場合でも、許可済みサイトで Claude in Chrome がスクリーンショットとページ読み取りごとに確認しない","Fixed Claude in Chrome asking before every screenshot and page read on a site you allowed when auto mode is unavailable (such as with `disableAutoMode` or an older model); typing, navigation and JavaScript still ask","C","fix",2,"cli",0,[],"chrome-extension"],[44,"GitHub SSH キーの無い macOS/Linux でも `claude plugin install` が HTTPS にフォールバックして成功し、通知を表示する","Fixed `claude plugin install` failing for GitHub-source plugins on macOS and Linux machines with no GitHub SSH key: the clone now falls back to HTTPS and prints a notice","M","fix",2,"cli,macos",0,[],"plugins-mods"],[45,"`permissions.blockReadsOutsideWorkingDirectories` が有効でも、git config ファイルへの `sandbox.credentials.files` 指定が効く","Fixed `sandbox.credentials.files` entries on git config files not taking effect while `permissions.blockReadsOutsideWorkingDirectories` is on","T","fix",1,"cli",0,[],"sandbox"],[46,"Team/Enterprise や managed settings 環境で、Artifact tool のスライドやデザイン開始時に組織の design system が反映される","Fixed Claude leaving out your organization's design systems when starting slides or a design with the Artifact tool on Team and Enterprise plans or machines with managed settings","U","fix",1,"cli,admin",0,[],"artifacts"],[47,"Claude Code の自己再起動（gateway 初回サインイン、プロバイダー設定、`/tui`）後も Windows でキーボードが動く","Fixed the keyboard not working on Windows after Claude Code restarts itself (first sign-in to a Claude apps gateway, provider setup, `/tui`)","O","fix",2,"windows",0,[],"windows"],[48,"`tools:` に非常に多くの `Agent(...)` を並べたエージェントの起動時にストールしない","Fixed a stall when launching an agent whose `tools:` lists very many `Agent(...)` entries","A","fix",1,"cli",0,[],"subagents"],[49,"Claude 3 Opus/Sonnet のセッションで PDF 全体を会話に入れても、毎ターン失敗しない","Fixed sessions on Claude 3 Opus and Claude 3 Sonnet failing on every turn after a whole PDF entered the conversation","L","fix",1,"cli",0,[],"pdf-handling"],[50,"npm の自動更新は、ネイティブバイナリの取得に失敗しプレースホルダーの `claude` stub だけの場合に成功と報告しない","Fixed the npm auto-updater reporting success when the platform-native binary failed to download and only the placeholder `claude` stub was installed","O","fix",2,"cli",0,[],"install-update"],[51,"Remote Control のクリーンアップが、接続中や別プロセスが再接続したばかりのセッションをアーカイブしない","Fixed Remote Control cleanup archiving a session that is still connected or was just re-attached by another Claude Code process","I","fix",2,"cloud",0,[],"remote-control"],[52,"`owner/repo` plugin marketplace で SSH と HTTPS の両方が失敗した場合、両方のエラーを最初に試した方を上にして表示する","Fixed `owner/repo` plugin marketplaces showing only the second attempt's error when both the SSH and HTTPS fetch fail; both errors are now shown, with the transport tried first on top","M","fix",1,"cli",0,[],"plugins-mods"],[53,"パス限定の `.claude/rules` とネストした CLAUDE.md が、Write/Edit のファイル作成・変更でも読み込まれる","Fixed path-scoped `.claude/rules` and nested CLAUDE.md files not loading when Write or Edit creates or changes a file in their scope (previously only Read loaded them)","L","fix",2,"cli",0,[],"memory"],[54,"bypassPermissions や shell allow ルール下で、`bash -c`/`sh -c` 内の危険な `rm`（`/` やホーム等）が確認なしに実行されない","Fixed a dangerous `rm` (such as one on `/` or the home directory) inside a `bash -c` or `sh -c` script running without a prompt in bypassPermissions mode or under a shell allow rule (anthropics/claude-code#96300)","T","fix",3,"cli",0,["https://github.com/anthropics/claude-code/issues/96300"],"bash-tool"],[55,"言語サーバーが動的 capability 登録を使う・応答停止しても LSP ツール呼び出しが固まらず、60 秒でタイムアウトする（server ごとに `requestTimeout`）","Fixed LSP tool calls hanging indefinitely when a language server uses dynamic capability registration or stops responding; requests now time out after 60s (per-server `requestTimeout`)","T","fix",2,"cli",0,[],"lsp"],[56,"background agents の実行中は `idle_prompt` の通知 hook が発火しない","Fixed `idle_prompt` notification hooks firing while background agents are still running (anthropics/claude-code#93672)","M","fix",1,"mod-dev",0,["https://github.com/anthropics/claude-code/issues/93672"],"hooks"],[57,"マッチ失敗やツール入力の JSON 化失敗でも PreToolUse/PermissionRequest hook が飛ばされず、その呼び出しはブロックされる","Fixed PreToolUse and PermissionRequest hooks being skipped when matching them failed or the tool's input could not be serialized to JSON; the call is now blocked","M","fix",3,"mod-dev,cli",0,[],"hooks"],[58,"新規環境やモデル切替後の最初のリクエストがサーバー側の出力上限と auto-compact window を使う（最大 1.5 秒待つ場合あり）","Fixed the first request in a fresh environment or after a model switch using the built-in output limit and auto-compact window, not the server's; that request may now wait up to 1.5 seconds","L","fix",1,"cli",0,[],"compaction-context"],[59,"ctrl+enter でキューのメッセージを送った後、Interrupted 行に \"What should Claude do instead?\" のヒントを出さない","Fixed the \"What should Claude do instead?\" hint showing on the Interrupted row after sending queued messages with ctrl+enter","U","fix",1,"cli",0,[],"prompt-input"],[60,"`--bare` セッションの `/login` は、使われないサインインを実行して保存済みログインを置き換えず、有効な認証情報を案内する","Fixed `/login` in a `--bare` session running a sign-in the session never reads, which could replace your saved login; it now says which credentials work","H","fix",2,"cli,sdk",0,[],"auth-login"],[61,"InstructionsLoaded hook がサブエージェントのファイルアクセスでも agent_id と agent_type を含み、ファイルアクセスで読み込まれた rules と nested CLAUDE.md は effort も報告する","Fixed the InstructionsLoaded hook omitting agent_id and agent_type when a subagent's file access loads a rule or nested CLAUDE.md; rules and nested CLAUDE.md files loaded on file access now also report effort","M","fix",1,"mod-dev",0,[],"hooks"],[62,"`claude mcp serve` の Agent ツールが、利用可能なエージェントを返し subagent_type を受け付ける","Fixed the Agent tool in `claude mcp serve` always reporting no available agents and rejecting every subagent_type","C","fix",1,"cli",0,[],"mcp"],[63,"フルスクリーン transcript viewer の検索と `/theme` のカスタム色検索で、端末カーソルが入力文字に追従する","Fixed the terminal cursor not following the typed text in the fullscreen transcript viewer's search and in `/theme`'s custom color search","U","fix",1,"cli",0,[],"output-rendering"],[64,"screen reader mode の `/permissions` で、ルール番号を入力すると検索ボックスを開かずそのルールを選択する","Fixed `/permissions` in screen reader mode: typing a rule's number now picks it instead of opening the search box","U","fix",1,"cli",0,[],"screen-reader"],[65,"auto mode は、会話が長すぎて client 側分類器が確認できない場合、毎回の確認や失敗でなく会話を圧縮する","Improved auto mode: when a conversation grows too long for the client-side safety classifier to review, it is now compacted instead of prompting for, or failing, every tool call","T","improve",2,"cli",0,[],"auto-mode"],[66,"screen reader mode で、削除した単語などの短い通知が次のキー入力か上の表示変化まで残る","Improved screen reader mode: short announcements, such as a deleted word, now stay on screen until your next key press or until something above them on screen changes","U","improve",1,"cli",0,[],"screen-reader"],[67,"screen reader mode で、質問ダイアログの回答済みの質問に枠の横で \"answered\" と読み上げる","Improved screen reader mode: answered questions in question dialogs now say \"answered\" beside their box","U","improve",1,"cli",0,[],"screen-reader"],[68,"組織が usage credit 申請を無効にしている Team/Enterprise メンバー向けの `/usage-credits` メッセージが改善された","Improved the `/usage-credits` message shown to Team and Enterprise members whose organization has turned off usage credit requests","U","improve",1,"admin",0,[],"usage-credits"],[69,"cloud sessions の新規会話の最初のターンが、`alwaysLoad: false` の stdio MCP サーバーを待たない","Improved cloud sessions: a new conversation's first turn no longer waits for a stdio MCP server whose config sets `alwaysLoad: false`","I","improve",1,"cloud",0,[],"web-cloud-sessions"],[70,"\"You should know\" の注記が、判断した主体に応じて「we」「the main agent」「you」を使い分ける","Improved \"You should know\" notes to say \"we\", \"the main agent\" or \"you\" depending on who was responsible for a decision","U","improve",1,"cli",0,[],"you-should-know-notes"],[71,"artifact の DB 書き込みがサイズ上限で拒否された際のエラーが、上限と空き容量を増やす方法を示す","Improved the error for an artifact database write refused at the database's size limit: it now states the limit and what frees space","U","improve",1,"cli",0,[],"artifacts"],[72,"コマンドの一部を実行前に検査できない場合の Bash 権限プロンプトが、より短い理由を表示する","Improved Bash permission prompts to give a shorter reason when part of a command can't be checked before it runs","T","improve",2,"cli",0,[],"bash-tool"],[73,"組み込み `gh api` は、拒否された gh コマンドの `gh api` 相当を表示し、`--paginate` が全ページをたどり、nested `claude` でも消えない","Self-hosted runner: Improved the built-in `gh api`: a refused gh command now prints its `gh api` equivalent, `--paginate` follows every page of a repository's lists, and a nested `claude` no longer removes it","H","improve",1,"sdk,cloud",0,[],"self-hosted-runner"],[74,"Remote Control はサーバー認証情報の期限切れ時、更新中も接続を維持し、サーバー障害で諦めてもセッションを残す","Improved Remote Control's recovery from an expired server credential: sessions stay connected during renewal and are kept if it gives up after a server outage","I","improve",2,"cloud",0,[],"remote-control"],[75,"background command の時間制限は無人セッション（`-p`・SDK・CI・cloud）のみに適用され、端末・desktop・VS Code では無制限","Changed the background command time limit to apply only in unattended sessions (`-p`, Agent SDK, CI, cloud); terminal, desktop app and VS Code sessions have no limit","A","change",3,"cli,sdk",0,[],"background-tasks"],[76,"client 側 auto mode 分類器は、Sonnet 5.5/Opus 5.5 を指す `ANTHROPIC_DEFAULT_SONNET_MODEL` の固定を無視し Claude Sonnet 5 を使う","Changed the client-side auto mode classifier to ignore an `ANTHROPIC_DEFAULT_SONNET_MODEL` pin that names Claude Sonnet 5.5 or Opus 5.5 and use Claude Sonnet 5 instead","T","change",1,"cli",0,[],"auto-mode"],[77,"`claude project purge` を `claude purge` に改名。旧名も通知付きで動く","Changed `claude project purge` to `claude purge`; the old name still works and prints a notice","S","change",1,"cli",0,[],"project-purge"],[78,"agents view の `n:` フィルタと Ctrl+F 検索で、Enter は先頭行でなく名前が最も一致するセッションを開く","Changed the agents view `n:` filter (and Ctrl+F search) so Enter opens the session whose name matches best instead of the top row","A","change",1,"cli",0,[],"agents-view"],[79,"`/autocompact` が auto-compact window をモデルごとに保存し、切り替えても各モデルの設定を保つ","Changed `/autocompact` to save the auto-compact window per model, so each model keeps its own setting when you switch","S","change",2,"cli",0,[],"compaction-context"],[80,"完了を通知できないサーバーの MCP URL プロンプトは、「I'm done, continue」を待ってからツール呼び出しを続ける","Changed MCP URL prompts from servers that can't report when you're done to wait for \"I'm done, continue\" before the tool call continues, so you can finish in the browser first","C","change",2,"cli",0,[],"mcp"],[81,"claude.ai コネクタを認可した後も \"Needs authentication\" のままにならず、MCP servers ダイアログに Check connection が出る","[VSCode] Fixed a claude.ai connector staying on \"Needs authentication\" after you authorize it: the MCP servers dialog now offers Check connection","I","fix",1,"ide",0,[],"vscode"],[82,"任意設定の New Conversation ショートカット（Cmd/Ctrl+N）が、表示中の全 Claude view でなく操作中の view でだけ新規会話を始める","[VSCode] Fixed the opt-in New Conversation shortcut (Cmd/Ctrl+N) starting a conversation in every visible Claude view instead of only the one you are in","I","fix",1,"ide",0,[],"vscode"],[83,"表示中のセッションをアーカイブしても、チャットビューは次の保存済みセッションを再開せず新しい会話を始める","[VSCode] Fixed the chat view resuming the next saved session after you archive the one it shows; it now starts a new conversation instead","I","fix",1,"ide",0,[],"vscode"],[84,"無関係なセキュリティ設定の読み込み中や失敗時も、管理設定の Cloud sessions スイッチがオフに固定されない","[Cloud sessions] Fixed the Cloud sessions switch in Claude Code admin settings staying locked off while an unrelated security setting was loading or had failed to load","I","fix",1,"admin,cloud",0,[],"web-cloud-sessions"],[85,"self-hosted runner の起動中に Stop すると、キュー中のメッセージもキャンセルされ、起動後に実行されない","[Cloud sessions] Fixed pressing Stop while a self-hosted runner was still starting not cancelling the queued message, which could then run once the runner was up","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[86,"自動作成された channel の Claude Tag 管理設定に、必ず失敗する \"Remove this scope\" を表示しない","[Claude Tag] Fixed Claude Tag admin settings offering a \"Remove this scope\" option, which always failed, on channels whose settings were created automatically","I","fix",1,"admin",0,[],"claude-tag"],[87,"Claude が、読んだだけの別 channel の関連 Slack スレッドも追跡し、更新が依存する会話に届く","[Claude Tag] Improved Claude to also follow a related Slack thread in another channel that it only read, so updates there reach the conversation that depends on them","I","improve",1,"cloud",0,[],"claude-tag"],[88,"channel の Configure ページの保存エラーで、指示が長すぎる場合は短縮を促し、アクセス喪失による拒否では再試行を促さない","[Claude Tag] Improved save errors on a channel's Configure page: too-long channel instructions now say to shorten them, and a save refused for lost access no longer says to try again","I","improve",1,"admin",0,[],"claude-tag"],[89,"`claude plugin test` が、古い保存済み設定を読んだだけで mods をリモート無効と報告しない","Fixed `claude plugin test` reporting mods as turned off remotely when it had only read an out-of-date saved setting","M","fix",1,"mod-dev",0,[],"plugins-mods"]]},{"v":"2.1.287","date":"2026-10-02（金）01:59","dshort":"10-02 01:59","nb":6,"head":"1M コンテキスト既定化と権限まわりの安全性修正が中心","sum":"Bedrock・Vertex などで Opus 4.7+ と Fable の既定が 1M コンテキストになり、Bash の書き込み権限の扱いも厳格化されました。リモート／クラウドセッション、MCP、スクリーンリーダーモード、VSCode 拡張の修正が多数を占めます。企業・クラウド利用者と MCP サーバー運用者に影響が大きいリリースです。","watch":[{"b":"2025-11-25 プロトコルの MCP サーバーが更新後に接続できなくなった場合は、その MCP 設定エントリに `\"bareElicitationCapability\": true` を追加してください。","r":[5]},{"b":"Bedrock・Vertex・Foundry・Claude apps gateway で 1M コンテキストが既定になったため、200K に留めたい場合は `CLAUDE_CODE_DISABLE_1M_CONTEXT=1` を設定してください。","r":[79]},{"b":"`Bash` の全体 allow ルールや許可フックでも、ファイルツールが拒否するファイルへの書き込みは確認が出るため、自動化している場合は承認の流れを見直してください。","r":[81]},{"b":"リポジトリ内 symlink 経由で機微ファイルやワークツリー外へ書き込むコマンドは、`~` を含む行でも行き先が表示されて確認待ちになります。","r":[78]},{"b":"MCP サーバーの `alwaysLoad: false` はそのサーバーの全ツールを tool search の背後に遅延させるため、常時読み込みが必要なら設定を確認してください。","r":[83]},{"b":"`claude agents` からの返信はキュー済みメッセージになり、`/stop` 以外のスラッシュコマンドはターン終了後に実行されます。","r":[80]},{"b":"自動モデル切替後も現在の effort レベルが維持されるため、新モデルの既定値を期待している場合は設定を確認してください。","r":[85]},{"b":"Windows・Linux の右クリック貼り付けと Linux の中クリック貼り付けはボタンを離した時点で実行され、離す前にポインタを動かすと取り消されます。","r":[82]},{"b":"スクリーンリーダーモードは行書き込み前の一時停止をしなくなったため、従来の挙動が必要なら `CLAUDE_AX_PREPARK_MS=50` を設定してください。","r":[84]},{"b":"待機中の権限プロンプトは古い順に表示されるようになり、カウントダウン付きのものだけが前面に開きます。","r":[86]},{"b":"VSCode の Claude in Chrome「Enabled by default」は、エディタ自身のセッションも接続するようになりました（ブラウザ操作の前には確認が出ます）。","r":[99]}],"hl":[{"t":"1M コンテキストが既定に","b":"Bedrock、Vertex、Foundry、Claude apps gateway で Opus 4.7+ と Fable が `[1m]` 接尾辞なしで 1M コンテキストを既定で使います。200K に戻すには `CLAUDE_CODE_DISABLE_1M_CONTEXT=1` を設定します。","r":[79]},{"t":"Bash 書き込み権限の厳格化","b":"`Bash` の全体 allow ルールや許可フックでも、ファイルツールが拒否する Anthropic プロファイルストアや認証情報ファイルへの書き込みは確認を求めます。リポジトリ内 symlink 経由の機微ファイル書き込みも、行き先を示して確認待ちになります。","r":[81,78]},{"t":"危険な rm の保護漏れを修正","b":"`/` やホームへの `rm` が、同じコマンドで `~` やワイルドカードのパスへリダイレクトすると常時確認の保護を失う問題を修正しました。","r":[17]},{"t":"MCP の URL プロンプト対応","b":"2025-11-25 プロトコルの MCP サーバーからの URL プロンプト（サインインなど）に対応しました。接続できなくなったサーバーには `bareElicitationCapability` の設定が必要な場合があります。","r":[5]},{"t":"リモート／クラウドの安定化","b":"Remote Control の再接続待ち、ファイル送信のタイムアウトと再試行、大きな画像の送信、compaction 中の再起動による会話消失などを修正しました。","r":[9,47,53,55,69]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"Bash の権限判定が厳格化され、権限プロンプトの表示も整理されました。`__proto__` という名前の MCP ツールで組織の権限上限が落ちる問題や、Linux サンドボックスの不要なハンドル継承も修正されています。","refs":[6,17,22,24,39,71,72,77,78,81,86]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"`claude agents` に `n:\u003ctext\u003e` フィルターが加わり、バックグラウンドセッションの再開や権限プロンプト表示の不具合が直りました。クラウド／SDK セッションで途中追加したリポジトリの skills・plugins の読み込みも修正されています。","refs":[3,20,36,54,80]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"Claude Mods とビルトインの You should know が追加されました。プラグイン側では marketplace のエラー説明、`--sparse` や `git-subdir` のインストール、フック数の表示、`asyncRewake` フックの繰り返し通知などが修正・改善されています。","refs":[1,2,10,37,43,46,48,51,52,62,63,67]},{"a":"S","name":"セッション・履歴・圧縮","dg":"フォルダの CLAUDE.md が再開や compaction 後に二重に添付される問題と、commit attribution の注意書きが compaction 後にツール結果内へ入る問題を修正しました。","refs":[19,26,47,66]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP の URL プロンプトに対応し、大きな結果の扱いやヘッドレスでの起動再試行が改善されました。接続やプロトコルバージョン変更時の不具合も複数修正されています。","refs":[5,13,25,50,57,73,76,83]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"リモート、クラウド、Remote Control、VSCode、Claude Tag、Code Review の修正が中心です。ファイル送信の再試行・ストリーミング、VSCode のバックグラウンド実行追加、GitHub トークン拒否時の fetch/push 失敗修正などがあります。","refs":[7,8,9,49,53,55,56,58,69,70,74,75,87,88,89,90,91,92,93,94,95,96,97,98,99,100,101,102,103,104,105,106]},{"a":"H","name":"headless・SDK・API","dg":"OpenTelemetry の `user_prompt` イベントに `prompt_text` が追加されました。Bedrock / Vertex のモデル確認、SDK や `claude -p` のストリーミング、認証エラー表示などの修正が含まれます。","refs":[4,11,12,16,18,33,35,42,44,60,64,65]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"モデル選択まわりで、Fable の保存既定が最新版に追従するようになりました。`/advisor` の組み合わせ判定、モデル切替時の extended thinking 保持、自動切替時の effort 維持も変わっています。","refs":[14,15,21,79,85]},{"a":"U","name":"UI・表示・入力","dg":"スクリーンリーダーモードの修正が大半で、`/config` や `/memory` の操作性、light テーマのコントラスト、Reduce motion の反映も改善されました。`/feedback` と `/bug` では、事前入力の GitHub issue に直近のエラーメッセージが含まれなくなりました。","refs":[23,27,28,29,30,31,32,34,40,41,45,61,68,82,84]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"HTTP プロキシ配下の `claude remote-control` 登録失敗と、Windows で入力をパイプしたときの Raw mode エラーを修正しました。","refs":[38,59]}],"skip":"表示の乱れ、スクリーンリーダーモードの細かな読み上げ、まれな環境での失敗に関する修正が約 50 件あります。","st":"ok","stale":false,"e":[[1,"Claude Mods により plugins がより深い挙動を変更できる","Added Claude Mods: plugins may now modify deeper behavior","M","new",2,"mod-dev",0,[],"plugins-mods"],[2,"組み込み mod「You should know」が追加され、サブエージェントが見落としを指摘する（`/plugin enable cc-plugin-you-should-know@builtin`）","Added You should know, a built-in mod where a side agent watches your back and flags things you or Claude might miss. Turn it on with `/plugin enable cc-plugin-you-should-know@builtin` (for first-party sessions with telemetry on)","M","new",2,"cli",0,[],"plugins-mods"],[3,"agents ビューに `n:\u003ctext\u003e` フィルタが加わり、セッション名とタスクを絞り込める。Enter で最初の一致を開く","Added an `n:\u003ctext\u003e` filter to the agents view that matches session names and tasks; a filter now shows matches in collapsed sections and Enter opens the first match","A","new",2,"cli",0,[],"agents-view"],[4,"OpenTelemetry の `user_prompt` イベントに `prompt` の複製 `prompt_text` が加わる","Added `prompt_text` to the OpenTelemetry `user_prompt` event, a copy of `prompt` for backends that nest dotted keys; drop or mask it wherever you drop or mask `prompt` (anthropics/claude-code#70763)","H","new",1,"admin,sdk",0,["https://github.com/anthropics/claude-code/issues/70763"],"telemetry"],[5,"2025-11-25 プロトコルの MCP サーバーからの URL プロンプト（サインイン等）に対応。接続できなくなったら `bareElicitationCapability` を設定","Added URL prompts from MCP servers on the 2025-11-25 protocol, for example to sign in. If a server no longer connects after this update, add \"bareElicitationCapability\": true to its MCP config entry","C","new",2,"cli",0,[],"mcp"],[6,"Bash ツールを deny すると PowerShell ツールも無効になる場合、起動時に警告を出す","Windows: Added a startup warning when denying the Bash tool also turns off the PowerShell tool, so Claude has no shell tool","T","new",1,"windows",0,[],"permissions"],[7,"GitHub CLI 未導入の macOS/Linux で、Anthropic 管理 git のセッション向けに組み込み `gh api`（REST のみ）が使える","Self-hosted runner: Added a built-in `gh api` (REST only) for sessions that use Anthropic-managed git on macOS and Linux machines where the GitHub CLI is not installed","I","new",2,"cloud",0,[],"self-hosted-runner"],[8,"ユーザーアカウントを持たないエージェントのリモートセッションでも、組織が許可していれば fast mode が有効になる","Fixed fast mode staying off in remote sessions owned by an agent with no user account, even when the organization allows it","I","fix",1,"cloud",0,[],"fast-mode"],[9,"再接続要求に応答がなくても、30 秒で諦めて再試行し、Remote Control がメッセージを受け取れる","Fixed Remote Control not receiving messages for minutes at a time when a reconnect request got no response; it now gives up after 30 seconds and retries","I","fix",2,"cloud",0,[],"remote-control"],[10,"`asyncRewake` の hook スクリプトが無い場合、壊れた hook は一度だけ報告され Claude を繰り返し起こさない","Fixed hooks configured with `asyncRewake` waking Claude over and over with \"found issues\" notifications when the hook's script file is missing; the broken hook is now reported once","M","fix",1,"mod-dev",0,[],"hooks"],[11,"モデルの応答ストリームが止まっている間も、ツールのハートビートが SDK ホストに届く","Fixed tool heartbeats not reaching SDK hosts while the model's response stream was stalled with no data arriving","H","fix",1,"sdk",0,[],"sdk"],[12,"Bedrock/Vertex の起動時モデル確認が強制された `availableModels` を守り、`/model` が Opus 1 行に潰れない","Fixed Bedrock and Vertex startup model checks ignoring an enforced `availableModels` list, which could collapse `/model` to one Opus row","H","fix",2,"admin,cli",0,[],"bedrock-vertex"],[13,"Chrome に接続できないときも、Claude in Chrome のブラウザ選択に JSON パースエラーが出ない","Fixed the Claude in Chrome browser picker showing a JSON parse error when Chrome could not be reached","C","fix",1,"cli",0,[],"chrome-extension"],[14,"claude.ai ログインで `/model` の Fable を選ぶと、保存される既定が最新の Fable に追従する","Fixed picking Fable in `/model` on a claude.ai login saving the current version's id, so your saved default now follows the newest Fable like Opus and Sonnet do","L","fix",2,"cli",0,[],"model-selection"],[15,"Opus 5.5 と Sonnet 5.5 の切替（`/model`、`opusplan`）で過去の MCP ツール告知が書き換わらず、拡張 thinking が失われない","Fixed switching between Opus 5.5 and Sonnet 5.5 (`/model`, `opusplan`) rewriting earlier MCP tool announcements, which could drop earlier extended thinking","L","fix",2,"cli",0,[],"model-selection"],[16,"thinking で始まる応答の途中で Bedrock Guardrails がブロックしても、API エラーでなくガードレールのメッセージで終わる","Fixed Amazon Bedrock Guardrails blocks that arrive mid-response ending the turn with an API error instead of the guardrail's message when the reply began with thinking","H","fix",1,"cli",0,[],"bedrock-vertex"],[17,"`/` やホームへの危険な `rm` が `~` やワイルドカードへのリダイレクトを伴っても、常に確認する安全策が維持される","Fixed a dangerous `rm` (such as one on `/` or the home directory) losing its always-ask safeguard when the same command also redirected output to a `~` or wildcard path","T","fix",3,"cli",0,[],"permissions"],[18,"返信中にモデルを切り替えた後、`claude -p` と SDK が以降のメッセージごとにフォールバックを繰り返さない","Fixed `claude -p` and SDK sessions repeating a model fallback on every later message after the model was switched while a reply was running","H","fix",1,"sdk",0,[],"headless-ci"],[19,"セッション再開や compaction の後に、フォルダの CLAUDE.md が二重に添付されない","Fixed a folder's CLAUDE.md being attached a second time after resuming a session or after a compaction","S","fix",1,"cli",0,[],"memory"],[20,"エージェント終了で worktree が削除されても、バックグラウンドセッションを `claude agents` から再度開ける","Fixed background sessions that could not be reopened from `claude agents` after the agent exited and removed the worktree the session was started in","A","fix",2,"cli",0,[],"background-tasks"],[21,"`/advisor` の組み合わせ確認が直り、Sonnet 5.5 が Opus 4.7/4.8 を助言でき、API が拒否する advisor は事前に警告される","Fixed `/advisor` pairing checks: Sonnet 5.5 can now advise Opus 4.7 and 4.8, and advisors the API would refuse are flagged up front instead of being silently dropped","L","fix",1,"cli",0,[],"advisor"],[22,"Bash の権限プロンプトが「Contains simple_expansion」等の内部名でなく、平易な説明を表示する","Fixed Bash permission prompts showing internal parser names such as \"Contains simple_expansion\" instead of a plain explanation","T","fix",1,"cli",0,[],"permissions"],[23,"低速な環境で長い会話のスクロールキーを押し続けても、フルスクリーンが回復不能エラーで終了しにくくなる","Fixed a cause of fullscreen sessions on slow or busy machines exiting with \"Claude Code exited after an unrecoverable interface error\" while a scroll key was held in a long conversation","U","fix",2,"cli",0,[],"output-rendering"],[24,"`__proto__` という名前の MCP ツールでも、組織のツール単位の権限上限が無視されない","Fixed organization per-tool permission ceilings being silently dropped for an MCP tool named `__proto__`","T","fix",3,"admin",0,[],"permissions"],[25,"JSON で保存された大きな MCP 結果を Read の offset/limit で分割するよう Claude に指示しなくなる","Fixed Claude being told to page large MCP results saved as JSON with Read's offset and limit, which cannot split one long line","C","fix",1,"cli",0,[],"mcp"],[26,"compaction 後にコミット帰属のリマインダーがツール結果の中に届かない","Fixed the commit attribution reminder being delivered inside a tool result after a compaction","S","fix",1,"cli",0,[],"compaction-context"],[27,"スクリーンリーダーモードで、検索ボックス（/resume、/permissions）とサインインコード欄のカーソルが入力文字の位置に来る","Fixed screen reader mode leaving the cursor away from the typed text in search boxes (such as /resume and /permissions) and sign-in code fields","U","fix",1,"cli",0,[],"screen-reader"],[28,"スクリーンリーダーモードで、/rewind の要約オプションが未入力でも Enter を受け付ける","Fixed screen reader mode refusing Enter with nothing typed on /rewind's summarize options, whose added context is optional","U","fix",1,"cli",0,[],"screen-reader"],[29,"スクリーンリーダーモードで、承認プロンプトに効かない「Tab to amend」を表示しない","Fixed screen reader mode showing a \"Tab to amend\" hint on approval prompts, where Tab does nothing","U","fix",1,"cli",0,[],"screen-reader"],[30,"スクリーンリーダーモードで、/permissions と /mcp の無効な矢印キーや、空メニューでの「Select with numbers」を案内しない","Fixed screen reader mode listing arrow keys that do nothing in /permissions and /mcp, and saying \"Select with numbers\" in empty menus or while a search box has the keys","U","fix",1,"cli",0,[],"screen-reader"],[31,"スクリーンリーダーモードで、ファイル編集の承認プロンプトなどの diff に変更行が読み上げられる","Fixed screen reader mode leaving out the changed lines in file edit approval prompts and other diffs","U","fix",2,"cli",0,[],"screen-reader"],[32,"スクリーンリーダーモードで、`claude --teleport` の進捗画面と MCP フォ は、行き先を示して確認待ちになる（`~` 指定の行も含む）","Changed a shell write through a repo-committed symlink onto a sensitive file or out of the working tree to name where it lands and wait for a person, on lines with a `~` target too","T","change",2,"cli",0,[],"permissions"],[79,"Bedrock・Vertex・Foundry・gateway で Opus 4.7+ と Fable が既定で1Mコンテキスト（`CLAUDE_CODE_DISABLE_1M_CONTEXT=1` で200K）","Changed Opus 4.7+ and Fable to use a 1M context window by default on Bedrock, Vertex, Foundry and the Claude apps gateway, with no `[1m]` suffix (`CLAUDE_CODE_DISABLE_1M_CONTEXT=1` keeps 200K)","L","change",3,"cli,admin",1,[],"model-selection"],[80,"`claude agents` からの返信はキュー済みメッセージになり、実行中に送った `/stop` 以外のスラッシュコマンドは終了後に実行される","Changed replies from `claude agents` to arrive as queued messages; slash commands other than `/stop` sent while a turn is running now run when it ends","A","change",2,"cli",1,[],"background-tasks"],[81,"Bash 全体許可ルールや許可 hook でも、ファイルツールが拒否する場所（認証情報等）への書き込みは実行せず確認する","Changed whole-tool `Bash` allow rules and allowing hooks to prompt for, not run, shell writes to files Claude Code's file tools refuse outright (the Anthropic profile store, the host credentials file)","T","change",3,"cli,admin",1,[],"permissions"],[82,"Windows/Linux の右クリック貼り付けと Linux の中クリック貼り付けはボタンを離した時に実行され、離す前にポインタを外すと取り消せる","Changed right-click paste on Windows and Linux, and middle-click paste on Linux, to happen when the button is released; moving the pointer away before releasing cancels it","U","change",2,"cli,windows",1,[],"prompt-input"],[83,"MCP の `alwaysLoad: false` はそのサーバーの全ツールを tool search の背後に遅延させる","Changed MCP server `alwaysLoad: false` to defer all of that server's tools behind tool search","C","change",2,"sdk,cli",1,[],"mcp"],[84,"スクリーンリーダーモードは行頭で一時停止せず書き込む（`CLAUDE_AX_PREPARK_MS=50` で復元）","Changed screen reader mode to write new or changed lines without first pausing with the cursor at the start of the line; set `CLAUDE_AX_PREPARK_MS=50` to restore the pause","U","change",1,"cli",1,[],"screen-reader"],[85,"フラグ付きメッセージ後の自動モデル切替で、新モデルの既定ではなく現在の effort を維持する","Changed automatic model switches after a flagged message to keep your current effort level instead of the new model's default","L","change",2,"cli",0,[],"thinking-effort"],[86,"待機中の権限プロンプトを古い順に表示し、新規が読んでいるものを覆わない（カウントダウン付きは上に開く）","Changed waiting permission prompts to show oldest first, so a new prompt no longer covers the one you're reading (prompts with a countdown still open on top)","T","change",2,"cli",0,[],"permissions"],[87,"実行中のコマンドやサブエージェントに「Run in background」を追加し、バックグラウンドへ移して作業を続けられる","[VSCode] Added \"Run in background\" to a running command or sub-agent, to move it to the background and keep working","I","new",2,"ide",0,[],"vscode"],[88,"バックグラウンドシェルと Monitor の出力がエージェントマップのカードに表示される","[VSCode] Added the output of background shells and Monitors to their cards in the agent map","I","new",2,"ide",0,[],"vscode"],[89,"返信が大きすぎて保存確認できない時、設定ダイアログがタイムアウトのせいにしない","[VSCode] Fixed settings dialogs blaming a timeout when Claude Code's reply was too large to confirm a save","I","fix",1,"ide",0,[],"vscode"],[90,"サイドバーが取り込んだクラウドセッションを再度開くと新規タブではなくサイドバーを表示する","[VSCode] Fixed reopening a cloud session that the side bar already brought to this machine opening it again in a new tab; the side bar is shown instead","I","fix",1,"ide",0,[],"vscode"],[91,"サイドバーの Web タブが読込後に始めたクラウドセッションも一覧し、読込失敗時は \"Remote server is not connected\" と表示","[VSCode] Fixed the side bar's Web tab not listing cloud sessions started after the window loaded; a failed load now says \"Remote server is not connected\" instead of \"No web sessions yet\"","I","fix",2,"ide",0,[],"vscode"],[92,"リロード後に復元されたタブが、サイドバーで開いている会話に2つ目のプロセスを起動せず「別の場所で開いている」通知を出す","[VSCode] Fixed a tab restored after a reload starting a second Claude process on a conversation the side bar already has open; it now shows the \"still open somewhere else\" notice","I","fix",1,"ide",0,[],"vscode"],[93,"ツール行のファイルリンク、セッション一覧リンク、2つのヒントがリンクとして表示される","[VSCode] Fixed tool-row file links, session-list links and two hints showing in plain text","I","fix",1,"ide",0,[],"vscode"],[94,"メインのターン終了後も、バックグラウンドエージェントの実行中コマンドが失敗表示にならない","[VSCode] Fixed a background agent's still-running command showing as failed once the main turn ended","I","fix",1,"ide",0,[],"vscode"],[95,"コマンドメニューから選んだユーザー独自の `/usage`・`/context` が拡張のダイアログではなく実行される","[VSCode] Fixed a user's own `/usage` or `/context` command opening the extension's dialog instead of running when picked from the command menu","I","fix",1,"ide",0,[],"vscode"],[96,"プランプレビュータブのファイルリンクをクリックすると、チャット同様にファイルが開く","[VSCode] Fixed file links in the plan preview tab doing nothing when clicked; they now open the file like links in chat replies","I","fix",1,"ide",0,[],"vscode"],[97,"WSL などリモートホストで、ツール入出力を開く際に \"Timeout waiting after 1000ms\" で失敗しない","[VSCode] Fixed opening a tool's input or output in an editor tab failing with \"Timeout waiting after 1000ms\" on remote hosts such as WSL when the tab is slow to appear","I","fix",1,"ide,windows",0,[],"vscode"],[98,"Manage plugins ダイアログで、マーケットプレイスの追加・削除・更新の失敗理由が表示される","[VSCode] Improved the Manage plugins dialog: a failed marketplace add, remove or refresh now says what went wrong","I","improve",1,"ide,mod-dev",0,[],"vscode"],[99,"Claude in Chrome の「Enabled by default」が、エディタ自身のセッションも接続する（ブラウザ操作は確認あり）","[VSCode] Changed the Claude in Chrome \"Enabled by default\" switch to also connect the editor's own sessions, which still ask before browser actions","I","change",2,"ide",0,[],"vscode"],[100,"GitHub が新発行トークンを一時拒否しても、fetch/push が失敗しにくくなる","[Cloud sessions] Fixed occasional failures to fetch from or push to GitHub when GitHub briefly refused a newly issued access token","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[101,"GitHub 活動などのバックグラウンドイベントで起動した時、誰も返信待ちでなければ Slack スレッドに失敗警告を投稿しない","[Claude Tag] Fixed Claude posting a failure warning, such as a spend limit notice, in a Slack thread when a background event like GitHub activity woke it and nobody was waiting on a reply","I","fix",2,"cloud",0,[],"claude-tag"],[102,"管理設定の支出上限ページが、チャンネル数の多い組織で新規作成・プライベートチャンネルも表示する","[Claude Tag] Fixed Claude Tag's spend limits page in admin settings leaving out recently created and private channels in organizations with many channels","I","fix",1,"admin,cloud",0,[],"claude-tag"],[103,"長い Slack スレッドで、バックグラウンド作業がタスクリストを新規メッセージとして再投稿せず通知されない","[Claude Tag] Improved Claude's task list in long Slack threads: background work no longer reposts it as a new message on its own, so people following the thread aren't notified","I","improve",1,"cloud",0,[],"claude-tag"],[104,"レビューコメントと「Why this was flagged」が文の途中で切れず、完結した文で終わる","[Code Review] Fixed finding comments and their \"Why this was flagged\" text stopping mid-sentence; they now end on a complete sentence","I","fix",2,"cloud",0,[],"code-review"],[105,"直前コミットで2回失敗したレビューでも、新しい push 後は最新コミットをレビューする","[Code Review] Fixed Code Review skipping a pull request after a new push when its review had failed twice on the previous commit; it now reviews the latest commit","I","fix",2,"cloud",0,[],"code-review"],[106,"会話がロックされた PR の失敗カードに、ロックでレビューできず投稿も課金もないと表示","[Code Review] Improved the failed-review card on a pull request whose conversation is locked: it now says the lock blocked the review and that nothing was posted or charged","I","improve",1,"cloud",0,[],"code-review"]]},{"v":"2.1.286","date":"2026-10-01（木）02:14","dshort":"10-01 02:14","nb":16,"head":"機密マスキング強化とモデル拒否時の再試行を中心とした修正リリース","sum":"v2.1.286 は修正が中心で、ログやエラーメッセージへの機密情報の露出を防ぐ修正と、認証・セッション復元・Remote Control の不具合修正が多く含まれます。`--bare` の挙動変更、plugin インストールの制限、API リトライ上限の変更など、動作が変わる点もあります。VS Code 拡張と cloud sessions、Claude Tag にも多数の変更があります。","watch":[{"b":"`--bare` はコマンドラインで指定した MCP server のみ接続し、system reminder を送らず、バックグラウンドタスクも開始しません。timeout した shell コマンドは停止するため、これらに依存するスクリプトは確認してください。","r":[55]},{"b":"plugin のインストールは git リポジトリやフォルダを指す npm ソースを拒否し、依存関係も registry パッケージからのみ入れます。該当する plugin は registry で公開されたものに切り替えてください。","r":[58]},{"b":"失敗した API リクエストの再試行上限が、モデル呼び出し全体で一つになりました。既定設定では失敗する呼び出しで最大 14 リクエストを送るため、リトライ回数を前提にした運用は見直してください。","r":[54]},{"b":"send-now キー（ctrl+enter）は、skill の shell コマンドを終了せずバックグラウンドへ移します。コマンドを止める目的で使っていた場合は別の方法に切り替えてください。","r":[56]},{"b":"テーマと output style のピッカーでは数字キーによる選択ができなくなりました。矢印キーなどで選んでください。","r":[48,62]},{"b":"VS Code 拡張では Stop と Escape が現在のターンだけを終了し、background agent は動き続けます。止めるには agent map から個別に停止してください。","r":[75]}],"hl":[{"t":"機密情報のマスク漏れ修正","b":"MCP エラーメッセージ、Bearer トークン、ゼロ幅文字を含むキー名、記号を含む URL パスワードなどで、値の一部が露出する問題を修正しました。ログと transcript が対象です。","r":[17,18,19,20]},{"t":"モデル拒否時に前世代で再試行","b":"API が既定モデルやエイリアス先のモデルを拒否すると毎ターン失敗していましたが、同じ tier の一つ前のモデルで一度再試行します。fallback が高速モードで動かせない場合は標準速度で実行します。","r":[9,11]},{"t":"セッション復元とAPI 400の修正","b":"並列ツール呼び出し後にクラッシュした場合、`--resume` と `--continue` でその後のターンが失われる問題を修正しました。ツールや hook がテキスト以外を返したときの API 400 エラーも修正しています。","r":[4,5]},{"t":"認証まわりの不具合修正","b":"認証更新の期限切れ時に複数のプロセスがログイン用ブラウザを開く問題や、macOS で `/login` 後も「Not logged in」と表示される問題を修正しました。`claude auth status` は Console のサインインを `api_key` と報告します。","r":[3,8,13]},{"t":"`--bare` と plugin 導入の制限","b":"`--bare` は接続する MCP server、system reminder、バックグラウンドタスクを絞る挙動に変わりました。plugin のインストールは、git リポジトリやフォルダを指す npm ソースを拒否します。","r":[55,58]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"WebFetch の artifact 読み取りの確認動作が Artifact tool に揃いました。permission prompt の見た目が file edit に統一され、機密マスキングの漏れも複数修正されています。send-now キーの挙動と WebFetch のレート制限エラー文言も変わりました。","refs":[1,18,19,20,42,43,44,57]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"subagent まわりの修正が中心です。task 系ツールの欠落、Workflow の再起動、`/compact` などが main conversation に作用する問題などを直しました。send now は subagent の実行中コマンドをバックグラウンドへ移します。","refs":[26,27,28,29,30,31,32,40,41,56]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"plugin の読み込み失敗の説明が具体的になり、claude.ai で有効な plugin が消える問題も修正されました。`/hooks` は設定済み hook を event ごとの一覧で開きます。`verify` という名前の skill があれば、commit 前の実行が案内されます。","refs":[5,25,37,38,39,47,49,58,61,64]},{"a":"S","name":"セッション・履歴・圧縮","dg":"`--resume` と `--continue` でターンが失われる問題と、`/feedback` の zip に不正な JSON 行が入る問題を修正しました。","refs":[4]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP 関連のエラーメッセージでの認証情報の露出を修正しました。古い handshake を落とした server でツールが表示されない問題や、サインインリンクが無効になる問題も直しています。","refs":[12,17,22,23,24]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VS Code 拡張にブックマーク、質問と回答の表示、選択肢のプレビューが加わりました。Remote Control と cloud sessions では切断・未配信・未応答などの不具合を修正しています。Claude Tag では spend limits ページの機能追加と Slack 連携の修正があります。","refs":[6,10,15,16,36,67,68,69,70,71,72,73,74,75,76,77,78,79,80,81,82,83,84,85,86,87,88]},{"a":"H","name":"headless・SDK・API","dg":"API の再試行上限と `--bare` の挙動が変わりました。ツールや hook が非テキストを返したときの API 400 と、gateway の spend meter の計算誤りも修正されています。","refs":[3,7,13,51,52,54,55]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"モデルが拒否された場合や `--fallback-model` の再試行が、より確実に動作するようになりました。fallback で context window が 1M から 200K に縮むときは、通知に明記されます。","refs":[9,11,33,50]},{"a":"U","name":"UI・表示・入力","dg":"fullscreen のリスト操作（マウス、スクロールバー、列揃え）と、各種ピッカーの見た目が改善されました。permission prompt に「2 of 5」のような件数が表示され、外部エディタは cursor の行で開きます。","refs":[2,14,21,34,35,45,46,48,53,59,60,62,65]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"認証の期限切れ時や `/login` 後の表示に関する不具合を修正しました。`/exit` の Remove worktree は、起動した server や shell を止めてから実行されます。","refs":[8,63,66]}],"skip":"表示の乱れ、文言の調整、特定環境や管理画面での軽微な不具合の修正が約 30 件あります。","st":"ok","stale":false,"e":[[1,"複数の許可リクエストが重なると権限プロンプトに「2 of 5」のような件数を表示","Added a count such as \"2 of 5\" to the permission prompt when several permission requests stack up","T","new",2,"cli",0,[],"permissions"],[2,"フルスクリーンのリストで「N more」行をクリックすると端へジャンプし、hover・押下状態も表示","Added mouse support for the \"N more\" rows of lists in fullscreen mode: click one to jump to that end of the list, with hover and pressed states","U","new",1,"cli",0,[],"fullscreen-mode"],[3,"`gcpAuthRefresh`/`awsAuthRefresh` の期限切れ時、複数プロセスがそれぞれログイン用ブラウザを開かない","Fixed several Claude Code processes and IDE extensions each opening a login browser when gcpAuthRefresh or awsAuthRefresh credentials expire","H","fix",2,"cli,ide",0,[],"auth-login"],[4,"クラッシュや強制終了した前回セッションでも `--resume`/`--continue` が並列ツール呼び出し後のターンを失わない","Fixed `claude --resume` and `--continue` sometimes losing every turn after a batch of parallel tool calls when the earlier session crashed or was killed","S","fix",2,"cli",0,[],"sessions-resume"],[5,"ツールやフックが文字列以外（オブジェクト・数値・真偽値）を返しても API 400 エラーにならない（再開セッションも）","Fixed API 400 errors after a tool or hook returned an object, number or boolean instead of text, including in resumed sessions","M","fix",2,"cli,mod-dev",0,[],"hooks"],[6,"履歴が非常に大きいクラウドセッションが、読み込み中にコンテナ停止されず正常に起動する","Fixed cloud sessions with very large histories never waking up because the container was stopped while the transcript was still loading","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[7,"Claude apps gateway の利用額メーターが 1 時間キャッシュ書き込みと server-side tool のトークンを正しく計上","Fixed the Claude apps gateway's spend meter pricing 1-hour prompt cache writes at the cheaper 5-minute rate, and counting only the first model call's input tokens on streamed turns that run a server-side tool such as web search","H","fix",2,"admin",0,[],"claude-apps-gateway"],[8,"古い `~/.claude/.credentials.json` が残る macOS でも、別ウィンドウの `/login` 成功後に未ログイン表示が出ない","Fixed macOS sessions still showing \"Not logged in\" or \"Login expired\" after `/login` succeeds in another Claude Code window when a leftover `~/.claude/.credentials.json` exists","O","fix",2,"macos,cli",0,[],"auth-login"],[9,"API が既定モデルやエイリアス解決先を拒否しても、同ランクの一つ前のモデルで 1 回再試行して継続","Fixed every turn failing when the Anthropic API refuses the model your default or a model alias resolves to: Claude Code now retries once on the previous model of the same tier","L","fix",3,"cli",0,[],"model-selection"],[10,"組織ポリシーで Remote Control が無効化されたら、接続中セッションは通知つきで切断される","Fixed Remote Control sessions (including `claude remote-control`) staying connected after your organization's policy turns Remote Control off; they now disconnect with a notice","I","fix",2,"cloud,admin",0,[],"remote-control"],[11,"高速実行できないフォールバックモデルでも、拒否時や `--fallback-model` の再試行が標準速度で成功する","Fixed refusal and `--fallback-model` retries failing when the fallback model can't run fast; they now run at standard speed, with a one-time notice in interactive sessions","L","fix",2,"cli,sdk",0,[],"model-selection"],[12,"MCP discovery cache 有効時、再認証成功後に headless セッションが MCP 認証要求の通知を繰り返さない","Fixed headless sessions repeating the \"MCP servers require authentication\" reminder after a successful re-authentication when the MCP discovery cache is enabled","C","fix",1,"sdk",0,[],"mcp"],[13,"`claude auth status` が Console サインインの API キーを `api_key` と報告し、VS Code も API キー扱いにする","Fixed `claude auth status` reporting a Console sign-in's stored API key as `claude.ai`; it now reports `api_key`, and the VS Code extension treats that session as an API key session","H","fix",1,"cli,ide",0,[],"auth-login"],[14,"`/status` で API キーと併記される Anthropic プロファイルに「未使用」と表示","Fixed `/status` listing an Anthropic profile beside an API key as if both were in effect; the profile is now marked as not in use","U","fix",1,"cli",0,[],"auth-login"],[15,"Remote Control で添付ファイルが届かなかった場合に Claude へ通知し、最後のダウンロード試行にも十分な時間を与える","Fixed Claude not being told when a file attached to a message sent over Remote Control did not arrive, and a file sometimes getting only 10 seconds for its last download try","I","fix",1,"cloud",0,[],"remote-control"],[16,"終了中に届いた Remote Control メッセージが配信済み扱いにならず、次回の実行まで待機キューに残る","Fixed a Remote Control message that arrived while Claude Code was exiting being marked delivered and then never answered; it now stays queued for the session's next run","I","fix",1,"cloud",0,[],"remote-control"],[17,"\"Bearer\"/\"Basic\" がキー名より前にある場合も MCP エラーメッセージが認証情報の値を表示しない","Fixed MCP error messages showing a credential's value when \"Bearer\" or \"Basic\" came before its key name","C","fix",3,"cli",0,[],"mcp"],[18,"パーセントエンコードされた Bearer トークンがエラーメッセージ内で完全にマスクされる","Fixed percent-encoded Bearer tokens being only partly masked in error messages","T","fix",2,"cli",0,[],"secret-redaction"],[19,"キー名にゼロ幅スペースなど不可視文字が含まれる秘密情報も、ログとトランスクリプトでマスクされる"

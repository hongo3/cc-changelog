"I","change",1,"ide",1,[],"vscode"],[77,"Claude のメッセージ後にアイドルになったクラウドセッションでも、質問カードの回答や承認に返信が返る","[Cloud sessions] Fixed an answered question card or approved tool call getting no reply when the session had gone idle after Claude sent a message","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[78,"管理設定で組織環境のセットアップスクリプトを消すと、新規クラウドセッションが古いスクリプトを実行しない","[Cloud sessions] Fixed clearing an organization environment's setup script in admin settings leaving new cloud sessions still running the old script","I","fix",2,"cloud,admin",0,[],"web-cloud-sessions"],[79,"セルフホスト環境の管理ページで、Runner actions メニューが数秒後に勝手に閉じない","[Cloud sessions] Fixed the Runner actions menu on the self-hosted environments admin page closing on its own a few seconds after it opened","I","fix",1,"cloud,admin",0,[],"web-cloud-sessions"],[80,"クラウドセッションが始まらなかった routine の実行が、Runs ペインなどで Succeeded でなく Failed と表示","[Cloud sessions] Fixed routine runs whose cloud session never started showing as Succeeded in the Runs pane, the routine's page and the sidebar; they now show as Failed","I","fix",2,"cloud",0,[],"web-cloud-sessions"],[81,"Outputs カードの音声・動画ファイルをクリックすると、空のファイル検索でなく再生される","[Cloud sessions] Fixed clicking an audio or video file in a cloud session's Outputs card opening an empty file search instead of playing the file","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[82,"予定実行が遅れて未開始のとき、routine ページは過去の次回時刻でなく「Due」と予定時刻を表示","[Cloud sessions] Changed a routine's page to read \"Due\" with the scheduled time, instead of a next run time in the past, when a scheduled run is late and hasn't started","I","change",1,"cloud",1,[],"web-cloud-sessions"],[83,"管理設定の利用上限ページに Add channel ボタンを追加し、チャンネル ID や Slack リンクから非公開も含め上限を設定可能","[Claude Tag] Added an Add channel button to Claude Tag's spend limits page in admin settings, so a limit can be set on any channel, including a private one, from its channel ID or Slack link","I","new",2,"admin",0,[],"claude-tag"],[84,"既定の Sonnet モデルを使えない組織でも、メモリ想起が結果を返す","[Claude Tag] Fixed memory recall finding nothing in organizations that cannot use the default Sonnet model","I","fix",2,"admin",0,[],"claude-tag"],[85,"Enterprise Grid 管理者が移動した Slack チャンネルが、Claude を含まない最初の投稿後も Claude 設定を保持","[Claude Tag] Fixed a Slack channel losing its Claude settings when an Enterprise Grid admin moves it to another workspace and the first post afterward doesn't mention Claude","I","fix",2,"admin",0,[],"claude-tag"],[86,"Slack スレッドで Claude の質問に返信した際、新しいマシンで最初からやり直して未 push の作業を失わない","[Claude Tag] Fixed Claude in a Slack thread occasionally starting over on a fresh machine, losing work it hadn't pushed, when your reply answered a question it had just asked","I","fix",2,"cloud",0,[],"claude-tag"],[87,"大規模組織でも、利用上限ページの公開チャンネル名が生の Slack ID でなく名前で表示される","[Claude Tag] Fixed public channel names on Claude Tag's spend limits page in admin settings showing as raw Slack IDs in larger organizations","I","fix",1,"admin",0,[],"claude-tag"],[88,"Slack 発のセッションの claude.ai 上のタイトルが、Slack ユーザー ID やエスケープなしの入力文言になる","[Claude Tag] Improved the titles of sessions started from Slack as shown on claude.ai: they now read as the words you typed, without Slack user IDs or escape codes","I","improve",1,"cloud",0,[],"claude-tag"]]},{"v":"2.1.285","date":"2026-09-30（水）02:32","dshort":"09-30 02:32","nb":11,"head":"権限・サンドボックス修正と各種設定の既定値変更が中心","sum":"v2.1.285 は Artifact ツール、`/ultrareview`、サンドボックス、PowerShell の権限判定まわりのセキュリティ修正が中心です。あわせて、バックグラウンドコマンドの時間制限、`claude -p` の auto mode 起動、カスタム `ANTHROPIC_BASE_URL` での 1M コンテキスト利用など、既定値の変更が複数あります。管理者向けには `allowedProviders` が追加され、VS Code 拡張と Remote Control にも多くの修正があります。","watch":[{"b":"バックグラウンドの Bash/PowerShell コマンドが既定 30 分で停止するため、長時間実行するものは `timeout`（最大 2 時間）を明示すること。","r":[85]},{"b":"`claude -p` と Python Agent SDK がサードパーティプロバイダー／テレメトリー無効時に auto mode で始まるため、従来の挙動が必要なら `--permission-mode` を指定すること。","r":[91]},{"b":"カスタム `ANTHROPIC_BASE_URL` で対応モデルが 1M コンテキストを使うようになったため、ゲートウェイが 200K までなら `/autocompact 200k` を実行すること。","r":[87]},{"b":"プロジェクト設定では sandbox の管理者要件を緩められなくなったため、必要な変更は管理設定側で行うこと。","r":[104]},{"b":"クラウドセッションとセルフホストランナーでは MCP サーバー名 `widgets`（`widgets_` などの近い綴りも）が予約され読み込まれないため、リネームすること。","r":[93]},{"b":"Windows のプロジェクト／ローカル設定の `env` で `ALLUSERSPROFILE`、`SystemDrive`、`CommonProgramFiles` 系を設定できなくなったため、ユーザー設定か管理設定に移すこと。","r":[95]},{"b":"Team/Enterprise など、プランを判別できないセッションで起動時に組織ポリシーを読めなかった場合、読み込めるまで WebFetch が使えないため、ポリシー取得の失敗要因を確認すること。","r":[88]},{"b":"`/ultrareview` は macOS/Linux で git 2.31 以上が必要になり、`--separate-git-dir` のチェックアウトや symbolic ref のブランチは拒否されるため、該当する場合は構成を見直すこと。","r":[94,97,99]},{"b":"`claude mcp get` はプラグイン提供の stdio MCP サーバーのコマンド・引数・環境変数の値を表示しなくなったため、値の確認はプラグイン側で行うこと。","r":[101]},{"b":"バックグラウンドセッションや Claude Code 自身のツールが起動したセッションから /memory で Auto-memory をオンにできなくなったため、通常のセッションで設定すること。","r":[89]},{"b":"`/config chrome=true` は有効化せず /config パネルへ誘導するため、Claude in Chrome の有効化はパネルから行うこと。","r":[103]},{"b":"`/claude-api` は Remote Control クライアントから実行できなくなったため、ローカルのセッションで実行すること。","r":[102]}],"hl":[{"t":"権限判定の抜けを修正","b":"PowerShell ツールのパーサー起動失敗時に deny/ask ルールが飛ばされる問題と、`Artifact` の allow ルールが作業ディレクトリ外のファイルを無確認で公開する問題を修正しました。auto mode が Artifact の一部操作で classifier を飛ばす問題も直っています。","r":[46,37,40]},{"t":"サンドボックス設定の保護強化","b":"プロジェクト設定で、管理者が必須とした sandbox の緩和・無効化、管理側 deny list のプロキシ差し替え、strict allowlist の拡張、managed read-deny の再許可ができなくなりました。","r":[104]},{"t":"`/ultrareview` の漏えい対策","b":"コロンを含む名前の credential ファイル（例: `server:8443.key`）の未コミット変更がアップロードされる問題を修正しました。credential ファイル判定の見落としも直り、git 2.31 以上の要件など macOS/Linux のアップロード条件も変わりました。","r":[44,47,97]},{"t":"バックグラウンドコマンドに時間制限","b":"バックグラウンドの Bash/PowerShell コマンドは、`timeout` 指定（既定 30 分、最大 2 時間）で停止するようになりました。停止時は Claude に通知されます。","r":[85]},{"t":"`claude -p` の auto mode 起動","b":"サードパーティプロバイダーまたはテレメトリー無効の `claude -p` と Python Agent SDK は、権限モード未設定なら auto mode で起動します。`--permission-mode` で上書きできます。","r":[91]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"Artifact ツール、PowerShell、sandbox auto-allow、URL パスワードの伏せ字処理など、権限判定とツール安全性の修正が多数あります。background コマンドの時間制限と WebFetch の保留条件が変わり、`CLAUDE_CODE_DISABLE_WEB_FETCH` も追加されました。","refs":[1,14,19,31,36,37,39,40,43,46,48,62,67,85,88,90,104]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"fork subagent が親の plan mode や `dontAsk` を引き継ぎ、auto mode の subagent は報告後すぐ終了します。`claude agents` からの返信が権限プロンプトを誤承認する問題も修正されました。`/tasks` は内部のバックグラウンド作業を「System tasks」にまとめます。","refs":[7,20,22,29,58,59,76,96]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"`claude plugin configure` と `claude plugin install --config` の拡張が入り、`.mcpb` サーバーの設定漏れも明示されます。SSH 設定の無視やキャッシュ衝突など plugin/marketplace のインストール修正、`/ultrareview` のアップロード修正も含まれます。","refs":[3,4,8,11,25,26,30,34,35,41,42,44,47,51,53,56,63,64,71,72,73,78,102,103]},{"a":"S","name":"セッション・履歴・圧縮","dg":"圧縮や resume が壊れた transcript で失敗する問題を修正しました。バックグラウンドで動作中のセッションを `/resume` で開けるようになり、Auto-memory のオン操作には制限がかかります。","refs":[52,54,80,89]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"`claude mcp list`/`get` の表示漏れとエスケープシーケンスの混入を修正し、ws サーバーも一覧に出ます。`widgets` 名の予約、`alwaysLoad` の扱い、プラグイン提供サーバーの値非表示といった変更もあります。","refs":[16,18,60,61,69,84,93,101,131]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"Remote Control、クラウドセッション、`/ultrareview`、Code Review、Claude Tag、VS Code 拡張の修正が大半を占めます。`claude --desktop` が追加され、VS Code ではプラグイン管理とセッション復元が改善されました。","refs":[2,10,12,21,23,24,27,57,74,75,86,94,97,98,99,105,106,107,108,109,110,111,112,113,114,115,116,117,118,119,120,121,122,123,124,125,126,127,128,129,130,132,133,134,135,136]},{"a":"H","name":"headless・SDK・API","dg":"`allowedProviders` が追加され、Bedrock/Vertex の起動時モデル確認や再試行の挙動が改善されました。API リトライ回数の削減、content filter 応答の即時表示、`-p` の auto mode 既定化も含まれます。","refs":[5,6,17,28,33,50,68,70,77,79,83,91,92,100]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"`set_model` による切り替え後の出力トークン上限と auto-compact window、`/cost` のモデル帰属を修正しました。カスタム `ANTHROPIC_BASE_URL` では 1M コンテキストが使われます。","refs":[13,38,81,87]},{"a":"U","name":"UI・表示・入力","dg":"fullscreen の ctrl+o transcript や長いセッションでの固まり、vim mode のプレースホルダー破損、`\u0026nbsp;` の表示を修正しました。","refs":[32,49,65,66,82]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"SSH プロンプトによる端末の占有、ログイン更新ロックの競合、サインインの無限待ちを修正しました。Windows では設定 `env` の一部変数が使えなくなります。","refs":[9,15,45,55,95]}],"skip":"表示の乱れ、まれな環境での不具合、VS Code 拡張の細かな状態表示や復元まわりの修正が合わせて 80 件以上あります。","st":"ok","stale":false,"e":[[1,"`CLAUDE_CODE_DISABLE_WEB_FETCH` 環境変数で WebFetch ツールを無効化できる","Added `CLAUDE_CODE_DISABLE_WEB_FETCH` environment variable to turn off the WebFetch tool","T","new",2,"cli,admin",0,[],"web-fetch-search"],[2,"`claude --desktop` で現在のディレクトリや `--continue` / `--resume \u003cid\u003e` のセッションを Claude デスクトップアプリで開く","Added `claude --desktop` to open the Claude desktop app on the current directory, or on a session with `--continue` / `--resume \u003cid\u003e`","I","new",2,"cli,ide",0,[],"desktop"],[3,"`claude plugin configure \u003cplugin\u003e` で plugin の設定項目と未設定項目を表示し、`--values-stdin` で値を保存できる","Added `claude plugin configure \u003cplugin\u003e` to show a plugin's options and which are unset, or save new values read from stdin with `--values-stdin`","M","new",2,"cli,mod-dev",0,[],"plugins-mods"],[4,"`claude plugin install --config` に `\u003cserver\u003e.\u003ckey\u003e=\u003cvalue\u003e` を指定でき、同梱 `.mcpb` MCP サーバーがインストール時の設定だけで起動する","Added `\u003cserver\u003e.\u003ckey\u003e=\u003cvalue\u003e` to `claude plugin install --config`, so a bundled `.mcpb` MCP server's own settings can be set at install time and it starts without visiting `/plugin` → Configure","M","new",2,"mod-dev",0,[],"plugins-mods"],[5,"managed setting `allowedProviders` で、そのマシンで使える API プロバイダーを制限できる","Added `allowedProviders` managed setting to limit which API providers a machine may use (Anthropic API, a custom endpoint, Bedrock, Mantle, Vertex AI, Foundry, Claude Platform on AWS, or a Cloud gateway)","H","new",2,"admin",0,[],"managed-settings"],[6,"`CLAUDE_CODE_NONSTREAMING_TIMEOUT_RETRIES` で、タイムアウトした非ストリーミングのフォールバック再送回数に上限を設けられる","Added `CLAUDE_CODE_NONSTREAMING_TIMEOUT_RETRIES` environment variable to cap re-sends of a non-streaming fallback request that timed out","H","new",1,"sdk",0,[],"api-retries"],[7,"`CLAUDE_CODE_FORK_SUBAGENT=1` の `claude -p` で、サブエージェント自身の Agent 呼び出しがフォアグラウンドで走り結果を受け取れる","Fixed `claude -p` with `CLAUDE_CODE_FORK_SUBAGENT=1`: a subagent's own Agent call now runs in the foreground, so the subagent gets the child's result","A","fix",1,"sdk",0,[],"subagents"],[8,"SSH 経由の plugin・marketplace のインストール／更新が `GIT_SSH` や `core.sshCommand` の ssh プログラムを使う","Fixed plugin and marketplace installs and updates over SSH ignoring the ssh program set in `GIT_SSH` or in your git config's `core.sshCommand`","M","fix",2,"cli,mod-dev",0,[],"plugins-mods"],[9,"OS が managed settings ファイルの読み取りを拒否しても起動し、警告を出してそのファイルのポリシーなしで始まる","Fixed Claude Code refusing to start when the OS denies reading the managed settings file; it now warns and starts without that file's policies. Other read errors and unparseable files stop every session","O","fix",2,"admin,cli",0,[],"managed-settings"],[10,"会話の compaction 後に再起動した cloud セッションでも、既に読んだ・公開した artifact の次の更新が通る","Fixed cloud sessions that restarted after their conversation was compacted refusing the next update to an artifact the session had already read or published","I","fix",1,"cloud",0,[],"artifacts"],[11,"`claude plugin disable` / `enable` に大文字小文字違いの `name@marketplace` を渡しても、インストール済み plugin 自身のエントリを変更する","Fixed `claude plugin disable` and `enable` with a full `name@marketplace` id changing a settings entry in another letter case instead of the installed plugin's own","M","fix",1,"mod-dev",0,[],"plugins-mods"],[12,"Remote Control で送った添付ファイルが、ダウンロード失敗時に最大 2 回再試行され、欠落しにくくなった","Fixed files attached to a message sent over Remote Control being left out after a single failed download; a network error, timeout or server error is now retried up to twice","I","fix",2,"cloud",0,[],"remote-control"],[13,"`set_model` リクエスト（SDK の `setModel` など）で切り替えた後も、新モデルの出力トークン上限と auto-compact ウィンドウが反映される","Fixed switching models mid-session with a `set_model` request (such as the Agent SDK's `setModel`) leaving the new model on the built-in output-token limit and auto-compact window until restart","L","fix",2,"sdk",0,[],"model-selection"],[14,"伏せ字処理したログやトランスクリプトで、`@` を含む URL パスワードの一部や `%40` 表記のパスワード全体が見えなくなった","Fixed redacted logs and transcripts showing part of a URL password that contains `@`, or all of it when the URL writes its `@` as `%40`","T","fix",2,"cli",0,[],"log-redaction"],[15,"worktree や `/teleport` の fetch で SSH パスフレーズや新規ホストの確認がターミナルを占有せず、即座に失敗する","Fixed SSH passphrase and new-host prompts from worktree and `/teleport` fetches taking over the terminal; these fetches now fail fast instead of asking","O","fix",1,"cli",0,[],"worktrees"],[16,"SDK と `-p` セッションで途中追加した MCP サーバーをオフにすると、そのツールも使えなくなる","Fixed switching off an MCP server added mid-session in SDK and `-p` sessions leaving its tools available","C","fix",2,"sdk",0,[],"mcp"],[17,"`claude -p --permission-prompt-tool` で、バックグラウンドサブエージェントの権限リクエストが自動拒否されず prompt tool に渡る","Fixed `claude -p --permission-prompt-tool`: a background subagent's permission request now goes to the prompt tool instead of being auto-denied","H","fix",2,"sdk",0,[],"headless-ci"],[18,"`claude mcp list` / `get` と `remove`・`login`・`logout` の not-found エラーで、MCP サーバー名や値の改行・エスケープシーケンスを出力しない","Fixed `claude mcp list` and `claude mcp get`, and the not-found error of `claude mcp remove`, `login` and `logout`, printing line breaks and terminal escape sequences from MCP server names and values","C","fix",1,"cli",0,[],"mcp"],[19,"sandbox の自動許可で、`=` を含むだけの `python3 -c` や `node -e` などのインラインスクリプトが毎回承認を求めなくなった","Fixed sandbox auto-allow asking for approval on every run of many inline scripts (`python3 -c`, `node -e`) just because they contain `=`","T","fix",2,"cli",0,[],"sandbox"],[20,"fork サブエージェントが親の permission mode（plan mode や `dontAsk`）で動き、plan mode を抜けられない","Fixed fork subagents not keeping the session's plan mode or `dontAsk` mode: a fork now runs under its parent's permission mode and cannot exit plan mode","A","fix",3,"cli",0,[],"subagents"],[21,"`claude remote-control --help` の `--[no-]chrome` の説明が実際の挙動に合う（`--chrome` なしでは Chro nd of the prompt","U","fix",1,"cli",0,[],"vim-mode"],[50,"API の出力コンテンツフィルタでブロックされた応答を再送せず、フィルタのエラーをすぐ表示する","Fixed responses blocked by the API's output content filter being re-sent and retried, sometimes for minutes, instead of showing the filter's error right away","H","fix",2,"cli,sdk",0,[],"api-retries"],[51,"設定が必要な同梱 `.mcpb` MCP サーバーを黙ってスキップせず、`/plugin`・インストール時の表示・`claude plugin install` が Configure を案内する","Fixed plugins silently skipping a bundled `.mcpb` MCP server that still needs configuration: `/plugin`, the install message and `claude plugin install` now say so and point to Configure","M","fix",2,"mod-dev,cli",0,[],"plugins-mods"],[52,"保存済みトランスクリプトの compaction マーカーや loop wakeup エントリが壊れていても、compact や resume が失敗・履歴欠落・クラッシュしない","Fixed compacting or resuming a session failing, opening without its history, or crashing when its saved transcript holds a compaction marker or loop wakeup entry with missing or malformed fields","S","fix",2,"cli",0,[],"sessions-resume"],[53,"WSL の Linux ボリューム上のチェックアウトで、コロンや末尾のドット・空白を含む変更ファイル名でも `/ultrareview` がアップロードできる","WSL: Fixed `/ultrareview` refusing to upload a checkout on a Linux volume when a changed file's name has a colon or ends in a dot or space","M","fix",1,"windows",0,[],"ultrareview"],[54,"`CLAUDE_CODE_RESUME_INTERRUPTED_TURN` が、`--max-turns` で終了したターンを再実行しない","Fixed `CLAUDE_CODE_RESUME_INTERRUPTED_TURN` re-running a turn that had ended at `--max-turns`","S","fix",1,"sdk",0,[],"sessions-resume"],[55,"ブラウザが成功を表示した後にサインインが永久に待ち続けることがない","Fixed sign-in that could wait forever after the browser showed success","O","fix",2,"cli",0,[],"auth-login"],[56,"Windows で、ホームフォルダをルートとするリポジトリの linked worktree を `/ultrareview` が誤ってアップロードしない","Windows: Fixed `/ultrareview` uploading a linked worktree of a repository rooted at your home folder in some cases","M","fix",1,"windows",0,[],"ultrareview"],[57,"cloud セッションが、ファイルをアップロードする前に uploads フォルダ不在と報告しない","Fixed cloud sessions reporting the uploads folder as missing before any file had be al when a reply uses it to indent text, such as row labels in a markdown table","U","fix",1,"cli",0,[],"output-rendering"],[66,"フルスクリーン以外で長いセッションの途中に起きる最大 1 秒のフリーズ（`/clear` や `/compact` 後に再発）が起きない","Fixed a brief freeze (up to a second) partway through long sessions outside fullscreen mode, which came back after `/clear` or `/compact`","U","fix",1,"cli",0,[],"performance"],[67,"/dev/null へのシンボリックリンクなどデバイスが対象の Edit も、IDE の diff 画面で承認・変更した場合に反映される","Fixed an approved Edit never going through when its target is a device, such as a file symlinked to /dev/null, and the approval came from the IDE diff view or changed the edit","T","fix",2,"cli,ide",0,[],"read-edit-tools"],[68,"ストリーミング失敗が続く API リクエストが最大 21 回再試行されず、非ストリーミングのフォールバックが元の再試行予算を共有する","Fixed a failing API request being retried up to 21 times when streaming kept failing; the non-streaming fallback now shares the request's retry budget instead of getting a fresh set of retries","H","fix",2,"cli,sdk",0,[],"api-retries"],[69,"Chrome拡張のnative hostがPC名を報告し、接続ブラウザをPC名で識別できる","Improved Claude in Chrome: the native host now reports your computer's name, so connected browsers can be labeled by computer instead of \"Browser 1\" / \"Browser 2\"","C","improve",1,"cli",0,[],"chrome-extension"],[70,"Bedrock/Vertexで既定モデルへのアクセスが外されても同階層の旧モデルへ切替え、タイトルや要約も追従する","Improved Bedrock and Vertex AI sessions to switch to an older available model of the same tier, instead of failing, when an admin removes access to the default model; session titles and summaries now fall back with it","H","improve",2,"admin,sdk",0,[],"bedrock-vertex"],[71,"プラグインmarketplaceのエラーが、git アドレス拒否の理由を企業ポリシーでなく具体的に示す","Improved plugin marketplace errors to name why a git address is refused instead of citing enterprise policy","M","improve",1,"mod-dev,admin",0,[],"plugins-mods"],[72,"プラグイン・marketplace・現リポジトリのremoteのgit URL検証が強化された","Improved validation of git URLs for plugins, marketplaces and the current repository's remote","M","improve",1,"mod-dev",0,[],"plugins-mods"],[73,"Artifactツールの結果が、ページの作成・編集と同じ手順で公開を提案し、往復を1回減らせる","Improved Artifact tool results: they now suggest publishing in the same step as writing or editing the page, which can save a round trip","M","improve",1,"cli",0,[],"artifacts"],[74,"Claude Desktopなどが動かすセッションへの`/btw`が、進行中のターンも参照できる","Improved Remote Control: a `/btw` side question asked of a session hosted by an app such as Claude Desktop now sees the turn in progress, not only the last finished one","I","improve",1,"cloud",0,[],"remote-control"],[75,"BMP・HEIC・HEIF・AVIF・TIFF画像をClaudeアプリがプレビュー表示できる","Improved pictures Claude sends as BMP, HEIC, HEIF, AVIF or TIFF files: the Claude apps now show a preview where Claude Code can convert them","I","improve",1,"ide,cloud",0,[],"desktop"],[76,"auto modeのサブエージェントが、報告を返した時点で終了し無駄なターンを実行しない","Improved subagents in auto mode: a subagent's run now ends as soon as it hands its report back to its caller, instead of taking extra turns that reach no one","A","improve",2,"cli,sdk",0,[],"subagents"],[77,"Bedrock/Vertexの起動時モデル確認で、使えないモデルを最大1日記憶し毎回の再確認をやめる","Improved Bedrock and Vertex start-up model checks: models your account cannot use are now remembered for up to a day instead of being re-checked on every launch","H","improve",1,"admin",0,[],"bedrock-vertex"],[78,"Artifactの公開結果のトークン消費が減り、更新の注記が短く、保管場所の案内も毎回出ない","Improved Artifact tool publish results to use fewer tokens: the note on updating an artifact is shorter, and where to find your artifacts is no longer repeated after every publish","M","improve",1,"cli",0,[],"artifacts"],[79,"非ストリーミングのフォールバック中、partial messages有効時に30秒ごとに`ping`イベントを送る","Improved SDK liveness during a non-streaming fallback request: with partial messages on, a `ping` stream event is now sent every 30 seconds on the Anthropic API, Claude Platform on AWS and gateways","H","improve",1,"sdk",0,[],"sdk"],[80,"バックグラウンド実行中のセッションを`/resume`や`claude --resume`で開け、指定プロンプトが次のターンになる","Improved `/resume` and `claude --resume` on a session that is running in the background: they now open that session instead of refusing, and a prompt given with `claude --resume \u003cid\u003e \"prompt\"` is sent to it as its next turn","S","improve",2,"cli",0,[],"sessions-resume"],[81,"deny規則やMCPツールが多い環境でのターンごとの性能が向上した","Improved per-turn performance when many permission deny rules and MCP tools are configured","L","improve",1,"cli",0,[],"performance"],[82,"フルスクリーン描画オフの長いセッションで、ctrl+oトランスクリプトを閉じる際の応答性が向上した","Improved responsiveness when leaving the ctrl+o transcript view in long sessions when fullscreen rendering is off","U","improve",1,"cli",0,[],"output-rendering"],[83,"Bedrock/Vertex/Mantleの起動時モデル確認が通常リクエストと同じUser-Agent等のヘッダーを送る","Improved Bedrock, Vertex and Mantle start-up model checks to send the same User-Agent, x-app and session ID headers as regular requests","H","improve",1,"admin",0,[],"bedrock-vertex"],[84,"自身で`_meta['anthropic/alwaysLoad']`をfalseにしたMCPツールは、サーバーが`alwaysLoad`でも遅延ロードのまま","Changed MCP tools so a tool that sets its own `_meta['anthropic/alwaysLoad']` to false stays deferred when its `--mcp-config`, Agent SDK or plugin server is set to `alwaysLoad`","C","change",1,"sdk,mod-dev",0,[],"mcp"],[85,"バックグラウンドのBash/PowerShellに時間制限（既定30分、最大2時間）が付き、停止時にClaudeへ通知される","Changed background Bash and PowerShell commands to stop after a time limit (their `timeout` with `run_in_background`, default 30 min, max 2 h); Claude is notified when one is stopped","T","change",2,"cli",1,[],"bash-tool"],[86,"`disableWorkflows`有効でもCode Reviewの PR レビューと`/ultrareview`が動く（管理者設定の機器を除く）","Changed Code Review's pull request reviews and `/ultrareview` to run when `disableWorkflows` is on, unless the machine running the review has it set by its own administrator (MDM or the managed-settings file)","I","change",2,"admin,cloud",1,[],"code-review"],[87,"カスタム`ANTHROPIC_BASE_URL`のセッションが対応モデルの1Mコンテキストを使う。200Kなら`/autocompact 200k`","Changed sessions behind a custom `ANTHROPIC_BASE_URL` to use the 1M context window of models that have one (Opus 4.7+, Sonnet 5+, Fable); run `/autocompact 200k` if your gateway stops at 200K","L","change",2,"cli,sdk",1,[],"compaction-context"],[88,"TeamやEnterprise等で起動時に組織ポリシーを読めない場合、読み込みまでWebFetchを無効にする","Changed Team and Enterprise sessions, and sessions whose sign-in plan Claude Code can't determine, to withhold WebFetch until the organization policy loads if it couldn't be loaded at startup","T","change",2,"admin",1,[],"web-fetch-search"],[89,"`/memory`のAuto-memoryは、バックグラウンドや内部ツール起動のセッションではオンにできない（オフは可）","Changed /memory so that Auto-memory can no longer be turned on from a background session or from a session one of Claude Code's own tools started; turning it off there still works","S","change",1,"cli",1,[],"memory"],[90,"auto modeを既定にする初回の案内が、サードパーティプロバイダーやテレメトリ無効でも表示される","Changed the one-time offer to make auto mode your default permission mode to also show on third-party providers and with telemetry off, when your user settings default to another mode","T","change",1,"cli",0,[],"auto-mode"],[91,"サードパーティやテレメトリ無効の`claude -p`/Python SDKが、権限モード未設定ならauto modeで開始する","Changed `claude -p` and Python Agent SDK sessions on third-party providers or with telemetry off to start in auto mode when no permission mode is configured, like interactive sessions; `--permission-mode` still overrides it","H","change",2,"sdk",1,[],"auto-mode"],[92,"Bedrock/Mantle/AWS版の非既定ポートのbase URLで、SigV4署名のHostヘッダーにポートを含める","Changed Bedrock, Mantle and Claude Platform on AWS requests to a base URL with a non-default port to include the port in the SigV4-signed Host header","H","change",1,"admin,sdk",0,[],"bedrock-vertex"],[93,"クラウドセッションとself-hosted runnerでMCPサーバー名`widgets`が予約され、同名や類似名は読み込まれない","Changed the MCP server name `widgets` to be reserved in cloud sessions and on self-hosted runners: your own server under it, or a close spelling such as `widgets_`, no longer loads, so rename it","C","change",2,"cloud,admin",1,[],"mcp"],[94,"macOS/Linuxの`/ultrareview`がローカルアップロード時にsymbolic refを除外し、symbolic ref上のブランチは拒否される","Changed `/ultrareview` on macOS and Linux to leave symbolic refs out when uploading a local checkout; a checkout whose current branch is a symbolic ref is now refused with an explanation","I","change",1,"cli,macos",0,[],"code-review"],[95,"Windowsではプロジェクト・ローカル設定の`env`で`ALLUSERSPROFILE`等を設定できない。ユーザー設定か管理設定へ","Windows: Changed project and local settings `env` to no longer set `ALLUSERSPROFILE`, `SystemDrive`, or the `CommonProgramFiles` variables; set them in user or managed settings instead","O","change",1,"windows",1,[],"windows"],[96,"`/tasks`がClaude Code自身のバックグラウンド作業を「System tasks」行にまとめ、Enterで展開する","Changed `/tasks` to fold background work Claude Code runs for itself under one \"System tasks\" row; press Enter on it to show those tasks","A","change",1,"cli",0,[],"background-tasks"],[97,"macOS/Linuxの`/ultrareview`のローカルアップロードはgit 2.31以上が必要で、`--separate-git-dir`は拒否される","Changed `/ultrareview` on macOS and Linux to require git 2.31 or newer to upload a local repository; checkouts made with `--separate-git-dir` are now refused instead of being uploaded with an older method","I","change",1,"cli,macos",1,[],"code-review"],[98,"git 2.31以上では、`/ultrareview`が部分クローンを作業ツリーのスナップショットとして送る","Changed `/ultrareview` uploads on macOS and Linux to send a partial clone as a working-tree snapshot on git 2.31 or newer, instead of falling back or refusing when git's version looked too old","I","change",1,"cli,macos",0,[],"code-review"],[99,"古いgitでは、作業ツリーのファイルが欠けた部分クローンを`/ultrareview`が取得せず拒否する","Changed `/ultrareview` uploads on macOS and Linux to refuse, instead of fetching, a partial clone missing some of its working tree's files on older git versions; a clone made without `--filter` uploads","I","change",1,"cli,macos",0,[],"code-review"],[100,"Bedrock/Vertex/Mantleの起動時モデル確認が、他のリクエスト同様Claude Codeとして名乗る","Changed Bedrock, Vertex and Mantle start-up model checks to identify themselves as Claude Code, like other Claude Code requests","H","change",1,"admin",0,[],"bedrock-vertex"],[101,"`claude mcp get`がプラグイン提供のstdio MCPのコマンド・引数・環境値を隠す（変数名は表示）","Changed `claude mcp get` to hide the command, arguments, and environment values of stdio MCP servers provided by plugins; variable names are still shown","C","change",2,"cli,mod-dev",0,[],"mcp"],[102,"`/claude-api`はRemote Controlクライアントから実行できなくなった","Changed `/claude-api` so it can no longer be run from Remote Control clients","M","change",1,"cloud",0,[],"slash-commands"],[103,"`/config chrome=true`は有効化せず/configパネルへ誘導する。`chrome=false`は引き続き無効化できる","Changed `/config chrome=true` to direct you to the /config panel instead of enabling Claude in Chrome by default; `/config chrome=false` still turns it off when it was on","M","change",1,"cli",1,[],"chrome-extension"],[104,"プロジェクト設定では管理者必須のサンドボックスの緩和・無効化や、管理拒否の再開放などができない","Changed sandbox settings so project settings cannot widen or turn off an admin-required sandbox, replace the proxy behind a managed deny list, extend a strict allowlist, or reopen managed read-denies","T","change",3,"admin",0,[],"sandbox"],[105,"ウィンドウ再読込で中断され返信が来ない復元タブに、最後のメッセージの下で注記を表示する","[VSCode] Added a note under a restored tab's last message when a window reload interrupted it and no reply will follow","I","new",1,"ide",0,[],"vscode"],[106,"Manage pluginsにオプションフォームを追加。インストール時に未設定項目を尋ね、歯車で後から変更できる","[VSCode] Added a plugin options form to Manage plugins: installing a plugin that has options asks for the unset ones, and a gear on its row changes them later","I","new",2,"ide,mod-dev",0,[],"vscode"],[107,"パネルのClaudeがオンデマンドでProblemsパネルのエラー・警告を読める診断ツールを追加","[VSCode] Added an on-demand diagnostics tool so Claude in the panel can read the Problems panel's current errors and warnings at any time, not only right after it edits a file","I","new",2,"ide",0,[],"vscode"],[108,"スラッシュコマンド入力後のEnterが、あいまい一致の無関係なメニュー項目を実行したり無反応になったりしない","[VSCode] Fixed pressing Enter after typing a slash command running an unrelated menu item picked by fuzzy match, or doing nothing","I","fix",2,"ide",0,[],"vscode"],[109,"長いセッションでも、開いたエージェントのトランスクリプトが新しいメッセージを失わない","[VSCode] Fixed an open agent transcript losing the agent's newer messages during a long session","I","fix",1,"ide",0,[],"vscode"],[110,"Claude CodeやIDEのタグを引用したメッセージが、チャットで残りの本文を失わない","[VSCode] Fixed a message that quotes a Claude Code or IDE tag losing the rest of its text in the chat","I","fix",1,"ide",0,[],"vscode"],[111,"作業中に送ったメッセージが、セッション再オープン後も会話から消えない","[VSCode] Fixed a message sent while Claude was working disappearing from the conversation after the session was reopened","I","fix",2,"ide",0,[],"vscode"],[112,"アカウント切替後、セッション一覧のWebタブが前のアカウントのセッションを表示しない","[VSCode] Fixed the session list's Web tab showing the previous account's sessions after an account switch","I","fix",1,"ide",0,[],"vscode"],[113,"`CLAUDE_CODE_RESUME_INTERRUPTED_TURN`設定時、Continue After Reloadオフでも復元タブが中断ターンを再実行しない","[VSCode] Fixed restored tabs re-running an interrupted turn when VS Code was started with `CLAUDE_CODE_RESUME_INTERRUPTED_TURN` set, even with Continue After Reload off","I","fix",1,"ide",0,[],"vscode"],[114,"コマンドメニューの行をクリックした後のEscapeが、実行中ターンでなくメニューを閉じる","[VSCode] Fixed Escape stopping the running turn instead of closing the command menu after clicking one of its rows","I","fix",1,"ide",0,[],"vscode"],[115,"Past conversationsを開いても、進行中の会話が保存コピーに置き換わらない","[VSCode] Fixed opening Past conversations replacing a live conversation with its saved copy","I","fix",2,"ide",0,[],"vscode"],[116,"拡張再起動後に再読込したClaudeタブが空白でなく、復旧方法を表示する","[VSCode] Fixed a Claude tab reloaded after an extension restart staying blank instead of saying how to recover","I","fix",1,"ide",0,[],"vscode"],[117,"他のウィンドウやアプリで開いている会話を開く際、警告なく二重起動せず先に確認する","[VSCode] Fixed opening a conversation that is already open in another window or app starting a second copy of it without warning; it now asks first","I","fix",2,"ide",0,[],"vscode"],[118,"プロンプトをブロック・停止したhookの理由が、ウィンドウ再読込後も消えない","[VSCode] Fixed a hook's reason for blocking or stopping a prompt disappearing after a window reload","I","fix",1,"ide",0,[],"vscode"],[119,"再開できない会話のタブで、その旨のエラーと新規会話の開始案内を表示する","[VSCode] Fixed tabs stuck on a conversation that can't be resumed: the error now says so and offers to start a new conversation","I","fix",1,"ide",0,[],"vscode"],[120,"エディタが自動保存に応答しなくても、Read/Write/Editが10分停止してスキップされない","[VSCode] Fixed every file Read, Write and Edit stalling for ten minutes and then being skipped when the editor stops responding to the extension's automatic save before the tool runs","I","fix",2,"ide",0,[],"vscode"],[121,"エージェントマップが、サブエージェントを実際に動いたモデルで表示する","[VSCode] Fixed the agent map labeling a sub-agent with the session's model instead of the model it actually ran on (e.g. under `CLAUDE_CODE_SUBAGENT_MODEL_FORCE` or an agent's own `model`)","I","fix",1,"ide",0,[],"vscode"],[122,"Manage pluginsからのアンインストールが、正しいインストールを削除し、プロジェクト用でも成功する","[VSCode] Fixed uninstalling a plugin from the Manage plugins dialog, which removed the wrong installation or failed for a plugin installed for the project","I","fix",2,"ide",0,[],"vscode"],[123,"戻って同じサインイン方法を選び直しても、認可コード入力段階で止まらない","[VSCode] Fixed sign-in staying on the authorization-code step after going back and choosing the same sign-in method again","I","fix",1,"ide",0,[],"vscode"],[124,"長いセッションが古い行を削る際に、チャットパネルが停止しない","[VSCode] Fixed the chat panel stalling when a long session trims its oldest rows","I","fix",1,"ide",0,[],"vscode"],[125,"多数のエージェント実行時に、セッションから会話が消えない","[VSCode] Fixed the conversation disappearing from a session when many agents run","I","fix",2,"ide",0,[],"vscode"],[126,"`/rename`・SessionStart hook・claude.aiでの改名がエディタタブ名に反映される","[VSCode] Fixed the editor tab keeping an old name after a session was renamed with /rename, by a SessionStart hook, or on claude.ai","I","fix",1,"ide",0,[],"vscode"],[127,"エージェントマップのトランスクリプトが、実行中エージェントへ送ったメッセージも表示する","[VSCode] Fixed the agent map's transcript view leaving out messages sent to a running agent","I","fix",1,"ide",0,[],"vscode"],[128,"Manage pluginsで操作に失敗すると、理由と可能なら修正案をポップアップで示す","[VSCode] Improved the Manage plugins dialog: a failed plugin action now opens a popup that explains it and, where there is one, offers the fix","I","improve",1,"ide",0,[],"vscode"],[129,"共有`.claude/settings.json`で有効なmarketplace削除やプラグイン無効化の前に確認を求める","[VSCode] Changed the Manage plugins dialog to ask before removing a marketplace or turning off a plugin that your project's shared `.claude/settings.json` turns on","I","change",1,"ide",0,[],"vscode"],[130,"routineのRun nowが開始前に拒否された際、内部エラーでなく失敗通知と同じ説明を表示する","[Cloud sessions] Fixed Run now on a routine showing internal error text when the run is refused before it starts; it now shows the same explanation as the routine's failure notification","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[131,"クラウド環境変数の`MCP_DISCOVERY_CACHE=1`は再起動後にコネクタのツール一覧を再利用し、他のMCPはキャッシュしない","[Cloud sessions] Changed `MCP_DISCOVERY_CACHE=1`, when set in your cloud environment's variables rather than a settings file, to reuse your connectors' tool lists after a session restart; other MCP servers are no longer cached and connect at startup","C","change",2,"cloud,admin",1,[],"web-cloud-sessions"],[132,"Enterprise StandardかUsage-Based ChatシートでCoworkを持つメンバーもClaudeにDMでき、Claude Codeシートは不要","[Claude Tag] Added direct messages with Claude for members on an Enterprise plan Standard or Usage-Based Chat seat who also have Cowork; a seat that includes Claude Code is no longer required","I","new",2,"admin,cloud",0,[],"claude-tag"],[133,"管理設定とチャンネルConfigureのDefault modelに、組織で使えないモデルが出ず保存や新規セッションが失敗しない","[Claude Tag] Fixed the Default model setting in admin settings and a channel's Configure page offering models your organization can't use, which made saves or new sessions fail","I","fix",1,"admin",0,[],"claude-tag"],[134,"Slackメッセージ下の代替モデル使用の注記が、後でClaudeが編集しても消えない","[Claude Tag] Fixed the note under Claude's Slack messages saying it answered on a fallback model, and why, disappearing when Claude later edited that message","I","fix",1,"cloud",0,[],"claude-tag"],[135,"Add a repositoryダイアログの組織メニューが、スクロールでGitHub組織をさらに読み込む","[Code Review] Fixed the organization menu in Code Review's \"Add a repository\" dialog showing only a few of your GitHub organizations; it now loads more as you scroll","I","fix",1,"admin",0,[],"code-review"],[136,"大きなPRやREVIEW.mdがシンボリックリンクなどでREVIEW.mdが未適用のとき、チェックランが知らせる","[Code Review] Improved the Code Review check run to say when your repository's REVIEW.md wasn't applied, for example on a very large pull request or when REVIEW.md is a symbolic link","I","improve",1,"admin",0,[],"code-review"]]},{"v":"2.1.284","date":"2026-09-29（火）02:11","dshort":"09-29 02:11","nb":4,"head":"自動モード既定化とSonnet 5.5追加、安全性と安定性の修正","sum":"このリリースは、対話型セッションの既定が自動モードになる変更と、Sonnet 5.5の追加が中心です。あわせて、ストリーム破損や過負荷時の再試行、compact後の「Prompt is too long」など、日常操作の安定性に関わる修正が多く入っています。managed settings 下のプラグイン権限修正も含まれ、管理者にも関係します。","watch":[{"b":"権限モード未設定の対話型セッションが自動モードで始まるため、従来の確認動作を保ちたい場合は `permissions.defaultMode` を明示する。","r":[62]},{"b":"Ultracode は xhigh を強制しなくなったため、effort の運用をしている場合は `/effort` で設定を確認する。","r":[63]},{"b":"切断後の再試行が他の再試行と予算を共有し、失敗するリクエストの打ち切りが早くなるため、不安定な回線では失敗の増加に備える。","r":[64]},{"b":"Opus を `ANTHROPIC_DEFAULT_OPUS_MODEL` や `modelOverrides` で固定していると、Anthropic API 上の安全関連の切り替え先は固定モデルではなく API が選ぶため、想定外のモデルに切り替わりうる。","r":[66]},{"b":"非対話の初回ターンは `CLAUDE_CODE_MCP_STARTUP_WAIT_MS` が `0` でも最大2秒 MCP サーバーを待つため、起動時間への影響を確認する。","r":[67]},{"b":"`/recap` はチャットスレッドやルーチン、webhook 経由で届いた場合は短い通知で辞退するため、これらの経路で使っている場合は端末などから実行する。","r":[68]},{"b":"ネットワーク共有上のファイルはアーティファクト公開を拒否されるため、`--add-dir` で追加したマップ済みドライブへ置く。","r":[70]},{"b":"VS Code の `CLAUDE_CONFIG_DIR` は絶対パスのときだけ適用されるため、相対パスで指定している場合は絶対パスに直す。","r":[88]},{"b":"Claude Tag は未接続ユーザーの @mention ごとに非公開のサインイン通知を出すようになるため、通知頻度の増加を周知する。","r":[94]}],"hl":[{"t":"自動モードが既定に","b":"権限モード未設定の対話型ターミナルとVS Codeセッションは、全プランとプロバイダーで自動モードで始まります。`permissions.defaultMode` で上書きできます。","r":[62,2]},{"t":"Claude Sonnet 5.5を追加","b":"`claude-sonnet-5-5` が追加され、Anthropic API の既定 Sonnet モデルになりました。1M コンテキストに対応します。","r":[1]},{"t":"プラグインの事前承認を制限","b":"`allowManagedPermissionRulesOnly` 下で、マーケットプレイス・claude.ai・npm のプラグインが `allowed-tools` で自らのツールを事前承認できなくなりました。公式 Anthropic ソースか managed settings が認めたソースのみ維持されます。","r":[35]},{"t":"応答エラーと再試行の修正","b":"破損したレスポンスストリームの生エラー表示や、thinking ブロック直後の過負荷エラーで終了する問題が修正されました。compact 後も長すぎる場合は、直近の会話を減らして再度 compact します。","r":[10,11,12]},{"t":"Ultracodeが独立トグルに","b":"Ultracode は `/effort` 内の独立したトグルになり、xhigh を強制せず任意の effort で有効にできます。VS Code にも切り替えスイッチが追加されました。","r":[63,73]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"自動モードに「次回も確認する」回答が加わり、外部 symlink のルールにも承認プロンプトが出るようになりました。auto-memory の不可視文字や偽装タグの無害化、sandbox 関連の修正も含まれます。","refs":[2,33,34,35,46,52,62]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"Explore サブエージェントは、Claude Code が認識しないモデル ID のセッションでそのモデルを引き継ぎます。Monitor の表示改善と、`SendMessage` ツールなしのセッションへの誤案内の修正もあります。","refs":[39,43,51]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"プラグインの設定画面、marketplace、hook のログと Elicitation の `block` 判定が修正されました。`/loop`、`/recap`、`/ultrareview`、アーティファクト関連も調整されています。","refs":[18,23,36,37,38,44,54,56]},{"a":"S","name":"セッション・履歴・圧縮","dg":"compact 後も「Prompt is too long」が続く場合に、直近の会話を減らして再度 compact するようになりました。","refs":[12,58,68]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"`/mcp reconnect all` が追加され、再開セッションでの MCP ツール呼び出しは接続を最大10秒待つようになりました。`claude mcp add` は managed settings の制限下で成功を装わず拒否します。","refs":[3,6,15,17,50]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VS Code 拡張にメッセージのタイムスタンプ、プラグインのエラー表示、Ultracode スイッチが追加され、多数の不具合が修正されました。Claude Tag、Remote Control、Cloud sessions、Claude Desktop 関連の改善も含まれます。","refs":[20,32,40,45,47,59,60,61,69,70,71,72,73,74,75,76,77,78,79,80,81,82,83,84,85,86,87,88,89,90,91,92,93,94,95,96,97,98,99,100]},{"a":"H","name":"headless・SDK・API","dg":"ストリーム破損、過負荷エラー、プラン使用量エンドポイントの再試行まわりが改善されました。Claude apps gateway には支出額表示、Google Cloud への telemetry 転送、証明書認証、431 エラーの修正が入っています。","refs":[7,8,9,10,14,19,48,57,64,67]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"Sonnet 5.5 の追加と、モデル利用不可時の通知修正が入っています。Ultracode の独立トグル化と、安全関連のモデル切り替え挙動の変更もあります。","refs":[1,11,13,16,41,42,49,53,63,65,66]},{"a":"U","name":"UI・表示・入力","dg":"キーバインド操作の追加、`/rate-limit-options` の追加、使用量制限の待機表示の改善が入っています。fullscreen 描画、vim モード、各種ダイアログ表示の不具合も修正されました。","refs":[4,5,21,24,25,26,27,28,29,30,31,55]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"設定スキーマを必要な部分だけ構築し、起動時間とメモリ使用量を改善しました。Windows で多数のプラグイン有効時に Bash ツールが失敗する問題も修正されています。","refs":[22]}],"skip":"表示の乱れ、vim モードやキー操作の細かな不具合、まれな環境でのクラッシュなどの修正が約40件あります。","st":"ok","stale":false,"e":[[1,"Claude Sonnet 5.5 (`claude-sonnet-5-5`) が Anthropic API の既定 Sonnet になり、1M コンテキストに対応","Added Claude Sonnet 5.5 (`claude-sonnet-5-5`), now the default Sonnet model on the Anthropic API — 1M context, $2/$10 per Mtok with $0.20/Mtok cache reads","L","new",3,"cli,sdk",0,[],"model-selection"],[2,"auto mode の作業ディレクトリ外の読み取り確認に「今回だけ許可して次回も確認」の選択肢を追加","Added a \"Yes, but ask again next time\" answer to auto mode's prompt before a read outside the working directories, so you can allow that one read and still be asked about later ones","T","new",2,"cli",0,[],"auto-mode"],[3,"`/usage` とステータスラインに Claude apps gateway の支出上限を金額で表示し、`rate_limits.spend_limit` に `used_usd` などを追加","Added dollar amounts to the Claude apps gateway spend limit in `/usage` and the status line (for example \"$271.40 / $500.00 spent this month\") when the gateway runs this version or later; the status line's `rate_limits.spend_limit` also gains `used_usd`, `limit_usd` and `period`","C","new",2,"cli,admin",0,[],"statusline"],[4,"`effortSlider:decreaseEffort`、`increaseEffort`、`toggleUltracode` を追加し `/effort` スライダーのキーを再割り当て可能に","Added `effortSlider:decreaseEffort`, `increaseEffort` and `toggleUltracode` keybinding actions, so the `/effort` slider's arrow and Tab keys can be rebound in `keybindings.json`","U","new",1,"cli",0,[],"keybindings"],[5,"claude.ai 購読者向けに `/rate-limit-options` を `/help` とコマンドメニューに追加","Added `/rate-limit-options` to `/help` and the command menu for claude.ai subscribers, so the usage-limit notices that mention it point to a command you can find","U","new",1,"cli",0,[],"slash-commands"],[6,"`/mcp reconnect all` で接続失敗・認証が必要な MCP サーバーをまとめて再試行","Added `/mcp reconnect all` in the interactive terminal to retry every MCP server that failed to connect or needs authentication at once","C","new",2,"cli",0,[],"mcp"],[7,"managed policy の `availableModels` が空、または起動モデルを欠く場合に Claude apps gateway が起動時に警告","Added Claude apps gateway startup warnings when a managed policy's `availableModels` is empty, or leaves out the model Claude Code starts on without setting `model` or `enforceAvailableModels`","H","new",1,"admin",0,[],"managed-settings"],[8,"gateway の `telemetry.forward_to` に `auth: { google: {} }` を追加し Google Cloud の OTLP へ直接送信可能に","Added `auth: { google: {} }` for Claude apps gateway `telemetry.forward_to` destinations, so telemetry can be exported straight to Google Cloud's OTLP endpoint using the gateway's Google Cloud credentials","H","new",1,"admin",0,[],"telemetry"],[9,"Claude apps gateway と IdP 間で証明書クライアント認証 (`private_key_jwt`) に対応","Added certificate client authentication (`private_key_jwt`) between the Claude apps gateway and its identity provider, for identity providers that issue certificate credentials instead of client secrets","H","new",1,"admin",0,[],"auth-login"],[10,"壊れた応答ストリームで生のエラーや「undefined」が出ず、再試行または中断として報告される","Fixed a damaged response stream showing raw errors such as \"JSON Parse error\" or \"undefined is not an object\", or writing the word \"undefined\" into an answer, instead of being retried or reported as an interrupted response","H","fix",2,"cli,sdk",0,[],"headless-ci"],[11,"thinking ブロック直後の過負荷・サーバーエラーでターンが終了せず再試行される","Fixed an overloaded or server error arriving right after a thinking block ending the turn with an error instead of being retried","L","fix",2,"cli",0,[],"thinking-effort"],[12,"圧縮後も「Prompt is too long」になる場合、直近の会話を減らしてもう一度圧縮する","Fixed \"Prompt is too long\" errors that persisted after compacting: when the compacted request is still too long, Claude Code now compacts once more, keeping less of the recent conversation","S","fix",2,"cli",0,[],"compaction-context"],[13,"モデルが使えずフォールバックも無い場合に、モデル利用不可の通知と Learn more リンクを表示","Fixed a session whose model is unavailable, with no fallback model left, showing a bare \"is currently unavailable\" message (or \"Something went wrong\" in cloud sessions) instead of the model-unavailable notice and its Learn more link","L","fix",1,"cli,cloud",0,[],"model-selection"],[14,"不正な `source` の画像や文書ブロックで Agent SDK セッションが落ちず、画像は説明メモに置換される","Fixed Agent SDK sessions crashing when a user message contains an image with a malformed `source`, and failing on every later turn after a malformed document block; a malformed image is now replaced with an explanatory note","H","fix",2,"sdk",0,[],"sdk"],[15,"再開したセッションの MCP ツール呼び出しが、接続中のサーバーを最大 10 秒待つ","Fixed MCP tool calls in a resumed session failing with \"No such tool available\" while their server was still connecting; the call now waits up to 10 seconds for the server","C","fix",2,"cli",0,[],"mcp"],[16,"プラン使用量エンドポイントがレート制限や拒否を返した後、`/usage` などが再問い合わせせずバックオフする","Fixed repeated calls to the plan-usage endpoint after it rate-limits or rejects your login: `/usage`, `/extra-usage` and IDE usage views now back off instead of re-asking","L","fix",1,"cli,ide",0,[],"performance"],[17,"managed settings が MCP をプラグインに限定する場合、`claude mcp add` が成功扱いにせず拒否して案内する","Fixed `claude mcp add` reporting success when managed settings restrict MCP servers to plugins; it now refuses and says what to do, instead of saving a server that never loads","C","fix",2,"cli,admin",0,[],"mcp"],[18,"`/plugin` 設定画面で真偽値は選択式、数値は不正入力を拒否し、←/→ は入力欄の変更になる","Fixed the `/plugin` configure screen: boolean options are now a true/false choice instead of free text, number options refuse invalid input, and ←/→ change an options field instead of switching tabs","M","fix",1,"cli,mod-dev",0,[],"plugins-mods"],[19,"`ANTHROPIC_FOUNDRY_RESOURCE` が検証なしでホストに埋め込まれず、単純なリソース名以外は拒否される","Fixed `ANTHROPIC_FOUNDRY_RESOURCE` being interpolated into the Foundry endpoint host unvalidated; a value that is not a plain resource name is now refused","H","fix",2,"sdk,admin",0,[],"bedrock-vertex"],[20,"Claude apps gateway 経由の Claude Desktop で、1M 対応モデルが自動で印付けされ 1M オプションが出る","Fixed Claude Desktop behind a Claude apps gateway offering no 1M context option: the gateway now marks each 1M-capable model for Desktop automatically","I","fix",1,"ide,admin",0,[],"desktop"],[21,"shell モードで ↓ を押しても隠れた background-tasks pill が選択されず、Backspace や Ctrl+U が効く","Fixed ↓ in shell mode selecting a hidden background-tasks pill, which stopped Backspace and Ctrl+U from editing the prompt","U","fix",1,"cli",0,[],"prompt-input"],[22,"Windows でプラグインが多くても Bash tool が動く。存在しない `bin/` は PATH に追加せず重複も除外","Fixed Bash tool failing on Windows with many plugins enabled: plugin `bin/` directories that don't exist are no longer added to PATH, and inherited entries aren't added twice","O","fix",2,"windows",0,[],"windows"],[23,"古い git (2.39 未満) で `sparsePaths` マーケットプレイスが空で clone され作業コピーを置換する問題を解消","Fixed `sparsePaths` plugin marketplaces cloning empty and replacing a working local copy on older git (before 2.39), which failed every refresh with \"marketplace.json file is no longer present\"","M","fix",1,"mod-dev",0,[],"plugins-mods"],[24,"フルスクリーンで transcript の `[` によるスクロールバック書き出し時に、上の端末出力を消さない","Fixed fullscreen rendering erasing the terminal output above the session when `[` in transcript mode writes the conversation to scrollback (macOS and Linux)","U","fix",1,"cli,macos",0,[],"output-rendering"],[25,"フルスクリーンで上にスクロール中に返信のストリーミングが終わっても、スクロール位置が飛ばない","Fixed fullscreen scroll position jumping to the previous message or to the bottom when a reply finished streaming while scrolled up","U","fix",1,"cli",0,[],"output-rendering"],[26,"狭い端末で `/config` や `/plugin` のタブが単語途中で崩れず、入らないタブは丸ごと次の行へ","Fixed tab bars in dialogs such as `/config` and `/plugin` breaking the title and tab labels mid-word in a narrow terminal; a tab that doesn't fit now moves to the next line whole","U","fix",1,"cli",0,[],"output-rendering"],[27,"`/model` ピッカーの「+1 model」が、見えている行より下のモデル数だけを数える","Fixed the `/model` picker showing \"+1 model\" below the list after scrolling to the last model; the count now covers only the models below the visible rows","U","fix",1,"cli",0,[],"model-selection"],[28,"`/keybindings` が何も起こさないフッター操作の Backspace/Delete 割り当てを生成しない","Fixed `/keybindings` writing Backspace and Delete bindings for a footer action that does nothing into the generated `keybindings.json`","U","fix",1,"cli",0,[],"keybindings"],[29,"再割り当てした `footer:close` が、表示中エージェントの行で「x」を入力せず正しく動く","Fixed a rebound agent panel close key (`footer:close`) typing \"x\" instead of itself on the row of the agent you're viewing","U","fix",1,"cli",0,[],"keybindings"],[30,"vim mode の `.` が高速入力や非 bracketed paste でも繰り返せ、`cw`→Esc 後に INSERT のままにならない","Fixed vim mode `.` not repeating text typed very fast (for example over ssh or in tmux) or pasted without bracketed paste, and leaving the prompt in INSERT mode after repeating a change with nothing typed (such as `cw` then Esc)","U","fix",1,"cli",0,[],"vim-mode"],[31,"vim mode で `dd` や `yy` の後にカーソルが画像プレースホルダの開き括弧に残らない","Fixed vim mode leaving the cursor on an image placeholder's opening bracket after `dd` on the last line or `yy` at the end of the prompt, where `r` or `x` would break or delete the image","U","fix",1,"cli",0,[],"vim-mode"],[32,"端末フォーカス復帰直後のキー入力が、安全な待ち時間前に Remote Control 有効化の確認へ答えてしまわない","Fixed a key pressed the instant the terminal regained focus answering the Remote Control enable prompt before its short safety delay restarted","I","fix",1,"cloud",0,[],"remote-control"],[33,"ホームで起動した場合に、レンダラー切替や更新後にワークスペース信頼ダイアログが再度出ない","Fixed the workspace trust dialog appearing a second time after switching renderers or updating when Claude Code was started in the home directory","T","fix",1,"cli",0,[],"permissions"],[34,"外部から `.claude/rules` へ symlink したルールや `.claude` symlink でも外部 import の承認プロンプトを表示","Fixed rules symlinked into `.claude/rules` from outside the project being skipped without ever showing the external-imports approval prompt; a `.claude` directory symlinked from outside the project now asks for the same approval","T","fix",2,"cli,admin",0,[],"permissions"],[35,"`allowManagedPermissionRulesOnly` 下で、公式または managed が保証する source 以外のプラグインの `allowed-tools` 事前承認を無効化","Fixed plugins from marketplaces, claude.ai and npm pre-approving their own tools via `allowed-tools` under managed `allowManagedPermissionRulesOnly`; only plugins from an official Anthropic source or a source that managed settings vouch for keep that pre-approval","T","fix",3,"admin,mod-dev",0,[],"permissions"],[36,"依存の version range を満たせない初回 `claude plugin install` が、プラグインを有効・記録済みのまま残さない","Fixed a failed first `claude plugin install` leaving the plugin enabled and recorded when a dependency's version range could not be met","M","fix",1,"cli,mod-dev",0,[],"plugins-mods"],[37,"失敗した hook の stderr と status code がデバッグログに残る。出力なしの失敗も記録","Fixed the debug log dropping a failed hook's stderr when the hook also wrote to stdout, and logging nothing for a failed hook with no output; failed hooks now also log their status code","M","fix",1,"mod-dev",0,[],"hooks"],[38,"Elicitation/ElicitationResult hook の `{\"decision\":\"block\"}` が exit code 2 同様に MCP elicitation を拒否","Fixed `{\"decision\":\"block\"}` returned by Elicitation and ElicitationResult hooks being ignored; it now declines the MCP elicitation, as exit code 2 does","M","fix",2,"mod-dev",0,[],"hooks"],[39,"`SendMessage` ツール無しで起動したセッションが、それで他セッションへ送るよう指示されない","Fixed sessions launched without the `SendMessage` tool (such as by Claude Desktop) still being told to message other sessions with it","A","fix",1,"ide",0,[],"agent-teams"],[40,"Remote Control で送った写真が、キュー済みメッセージをターミナルに戻して編集しても失われない","Fixed a photo sent from the Claude app over Remote Control being lost when its queued message was pulled back into the terminal prompt to edit, and the cursor moving one character for a photo with no caption"," ,[86,"大きなテキストファイル添付時に、圧縮後も「Prompt is too long」になる問題を解消","[VSCode] Fixed \"Prompt is too long\" errors after compaction when a large text file is attached to a message","I","fix",2,"ide",0,[],"vscode"],[87,"パスに非 ASCII 文字・空白・括弧を含むファイルへのチャットリンクが開ける","[VSCode] Fixed chat links to files with non-ASCII characters, spaces or brackets in their path not opening","I","fix",1,"ide",0,[],"vscode"],[88,"`claudeCode.environmentVariables` の `CLAUDE_CONFIG_DIR` は絶対パスの場合のみ適用し、会話を継続する端末にも渡す","[VSCode] Changed `CLAUDE_CONFIG_DIR` in the `claudeCode.environmentVariables` setting to apply only when it is an absolute path, and passed it to terminals that continue the chat","I","change",2,"ide",1,[],"vscode"],[89,"オフライン時の routine の Edit/Duplicate が、読み込み中でなくオフラインであることを表示","[Cloud sessions] Fixed a routine's Edit and Duplicate controls saying the routine was still loading while you were offline; they now tell you you're offline","I","fix",1,"cloud",0,[],"web-cloud-sessions"],[90,"スレッド・チャンネル既定・DM に「Opus (latest)」などのモデルファミリー選択を追加し、最新モデルに追従","[Claude Tag] Added model family choices such as \"Opus (latest)\" for a thread, a channel default or your DM, so the choice follows the newest model in that family","I","new",2,"cloud",0,[],"claude-tag"],[91,"分析の支出予測チャートに、組織全体の上限に算入される支出と上限の使用割合を追加","[Claude Tag] Added the spend that counts toward your organization-wide limit to the analytics spend projection chart, with how much of the limit is used","I","new",1,"cloud,admin",0,[],"claude-tag"],[92,"GitHub Enterprise ホスト名に下線があっても、旧 Slack アプリの進捗カードとリンクプレビューにリポジトリと Create PR が出る","[Claude Tag] Fixed the earlier Claude in Slack app's progress card and link previews omitting the repository and Create PR button when a GitHub Enterprise host name contains an underscore","I","fix",1,"cloud",0,[],"claude-tag"],[93,"環境が起動を拒否するチャンネルで、管理者連絡を促す通知を 1 回投稿し、@メンションで再試行する","[Claude Tag] Fixed Claude staying silent in a channel whose environment declines to start it; it now posts one notice asking you to contact an admin, and retries when @-mentioned","I","fix",2,"cloud,admin",0,[],"claude-tag"],[94,"Claude アカウント未接続の人からの @メンションごとに、非公開のサインイン通知を投稿","[Claude Tag] Changed Claude to post its private sign-in notice at every @mention from someone who hasn't connected their Claude account, instead of going quiet after the first","I","change",1,"cloud",0,[],"claude-tag"],[95,"管理設定の「Notify members now」が Enterprise Grid の全申請ワークスペースと大規模ワークスペースの多くのメンバーに届く","[Claude Tag] Improved \"Notify members now\" in admin settings: one press reaches every workspace your organization claimed in an Enterprise Grid, and more members in large workspaces","I","improve",1,"cloud,admin",0,[],"claude-tag"],[96,"オンデマンド runner の self-hosted 環境で、runner の起動中・再試行・起動しない状態を待機通知に表示","[Claude Tag] Improved Claude's wait notice on self-hosted environments with on-demand runners: it now says whether a runner is starting, a start will be retried, or no runner will start","I","improve",1,"cloud,admin",0,[],"claude-tag"],[97,"Slack ワークスペースが組織に接続済みと確認できず channel manager 追加に失敗した際のエラー表示を改善","[Claude Tag] Improved the error shown when adding a channel manager fails because the channel's Slack workspace can't be confirmed as connected to your organization","I","improve",1,"cloud,admin",0,[],"claude-tag"],[98,"管理設定のチャンネルアクセス一覧に、auto-join パターンが付与するコネクタ・リポジトリ・プラグインと由来を表示","[Claude Tag] Improved a channel's access lists in admin settings to show the connectors, repositories and plugins an auto-join pattern attaches, and where each comes from","I","improve",1,"cloud,admin",0,[],"claude-tag"],[99,"channel manager のリポジトリ追加で、GitHub 管理者権限を確認できない場合に GitHub サインインを促す","[Claude Tag] Improved adding repositories as a channel manager: when your GitHub sign-in can't confirm you're a repository admin, the page asks you to sign in with GitHub","I","improve",1,"cloud,admin",0,[],"claude-tag"],[100,"PR に GitHub App の未送信レビューがあっても、Code Review が先に投稿を再試行して完成レビューを投稿する","[Code Review] Fixed Code Review giving up without posting a finished review when an unsubmitted review under its GitHub App was open on the pull request; it now retries the post first","I","fix",2,"cloud",0,[],"code-review"]]},{"v":"2.1.283","date":"2026-09-26（土）03:46","dshort":"09-26 03:46","nb":4,"head":"プラグイン管理とMCP周りの修正、auto mode既定の変更が中心","sum":"v2.1.283 はプラグイン管理・MCP・UI操作の修正が多数を占めるリリースです。管理者向けにモデル制限の設定（`availableModelsMatch`、`deniedModels`）が加わりました。サードパーティプロバイダーまたはテレメトリ無効時の既定の権限モードが変わるため、該当する利用者は確認が必要です。","watch":[{"b":"サードパーティプロバイダーまたはテレメトリ無効の環境では既定で auto mode になるため、従来の挙動を保つなら `permissions.defaultMode` を明示する。","r":[63]},{"b":"`Skill(anthropic-skills:\u003cname\u003e)` と `Skill(skill:\u003cname\u003e)` の deny ルールの照合範囲が広がったため、既存ルールが意図せず他の経路のスキルを止めないか確認する。","r":[68]},{"b":"`claude plugin eval` は git 導入済みなら 2.31 以上が必須となり、古い git では拒否されるため、git を更新する。","r":[71]},{"b":"自動で張られた artifact の watch は 3.5 時間無操作で終了するため、継続したい場合は artifact を再度公開または watch する。","r":[72]},{"b":"2.1.282 での `claude-ai` 名の予約が取り消され、該当名のスキルなどが再び読み込まれ、`Skill(claude-ai:*)` は通常の前置一致ルールになるため、既存の拒否ルールがあれば見直す。","r":[75]},{"b":"セルフホストランナーのライフサイクルフックの git は、Git LFS の `pre-push` フックの省略や書き込み可能なシステム `core.hooksPath` の無視などに変わり、`--configure-git` なしではコミットに署名しないため、必要なら `--configure-git` を付ける。","r":[73,74]}],"hl":[{"t":"auto mode が既定に","b":"サードパーティプロバイダー利用時またはテレメトリ無効時の対話セッションは、権限モード未設定なら auto mode で開始します。`permissions.defaultMode` で上書きできます。","r":[63]},{"t":"管理者向けモデル制限","b":"`availableModelsMatch` を `\"exact\"` にすると、`availableModels` に書いたバージョンだけを許可します。`deniedModels` は `availableModels` で許可されたモデルも拒否します。","r":[2,3]},{"t":"プラグイン管理の修正","b":"`claude plugin validate` の検証漏れ、`installed_plugins.json` の読み込み不能や書き換えによる記録消失、ホームディレクトリ移動後の cache-miss など、複数の不具合を修正しました。復旧手順も案内されます。","r":[20,21,26,27,28,57]},{"t":"MCP の安定性向上","b":"長時間ツールの進捗通知の欠落、起動中に終了した stdio サーバーの残留、一時的な 404 後に使えなくなる問題を修正しました。`claude mcp add` などの書き込み失敗も正しく報告されます。","r":[11,12,13,32]},{"t":"Windows の削除保護","b":"PowerShell ツールで `cmd /c rd`、`rmdir`、`del`、`erase` によるドライブルートやホームフォルダの削除を防ぐようにしました。","r":[47]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"auto mode の既定変更、`/ultrareview` の注意文、deny ルールの照合拡大が入りました。sandbox 設定、git 証明書、auto-memory 編集、Windows の削除保護も修正しています。","refs":[38,39,40,41,47,63,68]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"モデルのフォールバック中に開始した動的ワークフローが、設定済みモデルで再試行されず全エージェントがフォールバックモデルで動く問題を修正しました。","refs":[18]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"プラグイン検証・アンインストール・復元・`installed_plugins.json` まわりの修正が中心です。`/doctor prompt-audit` が追加され、`claude-ai` 名の予約は取り消されました。","refs":[5,20,21,22,23,24,25,26,27,28,55,56,57,71,75]},{"a":"S","name":"セッション・履歴・圧縮","dg":"コンパクション中のスピナーは開始時点からタイマーが動き、要約のトークン数を表示するようになりました。","refs":[53]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP の進捗通知、サーバーの残留、404 後の状態、認証、設定書き込みの報告を修正しました。`/mcp` の一覧表示も改善し、画像結果はファイルにも保存されます。","refs":[11,12,13,14,32,48,49,54]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VS Code 拡張、クラウドセッション、Claude Tag、Code Review の修正が中心です。Remote Control がテレメトリ無効の有料プランで使えない問題も直りました。","refs":[33,42,58,72,73,74,76,77,78,79,80,81,82,83,84,85,86,87,88,89,90,91,92,93,94]},{"a":"H","name":"headless・SDK・API","dg":"ゲートウェイ向けに `x-claude-code-prompt-id` ヘッダー、OpenTelemetry の `tool.output` への出力追加、`mantle` プロバイダー、`load_test_mode` が加わりました。`--system-prompt` と `-file` 形式も併用できます。","refs":[1,4,7,8,9,10,67]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"モデル制限設定の追加に加え、`/model` の入力検証や表示、`DISABLE_PROMPT_CACHING_HAIKU`、`/usage` の表示を修正しました。初回応答までの遅延も短縮しています。","refs":[2,3,16,17,19,30,59,65]},{"a":"U","name":"UI・表示・入力","dg":"`/tasks` と各種ピッカーにページ送り・マウス・クリック操作が加わりました。vim モード、キーバインド警告、スクリーンリーダー、Warp のリンク表示も修正しています。","refs":[6,15,29,31,34,35,36,37,43,44,45,46,50,51,52,64,66,69,70]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"`claude -p` と Claude Code Remote は対話 UI を読み込まなくなり、auto mode の分類器ルールと Artifact ツールは初回使用時に読み込まれます。claude.ai アカウントでは起動時の最大 1.5 秒の待ちもなくなりました。","refs":[60,61,62]}],"skip":"表示の乱れ、vim モードの細かな挙動、まれな環境での不具合などの修正が約 40 件あります。","st":"ok","stale":false,"e":[[1,"ゲートウェイのヒントヘッダーに `x-claude-code-prompt-id` を追加し、1 プロンプト分のリクエストをまとめられる（`CLAUDE_CODE_GATEWAY_HINT_HEADERS=1` で有効化）","Added `x-claude-code-prompt-id` to the gateway hint headers so LLM gateways can group the requests that serve one user prompt; opt in with `CLAUDE_CODE_GATEWAY_HINT_HEADERS=1`","H","new",2,"sdk,admin",0,[],"sdk"],[2,"`availableModelsMatch` で `\"exact\"` を指定すると、`availableModels` の項目が名指しのバージョンだけを許可する","Added `availableModelsMatch` managed setting: with `\"exact\"`, an `availableModels` entry allows only the model version it names, so new releases stay blocked until listed","L","new",2,"admin",0,[],"managed-settings"],[3,"`deniedModels` managed setting で、`availableModels` が許可していても特定モデルをブロックできる","Added `deniedModels` managed setting to block specific models, even when `availableModels` allows them","L","new",2,"admin",0,[],"managed-settings"],[4,"`OTEL_LOG_TOOL_CONTENT=1` のとき `tool.output` span event に MCP・WebFetch・WebSearch の出力も含まれる","Added MCP tool, WebFetch and WebSearch outputs to the `tool.output` OpenTelemetry span event when `OTEL_LOG_TOOL_CONTENT=1`","H","new",1,"sdk,admin",0,[],"telemetry"],[5,"`/doctor prompt-audit`（`/checkup prompt-audit`）で CLAUDE.md・skills・agents・commands の旧モデル向け記述を監査できる","Added `/doctor prompt-audit` (also `/checkup prompt-audit`) to audit your CLAUDE.md files, skills, agents and commands for prompting patterns written for older models","M","new",2,"cli",0,[],"slash-commands"],[6,"フルスクリーン表示で、他セッションの切り詰められたメッセージをクリックで展開できる","Added click-to-expand for truncated messages from your other sessions in fullscreen mode","U","new",1,"cli",0,[],"output-rendering"],[7,"stream-json の `system/init` `plugin_errors` にある `--plugin-dir` 読み込み失敗エントリに、読めなかったディレクトリの `path` を追加","Added `path` to `--plugin-dir` load-failure entries in the stream-json `system/init` `plugin_errors`, naming the directory that did not load","H","new",1,"sdk,mod-dev",0,[],"plugins-mods"],[8,"Claude apps gateway 設定に `load_test_mode` を追加。リクエストは署名まで行い上流へ送らず定型応答を返すので負荷試験ができる","Added an opt-in `load_test_mode` block to the Claude apps gateway config: requests are built and signed but not sent upstream, and clients get a canned reply, so a deployment can be load tested","H","new",1,"admin,sdk",0,[],"headless-ci"],[9,"Claude apps gateway に Amazon Bedrock の Mantle エンドポイント向け `mantle` upstream provider を追加","Added a `mantle` upstream provider to the Claude apps gateway for Amazon Bedrock's Mantle endpoint","H","new",2,"admin,sdk",0,[],"bedrock-vertex"],[10,"SDK セッションが、早期終了したターンの保留ツール呼び出しや完了結果、worker 再起動後の承認待ち、非ストリーミング fallback の `result.usage` を失わない","Fixed SDK sessions losing a deferred tool call or finished tool result when a turn ended early, a held approval prompt after a worker restart, and a non-streaming fallback's `result.usage`","H","fix",2,"sdk",0,[],"sdk"],[11,"長時間実行ツールがバックグラウンドに移っても MCP の進捗通知が捨てられず、バックグラウンドタスクに最新の進捗が出る","Fixed MCP progress notifications being discarded once a long-running tool call moved to the background; the background task now shows the latest progress","C","fix",1,"cli",0,[],"mcp"],[12,"起動中にセッションが終了しても stdio MCP サーバーが残らない","Fixed stdio MCP servers being left running when the session ended while they were still starting","C","fix",1,"cli",0,[],"mcp"],[13,"ステートレスなリモート MCP サーバーの一時的な HTTP 404 のあとも、そのサーバーが使えなくなったまま接続表示になることがない","Fixed a brief HTTP 404 from a stateless remote MCP server (for example a proxy mid-redeploy) leaving that server unusable for the rest of the session while still shown as connected","C","fix",2,"cli",0,[],"mcp"],[14,"有効な URL を持たない MCP サーバーのサインインが不明瞭な SDK エラーにならず、`/mcp` も Authenticate を出さない","Fixed MCP sign-in for a server with no valid URL failing with an opaque SDK error; `/mcp` no longer offers Authenticate for such servers","C","fix",1,"cli",0,[],"mcp"],[15,"telemetry 無効でも週次の Fable 上限が `/usage` と VS Code の使用量メーターに表示される","Fixed the weekly Fable limit not appearing in `/usage` and the VS Code usage meters when telemetry is disabled","U","fix",1,"cli,ide",0,[],"telemetry"],[16,"`/model` が日付や `-v1:0` 付きの Sonnet 4.6 / Sonnet 5 の `[1m]` を、素の id が拒否される場合に誤って受け付けない","Fixed `/model` accepting Sonnet 4.6 or Sonnet 5 with `[1m]` when the id carried a date or `-v1:0` suffix, in the cases where the plain id was refused","L","fix",1,"cli",0,[],"model-selection"],[17,"`ANTHROPIC_DEFAULT_HAIKU_MODEL` で別モデルを固定しても、`/model` ピッカーが固定の Haiku バージョンと価格を出さない","Fixed `/model` picker showing a hardcoded Haiku version and price when `ANTHROPIC_DEFAULT_HAIKU_MODEL` pins a different model","L","fix",1,"cli",0,[],"model-selection"],[18,"モデル fallback 中に始まった動的ワークフローが、全エージェントを fallback モデルで動かさず設定モデルを再試行する","Fixed dynamic workflows started during a model fallback running every agent on the fallback model instead of retrying the configured model","A","fix",1,"cli",0,[],"subagents"],[19,"Haiku がセッションのメインモデルのときも `DISABLE_PROMPT_CACHING_HAIKU` が効く","Fixed `DISABLE_PROMPT_CACHING_HAIKU` having no effect when Haiku is the session's main model","L","fix",1,"cli",0,[],"model-selection"],[20,"`claude plugin validate` が、インストールできない plugin や marketplace 名を受け付けず、`marketplace.json` のそうした名前は検証に失敗する","Fixed `claude plugin validate` saying Claude Code accepts a plugin or marketplace name it cannot install; such names in `marketplace.json` now fail validation","M","fix",1,"mod-dev",0,[],"plugins-mods"],[21,"`claude plugin validate` が、`outputStyles`・`themes`・`monitors`・`lspServers` のパスが無い・plugin 外を指す plugin を通さない","Fixed `claude plugin validate` passing plugins whose `outputStyles`, `themes`, `monitors`, or `lspServers` paths are missing or point outside the plugin directory","M","fix",1,"mod-dev",0,[],"plugins-mods"],[22,"`plugin.json` でサーバーを宣言した plugin の MCP サーバー数を `claude plugin details` が正しく表示する","Fixed `claude plugin details` showing 0 MCP servers for plugins that declare their servers in `plugin.json`","M","fix",1,"mod-dev",0,[],"plugins-mods"],[23,"`claude plugin marketplace remove` が、marketplace と一緒にアンインストールした plugin を一覧で示す","Fixed `claude plugin marketplace remove` not saying which installed plugins it uninstalled with the marketplace; it now lists them","M","improve",1,"cli",0,[],"plugins-mods"],[24,"id が大文字小文字だけ違う 2 つの plugin で、`enabledPlugins` に項目がない側を `uninstall` しても、もう一方が設定やシークレットごと消えない","Fixed `claude plugin uninstall` removing the other of two installed plugins whose ids differ only in case, with its options and secrets, when the one named had no `enabledPlugins` entry at that scope","M","fix",2,"cli",0,[],"plugins-mods"],[25,"バージョン未宣言の plugin が、キャッシュ欠落時に導入済みでなくソースの最新コミットで黙って復元されることがない","Fixed plugins that declare no version being silently restored at their source's newest commit, not the installed one, when their cached files were missing","M","fix",1,"mod-dev",0,[],"plugins-mods"],[26,"home や config ディレクトリの移動後（bind mount の devcontainer など）も、ユーザー導入の plugin と marketplace が \"cache-miss\" にならず読み込める","Fixed user-installed plugins and marketplaces failing to load with \"cache-miss\" after the home or config directory was moved, for example in bind-mounted devcontainers","M","fix",2,"cli",0,[],"plugins-mods"],[27,"無効な plugin id の記録があっても `installed_plugins.json` が空に見えず、再び読み込める","Fixed `installed_plugins.json` showing no plugins when it holds a record under an invalid plugin id; such a file loads again","M","fix",1,"cli",0,[],"plugins-mods"],[28,"読めない記録を含む `installed_plugins.json` が書き換えられて記録を失わず、`claude plugin` が該当記録と復旧方法を示す","Fixed `installed_plugins.json` being rewritten, losing records, when it holds a record this version cannot read; `claude plugin` commands now name the record and say how to recover","M","fix",2,"cli",0,[],"plugins-mods"],[29,"スクリーンリーダーモードの権限ダイアログが、引用されたコマンドやパスをダイアログ自身の文言のように読み上げない","Fixed permission dialogs in screen-reader mode reading quoted commands and paths as if they were the dialog's own text","U","fix",1,"cli",0,[],"screen-reader"],[30,"`/context` が MCP サーバーの instructions を別行として表示し、合計にも含める","Fixed `/context` not counting MCP server instructions: they now appear as their own row and count toward the total","L","fix",1,"cli",0,[],"compaction-context"],[31,"Warp ターミナルで markdown リンクがクリック可能なハイパーリンクとして描画される","Fixed markdown links in the Warp terminal rendering as plain text instead of

third-party providers to use and offer auto mode, as on newer models; `disableAutoMode` turns both off","T","change",2,"cli,admin",1,[],"auto-mode"],[123,"Code Mode のスクリプト出力に UserPromptSubmit hook が走らない。伏せ字には `updatedToolOutput` 付き PostToolUse hook を使う","Changed Code Mode to no longer run UserPromptSubmit hooks, managed ones included, on scripts' output; to redact that output, use a PostToolUse hook with `updatedToolOutput`","M","change",2,"mod-dev,admin",1,[],"hooks"],[124,"多くのモデルで `/code-review` がバグと CLAUDE.md 違反のみ報告。再利用・簡素化・効率化は `/simplify`","Changed `/code-review` on most models to report only bugs and CLAUDE.md violations; run `/simplify` for reuse, simplification and efficiency cleanups","M","change",2,"cli",1,[],"code-review"],[125,"`/code-review` が指摘を Important/Pre-existing/Nit に分類し、要約末尾に修正案を付ける。指摘なしは \"Code review found no issues.\"","Changed `/code-review` to mark each finding Important, Pre-existing or Nit on most models, and to end each summary with a suggested fix; a clean review's list now reads \"Code review found no issues.\"","M","change",2,"cli",0,[],"code-review"],[126,"`deniedMcpServers` の `claude.ai \u003cname\u003e` 形式が、クラウドと self-hosted runner セッションの同コネクタにも適用される","Changed `deniedMcpServers` entries of the form `claude.ai \u003cname\u003e` to apply to that connector in cloud and self-hosted runner sessions too","C","change",2,"admin,cloud",1,[],"mcp"],[127,"managed `PostToolUse` hook は実行前に拒否された呼び出しでは発火しない。`PostToolBatch` は拒否印なしで大半を受け取る","Changed managed `PostToolUse` hooks to no longer fire for calls refused before they ran: no log entry, rewrite, block or stop there; `PostToolBatch` gets most, not marked as refused","M","change",2,"mod-dev,admin",1,[],"hooks"],[128,"`/bug` が送信前に Yes/No を確認し、Enter 連打で送信や GitHub 起動をしない","Changed `/bug` to ask Yes or No before sending, so repeated Enters no longer send a report or open GitHub","U","change",1,"cli",0,[],"slash-commands"],[129,"`CLAUDE_CODE_FORK_SUBAGENT=0` 時、`claude -p`・SDK・デスクトップ・VS Code のサブエージェントが自身のサブエージェントを既定で待つ","Changed subagents in `claude -p`, the Agent SDK, desktop and VS Code to wait for their own subagents by default when `CLAUDE_CODE_FORK_SUBAGENT=0` is set","A","change",2,"sdk,ide",1,[],"subagents"],[130,"`CLAUDE_CODE_FORK_SUBAGENT=0` の `claude -p` は、バックグラウンドのサブエージェントとその待機先を 10 分の待機で合算する","Changed `claude -p` with `CLAUDE_CODE_FORK_SUBAGENT=0` to count a background subagent and those it waits for against one 10-minute wait; raise `CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS` for longer chains","A","change",2,"sdk",1,[],"subagents"],[131,"PermissionRequest hook がサンドボックス除外コマンドに書き換えたシェルコマンドは、サンドボックス外で実行される","Changed a shell command rewritten by a PermissionRequest hook to a sandbox-excluded command to run outside the sandbox","T","change",2,"cli,admin",1,[],"sandbox"],[132,"Chrome 連携の歓迎画面と `/chrome` が、サイト操作前に確認する旨（権限モードや規則が優先）を表示","Changed the Claude in Chrome welcome screen and `/chrome` to say that Claude Code asks before Claude acts on a site, unless your permission mode or a rule in `/permissions` answers","C","change",1,"cli",0,[],"chrome-extension"],[133,"サードパーティ等の Desktop・SDK セッションで、質問が開いたまま閉じるとターンを終了する","Changed Claude Desktop and Agent SDK sessions on third-party providers or with telemetry or feature flags off to end the turn when closed with a question open, instead of continuing without an answer","I","change",2,"ide,sdk",1,[],"desktop"],[134,"サードパーティやテレメトリ・機能フラグ無効時も、貼り付けテキストを貼り付けとして Claude に伝える","Changed pasted text to be marked for Claude as pasted, on third-party providers or with telemetry or feature flags turned off","L","change",1,"cli",0,[],"prompt-input"],[135,"Anthropic API のターミナルでのサブエージェント進捗要約を、テレメトリ無効時も既定の小型高速モデルが短いメモから生成し、トークンが大幅減","Changed subagent progress summaries in terminal sessions on the Anthropic API to be written by the default small fast model from short notes, also with telemetry off, using far fewer tokens","A","change",1,"cli",0,[],"subagents"],[136,"サンドボックスが起動できないとき（`sandbox.failIfUnavailable` 未設定）、次の Bash コマンドを拒否し、セッション中オフと伝える","Changed how a sandbox that can't start is reported, unless `sandbox.failIfUnavailable` is set: the next sandboxed Bash command is refused and says that the sandbox is off for the session","T","change",2,"cli,admin",1,[],"sandbox"],[137,"`/list-agents` の一覧は本人にだけ表示され、Claude は必要時に自分でセッションを一覧する","Changed `/list-agents` to show its list to you alone; Claude lists sessions itself when needed","M","change",1,"cli",0,[],"slash-commands"],[138,"設定が GitHub ツールを名前で保護する環境では、内蔵 `gh api` が既定でオフ。`--use-anthropic-gh true` でオン","Self-hosted runner: Changed the built-in `gh api` to be off by default where settings guard Claude's GitHub tools by name; `--use-anthropic-gh true` turns it on","I","change",2,"cloud,admin",1,[],"self-hosted-runner"],[139,"セッション本体の `claude` 起動前や終了後にラッパースクリプトが実行する `claude` には、Anthropic 管理 git が付かない","Self-hosted runner: Changed a `claude` that a wrapper script runs before the session's own `claude` is up, or after it has ended, to have no Anthropic-managed git","I","change",1,"cloud",0,[],"self-hosted-runner"],[140,"`CLAUDE_RUNNER_SESSION_UUID` と `CLAUDE_CODE_REMOTE_SESSION_UUID` が、セッションと各 hook の両方に設定される","Self-hosted runner: Changed `CLAUDE_RUNNER_SESSION_UUID` and `CLAUDE_CODE_REMOTE_SESSION_UUID` to both be set for the session and its `checkout`, `post-session` and `spawn-runner` hooks","I","change",1,"cloud",0,[],"self-hosted-runner"],[141,"`--capacity 1` の runner は、push 先リポジトリのパスがシンボリックリンクなら早い段階でセッションを拒否する","Changed self-hosted runners at `--capacity 1` to refuse a session earlier when the path of a repository it pushes to is a symbolic link","I","change",1,"cloud",0,[],"self-hosted-runner"],[142,"他セッションからのメッセージが保留されると通知し、許可できる設定ファイルへのリンクを表示","[VSCode] Added a notice when a message from another session is held, with a link to the settings file that can allow it","I","new",1,"ide",0,[],"vscode"],[143,"パネルが低い、またはコマンド・URL・説明が長くても、権限プロンプトの No ボタン・返信欄・タイトルが切れない","[VSCode] Fixed the permission prompt cutting off its No button, reply field or title when the panel is low or a command, URL or description is long","I","fix",1,"ide",0,[],"vscode"],[144,"失敗・ブロックされたツール呼び出しの理由が表示され、Glob と Grep がエラーを結果として数えない","[VSCode] Fixed failed or blocked tool calls showing no reason or a reason cut short, and Glob and Grep counting an error as results","I","fix",2,"ide",0,[],"vscode"]]},{"v":"2.1.327","date":"2026-11-18（水）05:33","dshort":"11-18 05:33","nb":34,"head":"パス・権限の検査強化と、セッション・データ損失の修正が中心","sum":"権限とパス検査を厳しくする変更が多く、symlink・作業ディレクトリ判定・Bash/PowerShell の確認が増える。あわせて `.mcp.json` やセッション履歴、`/export` などデータ消失につながる不具合を多数修正している。ターミナル表示、サブエージェント、Windows 起動速度の改善も含む。","watch":[{"b":"symlink と作業ディレクトリ内の判定が変わり、これまで通っていたパスで確認や拒否が出るため、必要なら allow ルールを見直す。","r":[134,135]},{"b":"`permissions.blockReadsOutsideWorkingDirectories` が bypass/auto モードで確認や拒否を増やし、Read/Edit の deny ルール下のパスは確認ではなく拒否になるため、該当コマンドを確認する。","r":[136,137]},{"b":"auto mode は `Bash(pnpm dlx *)` などパッケージ実行系の allow ルールをさらに無視し、課金される分類器へのフォールバックも将来廃止予定なので、依存している運用を見直す。","r":[139,138]},{"b":"PowerShell ツールはルールで指定済みのコマンドでも追加で確認を求め、応答者がいなければ拒否されるため、無人実行では全ツール許可ルールか auto/bypass を使う。","r":[142]},{"b":"`ExitWorktree` は未保存の作業がありうる worktree の削除前に確認を求め、don't-ask モードや応答者なしでは拒否されるため、自動化では allow ルールを設定する。","r":[131]},{"b":"非常に長い値に展開される変数を含む Bash コマンドは拒否されるため、短い値かファイル経由にする。","r":[141]},{"b":"サブエージェントの再開時に、セッションの権限設定に従って確認や拒否が起きるため、無人環境では許可設定を用意する。","r":[143]},{"b":"`claude mcp add --scope project` は、`mcpServers` キーがなくサーバーを最上位に持つ `.mcp.json` では上書きせず停止するため、形式を `mcpServers` に直す。","r":[132]},{"b":"組織が新規 artifact ごとに承認を求める場合、plugin だけが作成・許可した artifact は拒否されることがあり、応答者のいないセッションでは即拒否される。","r":[147,148]},{"b":"ほとんどの権限プロンプトで矢印キーが No で止まり、`/sandbox` と大半の `/config` の値リストは番号表示がなくなるため、矢印キーと Enter で操作する。","r":[133,140]},{"b":"mod は `$.model.complete` / `$.model.classify` が使用上限に達した際に API エラーを即座に受け取るため、そのエラーを処理する。","r":[39]},{"b":"ネストした `claude` を独自トークンで使うコマンドは `CLAUDE_CODE_OAUTH_SCOPES` を継承しなくなったため、必要なコマンドで明示的に設定する。","r":[22]},{"b":"Chrome 連携が一部の認証情報ファイルのアップロードを拒否するため、そのようなファイルは自分でページに添付する。","r":[146]}],"hl":[{"t":"パス検査が厳しくなり確認が増える","b":"パスチェックが一部のシンボリックリンクを拒否し、作業ディレクトリ内とみなす範囲が変わったため、一部のパスで権限確認が出ます。`permissions.blockReadsOutsideWorkingDirectories` も、bypass・auto モードで確認または拒否する Bash コマンドが増えました。","r":[134,135,136,137]},{"t":"MCP 追加で .mcp.json を壊さない","b":"project スコープの `claude mcp add`/`remove` が、`.mcp.json` の `$schema` や他ツールの `servers` などトップレベルキーを消さなくなりました。サーバーが `mcpServers` キー無しで最上位に並ぶ `.mcp.json` では、`claude mcp add --scope project` は上書きせずに停止します。","r":[11,132]},{"t":"セッション再開時の履歴欠落を修正","b":"headless セッションの同じ UUID での再送や、空の応答・強制終了したコマンドの後の再開で、保存済みメッセージや回答が失われる不具合を修正しました。非常に長いセッションでは、途中で終わったトランスクリプト読み込みを 1 回再試行します。","r":[3,23,24,26,112]},{"t":"auto mode の許可判定が変わる","b":"auto mode は `Bash(pnpm dlx *)` のような任意パッケージを実行する allow ルールや `/usr/bin/npm run:*` 形式をより多く無視し、安全チェックで判定します。課金分類器リクエストへのフォールバックは今後の版で削除されると予告されました。","r":[18,138,139]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"権限・パス検査の変更が中心で、Bash や PowerShell の確認、worktree、artifact の扱いが変わる。Grep のページング、Read、NotebookEdit、Edit まわりの不具合や、Bash の初回実行速度の改善もある。","refs":[13,17,18,19,40,42,46,47,48,49,50,51,108,109,110,111,121,122,124,125,126,131,134,135,136,137,138,139,141,142,144,145,147,148,149,150]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"サブエージェントの再開時のモデルと権限、背景エージェントの完了通知、`--agents` と plugin の扱いを修正した。アカウント変更後の背景セッションや一時停止中のワークフローの扱いも変わった。","refs":[20,21,31,32,56,57,58,59,60,61,72,73,77,113,115,143,155,156,157]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"`/plugin` の誤操作やクラッシュ、hook の失敗表示、`/hooks` の表示漏れを修正した。`/install-github-app` に確認を追加し、Code Mode は mod が tool call を hook していても起動できるようになった。","refs":[1,15,39,43,64,65,66,68,87,88,101,103,117,129,151,154]},{"a":"S","name":"セッション・履歴・圧縮","dg":"再開時にメッセージが失われる問題、compaction で tool call が消える問題、`/rewind` の無言終了を修正した。`/resume` の表示と、再開できないメッセージの通知も改善した。","refs":[3,12,23,24,25,26,27,29,94,96,112,158]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP の `.mcp.json` 破損、リモートサーバー再接続、`/mcp` の表示を修正し、`add-json` の stdin 入力を追加した。MCP サーバー画面は共通レイアウトになり、ログには elicitation の内容を残さなくなった。","refs":[2,11,45,74,86,95,99,127,132,146,152]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"Remote Control、cloud セッション、artifact、`/teleport` の不具合を修正した。VS Code 拡張には Explorer からの Add to Chat、Escape の誤停止修正、速度改善が入った。","refs":[9,14,38,52,53,55,62,63,80,89,130,161,163,164,165,166,167,168,169,170,171,172,173]},{"a":"H","name":"headless・SDK・API","dg":"ゲートウェイのヘッダーと `attributionProject` を追加し、self-hosted runner の不具合を修正した。`-p` モードのハングと起動時の git コマンド数も改善した。","refs":[6,7,10,22,35,54,75,116,159,160]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"未認識モデルで 32,000 トークンで切れた応答は上限 128,000 で継続する。LLM ゲートウェイ設定時の `/model` の一覧誤りも修正した。","refs":[69,114]},{"a":"U","name":"UI・表示・入力","dg":"`/status` と `/config` の情報追加、`/tui classic` の追加、ターミナル表示、キー操作、狭い画面の崩れを多数修正した。権限プロンプトと一覧のキー操作も変わった。","refs":[4,5,8,16,28,30,36,37,41,67,70,76,78,79,81,82,83,84,85,90,91,92,93,97,98,100,102,104,105,106,107,123,128,133,140,153,162]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"Windows の起動と PowerShell の速度を改善した。プロキシ設定の起動失敗、Linux 再起動時のシェル復帰、`claudeMdExcludes` のドライブ文字の大文字小文字も修正した。","refs":[33,34,44,71,118,119,120]}],"skip":"表示の乱れ、キー入力の取りこぼし、まれな環境でのクラッシュや停止などの小さな修正が約 70 件ある。","st":"ok","stale":false,"e":[[1,"`/install-github-app` がリポジトリを変更する前に確認を出す","Added a confirmation before `/install-github-app` changes a repository","M","new",1,"cli",0,[],"slash-commands"],[2,"`claude mcp add-json \u003cname\u003e -` で標準入力から JSON を読め、トークンをコマンドラインに出さずに済む","Added `claude mcp add-json \u003cname\u003e -` to read the server's JSON from stdin, so tokens can stay off the command line; not available inside a Claude Code session","C","new",2,"cli",0,[],"mcp"],[3,"再開したセッションの過去メッセージを読み込めないとき、その旨を 1 行表示する","Added a line when a resumed session's earlier messages can't be loaded","S","improve",1,"cli",0,[],"sessions-resume"],[4,"`/status` が壊れた agent・skill・command・output style ファイルや keybinding エラーなどを一覧表示する","Added a list in `/status` of broken agent, skill, command and output style files, keybinding errors, an unavailable sandbox, ignored permission settings and hook matchers that never match","U","new",2,"cli",0,[],"slash-commands"],[5,"`/config` で、他の設定に上書きされている行に注記を表示する","Added a note in `/config` when other settings override a row","U","new",1,"cli",0,[],"settings"],[6,"gateway ヒントヘッダーに `x-claude-code-managed-settings-checksum` を追加","Added `x-claude-code-managed-settings-checksum` to the gateway hint headers; sent where managed settings set `CLAUDE_CODE_GATEWAY_HINT_HEADERS=1`, including where they already do","H","new",1,"sdk,admin",0,[],"gateway-hint-headers"],[7,"`attributionProject` 設定でセッションの課金グループ名を指定できる（`admin.billing_group_tag` を設定した gateway 向け）","Added support for naming a session's billing group with the `attributionProject` setting, for Claude apps gateways that set `admin.billing_group_tag`","H","new",1,"admin,sdk",0,[],"billing-group"],[8,"非フルスクリーン描画の名称が `/tui classic` になった（`/tui default` も引き続き使える）","Added `/tui classic` as the name for the non-fullscreen renderer; `/tui default` still works","U","change",1,"cli",0,[],"output-rendering"],[9,"Remote Control の worktree モードでサーバーを止めても、実行中セッションの `.env` など git 無視ファイルを消さない","Remote Control: Fixed stopping the server in worktree mode deleting a running session's git-ignored files, such as `.env`","I","fix",2,"cloud",0,[],"remote-control"],[10,"`--use-anthropic-git-proxy` の self-hosted runner が `GIT_CONFIG_GLOBAL` 指定の空でないディレクトリを削除せず、変数を無視して警告する","Fixed self-hosted runners with `--use-anthropic-git-proxy` deleting a non-empty directory named by `GIT_CONFIG_GLOBAL` at startup: the runner now keeps it, ignores the variable and warns","H","fix",2,"cloud",0,[],"self-hosted-runner"],[11,"project スコープの `claude mcp add`/`remove` が `.mcp.json` の `$schema` など他のトップレベルキーを消さない","Fixed `claude mcp add` and `claude mcp remove` with project scope deleting other top-level keys from `.mcp.json`, such as `$schema` or another tool's `servers`","C","fix",2,"cli",0,[],"mcp"],[12,"`/export` が既存ファイルを上書きする前に確認し、`/export \u003cname\u003e` は上書きせず `/export` の実行を案内する","Fixed `/export` overwriting an existing file without asking  to read an uploaded file by the address the artifact's page shows; other forms still fail, most with a message that says to read uploads one per call, by id","T","improve",1,"cli",0,[],"artifacts"],[126,"Artifact ツールが、使わない呼び出しの `prompt`、`limit`、`label` を無視し、失敗させない","Improved the Artifact tool to ignore `prompt`, `limit` and `label` on some calls that do not use them instead of failing the call","T","improve",1,"cli",0,[],"artifacts"],[127,"`/mcp` のサーバーページがローカル・リモート・エージェントで共通レイアウトになり、メニューは Back で終わり、スクリーンリーダー以外は番号なしで矢印キーと Enter で操作","Improved MCP server pages in `/mcp`: local, remote and agent servers share one layout, menus end in Back, and actions are no longer numbered outside screen reader mode; use the arrow keys and Enter","C","change",1,"cli",1,[],"mcp"],[128,"狭い端末で `/status`、フォーム、詳細画面の配置が良くなり、`/model` と `/effort` が約40桁に収まり、`←/→ to adjust` などのキー案内も残る","Improved narrow terminals: `/status`, forms and detail screens lay out better, `/model` and `/effort` fit at about 40 columns, and key hints such as `←/→ to adjust` stay","U","improve",1,"cli",0,[],"output-rendering"],[129,"`/install-github-app` のリポジトリ・シークレット・API キーの各手順が標準の一覧とキーになり、短い文言、スピナー、明確なエラーに","Improved `/install-github-app`: the repository, secret and API key steps use the standard list and keys, with shorter messages, a spinner and clearer errors","M","improve",1,"cli",0,[],"slash-commands"],[130,"`/desktop` のダウンロード確認が y/n ではなく標準の一覧になる","Improved `/desktop`: the download question is a standard list instead of y/n","I","improve",1,"ide",0,[],"desktop"],[131,"`ExitWorktree` が未保存の作業を含みうる worktree の削除前に確認し、don't-ask モードや回答者不在では、allow ルール・auto・bypass でない限り拒否","Changed `ExitWorktree` to ask before removing a worktree that may hold unsaved work; refused in don't-ask mode or with nobody to answer, unless an allow rule, auto or bypass permissions mode allows it","T","change",2,"cli,sdk",1,[],"permissions"],[132,"`.mcp.json` が `mcpServers` キー無しで最上位にサーバーを並べている場合、`claude mcp add --scope project` は上書きせず停止","Changed `claude mcp add --scope project` to stop, instead of overwriting the file, when `.mcp.json` lists its servers at the top level with no `mcpServers` key","C","change",2,"cli,mod-dev",1,[],"mcp"],[133,"ほとんどの権限プロンプトで矢印キーが No で止まり循環せず、最後の選択肢を超える番号は No に移る","Changed the arrow keys on most permission prompts to stop at No instead of wrapping around; a number past the last answer moves to No","U","change",2,"cli",1,[],"keybindings"],[134,"パスチェックが一部のシンボリックリンクを拒否する","Changed path checks to refuse some symbolic links","T","change",3,"cli,sdk",1,[],"permissions"],[135,"作業ディレクトリ内とみなす範囲が変わり、一部のパスで権限確認が出る","Changed what counts as inside a working directory, so some paths now ask for permission","T","change",3,"cli,sdk",1,[],"permissions"],[136,"`permissions.blockReadsOutsideWorkingDirectories` が bypass・auto モードでより多くの Bash コマンドを確認対象にし、auto モードでは一部を拒否","Changed `permissions.blockReadsOutsideWorkingDirectories` to ask about more Bash commands in bypass and auto modes, and to deny some in auto mode","T","change",2,"cli,admin",1,[],"permissions"],[137,"`permissions.blockReadsOutsideWorkingDirectories` が、Read・Edit の deny ルール下のパスを指す Bash コマンドを、確認ではなく拒否にする","Changed `permissions.blockReadsOutsideWorkingDirectories` to refuse more Bash commands that name a path under a Read or Edit deny rule, where it used to ask","T","change",2,"cli,admin",1,[],"permissions"],[138,"auto モードの課金分類器リクエストへのフォールバック通知が、今後の削除予告に変わり、対象の操作は確認か拒否になる","Changed auto mode's notice about falling back to billed classifier requests to say that an upcoming release removes the fallback; each action it would have checked will be asked about or denied","T","change",2,"cli,admin",1,[],"auto-mode"],[139,"auto モードが `Bash(pnpm dlx *)` など任意パッケージ実行の allow ルールや `/usr/bin/npm run:*` 形式をより多く無視し、安全チェックが判定","Changed auto mode to ignore more allow rules that run any package, like `Bash(pnpm dlx *)`, and path or version forms of ones it already ignored (`/usr/bin/npm run:*`); the safety check decides those","T","change",2,"cli",1,[],"auto-mode"],[140,"`/sandbox` と多くの `/config` の値一覧が、スクリーンリーダー以外では番号なしで矢印キーと Enter で操作","Changed `/sandbox` and most `/config` value lists to be unnumbered outside screen reader mode; use the arrow keys and Enter","U","change",1,"cli",1,[],"settings"],[141,"変数が非常に長いテキストに展開される Bash コマンドを拒否し、短い値かファイルを使うよう案内","Changed Bash commands whose variables expand to very long text to be denied, with a message that says to use shorter values or a file","T","change",2,"cli,sdk",1,[],"bash-tool"],[142,"PowerShell ツールがさらに1種のコマンドで確認し、ルールがあっても確認する。回答者不在なら、ツール全体のルール・auto・bypass でない限り拒否","Changed the PowerShell tool to ask before one more command, even under a rule naming it; if nothing answers, it's refused unless a whole-tool rule, auto mode or bypass permissions mode allows it","T","change",2,"cli,windows",1,[],"permissions"],[143,"兄弟のメッセージで再開されたサブエージェントがセッションの権限設定に従い、確認が出る場合や回答者不在で拒否される場合がある","Changed a subagent resumed by a sibling's message to follow the session's permission settings; it may now ask, or be refused where nobody can answer","A","change",2,"cli,sdk",1,[],"subagents"],[144,"`--worktree` と起動フォルダ横の相対 `--add-dir` の併用で、Bash サンドボックスに worktree 横ではなくそのフォルダを与える","Changed `--worktree` with a relative `--add-dir` beside the launch folder to give the Bash sandbox that folder, not one beside the worktree","T","change",1,"cli",1,[],"sandbox"],[145,"`--worktree` と起動フォルダより上の相対 `--add-dir`（`..` など）の併用で、Bash サンドボックスと `--bg` セッションには worktree のみを与える","Changed some `--worktree` starts with a relative `--add-dir` above the launch folder, such as `..`, to give the Bash sandbox, and a `--bg` session, only the worktree","T","change",1,"cli",1,[],"sandbox"],[146,"Claude in Chrome が一部の認証情報ファイルのアップロードを拒否するため、それらは自分でページに添付する","Changed Claude in Chrome to refuse uploading some credential files; attach those to the page yourself","C","change",2,"cli",1,[],"chrome-extension"],[147,"新規アーティファクトごとの承認を求める組織で、プラグインだけが作成・許可したアーティファクトが拒否されうる","Changed artifact approval in organizations that require it for each new artifact: an artifact that only a plugin created or allowed can be refused","T","change",1,"admin,cli",1,[],"artifacts"],[148,"新規アーティファクトごとの承認を求める組織で、回答者のいないセッションは権限プロンプトなしで即座に拒否","Changed sessions with nobody to ask to refuse a new artifact at once, with no permission prompt, in organizations that require approval of each one","T","change",1,"admin,sdk",1,[],"artifacts"],[149,"設定で Artifacts をオフにすると、実行中のセッションでも Artifact ツールが呼び出しを拒否","Changed the Artifact tool to refuse calls once settings turn Artifacts off, in sessions already running too","T","change",1,"admin,cli",1,[],"artifacts"],[150,"Artifact の公開プロンプトが、サブエージェント内や、バックグラウンドタスク結果・他者のメッセージ・圧縮の後で「don't ask again」を出さない","Changed the Artifact publish prompt to stop offering \"don't ask again\" in subagents and after a background task result, someone else's message or a compaction","T","change",1,"cli",1,[],"artifacts"],[151,"`claude plugin eval` がプラグインの権限フックより deny ルールを優先し、フックが通した呼び出しを指摘する","Changed `claude plugin eval` to keep its deny rules over a plugin's permission hook, and to flag calls the hook let through","M","change",1,"mod-dev",1,[],"plugins-mods"],[152,"MCP サーバーのログが、elicitation リクエストとフック応答の全内容ではなくモード・操作・フィールド名を記録","Changed MCP server logs to record the mode, action, and field names of elicitation requests and hook answers, not their full contents","C","change",1,"cli,mod-dev",1,[],"mcp"],[153,"`fg` で再開した直後、ほとんどのプロンプトが少しの間 Esc 以外の回答を無視する","Changed most prompts to ignore answers other than Esc for a moment after resuming with `fg`","U","change",1,"cli",1,[],"background-tasks"],[154,"ツール呼び出しをフックする mod があっても Code Mode が起動を拒否せず、管理者は managed settings でオフにできる","Changed Code Mode to no longer refuse to start when an installed mod hooks tool calls; an administrator can still keep Code Mode off in managed settings","M","change",1,"mod-dev,admin",1,[],"code-mode"],[155,"モデル指定なしで起動したサブエージェントは、`/model` 後の再開でも起動時のモデルのままになる","Changed subagents launched without a model to stay on the model they started on when resumed, including after `/model`","A","change",2,"cli,sdk",1,[],"subagents"],[156,"あるモデルの最初のサブエージェントは、そのモデルの設定を Anthropic から最大1.5秒（`claude -p` は10秒）待ってから開始","Changed the first subagent on a model to wait up to 1.5 seconds (10 in `claude -p`) for that model's settings from Anthropic, instead of starting without them","A","change",1,"cli,sdk",1,[],"subagents"],[157,"再起動したバックグラウンドサブエージェントと自動で始まるターンが、プラグインの読み込みを待つ","Changed restarted background subagents, and turns that start by themselves, to wait for plugins to load","A","change",1,"cli,sdk",1,[],"background-tasks"],[158,"別の Claude Code セッションが起動した（Claude 実行の `claude --bg` など）セッションの起動プロンプトを、多くは履歴に残さない","Changed prompt history to leave out most launch prompts of sessions that another Claude Code session started, such as `claude --bg` run by Claude","S","change",1,"cli",1,[],"prompt-history"],[159,"Bedrock・Vertex AI・Foundry の端末セッションで、サブエージェント進捗要約が会話全体でなく短いメモから作られ、トークン消費が大幅減","Changed subagent progress summaries in terminal sessions on Amazon Bedrock, Google Vertex AI and Microsoft Foundry to be written from short notes, not the whole conversation, using far fewer tokens","H","improve",2,"cli,admin",0,[],"bedrock-vertex"],[160,"非対話（`-p`）モードが最初のリクエスト前に実行する git コマンドを減らす","Changed non-interactive (`-p`) mode to run fewer git commands before the first request","H","improve",1,"sdk",0,[],"headless-ci"],[161,"リモートの VS Code・Cursor・Devin Desktop で、設定を変更できないため初回セットアップの端末設定を省略","Changed first-run setup to skip terminal setup in remote VS Code, Cursor and Devin Desktop sessions, where it cannot change settings","I","change",1,"ide",1,[],"vscode"],[162,"フルスクリーンのテキスト選択が、system・thinking・受信メッセージ行のグリフを含めない","Changed fullscreen text selection to leave out the glyph of system, thinking and inbound message lines","U","change",1,"cli",1,[],"output-rendering"],[163,"Anthropic ホストのクラウドセッションがリポジトリのフラグとプラグイン配信設定をより多く無視し、`CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC` は最大でも `DISABLE_TELEMETRY` 相当","Changed Anthropic-hosted cloud sessions to ignore more of a repository's flag and plugin delivery settings; its `CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC` now acts at most as `DISABLE_TELEMETRY`","I","change",2,"cloud,admin",1,[],"web-cloud-sessions"],[164,"[VSCode] エクスプローラーの右クリックに「Claude Code: Add to Chat」を追加し、選択したファイルやフォルダをチャットに @ メンションする","[VSCode] Added \"Claude Code: Add to Chat\" to the Explorer's right-click menu, which @-mentions the selected files and folders in the chat","I","new",2,"ide",0,[],"vscode"],[165,"[VSCode] PreToolUse フックが確認を求める際の理由を、権限プロンプトに表示する","[VSCode] Fixed the permission prompt not showing the reason that a PreToolUse hook gives when it asks for confirmation (anthropics/claude-code#85950)","I","fix",1,"ide,mod-dev",0,["https://github.com/anthropics/claude-code/issues/85950"],"vscode"],[166,"[VSCode] 権限プロンプトのタイトルで、長いツール名やファイル名が切れない","[VSCode] Fixed long tool and file names being cut off in a permission prompt's title","I","fix",1,"ide",0,[],"vscode"],[167,"[VSCode] ターミナルセッションの diff で、入力後に Claude が同じファイルを再編集しても前の提案編集を表示しない","[VSCode] Fixed a terminal session's diff showing the previous proposed edit after you typed in it and Claude edited the same file again","I","fix",1,"ide",0,[],"vscode"],[168,"[VSCode] フィードバックやメニューなどのポップアップを Esc で閉じても、Claude の応答を止めない","[VSCode] Fixed Escape also stopping Claude's response when it closes the feedback or \"Build a custom style\" dialog, the @-mention menu, the model, mode or \"+\" menu, or another popup","I","fix",2,"ide",0,[],"vscode"],[169,"[VSCode] 連続編集が速くなり、キュー内の編集が新しい問題の待機を共有する。問題の報告が後の編集に回ることがある","[VSCode] Improved speed when Claude makes several edits in a row: queued edits share one wait for new problems; a problem may be reported with a later edit","I","improve",1,"ide",0,[],"vscode"],[170,"[VSCode] `rg` が `PATH` にあると大規模ワークスペースの @ メンションのファイル検索が速くなり、順位付けは端末に近く、誤字への許容は小さくなる","[VSCode] Improved @-mention file search speed in large workspaces when `rg` is on your `PATH`; results now rank much as in the terminal, with less tolerance for typos","I","improve",1,"ide",0,[],"vscode"],[171,"[VSCode] 初めて開くフォルダ・空のウィンドウ・worktree で、サードパーティプロバイダー以外はモデルピッカーがすぐ使える","[VSCode] Improved startup: the model picker is ready at once in folders opened for the first time, empty windows and worktrees, except on third-party providers","I","improve",1,"ide",0,[],"vscode"],[172,"[VSCode] 同じウィンドウのターミナルセッションがプロンプトを送っても、チャット編集の diff は開いたまま承認を求め続ける","[VSCode] Changed a chat edit's diff to stay open and keep asking for approval when a terminal session in the same window sends a prompt","I","change",1,"ide",1,[],"vscode"],[173,"[VSCode] IDE 接続から未使用ツール（openFile、saveDocument、getOpenEditors など）を削除","[VSCode] Removed unused tools from the IDE connection (openFile, saveDocument, getOpenEditors and related)","I","change",1,"ide,mod-dev",1,[],"vscode"]]},{"v":"2.1.326","date":"2026-11-17（火）03:43","dshort":"11-17 03:43","nb":38,"head":"サンドボックスと権限チェックの厳格化、auto mode 既定化が中心","sum":"v2.1.326 は Bash・PowerShell・ファイルツールの権限チェックとサンドボックスを広く厳しくする変更が中心で、従来通っていたコマンドが確認や拒否の対象になる場合があります。HIPAA 構成の組織や方針未取得時は auto mode が既定で始まります。あわせて、認証、MCP、Remote Control、全画面表示の不具合修正が多数含まれます。","watch":[{"b":"HIPAA 構成の組織で auto mode が既定になるため、望まない場合は `disableAutoMode` を設定する。","r":[290]},{"b":"方針が未取得でモード未設定のセッションは Manual ではなく auto mode で始まるため、モードを明示して運用する。","r":[291]},{"b":"bypass permissions mode でも一部のツール呼び出しが確認や拒否の対象になるため、無人実行では事前に許可ルールを見直す。","r":[311,317]},{"b":"サンドボックスコマンドが一部のホームフォルダーに書けなくなったため、必要なら user または managed settings の `sandbox.filesystem.allowWrite` で許可する。","r":[300]},{"b":"`--add-dir` と `/add-dir` が未信頼フォルダーで信頼確認を出し、`claude --bg` は拒否するため、事前に信頼しておく。","r":[323]},{"b":"managed の `autoMode.environment` が `\"$defaults\"` なしだと Claude Desktop と Agent SDK でも組み込み項目を全て置き換えるため、`\"$defaults\"` を追加するか機密対象の項目をコピーする。","r":[322]},{"b":"auto mode が一部の shell 許可ルールを無視し、Windows のバックスラッシュパスのワイルドカードルールも判定対象にするため、許可ルールの動作を再確認する。","r":[320,321]},{"b":"enabled な plugin が不正な `plugin.json` の表示フィールドでも読み込まれ、hooks と MCP サーバーも有効になるため、管理者は配布 plugin を確認する。","r":[326]},{"b":"hook の `\"decision\": \"block\"` が有効になる範囲が広がり、常に出力する hook は呼び出しを止める可能性があるため、hook の出力を確認する。","r":[296]},{"b":"自ホスト runner で `gh` がない Linux・macOS セッションに組み込みの `gh api` が既定で付くため、不要なら `--use-anthropic-gh false` を指定する。","r":[339]},{"b":"Remote Control が CONNECT トンネルで接続するようになり、CONNECT を拒否する proxy では停止するため、proxy 設定を確認する。","r":[337]},{"b":"`--trust-workspace false` の自ホスト runner がより多くのリポジトリ設定を無視するため、該当の値は user または managed settings に置く。","r":[324]},{"b":"プラン mode の自動 compaction が応答中のモデルを使うため、`opusplan` などではコストが増える場合がある。","r":[332]}],"hl":[{"t":"auto mode が既定の開始モードに","b":"Claude Code + Cowork HIPAA 構成の組織と、組織ポリシーを読み込めていないモード未設定のセッションは、端末と VS Code で auto mode から始まるようになりました。HIPAA 構成では `disableAutoMode` でこれを無効にできます。","r":[290,291,297,298,25,26]},{"t":"サンドボックスの書き込み先縮小","b":"macOS・Linux・WSL のサンドボックスコマンドは、機微なホームフォルダに既定で書き込まなくなりました。一部は `sandbox.filesystem.allowWrite` で許可できます。","r":[300,234,235,301,302,299]},{"t":"無人実行で拒否される権限確認","b":"Bash や PowerShell の一部のコマンドが、先に確認を求めるようになりました。bypass permissions モードでも一部のツール呼び出しで確認が入ります。回答できる人がいない環境では、それらは拒否されます。","r":[231,311,312,316,306,253]},{"t":"auto mode の許可ルール判定変更","b":"auto mode は、プログラム名がないものや `$HOME` で始まるものなど一部のワイルドカード許可ルールを無視し、安全性チェックで判断するようになりました。以前は実行されていた一部のシェルコマンドも止まります。","r":[320,321,294,322]},{"t":"サインインファイルへの書き込み保護","b":"Claude のファイルツールは、`.credentials.json` など Claude Code のサインインファイルへの書き込みを拒否するようになりました。Bash の権限チェックも、これらのファイルに届くコマンドをより多く事前に確認します。","r":[307,308]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"Bash、PowerShell、ファイルツール、Code Mode の権限チェックとサンドボックスが厳しくなり、確認や拒否が増えます。設定ファイルの不正値や deny ルールの扱いも修正されました。","refs":[2,11,12,13,16,18,19,20,22,23,28,52,56,122,142,175,227,231,232,233,234,235,236,251,252,290,291,293,294,295,297,298,299,300,301,302,303,304,306,307,308,309,310,311,312,316,317,318,319,320,321,322,323]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"サブエージェントとバックグラウンドエージェントの状態表示、worktree での git 操作制限、`ExitWorktree` の拒否条件が変わりました。バックグラウンドセッションの LLM gateway 関連の不具合も修正されています。","refs":[1,8,14,15,33,61,75,104,107,108,109,110,111,112,115,117,121,243,258,281,282,283,313,314,340,343]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"plugin の読み込み条件、hook の `decision` と `updatedInput`、`/plugin` の画面操作が更新されました。Code Mode での mod の tool 呼び出しも修正されています。","refs":[5,10,53,54,74,76,124,126,127,129,130,248,249,250,262,270,271,272,273,296,326,327,328,329,330,331,344]},{"a":"S","name":"セッション・履歴・圧縮","dg":"`/rewind`、セッション再開、compaction の不具合が修正されました。sandbox 有効時の `/rewind` は一部ファイルをスキップします。","refs":[30,31,36,37,38,49,55,163,207,245,305,332]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP の並列呼び出し結果の取り違えやツール検索の誤読み込みなど、MCP 関連の不具合が多数修正されました。`managed-mcp.json` を途中で追加した場合の挙動も変わりました。","refs":[3,17,77,78,79,80,81,82,83,84,85,86,87,88,89,90,154,254,255,259,292]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"Remote Control、クラウドセッション、Claude Desktop、VS Code 拡張の接続・表示・サインインの不具合が修正されました。VS Code では `claudeCode.promptSuggestions` が追加されています。","refs":[21,32,62,91,92,93,94,95,96,97,98,99,101,102,103,105,153,174,208,237,239,246,247,325,333,334,337,338,351,352,353,354,355,356,357,358,359,360,361,362,363,364,365,366,367]},{"a":"H","name":"headless・SDK・API","dg":"自ホスト runner、`--bare`、`claude -p`、OpenTelemetry に関する変更があります。`OTEL_RESOURCE_INCLUDE_HOST` が追加されました。","refs":[9,50,100,149,253,324,335,339,341]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"`max_tokens` 超過時の再試行、`/model` の Default 表示、PDF 読み取り失敗時の扱いが修正されました。","refs":[47,51,128,221,256,336]},{"a":"U","name":"UI・表示・入力","dg":"全画面表示、入力、サインイン画面、`/privacy-settings` などの表示と操作の不具合修正が大半です。キーヒントや文言の統一も行われました。","refs":[4,6,7,24,25,26,27,29,34,35,39,40,41,42,43,44,45,46,48,66,67,68,69,70,71,72,73,106,113,114,116,118,119,120,125,131,132,133,134,135,136,137,138,139,140,141,143,144,145,146,147,148,150,151,152,155,156,157,158,159,160,161,162,164,165,166,167,168,169,170,171,172,173,177,178,179,180,181,182,183,184,185,186,187,188,189,190,191,192,193,194,195,196,197,198,199,200,201,202,203,204,205,206,209,210,211,212,213,214,215,216,217,218,219,220,222,223,224,225,226,228,229,230,238,240,241,257,260,261,264,265,266,267,268,269,274,275,276,277,278,279,280,284,285,286,287,288,289,315,345,346,347,348,349,350]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"ログインと認証まわりの修正のほか、CPU 使用量の改善や proxy 待機のタイムアウトが含まれます。worktree 作成や `/teleport` で使う git の `PATH` が厳しくなりました。","refs":[57,58,59,60,63,64,65,123,176,242,244,263,342]}],"skip":"表示の乱れ、キー操作の取りこぼし、文言・レイアウトの不具合などの小さな修正と改善が 200 件以上あります。","st":"ok","stale":false,"e":[[1,"agent teams 有効時にも Code Mode をオンにでき、オン済みならチーム有効のセッションが Code Mode で始まる","Added support for turning on Code Mode while agent teams are enabled; if you already turned it on, sessions with teams on now start in Code Mode","A","new",2,"cli",0,[],"agent-teams"],[2,"`--allowedTools`・`--disallowedTools`・`--tools` に完全なルールに見えない値があると起動時に警告","Added a startup warning when an `--allowedTools`, `--disallowedTools` or `--tools` value has an entry that doesn't look like a complete rule","T","new",1,"cli,sdk",0,[],"permissions"],[3,"管理者がセッション中に `managed-mcp.json` を追加して MCP サーバーが止まる理由を表示","Added a message explaining why MCP servers stop loading when an administrator adds `managed-mcp.json` during a session","C","new",1,"cli,admin",0,[],"mcp"],[4,"`/status` に、プロバイダーや `DISABLE_TELEMETRY` などの環境変数で機能が無効になっている旨の行を追加","Added a row to `/status` that says when your provider or an environment variable such as `DISABLE_TELEMETRY` turns features off","U","new",1,"cli",0,[],"slash-commands"],[5,"`author` や `homepage` など不正な `plugin.json` フィールドが無視されたとき `/plugin` と `claude plugin list` に注記","Added a note in `/plugin` and `claude plugin list` when a malformed `plugin.json` field such as `author` or `homepage` is ignored","M","new",1,"cli,mod-dev",0,[],"plugins-mods"],[6,"Ctrl+O で非表示の起動時通知を表示","Added Ctrl+O to show hidden startup notices","U","new",1,"cli",0,[],"keybindings"],[7,"空のプロンプトに、リクエスト失敗後の対処を示すヒントを表示","Added a hint in the empty prompt that says what to do after a request fails","U","new",1,"cli",0,[],"prompt-input"],[8,"サブエージェント表示で Esc が停止になる場面に `esc to stop` のフッターヒントを表示","Added an `esc to stop` footer hint in a subagent's view where Esc would stop it","A","new",1,"cli",0,[],"subagents"],[9,"`OTEL_RESOURCE_INCLUDE_HOST` で OpenTelemetry リソース属性に `host.name` と `host.id` を追加可能（既定はオフ）","Added `OTEL_RESOURCE_INCLUDE_HOST` to include `host.name` and `host.id` in OpenTelemetry resource attributes (off by default)","H","new",1,"sdk,admin",0,[],"telemetry"],[10,"mod の `Box` に `overflowX=\"scroll\"`、`Text` に `maxLines` と `wrap=\"clip\"` を追加","Added `overflowX=\"scroll\"` on a mod's `Box`, and `maxLines` and `wrap=\"clip\"` on its `Text`","M","new",1,"mod-dev",0,[],"plugins-mods"],[11,"コピー元だけが `Edit` の deny ルールに該当する場合に `cp` が拒否される問題を解消","Fixed `cp` of a file being refused when only its source was covered by an `Edit` deny rule","T","fix",2,"cli",0,[],"permissions"],[12,"`find -delete`、`cat a \u003e b`、`sort -o` など削除・上書きのコマンドがトランスクリプトで検索や読み取りと表示されない","Fixed Bash commands that delete or overwrite files (`find -delete`, `cat a \u003e b`, `sort -o`) being summed up in the transcript as a search or a read","T","fix",1,"cli",0,[],"bash-tool"],[13,"rm を含まない一部コマンドで権限確認に誤った「Dangerous rm operation」警告が出ない","Fixed a misleading \"Dangerous rm operation\" warning in the Bash permission prompt on some commands with no rm that Claude Code can't read reliably","T","fix",1,"cli",0,[],"bash-tool"],[14,"バックグラウンドセッションが、クラッシュ後などでシェルの LLM ゲートウェイを失った場合、モデルリクエスト前に停止する","Fixed background sessions losing the LLM gateway your shell exported after a crash, after a reopen from another folder, or when the background service lacks it: they now stop before any model request","A","fix",2,"cli",0,[],"background-tasks"],[15,"バックグラウンドサービスが、再利用されたプロセス番号により SSH ログインなど他ユーザーのプロセスを終了させない","Fixed the background service ending your own processes, such as an SSH login, when a process number on its list had been reused by another user's process","A","fix",2,"cli",0,[],"background-tasks"],[16,"設定ファイルに書き込めなかったとき、`/permissions` のルールや `/add-dir` が保存済みに見えず、端末が警告してファイル名を示す","Fixed rules added in `/permissions` or at a main-conversation tool prompt, and `/add-dir` folders, looking saved when the settings file couldn't be written; the terminal now warns and names it","T","fix",2,"cli",0,[],"permissions"],[17,"`headersHelper` の失敗や未信頼フォルダーでの未実行で、他のセッションがそのサーバーなしで起動する問題を解消","Fixed a failed MCP `headersHelper`, or one not run in an untrusted folder, making other sessions start without that server, for most servers with no stored OAuth refresh token","C","fix",2,"cli",0,[],"mcp"],[18,"特定のキー名を含む managed settings で Claude Code が起動できなくなる、他の managed ファイルに影響する問題を解消","Fixed managed settings with certain key names stopping Claude Code from starting or affecting other managed files","T","fix",2,"admin",0,[],"managed-settings"],[19,"数千階層にネストした設定値でのクラッシュを解消し、64 階層を超える値は警告付きで破棄","Fixed settings files with values nested thousands of levels deep crashing Claude Code or applying only some of the time; values past 64 levels are now dropped with a warning","T","fix",1,"cli",0,[],"settings"],[20,"セッション中にエラー状態で保存された設定ファイルが黙って無視されず、ファイル名付きの警告が出る","Fixed a settings file saved with an error mid-session being skipped silently; a warning now names the file","T","fix",1,"cli",0,[],"settings"],[21,"managed settings のサブエージェントモデルが Desktop の Code タブでも適用され、ターミナル同様に個人設定より優先される","Fixed the subagent model set in managed settings not applying in Claude Desktop's Code tab; it now overrides your own, as in a terminal, unless those settings also pick a provider or gateway","I","fix",2,"ide,admin",0,[],"desktop"],[22,"Linux で home や config が `/net` へのシンボリックリンク経由かつ読み取り拒否時、sandbox コマンドが起動する","Fixed sandboxed commands failing to start on Linux when the home or config directory is reached through a symlink into `/net` and sandbox settings deny reads of it","T","fix",1,"cli,admin",0,[],"sandbox"],[23,"Linux で sandbox コマンド中に停止しても `.git/config.lock` などの空ファイルがプロジェクトに残らない","Fixed empty placeholder files, including `.git/config.lock`, sometimes being left in the project on Linux when Claude Code was stopped during a sandboxed command","T","fix",1,"cli",0,[],"sandbox"],[24,"信頼済み親フォルダー配下のフォルダー信頼確認で、 ンドセッションが強制終了されリクエストが失われない","Fixed a background session being killed and its request lost when you opened, stopped or removed the older session whose conversation it had resumed","A","fix",2,"cli",0,[],"background-tasks"],[34,"stdout がリダイレクトされていても `claude purge` のプロンプトが端末に表示され、見えない Enter でのデータ削除を防ぐ","Fixed `claude purge` hiding its prompts when stdout is redirected, where one unseen Enter could delete a project's data; they now show on the terminal","U","fix",2,"cli",0,[],"slash-commands"],[35,"開いた直後の Backspace と Enter で、利用上限メニューが月間上限を確認なしで削除しない","Fixed the spend limit menu removing the monthly limit without asking when Backspace and Enter were pressed as it opened","U","fix",2,"cli",0,[],"settings"],[36,"低速なバックアップコピー中に `/branch` を 2 回実行しても、`/rewind` がすべてのファイルを復元する","Fixed `/rewind` restoring only some files after running `/branch` twice while a slow backup copy was still running","S","fix",1,"cli",0,[],"sessions-resume"],[37,"復元できないシェルコマンドの変更があるとき `/rewind` が「No code changes」と言わず、追跡外のターンは「Code changes unknown」と表示","Fixed `/rewind` saying \"No code changes\" when a shell command changed files it can't restore; a turn whose changes weren't tracked now reads \"Code changes unknown\"","S","fix",1,"cli",0,[],"sessions-resume"],[38,"`/rewind` で Esc が要約をキャンセルし、フルスクリーンで複数の過去プロンプトを表示、長いプロンプトでも警告が隠れない","Fixed `/rewind`: Esc now cancels its summary, its list shows more than one past prompt in fullscreen, and a long prompt no longer hides its warning about losing later file changes","S","fix",1,"cli",0,[],"sessions-resume"],[39,"`/skills` で Ctrl+C か Ctrl+D を 2 回押すと、終了せず保存してパネルを閉じる","Fixed Ctrl+C or Ctrl+D twice in `/skills` quitting Claude Code and dropping changes; it now saves and closes the panel","U","fix",1,"cli",0,[],"skills"],[40,"入力中に利用上限メニューが開いて下書きが消える問題を解消","Fixed the usage limit menu erasing your draft and opening while you were typing","U","fix",1,"cli",0,[],"prompt-input"],[41,"Esc Esc で消した下書きを ↑ で呼び出しても、貼り付けたテキストと画像が失われない","Fixed pasted text and images being dropp write to some sensitive home folders by default; some can be allowed with `sandbox.filesystem.allowWrite` in user or managed settings","T","change",3,"cli,admin",1,[],"sandbox"],[301,"Bash sandbox が、コマンド後にリポジトリの `.git` 内の想定外エントリを退避する","Changed the Bash sandbox to set aside unexpected entries in a repository's `.git` folder after a command","T","change",2,"cli",0,[],"sandbox"],[302,"Linux・WSL の Bash sandbox が、不足する `--add-dir` フォルダを各コマンド前に作成するため、それを作るコマンドは失敗・スキップ等になりうる","Changed the Bash sandbox on Linux and WSL to create some missing `--add-dir` folders before each sandboxed command, so commands that create them can fail, skip, or land inside them","T","change",2,"cli",1,[],"sandbox"],[303,"権限 hook や SDK ホストが承認時に書き換えたコマンドは、元がサンドボックス扱いなら sandbox 内に留まる。承認側は `dangerouslyDisableSandbox: true` を追加可能","Changed commands that a permission hook or SDK host rewrites while approving to stay in the sandbox if the original was checked as sandboxed; the approver can add `dangerouslyDisableSandbox: true`","T","change",2,"sdk,mod-dev",1,[],"sandbox"],[304,"`claude mcp serve` が `sandbox.excludedCommands` を無視する","Changed `claude mcp serve` to ignore `sandbox.excludedCommands`","T","change",1,"cli",1,[],"mcp"],[305,"サンドボックス有効時、macOS・Linux・WSL の `/rewind` は一部ファイルに触れず、スキップとして報告する","Changed `/rewind` on macOS, Linux and WSL to leave some files untouched and report them as skipped when the sandbox is on","S","change",2,"cli",0,[],"sessions-resume"],[306,"auto-allow がオフのとき、環境変数を設定する一部の行の前に Bash sandbox が確認する。無人実行では拒否されうる","Changed the Bash sandbox to ask before some lines that set environment variables when auto-allow is off; unattended runs can refuse them","T","change",2,"cli,sdk",1,[],"sandbox"],[307,"Claude のファイルツールが `.credentials.json` など Claude Code のサインインファイルへの書き込みを拒否する","Changed Claude's file tools to refuse writes to Claude Code's sign-in files, such as `.credentials.json`","T","change",2,"cli",0,[],"read-edit-tools"],[308,"Claude Code のサインインファイルに届くコマンドを、Bash の権限チェックがより多く事前確認する","Changed the Bash permission check to ask before more commands reach Claude Code's sign-in files","T","change",2,"cli",0,[],"permissions"],[309,"一部のファイルツールがデバイスファイルやプロセスファイルの一部を拒否する","Changed some file tools to refuse some device and process files","T","change",2,"cli",0,[],"read-edit-tools"],[310,"一部の `cp` と `mv` コマンドが先に確認を求める","Changed some `cp` and `mv` commands to ask first","T","change",2,"cli",0,[],"bash-tool"],[311,"bypass permissions モードでも、一部のツール呼び出しが承認確認になり、確認できない環境では拒否される","Changed some tool calls in bypass permissions mode to ask for approval, or be denied where no one can be asked","T","change",3,"cli,sdk",1,[],"permissions"],[312,"検査しきれない非常に長い値を含む Bash コマンドは確認になり、deny ルールが当たりうる場合や回答者がいない場合は拒否される","Changed the Bash permission check to ask about some commands with very long values it can't finish checking, or to refuse them where a deny rule may apply or no one can answer","T","change",2,"cli,sdk",0,[],"permissions"],[313,"worktree 隔離のサブエージェントは、チェックアウトと共有するブランチを書き換えうる一部の git コマンドを Bash で拒否する。セッション本体は対象外","Changed subagents isolated in a worktree to refuse, in any repository, some git commands in Bash that can rewrite branches shared with your checkout; sessions are not affected","A","change",2,"cli",1,[],"subagents"],[314,"`ExitWorktree` は、バックグラウンドのサブエージェントやシェルが動いている可能性がある worktree の削除を、`discard_changes` なしでは拒否する","Changed `ExitWorktree` to refuse removing a worktree while a background subagent or shell command may still be running in it, unless Claude passes `discard_changes`","A","change",2,"cli",1,[],"worktrees"],[315,"computer use の macOS 権限パネルが j・k を無視する。矢印キーと Ctrl+P/Ctrl+N は引き続き使える","Changed the computer use macOS permissions panel to ignore j and k; the arrow keys and Ctrl+P/Ctrl+N still move the selection","U","change",1,"cli,macos",1,[],"computer-use"],[316,"PowerShell ツールが、さらに一部のコマンドで確認する。無人実行は allow ルール・auto mode・bypass がなければ拒否","Changed the PowerShell tool to ask before some more commands; unattended runs refuse them unless an allow rule, auto mode or bypass permissions mode allows them","T","change",2,"cli,sdk,windows",1,[],"powershell-tool"],[317,"PowerShell ツールが、bypass permissions モードでもさらに一部のコマンドで確認し、一部は拒否する","Changed the PowerShell tool to ask about some more commands, even in bypass permissions mode, and to refuse some of them","T","change",2,"cli,windows",1,[],"powershell-tool"],[318,"不正な形式の一部の PowerShell コマンドが拒否される","Changed some malformed PowerShell commands to be denied","T","change",1,"cli,windows",0,[],"powershell-tool"],[319,"組み込みコマンド名の関数を定義する一部の PowerShell コマンドが拒否され、Claude が名前を変えられる","Changed some PowerShell tool commands that define a function named like a built-in command to be refused, so Claude can rename it","T","change",1,"cli,windows",0,[],"powershell-tool"],[320,"auto mode が、プログラム名なしや `$HOME` 始まりなど一部のワイルドカード許可ルールを無視し、安全性チェックが判断する","Changed auto mode to ignore some wildcard shell allow rules, such as ones that name no program or that start with `$HOME`, so the safety check decides those commands","T","change",2,"cli,admin",1,[],"auto-mode"],[321,"auto mode が、Windows のバックスラッシュパスを持つワイルドカード許可ルールを判定対象にし、ブロックされうる。完全一致ルールは許可のまま","Changed auto mode to judge wildcard allow rules whose program is a Windows backslash path, so those calls can be blocked; exact rules keep their allow; we plan to restore rules that start with `.\\`","T","change",2,"cli,windows",1,[],"auto-mode"],[322,"管理側 `autoMode.environment` が `\"$defaults\"` なしだと、Desktop と Agent SDK アプリでも組み込み項目を全置換する","Changed a managed `autoMode.environment` list without `\"$defaults\"` to replace every built-in entry in Claude Desktop and Agent SDK apps too; add `\"$defaults\"` or copy the sensitive-target ones","T","change",2,"admin,sdk,ide",1,[],"auto-mode"],[323,"ローカル端末の `--add-dir` と `/add-dir` が、未信頼フォルダで信頼プロンプトを出す。`claude --bg` は拒否","Changed `--add-dir` and `/add-dir` in local terminal sessions to show the trust prompt for a folder you have not trusted yet; `claude --bg` refuses such a folder","T","change",2,"cli",1,[],"permissions"],[324,"`--trust-workspace false` の self-hosted runner が、より多くのリポジトリ設定を無視する。ユーザーまたは管理設定で指定する","Changed self-hosted runners under `--trust-workspace false` to ignore more repository settings; set such values in user or managed settings","H","change",2,"admin,cloud",1,[],"self-hosted-runner"],[325,"Remote Control と self-hosted runner での権限回答の「常に許可」の保存方法が変わる","Changed how permission answers over Remote Control and on self-hosted runners save \"always allow\" choices","I","change",1,"cloud",0,[],"remote-control"],[326,"`plugin.json` の表示フィールドが不正で拒否されていた有効プラグインが、hooks・MCP サーバーごと読み込まれる","Changed enabled plugins that were refused for a malformed `plugin.json` display field: they now load, with their hooks and MCP servers; administrators should check the plugins they deploy","M","change",2,"mod-dev,admin",1,[],"plugins-mods"],[327,"`allowedHttpHookUrls` と `httpHookAllowedEnvVars` の、管理設定由来 hook への適用方法が変わる","Changed how `allowedHttpHookUrls` and `httpHookAllowedEnvVars` apply to hooks from managed settings","M","change",2,"admin,mod-dev",1,[],"hooks"],[328,"HTTP hook の `headers` 内の `Content-Length` と `Transfer-Encoding` を無視し、長さは本文から決まる","Changed HTTP hooks to ignore `Content-Length` and `Transfer-Encoding` in their `headers` setting; the request's length comes from its body","M","change",1,"mod-dev",1,[],"hooks"],[329,"プラグイン削除時、MCP バンドル（`.mcpb`・`.dxt`）の展開ファイルも削除する。他プラグインが同じバンドルを使う場合を除く","Changed plugin uninstall to also delete the files extracted from the plugin's MCP bundles (`.mcpb`, `.dxt`), unless another plugin uses the same bundle","M","change",1,"mod-dev",0,[],"plugins-mods"],[330,"一部の worktree セッションが一部のプラグイン設定をスキップし、通知で対象を示す","Changed some worktree sessions to skip some plugin settings; a notice names what was skipped","M","change",1,"mod-dev",0,[],"plugins-mods"],[331,"`/plugin` の削除・除去・切替の質問が矢印キーと Enter（Esc で中止）の選択式になり、`y`・`n`・`u` は使えない","Changed `/plugin` uninstall, remove and switch questions to lists answered with the arrow keys and Enter, or Esc to cancel; `y`, `n` and `u` no longer answer them","M","change",1,"cli",1,[],"plugins-mods"],[332,"plan mode の自動圧縮が、`opusplan` なら Opus など応答中のモデルを使うため、コストが増えうる","Changed automatic compaction in plan mode to use the model answering you, such as Opus with `opusplan`, so it can cost more","S","change",2,"cli",0,[],"compaction-context"],[333,"Cowork クラウドセッションが組織の OpenTelemetry 出力を最初のターンまで保留し、`claude_code.session.count` が減りうる","Changed Cowork cloud sessions to hold an organization's OpenTelemetry export until the first turn; a session that gets no message now sends nothing, so `claude_code.session.count` can fall","I","change",1,"cloud,admin",0,[],"telemetry"],[334,"API キーや認証トークンなどを使うセッションでは、保存済み claude.ai ログインがあっても別マシンのセッションへのメッセージを拒否する","Changed Claude's messages to a session on another machine to be refused when your session uses an API key, auth token, profile or workload identity beside a saved claude.ai login","I","change",2,"cloud",1,[],"remote-control"],[335,"未承認 API キーの `--bare` セッションはバックグラウンド移行が多くの環境で拒否され、サービスにキーがないと `claude --bare --bg` はエラー終了する","Changed `--bare` sessions on an unapproved API key: moving one to the background is now refused in most setups, and `claude --bare --bg` exits with an error if the background service lacks the key","H","change",2,"sdk",1,[],"background-tasks"],[336,"「Continue automatically at usage limit」は、待機中にログインが変わる・終了すると、何も送らず通知して停止する","Changed \"Continue automatically at usage limit\" to stop with a notice, sending nothing, when your login changes or ends during the wait","L","change",1,"cli",0,[],"usage-limits"],[337,"Remote Control がプロキシ経由で CONNECT トンネルを使い、CONNECT を拒否するプロキシではエラーで停止する","Remote Control: Changed how it connects through a proxy: requests now use a CONNECT tunnel, so a proxy that refuses CONNECT stops Remote Control with an error","I","change",2,"cloud",1,[],"remote-control"],[338,"Remote Control の `--verbose` セッションデバッグログが `~/.claude/child-logs/` に出力される","Remote Control: Changed the session debug logs written under `--verbose` to go to `~/.claude/child-logs/`","I","change",1,"cloud",0,[],"remote-control"],[339,"self-hosted runner の Linux・macOS で `gh` がない場合、Anthropic 経由の組み込み `gh api` が既定で使われる。`--use-anthropic-gh false` で無効化","Self-hosted runner: Changed Linux and macOS sessions with no `gh` to get a built-in `gh api` by default, via Anthropic, which adds their GitHub sign-in, if any; `--use-anthropic-gh false` turns it off","H","change",2,"sdk,cloud",1,[],"self-hosted-runner"],[340,"agent view で空の会話から `←` を押した後に Ctrl+C 2回・Ctrl+D 2回・`/exit` で終了すると、そのセッションが 5 分残らず終了する","Changed agent view so that quitting with Ctrl+C twice, Ctrl+D twice or `/exit` after pressing `←` in an empty conversation ends that session, instead of leaving it running for 5 minutes","A","change",1,"cli",0,[],"agent-view"],[341,"`--await-initialize` を `--bg` や `--worktree --tmux` と併用するとエラーで拒否される","Changed `--await-initialize` to be refused with `--bg` or `--worktree --tmux`, which never read the initialize request, instead of starting without the fields it carries","H","change",1,"sdk",1,[],"headless-ci"],[342,"worktree 作成・`/teleport`・IDE チェックアウトが、より厳格な `PATH` で git を実行する。git のフィルターやヘルパーはフルパスが必要な場合あり","Changed worktree creation, `/teleport` and IDE checkouts to run git with a stricter `PATH`; a git filter or helper may need its full path","O","change",1,"cli,ide",1,[],"git-integration"],[343,"サブエージェントの計画承認カードが、「Yes, and switch to default (ask each time) for this session」と「No」の二択になる","Changed the card for approving a subagent's plan to two choices, \"Yes, and switch to default (ask each time) for this session\" and \"No\", chosen with the arrow keys and Enter (typed text moves to No)","A","change",2,"cli",0,[],"subagents"],[344,"`/claude-api` スキルが、自前でエージェントループを持たない限り Managed Agents での構築を既定にする","Changed the `/claude-api` skill to build agents on Managed Agents by default, unless you want to host the agent loop yourself","M","change",1,"cli",0,[],"skills"],[345,"フルスクリーンの `/usage` が、購読者にはセッションコストより先にプラン上限バーを表示する。`/cost` は従来どおりコストから","Changed `/usage` in fullscreen mode to show plan limit bars before session cost for subscribers; `/cost` still starts with cost","U","change",1,"cli",0,[],"slash-commands"],[346,"`claude` サブコマンドが出力する一部メッセージの文言が変わる。JSON 出力は不変","Changed the wording of some messages that `claude` subcommands print; JSON output is unchanged","U","change",1,"cli",0,[],"cli-subcommands"],[347,"初回セットアップで Dark ではなく「Auto (match terminal)」テーマが事前選択される","Changed first-run setup to preselect the \"Auto (match terminal)\" theme instead of Dark mode","U","change",1,"cli",0,[],"theme"],[348,"フルスクリーンの `/cd` は信頼プロンプトが収まらない間「Yes」を拒否し、ウィンドウを高くするよう案内する","Changed fullscreen `/cd` to refuse \"Yes\" while its trust prompt doesn't fit, with a line saying to make the window taller","U","change",1,"cli",0,[],"slash-commands"],[349,"フルスクリーンでの tmux の `set -g mouse on` 案内を削除。ホイールは設定なしでスクロールする","Removed the tmux notice that said the mouse wheel needs `set -g mouse on` in fullscreen; the wheel scrolls without it","U","change",1,"cli",0,[],"fullscreen-mode"],[350,"実行 30 分後に `/clear` を勧めるスピナーのヒントを削除","Removed the spinner tip that suggested `/clear` 30 minutes into a running turn","U","change",1,"cli",0,[],"output-rendering"],[351,"`claudeCode.promptSuggestions` 設定でプロンプト提案をオフにできる","[VSCode] Added a `claudeCode.promptSuggestions` setting that turns prompt suggestions off","I","new",2,"ide",0,[],"vscode"],[352,"フォークした会話の「Rewind code to here」が 1 ターン余分に戻して、そのターンで作ったファイルを消すことがなくなる","[VSCode] Fixed \"Rewind code to here\" in a forked conversation sometimes undoing one turn too many and deleting files created in that turn","I","fix",2,"ide",0,[],"vscode"],[353,"サンドボックスがオフのとき、Sandbox ダイアログがホームや `.git` に空のファイル・フォルダを作らない","[VSCode] Fixed the Sandbox dialog creating empty files and folders in the home directory and the project's `.git` folder while the sandbox is off","I","fix",2,"ide",0,[],"vscode"],[354,"一部のネットワークで保存済みサインインが失われなくなる","[VSCode] Fixed the saved sign-in being lost on some networks","I","fix",2,"ide",0,[],"vscode"],[355,"認証コードや URL などを貼り付けてもサインインが終わらず、パネルが貼るべきものを案内する","[VSCode] Fixed sign-in ending when a verification code, a web address or a code from another sign-in attempt is pasted; the panel now says what to paste instead","I","fix",2,"ide",0,[],"vscode"],[356,"API キーなしで Console にサインイン中、パネルやウィンドウを開くたびにサインイン画面が一瞬出ない","[VSCode] Fixed the sign-in screen showing briefly each time a panel or window opened while signed in to Console without an API key","I","fix",1,"ide",0,[],"vscode"],[357,"再サインイン後も、使用上限バナーの「Request more」が押すたびに戻らず、Team・Enterprise メンバーが正しく送信できる","[VSCode] Fixed the usage-limit banner's \"Request more\" button for Team and Enterprise members coming back after each press without sending anything, after you signed in again during a session","I","fix",1,"ide",0,[],"vscode"],[358,"2 つ目のセッションで `/ide` を使うと最新の接続が優先され、押し出された側は切替方法を表示する","[VSCode] Fixed `/ide` in a second Claude Code session silently losing the editor connection back to the first session; the newest connection now wins and the displaced session shows how to switch back","I","fix",2,"ide",0,[],"vscode"],[359,"メモリフォルダにシンボリックリンクのループや名前付きパイプがあっても、Memory ダイアログの一覧・RAM 使用・ハングが正常になる","[VSCode] Fixed saved memories not being listed in the Memory dialog, or RAM use growing without end, when the memory folder held symlink loops, and a hang when it held a named pipe","I","fix",1,"ide",0,[],"vscode"],[360,"実行中コマンドのライブ出力が、読み取り失敗 1 回で止まらなくなる","[VSCode] Fixed a running command's live output stopping after one failed read","I","fix",1,"ide",0,[],"vscode"],[361,"「Open in Terminal」で `claude` を起動できないとき、bash・zsh・fish・Git Bash では理由とインストールガイドへのリンクを表示する","[VSCode] Fixed \"Open in Terminal\" showing only the shell's error when `claude` could not be started: in bash, zsh, fish and Git Bash, a notice now explains why and links to the install guide","I","fix",1,"ide",0,[],"vscode"],[362,"Claude がアーティファクトを公開した後、パネルに「Open artifact」リンクが表示される","[VSCode] Fixed the panel showing no \"Open artifact\" link after Claude publishes an artifact","I","fix",1,"ide",0,[],"vscode"],[363,"チャットパネルが非フォーカスのとき、プロンプト提案が「attach selected text」ヒントを隠さない","[VSCode] Fixed the prompt suggestion hiding the \"attach selected text\" hint while the chat panel is unfocused","I","fix",1,"ide",0,[],"vscode"],[364,"ハイコントラストテーマで枠線のないボタンと、Light High Contrast のサインイン画面の暗いウェルカムアートが直る","[VSCode] Fixed buttons with no visible border in the high-contrast themes, and the dark welcome art on the sign-in screen in Light High Contrast","I","fix",1,"ide",0,[],"vscode"],[365,"エディタが未オープンファイルの問題を報告していない場合、Edit と Write が新しい問題を待たず高速化する","[VSCode] Improved Edit and Write speed: no wait for new problems on files that are not open in a tab when the editor has been reporting none for such files","I","improve",1,"ide",0,[],"vscode"],[366,"チャット内の実行中コマンドのライブ出力が、コマンドカードの OUT 行と同じ見た目になる","[VSCode] Changed a running command's live output in the chat to look like the command card's OUT row","I","change",1,"ide",0,[],"vscode"],[367,"イベントリスナー・ビュー・アクティベーションでの拡張エラーの文言が、エディタ自身のエラーテレメトリに入らない形になる","[VSCode] Changed the text of extension errors in event listeners, views and activation to stay out of the editor's own error telemetry","I","change",1,"ide",0,[],"vscode"]]},{"v":"2.1.325","date":"2026-11-14（土）05:07","dshort":"11-14 05:07","nb":13,"head":"サンドボックス既定の変更と権限チェック修正が中心","sum":"このリリースは権限・サンドボックスまわりのセキュリティ修正と既定値変更が中心で、Bash の allow ルールやサンドボックス運用に依存する人に影響する。あわせて MCP タスク、認証、Windows の `/resume`、VS Code 拡張の改善と不具合修正が多数含まれる。","watch":[{"b":"サンドボックス内 Bash の自動許可が既定でなくなったため、無確認実行を続けたい場合は `sandbox.autoAllowBashIfSandboxed: true` を設定する（managed settings では最上位の managed source に設定）。","r":[96,97]},{"b":"信頼していないリポジトリでは読み取り専用 git コマンドも先に確認されるため、確認なしで実行したい場合は `additionalDirectories` 設定ではなく `--add-dir` で指定する。","r":[98]},{"b":"スケジュールタスクと `/loop` は `allowed-tools` や hooks を宣言したスキルの実行前に確認を求めるため、無人実行するなら `permissions.allow` に `Skill(name)` を追加する。","r":[99]},{"b":"Desktop・IDE・SDK の「Always allow」はルール単独の保存が限定的になり、それに頼るスケジュールタスクが待機しうるため、必要なら権限設定を見直す。","r":[100]},{"b":"追加ディレクトリの `.claude` 設定・スキル・エージェント・コマンド・hooks へのサンドボックス書き込みが拒否されるため、これらをサンドボックス内から更新する運用は見直す。","r":[101]},{"b":"`marketplace` の `ref` にコミット ID を指定すると、このバージョンより前のクライアントでは clone できず読み込めなくなるため、クライアントを更新してから使う。","r":[121]},{"b":"`ALL_PROXY` のみ設定した環境では CONNECT トンネルを使うようになり、CONNECT を拒否するプロキシではプラグインのダウンロードが失敗するため、プロキシ設定を確認する。","r":[122]},{"b":"`claude remote-control` が自動停止時に終了コード 4、登録失敗時に 69 を返すようになったため、サービスマネージャーの再起動条件を確認する。","r":[93]},{"b":"`--plugin-dir` プラグインの `.claude/skills` は上位ディレクトリで起動したセッションから読み込まれなくなるため、プラグインのフォルダで Claude Code を起動する。","r":[106]},{"b":"マネージド設定の `pluginDigests` は非推奨となり無視されるため、`prependPlugins` / `appendPlugins` による宣言に移行する。","r":[104]}],"hl":[{"t":"サンドボックス内 Bash が確認制に","b":"サンドボックス内の Bash コマンドは、既定で通常の権限フローに従うようになりました。これまでどおり確認なしで実行するには `sandbox.autoAllowBashIfSandboxed: true` を設定します。","r":[96,97]},{"t":"権限ルールの適用漏れを修正","b":"一部の Bash コマンドや複合コマンドに deny・ask ルールが効かない問題と、allow ルールが名指ししたものと別のプログラムを実行しうる問題を直しました。相対パスのルールや、`mcp__plugin_*_` で始まるルールの照合漏れも解消しています。","r":[64,65,68,69,70]},{"t":"サンドボックスの書込保護を強化","b":"Bash サンドボックスが、worktree の設定と hooks、linked worktree の共有 git フォルダ、ネイティブ更新ツールのダウンロード先を保護するようになりました。追加ディレクトリの `.claude` 配下への書き込みも拒否します。","r":[4,76,77,78,101]},{"t":"組織外公開 Artifact の確認","b":"組織外の人が見られる Artifact について、公開・変更・アップロードの前の確認が抜ける場合がありました。この版で、その確認が抜けないようにしました。一部のクラウドセッションでは、Artifact ツールの deny・ask ルールと hook も適用されるようになりました。","r":[56,72,73,74]},{"t":"バックグラウンドの認証修正","b":"claude.ai ログインで始めたバックグラウンドセッションが、起動元シェルの API キーやトークンを使って課金されていた問題を直しました。別のサインインへの移行は拒否され、何なら使えるかがメッセージで示されます。","r":[33,34,35,94]}],"groups":[{"a":"T","name":"ツール・権限・サンドボックス","dg":"権限ルールと Bash の判定、サンドボックス保護、アーティファクトの公開確認に関する修正が中心。worktree 分離では `git bisect run` などが拒否されるようになった。","refs":[4,5,10,11,38,55,56,58,62,64,65,66,67,68,69,70,72,73,74,76,77,78,83,87,96,97,98,100,101,102,114]},{"a":"A","name":"エージェント・サブエージェント・チーム","dg":"サブエージェントのモデル扱いや出力上限での再回答を改善し、バックグラウンドセッションが意図しない API キーやサインインを使う問題を修正した。","refs":[6,7,14,33,34,35,43,85,94,108]},{"a":"M","name":"mods・plugins・hooks・skills","dg":"プラグインとマーケットプレイスの読み込み安全性や表示を見直し、`.mcpb`・`.dxt` の展開先や `ref` の扱いを変更した。","refs":[25,41,42,57,75,88,89,95,99,103,104,105,106,107,121]},{"a":"S","name":"セッション・履歴・圧縮","dg":"再開したセッションで直近のターンが失われる問題や、Windows の `/resume` でドライブ文字の大文字小文字が原因で拒否される問題などを修正した。`/feedback` と `/bug` のアップロード範囲も絞られた。","refs":[9,59,63,81,82]},{"a":"C","name":"MCP・連携・ブラウザ","dg":"MCP の認証・再接続・バックグラウンドタスクの質問まわりの不具合を多数修正した。タスクの質問では Esc が「後で回答」になった。","refs":[44,45,46,47,48,49,50,51,52,71,92,110,138]},{"a":"I","name":"IDE・デスクトップ・クラウド","dg":"VS Code 拡張にプロンプト提案、キーなしの Console サインイン、リダイレクト URL の貼り付け欄が追加された。Remote Control の `/resume` と `/teleport` の挙動や、クラウド・セルフホスト接続の設定要求も変更された。","refs":[22,23,61,79,84,90,93,116,117,118,126,127,128,129,130,131,132,133,134,135,136,137,139]},{"a":"H","name":"headless・SDK・API","dg":"zstd デコードや Bedrock のトークン計数が `allowedProviders` を回避する問題など、セキュリティとプロバイダ制限の修正が中心。`claude -p` の初回起動や `/login` の権限確認も変わった。","refs":[1,26,36,37,39,54,60,86,112,119,123,124]},{"a":"L","name":"モデル・推論・コンテキスト","dg":"サードパーティゲートウェイの context length エラーと `sonnet[1m]` の書き換えを修正した。`CLAUDE_CODE_MAX_CONTEXT_TOKENS` の適用範囲とコスト集計の対象も広がった。","refs":[8,12,28,29,111,113,120]},{"a":"U","name":"UI・表示・入力","dg":"表示の乱れ、`/stats`、`/insights`、`/voice` のメッセージなどの修正と、エラー文言の改善が中心。プロンプト提案はバックグラウンド起点が続くと更新頻度が下がる。","refs":[2,3,13,15,16,17,18,19,20,21,24,40,91,109,125]},{"a":"O","name":"インストール・OS・ネットワーク","dg":"認証ロックファイルの残留や `/login` の誤上書きなど、サインイン周りの修正が中心。sparse clone と、プロキシ・mTLS の環境変数の扱いも変わった。","refs":[27,30,31,32,53,80,115,122]}],"skip":"表示の乱れ、メッセージ文言、まれな環境での不具合などの細かな修正が約 50 件含まれる。","st":"ok","stale":false,"e":[[1,"zstd 圧縮レスポンスのデコードにあったセキュリティ問題を解消","Fixed a security issue in how zstd-compressed responses are decoded","H","fix",3,"cli,sdk",0,[],"proxy-network"],[2,"VS Code 等の統合ターミナルで、Jupyter notebook を読み書きした後にセル再実行のヒントを一度表示","Added a spinner tip in VS Code and similar integrated terminals about re-running a notebook cell, shown once Claude has read or edited a Jupyter notebook","U","new",1,"cli,ide",0,[],"prompt-input"],[3,"組織ポリシーで拒否されたエラーの下に、`/rewind` でメッセージ変更か `/clear` という続行方法を表示","Added a line under the error shown when your organization's policy blocks a request, saying how to continue: run `/rewind` and change the message, or run `/clear`","U","improve",1,"cli,admin",0,[],"managed-settings"],[4,"サンドボックス内の `git checkout`・`git stash`・autostash pull が `.claude` 等の保護ファイルを更新できないとき Claude に通知","Added a note for Claude when a sandboxed `git checkout`, `git stash` or autostash pull cannot update protected files such as those in `.claude`","T","improve",1,"cli",0,[],"sandbox"],[5,"bare リポジトリの worktree、`--separate-git-dir`、Android `repo` で `/security-review` とスキルの inline git が動く","Fixed `/security-review` and skills' inline git commands stopping with an error in worktrees of bare repositories, `--separate-git-dir` checkouts and Android `repo` checkouts","T","fix",2,"cli",0,[],"slash-commands"],[6,"独自モデルのサブエージェントが、`opusplan` や `haiku` 設定時に plan モード用モデルへ切り替わらない","Fixed subagents with their own model being moved to the plan-mode model when the model setting is `opusplan` or `haiku`","A","fix",2,"cli",0,[],"subagents"],[7,"別モデルのサブエージェントが、ファイル読み取りと MCP 結果のサイズを自身のモデルで判断する","Fixed subagents on a different model sizing file reads and MCP results with the main session's model","A","fix",2,"cli",0,[],"subagents"],[8,"多くのサードパーティ gateway と Foundry で、毎ターンのコンテキスト長エラーではなく圧縮される","Fixed sessions on many third-party gateways and Foundry stopping with a context length error on every turn instead of compacting","L","fix",3,"cli,sdk",0,[],"compaction-context"],[9,"正常終了せず停止した後に再開しても、直近のターンが失われない","Fixed recent turns sometimes going missing from a resumed session after Claude Code stopped without a clean exit","S","fix",2,"cli",0,[],"sessions-resume"],[10,"作業ディレクトリ削除後、シェルコマンドは起動ディレクトリで走らず、メッセージ付きで失敗し再実行できる","Fixed shell commands running in the launch directory after the working directory was deleted; the command now fails with a message and can be re-issued","T","fix",2,"cli",0,[],"bash-tool"],[11,"`plansDirectory` に保存できなくても承認済みプラン編集が失われず、既定フォルダに保存して理由を警告","Fixed an approved plan edit being lost when the `plansDirectory` folder can't take it: the plan is now saved in the default plans folder, and a warning says where and why","T","fix",2,"cli",0,[],"plan-mode"],[12,"保存済み `sonnet[1m]` 設定が新規インストール時に API が拒否するモデル ID へ書き換わらない","Fixed a saved `sonnet[1m]` model setting being rewritten on a new install to a model id the API rejects","L","fix",2,"cli",0,[],"model-selection"],[13,"スケジュールタスクが後から返信しても、focus view がプロンプトへの返信を隠さない","Fixed focus view hiding the reply to your prompt when a scheduled task replied after it","U","fix",1,"cli",0,[],"output-rendering"],[14,"fullscreen オフ時でも、バックグラウンドサブエージェントの表示にプロンプトが出る","Fixed the prompt sometimes missing from a background subagent's view when fullscreen is off","A","fix",1,"cli",0,[],"background-tasks"],[15,"一覧や権限プロンプトの長い選択肢が折り返しで上書きされず、狭い端末の初回画面も行が欠けない","Fixed long options in lists and permission prompts being partly overwritten when they wrap, and first-run screens losing lines on narrow terminals","U","fix",1,"cli",0,[],"output-rendering"],[16,"権限ルールの起動時警告と MCP 認証必要の通知が、スクロールで見えない間に既読扱いにならない","Fixed startup warnings about permission rules and the \"N MCP servers need authentication\" notice being recorded as seen when they were scrolled out of view","U","fix",1,"cli",0,[],"output-rendering"],[17,"エージェント名や作業フォルダに制御文字や改行があっても、ウェルカムヘッダーが崩れない","Fixed the welcome header showing control characters or splitting across lines when an agent's name or the working folder contains them or a line break","U","fix",1,"cli",0,[],"output-rendering"],[18,"ユーザーしか実行できないコマンドを Claude が試すと、赤エラーでなく「入力時のみ実行」という淡色の行を表示","Fixed the red error shown when Claude tries a command only you can run: a dim line now says it runs only when you type it at the prompt","U","fix",1,"cli",0,[],"slash-commands"],[19,"`/stats` の Active days 合計が 1 日多く表示されない","Fixed `/stats` showing an Active days total that was one day too high","U","fix",1,"cli",0,[],"slash-commands"],[20,"`/insights` は対象セッションが無ければ完成と言わず、HTML レポートの 2 値もエスケープする","Fixed `/
